<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><title>PMart RAG — UML 상태 머신 다이어그램</title><defs><marker id="filled" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#374151" stroke-width="1.5"/></marker></defs><rect width="1400" height="700" fill="#fff"/><text x="30.0" y="40.0" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="start">상태 머신 다이어그램 (State Machine) — Ollama 안의 모델 하나(실행기)</text><text x="30.0" y="64.0" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">OLLAMA_MAX_LOADED_MODELS=2 · NUM_PARALLEL=1 · KEEP_ALIVE=24h · rag-warm · 모델 2개(qwen3:4b, qwen3-embedding:0.6b)</text><rect x="20.0" y="82.0" width="1360.0" height="600.0" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.2"/><path d="M20,82 h90.60000000000001 v14 l-10,10 h-80.60000000000001 z" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="28.0" y="99.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">stm 모델 적재</text><circle cx="90" cy="300" r="10" fill="#374151"/><rect x="160.0" y="260.0" width="210.0" height="80.0" rx="16" fill="#eef4ff" stroke="#374151" stroke-width="1.4"/><text x="265.0" y="284.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">미적재</text><polyline points="160.0,294.0 370.0,294.0" fill="none" stroke="#9ca3af" stroke-width="1"/><text x="172.0" y="314.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="Consolas,'D2Coding',monospace">실행기 없음</text><rect x="520.0" y="140.0" width="250.0" height="100.0" rx="16" fill="#eef4ff" stroke="#374151" stroke-width="1.4"/><text x="645.0" y="164.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">적재 중</text><polyline points="520.0,174.0 770.0,174.0" fill="none" stroke="#9ca3af" stroke-width="1"/><text x="532.0" y="194.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="Consolas,'D2Coding',monospace">entry / llama-server 기동</text><text x="532.0" y="212.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="Consolas,'D2Coding',monospace">GGUF 읽기 · ~30초(qwen3:4b)</text><rect x="500.0" y="330.0" width="820.0" height="290.0" rx="18" fill="#f8fafc" stroke="#374151" stroke-width="1.6"/><text x="520.0" y="356.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">적재됨</text><text x="590.0" y="356.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">keep_alive 24h 타이머</text><circle cx="560" cy="420" r="8" fill="#374151"/><rect x="610.0" y="385.0" width="220.0" height="80.0" rx="16" fill="#eef4ff" stroke="#374151" stroke-width="1.4"/><text x="720.0" y="409.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">유휴</text><polyline points="610.0,419.0 830.0,419.0" fill="none" stroke="#9ca3af" stroke-width="1"/><text x="622.0" y="439.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="Consolas,'D2Coding',monospace">요청 없음 · 타이머 진행</text><rect x="1010.0" y="385.0" width="260.0" height="110.0" rx="16" fill="#eef4ff" stroke="#374151" stroke-width="1.4"/><text x="1140.0" y="409.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">처리 중</text><polyline points="1010.0,419.0 1270.0,419.0" fill="none" stroke="#9ca3af" stroke-width="1"/><text x="1022.0" y="439.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="Consolas,'D2Coding',monospace">do / 토큰화 → 추론</text><text x="1022.0" y="457.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="Consolas,'D2Coding',monospace">다른 요청은 대기열</text><text x="1022.0" y="475.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="Consolas,'D2Coding',monospace">(NUM_PARALLEL=1)</text><polyline points="568.0,420.0 610.0,420.0" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#open)"/><polyline points="830.0,405.0 1010.0,405.0" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#open)"/><rect x="860.0" y="386.5" width="120.0" height="16.5" rx="0" fill="#fff" stroke="none" stroke-width="0"/><text x="920.0" y="398.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">요청 도착 / 대기열에서 하나</text><polyline points="1010.0,470.0 830.0,450.0" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#open)"/><rect x="853.0" y="466.5" width="134.0" height="16.5" rx="0" fill="#fff" stroke="none" stroke-width="0"/><text x="920.0" y="478.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">응답 완료 / 타이머 다시 24h</text><rect x="160.0" y="520.0" width="230.0" height="90.0" rx="16" fill="#eef4ff" stroke="#374151" stroke-width="1.4"/><text x="275.0" y="544.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">내려가는 중</text><polyline points="160.0,554.0 390.0,554.0" fill="none" stroke="#9ca3af" stroke-width="1"/><text x="172.0" y="574.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start" font-family="Consolas,'D2Coding',monospace">exit / 메모리·GPU 반환</text><polyline points="100.0,300.0 160.0,300.0" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#open)"/><polyline points="370.0,280.0 450.0,280.0 450.0,190.0 520.0,190.0" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#open)"/><rect x="305.0" y="158.5" width="190.0" height="16.5" rx="0" fill="#fff" stroke="none" stroke-width="0"/><text x="400.0" y="170.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">요청 도착 [실행기 없음] 또는 rag-warm</text><polyline points="645.0,240.0 645.0,330.0" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#open)"/><rect x="678.5" y="278.5" width="43.0" height="16.5" rx="0" fill="#fff" stroke="none" stroke-width="0"/><text x="700.0" y="290.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">적재 성공</text><polyline points="520.0,220.0 300.0,220.0 300.0,260.0" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#open)"/><rect x="208.5" y="200.5" width="183.0" height="16.5" rx="0" fill="#fff" stroke="none" stroke-width="0"/><text x="300.0" y="212.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">적재 실패 / 요청에 오류(→ 서비스 503)</text><polyline points="500.0,560.0 390.0,560.0" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#open)"/><rect x="395.5" y="538.5" width="99.0" height="16.5" rx="0" fill="#fff" stroke="none" stroke-width="0"/><text x="445.0" y="550.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">keep_alive 만료</text><polyline points="500.0,600.0 440.0,600.0 440.0,595.0 390.0,595.0" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#open)"/><rect x="-4.0" y="-11.5" width="8.0" height="16.5" rx="0" fill="#fff" stroke="none" stroke-width="0"/><text x="0.0" y="0.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle"></text><rect x="338.5" y="628.5" width="183.0" height="16.5" rx="0" fill="#fff" stroke="none" stroke-width="0"/><text x="430.0" y="640.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">밀어냄 [다른 모델 요청 · 이미 2개 적재]</text><polyline points="240.0,520.0 240.0,340.0" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#open)"/><rect x="268.5" y="428.5" width="43.0" height="16.5" rx="0" fill="#fff" stroke="none" stroke-width="0"/><text x="290.0" y="440.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">해제 완료</text><path d="M840,520 h448 l12,12 v68 h-460 z M1288,520 v12 h12" fill="#fff9db" stroke="#a16207" stroke-width="1"/><text x="848.0" y="539.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">PC 2: 적재 한도 2개 = 임베딩 + 대화 모델로 꽉 참</text><text x="848.0" y="556.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">→ 제3 모델(예: Gemma 비교)을 부르면 하나가 밀려나고</text><text x="848.0" y="573.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">  다음 질문 때 '적재 중'(~30초)을 다시 지나</text><text x="848.0" y="590.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">  게이트웨이 65초·모델 호출 25초 제한에 걸릴 수 있음</text></svg>