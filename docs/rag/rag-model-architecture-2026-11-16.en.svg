<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 945" width="1160" height="945" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <title>PMart RAG Model Architecture — Corpus · BPE · Embedding Layer · Encoder / Decoder</title>
  <style>
    .bg { fill: #ffffff; }
    .tt { fill: #1f2933; font-size: 22px; font-weight: 700; }
    .th { fill: #1f2933; font-size: 15px; font-weight: 700; }
    .tb { fill: #1f2933; font-size: 13.5px; font-weight: 700; }
    .m  { fill: #52606d; font-size: 11.5px; }
    .ll { fill: #1f2933; font-size: 13px; font-weight: 700; }
    .lb { fill: #eef1f5; stroke: #cbd2d9; }
    .s { fill: #f3ece4; stroke: #9a7b5c; }
    .n { fill: #f5f7fa; stroke: #9aa5b1; stroke-dasharray: 5 4; }
    .k { fill: #f6f1df; stroke: #a8902f; }
    .p { fill: #efe7fa; stroke: #8a63c0; }
    .g { fill: #e3f3e8; stroke: #4c9a68; }
    .o { fill: #fcefdc; stroke: #c58a32; }
    .r { fill: #fde8e8; stroke: #c25454; }
    .hg { fill: #4c9a68; stroke: #4c9a68; }
    .ho { fill: #c58a32; stroke: #c58a32; }
    .hw { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .hm { fill: #ffffff; font-size: 11.5px; fill-opacity: 0.92; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181d; }
      .tt, .th, .tb, .ll { fill: #e6e9ee; }
      .m { fill: #a9b4c0; }
      .lb { fill: #1f262e; stroke: #3e4c59; }
      .s { fill: #33291f; stroke: #c4a07c; }
      .n { fill: #181d23; stroke: #616e7c; }
      .k { fill: #34301a; stroke: #cdb44f; }
      .p { fill: #2e2442; stroke: #ab8ae0; }
      .g { fill: #1b3527; stroke: #6cc08c; }
      .o { fill: #3a2c17; stroke: #e0a85a; }
      .r { fill: #3d1f1f; stroke: #e07a7a; }
      .hg { fill: #2f6b47; stroke: #6cc08c; }
      .ho { fill: #8a5d1c; stroke: #e0a85a; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1160" height="945"/>
  <text class="tt" x="20" y="40" text-anchor="start">PMart RAG Model Architecture — Corpus · BPE · Embedding Layer · Encoder / Decoder</text>
  <text class="m" x="20" y="64" text-anchor="start">Two Qwen3 decoder-only Transformers: one in the encoder role (retrieval vectors), one in the decoder role (answers) · run as Ollama GGUF · no PMart training or fine-tuning</text>
  <rect class="lb" x="20" y="84" width="150" height="131" rx="8"/>
  <text class="ll" x="95" y="145.5" text-anchor="middle">Corpus</text>
  <text class="ll" x="95" y="163.5" text-anchor="middle">retrieval</text>
  <rect class="s" x="186" y="84" width="471" height="131" rx="9"/>
  <text class="tb" x="421.5" y="108" text-anchor="middle">Operator corpus — 52 documents · 1,677 chunks</text>
  <text class="m" x="421.5" y="128" text-anchor="middle">Business specs 8: WMS · SCM · TMS · MFC · BackOffice · OMS · Commerce · Delivery</text>
  <text class="m" x="421.5" y="145" text-anchor="middle">Business-policy ADRs 17: stock · shortage · picking · cancel · review · notifications · PII</text>
  <text class="m" x="421.5" y="162" text-anchor="middle">State contracts 8: order · claim/refund · delivery · MFC · CDC · SCM · TMS · platform</text>
  <text class="m" x="421.5" y="179" text-anchor="middle">Flows 5: cancel/handover · checkout saga · replenishment · returns/refund · staff access</text>
  <text class="m" x="421.5" y="196" text-anchor="middle">CS scripts 11 · overview 3 (overview · domain-map · glossary)</text>
  <rect class="s" x="669" y="84" width="471" height="131" rx="9"/>
  <text class="tb" x="904.5" y="108" text-anchor="middle">Customer corpus — 13 documents · 63 chunks</text>
  <text class="m" x="904.5" y="128" text-anchor="middle">docs/business/customer-faq (user-approved public guidance)</text>
  <text class="m" x="904.5" y="145" text-anchor="middle">Support center · cancel · delivery status · not received · missing/wrong</text>
  <text class="m" x="904.5" y="162" text-anchor="middle">Damage/quality · refund · return/exchange · shortage</text>
  <text class="m" x="904.5" y="179" text-anchor="middle">Address/area · payment/fees · account · alcohol</text>
  <text class="m" x="904.5" y="196" text-anchor="middle">No internal docs (specs · ADRs · CS scripts)</text>
  <rect class="lb" x="20" y="225" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="270" text-anchor="middle">Pre-training corpus</text>
  <rect class="n" x="186" y="225" width="954" height="80" rx="9"/>
  <text class="tb" x="663" y="249" text-anchor="middle">Qwen3 pre-training data (model provider side)</text>
  <text class="m" x="663" y="269" text-anchor="middle">~36 trillion tokens · 119 languages — multilingual incl. Korean, code, math, reasoning</text>
  <text class="m" x="663" y="286" text-anchor="middle">PMart corpus is not used for training — only as the retrieval corpus</text>
  <rect class="lb" x="20" y="315" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="360" text-anchor="middle">Chunking</text>
  <rect class="k" x="186" y="315" width="954" height="80" rx="9"/>
  <text class="tb" x="663" y="339" text-anchor="middle">Structure-aware chunking (MarkdownChunker)</text>
  <text class="m" x="663" y="359" text-anchor="middle">Heading path kept · tables / lists / code blocks whole · one chunk per ADR decision · max 1,500 chars</text>
  <text class="m" x="663" y="376" text-anchor="middle">Chunk = embedding input at indexing · question = embedding input at query (with retrieval instruction)</text>
  <rect class="lb" x="20" y="405" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="441" text-anchor="middle">Tokenizer</text>
  <text class="ll" x="95" y="459" text-anchor="middle">BPE</text>
  <rect class="p" x="186" y="405" width="310" height="80" rx="9"/>
  <text class="tb" x="341" y="429" text-anchor="middle">Byte-level BPE</text>
  <text class="m" x="341" y="449" text-anchor="middle">GPT-2 style (pre-tokenizer qwen2)</text>
  <text class="m" x="341" y="466" text-anchor="middle">UTF-8 bytes → no OOV, Korean included</text>
  <rect class="p" x="508" y="405" width="310" height="80" rx="9"/>
  <text class="tb" x="663" y="429" text-anchor="middle">Vocabulary · merges</text>
  <text class="m" x="663" y="449" text-anchor="middle">151,669 tokens (incl. special)</text>
  <text class="m" x="663" y="466" text-anchor="middle">151,387 BPE merge rules</text>
  <rect class="p" x="830" y="405" width="310" height="80" rx="9"/>
  <text class="tb" x="985" y="429" text-anchor="middle">Special tokens</text>
  <text class="m" x="985" y="449" text-anchor="middle">&lt;|endoftext|&gt; 151643 · &lt;|im_end|&gt; 151645</text>
  <text class="m" x="985" y="466" text-anchor="middle">Embedding model appends EOS</text>
  <rect class="hg" x="186" y="495" width="471" height="53" rx="9"/>
  <text class="hw" x="421.5" y="517" text-anchor="middle">Encoder role — qwen3-embedding:0.6b</text>
  <text class="hm" x="421.5" y="535" text-anchor="middle">Embedding model on Qwen3-0.6B-Base · 595.78M params</text>
  <rect class="ho" x="669" y="495" width="471" height="53" rx="9"/>
  <text class="hw" x="904.5" y="517" text-anchor="middle">Decoder role — qwen3:4b</text>
  <text class="hm" x="904.5" y="535" text-anchor="middle">Qwen3-4B-Thinking-2507 · 4.02B params</text>
  <rect class="lb" x="20" y="558" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="603" text-anchor="middle">Embedding layer</text>
  <rect class="g" x="186" y="558" width="471" height="80" rx="9"/>
  <text class="tb" x="421.5" y="582" text-anchor="middle">Token embedding 151,669 × 1024</text>
  <text class="m" x="421.5" y="602" text-anchor="middle">Token ID → 1024-d vector lookup</text>
  <text class="m" x="421.5" y="619" text-anchor="middle">Position: RoPE in attention (base 1,000,000)</text>
  <rect class="o" x="669" y="558" width="471" height="80" rx="9"/>
  <text class="tb" x="904.5" y="582" text-anchor="middle">Token embedding 151,936 × 2560</text>
  <text class="m" x="904.5" y="602" text-anchor="middle">Token ID → 2560-d vector (padded vocab)</text>
  <text class="m" x="904.5" y="619" text-anchor="middle">Position: RoPE (base 5,000,000)</text>
  <rect class="lb" x="20" y="648" width="150" height="114" rx="8"/>
  <text class="ll" x="95" y="710" text-anchor="middle">Transformer body</text>
  <rect class="g" x="186" y="648" width="471" height="114" rx="9"/>
  <text class="tb" x="421.5" y="672" text-anchor="middle">Decoder blocks × 28 (used as encoder)</text>
  <text class="m" x="421.5" y="692" text-anchor="middle">hidden 1024 · causal self-attention</text>
  <text class="m" x="421.5" y="709" text-anchor="middle">GQA: 16 query heads / 8 KV heads · head dim 128</text>
  <text class="m" x="421.5" y="726" text-anchor="middle">FFN SwiGLU 3072 · RMSNorm (pre-norm) · QK-Norm</text>
  <text class="m" x="421.5" y="743" text-anchor="middle">Max context 32,768 (PMart num_ctx 2048)</text>
  <rect class="o" x="669" y="648" width="471" height="114" rx="9"/>
  <text class="tb" x="904.5" y="672" text-anchor="middle">Decoder blocks × 36</text>
  <text class="m" x="904.5" y="692" text-anchor="middle">hidden 2560 · causal self-attention</text>
  <text class="m" x="904.5" y="709" text-anchor="middle">GQA: 32 query heads / 8 KV heads · head dim 128</text>
  <text class="m" x="904.5" y="726" text-anchor="middle">FFN SwiGLU 9728 · RMSNorm (pre-norm) · QK-Norm</text>
  <text class="m" x="904.5" y="743" text-anchor="middle">Max context 262,144 (PMart num_ctx 8192)</text>
  <rect class="lb" x="20" y="772" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="817" text-anchor="middle">Output head</text>
  <rect class="g" x="186" y="772" width="471" height="80" rx="9"/>
  <text class="tb" x="421.5" y="796" text-anchor="middle">Last-token pooling → sentence vector</text>
  <text class="m" x="421.5" y="816" text-anchor="middle">Hidden state of last token (EOS) = text representation</text>
  <text class="m" x="421.5" y="833" text-anchor="middle">L2-normalized 1024-d vector → pgvector · cosine search</text>
  <rect class="o" x="669" y="772" width="471" height="80" rx="9"/>
  <text class="tb" x="904.5" y="796" text-anchor="middle">LM head → next token</text>
  <text class="m" x="904.5" y="816" text-anchor="middle">2560 → 151,936 logits → softmax → autoregressive</text>
  <text class="m" x="904.5" y="833" text-anchor="middle">JSON format forced · thinking off · temperature 0.2 / 0.0</text>
  <rect class="lb" x="20" y="862" width="150" height="63" rx="8"/>
  <text class="ll" x="95" y="889.5" text-anchor="middle">Runtime</text>
  <text class="ll" x="95" y="907.5" text-anchor="middle">quantization</text>
  <rect class="r" x="186" y="862" width="471" height="63" rx="9"/>
  <text class="tb" x="421.5" y="886" text-anchor="middle">Ollama GGUF Q8_0 · CPU</text>
  <text class="m" x="421.5" y="906" text-anchor="middle">639MB · num_gpu 0 (GPU left to the LLM)</text>
  <rect class="r" x="669" y="862" width="471" height="63" rx="9"/>
  <text class="tb" x="904.5" y="886" text-anchor="middle">Ollama GGUF Q4_K_M · GPU</text>
  <text class="m" x="904.5" y="906" text-anchor="middle">RTX 2060 6GB · ~3.9GB · 100% GPU</text>
</svg>
