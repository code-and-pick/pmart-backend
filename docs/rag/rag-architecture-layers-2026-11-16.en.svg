<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1324" width="1040" height="1324" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <title>PMart RAG Architecture (Operator · Customer)</title>
  <style>
    .bg { fill: #ffffff; }
    .tt { fill: #1f2933; font-size: 22px; font-weight: 700; }
    .th { fill: #1f2933; font-size: 15px; font-weight: 700; }
    .tb { fill: #1f2933; font-size: 13.5px; font-weight: 700; }
    .m  { fill: #52606d; font-size: 11.5px; }
    .tag { fill: #7b8794; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; }
    .ll { fill: #1f2933; font-size: 13px; font-weight: 700; }
    .lb { fill: #eef1f5; stroke: #cbd2d9; }
    .wrap  { fill: #4a7fc1; fill-opacity: 0.05; stroke: #4a7fc1; stroke-width: 1.5; }
    .wrap2 { fill: #7b8794; fill-opacity: 0.05; stroke: #9aa5b1; stroke-width: 1.5; }
    .b { fill: #e3eefb; stroke: #4a7fc1; }
    .p { fill: #efe7fa; stroke: #8a63c0; }
    .g { fill: #e3f3e8; stroke: #4c9a68; }
    .o { fill: #fcefdc; stroke: #c58a32; }
    .r { fill: #fde8e8; stroke: #c25454; }
    .y { fill: #e0f4f4; stroke: #3a9a9a; }
    .k { fill: #f6f1df; stroke: #a8902f; }
    .n { fill: #eef1f5; stroke: #7b8794; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181d; }
