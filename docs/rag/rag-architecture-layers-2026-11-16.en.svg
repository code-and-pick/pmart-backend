  </style>
  <rect class="bg" x="0" y="0" width="1040" height="1324"/>
  <text class="tt" x="20" y="38" text-anchor="start">PMart RAG Architecture (Operator · Customer)</text>
  <text class="m" x="20" y="62" text-anchor="start">Based on pmart-backend · 2026-11-16 · layers only</text>
  <rect class="lb" x="20" y="84" width="116" height="64" rx="8"/>
  <text class="ll" x="78" y="121" text-anchor="middle">Client</text>
  <rect class="lb" x="20" y="162" width="116" height="64" rx="8"/>
  <text class="ll" x="78" y="199" text-anchor="middle">Gateway</text>
  <rect class="lb" x="20" y="240" width="116" height="548" rx="8"/>
  <text class="ll" x="78" y="519" text-anchor="middle">Service</text>
  <rect class="lb" x="20" y="802" width="116" height="130" rx="8"/>
  <text class="ll" x="78" y="863" text-anchor="middle">Model</text>
  <text class="ll" x="78" y="881" text-anchor="middle">runtime</text>
  <rect class="lb" x="20" y="946" width="116" height="162" rx="8"/>
  <text class="ll" x="78" y="1032" text-anchor="middle">Data</text>
  <rect class="lb" x="20" y="1122" width="116" height="84" rx="8"/>
  <text class="ll" x="78" y="1169" text-anchor="middle">Knowledge</text>
  <rect class="lb" x="20" y="1220" width="116" height="84" rx="8"/>
  <text class="ll" x="78" y="1258" text-anchor="middle">Deploy</text>
  <text class="ll" x="78" y="1276" text-anchor="middle">Ops</text>
  <rect class="b" x="150" y="84" width="425" height="64" rx="9"/>
  <text class="tb" x="362.5" y="108" text-anchor="middle">Back-office web (operator)</text>
  <text class="m" x="362.5" y="128" text-anchor="middle">Staff typ=OPERATOR · policy &amp; procedure questions</text>
  <rect class="b" x="595" y="84" width="425" height="64" rx="9"/>
  <text class="tb" x="807.5" y="108" text-anchor="middle">Customer app /support/chat</text>
  <text class="m" x="807.5" y="128" text-anchor="middle">Members typ=CUSTOMER · guests 403</text>
  <rect class="b" x="150" y="162" width="870" height="64" rx="9"/>
  <text class="tb" x="585" y="186" text-anchor="middle">API Gateway</text>
  <text class="m" x="585" y="206" text-anchor="middle">JWT check · /api/v1/assistant/** · /api/v1/customer-assistant/** · 65 s response limit</text>
  <rect class="wrap" x="150" y="240" width="425" height="548" rx="12"/>
  <text class="th" x="362.5" y="268" text-anchor="middle">ai-assistant-service · :8508</text>
  <text class="m" x="362.5" y="288" text-anchor="middle">Operator RAG · Spring Boot + Spring AI 2.0.2</text>
  <rect class="b" x="162" y="304" width="401" height="112" rx="9"/>
  <text class="tag" x="174" y="322" text-anchor="start">API</text>
  <text class="tb" x="362.5" y="342" text-anchor="middle">AssistantController</text>
  <text class="m" x="362.5" y="362" text-anchor="middle">Ask POST (Idempotency-Key) · answer GET</text>
  <text class="m" x="362.5" y="379" text-anchor="middle">Answer history</text>
  <rect class="p" x="162" y="424" width="401" height="112" rx="9"/>
  <text class="tag" x="174" y="442" text-anchor="start">APPLICATION</text>
  <text class="tb" x="362.5" y="462" text-anchor="middle">PolicyQuestionService</text>
  <text class="m" x="362.5" y="482" text-anchor="middle">Lease claim · pin active snapshot · 25 s timeout</text>
  <text class="m" x="362.5" y="499" text-anchor="middle">Retriever · AnswerGenerator (generative / extractive)</text>
  <text class="m" x="362.5" y="516" text-anchor="middle">AccessPolicy · KnowledgeJobs (indexing)</text>
  <rect class="g" x="162" y="544" width="401" height="112" rx="9"/>
  <text class="tag" x="174" y="562" text-anchor="start">DOMAIN</text>
  <text class="tb" x="362.5" y="582" text-anchor="middle">QuestionClassifier · RankingPolicy</text>
  <text class="m" x="362.5" y="602" text-anchor="middle">Intent: policy / realtime / out of scope (rule-based)</text>
  <text class="m" x="362.5" y="619" text-anchor="middle">Threshold 0.40 · authority &amp; precedence weights</text>
  <text class="m" x="362.5" y="636" text-anchor="middle">CitationVerifier · ExtractiveComposer · Lifecycle</text>
  <rect class="o" x="162" y="664" width="401" height="112" rx="9"/>
  <text class="tag" x="174" y="682" text-anchor="start">INFRASTRUCTURE</text>
  <text class="tb" x="362.5" y="702" text-anchor="middle">Store · Ingest · Embedding</text>
  <text class="m" x="362.5" y="722" text-anchor="middle">ChunkStore (vector + trigram hybrid) · SnapshotStore · AnswerStore</text>
  <text class="m" x="362.5" y="739" text-anchor="middle">KnowledgeIngestor · MarkdownChunker · SupersessionResolver</text>
  <text class="m" x="362.5" y="756" text-anchor="middle">OllamaEmbedding / LocalHash (local, 384-d) · AdvisoryLocks</text>
  <rect class="wrap" x="595" y="240" width="425" height="548" rx="12"/>
  <text class="th" x="807.5" y="268" text-anchor="middle">customer-assistant-service · :8509</text>
  <text class="m" x="807.5" y="288" text-anchor="middle">Customer RAG · started as a copy of operator RAG</text>
  <rect class="b" x="607" y="304" width="401" height="112" rx="9"/>
  <text class="tag" x="619" y="322" text-anchor="start">API</text>
  <text class="tb" x="807.5" y="342" text-anchor="middle">CustomerAssistantController · RateLimitAdvice</text>
  <text class="m" x="807.5" y="362" text-anchor="middle">Rate limit 5/min · 50/day (Asia/Seoul)</text>
  <text class="m" x="807.5" y="379" text-anchor="middle">No grounding → link to support inquiry (/inquiries)</text>
  <rect class="p" x="607" y="424" width="401" height="112" rx="9"/>
  <text class="tag" x="619" y="442" text-anchor="start">APPLICATION</text>
  <text class="tb" x="807.5" y="462" text-anchor="middle">CustomerQuestionService</text>
  <text class="m" x="807.5" y="482" text-anchor="middle">Lease claim · pin snapshot · question kept as hash only</text>
  <text class="m" x="807.5" y="499" text-anchor="middle">Retriever · AnswerGenerator (generative / extractive)</text>
  <text class="m" x="807.5" y="516" text-anchor="middle">AccessPolicy · KnowledgeJobs (indexing)</text>
  <rect class="g" x="607" y="544" width="401" height="112" rx="9"/>
  <text class="tag" x="619" y="562" text-anchor="start">DOMAIN</text>
  <text class="tb" x="807.5" y="582" text-anchor="middle">QuestionClassifier · RankingPolicy</text>
  <text class="m" x="807.5" y="602" text-anchor="middle">CitationVerifier · CustomerAnswerChecks</text>
  <text class="m" x="807.5" y="619" text-anchor="middle">(whole numbers · table rows · question terms)</text>
  <text class="m" x="807.5" y="636" text-anchor="middle">OrderStatusText · RateLimit · TableText</text>
  <rect class="o" x="607" y="664" width="401" height="112" rx="9"/>
  <text class="tag" x="619" y="682" text-anchor="start">INFRASTRUCTURE</text>
  <text class="tb" x="807.5" y="702" text-anchor="middle">Store · Ingest · Embedding</text>
  <text class="m" x="807.5" y="722" text-anchor="middle">ChunkStore · SnapshotStore · AnswerStore · AdvisoryLocks</text>
  <text class="m" x="807.5" y="739" text-anchor="middle">KnowledgeIngestor · MarkdownChunker · SupersessionResolver</text>
  <text class="m" x="807.5" y="756" text-anchor="middle">OrderClient → order-service GET /orders (my orders)</text>
  <rect class="wrap2" x="150" y="802" width="870" height="130" rx="12"/>
  <text class="th" x="585" y="828" text-anchor="middle">Ollama</text>
  <text class="m" x="585" y="848" text-anchor="middle">Docker · PC 2 GPU RTX 2060 6GB · 4 CPU / 6GB cap · 1 request at a time · no external model API</text>
  <rect class="r" x="162" y="862" width="413" height="58" rx="9"/>
  <text class="tb" x="368.5" y="886" text-anchor="middle">Chat model  qwen3:4b</text>
  <text class="m" x="368.5" y="906" text-anchor="middle">100% GPU · 3.9GB · ctx 8192 · temp operator 0.2 / customer 0.0</text>
  <rect class="r" x="595" y="862" width="413" height="58" rx="9"/>
  <text class="tb" x="801.5" y="886" text-anchor="middle">Embedding model  qwen3-embedding:0.6b</text>
  <text class="m" x="801.5" y="906" text-anchor="middle">CPU · 1024-d · instruction on queries only</text>
  <rect class="wrap2" x="150" y="946" width="870" height="162" rx="12"/>
  <text class="th" x="585" y="972" text-anchor="middle">rag-pgvector</text>
  <text class="m" x="585" y="992" text-anchor="middle">pgvector/pgvector:pg17 · port 15433 · not exposed on LAN · separate DB &amp; account per service</text>
  <rect class="y" x="162" y="1006" width="413" height="90" rx="9"/>
  <text class="tb" x="368.5" y="1030" text-anchor="middle">DB  ai_assistant_service</text>
  <text class="m" x="368.5" y="1050" text-anchor="middle">index_snapshot · index_source_file</text>
  <text class="m" x="368.5" y="1067" text-anchor="middle">doc_chunk (vector 1024 + gin_trgm)</text>
  <text class="m" x="368.5" y="1084" text-anchor="middle">embedding_cache · policy_answer</text>
  <rect class="y" x="595" y="1006" width="413" height="90" rx="9"/>
  <text class="tb" x="801.5" y="1030" text-anchor="middle">DB  customer_assistant_service</text>
  <text class="m" x="801.5" y="1050" text-anchor="middle">index_snapshot · index_source_file</text>
  <text class="m" x="801.5" y="1067" text-anchor="middle">doc_chunk (vector 1024 + gin_trgm)</text>
  <text class="m" x="801.5" y="1084" text-anchor="middle">embedding_cache · customer_answer</text>
  <rect class="k" x="150" y="1122" width="425" height="84" rx="9"/>
  <text class="tb" x="362.5" y="1146" text-anchor="middle">Operator manifest.yml — 52 docs · 1,677 chunks</text>
  <text class="m" x="362.5" y="1166" text-anchor="middle">Business-policy ADRs 17 · business specs · flows · states</text>
  <text class="m" x="362.5" y="1183" text-anchor="middle">CS scripts 11 · authority &amp; precedence weighting</text>
  <rect class="k" x="595" y="1122" width="425" height="84" rx="9"/>
  <text class="tb" x="807.5" y="1146" text-anchor="middle">Customer manifest.yml — 13 docs · 63 chunks</text>
  <text class="m" x="807.5" y="1166" text-anchor="middle">docs/business/customer-faq 01 – 13</text>
  <text class="m" x="807.5" y="1183" text-anchor="middle">User-approved public guidance only · weight 0</text>
  <rect class="n" x="150" y="1220" width="870" height="84" rx="9"/>
  <text class="tb" x="585" y="1244" text-anchor="middle">LAN PC 2  —  rag-pgvector · ollama · ai-assistant-service · customer-assistant-service</text>
  <text class="m" x="585" y="1264" text-anchor="middle">Indexing &amp; deploy from PC 1: lan.sh rag-pull · rag-warm · rag-ingest · rag-ingest-customer · watch.sh</text>
  <text class="m" x="585" y="1281" text-anchor="middle">Local dev: local profile = hash embedding (384-d) + pgvector 15433 · never mix with real-model vectors</text>
</svg>
