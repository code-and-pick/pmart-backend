<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 945" width="1160" height="945" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <title>PMart RAG 모델 아키텍처 — 코퍼스 · BPE · 임베딩 레이어 · 인코더 / 디코더</title>
  <style>
    .bg { fill: #ffffff; }
    .tt { fill: #1f2933; font-size: 22px; font-weight: 700; }
    .th { fill: #1f2933; font-size: 15px; font-weight: 700; }
    .tb { fill: #1f2933; font-size: 13.5px; font-weight: 700; }
    .m  { fill: #52606d; font-size: 11.5px; }
    .ll { fill: #1f2933; font-size: 13px; font-weight: 700; }
    .lb { fill: #eef1f5; stroke: #cbd2d9; }
    .s { fill: #f3ece4; stroke: #9a7b5c; }
    .n { fill: #f5f7fa; stroke: #9aa5b1; stroke-dasharray: 5 4; }
    .k { fill: #f6f1df; stroke: #a8902f; }
    .p { fill: #efe7fa; stroke: #8a63c0; }
    .g { fill: #e3f3e8; stroke: #4c9a68; }
    .o { fill: #fcefdc; stroke: #c58a32; }
    .r { fill: #fde8e8; stroke: #c25454; }
    .hg { fill: #4c9a68; stroke: #4c9a68; }
    .ho { fill: #c58a32; stroke: #c58a32; }
    .hw { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .hm { fill: #ffffff; font-size: 11.5px; fill-opacity: 0.92; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181d; }
      .tt, .th, .tb, .ll { fill: #e6e9ee; }
      .m { fill: #a9b4c0; }
      .lb { fill: #1f262e; stroke: #3e4c59; }
      .s { fill: #33291f; stroke: #c4a07c; }
      .n { fill: #181d23; stroke: #616e7c; }
      .k { fill: #34301a; stroke: #cdb44f; }
      .p { fill: #2e2442; stroke: #ab8ae0; }
      .g { fill: #1b3527; stroke: #6cc08c; }
      .o { fill: #3a2c17; stroke: #e0a85a; }
      .r { fill: #3d1f1f; stroke: #e07a7a; }
      .hg { fill: #2f6b47; stroke: #6cc08c; }
      .ho { fill: #8a5d1c; stroke: #e0a85a; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1160" height="945"/>
  <text class="tt" x="20" y="40" text-anchor="start">PMart RAG 모델 아키텍처 — 코퍼스 · BPE · 임베딩 레이어 · 인코더 / 디코더</text>
  <text class="m" x="20" y="64" text-anchor="start">Qwen3 계열 디코더 전용 Transformer 2개: 하나는 인코더(검색 벡터) 역할, 하나는 디코더(답변 생성) 역할 · Ollama GGUF 로 실행 · PMart 는 재학습 · 파인튜닝 없음</text>
  <rect class="lb" x="20" y="84" width="150" height="131" rx="8"/>
  <text class="ll" x="95" y="145.5" text-anchor="middle">코퍼스</text>
  <text class="ll" x="95" y="163.5" text-anchor="middle">검색 대상</text>
  <rect class="s" x="186" y="84" width="471" height="131" rx="9"/>
  <text class="tb" x="421.5" y="108" text-anchor="middle">운영자 코퍼스 — 52개 문서 · 1,677 청크</text>
  <text class="m" x="421.5" y="128" text-anchor="middle">업무 원문 8: WMS · SCM · TMS · MFC · BackOffice · OMS · Commerce · Delivery</text>
  <text class="m" x="421.5" y="145" text-anchor="middle">업무 정책 ADR 17: 재고 · 결품 · 피킹 · 취소 · 리뷰 · 알림 · 개인정보 열람 등</text>
  <text class="m" x="421.5" y="162" text-anchor="middle">상태 계약 8: 주문 · 클레임·환불 · 배송 · MFC · CDC · SCM · TMS · 플랫폼</text>
  <text class="m" x="421.5" y="179" text-anchor="middle">업무 흐름 5: 취소/인계 · 주문 결제 사가 · 보충 이동 · 반품·교환·환불 · 직원 권한</text>
  <text class="m" x="421.5" y="196" text-anchor="middle">상담 스크립트 11 · 개요 3 (overview · domain-map · glossary)</text>
  <rect class="s" x="669" y="84" width="471" height="131" rx="9"/>
  <text class="tb" x="904.5" y="108" text-anchor="middle">고객 코퍼스 — 13개 문서 · 63 청크</text>
  <text class="m" x="904.5" y="128" text-anchor="middle">docs/business/customer-faq (사용자 승인 고객 공개 안내)</text>
  <text class="m" x="904.5" y="145" text-anchor="middle">고객센터 · 주문 취소 · 배송 상태 · 미수령 · 누락·오배송</text>
  <text class="m" x="904.5" y="162" text-anchor="middle">파손·품질 · 환불 · 반품·교환 · 결품</text>
  <text class="m" x="904.5" y="179" text-anchor="middle">주소·배송 지역 · 결제·요금 · 계정 · 주류</text>
  <text class="m" x="904.5" y="196" text-anchor="middle">내부 문서(업무 원문 · ADR · 상담 스크립트)는 넣지 않음</text>
  <rect class="lb" x="20" y="225" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="270" text-anchor="middle">사전학습 코퍼스</text>
  <rect class="n" x="186" y="225" width="954" height="80" rx="9"/>
  <text class="tb" x="663" y="249" text-anchor="middle">Qwen3 사전학습 데이터 (모델 제공자 측)</text>
  <text class="m" x="663" y="269" text-anchor="middle">약 36조 토큰 · 119개 언어 — 한국어 포함 다국어 · 코드 · 수학 · 추론 데이터</text>
  <text class="m" x="663" y="286" text-anchor="middle">PMart 코퍼스는 학습에 쓰지 않고 검색 대상(Retrieval corpus)으로만 사용</text>
  <rect class="lb" x="20" y="315" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="360" text-anchor="middle">청킹</text>
  <rect class="k" x="186" y="315" width="954" height="80" rx="9"/>
  <text class="tb" x="663" y="339" text-anchor="middle">구조 인식 청킹 (MarkdownChunker)</text>
  <text class="m" x="663" y="359" text-anchor="middle">제목 계층 → 절 경로 · 표 / 목록 / 코드 블록은 통째로 · ADR 결정은 항목마다 · 청크 최대 1,500자</text>
  <text class="m" x="663" y="376" text-anchor="middle">청크 = 임베딩 입력 단위 (색인 때) · 질문 = 임베딩 입력 (검색 때, 검색 지시문 접두)</text>
  <rect class="lb" x="20" y="405" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="441" text-anchor="middle">토크나이저</text>
  <text class="ll" x="95" y="459" text-anchor="middle">BPE</text>
  <rect class="p" x="186" y="405" width="310" height="80" rx="9"/>
  <text class="tb" x="341" y="429" text-anchor="middle">Byte-level BPE</text>
  <text class="m" x="341" y="449" text-anchor="middle">GPT-2 방식 (pre-tokenizer qwen2)</text>
  <text class="m" x="341" y="466" text-anchor="middle">UTF-8 바이트 단위 → 한글도 미등록어 없음</text>
  <rect class="p" x="508" y="405" width="310" height="80" rx="9"/>
  <text class="tb" x="663" y="429" text-anchor="middle">어휘 · 병합 규칙</text>
  <text class="m" x="663" y="449" text-anchor="middle">어휘 151,669 토큰 (특수 포함)</text>
  <text class="m" x="663" y="466" text-anchor="middle">BPE 병합 규칙 151,387개</text>
  <rect class="p" x="830" y="405" width="310" height="80" rx="9"/>
  <text class="tb" x="985" y="429" text-anchor="middle">특수 토큰</text>
  <text class="m" x="985" y="449" text-anchor="middle">&lt;|endoftext|&gt; 151643 · &lt;|im_end|&gt; 151645</text>
  <text class="m" x="985" y="466" text-anchor="middle">임베딩 모델은 입력 끝에 EOS 자동 추가</text>
  <rect class="hg" x="186" y="495" width="471" height="53" rx="9"/>
  <text class="hw" x="421.5" y="517" text-anchor="middle">인코더 역할 — qwen3-embedding:0.6b</text>
  <text class="hm" x="421.5" y="535" text-anchor="middle">Qwen3-0.6B-Base 기반 임베딩 모델 · 595.78M 파라미터</text>
  <rect class="ho" x="669" y="495" width="471" height="53" rx="9"/>
  <text class="hw" x="904.5" y="517" text-anchor="middle">디코더 역할 — qwen3:4b</text>
  <text class="hm" x="904.5" y="535" text-anchor="middle">Qwen3-4B-Thinking-2507 · 4.02B 파라미터</text>
  <rect class="lb" x="20" y="558" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="603" text-anchor="middle">임베딩 레이어</text>
  <rect class="g" x="186" y="558" width="471" height="80" rx="9"/>
  <text class="tb" x="421.5" y="582" text-anchor="middle">토큰 임베딩 151,669 × 1024</text>
  <text class="m" x="421.5" y="602" text-anchor="middle">토큰 ID → 1024차원 벡터 조회</text>
  <text class="m" x="421.5" y="619" text-anchor="middle">위치: RoPE (어텐션 안 회전, base 1,000,000)</text>
  <rect class="o" x="669" y="558" width="471" height="80" rx="9"/>
  <text class="tb" x="904.5" y="582" text-anchor="middle">토큰 임베딩 151,936 × 2560</text>
  <text class="m" x="904.5" y="602" text-anchor="middle">토큰 ID → 2560차원 벡터 조회 (어휘 패딩 포함)</text>
  <text class="m" x="904.5" y="619" text-anchor="middle">위치: RoPE (base 5,000,000)</text>
  <rect class="lb" x="20" y="648" width="150" height="114" rx="8"/>
  <text class="ll" x="95" y="710" text-anchor="middle">Transformer 본체</text>
  <rect class="g" x="186" y="648" width="471" height="114" rx="9"/>
  <text class="tb" x="421.5" y="672" text-anchor="middle">디코더 블록 × 28 (인코더로 사용)</text>
  <text class="m" x="421.5" y="692" text-anchor="middle">hidden 1024 · 인과적(causal) self-attention</text>
  <text class="m" x="421.5" y="709" text-anchor="middle">GQA: Query 헤드 16 / KV 헤드 8 · 헤드 차원 128</text>
  <text class="m" x="421.5" y="726" text-anchor="middle">FFN SwiGLU 3072 · RMSNorm (pre-norm) · QK-Norm</text>
  <text class="m" x="421.5" y="743" text-anchor="middle">최대 문맥 32,768 (PMart 설정 num_ctx 2048)</text>
  <rect class="o" x="669" y="648" width="471" height="114" rx="9"/>
  <text class="tb" x="904.5" y="672" text-anchor="middle">디코더 블록 × 36</text>
  <text class="m" x="904.5" y="692" text-anchor="middle">hidden 2560 · 인과적(causal) self-attention</text>
  <text class="m" x="904.5" y="709" text-anchor="middle">GQA: Query 헤드 32 / KV 헤드 8 · 헤드 차원 128</text>
  <text class="m" x="904.5" y="726" text-anchor="middle">FFN SwiGLU 9728 · RMSNorm (pre-norm) · QK-Norm</text>
  <text class="m" x="904.5" y="743" text-anchor="middle">최대 문맥 262,144 (PMart 설정 num_ctx 8192)</text>
  <rect class="lb" x="20" y="772" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="817" text-anchor="middle">출력 헤드</text>
  <rect class="g" x="186" y="772" width="471" height="80" rx="9"/>
  <text class="tb" x="421.5" y="796" text-anchor="middle">Last-token 풀링 → 문장 벡터</text>
  <text class="m" x="421.5" y="816" text-anchor="middle">마지막 토큰(EOS)의 은닉 상태 = 문장 표현</text>
  <text class="m" x="421.5" y="833" text-anchor="middle">L2 정규화 → 1024차원 벡터 → pgvector 저장 · 코사인 검색</text>
  <rect class="o" x="669" y="772" width="471" height="80" rx="9"/>
  <text class="tb" x="904.5" y="796" text-anchor="middle">LM Head → 다음 토큰</text>
  <text class="m" x="904.5" y="816" text-anchor="middle">2560 → 151,936 로짓 → softmax → 자기회귀 생성</text>
  <text class="m" x="904.5" y="833" text-anchor="middle">JSON 형식 강제 · thinking 끔 · temperature 0.2 / 0.0</text>
  <rect class="lb" x="20" y="862" width="150" height="63" rx="8"/>
  <text class="ll" x="95" y="889.5" text-anchor="middle">실행</text>
  <text class="ll" x="95" y="907.5" text-anchor="middle">양자화</text>
  <rect class="r" x="186" y="862" width="471" height="63" rx="9"/>
  <text class="tb" x="421.5" y="886" text-anchor="middle">Ollama GGUF Q8_0 · CPU</text>
  <text class="m" x="421.5" y="906" text-anchor="middle">639MB · num_gpu 0 (GPU 는 생성 모델에 양보)</text>
  <rect class="r" x="669" y="862" width="471" height="63" rx="9"/>
  <text class="tb" x="904.5" y="886" text-anchor="middle">Ollama GGUF Q4_K_M · GPU</text>
  <text class="m" x="904.5" y="906" text-anchor="middle">RTX 2060 6GB · 약 3.9GB · 100% GPU</text>
</svg>
