<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 865" width="1160" height="865" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <title>Gemma 3 Model Architecture — Corpus · Tokenizer · Embedding Layer · Decoder</title>
  <style>
    .bg { fill: #ffffff; }
    .tt { fill: #1f2933; font-size: 22px; font-weight: 700; }
    .th { fill: #1f2933; font-size: 15px; font-weight: 700; }
    .tb { fill: #1f2933; font-size: 13.5px; font-weight: 700; }
    .m  { fill: #52606d; font-size: 11.5px; }
    .ll { fill: #1f2933; font-size: 13px; font-weight: 700; }
    .lb { fill: #eef1f5; stroke: #cbd2d9; }
    .s { fill: #f3ece4; stroke: #9a7b5c; }
    .n { fill: #f5f7fa; stroke: #9aa5b1; stroke-dasharray: 5 4; }
    .k { fill: #f6f1df; stroke: #a8902f; }
    .p { fill: #efe7fa; stroke: #8a63c0; }
    .g { fill: #e3f3e8; stroke: #4c9a68; }
    .o { fill: #fcefdc; stroke: #c58a32; }
    .r { fill: #fde8e8; stroke: #c25454; }
    .y { fill: #e0f4f4; stroke: #3a9a9a; }
    .hg { fill: #4c9a68; stroke: #4c9a68; }
    .ho { fill: #c58a32; stroke: #c58a32; }
    .hw { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .hm { fill: #ffffff; font-size: 11.5px; fill-opacity: 0.92; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14181d; }
      .tt, .th, .tb, .ll { fill: #e6e9ee; }
      .m { fill: #a9b4c0; }
      .lb { fill: #1f262e; stroke: #3e4c59; }
      .s { fill: #33291f; stroke: #c4a07c; }
      .n { fill: #181d23; stroke: #616e7c; }
      .k { fill: #34301a; stroke: #cdb44f; }
      .p { fill: #2e2442; stroke: #ab8ae0; }
      .g { fill: #1b3527; stroke: #6cc08c; }
      .o { fill: #3a2c17; stroke: #e0a85a; }
      .r { fill: #3d1f1f; stroke: #e07a7a; }
      .y { fill: #173535; stroke: #5cc0c0; }
      .hg { fill: #2f6b47; stroke: #6cc08c; }
      .ho { fill: #8a5d1c; stroke: #e0a85a; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1160" height="865"/>
  <text class="tt" x="20" y="40" text-anchor="start">Gemma 3 Model Architecture — Corpus · Tokenizer · Embedding Layer · Decoder</text>
  <text class="m" x="20" y="64" text-anchor="start">Google DeepMind 2025-03 · decoder-only Transformer (no separate encoder) · 4B+ are multimodal with a SigLIP vision encoder · Gemma Terms of Use</text>
  <rect class="lb" x="20" y="84" width="150" height="97" rx="8"/>
  <text class="ll" x="95" y="137.5" text-anchor="middle">Training corpus</text>
  <rect class="s" x="186" y="84" width="471" height="97" rx="9"/>
  <text class="tb" x="421.5" y="108" text-anchor="middle">Pre-training data</text>
  <text class="m" x="421.5" y="128" text-anchor="middle">Web documents · code · math · image-text</text>
  <text class="m" x="421.5" y="145" text-anchor="middle">More multilingual data · 140+ languages (incl. Korean)</text>
  <text class="m" x="421.5" y="162" text-anchor="middle">1B 2T · 4B 4T · 12B 12T · 27B 14T tokens</text>
  <rect class="s" x="669" y="84" width="471" height="97" rx="9"/>
  <text class="tb" x="904.5" y="108" text-anchor="middle">Training method</text>
  <text class="m" x="904.5" y="128" text-anchor="middle">Knowledge distillation from a larger teacher</text>
  <text class="m" x="904.5" y="145" text-anchor="middle">Post-training: distillation + RL (BOND · WARM · WARP)</text>
  <text class="m" x="904.5" y="162" text-anchor="middle">QAT variants: quantization-aware training (int4)</text>
  <rect class="lb" x="20" y="191" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="236" text-anchor="middle">Tokenizer</text>
  <rect class="p" x="186" y="191" width="310" height="80" rx="9"/>
  <text class="tb" x="341" y="215" text-anchor="middle">SentencePiece BPE</text>
  <text class="m" x="341" y="235" text-anchor="middle">Same as Gemini 2.0 · character-level BPE</text>
  <text class="m" x="341" y="252" text-anchor="middle">Byte fallback for unknown chars · space as ▁</text>
  <rect class="p" x="508" y="191" width="310" height="80" rx="9"/>
  <text class="tb" x="663" y="215" text-anchor="middle">Vocabulary 262,144</text>
  <text class="m" x="663" y="235" text-anchor="middle">Split digits · preserved whitespace</text>
  <text class="m" x="663" y="252" text-anchor="middle">Balanced for non-English (~1.7× Qwen3)</text>
  <rect class="p" x="830" y="191" width="310" height="80" rx="9"/>
  <text class="tb" x="985" y="215" text-anchor="middle">Special tokens</text>
  <text class="m" x="985" y="235" text-anchor="middle">&lt;bos&gt; · &lt;start_of_turn&gt; · &lt;end_of_turn&gt;</text>
  <text class="m" x="985" y="252" text-anchor="middle">&lt;start_of_image&gt; · image soft tokens</text>
  <rect class="lb" x="20" y="281" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="317" text-anchor="middle">Vision encoder</text>
  <text class="ll" x="95" y="335" text-anchor="middle">4B+</text>
  <rect class="y" x="186" y="281" width="954" height="80" rx="9"/>
  <text class="tb" x="663" y="305" text-anchor="middle">SigLIP vision encoder (~417M)</text>
  <text class="m" x="663" y="325" text-anchor="middle">896 × 896 image → condensed to 256 soft tokens · shared by all sizes (frozen during training)</text>
  <text class="m" x="663" y="342" text-anchor="middle">Pan &amp; Scan: large / non-square images cropped into several views · bidirectional attention among image tokens</text>
  <rect class="lb" x="20" y="371" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="416" text-anchor="middle">Embedding layer</text>
  <rect class="g" x="186" y="371" width="954" height="80" rx="9"/>
  <text class="tb" x="663" y="395" text-anchor="middle">Token embedding 262,144 × d_model</text>
  <text class="m" x="663" y="415" text-anchor="middle">Token ID → d_model vector (1B 1152 · 4B 2560 · 12B 3840 · 27B 5376) · scaled by √d_model</text>
  <text class="m" x="663" y="432" text-anchor="middle">Large vocab → large embedding share (4B: 675M · 27B: 1,416M) · tied with the LM head</text>
  <rect class="lb" x="20" y="461" width="150" height="97" rx="8"/>
  <text class="ll" x="95" y="514.5" text-anchor="middle">Decoder block</text>
  <rect class="o" x="186" y="461" width="310" height="97" rx="9"/>
  <text class="tb" x="341" y="485" text-anchor="middle">Attention</text>
  <text class="m" x="341" y="505" text-anchor="middle">GQA (more query than KV heads)</text>
  <text class="m" x="341" y="522" text-anchor="middle">QK-Norm (replaces Gemma 2 soft-capping)</text>
  <text class="m" x="341" y="539" text-anchor="middle">Head dim 256 (128 for 27B)</text>
  <rect class="o" x="508" y="461" width="310" height="97" rx="9"/>
  <text class="tb" x="663" y="485" text-anchor="middle">Local : global = 5 : 1</text>
  <text class="m" x="663" y="505" text-anchor="middle">Local: 1,024-token sliding window · RoPE 10K</text>
  <text class="m" x="663" y="522" text-anchor="middle">Global: full context · RoPE 1M (128K)</text>
  <text class="m" x="663" y="539" text-anchor="middle">Cuts KV-cache memory</text>
  <rect class="o" x="830" y="461" width="310" height="97" rx="9"/>
  <text class="tb" x="985" y="485" text-anchor="middle">FFN · normalization</text>
  <text class="m" x="985" y="505" text-anchor="middle">GeGLU feed-forward</text>
  <text class="m" x="985" y="522" text-anchor="middle">RMSNorm before and after (pre + post norm)</text>
  <text class="m" x="985" y="539" text-anchor="middle">Residual connections</text>
  <rect class="lb" x="20" y="568" width="150" height="97" rx="8"/>
  <text class="ll" x="95" y="621.5" text-anchor="middle">Sizes</text>
  <rect class="n" x="186" y="568" width="229.5" height="97" rx="9"/>
  <text class="tb" x="300.75" y="592" text-anchor="middle">Gemma 3 1B</text>
  <text class="m" x="300.75" y="612" text-anchor="middle">26 layers · d 1152 · Q 4 / KV 1</text>
  <text class="m" x="300.75" y="629" text-anchor="middle">FFN 6,912 · context 32K</text>
  <text class="m" x="300.75" y="646" text-anchor="middle">Text only · non-embedding 698M</text>
  <rect class="n" x="427.5" y="568" width="229.5" height="97" rx="9"/>
  <text class="tb" x="542.25" y="592" text-anchor="middle">Gemma 3 4B</text>
  <text class="m" x="542.25" y="612" text-anchor="middle">34 layers · d 2560 · Q 8 / KV 4</text>
  <text class="m" x="542.25" y="629" text-anchor="middle">FFN 10,240 · context 128K</text>
  <text class="m" x="542.25" y="646" text-anchor="middle">Multimodal · non-embedding 3,209M</text>
  <rect class="n" x="669" y="568" width="229.5" height="97" rx="9"/>
  <text class="tb" x="783.75" y="592" text-anchor="middle">Gemma 3 12B</text>
  <text class="m" x="783.75" y="612" text-anchor="middle">48 layers · d 3840 · Q 16 / KV 8</text>
  <text class="m" x="783.75" y="629" text-anchor="middle">FFN 15,360 · context 128K</text>
  <text class="m" x="783.75" y="646" text-anchor="middle">Multimodal · non-embedding 10,759M</text>
  <rect class="n" x="910.5" y="568" width="229.5" height="97" rx="9"/>
  <text class="tb" x="1025.25" y="592" text-anchor="middle">Gemma 3 27B</text>
  <text class="m" x="1025.25" y="612" text-anchor="middle">62 layers · d 5376 · Q 32 / KV 16</text>
  <text class="m" x="1025.25" y="629" text-anchor="middle">FFN 21,504 · context 128K</text>
  <text class="m" x="1025.25" y="646" text-anchor="middle">Multimodal · non-embedding 25,600M</text>
  <rect class="lb" x="20" y="675" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="720" text-anchor="middle">Output head</text>
  <rect class="o" x="186" y="675" width="954" height="80" rx="9"/>
  <text class="tb" x="663" y="699" text-anchor="middle">LM head → next token</text>
  <text class="m" x="663" y="719" text-anchor="middle">d_model → 262,144 logits → softmax → autoregressive (weights tied with input embedding)</text>
  <text class="m" x="663" y="736" text-anchor="middle">Chat format: &lt;start_of_turn&gt;user … &lt;end_of_turn&gt; &lt;start_of_turn&gt;model …</text>
  <rect class="lb" x="20" y="765" width="150" height="80" rx="8"/>
  <text class="ll" x="95" y="801" text-anchor="middle">Derivatives</text>
  <text class="ll" x="95" y="819" text-anchor="middle">runtime</text>
  <rect class="r" x="186" y="765" width="310" height="80" rx="9"/>
  <text class="tb" x="341" y="789" text-anchor="middle">EmbeddingGemma 308M</text>
  <text class="m" x="341" y="809" text-anchor="middle">Embedding model on Gemma 3 · 2K context</text>
  <text class="m" x="341" y="826" text-anchor="middle">MTEB multilingual v2 61.15 (Qwen3-Emb-0.6B 64.33)</text>
  <rect class="r" x="508" y="765" width="310" height="80" rx="9"/>
  <text class="tb" x="663" y="789" text-anchor="middle">Ollama QAT int4</text>
  <text class="m" x="663" y="809" text-anchor="middle">gemma3:4b-it-qat ~2.6GB · 12B 6.6GB</text>
  <text class="m" x="663" y="826" text-anchor="middle">27B 14.1GB (VRAM)</text>
  <rect class="r" x="830" y="765" width="310" height="80" rx="9"/>
  <text class="tb" x="985" y="789" text-anchor="middle">Successor: Gemma 4 (2026-04)</text>
  <text class="m" x="985" y="809" text-anchor="middle">E2B · E4B · 26B MoE · 31B</text>
  <text class="m" x="985" y="826" text-anchor="middle">Moved to Apache 2.0</text>
</svg>
