# cdc-outbound-service 고유 설정(모든 프로필). 환경별 값은 cdc-outbound-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 정본은 pmart-config 저장소 — 이 파일은 시험 사본. 2026-11-25 새 서비스: 정본에 같은 파일을 넣어야 한다(PC1 백엔드 요청).
server:
  port: 8603
pmart:
  messaging:
    domain: cdc
spring:
  # 이벤트 소비(Spring Cloud Stream, ADR-0035): 함수(빈) 이름 → 토픽. 그룹·재시도·DLQ·커밋은 common-messaging 기본값.
  # 0.17.0(2026-11-25) cdc-inventory AllocationShortfall(실사 부족) — 함수를 더하거나 빼면 코드(PmartEventConsumer 빈)와 함께 바꾼다
  cloud:
    function:
      definition: inventoryEvents
    stream:
      bindings:
        inventoryEvents-in-0:
          destination: cdc.inventory.v1
# cdc-inventory 주소는 환경별(cdc-outbound-service-<프로필>.yml 의 pmart.outbound.cdc-inventory-base-url)
