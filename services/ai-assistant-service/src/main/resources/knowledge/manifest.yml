# ai-assistant-service 색인 대상 명시 목록 (ADR-0036). 여기에 없는 파일은 색인하지 않는다.
# 넣지 않는 것: worklog·handoff·그 밖의 architecture 문서·코드·시험·배포·비밀.
#
# precedence (우선순위 등급, 클수록 우선) — docs/business/domain-map.md:35 그대로:
#   CLAUDE.md 서비스 목록 > 2026-10-20 이후 문서(WMS v8.1, SCM, TMS, MFC v2.0, BackOffice v2.0) > OMS > Commerce > Delivery(Draft)
#   5 = ADR(업무 정책만 — 아래). 서비스 목록 service-map.md 는 2026-11-15 뺌(문서 충돌을 해결한 결정 기록 — 지위는 상태 줄이 정한다)
#   4 = 2026-10-20 이후 업무 문서 + 저장소 설계 문서(overview·domain-map·glossary·flows·states, 2026-10-23 이후)
#   3 = OMS, 2 = Commerce, 1 = Delivery(Draft)
#   단 [확정 정책] 은 등급과 무관하게 유지 — 지위(authority) 가중으로 반영한다.
#
# authority: 문서 기본 지위. 절·문단 태그([확정 정책]·[채택 설계]·[설계안]·[가정]·[결정 필요]…)가 덮는다.
#   ADR 은 비워 둔다 — 상태 줄("- 상태: 승인 …")로 판정(승인=CONFIRMED, 그 밖=PROPOSAL).
version: 1
defaultAccessScope: operator
documents:
  # --- 저장소 설계 문서 ---
  - { path: docs/business/overview.md, domain: overview, kind: REFERENCE, authority: ADOPTED_DESIGN, precedence: 4 }
  - { path: docs/business/domain-map.md, domain: overview, kind: REFERENCE, authority: ADOPTED_DESIGN, precedence: 4 }
  - { path: docs/business/glossary.md, domain: overview, kind: REFERENCE, authority: ADOPTED_DESIGN, precedence: 4 }
