# cdc-inbound-service 고유 설정(모든 프로필). 환경별 값은 cdc-inbound-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 정본은 pmart-config 저장소 — 이 파일은 시험 사본. 2026-11-26 새 서비스: 정본에 같은 파일을 넣어야 한다(PC1 백엔드 요청).
server:
  port: 8605
pmart:
  messaging:
    domain: cdc
  inbound:
    cdc-inventory-base-url: http://cdc-inventory-service:8601
    cdc-location-base-url: http://cdc-location-service:8602
    replenishment-interval: PT1M # 피킹 선반 최소 이하 감지 주기(WMS CDC-F-013)
    retry-interval: PT30S # 재고·위치 응답 불명 다시 보내기
# 이벤트 소비·발행 없음(작업 상태는 조회로 — PutawayTaskStateChanged 는 구독자가 생기면)
