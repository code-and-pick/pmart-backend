# transport-execution-service 고유 설정(모든 프로필). 환경별 값은 transport-execution-service-<프로필>.yml, 모든 서비스 공통은 application.yml. ADR-0029
# 정본은 pmart-config 저장소 — 이 파일은 시험 사본. 2026-11-26 새 서비스(TMS 1단계): 정본에 같은 파일을 넣어야 한다(PC1 백엔드 요청).
server:
  port: 8702
pmart:
  messaging:
    domain: tms
  execution:
    cdc-outbound-base-url: http://cdc-outbound-service:8603
    planning-base-url: http://transport-planning-service:8701
    fleet-base-url: http://fleet-service:8703
    retry-interval: PT30S # 출발 검증·planning 알림·점유 해제 다시 보내기
# 이벤트 소비·발행 없음(1단계 — 설계 §6)
