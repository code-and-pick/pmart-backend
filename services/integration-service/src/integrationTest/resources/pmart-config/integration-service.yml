# integration-service 고유 설정(모든 프로필). 문서 저장소 웹훅 흐름(Spring Integration, ADR-0095) — ES-First 하이브리드 RAG 의 적재 입구. DB·Kafka 없음. ADR-0029
# GitHub code-and-pick/pmart-all-docs push·delete 웹훅 → 바뀐 파일을 GitHub API 로 가져와 내용 추출 → 청킹 서비스로 보냄(chunking-url, 없으면 기록만)
spring:
  autoconfigure:
    # DB 없음. 시험 클래스패스 등에 spring-jdbc 가 끌려오면 DataSource 자동구성이 켜지므로 끈다(search-service 와 같은 방식)
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
server:
  port: 8514
pmart:
  web:
    # GitHub 웹훅(중계 경유)은 Idempotency-Key·X-Source-System 을 보내지 않는다 — 대신 서명(X-Hub-Signature-256)과 전달 ID 로 확인
    excluded-paths:
      - /api/v1/internal/docs-webhook
  integration:
    docs:
      repository: code-and-pick/pmart-all-docs
      branch: main
      github-api-url: https://api.github.com
      include-extensions: [".md"]
      exclude-file-names: ["README.md"] # 폴더마다 있는 작성 규칙 — 문서가 아니다
      max-bytes: 524288
      timeout: 15s
      retries: 3
      # chunking-url: 청킹 서비스가 생기면 넣는다(POST, 본문 ExtractedDocument JSON). 없으면 추출만 하고 기록
