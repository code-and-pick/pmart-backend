# 의존성 좌표 중앙 관리 (.claude/rules/gradle-build.md)
# - 버전 정렬은 Spring Boot BOM + Spring Cloud BOM이 담당한다. 여기 [versions]에는 BOM이 관리하지 않는 것만 적는다.
# - BOM이 관리하는 라이브러리(spring-kafka, flyway, testcontainers, junit, mockito, assertj, postgresql, micrometer, otel …)는
#   [libraries]에 version 없이 선언한다.
# - 동적 버전·SNAPSHOT 금지. 서브프로젝트에서 버전을 다시 적지 않는다.
# - 확인일 2026-10-23: Boot 3.5는 OSS 지원 종료(2026-06). Boot 4.1은 짝이 되는 Spring Cloud 2026.0이 RC라 제외.

[versions]
java = "21"
spring-boot = "4.0.9"            # Spring Framework 7.0, Jakarta EE 11, JUnit 6, Testcontainers 2 관리
spring-cloud = "2025.1.4"        # Boot 4.0 호환 release train (api-gateway, config-server·config client)
springdoc = "3.0.3"              # Boot 4.0 라인 (3.1.x는 Boot 4.1용)
resilience4j = "2.4.0"           # resilience4j-spring-boot4
wiremock-spring-boot = "4.4.3"   # org.wiremock.integrations
ortools = "9.15.6755"            # Java 바인딩. mfc-capacity(사용 중)·delivery-dispatch·transport-routing(ADR-0050). 이 의존이 있는 서비스는 GraalVM Native 금지 — JVM 실행(ADR-0053)
confluent = "8.3.2"              # Schema Registry client + JSON Schema serializer (common-messaging에만)
jspecify = "1.0.0"
json-schema-validator = "3.0.8"  # networknt, Jackson 3. contracts/events JSON Schema 검증
aws-sdk = "2.55.11"              # AWS SDK for Java v2 BOM. S3 클라이언트(product-content 이미지, ADR-0016). 수집 저장소와 같은 버전
# 플러그인
spotless = "8.10.4"
sonarqube = "7.5.0.8588"
jib = "3.5.4"
spring-ai = "2.0.2"              # Spring AI 2.0.x = Boot 4.0/4.1 대상 GA(2026-06-12). ai-assistant-service 만 (ADR-0036)
openapi-generator = "7.26.0"   # contracts/openapi → Spring 인터페이스·DTO 생성 (2026-10-23 사용자 승인)                  # 컨테이너 이미지 (Dockerfile 없이 OCI 이미지 생성)

[libraries]
# --- BOM (platform()으로 적용) ---
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }

# --- Spring Boot starters (BOM 관리) ---
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-data-redis-reactive = { module = "org.springframework.boot:spring-boot-starter-data-redis-reactive" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-batch = { module = "org.springframework.boot:spring-boot-starter-batch" }
spring-boot-starter-batch-jdbc = { module = "org.springframework.boot:spring-boot-starter-batch-jdbc" } # Boot 4: Batch JDBC 작업 저장소. demos/mfc-demand-replenishment 만
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-integration = { module = "org.springframework.boot:spring-boot-starter-integration" } # integration-service 만(ADR-0095 — 문서 저장소 웹훅 흐름)
spring-integration-http = { module = "org.springframework.integration:spring-integration-http" } # integration-service 만 — 웹훅 HTTP 입구·청킹 서비스로 보내기. 판은 Boot BOM
spring-integration-test = { module = "org.springframework.integration:spring-integration-test" } # integration-service 시험(MockIntegration)
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-boot-starter-test-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-restclient-test = { module = "org.springframework.boot:spring-boot-starter-restclient-test" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# --- Spring Cloud (BOM 관리) ---
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" } # api-gateway
spring-cloud-config-server = { module = "org.springframework.cloud:spring-cloud-config-server" }  # config-server (ADR-0027)
spring-cloud-starter-config = { module = "org.springframework.cloud:spring-cloud-starter-config" } # 모든 서비스의 config client (기본 꺼짐, LAN 만 켬)
spring-cloud-starter-eureka-server = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server" } # eureka-server (ADR-0032)
spring-cloud-starter-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client" } # 모든 앱의 Eureka client (기본 꺼짐, LAN 만 켬. LoadBalancer 포함)
spring-cloud-commons = { module = "org.springframework.cloud:spring-cloud-commons" } # common-web 의 RestClient 로드밸런서 연결(compileOnly)
spring-cloud-config-monitor = { module = "org.springframework.cloud:spring-cloud-config-monitor" } # config-server 의 /monitor (GitHub 웹훅 → Bus, ADR-0033)
spring-cloud-starter-bus-kafka = { module = "org.springframework.cloud:spring-cloud-starter-bus-kafka" } # 설정 변경 알림(springCloudBus 토픽). 기본 꺼짐, LAN 만 켬 (ADR-0033)
spring-cloud-starter-stream-kafka = { module = "org.springframework.cloud:spring-cloud-starter-stream-kafka" } # 업무 이벤트 소비·DLT·재처리(Kafka 바인더, ADR-0035)
spring-ai-model = { module = "org.springframework.ai:spring-ai-model" }             # EmbeddingModel·ChatModel 추상화 (ai-assistant-service 만)
spring-ai-ollama = { module = "org.springframework.ai:spring-ai-ollama" }           # LAN Ollama 임베딩·대화(ADR-0051 결정 6) — RAG 서비스만, 자동 설정 starter 는 쓰지 않는다

# --- 데이터·메시징 (BOM 관리) ---
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
commons-codec = { module = "commons-codec:commons-codec" } # 버전 = Spring Boot BOM. mail-provisioner 의 SHA512-CRYPT(Sha2Crypt — docker-mailserver 계정 파일 형식)

# --- 관측 (BOM 관리) ---
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-zipkin = { module = "io.opentelemetry:opentelemetry-exporter-zipkin" }
# Boot 4 는 추적 자동구성이 별도 모듈: 없으면 Tracer·span 생성·Zipkin 전송이 모두 꺼진다(2026-10-24 LAN 배포에서 확인)
spring-boot-micrometer-tracing-opentelemetry = { module = "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry" }
spring-boot-zipkin = { module = "org.springframework.boot:spring-boot-zipkin" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version = "9.0" }

# --- 외부 라이브러리 (버전 고정) ---
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }
ortools-java = { module = "com.google.ortools:ortools-java", version.ref = "ortools" }
confluent-json-schema-serializer = { module = "io.confluent:kafka-json-schema-serializer", version.ref = "confluent" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3" }  # 버전은 aws-sdk-bom. product-content(상품 이미지)·customer(프로필 사진 사본)

# --- 테스트 (BOM 관리 + 일부 고정) ---
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core" }
assertj-core = { module = "org.assertj:assertj-core" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
wiremock-spring-boot = { module = "org.wiremock.integrations:wiremock-spring-boot", version.ref = "wiremock-spring-boot" }

# --- build-logic에서만 쓰는 플러그인 아티팩트 ---
plugin-spring-boot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
plugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
plugin-jib = { module = "com.google.cloud.tools:jib-gradle-plugin", version.ref = "jib" }
plugin-openapi-generator = { module = "org.openapitools:openapi-generator-gradle-plugin", version.ref = "openapi-generator" }

[bundles]
service-core = ["spring-boot-starter-webmvc", "spring-boot-starter-validation", "spring-boot-starter-actuator", "spring-boot-starter-restclient", "jspecify"]
service-data = ["spring-boot-starter-data-jpa", "spring-boot-starter-jdbc", "spring-boot-starter-flyway", "flyway-postgresql", "postgresql"]
service-kafka = ["spring-boot-starter-kafka", "spring-kafka"]
service-observability = ["micrometer-registry-prometheus", "micrometer-tracing-bridge-otel", "opentelemetry-exporter-zipkin", "spring-boot-micrometer-tracing-opentelemetry", "spring-boot-zipkin", "logstash-logback-encoder"]
test-unit = ["junit-jupiter", "mockito-core", "assertj-core"]
test-integration = ["spring-boot-starter-test", "spring-boot-testcontainers", "testcontainers-junit-jupiter", "testcontainers-postgresql", "testcontainers-kafka", "spring-kafka-test"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
