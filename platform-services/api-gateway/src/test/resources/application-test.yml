# 테스트: JWKS 는 조회하지 않는다(mockJwt 사용). 업스트림은 WireMock 이 pmart.gateway.upstream.* 를 덮어쓴다.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:1/jwks
  data:
    redis:
      url: redis://localhost:1 # 단위 테스트는 Redis 없이: 처리율 제한 비활성
  cloud:
    function:
      definition: "" # 주체 차단 사건 함수(subjectBlocks)를 Kafka 에 붙이지 않는다 — 단위 시험은 Kafka 없음
pmart:
  gateway:
    rate-limit:
      enabled: false
    subject-blocklist:
      enabled: false # Redis 없음 — 확인 필터·사건 함수 없음(SubjectBlockFilterTest 가 따로 본다)
    cors:
      allowed-origins: http://localhost:5173
      credentialed-origins: http://localhost:5174 # 쿠키 CORS(ADR-0059) — 일반 출처와 다르게 두어 둘이 섞이지 않는지 본다
management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      export:
        enabled: false
