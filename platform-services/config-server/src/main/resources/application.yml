# config-server (ADR-0027·0029). Spring 앱들이 부팅할 때 GET /{application}/{프로필} 로 설정을 받는다(프로필: local·lan·prod).
# - 설정 저장소: GitHub code-and-pick/pmart-config (private). 저장소 최상위의 application(-<프로필>).yml·<앱>(-<프로필>).yml 이 정본(ADR-0029).
# - 비밀값은 '{cipher}…'(AES, encrypt.key·salt)로 저장소에 두고 여기서 복호화해 내려준다(server-side decryption).
# - 서버 자신의 비밀(encrypt.key·salt, Basic 인증 비밀번호, GitHub Deploy key)은 파일 디렉터리로 받는다(configtree,
#   파일 이름 = 속성 이름). 여러 줄 PEM 키를 환경변수로 넘기지 않기 위해서다. 저장소·이미지·application.yml 에 두지 않는다.
# - 실행 중 갱신(ADR-0033): GitHub push 웹훅(smee.io 중계) → POST /monitor → Bus(Kafka springCloudBus) → 바뀐 파일의 앱이 다시 받아 간다.
spring:
  application:
    name: config-server
  profiles:
    group:
      local: native # 개발자 PC 는 파일 저장소(application-local.yml) — git clone 을 건드리지 않는다
  config:
    import: "optional:configtree:${PMART_CONFIG_SECRETS_DIR:/run/secrets/config-server}/"
  cloud:
    bus:
      # Bus 는 기본 꺼짐(common-observability). LAN 은 compose 환경변수 SPRING_CLOUD_BUS_ENABLED·SPRING_KAFKA_BOOTSTRAP_SERVERS 로 켠다.
      # 서버는 알림을 보내기만 한다 — 자기 설정은 저장소에서 오지 않으니 받은 갱신 요청으로 자신을 갱신하지 않는다
      refresh:
        enabled: false
      # 받은 알림에 ack 를 보내지 않는다. 서버는 자기가 보낸 '*'(모든 앱) 알림도 Kafka 에서 다시 받는데, 그 ack 를 소비 스레드에서
      # StreamBridge 로 보내는 동안 /monitor 요청 스레드의 StreamBridge 가 RefreshRemoteApplicationEvent 마다 채널을 닫으며 같은
      # 맵을 돌아 ConcurrentModificationException → /monitor 500(2026-11-03 MonitorBusIT 에서 재현). ack 는 추적(trace)용이라 쓰지 않는다
      ack:
        enabled: false
    config:
      enabled: false # 서버 자신은 config client 로 동작하지 않는다
      server:
        monitor:
          # 바뀐 파일 이름 → 갱신할 앱: cart-service-lan.yml → cart-service, application*.yml → 모든 앱(*)
          max-paths: 100 # 한 push 의 파일 수 상한(기본 20 — 넘으면 뒤 파일의 앱이 빠진다)
          github:
            # webhook-secret 은 configtree 파일 spring.cloud.config.server.monitor.github.webhook-secret(GitHub 웹훅 설정과 같은 값).
            # 서명(X-Hub-Signature-256)이 맞지 않거나 비밀이 없으면 /monitor 는 403(WebhookValidatorFilter, Security 보다 먼저)
            validation-enabled: true
          # GitHub 만 받는다
          gitlab: { enabled: false }
          bitbucket: { enabled: false }
          gitea: { enabled: false }
          gitee: { enabled: false }
          gogs: { enabled: false }
        # /{app}/{profile} 응답의 비밀값을 복호화해서 내려준다. 복호화 실패 값은 invalid.<key> 로 표시된다
        encrypt:
          enabled: true
        git:
          uri: ${PMART_CONFIG_GIT_URI:git@github.com:code-and-pick/pmart-config.git}
          default-label: main
          clone-on-start: true # 저장소에 닿지 못하면 기동 실패(조용히 빈 설정을 주지 않는다)
          force-pull: true # 로컬 사본이 더러워져도 원격 기준
          timeout: 10 # 초
          ignore-local-ssh-settings: true
          # private-key·host-key·host-key-algorithm 은 configtree 파일로 받는다(GitHub ed25519 호스트 키, 지문 확인 후 기록)
          strict-host-key-checking: true
  security:
    user:
      name: ${PMART_CONFIG_USERNAME:pmart}
      # password 는 configtree 파일 spring.security.user.password. 없으면 기동 시 무작위 값(아무도 못 읽음)
# Eureka(ADR-0032)에 등록하지 않는다: 다른 앱이 config-server 를 Eureka 로 찾지 않고(먼저 떠야 한다) 설정 저장소도 읽지 않는다
eureka:
  client:
    enabled: false
server:
  port: 8888
# 업무 API 가 없다 — convention 이 넣는 springdoc 문서 엔드포인트를 끈다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
# encrypt.key·encrypt.salt 는 configtree 파일로만 받는다. 없으면 {cipher} 값은 복호화되지 않는다(invalid.*)
management:
  endpoint:
    health:
      show-details: never
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
# /encrypt·/decrypt 는 SecurityConfig 가 막는다. 암호화는 configCipher 태스크(ConfigCipherTool)로 한다
---
# Vault 백엔드(ADR-0101): LAN 은 SPRING_PROFILES_ACTIVE=git,vault — config-server 가 Git(일반 설정·전환 중 {cipher}) 과
# Vault(서비스 비밀 config/<앱>,<프로필>) 를 합쳐 내려준다. 서비스는 Vault 를 모른다.
# - 같은 속성은 Vault 가 이긴다(order 가 작을수록 앞 = 우선). 목록은 서비스가 우선순위 높은 출처 하나에서 통째로 받는다(ADR-0100 결정 7)
# - 인증: AppRole config-server(정책 config-server-read, config/data/* 읽기만). role-id·secret-id 는 configtree 파일
#   spring.cloud.config.server.vault.app-role.role-id·secret-id(위 import 의 비밀 디렉터리) — Git·이미지·이 파일에 두지 않는다
# - TLS: LAN 사설 CA(PEM)를 VaultTrustStorePostProcessor 가 PKCS12 신뢰 저장소로 바꿔 넣는다
# - Vault 에 닿지 못하거나 로그인이 안 되면 응답이 실패한다(failOnCompositeError 기본 true) — 비밀 없이 서비스가 뜨지 않게
spring:
  config:
    activate:
      on-profile: vault
  cloud:
    config:
      server:
        git:
          order: 2
        vault:
          order: 1
          host: ${PMART_VAULT_HOST:192.168.0.34}
          port: ${PMART_VAULT_PORT:8200}
          scheme: https
          backend: config
          kv-version: 2
          profile-separator: ","
          authentication: APPROLE
pmart:
  config:
    vault:
      ca-pem: ${PMART_VAULT_CA_PEM:/etc/pmart-vault/ca.pem}
