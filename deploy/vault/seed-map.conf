# seed.sh 가 읽는 이관 표 — 값은 없다(파일 경로만). 한 줄: <Vault 경로(pmart/ 아래)> <필드> <종류> <원본 파일(묶음 폴더 기준, glob 가능)>
#   종류  line   : 한 줄 값(앞뒤 줄바꿈·CR 제거)
#         raw    : 파일 내용 그대로(JSON 등)
#         base64 : 바이너리 → base64 한 줄
#         env    : KEY=VALUE 파일 — 키마다 필드로 넣는다(필드 칸은 '-'). 값을 감싼 따옴표는 뗀다
# 필드 이름 = 서비스가 받는 환경변수 이름(pmart-native runtime/gen-apps.sh·pmart-config). 앱 env 는 원래 키 이름 그대로.
# 묶음 구조: pmart-keys-pc6(PC 1 이 2026-11-28 만든 묶음) — 저장소 이름부터 원래 위치를 따른다.

shared/payment-service                  PMART_TOSS_SECRET_KEY              line    pmart-backend/deploy/lan/.secrets/toss-secret-key
shared/payment-service                  PMART_TOSS_CLIENT_KEY              line    pmart-backend/deploy/lan/.secrets/toss-client-key
shared/delivery-serviceability-service  PMART_KAKAO_REST_API_KEY           line    pmart-backend/deploy/lan/.secrets/kakao-rest-api-key
shared/delivery-tracking-service        PMART_KAKAO_MOBILITY_REST_API_KEY  line    pmart-backend/deploy/lan/.secrets/kakao-mobility-rest-api-key
shared/auth-service                     PMART_KAKAO_ADMIN_KEY              line    pmart-backend/deploy/lan/.secrets/kakao-admin-key.txt
shared/rider-auth-service               PMART_KAKAO_RIDER_ADMIN_KEY        line    pmart-backend/deploy/lan/.secrets/kakao-rider-admin-key.txt
shared/customer-service                 PMART_OCTOMO_API_KEY               line    pmart-backend/deploy/lan/.secrets/octomo-api-key.txt
shared/rider-service                    PMART_OCTOMO_API_KEY               line    pmart-backend/deploy/lan/.secrets/octomo-api-key.txt
shared/notification-service             PMART_FCM_SERVICE_ACCOUNT_JSON     raw     pmart-backend/deploy/lan/.secrets/pmart-123-firebase-adminsdk-*.json
# RAG 문서 웹훅(2026-11-28) — 이 PC 저장소에는 아직 환경변수 이름이 없어 PMART_RAG_DOCS_* 로 정했다(서비스에 붙일 때 맞춘다)
shared/rag-docs                         PMART_RAG_DOCS_GITHUB_TOKEN        line    pmart-backend/deploy/lan/.secrets/rag-docs-github-token
shared/rag-docs                         PMART_RAG_DOCS_WEBHOOK_SECRET      line    pmart-backend/deploy/lan/.secrets/rag-docs-webhook-secret
shared/rag-docs                         PMART_RAG_DOCS_SMEE_URL            line    pmart-backend/deploy/lan/.secrets/rag-docs-smee-url
# 앱·시뮬레이터
shared/clients/customer-app             -                                  env     pmart-clients/apps/customer_app/.secrets/customer.env
shared/clients/customer-app             GOOGLE_SERVICES_JSON               raw     pmart-clients/apps/customer_app/android/app/google-services.json
shared/clients/rider-app                -                                  env     pmart-clients/.secrets/rider.env
shared/clients/rider-app                GOOGLE_SERVICES_JSON               raw     pmart-clients/apps/rider_app/android/app/google-services.json
shared/clients/rider-simulation         -                                  env     pmart-rider-simulation/.env.local
shared/clients/android                  ANDROID_DEBUG_KEYSTORE_B64         base64  USERPROFILE/.android/debug.keystore
