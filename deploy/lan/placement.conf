# LAN 배치 정보 (PC 수 가변). 한 줄 = PC 하나: <이름> <IP> <ssh 별칭> <구성요소...>
# - 구성요소: 서비스 이름(services/, platform-services/ 디렉토리명) 또는 인프라(postgres kafka-1 kafka-2 kafka-3 connect redis zipkin s3 es-search es-logs logstash-search logstash-logs kibana prometheus alertmanager grafana)
# - postgres 는 DB 가 필요한 서비스가 있는 PC 마다 둔다(그 PC 서비스의 DB 만 만든다).
# - kafka-1·kafka-2·kafka-3(ADR-0037)은 한 KRaft 클러스터의 세 노드(브로커+컨트롤러) — 서로 다른 PC 에 하나씩. 9092·9094 공개.
# - connect·redis·zipkin 은 전체에서 한 번씩. auth-service 도 하나(JWKS·발급). rider-auth-service(라이더 토큰 발급자, ADR-0054 E)도 하나 — PC 5, 같은 PC postgres 에 DB. employee-auth-service(직원 토큰 발급자, ADR-0056)도 하나 — PC 5(Keycloak 과 같은 Docker 네트워크에서 코드 교환), 같은 PC postgres 에 DB. 줄 끝에 붙인다(고정 IP 가 순서로 정해짐).
# - s3(SeaweedFS, ADR-0016)는 product-content-service 와 같은 PC 에 둔다.
# - keycloak(ADR-0054, 직원 로그인 — Realm pmart-staff)은 전체에서 한 번. 같은 PC 의 postgres 에 DB·계정 keycloak 을 둔다. LAN 8180 공개(로그인 화면·토큰 발급자 주소).
# - rag-pgvector(RAG 전용 PostgreSQL + pgvector)·ollama(모델 서버, GPU)는 RAG 서비스(ai-assistant·customer-assistant)와 같은 PC 에(ADR-0051). 처음 pc2, 2026-11-10 사용자 결정으로 pc5 로 옮김 —
#   주문·결제와 CPU 를 나누지 않게(GPU 를 넘치면 모델이 CPU 로 돈다). 색인은 옮기지 않고 lan.sh rag-ingest·rag-ingest-customer 로 다시 만든다, 모델은 다시 받는다.
# - 검색·로그 ES 분리(ADR-0038): es-search(상품 검색 색인, 9200)·logstash-search(Kafka → 검색 색인)를 한 PC, es-logs(앱 로그, 9200)·logstash-logs(Filebeat 5044)·kibana(5601)를 다른 PC 에.
#   각 ES·Logstash 메모리 상한 약 1.5GB. 같은 PC 에 두 ES 를 두면 9200 이 겹친다.
# - config-server(ADR-0027)는 전체에서 한 번. 모든 Spring 앱이 부팅할 때 설정을 받는다(8888). lan.sh deploy 는 이것부터 띄운다.
# - config-relay(ADR-0033, GitHub 웹훅 중계)는 적지 않는다: render.sh 가 config-server PC 에 자동으로 붙인다(포트 없음).
# - eureka-server(ADR-0032, 8761)는 전체에서 한 번. 앱은 자기 PC IP + 포트로 등록하고, 게이트웨이·서비스 간 호출이 여기서 주소를 찾는다.
# - prometheus·alertmanager·grafana(ADR-0030)·kafka-exporter(ADR-0037, 9308)는 전체에서 한 번. log-shipper(Filebeat)·host-disk 는 render 가 모든 PC 에, es-init-<종류>·es-exporter-<종류> 는 각 ES PC 에, log-janitor 는 es-logs PC 에 자동으로 붙인다.
# - hr-backoffice-web(인사팀 백오피스 Nginx, 8081, 2026-11-13)도 PC 4 — 게이트웨이 CORS 출처 :8081. 파일은 lan.sh publish-hr-backoffice.
# - backoffice-web(임시 백오피스 Nginx, 80)은 게이트웨이 CORS 출처(pmart-config api-gateway-lan.yml: http://d603-16)와 같은 PC. 파일은 lan.sh publish-backoffice.
# - LAN 포트를 열지 않는 구성요소(rag-pgvector·ollama·logstash-search 등)를 새로 두면 deploy/lan/watch.sh 의 check() 에 점검 방법을 같이 넣는다.
#   목록에 없으면 Spring 앱으로 보고 LAN 에서 /actuator/health 를 불러 늘 실패 → 10분마다 재시작된다(2026-11-09 rag-pgvector·ollama).
# - 새 구성요소는 줄 끝에 붙인다: 컨테이너 고정 IP 가 배치 순서로 정해져서, 중간에 넣으면 뒤 구성요소의 IP 가 모두 바뀐다.
#   줄 끝에 붙여도 render 가 자동으로 붙이는 log-shipper·host-disk(등)는 그 뒤라 IP 가 한 칸씩 밀린다 → 새 구성요소 배포 전에 그 PC 의
#   host-disk·log-shipper 를 먼저 다시 띄운다(뒤에서부터). 안 하면 "Address already in use"(2026-11-16 review-service).
# - 줄 끝 \ 로 이어 쓸 수 있다. 바꾼 뒤: deploy/lan/lan.sh render
# PC5(192.168.0.101, D603-13, 2026-11-10 추가): 배송 서비스 6개(PC3 에서 옮김 — DB 는 새로, 옮길 데이터 없음). 다른 프로젝트(cardcapture) 컨테이너가 같이 돈다(127.0.0.1 포트만).
# 인사(ADR-0056 5-5, 2026-11-13): hr-service(8512)·mail-provisioner(LAN 포트 없음, mailserver 와 같은 PC 필수)는 PC 5. 게이트웨이는 Eureka 로 hr-service 를 찾는다.
# 사내 메일(ADR-0056 결정 9, 2026-11-12): mailserver(LAN 포트 없음)·roundcube(8190 HTTPS, ADR-0057 사설 CA) — Keycloak 과 같은 PC 5. 렌더 전에 lan.sh tls-issue pc5.
# PC1(192.168.0.32, 2026-11-15 사용자 "pc1에도 컨테이너를 몇개 놔둬서 다른쪽 부담 덜어내고싶은데"): 빌드·Claude Code PC 라 **꺼져도 업무가 멈추지 않는 것만** 둔다 —
#   감시 묶음 1단계(zipkin·prometheus·alertmanager·grafana, PC4 에서 옮김). 로그 묶음(es-logs·logstash-logs·kibana)은 **PC4 에 둔다**
#   (2026-11-16 사용자 "옮기면 안 되겠다" — 묶음 약 2.9GiB·한도 4GiB, PC1 여유 6.9GB 에서 빌드·Testcontainers 와 겹치면 빠듯).
#   SSH 서버가 없어 lan.sh·run-ps.sh 가 pmart-pc1 은 이 PC 에서 바로 실행한다.
# review-service(8108, 2026-11-16 리뷰 1차 — ADR-0063)는 commerce 와 같은 PC 2, 줄 끝(고정 IP 순서). 사진 버킷 pmart-review 는 같은 PC s3.
# promotion-service(8109, 2026-11-20 쿠폰·기간 할인 — ADR-0082)는 commerce 와 같은 PC 2, 줄 끝(고정 IP 순서).
# integration-service(8514, ADR-0095 문서 저장소 웹훅 흐름)·chunking-service(8515, ADR-0096 청킹 → es-search RAG 색인)·embedding-service(8516, ADR-0098 ES 청크 → Ollama → rag-pgvector embedding_service)·rag-query-service(8517, ADR-0099 질문 검색 — ES 먼저 → 벡터)는 2026-11-28 RAG 묶음과 같은 PC 2, 줄 끝(render.sh LATE — 고정 IP 순서). 웹훅 중계 docs-relay 는 render 가 붙인다. 셋 다 PC 2 안에서만 불린다(NO_EXTRA_HOST).
# RAG 묶음(rag-pgvector·ollama·ai-assistant·customer-assistant)은 2026-11-15 PC5 → PC2(PC5 메모리 — 로그인·배송·메일이 몰림). ollama CPU 4 상한이라 주문·결제 CPU 몫이 남는다.

