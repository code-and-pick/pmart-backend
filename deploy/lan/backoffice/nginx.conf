# 백오피스(React SPA, pmart-clients web/backoffice) · 인사팀 백오피스(web/hr-backoffice) 정적 서빙 — PC 4. 두 앱이 이 설정을 같이 쓴다.
# 포트: 백오피스 443(HTTPS), 인사팀 8444(HTTPS), MFC 백오피스 8445(HTTPS, 2026-11-15), 라이더 백오피스 8446(HTTPS, 2026-11-17) — compose 가 호스트 포트를 나눈다. 인증서 = 이 PC 서버 인증서(LAN 사설 CA, ./tls — render.sh).
# HTTP(80·8081)는 2026-11-13 닫았다(사용자 "빌드 옮기고 닫아주고", ADR-0057 T3) — 화면을 내주지 않고 HTTPS 주소로 넘긴다(301):
# 80 → https://<호스트>, 8081 → https://<호스트>:8444, 8082 → https://<호스트>:8445, 8084 → https://<호스트>:8446.
# API 는 브라우저가 게이트웨이 https://…:8443 를 직접 부른다(게이트웨이 CORS 허용 출처).
#
# 보안 헤더(2026-11-13): CSP 는 같은 출처 스크립트·스타일만(인라인 스크립트·eval·인라인 스타일 없음 — 빌드 확인), API·이미지는 게이트웨이,
# 다른 사이트가 틀(frame)에 넣지 못하게. nginx 는 location 에 add_header 가 있으면 server 의 것을 물려받지 않아 location 마다 둔다.

# HTTP 로 온 주소 → HTTPS 주소(호스트 포트 8081 이면 인사팀 8444, 그 밖은 443)
map $http_host $pmart_https_origin {
    ~^(?<h>[^:]+):8081$     https://$h:8444;
    ~^(?<h>[^:]+):8082$     https://$h:8445;
    ~^(?<h>[^:]+):8084$     https://$h:8446;
    ~^(?<h>[^:]+)(:80)?$    https://$h;
    default                 https://$host;
}

server {
    listen 80;
    server_name _;
    return 301 $pmart_https_origin$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate     /etc/pmart-tls/cert.pem;
    ssl_certificate_key /etc/pmart-tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 해시가 붙은 빌드 산출물은 내용이 바뀌면 이름이 바뀐다 → 길게 캐시
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 그 밖(라우터 경로 포함)은 index.html — 새 배포가 바로 보이도록 캐시하지 않는다
    # 카카오 지도(2026-11-18 — 라이더 백오피스 관제): SDK(dapi.kakao.com)·지도 스크립트(*.kakaocdn.net·*.daumcdn.net)·지도 조각 이미지만 연다.
    # 키 도메인 등록은 카카오 콘솔(https://192.168.0.40:8446). 다른 외부 출처는 그대로 막는다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://dapi.kakao.com https://*.kakaocdn.net https://*.daumcdn.net; style-src 'self'; img-src 'self' data: blob: https://*.kakaocdn.net https://*.daumcdn.net https://192.168.0.40:8443 https://d603-16:8443; font-src 'self' data:; connect-src 'self' https://dapi.kakao.com https://192.168.0.40:8443 https://d603-16:8443; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }
}
