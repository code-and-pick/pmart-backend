# Vault 에서 비밀을 직접 읽을 앱(ADR-0100) — render.sh 가 읽는다. 한 줄에 앱 이름 하나, 또는 all(전부). # 뒤는 주석.
# 여기가 정본이다: lan.sh deploy 는 매번 render 하므로, 켠 앱을 여기에 커밋해 두어야 누가 배포해도 Vault 설정이 빠지지 않는다.
# 순서(ADR-0100 결정 9): 비움(지금) → payment-service 하나 → 확인 → all → 그 뒤에만 pmart-config 의 {cipher} 삭제.
# 앱을 넣기 전에 pc2 deploy/vault/service-roles.sh 로 AppRole 이 있는지(없으면 render 가 멈춘다), 배포 토큰 파일
# deploy/lan/.secrets/vault-deployer-token 이 PC 1 에 있는지 본다 — 앱이 하나라도 있으면 모든 deploy 가 토큰을 쓴다(파일은 계속 둔다).
# config-server(ADR-0101): config-server 를 적으면 config-server 가 Git + Vault 복합 백엔드로 비밀을 내려준다(all 에는 들지 않는다).
#   서비스 이름 줄은 ADR-0101 ④ 에서 지운다(서비스는 Vault 를 직접 읽지 않게).
# 셸의 PMART_VAULT_APPS 가 있으면 이 파일보다 우선한다(시험용 — 배포에 쓰지 않는다).
# 2026-11-28 22:3x 되돌림: all 로 켜니 pc3·4·5 앱이 Vault 로그인 실패(pc2 Docker Desktop 포트 공개가 출발지 IP 를 172.20.0.1 로 바꿔 AppRole CIDR 에 걸림)
