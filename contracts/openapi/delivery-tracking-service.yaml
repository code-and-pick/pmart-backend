openapi: 3.1.0
info:
  title: delivery-tracking-service
  version: 0.6.0
  description: |
    라이더 위치(좌표·갱신 시각·정확도), 이동 이력, 권역 내/외·GPS 오류·갱신 지연 기록, 거리·이동시간 행렬(카카오모빌리티 길찾기 — ADR-0058, 직선거리로 대신하지 않는다), ETA, 지연 자동 알림 트리거, 실시간 푸시의 정본. (docs/architecture/service-map.md §7)
    배송 상태 확정(execution)은 소유하지 않는다. GPS만으로 픽업·전달을 처리하지 않는다.
    0.4.0(2026-11-16, DD-2 오배송 회수): `GET /internal/riders/{riderId}/location-at` — 정한 시각에 가장 가까운 위치 점(dispatch 가 원래 라이더가 완료를 누른 곳을 회수지로).
    ETA 노출 범위는 점원 픽업지·배달지 둘 다, 고객 본인 배송지만. 타 고객 주소·전체 동선은 비노출. 산출 불가 시 "위치 확인 중/ETA 확인 중" 상태로 응답한다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: locations, description: 라이더 위치 수신 }
  - { name: eta, description: ETA 조회·실시간 구독 }
  - { name: internal, description: 거리 행렬 (dispatch) }

paths:
  /riders/me/locations:
    post:
      tags: [locations]
      summary: 위치 배치 수신 (라이더 앱; 다건 업로드)
      description: |
        단말 시각 순으로 정렬해 저장. 정확도 불량·권역 밖·시간 역전은 기록하되 폐기하지 않는다(gpsQuality에 표기).
        갱신 지연이 임계를 넘으면 RiderLocationStale 발행. 위치 수신은 배송 상태를 바꾸지 않는다.
      operationId: uploadMyLocations
      x-pmart-user-types: [RIDER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationBatch' }
      responses:
        '202':
          description: 접수 (appliedQty = 저장된 점 수)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /riders/me/locations/latest:
    get:
      tags: [locations]
      summary: 내 마지막 수신 위치·품질 조회 (업로드 확인용)
      operationId: getMyLatestLocation
      x-pmart-user-types: [RIDER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderLocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /deliveries/{deliveryId}/eta:
    get:
      tags: [eta]
      summary: ETA 조회 (고객 drop만 / 점원 pickup+drop)
      description: |
        호출자 역할에 따라 범위가 다르다. 고객 토큰은 본인 주문 배송의 dropEta만, 점포 직원·운영자는 pickupEta·dropEta 모두.
        라이더 미배정·위치 미수신·행렬 조회 실패면 status LOCATING / ETA_PENDING 으로 응답하고 수치는 비운다.
        라이더 좌표(0.6.0, 2026-11-17 사용자 결정): 고객은 픽업 뒤(TO_CUSTOMER·AT_CUSTOMER)만 `riderLocation`, 직원은 배정 뒤. 그 전·끝난 뒤는 null.
        **구현(0.5.0, 2026-11-17 — TR-3)**: 고객 소유 = 배송 → 주문 → order 내부 조회 accountId(남의·모르는 배송 404). 직원 = execution 과 같은 범위
        (OPERATOR_ADMIN·CS_AGENT·RIDER_OPS 모든 센터, 그 밖 운영자는 그 센터 권한 — 아니면 404). 라이더·서비스 403.
        진행 단계는 배송 사건 사본(이 서비스가 배포된 뒤 만들어진 배송부터 — 그 전 배송은 404). ETA 계산이 꺼져 있으면(pmart.tracking.eta 설정 없음) ETA_PENDING.
        Cache-Control no-store.
      operationId: getDeliveryEta
      x-pmart-user-types: [CUSTOMER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryEta' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /deliveries/{deliveryId}/stream:
    get:
      tags: [eta]
      summary: 실시간 ETA·진행 구독 (SSE; WebSocket 동등 채널)
      x-stream: true
      x-stream-protocols: [SSE, WEBSOCKET]
      description: |
        text/event-stream 으로 DeliveryEta 갱신과 진행 단계(execution 이벤트 사본)를 푸시한다. WebSocket은 같은 경로에 Upgrade 요청으로 접속하며 메시지 본문은 동일한 StreamEvent.
        노출 범위는 GET /eta와 같다(고객은 drop만, 라이더 좌표 비노출). 연결 끊김 시 Last-Event-ID로 재개. 배송 종료(COMPLETED/FAILED/CANCELLED) 이벤트 후 서버가 닫는다.
        **구현(0.5.0, 2026-11-17 — TR-3)**: SSE 만(WebSocket 은 아직 없음). 접속 즉시 지금 상태(ETA_UPDATED), 그 뒤 서버가 몇 초마다 사본을 읽어 단계가 바뀌면 STAGE_CHANGED,
        도착 예정이 바뀌면 ETA_UPDATED, 15초마다 HEARTBEAT, DONE 이면 STREAM_END 를 보내고 닫는다(최대 연결 시간 뒤에도 닫음 — 다시 접속).
        id = 상태 지문(단계·도착 예정) — Last-Event-ID 가 지금 상태와 같으면 첫 이벤트를 건너뛴다. 권한·404 판정은 접속 때 한 번.
      operationId: streamDeliveryTracking
      x-pmart-user-types: [CUSTOMER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 이벤트 스트림
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/StreamEvent' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/distance-matrix:
    post:
      tags: [internal]
      summary: "[dispatch→tracking] 거리·이동시간 행렬 (출발지 × 도착지)"
      description: |
        카카오모빌리티 길찾기 API 의 도로 거리·예상 소요시간(원문 §2.1 ②, ADR-0058 결정 2 — 사용자 2026-11-13 '직선거리만으로 원래 기능을 대체하지 않는다').
        외부 조회가 안 되면 직선거리로 대신하지 않고 오류로 돌려준다: 키 미설정·거절 422 CONFIG_REQUIRED, 사용량 소진 429 QUOTA_EXCEEDED, 장애·시간 초과 503 DEPENDENCY_UNAVAILABLE.
        구간 하나가 길을 못 찾으면(카카오 결과 코드 ≠ 0, 반경 10km 밖 등) 그 칸만 status NO_ROUTE.
        **좌표는 본문으로 받는다**(URL 쿼리는 추적 기록 http.url 에 남는다 — 라이더·고객 위치, PC 1 검토 H3 2026-11-13). origins·destinations 각각 최대 30개. 조회지만 POST 라 공통 규칙대로 Idempotency-Key·X-Source-System 을 받는다(매 요청 새 값, 저장·재생 없음). 도착지가 하나면 다중 출발지 길찾기 1번, 아니면 출발지마다 다중 목적지 길찾기 1번.
        카카오모빌리티 길찾기는 자동차 도로 기준이다 — vehicleType 은 받기만 하고 모든 수단에 같은 도로 경로를 쓴다(이륜·자전거 전용 경로 없음).
      operationId: getDistanceMatrix
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistanceMatrixRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistanceMatrix' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
        '429':
          description: QUOTA_EXCEEDED — 카카오모빌리티 사용량 소진
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/rider-locations:
    get:
      tags: [internal]
      summary: "[dispatch→tracking] 여러 라이더 마지막 위치 (서비스 토큰 없음 내부 호출)"
      description: |
        배차 후보 라이더들의 마지막 수신 위치를 한 번에 돌려준다(반경 판정은 dispatch — 직선, 사용자 2026-11-13). 위치가 없는 라이더는 빠진다.
      x-added-in: '2026-11-13'
      operationId: listRiderLocationsInternal
      parameters:
        - { name: riderIds, in: query, required: true, style: form, explode: false, schema: { type: array, minItems: 1, maxItems: 200, items: { type: string } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RiderLocation' } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/riders/{riderId}/location:
    get:
      tags: [internal]
      summary: "[dispatch/case→tracking] 라이더 현재 위치·품질 조회 (서비스 토큰)"
      operationId: getRiderLocationInternal
      parameters:
        - { name: riderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderLocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/riders/{riderId}/location-at:
    get:
      tags: [internal]
      summary: "[dispatch→tracking] 정한 시각에 가장 가까운 라이더 위치 점 (토큰 없는 내부 호출)"
      description: |
        2026-11-16 DD-2(오배송 회수 — 사용자 "추천대로": 회수지는 원래 라이더가 전달 완료를 누른 곳). `at` 앞뒤 `pmart.tracking.location-at-window`(3분) 안에서
        단말 기록 시각(recordedAt)이 가장 가까운 점 하나. 품질 무관(GPS 오류 점도 — quality 로 알린다). 없으면(보존 30일 지남·위치 안 보냄) 404 LOCATION_NOT_FOUND.
        좌표는 응답 본문에만(URL 에는 시각만).
      x-added-in: '2026-11-16'
      operationId: getRiderLocationAtInternal
      parameters:
        - { name: riderId, in: path, required: true, schema: { type: string } }
        - { name: at, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK — staleSinceSeconds·inServiceZone 은 비운다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderLocation' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    LocationPoint:
      type: object
      required: [lat, lng, recordedAt]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number, minimum: 0 }
        speedMps: { type: number }
        headingDeg: { type: number }
        recordedAt: { type: string, format: date-time, description: 단말 시각 }
        deliveryId: { type: string, description: 진행 중 배송 연결(선택) }
    LocationBatch:
      type: object
      required: [points]
      properties:
        deviceId: { type: string }
        points: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/LocationPoint' } }
    GpsQuality:
      type: string
      enum: [GOOD, LOW_ACCURACY, OUT_OF_ZONE, TIME_SKEW, STALE, UNKNOWN]
    RiderLocation:
      type: object
      properties:
        riderId: { type: string }
        lat: { type: number }
        lng: { type: number }
        accuracyM: { type: number }
        recordedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        quality: { $ref: '#/components/schemas/GpsQuality' }
        inServiceZone: { type: boolean }
        staleSinceSeconds: { type: integer, description: 마지막 수신 이후 경과 초 }
    EtaStatus:
      type: string
      description: AVAILABLE 산출됨. LOCATING 위치 확인 중. ETA_PENDING ETA 확인 중(행렬 조회 실패·미배정). FINAL 배송 종료
      enum: [AVAILABLE, LOCATING, ETA_PENDING, FINAL]
    EtaLeg:
      type: object
      properties:
        status: { $ref: '#/components/schemas/EtaStatus' }
        etaAt: { type: string, format: date-time }
        remainingDistanceM: { type: integer }
        remainingSeconds: { type: integer }
        delayedBySeconds: { type: integer, description: 약속 시간 대비 지연(양수면 지연) }
        calculatedAt: { type: string, format: date-time }
    DeliveryEta:
      type: object
      properties:
        deliveryId: { type: string }
        stage: { type: string, enum: [UNASSIGNED, TO_STORE, AT_STORE, TO_CUSTOMER, AT_CUSTOMER, DONE] }
        outcome: { type: [string, 'null'], enum: [COMPLETED, FAILED, CANCELLED, null], description: 'DONE 일 때 결과(0.5.0)', x-added-in: '2026-11-17' }
        pickupEta: { $ref: '#/components/schemas/EtaLeg', description: 점원·운영자에게만 }
        dropEta: { $ref: '#/components/schemas/EtaLeg' }
        arrivalWindow:
          type: object
          properties:
            date: { type: string, format: date }
            start: { type: string }
            end: { type: string }
        delayAlertTriggered: { type: boolean }
        riderLocationQuality: { $ref: '#/components/schemas/GpsQuality', description: 라이더 마지막 위치의 품질(riderLocation 이 있을 때) }
        riderLocation:
          type: [object, 'null']
          x-added-in: '2026-11-17'
          description: |
            라이더 마지막 위치(0.6.0 — 사용자 결정 2026-11-17 "픽업 뒤 정확한 위치"). 고객은 **내 상품을 픽업한 뒤 ~ 끝나기 전**(TO_CUSTOMER·AT_CUSTOMER)만,
            직원은 배정 뒤 ~ 끝나기 전. 지금 한 점만(지나온 동선 없음). 위치가 아직 없으면 null.
          properties:
            lat: { type: number }
            lng: { type: number }
            recordedAt: { type: string, format: date-time, description: 단말이 기록한 시각 }
            staleSeconds: { type: integer, description: 서버가 받은 뒤 지난 초 }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    StreamEvent:
      type: object
      description: SSE 각 event의 data 본문 (event 필드는 type과 동일)
      required: [type, deliveryId, sentAt]
      properties:
        id: { type: string, description: Last-Event-ID 재개용 }
        type: { type: string, enum: [ETA_UPDATED, STAGE_CHANGED, LOCATION_STALE, DELAY_ALERT, STREAM_END, HEARTBEAT] }
        deliveryId: { type: string }
        sentAt: { type: string, format: date-time }
        eta: { $ref: '#/components/schemas/DeliveryEta' }
        stage: { type: string }
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    DistanceMatrixRequest:
      type: object
      required: [origins, destinations]
      properties:
        origins: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/LatLng' } }
        destinations: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/LatLng' } }
        vehicleType: { type: string, enum: [MOTORCYCLE, BICYCLE, E_BIKE, KICKBOARD, CAR, WALK] }
        departAt: { type: string, format: date-time }
    DistanceMatrix:
      type: object
      properties:
        provider: { type: string, enum: [KAKAO_MOBILITY, STRAIGHT_LINE], description: '늘 KAKAO_MOBILITY(STRAIGHT_LINE 은 쓰지 않는다 — ADR-0058)' }
        fallback: { type: boolean, description: '늘 false — 직선거리 대체 없음(ADR-0058, 2026-11-13)' }
        vehicleType: { type: string }
        rows:
          type: array
          description: origins 순서. 각 row의 elements는 destinations 순서
          items:
            type: object
            properties:
              elements:
                type: array
                items:
                  type: object
                  properties:
                    distanceM: { type: integer }
                    durationSeconds: { type: integer }
                    status: { type: string, enum: [OK, NO_ROUTE, UNAVAILABLE] }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
