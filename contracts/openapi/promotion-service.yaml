openapi: 3.1.0
info:
  title: promotion-service
  version: 0.3.0
  description: |
    0.3.0(2026-11-24, 백오피스 요청 — 사용자 "행사 대상에 테마도 추가"·"직원 지정 발급을 눌러도 고객 id 를 넣는다던가 찾는 칸 자체가 없는데", 세부는 "추천안대로 진행"):
      ① 기간 할인 대상 `THEME`(id = 진열 편성 테마 sectionId `T-…`) — 지금 게시된 진열에서 그 테마에 든 상품의 모든 옵션(SKU). 테마 상품이 바뀌면 다시 승인 없이 따라가고
      (카테고리와 같음), 승인 뒤 테마가 진열에서 빠지면 할인도 멈춘다. 자동 랭킹(RANKING_AUTO) 테마는 고를 수 없다. 테마 자체의 노출 기간은 보지 않는다(행사 기간만).
      promotion 이 1분마다 storefront `/internal/storefront/themes` 를 받아 둔다 — 진열이 바뀐 뒤 할인 반영까지 최대 약 1분 30초. 고를 목록 `GET /promotions/theme-targets`.
      행사 `targets[].title`(테마 이름), 문제 `Problem.code`(THEME_NOT_PUBLISHED·THEME_AUTO_RANKING 등 — 없을 수 있음).
      ② 지정 발급(ADMIN) 쿠폰을 만들 때 받을 고객 `coupon.recipients`{accountIds ≤100, reason} — 승인 뒤 시작 시각이 되면 서버가 1분 안에 발급(지정 발급과 같은 규칙 — 1인 한도·총 수량),
      발급한 사람 = 행사를 만든 직원. 시작 전에 끝난 행사는 발급하지 않는다. 결과 `recipientResults[]`(PENDING·ISSUED·SKIPPED_LIMIT·SOLD_OUT). 승인 요약에 받을 고객 수.
    0.2.1(2026-11-23, 고객앱 BR-85 — 사용자 "응"): 내 쿠폰 `Coupon.usedAt` — 쿠폰 사용이 확정된 시각(결제 성공 → 주문 확정 때 점유를 확정한 시각, UTC). status USED 일 때만, 그 밖은 null.
    쓴 주문이 전체 취소돼 쿠폰이 돌아오면(원래 사용 기간 안) 다시 null. 결제 중 점유는 쓴 것이 아니라 null.
    0.2.0(2026-11-20, ADR-0082 쿠폰·기간 할인 — 사용자 결정): 서비스 활성화. 기간 할인(상품 할인)·장바구니 쿠폰 행사의 정본 —
    행사 만들기·승인 반영(종류 PROMOTION)·조기 종료, 쿠폰 내려받기·지정 발급·내 쿠폰함, SKU 별 지금 할인(pricing·화면용), 쿠폰 할인 계산·점유·사용 확정·해제·복원.
    계산 규칙(부록 C §8.5 — ADR-0082 결정 2): 같은 SKU 에 걸린 기간 할인은 **가장 큰 할인 1개**, 정률은 원 미만 버림, 할인 뒤 단가 ≥ 0.
    장바구니 쿠폰 최소 주문금액은 **기간 할인 뒤·쿠폰 전 상품액**으로 본다. 주문 1건에 쿠폰 1장. 전체 취소 확정 뒤에만 복원(원래 사용 기간 안).
    역할: 행사 만들기·고치기·제출 = MARKETING·OPERATOR_ADMIN, 승인 = 다른 MARKETING 또는 OPERATOR_ADMIN(approval-service), 지정 발급 = MARKETING·CS_AGENT·OPERATOR_ADMIN.
    0.1.0: 1차 비활성 자리표시자.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: promotions, description: 행사(기간 할인·쿠폰) 관리 — 직원 }
  - { name: coupons, description: 쿠폰 받기·내 쿠폰함 — 고객 }
  - { name: internal, description: 가격 할인 조회·쿠폰 계산·점유(서비스 토큰) }

paths:
  /promotions:
    post:
      tags: [promotions]
      summary: 행사 초안 만들기
      description: |
        kind PRICE_DISCOUNT(기간 할인 — targets 필수) 또는 COUPON(장바구니 쿠폰 — coupon 필수). 초안은 고객에게 보이지 않는다.
        검사에 걸려도 초안은 저장하고 `problems` 로 알려 준다(제출 때 다시 막는다).
      operationId: createPromotion
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionInput' }
      responses:
        '201':
          description: 만듦
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promotion' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    get:
      tags: [promotions]
      summary: 행사 목록 (최근 바뀐 순)
      operationId: listPromotions
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/PromotionKind' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/PromotionState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Promotion' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /promotions/{promotionId}:
    get:
      tags: [promotions]
      summary: 행사 하나
      operationId: getPromotion
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: promotionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promotion' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    put:
      tags: [promotions]
      summary: 초안 고치기 (DRAFT·REJECTED 만, 통째로 — 제출·발효된 행사는 409 INVALID_STATE, 버전 다르면 409 VERSION_CONFLICT)
      operationId: updatePromotion
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: promotionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionInput' }
      responses:
        '200':
          description: 고침
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promotion' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /promotions/{promotionId}/submissions:
    post:
      tags: [promotions]
      summary: 발효 승인 요청 본문 만들기 (내용 잠금)
      description: |
        검사를 통과하면 내용 해시를 잠그고 상태 SUBMITTED. 응답의 `approvalRequest` 를 화면이 approval-service `POST /change-requests` 로 보낸다
        (종류 PROMOTION, 정본 promotion-service, allowedActions [ACTIVATE_PROMOTION]). 승인되면 승인 사건으로 APPROVED(시작 시각부터 고객에게 적용).
      operationId: submitPromotion
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: promotionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 잠금·승인 요청 본문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionSubmission' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '422':
          description: PROMOTION_INVALID (details = 고칠 곳). 이미 제출·발효된 행사는 409 INVALID_STATE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /promotions/{promotionId}/end-submissions:
    post:
      tags: [promotions]
      summary: 조기 종료 승인 요청 본문 만들기
      description: APPROVED 행사만. 승인되면 그 시각에 끝난다(ENDED). 이미 받은 쿠폰은 사용 기간까지 쓸 수 있다 — 내려받기·지정 발급만 멈춘다.
      operationId: submitPromotionEnd
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: promotionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: 승인 요청 본문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionSubmission' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /promotions/{promotionId}/coupon-grants:
    post:
      tags: [promotions]
      summary: 쿠폰 지정 발급 (발급 방식 ADMIN 행사, 진행 중)
      description: |
        고객마다 1장씩(1인 한도·총 수량 확인). 이미 한도만큼 가진 고객은 건너뛰고 결과에 SKIPPED. MARKETING·CS_AGENT·OPERATOR_ADMIN.
      operationId: grantCoupons
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: promotionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountIds, reason]
              properties:
                accountIds: { type: array, minItems: 1, maxItems: 100, items: { type: string, maxLength: 64 } }
                reason: { type: string, minLength: 1, maxLength: 200, description: 발급 사유(보상 등) }
      responses:
        '200':
          description: 고객별 결과
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [accountId, result]
                      properties:
                        accountId: { type: string }
                        result: { type: string, enum: [ISSUED, SKIPPED_LIMIT, SOLD_OUT] }
                        couponId: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '422':
          description: NOT_ACTIVE (진행 중이 아님) / UNSUPPORTED_ACTION (발급 방식이 ADMIN 이 아님)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /promotions/theme-targets:
    get:
      tags: [promotions]
      summary: 기간 할인 대상으로 고를 수 있는 진열 테마 (0.3.0)
      x-added-in: '2026-11-24'
      description: |
        promotion 이 storefront 에서 받아 둔 지금 게시 진열의 테마(1분마다). selectable = 고를 수 있는가(RANKING_AUTO 는 false).
        productCount = 테마에 든 상품 수(옵션 수 아님). syncedAt = 마지막으로 받은 시각(없으면 아직 못 받음 — 목록이 비어 있다). MARKETING·OPERATOR_ADMIN·CS_AGENT.
      operationId: listPromotionThemeTargets
      x-pmart-user-types: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [layoutVersion, themes]
                properties:
                  layoutVersion: { type: integer, description: '받아 둔 진열 버전(0 = 아직 없음)' }
                  syncedAt: { type: [string, 'null'], format: date-time }
                  themes:
                    type: array
                    items:
                      type: object
                      required: [sectionId, kind, title, productCount, selectable]
                      properties:
                        sectionId: { type: string }
                        kind: { type: string, enum: [THEME, SEASON, WEEKLY_PICK, RANKING_AUTO] }
                        title: { type: string }
                        productCount: { type: integer }
                        selectable: { type: boolean }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /coupon-campaigns:
    get:
      tags: [coupons]
      summary: 지금 내려받을 수 있는 쿠폰 행사 (고객)
      description: 발급 방식 DOWNLOAD·진행 중인 쿠폰 행사. 내가 받은 수(`myIssuedCount`)와 남은 수량(`remaining`, 총 수량이 없으면 null)을 함께 준다.
      operationId: listCouponCampaigns
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CouponCampaign' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /coupon-campaigns/{promotionId}/downloads:
    post:
      tags: [coupons]
      summary: 쿠폰 내려받기 (고객)
      description: |
        같은 Idempotency-Key 는 같은 결과. 마지막 1장은 한 명만(행사 행 잠금). 1인 한도를 채웠으면 422 COUPON_LIMIT_REACHED, 다 나갔으면 422 COUPON_SOLD_OUT.
      operationId: downloadCoupon
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: promotionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '201':
          description: 받음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coupon' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '422':
          description: NOT_ACTIVE / COUPON_SOLD_OUT / COUPON_LIMIT_REACHED / UNSUPPORTED_ACTION (내려받기 행사가 아님)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /me/coupons:
    get:
      tags: [coupons]
      summary: 내 쿠폰함 (고객)
      description: |
        status AVAILABLE(지금 쓸 수 있음 — 사용 기간 안·점유 아님), USED(사용 — 주문 결제 중 점유 포함), EXPIRED(기간 지남). 없으면 전부.
        AVAILABLE 은 사용 기간 끝이 가까운 순, 나머지는 받은 순(최근 먼저).
      operationId: listMyCoupons
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [AVAILABLE, USED, EXPIRED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Coupon' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /internal/price-discounts:
    post:
      tags: [internal]
      summary: SKU 별 지금(또는 at 시각) 기간 할인 — 가장 큰 할인 1개
      description: |
        pricing 견적·화면 표시용. 단가를 받아 할인액을 계산한다(정률 원 미만 버림, 할인 ≤ 단가). 걸린 행사가 없으면 그 SKU 는 결과에 없다.
        카테고리 행사는 product-service ProductVersionPublished 사본(SKU → 카테고리, 상위 포함)으로 판정한다.
      operationId: lookupPriceDiscounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                at: { type: string, format: date-time, description: 없으면 지금 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [sku, unitPrice]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      unitPrice: { $ref: '_common.yaml#/components/schemas/Money' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, asOf]
                properties:
                  asOf: { type: string, format: date-time }
                  items: { type: array, items: { $ref: '#/components/schemas/PriceDiscount' } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/coupon-quotes:
    post:
      tags: [internal]
      summary: 쿠폰 할인 계산 (점유 없이 — 주문서 미리보기·견적)
      description: |
        그 고객의 쿠폰이 지금 쓸 수 있는지·할인액. `itemAmount` = 기간 할인 뒤·쿠폰 전 상품액. 쓸 수 없으면 200 + applicable=false 와 사유
        (NOT_FOUND·NOT_OWNER·EXPIRED·NOT_STARTED·HELD·USED·MIN_ORDER_NOT_MET). 안분은 pricing 이 한다.
      operationId: quoteCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponQuoteRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponQuote' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/coupon-holds:
    post:
      tags: [internal]
      summary: 쿠폰 점유 (주문 결제 진입 — checkout S1-e)
      description: |
        같은 orderId·couponId 의 점유가 있으면 그것을 돌려준다(멱등). 다른 주문이 점유 중·사용·기간 밖·최소 금액 미달이면 422 COUPON_NOT_APPLICABLE(details[0].reason = 사유).
        점유는 확정·해제 전까지 다른 주문에 쓰이지 않는다. 할인액은 점유 때 정해 그대로 쓴다.
      operationId: holdCoupon
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CouponQuoteRequest'
                - type: object
                  required: [orderId]
                  properties:
                    orderId: { type: string, maxLength: 64 }
      responses:
        '201':
          description: 점유
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponHold' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '422':
          description: COUPON_NOT_APPLICABLE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/coupon-holds/{holdId}:
    get:
      tags: [internal]
      summary: 쿠폰 점유 상태 (응답 유실 때 원결과 조회)
      operationId: getCouponHold
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponHold' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/coupon-holds/{holdId}/confirmations:
    post:
      tags: [internal]
      summary: 쿠폰 사용 확정 (주문 확정 — S1-i)
      description: HELD → CONFIRMED(쿠폰 USED). 이미 CONFIRMED 면 그대로(멱등). RELEASED 면 409 INVALID_STATE.
      operationId: confirmCouponHold
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 확정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponHold' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/coupon-holds/{holdId}/releases:
    post:
      tags: [internal]
      summary: 쿠폰 점유 해제 (결제 실패·만료 보상 — 이번 시도의 점유만)
      description: HELD → RELEASED(쿠폰 다시 쓸 수 있음). 이미 RELEASED 면 그대로. CONFIRMED 면 409 INVALID_STATE(확정된 사용은 복원으로).
      operationId: releaseCouponHold
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 해제
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponHold' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/coupon-holds/{holdId}/restorations:
    post:
      tags: [internal]
      summary: 쿠폰 복원 (주문 전체 취소 확정 — S3-f)
      description: |
        CONFIRMED → RESTORED. 쿠폰의 원래 사용 기간이 남아 있을 때만 다시 쓸 수 있게 한다(연장·새 발급 없음) — 지났으면 RESTORED 로 기록만 하고 `couponUsable=false`.
        이미 RESTORED 면 그대로. HELD·RELEASED 면 409 INVALID_STATE.
      operationId: restoreCouponHold
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 복원
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponHold' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  schemas:
    PromotionKind:
      type: string
      enum: [PRICE_DISCOUNT, COUPON]
      description: PRICE_DISCOUNT 기간 할인(상품) · COUPON 장바구니 쿠폰
    PromotionState:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, ENDED]
      description: APPROVED 는 시작~끝 시각 사이에만 고객에게 적용(phase 로 구분). ENDED 조기 종료.
    PromotionPhase:
      type: string
      enum: [NOT_APPROVED, SCHEDULED, RUNNING, FINISHED]
      description: 승인 전 · 시작 전 · 진행 중 · 끝남(끝 시각 지남 또는 조기 종료)
    Discount:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [RATE, AMOUNT], description: RATE 정률(%) · AMOUNT 정액(원) }
        value: { type: integer, minimum: 1, description: 'RATE 는 1~90(%), AMOUNT 는 원(기간 할인은 개당)' }
        maxAmount: { type: [integer, 'null'], minimum: 1, description: '정률 쿠폰의 최대 할인액(원) — 쿠폰만' }
    PromotionTarget:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [SKU, CATEGORY, THEME], description: '0.3.0 THEME = 진열 편성 테마(그때 게시된 진열에서 그 테마 상품의 모든 옵션)' }
        id: { type: string, maxLength: 64, description: 'SKU 코드 · 카테고리 ID(그 아래 상품 전부) · 테마 sectionId(T-…)' }
        title: { type: [string, 'null'], description: '0.3.0 응답만 — THEME 이면 받아 둔 테마 이름(진열에서 빠졌으면 null). 보낼 때는 무시' }
    CouponPolicy:
      type: object
      required: [issueMode, minOrderAmount, perCustomerLimit]
      properties:
        issueMode: { type: string, enum: [DOWNLOAD, ADMIN, SIGNUP], description: '앱 내려받기 · 운영자 지정 발급 · 가입 축하 자동' }
        minOrderAmount: { type: integer, minimum: 0, description: 최소 주문금액(기간 할인 뒤·쿠폰 전 상품액) }
        totalQuantity: { type: [integer, 'null'], minimum: 1, description: 총 발급 수량(없으면 제한 없음) }
        perCustomerLimit: { type: integer, minimum: 1, maximum: 10, description: 1인 발급 한도 }
        useDays: { type: [integer, 'null'], minimum: 1, maximum: 365, description: 받은 날 포함 N일(N번째 날 23:59:59 Asia/Seoul 까지 — 11-20 에 7일이면 11-26 끝). 없으면 useUntil }
        useUntil: { type: [string, 'null'], format: date-time, description: 고정 사용 기한(useDays 가 없을 때 필수) }
        recipients:
          x-added-in: '2026-11-24'
          description: '0.3.0 — 지정 발급(ADMIN)만. 승인 뒤 시작 시각이 되면 서버가 이 고객들에게 1장씩(1인 한도·총 수량 그대로). 없으면 지금처럼 진행 중에 coupon-grants 로'
          oneOf:
            - type: 'null'
            - type: object
              required: [accountIds, reason]
              properties:
                accountIds: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 64 } }
                reason: { type: string, minLength: 1, maxLength: 200, description: 발급 사유 }
    PromotionInput:
      type: object
      required: [kind, name, startsAt, endsAt, discount]
      properties:
        kind: { $ref: '#/components/schemas/PromotionKind' }
        name: { type: string, minLength: 1, maxLength: 60, description: 고객에게 보이는 이름 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: 기간 할인 끝·쿠폰 받기 끝 }
        discount: { $ref: '#/components/schemas/Discount' }
        targets: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/PromotionTarget' }, description: PRICE_DISCOUNT 만(1개 이상) }
        coupon: { $ref: '#/components/schemas/CouponPolicy' }
    Problem:
      type: object
      required: [field, reason]
      properties:
        field: { type: string }
        reason: { type: string }
        code: { type: [string, 'null'], description: '0.3.0 — 화면이 가려 쓸 코드(THEME_NOT_PUBLISHED·THEME_AUTO_RANKING·RECIPIENTS_NOT_ADMIN 등). 없을 수 있음' }
    Promotion:
      type: object
      required: [promotionId, kind, name, state, phase, startsAt, endsAt, discount, targets, problems, version, createdBy, updatedAt]
      properties:
        promotionId: { type: string }
        kind: { $ref: '#/components/schemas/PromotionKind' }
        name: { type: string }
        state: { $ref: '#/components/schemas/PromotionState' }
        phase: { $ref: '#/components/schemas/PromotionPhase' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time, description: 조기 종료 시각 }
        discount: { $ref: '#/components/schemas/Discount' }
        targets: { type: array, items: { $ref: '#/components/schemas/PromotionTarget' } }
        coupon: { oneOf: [{ $ref: '#/components/schemas/CouponPolicy' }, { type: 'null' }] }
        issuedCount: { type: integer, description: 쿠폰 행사 — 지금까지 발급 수 }
        usedCount: { type: integer, description: 쿠폰 행사 — 사용 확정 수 }
        recipientResults:
          type: array
          x-added-in: '2026-11-24'
          description: '0.3.0 — 만들 때 지정한 받을 고객(coupon.recipients)별 발급 결과. PENDING = 아직(시작 전·승인 전·시작 전에 끝남)'
          items:
            type: object
            required: [accountId, result]
            properties:
              accountId: { type: string }
              result: { type: string, enum: [PENDING, ISSUED, SKIPPED_LIMIT, SOLD_OUT] }
              couponId: { type: [string, 'null'] }
              processedAt: { type: [string, 'null'], format: date-time }
        problems: { type: array, items: { $ref: '#/components/schemas/Problem' }, description: 지금 제출하면 막히는 곳 }
        approvalId: { type: [string, 'null'] }
        version: { type: integer }
        createdBy: { type: string }
        updatedAt: { type: string, format: date-time }
    PromotionSubmission:
      type: object
      required: [promotionId, draftHash, approvalRequest]
      properties:
        promotionId: { type: string }
        draftHash: { type: string }
        approvalRequest: { type: object, additionalProperties: true, description: 'approval-service POST /change-requests 본문 그대로' }
    CouponCampaign:
      type: object
      required: [promotionId, name, discount, minOrderAmount, perCustomerLimit, myIssuedCount, endsAt]
      properties:
        promotionId: { type: string }
        name: { type: string }
        discount: { $ref: '#/components/schemas/Discount' }
        minOrderAmount: { type: integer }
        perCustomerLimit: { type: integer }
        myIssuedCount: { type: integer }
        remaining: { type: [integer, 'null'], description: 남은 수량(총 수량 없으면 null) }
        endsAt: { type: string, format: date-time, description: 받기 끝 }
        useDays: { type: [integer, 'null'] }
        useUntil: { type: [string, 'null'], format: date-time }
    Coupon:
      type: object
      required: [couponId, promotionId, name, discount, minOrderAmount, status, issuedAt, validUntil]
      properties:
        couponId: { type: string }
        promotionId: { type: string }
        name: { type: string }
        discount: { $ref: '#/components/schemas/Discount' }
        minOrderAmount: { type: integer }
        status: { type: string, enum: [AVAILABLE, USED, EXPIRED] }
        issuedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        usedOrderId: { type: [string, 'null'] }
        usedAt: { type: [string, 'null'], format: date-time, description: '(0.2.1 BR-85) 사용 확정 시각(주문 확정 때) — USED 일 때만' }
    PriceDiscount:
      type: object
      required: [sku, promotionId, name, unitPrice, unitDiscount, discountedUnitPrice, endsAt]
      properties:
        sku: { type: string }
        promotionId: { type: string }
        name: { type: string }
        unitPrice: { type: integer }
        unitDiscount: { type: integer, description: 개당 할인액 }
        discountedUnitPrice: { type: integer }
        ratePercent: { type: integer, description: '표시용 할인율(내림, %)' }
        endsAt: { type: string, format: date-time }
    CouponQuoteRequest:
      type: object
      required: [couponId, accountId, itemAmount]
      properties:
        couponId: { type: string }
        accountId: { type: string }
        itemAmount: { type: integer, minimum: 0, description: 기간 할인 뒤·쿠폰 전 상품액 }
        at: { type: string, format: date-time, description: 없으면 지금 }
    CouponQuote:
      type: object
      required: [couponId, applicable]
      properties:
        couponId: { type: string }
        applicable: { type: boolean }
        reason: { type: [string, 'null'], enum: [NOT_FOUND, NOT_OWNER, EXPIRED, NOT_STARTED, HELD, USED, MIN_ORDER_NOT_MET, null] }
        discountAmount: { type: integer, description: 'applicable 일 때 할인액(≤ itemAmount)' }
        promotionId: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
    CouponHold:
      type: object
      required: [holdId, couponId, orderId, state, discountAmount]
      properties:
        holdId: { type: string }
        couponId: { type: string }
        orderId: { type: string }
        state: { type: string, enum: [HELD, CONFIRMED, RELEASED, RESTORED] }
        discountAmount: { type: integer }
        couponUsable: { type: boolean, description: 'RESTORED 일 때 — 원래 사용 기간이 남아 다시 쓸 수 있는가' }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
