openapi: 3.1.0
info:
  title: cdc-location-service
  version: 0.5.1
  description: |
    CDC 시설 수용조건·7구간 LOC 마스터(센터-온도-구역-랙-베이-단-포지션)·상태·적치 후보·공간 용량 예약·도크 자원의 정본. (docs/architecture/service-map.md §4)
    수량은 cdc-inventory, 작업은 cdc-inbound/outbound가 정본. 공간 예약 불변식: 점유 + 미완료 예약 + 신규 ≤ 허용량.
    0.2.0(2026-11-25): 위치 마스터 구현(등록·일괄 등록·조회·상태 전환·LocStateChanged). 칠곡(CDC01)은 코드 문법 CDC-3~5 를 검사한다.
    점유(occupiedQty)는 cdc-inventory 사본을 아직 받지 않아 비운다(asOf.freshness UNAVAILABLE). 적치 후보·공간 예약·도크 예약은 아직 501.
    0.3.0(2026-11-25): 공개 경로를 `/cdcs/{cdcId}/locations…` 로 옮김 — 게이트웨이 `/api/v1/locations/**` 가 mfc-location 라우트라 겹침(PC1 R-16).
    목록의 centerId 조회 조건은 경로 cdcId 로, 등록 본문의 centerId 는 경로와 같아야 한다(400 CENTER_MISMATCH). 내부 경로는 그대로.
    0.5.1(2026-11-25): 칠곡 문법 넓힘(R-19, 사용자 2026-11-25) — 팔레트 랙 1단 PICK_FACE(박스 피킹면)·통로 93 바닥 레인(단 1, PICK_FACE)·7층 H 61~62 오토스토어(단 1~16·칸 1~2). 경로·모양 변화 없음.
    0.5.0(2026-11-25): 피킹 선반 통로별 피킹 방식 설정값 `pickMethod`(DPS·BOX_PICK·FC·DISTRIBUTION·LINE) — `GET·POST /cdcs/{cdcId}/aisle-pick-methods`,
    위치 일괄 조회 응답 items[].pickMethod(설정 없으면 비움). 묶음 피킹 설계(docs/cdc/design/2026-11-25-batch-picking.md §7 결정 3 — 사용자 "선반 통로 설정값", 상품 분류 글자로 가르지 않음 WMS CDC-F-017).
    0.4.2(2026-11-25): 칠곡 팔레트 랙 베이 01~48(R-17 랙 묶음 — 통로 한쪽 12 × 2). 경로·모양 변화 없음.
    0.4.1(2026-11-25): 위치 일괄 조회도 POST 라 공통 헤더 검사(common-web)가 Idempotency-Key 를 요구한다 — 계약에 적음(LAN 에서 키 없는 호출이 400, #462 배포 확인).
    0.4.0(2026-11-25): 내부 위치 일괄 조회 `POST /internal/location-lookups` — cdc-inventory 가 할당 때 "같은 LOT 이면 피킹 선반 먼저"를 정하려고 위치 유형을 읽는다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: locations, description: LOC 마스터·상태 (DRAFT→ACTIVE→BLOCKED/INACTIVE→RETIRED) }
  - { name: internal, description: 서비스 간 호출 (cdc-inbound / cdc-outbound / TMS) }

paths:
  /cdcs/{cdcId}/locations:
    get:
      tags: [locations]
      summary: LOC 목록 조회 (센터·온도·구역·상태 필터)
      operationId: listLocations
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: temperatureZone, in: query, schema: { $ref: '#/components/schemas/TemperatureZone' } }
        - { name: area, in: query, description: 구역 글자(칠곡 A~H — 코드 둘째 구간), schema: { type: string } }
        - { name: floor, in: query, description: '층(코드 셋째 구간 — 칠곡 5·6·7·B1) 0.2.0', schema: { type: string } }
        - { name: locationType, in: query, description: '0.2.0', schema: { $ref: '#/components/schemas/LocationType' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/LocationState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Location' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
    post:
      tags: [locations]
      summary: LOC 등록 (DRAFT 생성, 센터 기준정보 BO-06 승인 후 현장 설정)
      description: |
        코드 첫 구간 = centerId. 칠곡(CDC01) 문법(chilgok-dc.md CDC-3~5): 구역 글자 A~H 와 temperatureZone 이 맞아야 한다(A FROZEN·B CHILLED·C~H AMBIENT).
        통로 01~60 = 팔레트 랙 — 입고·적치 보관(층 5~7·베이 01~48 홀수 왼쪽·짝수 오른쪽·단 1~4·슬롯 1~2, RESERVE — QUARANTINE·TEMPORARY 도 됨, (0.5.1) 1단은 박스 피킹면 PICK_FACE 도 됨),
        61~89 = 피킹 선반 — MFC 선반 모양(층 5~7·베이 = 유닛 01~·단 1~5·칸 1~3, 칸 하나 = SKU 하나, PICK_FACE)(시뮬레이터 R-13, 사용자 2026-11-25),
        (0.5.1) 7층 H 61~62 = 오토스토어(베이 = 격자·단 1~16·칸 1~2, PICK_FACE).
        90 = DOCK(층 B1), 91·92 = STAGING(층 5~7) — 랙·선반이 아니면 단 0·슬롯 1. (0.5.1) 93 = 바닥 레인(층 5~7·단 1·칸 1~, PICK_FACE). 94~99 는 비워 둔다.
        어기면 400 VALIDATION_FAILED(details 에 규칙 이름). 자기 센터 운영자만(centers 클레임).
      operationId: createLocation
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201':
          description: 생성 또는 기존 반환(같은 키·같은 본문)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: IDEMPOTENCY_CONFLICT / LOCATION_CODE_EXISTS
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/aisle-pick-methods:
    get:
      tags: [locations]
      summary: 피킹 선반 통로별 피킹 방식 설정 목록 (0.5.0)
      operationId: listAislePickMethods
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: area, in: query, schema: { type: string } }
        - { name: floor, in: query, schema: { type: string } }
      responses:
        '200':
          description: 설정된 통로만(구역·층·통로 순). 없는 통로 = 미설정.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AislePickMethod' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [locations]
      summary: 피킹 선반 통로별 피킹 방식 설정·해제 (0.5.0, 일괄)
      description: |
        통로 = (구역·층·통로) — 위치 코드 둘째·셋째·넷째 구간. 그 통로에 PICK_FACE 위치가 하나도 없으면 400(NOT_PICK_FACE_AISLE) — 선반을 먼저 등록한다.
        pickMethod 를 비우면(null) 설정을 지운다(미설정). 전부 반영하거나 하나도 반영하지 않는다. 최대 500행, 같은 통로 두 번 400.
        방식(chilgok-dc.md §2, 묶음 피킹 설계 §3.1): DPS = 냉동 DPS(TRF 하나씩), BOX_PICK = 무거운 상자 박스 피킹, FC = 상온·생활 FC,
        DISTRIBUTION = 6층 야채 분배, LINE = 6층 라인(DAS). 상품 분류 글자로 정하지 않는다(WMS CDC-F-017).
        바뀐 값은 다음 Wave 릴리스부터 쓰인다(이미 만든 작업은 그대로). 자기 센터 운영자만. 사건 없음.
      operationId: setAislePickMethods
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                reason: { type: string, maxLength: 500 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [area, floor, aisle]
                    properties:
                      area: { type: string, maxLength: 4 }
                      floor: { type: string, maxLength: 4 }
                      aisle: { type: string, pattern: '^[0-9]{2}$' }
                      pickMethod:
                        description: 생략하거나 null 이면 그 통로 설정 해제
                        $ref: '#/components/schemas/PickMethod'
      responses:
        '200':
          description: 반영(같은 키·같은 본문이면 저장 결과 재생)
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  setCount: { type: integer }
                  clearedCount: { type: integer }
                  occurredAt: { type: string, format: date-time }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/location-lookups:
    post:
      tags: [internal]
      summary: '[cdc-inventory→cdc-location] 위치 일괄 조회 — 유형·상태·온도대 (0.4.0, 조회만)'
      description: |
        코드가 많아 POST 로 받는 조회다(아무것도 바꾸지 않음). POST 라 공통 헤더 검사가 Idempotency-Key 를 요구한다 — 값은 아무 고유값이면 되고 결과를 저장·재생하지 않는다. 최대 2,000개. 없는 코드는 missing 에.
        cdc-inventory 할당은 같은 LOT·같은 기한 안에서 PICK_FACE 를 먼저 잡는 데 쓴다(WMS CDC-F-009 "동선 효율은 FEFO 뒤에만").
        (0.5.0) cdc-outbound 는 Wave 릴리스 때 pickMethod 로 묶음 방식을 정한다.
      operationId: lookupLocations
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [centerId, locationCodes]
              properties:
                centerId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                locationCodes: { type: array, minItems: 1, maxItems: 2000, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        locationCode: { type: string }
                        locationType: { $ref: '#/components/schemas/LocationType' }
                        state: { $ref: '#/components/schemas/LocationState' }
                        temperatureZone: { $ref: '#/components/schemas/TemperatureZone' }
                        pickMethod:
                          description: '(0.5.0) 이 위치 통로(센터·구역·층·통로)의 피킹 방식 설정값. 설정이 없거나 피킹 선반이 아니면 비움 — 기본값으로 채우지 않는다.'
                          $ref: '#/components/schemas/PickMethod'
                  missing: { type: array, items: { type: string } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/location-batches:
    post:
      tags: [internal]
      summary: '[backoffice/시드→cdc-location] LOC 일괄 등록 (최대 2,000행, 전부 또는 전무, 0.2.0)'
      description: |
        센터 기준정보(층별 도면) 승인 뒤 위치를 한꺼번에 넣는다. 행 규칙은 단건 등록과 같다. 하나라도 어기거나 이미 있으면 아무것도 넣지 않는다
        (400 VALIDATION_FAILED / 409 LOCATION_CODE_EXISTS, details[].field = items[i]). 같은 코드가 두 번이면 400.
        activate=true 면 ACTIVE 로 만든다(상태 이력에 ACTIVATE 를 남김). 만들 때는 LocStateChanged 를 내지 않는다.
      operationId: createLocationBatch
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [centerId, approvalRef, items]
              properties:
                centerId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                approvalRef: { type: string, description: 센터 기준정보 승인(BO-06) }
                activate: { type: boolean, default: false }
                items:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '200':
          description: 전 행 반영(resultId = approvalRef, appliedQty = 만든 행 수)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT / LOCATION_CODE_EXISTS
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/locations/{locationCode}:
    get:
      tags: [locations]
      summary: LOC 상세 (상태·용량·점유·미완료 예약)
      operationId: getLocation
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: locationCode, in: path, required: true, schema: { $ref: '#/components/schemas/LocationCode' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/locations/{locationCode}/state-changes:
    post:
      tags: [locations]
      summary: LOC 상태 전환 (ACTIVATE / BLOCK / UNBLOCK / DEACTIVATE / RETIRE) → LocStateChanged
      description: |
        점유·미완료 예약이 있으면 RETIRE 불가(INVALID_STATE). BLOCKED는 신규 적치 후보에서 제외되며 기존 재고는 유지된다.
        (0.2.0) 전환: ACTIVATE DRAFT·INACTIVE→ACTIVE, BLOCK ACTIVE→BLOCKED, UNBLOCK BLOCKED→ACTIVE, DEACTIVATE ACTIVE·BLOCKED→INACTIVE, RETIRE DRAFT·INACTIVE→RETIRED(approvalRef 필수 — 없으면 422 APPROVAL_REQUIRED).
        INACTIVE 의 RETIRE 는 점유를 확인할 길(cdc-inventory 위치별 조회)이 아직 없어 409 INVALID_STATE 로 막는다 — 재고가 생긴 적 없는 DRAFT 만 폐기할 수 있다.
        전환마다 version +1·이력·LocStateChanged(cdc.location.v1). 자기 센터 운영자만.
      operationId: changeLocationState
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: locationCode, in: path, required: true, schema: { $ref: '#/components/schemas/LocationCode' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [ACTIVATE, BLOCK, UNBLOCK, DEACTIVATE, RETIRE] }
                reason: { type: string, maxLength: 500 }
                approvalRef: { type: string, description: RETIRE 시 필수 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  # ---------- internal (서비스 토큰) ----------
  /internal/putaway-candidates:
    post:
      tags: [internal]
      summary: '[cdc-inbound→cdc-location] 적치 후보 산출 (회전배치 적격, 상태·온도·용량·사용 제한 검사). 예약 아님'
      operationId: computePutawayCandidates
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [centerId, sku, qty, temperatureZone]
              properties:
                centerId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                lot: { type: string }
                qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                temperatureZone: { $ref: '#/components/schemas/TemperatureZone' }
                preferredLocationCode: { $ref: '#/components/schemas/LocationCode' }
                maxCandidates: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: 후보 목록 또는 사유
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  result: { type: string, enum: [CANDIDATES_FOUND, NO_ELIGIBLE_LOCATION, TEMPERATURE_MISMATCH, CAPACITY_EXCEEDED, CENTER_RESTRICTED] }
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        locationCode: { $ref: '#/components/schemas/LocationCode' }
                        rank: { type: integer }
                        fitQty: { type: integer, description: 이 위치에 들어갈 수 있는 수량 }
                        reason: { type: string, description: 선정 근거 (같은 LOT 합적·빈 위치·회전 적합 등) }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /internal/space-reservations:
    post:
      tags: [internal]
      summary: '[cdc-inbound→cdc-location] 공간 용량 예약 (S7 1단계, 점유 + 미완료 예약 + 신규 ≤ 허용량) → CapacityReservationResult'
      operationId: createSpaceReservation
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceRef, lines]
              properties:
                sourceRef: { type: string, description: putawayTaskId / moveId }
                expiresAt: { type: string, format: date-time, description: 미완료 시 자동 해제 시각 (미지정 시 정책값) }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [locationCode, sku, qty]
                    properties:
                      locationCode: { $ref: '#/components/schemas/LocationCode' }
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
      responses:
        '200':
          description: 예약 결과. resultId = reservationId
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '_common.yaml#/components/schemas/CommandResponse' }
                  - { $ref: '#/components/schemas/SpaceReservation' }
        '409':
          description: IDEMPOTENCY_CONFLICT / CAPACITY_EXCEEDED / LOCATION_BLOCKED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/space-reservations/{reservationId}:
    get:
      tags: [internal]
      summary: 공간 예약 조회 (RESERVED/CONSUMED/RELEASED/EXPIRED)
      operationId: getSpaceReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceReservation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/space-reservations/{reservationId}/releases:
    post:
      tags: [internal]
      summary: '[cdc-inbound→cdc-location] 공간 예약 해제 (전부/일부). 이동 전기 완료분은 CONSUME으로 점유 전환'
      operationId: releaseSpaceReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [RELEASE, CONSUME] }
                commitId: { type: string, description: CONSUME일 때 cdc-inventory 이동 commitId }
                lines:
                  type: array
                  description: 비우면 전량
                  items:
                    type: object
                    required: [locationCode, sku, qty]
                    properties:
                      locationCode: { $ref: '#/components/schemas/LocationCode' }
                      sku: { type: string }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/dock-reservations:
    post:
      tags: [internal]
      summary: '[transport-planning→cdc-location] 도크·상차 위치 예약 (S8 자원) → DockReservationResult'
      operationId: createDockReservation
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [centerId, tripId, window, purpose]
              properties:
                centerId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                tripId: { type: string }
                vehicleId: { type: string }
                purpose: { type: string, enum: [OUTBOUND_LOADING, INBOUND_UNLOADING] }
                temperatureZone: { $ref: '#/components/schemas/TemperatureZone' }
                window:
                  type: object
                  required: [start, end]
                  properties:
                    start: { type: string, format: date-time }
                    end: { type: string, format: date-time }
                preferredDockCode: { type: string }
      responses:
        '200':
          description: 예약 결과. resultId = dockReservationId
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '_common.yaml#/components/schemas/CommandResponse' }
                  - { $ref: '#/components/schemas/DockReservation' }
        '409':
          description: IDEMPOTENCY_CONFLICT / CAPACITY_EXCEEDED (창 내 가용 도크 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/dock-reservations/{reservationId}:
    get:
      tags: [internal]
      summary: 도크 예약 조회
      operationId: getDockReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DockReservation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    LocationCode:
      type: string
      description: |
        7구간 LOC 코드 센터-온도구역-세부구역-랙-베이-단-포지션.
        칠곡 DC(CDC01)는 둘째 = 구역 글자(MFC 시뮬레이터 기준 A 냉동·B 냉장·C/D/E 상온·F 상온 인기·G/H 생활용품·기타 — 온도대를 함께 뜻함),
        셋째 = 층(5~7, 지하 B1), 넷째 = 구역 안 통로로 읽는다 — 예 CDC01-C-5-02-24-3-1.
        랙이 아닌 위치는 단 0·슬롯 1 — 통로 90 = DOCK(지하 접안 — 예 CDC01-B-B1-90-03-0-1)·91 = STAGING 출고대기·92 = STAGING 층 승강기 반출 문. (docs/simulator/cdc/chilgok-dc.md CDC-3~5)
      pattern: '^[A-Z0-9]+-[A-Z]-[A-Z0-9]+-[0-9]{2}-[0-9]{2}-[0-9]+-[0-9]+$'
    LocationState:
      type: string
      enum: [DRAFT, ACTIVE, BLOCKED, INACTIVE, RETIRED]
    TemperatureZone:
      type: string
      enum: [AMBIENT, CHILLED, FROZEN]
    LocationType:
      type: string
      description: |
        PICK_FACE 피킹면(칠곡은 피킹 선반)·RESERVE 리저브(칠곡은 팔레트 랙)·QUARANTINE 격리·STAGING 출고대기(구역 글자가 온도대)·DOCK 접안·TEMPORARY 임시 보관.
        TEMPORARY 는 0.2.0(사용자 제공 CDC 구축 명세서 4장 위치 유형 — 칠곡 결정과 겹치지 않는 부분만 채택, 2026-11-25).
      enum: [RESERVE, PICK_FACE, STAGING, DOCK, QUARANTINE, TEMPORARY]
    PickMethod:
      type: string
      description: |
        (0.5.0) 피킹 선반 통로의 피킹 방식(chilgok-dc.md §2). DPS 냉동 DPS(TRF 하나씩, 피킹 = 분류)·BOX_PICK 박스 피킹(지역 묶음)·FC(지역 묶음)·
        DISTRIBUTION 6층 야채 분배(지역 묶음 → 분배대에서 MFC 크레이트로)·LINE 6층 라인 DAS(SKU 묶음 → 라인 칸으로). 묶음 단위는 cdc-outbound 가 정한다.
      enum: [DPS, BOX_PICK, FC, DISTRIBUTION, LINE]
    AislePickMethod:
      type: object
      properties:
        area: { type: string }
        floor: { type: string }
        aisle: { type: string }
        pickMethod: { $ref: '#/components/schemas/PickMethod' }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    LocationInput:
      type: object
      required: [locationCode, centerId, temperatureZone, locationType, capacity]
      properties:
        locationCode: { $ref: '#/components/schemas/LocationCode' }
        centerId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        temperatureZone: { $ref: '#/components/schemas/TemperatureZone' }
        locationType: { $ref: '#/components/schemas/LocationType' }
        capacity:
          type: object
          properties:
            unit: { type: string, enum: [EACH, BOX, PLT] }
            maxQty: { type: integer, minimum: 0 }
            maxWeightG: { type: integer, minimum: 0 }
        restrictions:
          type: array
          description: 사용 제한 (예 FOOD_ONLY · NO_MIX_LOT)
          items: { type: string }
        pickFaceMinQty:
          type: [integer, 'null']
          minimum: 0
          description: 피킹면 최소량(0.2.0 — 이 아래로 내려가면 보충 MOV 대상). 설정값이며 기본값 없음 — 비우면 미설정(보충 판단 CONFIG_REQUIRED, 0 으로 대신하지 않음). PICK_FACE 만
        pickFaceTargetQty:
          type: [integer, 'null']
          minimum: 0
          description: 피킹면 목표량(0.2.0 — MOV 필요량 = max(0, 목표 − 현재 − 진행 중 보충)). 설정값·기본값 없음. PICK_FACE 만, 최소량 이상
    Location:
      allOf:
        - { $ref: '#/components/schemas/LocationInput' }
        - type: object
          properties:
            state: { $ref: '#/components/schemas/LocationState' }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            parts:
              type: object
              description: 코드 7구간을 나눈 값(0.2.0)
              properties:
                center: { type: string }
                area: { type: string }
                floor: { type: string }
                aisle: { type: string }
                bay: { type: string }
                level: { type: integer }
                slot: { type: integer }
            occupiedQty: { type: [integer, 'null'], description: cdc-inventory 사본(0.2.0 — 아직 받지 않아 null) }
            openReservedQty: { type: integer, description: 미완료 공간 예약 합 }
            availableQty: { type: [integer, 'null'], description: 허용량 − 점유 − 미완료 예약(점유를 모르면 null) }
            asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
            updatedAt: { type: string, format: date-time }
    SpaceReservation:
      type: object
      properties:
        reservationId: { type: string }
        sourceRef: { type: string }
        state: { type: string, enum: [RESERVED, PARTIALLY_CONSUMED, CONSUMED, RELEASED, EXPIRED] }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        expiresAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              locationCode: { type: string }
              sku: { type: string }
              lot: { type: string }
              reservedQty: { type: integer }
              consumedQty: { type: integer }
              releasedQty: { type: integer }
    DockReservation:
      type: object
      properties:
        dockReservationId: { type: string }
        centerId: { type: string }
        dockCode: { type: string }
        tripId: { type: string }
        purpose: { type: string, enum: [OUTBOUND_LOADING, INBOUND_UNLOADING] }
        state: { type: string, enum: [RESERVED, IN_USE, COMPLETED, RELEASED, EXPIRED] }
        window: { type: object, properties: { start: { type: string, format: date-time }, end: { type: string, format: date-time } } }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
