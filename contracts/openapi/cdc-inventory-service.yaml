openapi: 3.1.0
info:
  title: cdc-inventory-service
  version: 0.8.0
  description: |
    0.8.0(2026-11-25, 재계수·실사 조정 — WMS CDC-F-029·030, 설계 docs/cdc/design/2026-11-25-count-adjustment.md, 사용자 "MFC 실사와 같게"): 실사 세션
      `/cdcs/{cdcId}/count-sessions` — 시작(칸 잠금: 새 할당 후보에서 뺌)·장부 숨긴 첫 계수·다른 작업자 재계수·시작/계수자 아닌 운영자 결정 → CNT 조정·재계수 대기 해소·InventoryAdjustmentPosted.
      승인 관문 `pmart.inventory.approval-ref.mode`(VERIFY — MFC 와 같은 본사 기준, RECORD_ONLY — 번호 기록만). 실물이 예약보다 적어지는 조정은 아직 409 COUNT_BELOW_RESERVED(설계 §4 는 다음 PR).
    0.7.1(2026-11-25): 이동 종류 PICK_MOVE — 피킹한 재고를 예약과 함께 출고대기 자리(91)로 옮겨 적기(cdc-outbound, 설계 docs/cdc/design/2026-11-25-count-adjustment.md §5 — 사용자 결정). 경로·모양 변화 없음(enum 값 추가).
    0.7.0(2026-11-25, 피킹 부족 재할당 — WMS CDC-F-018, 사용자 결정): 해제 줄에 locationCode·`recountHold`(부족 칸의 그 LOT 을 재계수 대기로 — 새 할당에서 뺌, 현물은 그대로),
      추가 할당 `POST /internal/allocations/{allocationId}/additions`(같은 TRF 할당에 모자란 만큼 FEFO 로 더 잡기 — 재계수 대기 칸 제외),
      운영자 재계수 대기 목록·풀기 `GET /cdcs/{cdcId}/recount-holds`·`POST /cdcs/{cdcId}/recount-holds/{holdId}/releases`. 재계수 결과 반영(조정)은 아직.
    0.6.0(2026-11-25, DC 백오피스 1단계 재고 현황 — 사용자 "Dc 백오피스 만들어줘"): 직원 조회 `GET /cdcs/{cdcId}/stock-snapshot` — 내부 `/internal/snapshots` 와 같은
      내용(SKU별 현물·가용·예약, withPlaces=true 면 LOT·위치별)을 자기 센터 운영자(토큰 centers)에게. 읽기만.
    CDC 재고 단일 쓰기 주체. 위치·LOT·품질상태별 On-hand, 이관 예약 R(0 ≤ R ≤ E ≤ 장부), Held, 안전량 S, 가용 max(0, E−R−S),
    LOT 식별/소비기한/FEFO, 초기 보유 INITIAL_BALANCE, 승인 TRF 다LOT FEFO 할당, TOUT 1회 전기, Transit 소유·대사(q = r + l + t),
    승인 손실/폐기/ADJ 집행, 일일 수불 대사의 정본. (docs/architecture/service-map.md §4, docs/adr/0002)
    LOC 마스터·공간(cdc-location), 작업(cdc-inbound/outbound), 품질 판단(cdc-quality), MFC 재고(mfc-inventory), 승인(replenishment/approval)은 비정본.
    모든 변경 요청은 commitId를 발급하며 호출자는 자체 사본으로 성공을 판단하지 않는다. 모든 경로는 서비스 간(internal)이다.
    0.2.0(2026-11-25): 초기 보유·안전량·가용·할당/해제·TOUT·원결과·Transit 조회 구현. 안전량 설정 경로·출발 목적지 toMfcId 추가.
    잔여일수 판정은 소비기한 당일부터 차단(D ≥ 1)과 호출자가 준 minRemainingDays 만 — 총기간 T(제조일) 입력이 아직 없어 품목군 정책값은 계산하지 않는다.
    0.5.0(2026-11-25): 할당 FEFO 동률(같은 LOT·같은 기한) 안에서 피킹 선반(PICK_FACE) 먼저 — cdc-location 위치 일괄 조회. 조회가 안 되면 위치 코드 순(할당은 막지 않음).
    0.4.0(2026-11-25): 재고 스냅샷 조회(snapshots) 구현 — LOT 마다 위치별 현물·예약(locations[]), 안전량 미설정이면 available null(0 이 아님).
    0.3.0(2026-11-25): 내부 이동 전기(move-postings) 구현 — 줄에 allocationId 를 주면 그 할당의 예약을 함께 옮긴다(팔레트 랙 → 피킹 선반 보충, 칠곡 CDC-7).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: availability, description: 공급가능량·예약·Transit·스냅샷 조회 }
  - { name: allocations, description: 승인 TRF 할당/해제 (cdc-outbound) }
  - { name: postings, description: 수량 전기 명령 (TOUT·TIN 확인·MOV·품질·손실·조정·초기 보유) }
  - { name: commits, description: 원결과 조회 }
  - { name: reconciliation, description: Transit 대사·일일 수불 대사 }
  - { name: sku-handlings, description: 센터 SKU 취급 ON·OFF (운영자 — 자기 센터) }
  - { name: skus, description: 상품 SKU 투영 조회 }
  - { name: counts, description: '위치 실사·재계수·CNT 조정 (운영자 — 자기 센터 0.8.0)' }

paths:
  /internal/availability:
    get:
      tags: [availability]
      summary: '[replenishment/outbound→cdc-inventory] 공급가능량 조회 (available = max(0, E−R−S))'
      description: 조회 사본이며 할당 성공을 보장하지 않는다. E는 적격 현물(품질 RELEASED·LOT VERIFIED·FEFO 최소 잔여일수 충족).
      operationId: getAvailability
      parameters:
        - { name: cdcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '404':
          description: SKU_NOT_FOUND (SKU 투영 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONFIG_REQUIRED (안전량 S 미설정 → 가용량 계산 보류) / SKU_NOT_HANDLED (센터 취급 OFF)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/allocations:
    post:
      tags: [allocations]
      summary: '[cdc-outbound→cdc-inventory] 승인 TRF 할당 (FEFO 다LOT, 예약 R +allocated) → AllocationResult'
      description: |
        trfId·trfVersion당 1회. 부분 할당 허용(allocated 48 / short 12). 승인량을 넘는 할당 요청은 거절(승인 정본 replenishment 가 아직 없어 지금은 검사하지 않음).
        SKU별 한도 = max(0, E'−R'−S) — E'·R' 은 잔여일수 조건을 통과한 적격 현물과 거기 걸린 예약. 한도 안에서 FEFO(소비기한 → 최초 인수시각 → LOT → **피킹 선반 먼저**(0.5.0) → 위치) 순으로 여러 LOT 를 잡는다.
        피킹 선반 여부는 cdc-location `POST /internal/location-lookups`(locationType PICK_FACE)로 읽는다 — 응답이 없으면 위치 코드 순으로 잡는다(동선 선호일 뿐 FEFO·한도는 그대로).
        하나도 못 잡으면 state FAILED(200). 같은 TRF 의 다른 버전 할당이 살아 있으면 409 ALLOCATION_EXISTS(먼저 해제).
        resultId = allocationId. 같은 키·다른 본문은 409 IDEMPOTENCY_CONFLICT. 결과는 AllocationResult(토픽 cdc.inventory.v1)로도 발행한다.
      operationId: createAllocation
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, trfId, trfVersion, lines]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                trfId: { type: string }
                trfVersion: { type: integer }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, requestedQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      requestedQty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      minRemainingDays: { type: integer, description: FEFO 최소 잔여일수 (미지정 시 정책값) }
      responses:
        '200':
          description: 할당 결과
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '_common.yaml#/components/schemas/CommandResponse' }
                  - { $ref: '#/components/schemas/Allocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INVALID_STATE (이미 출발 전기된 TRF) / ALLOCATION_EXISTS
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONFIG_REQUIRED (안전량 미설정) / SKU_NOT_HANDLED (센터 취급 OFF — details 에 lines[i])
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/allocations/{allocationId}:
    get:
      tags: [allocations]
      summary: 할당 조회 (LOT별 할당 수량·해제 이력)
      operationId: getAllocation
      parameters:
        - { name: allocationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Allocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/allocations/{allocationId}/releases:
    post:
      tags: [allocations]
      summary: '[cdc-outbound→cdc-inventory] 할당 해제 (전부/일부, 예약 R −q). 출발 전기된 수량은 해제 불가'
      description: |
        lines 를 비우면 남은 할당(할당 − 해제 − 출발) 전량. lot 을 비우면 소비기한이 늦은 LOT 부터 푼다(빠른 LOT 를 남김).
        남은 할당이 0 이 되면 state RELEASED(출발분이 있으면 DEPARTED). X-Expected-Version 은 할당 version.
      operationId: releaseAllocation
      parameters:
        - { name: allocationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [TRANSFER_CANCELLED, TRANSFER_CHANGED, PICK_SHORTAGE, PRE_DEPARTURE_CANCEL, RESIDUAL_CLOSED, QUALITY_BLOCKED] }
                sourceRef: { type: string, description: 취소/변경 요청 ID }
                recountHold:
                  type: boolean
                  description: |
                    (0.7.0) true 면 줄마다 그 SKU·LOT·위치를 **재계수 대기**로 둔다 — 풀 때까지 새 할당·추가 할당 후보에서 빠진다(현물·다른 예약은 그대로, 손실 차감 없음 — WMS CDC-F-018).
                    reason PICK_SHORTAGE 에서만, 줄마다 lot·locationCode 가 있어야 한다(아니면 400). 이미 대기 중이면 그대로 둔다.
                lines:
                  type: array
                  description: 비우면 전량 해제
                  items:
                    type: object
                    required: [sku, qty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      locationCode: { type: string, description: '(0.7.0) 주면 그 위치에 남은 할당만 푼다' }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (출발 전기 완료분) / VERSION_CONFLICT / RELEASE_EXCEEDS_ALLOCATED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/allocations/{allocationId}/additions:
    post:
      tags: [allocations]
      summary: '[cdc-outbound→cdc-inventory] 추가 할당 — 피킹 부족분을 다른 적격 LOT 로 다시 잡기 (0.7.0, WMS CDC-F-018)'
      description: |
        같은 할당(같은 TRF·버전)에 줄마다 qty 만큼 더 잡는다. 규칙은 처음 할당과 같다(한도 max(0, E'−R'−S), FEFO, 같은 LOT 이면 피킹 선반 먼저) — **재계수 대기 칸은 뺀다**.
        못 잡은 만큼은 addedQty 가 작다(부분 허용, 0 도 200). 호출자(cdc-outbound)는 부족으로 푼 수량 이하만 요청한다 — 승인 정본(replenishment)이 아직 없어 승인량 초과는 검사하지 않는다.
        할당 상태가 DEPARTED 면 409 INVALID_STATE. 같은 키·같은 본문은 저장 결과, 다른 본문은 409 IDEMPOTENCY_CONFLICT.
      operationId: addToAllocation
      parameters:
        - { name: allocationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, lines]
              properties:
                reason: { type: string, enum: [PICK_SHORTAGE_REALLOCATION] }
                sourceRef: { type: string, description: 부족 보고·작업 ID }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, qty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      minRemainingDays: { type: integer }
      responses:
        '200':
          description: 추가 결과(addedQty = 이번에 잡은 합)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [APPLIED] }
                  requestId: { type: string }
                  resultId: { type: string, description: commitId }
                  addedQty: { type: integer }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { type: string }
                        requestedQty: { type: integer }
                        addedQty: { type: integer }
                        lots:
                          type: array
                          items:
                            type: object
                            properties:
                              lot: { type: string }
                              locationCode: { type: string }
                              qty: { type: integer }
                              expiresAt: { type: string, format: date }
                  occurredAt: { type: string, format: date-time }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INVALID_STATE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONFIG_REQUIRED (안전량 미설정) / SKU_NOT_HANDLED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/departure-postings:
    post:
      tags: [postings]
      summary: '[cdc-outbound→cdc-inventory] TOUT 전기 (TruckDepartureValidated 후) → TransferDeparted'
      description: |
        현물 −q · 예약 −q · Transit +q 를 한 거래로 반영한다. departureLineId당 정확히 1회(재전송은 기존 commitId 반환).
        한 차량에 TRF A/B 합차 시 TRF별로 각각 호출한다. A 성공·B 불명이면 B만 GET /internal/commits/{commitId}로 해소하고 A를 재차감하지 않는다.
        할당 R보다 큰 q는 거절(DEPARTURE_EXCEEDS_ALLOCATED). resultId = commitId.
        같은 TRF 가 같은 departureId·같은 departureLineId 묶음으로 다시 오면(키가 달라도) 기존 commitId 를 돌려준다. 다른 departureId 면 409 INVALID_STATE.
        출발 뒤 남은 할당은 예약으로 남는다 — 호출자가 RESIDUAL_CLOSED 로 해제한다. 결과는 TransferDeparted(토픽 cdc.inventory.v1)로 발행한다.
      operationId: postDeparture
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, departureId, trfId, trfVersion, allocationId, departedAt, lines]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                departureId: { type: string, description: transport-execution TruckActuallyDeparted }
                departureSource: { type: string, enum: [REAL, SIMULATED] }
                toMfcId:
                  type: string
                  description: 목적 MFC(0.2.0). TransferDeparted.toMfc·Transit.mfcId 로 간다 — 승인 TRF(replenishment)가 아직 없어 mfc-inbound 가 입고 예정을 만들 때 쓴다
                trfId: { type: string }
                trfVersion: { type: integer }
                allocationId: { type: string }
                shipmentManifestId: { type: string }
                departedAt: { type: string, format: date-time }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [departureLineId, sku, lot, qty]
                    properties:
                      departureLineId: { type: string, description: 전기 멱등 단위 }
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      locationCode: { type: string }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      lpns: { type: array, items: { type: string } }
      responses:
        '200':
          description: 전기 결과 (APPLIED 또는 기존 commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INVALID_STATE (같은 TRF 2회 출발·할당과 TRF 불일치) / DEPARTURE_EXCEEDS_ALLOCATED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/receipt-acks:
    post:
      tags: [postings]
      summary: '[MfcReceiptPosted 소비→cdc-inventory] MFC 수령 확인 (receiptId 1회 → Transit −r) → TransitReconciled / TransferAckStatus'
      description: |
        r = 정상 n + 격리 h. 같은 receiptId 재수신은 기존 commitId 반환(재차감 없음).
        대사 후 미정산 t = q − r − l 이 0보다 크면 state RECEIPT_POSTED_AWAITING_ACK → 조사 대상. 자동 손실 전기 금지.
        정정 δr은 ReceiptCorrectionPosted의 correctionId로 별도 1회.
      operationId: acknowledgeReceipt
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiptId, trfId, departureId, mfcId, mfcCommitId, lines]
              properties:
                receiptId: { type: string }
                correctionId: { type: string, description: 정정(δr)일 때만 }
                trfId: { type: string }
                departureId: { type: string }
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                mfcCommitId: { type: string, description: mfc-inventory TIN commitId }
                receivedAt: { type: string, format: date-time }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, normalQty, quarantinedQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      normalQty: { type: integer, minimum: 0 }
                      quarantinedQty: { type: integer, minimum: 0 }
                      pendingQty: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 대사 결과 (APPLIED 또는 기존 commitId)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '_common.yaml#/components/schemas/CommandResponse' }
                  - type: object
                    properties:
                      transitState: { $ref: '#/components/schemas/TransitState' }
                      unreconciledQty: { type: integer, minimum: 0, description: t }
        '404':
          description: NOT_FOUND / DEPARTURE_NOT_POSTED (해당 departureId의 TOUT 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: IDEMPOTENCY_CONFLICT / RECEIPT_EXCEEDS_TRANSIT (r > 잔여 Transit)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/move-postings:
    post:
      tags: [postings]
      summary: '[cdc-inbound→cdc-inventory] 내부 이동 반영 (MOV·적치 — 위치 간 On-hand 이동, 수량 합 불변)'
      description: |
        S7 사가 2단계. location 공간 선점(spaceReservationId) 후 호출. 실패 시 inbound가 이번 선점분만 해제한다.
        (0.3.0) 같은 SKU·LOT·품질 상태로 fromLocationCode → toLocationCode 로 현물을 옮긴다. 센터 총량·LOT 의 최초 인수시각(FEFO 순서)은 바뀌지 않는다.
        - allocationId 가 없으면 원위치의 **예약 안 된** 현물만 옮긴다(부족하면 409 INSUFFICIENT_STOCK).
        - allocationId 를 주면 그 할당이 원위치에 잡아 둔 예약을 현물과 함께 옮긴다(예약 R 합은 그대로 — 내부 이동 점유를 새 수요로 두 번 빼지 않는다, CDC-F-008).
          그 할당의 원위치 남은 예약보다 많으면 409 INSUFFICIENT_STOCK. 할당이 ALLOCATED·PARTIAL 이 아니면 409 INVALID_STATE, 없으면 404.
        - qualityState 를 비우면 RELEASED. HELD·QUARANTINED 현물도 옮길 수 있으나 allocationId 와 함께 쓸 수 없다(예약은 정상 현물에만).
        - 같은 위치로의 이동·같은 줄 키 중복은 400. 위치 상태(BLOCKED 등)는 cdc-location 공간 선점이 판단한다 — 여기서는 보지 않는다.
        resultId = commitId(postingKind MOVE, 원위치 ON_HAND −q·도착 +q, 예약을 옮기면 RESERVED −q·+q).
      operationId: postMove
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, moveKind, sourceRef, lines]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                moveKind: { type: string, enum: [PUTAWAY, REPLENISHMENT_MOVE, RELOCATION, PICK_MOVE], description: '(0.7.1) PICK_MOVE = 피킹 재고를 출고대기 자리로(allocationId 와 함께 — 예약도 옮김, 총현물 그대로)' }
                sourceRef: { type: string, description: putawayTaskId / moveId }
                spaceReservationId: { type: string }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, lot, fromLocationCode, toLocationCode, qty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      fromLocationCode: { type: string }
                      toLocationCode: { type: string }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      qualityState: { $ref: '#/components/schemas/QualityState' }
                      allocationId: { type: string, description: '0.3.0 — 이 할당의 예약을 함께 옮긴다(보충 MOV)' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INSUFFICIENT_STOCK (원위치 수량 부족) / INVALID_STATE (할당 상태) / LOCATION_BLOCKED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/quality-postings:
    post:
      tags: [postings]
      summary: '[cdc-quality→cdc-inventory] 품질 상태 전환 (HOLD / RELEASE / DISPOSE) → LotBlocked / InventoryAdjustmentPosted'
      description: |
        HOLD: E → Held (유효 예약 R에 걸린 수량은 QUALITY_BLOCKED로 outbound에 통지). RELEASE: Held → E. DISPOSE: Held −q (장부 차감, approvalRef 필수).
        판단은 quality가 하고 수량 변경은 여기서만 한다.
      operationId: postQualityChange
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, action, sourceRef, lines]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                action: { type: string, enum: [HOLD, RELEASE, DISPOSE] }
                sourceRef: { type: string, description: holdId / recallId / disposalApprovalId }
                approvalRef: { type: string, description: DISPOSE 필수 }
                reason: { type: string }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, lot]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      locationCode: { type: string, description: 비우면 LOT 전체 }
                      qty: { type: integer, minimum: 1, description: 비우면 해당 범위 전량 }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED (DISPOSE에 approvalRef 없음) / EVIDENCE_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/loss-postings:
    post:
      tags: [postings]
      summary: '[replenishment/backoffice→cdc-inventory] 승인 운송 손실 l 반영 (Transit −l) → q = r + l + t 종결'
      description: 자동 손실 전기 금지. 본사 손실 승인(approvalRef)이 있어야 한다. 손실은 MFC 재고가 아니며 CDC로 복원하지 않는다.
      operationId: postTransportLoss
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trfId, departureId, approvalRef, lines]
              properties:
                trfId: { type: string }
                departureId: { type: string }
                approvalRef: { type: string }
                incidentRef: { type: string, description: TransportIncidentRaised }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, lot, lossQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      lossQty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      lossReason: { type: string, enum: [DAMAGE, MISSING, TEMPERATURE, OTHER] }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: IDEMPOTENCY_CONFLICT / LOSS_EXCEEDS_UNRECONCILED (l > t)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/adjustments:
    post:
      tags: [postings]
      summary: '[backoffice→cdc-inventory] 승인 재고 조정 ADJ / 실사 차이 CNT 집행 → InventoryAdjustmentPosted'
      operationId: postAdjustment
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, adjustmentKind, approvalRef, lines]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                adjustmentKind: { type: string, enum: [ADJ, CNT] }
                approvalRef: { type: string }
                countSessionId: { type: string, description: CNT일 때 실사 회차 }
                reason: { type: string }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, lot, locationCode, deltaQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      locationCode: { type: string }
                      deltaQty: { type: integer, description: 양수 증가·음수 감소 (0 금지) }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INSUFFICIENT_STOCK (감소가 미예약 현물 초과)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/initial-balances:
    post:
      tags: [postings]
      summary: '[backoffice→cdc-inventory] 초기 보유 INITIAL_BALANCE 전기 (센터·SKU·LOT당 승인 1회)'
      description: |
        이미 수불 이력이 있는 센터·SKU·LOT에는 거절(INITIAL_BALANCE_EXISTS). 이후 변경은 ADJ로만.
        한 요청 안에서 같은 LOT 이 여러 위치에 있을 수 있다(LOT 의 expiresAt·lotIdentification 은 같아야 함). 같은 SKU·LOT·위치가 두 번이면 400.
        qualityState 는 RELEASED·HELD·QUARANTINED(DISPOSED 는 400). lotIdentification 을 비우면 UNVERIFIED — 적격 현물 E 에 들지 않는다.
        센터 취급 ON 은 요구하지 않는다(할당·가용에서 본다). SKU 투영이 없으면 404 SKU_NOT_FOUND. 실입고·적치 이력은 만들지 않는다.
      operationId: postInitialBalance
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, approvalRef, lines]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                approvalRef: { type: string }
                lines:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    required: [sku, lot, locationCode, qty, qualityState]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      lotIdentification: { $ref: '#/components/schemas/LotIdentification' }
                      expiresAt: { type: string, format: date }
                      locationCode: { type: string }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      qualityState: { $ref: '#/components/schemas/QualityState' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404':
          description: SKU_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INITIAL_BALANCE_EXISTS
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/safety-stocks:
    post:
      tags: [postings]
      summary: '[replenishment/backoffice→cdc-inventory] 승인 안전량 S 설정 (센터·SKU 합계 보호량, 0.2.0)'
      description: |
        SCM 이 승인한 안전량을 센터·SKU 마다 넣는다. 값이 바뀔 때마다 policyVersion +1. 0 도 값이다(미설정과 다름 — 미설정이면 가용·할당이 CONFIG_REQUIRED).
        안전량 상향은 신규 할당에만 적용하고 기존 확보를 풀지 않는다(CDC-F-008). 같은 SKU 가 두 번이면 400.
      operationId: setSafetyStocks
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, approvalRef, lines]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                approvalRef: { type: string }
                lines:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    required: [sku, safetyQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      safetyQty: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/commits/{commitId}:
    get:
      tags: [commits]
      summary: 원결과 조회 (모든 전기 명령의 짝 조회 — UNKNOWN_RESULT 해소 경로)
      operationId: getCommit
      parameters:
        - { name: commitId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Commit' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/transits:
    get:
      tags: [reconciliation]
      summary: '[replenishment→cdc-inventory] Transit 조회 (q·r·l·t, 상태)'
      operationId: listTransits
      parameters:
        - { name: trfId, in: query, schema: { type: string } }
        - { name: departureId, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/TransitState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items: { type: array, items: { $ref: '#/components/schemas/Transit' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /internal/snapshots:
    get:
      tags: [availability]
      summary: '[replenishment→cdc-inventory] 재고 스냅샷 조회 (InventorySnapshotPublished와 같은 내용·버전)'
      description: |
        (0.4.0) 지금 장부를 그대로 읽은 조회 사본(snapshotId = 이번 조회 식별, 저장하지 않음). sku 를 비우면 센터에 현물 행이 있는 SKU 전부(SKU 오름차순).
        가용 조회와 달리 취급 OFF·안전량 미설정이어도 거절하지 않는다 — handlingActive=false, safety.state NOT_SET 이면 available 은 null.
        lots[].locations[] 에 위치·품질 상태별 현물(onHand)·예약(reserved)을 준다(칠곡 시뮬레이터 실서버 모드가 칸별 재고를 그린다).
        지난 snapshotId 는 보관하지 않아 404.
      operationId: getSnapshot
      parameters:
        - { name: cdcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - { name: snapshotId, in: query, schema: { type: string }, description: 미지정 시 최신 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshotId: { type: string }
                  cdcId: { type: string }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items: { type: array, items: { $ref: '#/components/schemas/Availability' } }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/daily-reconciliations:
    get:
      tags: [reconciliation]
      summary: 일일 수불 대사 조회 (시작 + 조정증가 − 출발 − 폐기 − 조정감소 = 종료)
      operationId: getDailyReconciliation
      parameters:
        - { name: cdcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: Asia/Seoul 기준 영업일 }
        - { name: sku, in: query, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cdcId: { type: string }
                  date: { type: string, format: date }
                  state: { type: string, enum: [BALANCED, DISCREPANCY, IN_PROGRESS] }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items: { type: array, items: { $ref: '#/components/schemas/DailyReconciliationLine' } }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/stock-snapshot:
    get:
      tags: [availability]
      summary: '[운영자] 재고 현황 (DC 백오피스 — 내부 스냅샷과 같은 내용)'
      description: |
        sku 를 비우면 센터에 현물 행이 있는 SKU 전부. withPlaces=true 면 lots[].locations[](위치·품질 상태별 현물·예약)까지 — 기본 false(목록 화면은 가볍게).
        자기 센터 운영자만(토큰 centers 에 cdcId, 없으면 403).
      operationId: getCenterStockSnapshot
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - { name: withPlaces, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshotId: { type: string }
                  cdcId: { type: string }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items: { type: array, items: { $ref: '#/components/schemas/Availability' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cdcs/{cdcId}/recount-holds:
    get:
      tags: [availability]
      summary: '[운영자] 재계수 대기 목록 (0.7.0 — 피킹 부족 칸)'
      description: 피킹 부족 해제(recountHold)로 생긴 SKU·LOT·위치. 대기 중인 칸은 새 할당 후보에서 빠진다. 자기 센터 운영자만.
      operationId: listRecountHolds
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: state, in: query, schema: { type: string, enum: [HELD, RELEASED] } }
      responses:
        '200':
          description: OK(만든 순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RecountHold' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cdcs/{cdcId}/recount-holds/{holdId}/releases:
    post:
      tags: [availability]
      summary: '[운영자] 재계수 대기 풀기 (0.7.0) — 다시 새 할당 후보가 된다'
      description: |
        운영자가 칸을 다시 세어 본 뒤 푼다. 센 결과(현물 차이)를 장부에 반영하는 조정은 아직 없다(손실·조정 전기 501) — 차이가 있으면 풀지 말고 조정 기능을 기다린다.
        이미 풀린 대기는 200(그대로). 자기 센터 운영자만.
      operationId: releaseRecountHold
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: holdId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: 풀린 대기
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecountHold' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/count-sessions:
    post:
      tags: [counts]
      summary: '[운영자] 실사 시작 — 칸 잠금·장부 기준 고정 (0.8.0)'
      description: |
        칸 1~200개. 그 칸들의 정상(RELEASED) 현물을 SKU·LOT·칸별 장부 기준으로 고정하고, 끝날 때까지 칸을 **새 할당·추가 할당 후보에서 뺀다**(이미 걸린 예약·이동은 막지 않음 — 결정 때 장부가 바뀌었으면 BOOK_CHANGED).
        출고대기(통로 91) 칸은 실사 대상이 아니다(400 STAGING_NOT_COUNTED — 출발할 물건, 출발 검증이 대조). 품질 보류·격리 현물이 있는 칸은 409 QUALITY_STOCK_PRESENT(품질 처리 먼저).
        같은 칸에 열린 실사가 있으면 409 COUNT_IN_PROGRESS. 응답의 계수표에는 장부 수량이 없다.
      operationId: startCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationCodes]
              properties:
                locationCodes: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
                reason: { type: string, maxLength: 300 }
      responses:
        '201':
          description: 시작(COUNTING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: COUNT_IN_PROGRESS / QUALITY_STOCK_PRESENT / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/count-sessions/{sessionId}:
    get:
      tags: [counts]
      summary: '[운영자] 실사 조회 — 결정 전에는 장부 수량을 보이지 않는다 (0.8.0)'
      operationId: getCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/count-sessions/{sessionId}/counts:
    post:
      tags: [counts]
      summary: '[작업자] 첫 계수 (0.8.0) — 같으면 MATCHED, 다르면 RECOUNT_REQUIRED'
      description: |
        계수자 = 토큰 주체. 줄 = 칸·SKU·LOT·센 수량(계수표에 없는 줄 = 0). 계수표에 없던 LOT 은 이 센터에 이미 있는 LOT 만(처음 보는 LOT 은 400 LOT_UNKNOWN — 입고 기록 없는 재고 증가 금지, CDC-F-029).
        실사 칸 밖 줄은 400. COUNTING 일 때만(아니면 409 INVALID_STATE).
      operationId: submitFirstCount
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CountLines' }
      responses:
        '200':
          description: 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/count-sessions/{sessionId}/recounts:
    post:
      tags: [counts]
      summary: '[작업자] 재계수 (0.8.0) — 첫 계수자와 다른 사람. 최종 = 재계수'
      description: RECOUNT_REQUIRED 일 때만. 같은 사람이면 409 SAME_COUNTER. 장부 기준과 같으면 MATCHED, 다르면 PENDING_APPROVAL.
      operationId: submitRecount
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CountLines' }
      responses:
        '200':
          description: 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: INVALID_STATE / SAME_COUNTER / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/count-sessions/{sessionId}/decisions:
    post:
      tags: [counts]
      summary: '[관리자] 실사 결정 — APPROVE(CNT 조정) / REJECT (0.8.0)'
      description: |
        PENDING_APPROVAL 일 때만. 시작자·계수자와 다른 운영자(422 SELF_APPROVAL — 요청자·승인자 분리, CDC-F-029).
        APPROVE: 기준 뒤 그 칸 장부가 바뀌었으면 409 BOOK_CHANGED(다시 실사) → 승인 관문(아래) → 한 원결과(CNT)로 차이(최종 − 기준)만 현물에 반영 → 잠금·재계수 대기 해소 → InventoryAdjustmentPosted.
        감소로 그 칸 현물이 예약보다 적어지면 409 COUNT_BELOW_RESERVED(아직 — 나중 예약부터 부족 처리는 다음 단계).
        승인 관문(`pmart.inventory.approval-ref.mode`): RECORD_ONLY = approvalRef 필수·확인 없음. VERIFY = MFC 와 같은 본사 기준(한 건 손실 ≥ `hq-loss-krw` 또는 한 SKU ≥ `hq-sku-qty`, 단가 = pricing 판매 기준가, 없으면 본사) —
        아래면 센터 관리자 결정만, 이상이면 approvalRef 없을 때 422 APPROVAL_REQUIRED(details approvalRequest = approval-service 변경 요청 본문), 있으면 approval-service 로 한 번 사용·범위 확인. 그 밖·비움 = 422 CONFIG_REQUIRED.
        REJECT: 조정 없음, 잠금 해소(재계수 대기는 남김 — 다시 실사).
      operationId: decideCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string, maxLength: 300 }
                approvalRef: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 결정 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE / BOOK_CHANGED / COUNT_BELOW_RESERVED / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: SELF_APPROVAL / APPROVAL_REQUIRED / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/sku-handlings:
    get:
      tags: [sku-handlings]
      summary: '[운영자] CDC SKU 취급 ON/OFF 목록 (취급 레코드가 없으면 OFF)'
      description: |
        상품 SKU 투영(SkuIssued/ProductVersionPublished)에 있는 SKU 전체를 이 센터의 취급 여부와 함께 돌려준다.
        취급 레코드가 없으면 OFF(handlingEnabled=false, version 0)이다(사용자 결정 2026-10-30: 기본 OFF, 센터 운영자가 켬).
        토큰의 centers 클레임에 cdcId 가 없으면 403.
      operationId: listSkuHandlings
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: enabled, in: query, required: false, description: 'true=ON 만, false=OFF(레코드 없음 포함)만, 생략=전체', schema: { type: boolean } }
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - $ref: '_common.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: OK (SKU 오름차순, 커서 = 마지막 SKU)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingPage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [sku-handlings]
      summary: '[운영자] CDC SKU 취급 ON/OFF 변경 (자기 센터만)'
      description: |
        켜기(enabled=true)는 SKU 투영이 있고 state=ACTIVE 일 때만(INACTIVE → 422 SKU_INACTIVE). 끄기는 항상 허용.
        현재 값과 같으면 변경·이력 없이 현재 상태를 돌려준다(changed=false). 바뀌면 이력을 남기고 version +1.
        X-Expected-Version 은 이 센터·SKU 취급 레코드의 version(레코드가 없으면 0).
      operationId: changeSkuHandling
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuHandlingChange' }
      responses:
        '200':
          description: 반영(같은 키·같은 본문 재요청은 저장된 결과 재생)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: SKU_NOT_FOUND (SKU 투영이 아직 없음 — 상품 승인 이벤트 수신 전)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SKU_INACTIVE (비활성 SKU 는 켤 수 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/sku-handling-batches:
    post:
      tags: [sku-handlings]
      summary: '[운영자] CDC SKU 취급 일괄 변경 (최대 500행, 전부 또는 전무)'
      description: |
        모든 행을 먼저 검증하고 하나라도 실패하면 아무것도 바꾸지 않는다(422 SKU_HANDLING_BATCH_REJECTED, details[].field = items[i]).
        행 규칙은 단건과 같다. 같은 SKU 가 두 번 나오면 400 VALIDATION_FAILED.
      operationId: changeSkuHandlingBatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuHandlingBatchRequest' }
      responses:
        '200':
          description: 전 행 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingBatchResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SKU_HANDLING_BATCH_REJECTED (행별 SKU_NOT_FOUND / SKU_INACTIVE / VERSION_CONFLICT 를 details 에)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/skus/{sku}:
    get:
      tags: [skus]
      summary: '[서비스→cdc-inventory] SKU 투영 조회 (product-service 이벤트 사본)'
      description: 조회 사본이다. 상품 정본은 product-service.
      operationId: getSkuProjection
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuProjection' }
        '404':
          description: SKU_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  schemas:
    CountLines:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [locationCode, sku, lot, qty]
            properties:
              locationCode: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lot: { type: string }
              qty: { type: integer, minimum: 0 }
    CountSession:
      type: object
      description: (0.8.0) 실사. state COUNTING → MATCHED / RECOUNT_REQUIRED → MATCHED / PENDING_APPROVAL → APPROVED / REJECTED.
      properties:
        sessionId: { type: string }
        cdcId: { type: string }
        state: { type: string, enum: [COUNTING, RECOUNT_REQUIRED, PENDING_APPROVAL, MATCHED, APPROVED, REJECTED] }
        locationCodes: { type: array, items: { type: string } }
        sheet:
          type: array
          description: 계수표 — 칸·SKU·LOT(장부 수량 없음)
          items:
            type: object
            properties:
              locationCode: { type: string }
              sku: { type: string }
              lot: { type: string }
        lines:
          type: array
          description: 결정 뒤(MATCHED·APPROVED·REJECTED)에만 — 장부·첫 계수·최종·차이
          items:
            type: object
            properties:
              locationCode: { type: string }
              sku: { type: string }
              lot: { type: string }
              bookQty: { type: integer }
              firstQty: { type: integer }
              finalQty: { type: integer }
              deltaQty: { type: integer }
        startedBy: { type: string }
        firstCounterId: { type: [string, 'null'] }
        recounterId: { type: [string, 'null'] }
        decidedBy: { type: [string, 'null'] }
        approvalRef: { type: [string, 'null'] }
        commitId: { type: [string, 'null'], description: CNT 원결과 }
        reason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    RecountHold:
      type: object
      description: (0.7.0) 재계수 대기 — 피킹 부족이 난 SKU·LOT·위치. HELD 동안 새 할당 후보에서 빠진다.
      properties:
        holdId: { type: string }
        sku: { type: string }
        lot: { type: string }
        locationCode: { type: string }
        state: { type: string, enum: [HELD, RELEASED] }
        shortQty: { type: integer, description: 보고된 부족(대기를 만들 때의 해제 수량 합) }
        allocationId: { type: string }
        sourceRef: { type: string }
        createdAt: { type: string, format: date-time }
        releasedAt: { type: [string, 'null'], format: date-time }
        releasedBy: { type: [string, 'null'] }
        releaseReason: { type: [string, 'null'] }
    QualityState:
      type: string
      enum: [RELEASED, HELD, QUARANTINED, DISPOSED]
    LotIdentification:
      type: string
      description: LOT 식별 신뢰도. INVALID는 적격 현물 E에서 제외.
      enum: [UNVERIFIED, VERIFIED, INVALID]
    TransitState:
      type: string
      description: |
        TRANSIT_OPEN: TOUT 전기됨·수령 확인 없음. RECEIPT_POSTED_AWAITING_ACK: MFC TIN 수신 후 미정산 t > 0 (조사 대상).
        TRANSIT_RECONCILED: q = r + l + t 로 종결(t = 0 또는 승인 손실 반영).
      enum: [TRANSIT_OPEN, RECEIPT_POSTED_AWAITING_ACK, TRANSIT_RECONCILED]
    Availability:
      type: object
      description: available = max(0, E − R − S). 0 ≤ R ≤ E ≤ onHand.
      properties:
        cdcId: { type: string }
        sku: { type: string }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        onHand: { type: integer, minimum: 0, description: 장부 현물 (품질 상태 무관) }
        eligible: { type: integer, minimum: 0, description: E 적격 현물 }
        reserved: { type: integer, minimum: 0, description: R 이관 예약 }
        held: { type: integer, minimum: 0 }
        safety: { $ref: '_common.yaml#/components/schemas/PolicyValue' }
        available: { type: [integer, 'null'], minimum: 0, description: '안전량 미설정(safety NOT_SET)이면 null — 0 으로 대신하지 않는다(스냅샷)' }
        transit: { type: integer, minimum: 0, description: 출발·미대사 Transit 합 }
        handlingActive: { type: boolean, description: 센터 취급 활성 }
        lots:
          type: array
          items:
            type: object
            properties:
              lot: { type: string }
              expiresAt: { type: string, format: date }
              remainingDays: { type: integer }
              identification: { $ref: '#/components/schemas/LotIdentification' }
              eligible: { type: integer }
              reserved: { type: integer }
              held: { type: integer }
              locations:
                type: array
                description: 위치·품질 상태별 현물·예약(0.4.0 — 스냅샷만, 가용 조회는 비움)
                items:
                  type: object
                  properties:
                    locationCode: { type: string }
                    qualityState: { $ref: '#/components/schemas/QualityState' }
                    onHand: { type: integer }
                    reserved: { type: integer }
    Allocation:
      type: object
      properties:
        allocationId: { type: string }
        trfId: { type: string }
        trfVersion: { type: integer }
        state: { type: string, enum: [ALLOCATED, PARTIAL, RELEASED, DEPARTED, FAILED] }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        commitId: { type: string }
        allocatedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              requestedQty: { type: integer }
              allocatedQty: { type: integer, description: 할당 48 }
              shortQty: { type: integer, description: 부족 12 }
              releasedQty: { type: integer }
              departedQty: { type: integer }
              lots:
                type: array
                description: FEFO 순
                items:
                  type: object
                  properties:
                    lot: { type: string }
                    locationCode: { type: string }
                    qty: { type: integer }
                    expiresAt: { type: string, format: date }
    Transit:
      type: object
      description: 출발 q = MFC 확정수령 r + 승인 운송손실 l + 미정산 t
      properties:
        trfId: { type: string }
        departureId: { type: string }
        mfcId: { type: string }
        state: { $ref: '#/components/schemas/TransitState' }
        departedAt: { type: string, format: date-time }
        reconciledAt: { type: [string, 'null'], format: date-time }
        receiptIds: { type: array, items: { type: string } }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              lot: { type: string }
              q: { type: integer, description: 출발 수량 }
              r: { type: integer, description: 확정 수령 (정상 + 격리) }
              normalQty: { type: integer }
              quarantinedQty: { type: integer }
              l: { type: integer, description: 승인 손실 }
              t: { type: integer, description: 미정산 }
    Commit:
      type: object
      properties:
        commitId: { type: string }
        requestId: { type: string }
        postingKind: { type: string, enum: [ALLOCATION, RELEASE, TOUT, RECEIPT_ACK, MOVE, QUALITY, LOSS, ADJ, CNT, INITIAL_BALANCE] }
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        sourceSystem: { type: string }
        sourceRef: { type: string }
        appliedAt: { type: string, format: date-time }
        deltas:
          type: array
          description: 한 거래로 반영된 수량 변화
          items:
            type: object
            properties:
              sku: { type: string }
              lot: { type: string }
              locationCode: { type: string }
              bucket: { type: string, enum: [ON_HAND, RESERVED, HELD, TRANSIT] }
              delta: { type: integer }
        rejectReason: { type: string }
    DailyReconciliationLine:
      type: object
      properties:
        sku: { type: string }
        opening: { type: integer }
        adjustmentIn: { type: integer }
        departed: { type: integer }
        disposed: { type: integer }
        adjustmentOut: { type: integer }
        closing: { type: integer }
        computedClosing: { type: integer }
        discrepancy: { type: integer, description: closing − computedClosing (0이어야 함) }
    SkuHandling:
      type: object
      required: [sku, handlingEnabled, version]
      properties:
        sku: { type: string }
        handlingEnabled: { type: boolean, description: 레코드가 없으면 false }
        version: { type: integer, description: 취급 레코드 version (레코드 없음 = 0) }
        skuState: { type: string, enum: [ACTIVE, INACTIVE] }
        productId: { type: [string, 'null'] }
        changedBy: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
    SkuHandlingPage:
      type: object
      properties:
        centerId: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/SkuHandling' } }
        page: { $ref: '_common.yaml#/components/schemas/Page' }
    SkuHandlingChange:
      type: object
      required: [sku, enabled]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        enabled: { type: boolean }
        reason: { type: string, maxLength: 500 }
    SkuHandlingResult:
      type: object
      required: [status, requestId, occurredAt, handling]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        changed: { type: boolean, description: false 면 이미 같은 값이라 바뀐 것이 없음 }
        occurredAt: { type: string, format: date-time }
        handling: { $ref: '#/components/schemas/SkuHandling' }
    SkuHandlingBatchRequest:
      type: object
      required: [items]
      properties:
        reason: { type: string, maxLength: 500, description: 행에 reason 이 없을 때 쓰는 공통 사유 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/SkuHandlingBatchItem' }
    SkuHandlingBatchItem:
      type: object
      required: [sku, enabled]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        enabled: { type: boolean }
        reason: { type: string, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 0, description: 행별 낙관적 잠금(선택) }
    SkuHandlingBatchResult:
      type: object
      required: [status, requestId, occurredAt, items]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        changedCount: { type: integer }
        occurredAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/SkuHandling' } }
    SkuProjection:
      type: object
      required: [sku, state, productVersion]
      properties:
        sku: { type: string }
        productId: { type: [string, 'null'] }
        baseProductId: { type: [string, 'null'] }
        unitType: { type: [string, 'null'] }
        unitsPerSku: { type: [integer, 'null'] }
        weightG: { type: [integer, 'null'] }
        volumeMl: { type: [integer, 'null'] }
        storageType: { type: [string, 'null'], description: AMBIENT / CHILLED / FROZEN }
        alcohol: { type: [boolean, 'null'] }
        state: { type: string, enum: [ACTIVE, INACTIVE] }
        productVersion: { type: integer, description: 마지막으로 반영한 상품 버전(이보다 오래된 이벤트는 무시) }
        logistics:
          type: [object, 'null']
          description: 승인된 물류 규격(CDC-F-002). 미등록 항목은 null
          properties:
            unitsPerBox: { type: [integer, 'null'] }
            boxesPerPallet: { type: [integer, 'null'] }
            ti: { type: [integer, 'null'] }
            hi: { type: [integer, 'null'] }
        updatedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
