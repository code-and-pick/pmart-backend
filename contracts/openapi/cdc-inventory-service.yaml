          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/initial-balances:
    post:
      tags: [postings]
      summary: '[backoffice→cdc-inventory] 초기 보유 INITIAL_BALANCE 전기 (센터·SKU·LOT당 승인 1회)'
      description: |
        이미 수불 이력이 있는 센터·SKU·LOT에는 거절(INITIAL_BALANCE_EXISTS). 이후 변경은 ADJ로만.
        한 요청 안에서 같은 LOT 이 여러 위치에 있을 수 있다(LOT 의 expiresAt·lotIdentification 은 같아야 함). 같은 SKU·LOT·위치가 두 번이면 400.
        qualityState 는 RELEASED·HELD·QUARANTINED(DISPOSED 는 400). lotIdentification 을 비우면 UNVERIFIED — 적격 현물 E 에 들지 않는다.
        센터 취급 ON 은 요구하지 않는다(할당·가용에서 본다). SKU 투영이 없으면 404 SKU_NOT_FOUND. 실입고·적치 이력은 만들지 않는다.
      operationId: postInitialBalance
