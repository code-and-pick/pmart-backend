    get:
      tags: [reconciliation]
      summary: '[cdc-quality→cdc-inventory] LOT 추적 — 모든 CDC 의 현물·출발 (0.18.0, 리콜 정방향 추적)'
      description: |
        WMS 정책 16.13.2 3~4·16.13.3 정방향 추적: 이 SKU·LOT 이 지금 어느 CDC·칸·품질 상태에 얼마나 있고(stock — 현물 0 인 행은 뺌),
        어느 출발로 어느 MFC 에 얼마가 갔는지(transits — 받은·손실·미정산). 읽기만. MFC 안의 재고·고객 출고는 각 정본(mfc-inventory·order)이 본다.
      operationId: getLotTrace
      parameters:
        - { name: sku, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - { name: lot, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sku: { type: string }
                  lot: { type: string }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  stock:
                    type: array
                    items:
                      type: object
                      properties:
                        cdcId: { type: string }
                        locationCode: { type: string }
                        qualityState: { type: string }
                        onHand: { type: integer }
                        reserved: { type: integer }
                  transits:
                    type: array
                    items:
                      type: object
                      properties:
                        cdcId: { type: string }
                        trfId: { type: string }
                        departureId: { type: string }
                        mfcId: { type: [string, 'null'] }
                        departedAt: { type: string, format: date-time }
                        state: { $ref: '#/components/schemas/TransitState' }
                        q: { type: integer }
                        received: { type: integer, description: 정상 + 격리 + 미판정 }
                        loss: { type: integer }
                        unreconciled: { type: integer }

  /internal/daily-reconciliations:
    get:
      tags: [reconciliation]
      summary: 일일 수불 대사 조회 (시작 + 조정증가 − 출발 − 폐기 − 조정감소 = 종료)
      description: |
        (0.16.0 구현, WMS CDC-F-034 — 사용자 2026-11-26 "조회할 때 계산") 부를 때 원장(inventory_commit 의 ON_HAND 증감)으로 계산한다. 저장·새벽 배치·경보는 없다(배치 시각·경보는 승인 설정이 정해진 뒤).
        차이가 있어도 원장을 고치지 않는다(차이를 일괄 ADJ 로 없애지 않음 — 원사건부터 복구).
        - 날 = Asia/Seoul date 00:00 ~ 다음날 00:00. 그날이 아직 안 끝났으면 state IN_PROGRESS(지금까지).
        - SKU 줄(그 센터에 원장 또는 현물이 있는 SKU, 모든 위치·품질 상태 합): opening = 그날 전 원장 합, 그날 증감을 원결과 종류로 나눔 — initialBalance(INITIAL_BALANCE — 개시 시점 한 번),
          adjustmentIn/Out(CNT 실사 조정 등 증·감), departed(TOUT), disposed(DISPOSAL), movedNet(MOVE·PICK_MOVE·품질 전환 — 센터 합계에서 0 이어야 함).
          computedClosing = opening + initialBalance + adjustmentIn − departed − disposed − adjustmentOut + movedNet. closing = 지금 장부 현물 − 그날 뒤 원장 증감.
          discrepancy = closing − computedClosing(장부 현물과 원장 합이 어긋난 양 — 0 이어야 함).
        - reservationChecks(지금 시점): 칸·SKU·LOT 의 장부 예약 ≠ 살아 있는 할당(ALLOCATED·PARTIAL)의 남은 예약 합인 줄만.
        - transitChecks(지금 시점): SKU 별 원장 운송 중(TRANSIT 합) ≠ 출발 줄 미정산 합(q − 정상 − 격리 − 미판정 − 손실)인 줄만. openTransits: 아직 TRANSIT_RECONCILED 아닌 출발(오래된 것부터, 최대 200 — 미수령 조사).
        - state: DISCREPANCY(SKU 차이·예약·운송 중 대조 줄이 하나라도 — 진행 중인 날이어도 먼저) / IN_PROGRESS(그날 진행 중) / BALANCED.
      operationId: getDailyReconciliation
      parameters:
        - { name: cdcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: date, in: query, required: true, schema: { type: string, format: date }, description: Asia/Seoul 기준 영업일 }
        - { name: sku, in: query, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cdcId: { type: string }
                  date: { type: string, format: date }
                  state: { type: string, enum: [BALANCED, DISCREPANCY, IN_PROGRESS] }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items: { type: array, items: { $ref: '#/components/schemas/DailyReconciliationLine' } }
                  reservationChecks:
                    type: array
                    description: (0.16.0) 장부 예약 ≠ 할당 남은 예약인 칸 줄만(지금 시점)
                    items:
                      type: object
                      properties:
                        locationCode: { type: string }
                        sku: { type: string }
                        lot: { type: string }
                        reserved: { type: integer }
                        allocationRemaining: { type: integer }
                  transitChecks:
                    type: array
                    description: (0.16.0) 원장 운송 중 ≠ 출발 줄 미정산인 SKU 줄만(지금 시점)
                    items:
                      type: object
                      properties:
                        sku: { type: string }
                        ledgerTransit: { type: integer }
                        unreconciled: { type: integer }
                  openTransits:
                    type: array
                    description: (0.16.0) 아직 정산되지 않은 출발 — 오래된 것부터, 최대 200
                    items:
                      type: object
                      properties:
                        trfId: { type: string }
                        departureId: { type: string }
                        mfcId: { type: [string, 'null'] }
                        state: { $ref: '#/components/schemas/TransitState' }
                        departedAt: { type: string, format: date-time }
                        unreconciledQty: { type: integer }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/location-stocks:
    get:
      tags: [availability]
      summary: '[운영자] 칸별 재고 (0.9.0 — DC 백오피스 칸 카드)'
      description: |
        재고 스냅샷(현물 행이 있는 SKU)을 칸 기준으로 펼친다 — 한 줄 = 칸 × SKU × LOT × 품질 상태. locationPrefix(칸 코드 앞부분, 예 CDC01-C-05)·sku 로 거른다.
        칸 코드 → SKU → LOT 순. 줄이 많으면 limit(기본 500, 최대 2000)에서 자르고 truncated=true.
      operationId: listCenterLocationStocks
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: locationPrefix, in: query, required: false, schema: { type: string, maxLength: 40 } }
        - { name: sku, in: query, required: false, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  cdcId: { type: string }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  truncated: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      required: [locationCode, sku, lot, qualityState, onHand, reserved]
                      properties:
                        locationCode: { type: string }
                        sku: { type: string }
                        productName: { type: [string, 'null'], description: '(0.17.0) 상품 관리용 명칭(product internalName — MFC 와 같은 기준), 모르면 null' }
                        lot: { type: string }
                        qualityState: { type: string }
                        onHand: { type: integer }
                        reserved: { type: integer }
                        expiresAt: { type: [string, 'null'], format: date }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cdcs/{cdcId}/stock-snapshot:
    get:
      tags: [availability]
      summary: '[운영자] 재고 현황 (DC 백오피스 — 내부 스냅샷과 같은 내용)'
      description: |
        sku 를 비우면 센터에 현물 행이 있는 SKU 전부. withPlaces=true 면 lots[].locations[](위치·품질 상태별 현물·예약)까지 — 기본 false(목록 화면은 가볍게).
        자기 센터 운영자만(토큰 centers 에 cdcId, 없으면 403).
      operationId: getCenterStockSnapshot
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - { name: withPlaces, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshotId: { type: string }
                  cdcId: { type: string }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items: { type: array, items: { $ref: '#/components/schemas/Availability' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cdcs/{cdcId}/recount-holds:
    get:
      tags: [availability]
      summary: '[운영자] 재계수 대기 목록 (0.7.0 — 피킹 부족 칸)'
      description: 피킹 부족 해제(recountHold)로 생긴 SKU·LOT·위치. 대기 중인 칸은 새 할당 후보에서 빠진다. 자기 센터 운영자만.
      operationId: listRecountHolds
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: state, in: query, schema: { type: string, enum: [HELD, RELEASED] } }
      responses:
        '200':
          description: OK(만든 순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RecountHold' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cdcs/{cdcId}/recount-holds/{holdId}/releases:
    post:
      tags: [availability]
      summary: '[운영자] 재계수 대기 풀기 (0.7.0) — 다시 새 할당 후보가 된다'
      description: |
        운영자가 칸을 다시 세어 본 뒤 푼다. 센 결과(현물 차이)를 장부에 반영하는 조정은 아직 없다(손실·조정 전기 501) — 차이가 있으면 풀지 말고 조정 기능을 기다린다.
        이미 풀린 대기는 200(그대로). 자기 센터 운영자만.
      operationId: releaseRecountHold
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: holdId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: 풀린 대기
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecountHold' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/count-sessions:
    get:
      tags: [counts]
      summary: '[운영자] 실사 목록 (0.12.0 — DC 백오피스 CS-1)'
      description: |
        이 센터 실사. 만든 시각 최신 순(같으면 sessionId 순). state 로 거른다(생략 = 전부). 줄은 `GET /cdcs/{cdcId}/count-sessions/{sessionId}` 와 같은 모양.
      operationId: listCountSessions
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [COUNTING, RECOUNT_REQUIRED, PENDING_APPROVAL, MATCHED, APPROVED, REJECTED] } }
        - { name: number, in: query, required: false, description: '(0.17.0) 화면 번호로 찾기 — C123456 또는 123456(글자 있든 없든)', schema: { type: string, maxLength: 16 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, hasNext]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CountSession' } }
                  page: { type: integer }
                  size: { type: integer }
                  hasNext: { type: boolean }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [counts]
      summary: '[운영자] 실사 시작 — 칸 잠금·장부 기준 고정 (0.8.0)'
      description: |
        칸 1~200개. 그 칸들의 정상(RELEASED) 현물을 SKU·LOT·칸별 장부 기준으로 고정하고, 끝날 때까지 칸을 **새 할당·추가 할당 후보에서 뺀다**(이미 걸린 예약·이동은 막지 않음 — 결정 때 장부가 바뀌었으면 BOOK_CHANGED).
        출고대기(통로 91) 칸은 실사 대상이 아니다(400 STAGING_NOT_COUNTED — 출발할 물건, 출발 검증이 대조). 품질 보류·격리 현물이 있는 칸은 409 QUALITY_STOCK_PRESENT(품질 처리 먼저).
        같은 칸에 열린 실사가 있으면 409 COUNT_IN_PROGRESS. 응답의 계수표에는 장부 수량이 없다.
      operationId: startCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationCodes]
              properties:
                locationCodes: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
                reason: { type: string, maxLength: 300 }
      responses:
        '201':
          description: 시작(COUNTING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: COUNT_IN_PROGRESS / QUALITY_STOCK_PRESENT / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/count-sessions/{sessionId}:
    get:
      tags: [counts]
      summary: '[운영자] 실사 조회 — 결정 전에는 장부 수량을 보이지 않는다 (0.8.0)'
      operationId: getCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/count-sessions/{sessionId}/counts:
    post:
      tags: [counts]
      summary: '[작업자] 첫 계수 (0.8.0) — 같으면 MATCHED, 다르면 RECOUNT_REQUIRED'
      description: |
        계수자 = 토큰 주체. 줄 = 칸·SKU·LOT·센 수량(계수표에 없는 줄 = 0). 계수표에 없던 LOT 은 이 센터에 이미 있는 LOT 만(처음 보는 LOT 은 400 LOT_UNKNOWN — 입고 기록 없는 재고 증가 금지, CDC-F-029).
        실사 칸 밖 줄은 400. COUNTING 일 때만(아니면 409 INVALID_STATE).
      operationId: submitFirstCount
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CountLines' }
      responses:
        '200':
          description: 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/count-sessions/{sessionId}/recounts:
    post:
      tags: [counts]
      summary: '[작업자] 재계수 (0.8.0) — 첫 계수자와 다른 사람. 최종 = 재계수'
      description: RECOUNT_REQUIRED 일 때만. 같은 사람이면 409 SAME_COUNTER. 장부 기준과 같으면 MATCHED, 다르면 PENDING_APPROVAL.
      operationId: submitRecount
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CountLines' }
      responses:
        '200':
          description: 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: INVALID_STATE / SAME_COUNTER / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/count-sessions/{sessionId}/decisions:
    post:
      tags: [counts]
      summary: '[관리자] 실사 결정 — APPROVE(CNT 조정) / REJECT (0.8.0)'
      description: |
        PENDING_APPROVAL 일 때만. 시작자·계수자와 다른 운영자(422 SELF_APPROVAL — 요청자·승인자 분리, CDC-F-029).
        APPROVE: 기준 뒤 그 칸 장부가 바뀌었으면 409 BOOK_CHANGED(다시 실사) → 승인 관문(아래) → 한 원결과(CNT)로 차이(최종 − 기준)만 현물에 반영 → 잠금·재계수 대기 해소 → InventoryAdjustmentPosted.
        (0.10.0) 감소로 그 칸 현물이 예약보다 적어지면 모자란 만큼 **그 칸에 늦게 잡힌 할당부터** 예약을 풀고(같은 CNT 원결과에 예약 −) 할당마다 AllocationShortfall(COUNT_LOSS)을 낸다. 풀 할당을 못 찾으면 409 COUNT_BELOW_RESERVED(조사).
        승인 관문(`pmart.inventory.approval-ref.mode`): RECORD_ONLY = approvalRef 필수·확인 없음. VERIFY = MFC 와 같은 본사 기준(한 건 손실 ≥ `hq-loss-krw` 또는 한 SKU ≥ `hq-sku-qty`, 단가 = pricing 판매 기준가, 없으면 본사) —
        아래면 센터 관리자 결정만, 이상이면 approvalRef 없을 때 422 APPROVAL_REQUIRED(details approvalRequest = approval-service 변경 요청 본문), 있으면 approval-service 로 한 번 사용·범위 확인. 그 밖·비움 = 422 CONFIG_REQUIRED.
        REJECT: 조정 없음, 잠금 해소(재계수 대기는 남김 — 다시 실사).
      operationId: decideCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string, maxLength: 300 }
                approvalRef: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 결정 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE / BOOK_CHANGED / COUNT_BELOW_RESERVED / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: SELF_APPROVAL / APPROVAL_REQUIRED / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/sku-handlings:
    get:
      tags: [sku-handlings]
      summary: '[운영자] CDC SKU 취급 ON/OFF 목록 (취급 레코드가 없으면 OFF)'
      description: |
        상품 SKU 투영(SkuIssued/ProductVersionPublished)에 있는 SKU 전체를 이 센터의 취급 여부와 함께 돌려준다.
        취급 레코드가 없으면 OFF(handlingEnabled=false, version 0)이다(사용자 결정 2026-10-30: 기본 OFF, 센터 운영자가 켬).
        토큰의 centers 클레임에 cdcId 가 없으면 403.
      operationId: listSkuHandlings
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: enabled, in: query, required: false, description: 'true=ON 만, false=OFF(레코드 없음 포함)만, 생략=전체', schema: { type: boolean } }
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - $ref: '_common.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: OK (SKU 오름차순, 커서 = 마지막 SKU)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingPage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [sku-handlings]
      summary: '[운영자] CDC SKU 취급 ON/OFF 변경 (자기 센터만)'
      description: |
        켜기(enabled=true)는 SKU 투영이 있고 state=ACTIVE 일 때만(INACTIVE → 422 SKU_INACTIVE). 끄기는 항상 허용.
        현재 값과 같으면 변경·이력 없이 현재 상태를 돌려준다(changed=false). 바뀌면 이력을 남기고 version +1.
        X-Expected-Version 은 이 센터·SKU 취급 레코드의 version(레코드가 없으면 0).
      operationId: changeSkuHandling
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuHandlingChange' }
      responses:
        '200':
          description: 반영(같은 키·같은 본문 재요청은 저장된 결과 재생)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: SKU_NOT_FOUND (SKU 투영이 아직 없음 — 상품 승인 이벤트 수신 전)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SKU_INACTIVE (비활성 SKU 는 켤 수 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/sku-handling-batches:
    post:
      tags: [sku-handlings]
      summary: '[운영자] CDC SKU 취급 일괄 변경 (최대 500행, 전부 또는 전무)'
      description: |
        모든 행을 먼저 검증하고 하나라도 실패하면 아무것도 바꾸지 않는다(422 SKU_HANDLING_BATCH_REJECTED, details[].field = items[i]).
        행 규칙은 단건과 같다. 같은 SKU 가 두 번 나오면 400 VALIDATION_FAILED.
      operationId: changeSkuHandlingBatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuHandlingBatchRequest' }
      responses:
        '200':
          description: 전 행 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingBatchResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SKU_HANDLING_BATCH_REJECTED (행별 SKU_NOT_FOUND / SKU_INACTIVE / VERSION_CONFLICT 를 details 에)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/skus/{sku}:
    get:
      tags: [skus]
      summary: '[서비스→cdc-inventory] SKU 투영 조회 (product-service 이벤트 사본)'
      description: 조회 사본이다. 상품 정본은 product-service.
      operationId: getSkuProjection
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuProjection' }
        '404':
          description: SKU_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  schemas:
    CountLines:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [locationCode, sku, lot, qty]
            properties:
              locationCode: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lot: { type: string }
              qty: { type: integer, minimum: 0 }
    CountSession:
      type: object
      description: (0.8.0) 실사. state COUNTING → MATCHED / RECOUNT_REQUIRED → MATCHED / PENDING_APPROVAL → APPROVED / REJECTED.
      properties:
        sessionId: { type: string }
        sessionNumber: { type: string, description: '(0.17.0) 화면 번호 C + 6자리 — 사람이 보는 값(시스템 ID 는 sessionId)' }
        cdcId: { type: string }
        state: { type: string, enum: [COUNTING, RECOUNT_REQUIRED, PENDING_APPROVAL, MATCHED, APPROVED, REJECTED] }
        locationCodes: { type: array, items: { type: string } }
        sheet:
          type: array
          description: 계수표 — 칸·SKU·LOT(장부 수량 없음)
          items:
            type: object
            properties:
              locationCode: { type: string }
              sku: { type: string }
              productName: { type: [string, 'null'], description: '(0.17.0) 상품 관리용 명칭(product internalName — MFC 와 같은 기준), 모르면 null' }
              lot: { type: string }
        lines:
          type: array
          description: 결정 뒤(MATCHED·APPROVED·REJECTED)에만 — 장부·첫 계수·최종·차이
          items:
            type: object
            properties:
              locationCode: { type: string }
              sku: { type: string }
              productName: { type: [string, 'null'], description: '(0.17.0) 상품 관리용 명칭(product internalName — MFC 와 같은 기준), 모르면 null' }
              lot: { type: string }
              bookQty: { type: integer }
              firstQty: { type: integer }
              finalQty: { type: integer }
              deltaQty: { type: integer }
        startedBy: { type: string }
        firstCounterId: { type: [string, 'null'] }
        recounterId: { type: [string, 'null'] }
        decidedBy: { type: [string, 'null'] }
        approvalRef: { type: [string, 'null'] }
        commitId: { type: [string, 'null'], description: CNT 원결과 }
        reason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    RecountHold:
      type: object
      description: (0.7.0) 재계수 대기 — 피킹 부족이 난 SKU·LOT·위치. HELD 동안 새 할당 후보에서 빠진다.
      properties:
        holdId: { type: string }
        sku: { type: string }
        productName: { type: [string, 'null'], description: '(0.17.0) 상품 관리용 명칭(product internalName — MFC 와 같은 기준), 모르면 null' }
        lot: { type: string }
        locationCode: { type: string }
        state: { type: string, enum: [HELD, RELEASED] }
        shortQty: { type: integer, description: 보고된 부족(대기를 만들 때의 해제 수량 합) }
        allocationId: { type: string }
        sourceRef: { type: string }
        createdAt: { type: string, format: date-time }
        releasedAt: { type: [string, 'null'], format: date-time }
        releasedBy: { type: [string, 'null'] }
        releaseReason: { type: [string, 'null'] }
    QualityState:
      type: string
      enum: [RELEASED, HELD, QUARANTINED, DISPOSED]
    LotIdentification:
      type: string
      description: LOT 식별 신뢰도. INVALID는 적격 현물 E에서 제외.
      enum: [UNVERIFIED, VERIFIED, INVALID]
    TransitState:
      type: string
      description: |
        TRANSIT_OPEN: TOUT 전기됨·수령 확인 없음. RECEIPT_POSTED_AWAITING_ACK: MFC TIN 수신 후 미정산 t > 0 (조사 대상).
        TRANSIT_RECONCILED: q = r + l + t 로 종결(t = 0 또는 승인 손실 반영).
      enum: [TRANSIT_OPEN, RECEIPT_POSTED_AWAITING_ACK, TRANSIT_RECONCILED]
    Availability:
      type: object
      description: available = max(0, E − R − S). 0 ≤ R ≤ E ≤ onHand.
      properties:
        cdcId: { type: string }
        sku: { type: string }
        productName: { type: [string, 'null'], description: '(0.17.0) 상품 관리용 명칭(product internalName — MFC 와 같은 기준), 모르면 null' } # stock-snapshot 만(내부 가용 조회는 비움)
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        onHand: { type: integer, minimum: 0, description: 장부 현물 (품질 상태 무관) }
        eligible: { type: integer, minimum: 0, description: E 적격 현물 }
        reserved: { type: integer, minimum: 0, description: R 이관 예약 }
        held: { type: integer, minimum: 0 }
        safety: { $ref: '_common.yaml#/components/schemas/PolicyValue' }
        available: { type: [integer, 'null'], minimum: 0, description: '안전량 미설정(safety NOT_SET)이면 null — 0 으로 대신하지 않는다(스냅샷)' }
        transit: { type: integer, minimum: 0, description: 출발·미대사 Transit 합 }
        handlingActive: { type: boolean, description: 센터 취급 활성 }
        lots:
          type: array
          items:
            type: object
            properties:
              lot: { type: string }
              expiresAt: { type: string, format: date }
              remainingDays: { type: integer }
              identification: { $ref: '#/components/schemas/LotIdentification' }
              eligible: { type: integer }
              reserved: { type: integer }
              held: { type: integer }
              locations:
                type: array
                description: 위치·품질 상태별 현물·예약(0.4.0 — 스냅샷만, 가용 조회는 비움)
                items:
                  type: object
                  properties:
                    locationCode: { type: string }
                    qualityState: { $ref: '#/components/schemas/QualityState' }
                    onHand: { type: integer }
                    reserved: { type: integer }
    Allocation:
      type: object
      properties:
        allocationId: { type: string }
        trfId: { type: string }
        trfVersion: { type: integer }
        state: { type: string, enum: [ALLOCATED, PARTIAL, RELEASED, DEPARTED, FAILED] }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        commitId: { type: string }
        allocatedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              requestedQty: { type: integer }
              allocatedQty: { type: integer, description: 할당 48 }
              shortQty: { type: integer, description: 부족 12 }
              releasedQty: { type: integer }
              departedQty: { type: integer }
              lots:
                type: array
                description: FEFO 순
                items:
                  type: object
                  properties:
                    lot: { type: string }
                    locationCode: { type: string }
                    qty: { type: integer }
                    expiresAt: { type: string, format: date }
    Transit:
      type: object
      description: 출발 q = MFC 확정수령 r + 승인 운송손실 l + 미정산 t
      properties:
        trfId: { type: string }
        departureId: { type: string }
        mfcId: { type: string }
        state: { $ref: '#/components/schemas/TransitState' }
        departedAt: { type: string, format: date-time }
        reconciledAt: { type: [string, 'null'], format: date-time }
        receiptIds: { type: array, items: { type: string } }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              lot: { type: string }
              q: { type: integer, description: 출발 수량 }
              r: { type: integer, description: 받은 수량 (정상 + 격리 + 미판정 — 0.16.1 부터 미판정 포함) }
              normalQty: { type: integer }
              quarantinedQty: { type: integer }
              pendingQty: { type: integer, description: (0.16.1) 품질 미판정으로 받은 수량 }
              l: { type: integer, description: 승인 손실 }
              t: { type: integer, description: 미정산 }
    Commit:
      type: object
      properties:
        commitId: { type: string }
        requestId: { type: string }
        postingKind: { type: string, enum: [ALLOCATION, RELEASE, TOUT, RECEIPT_ACK, MOVE, QUALITY, LOSS, ADJ, CNT, INITIAL_BALANCE] }
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        sourceSystem: { type: string }
        sourceRef: { type: string }
        appliedAt: { type: string, format: date-time }
        deltas:
          type: array
          description: 한 거래로 반영된 수량 변화
          items:
            type: object
            properties:
              sku: { type: string }
              lot: { type: string }
              locationCode: { type: string }
              bucket: { type: string, enum: [ON_HAND, RESERVED, HELD, TRANSIT] }
              delta: { type: integer }
        rejectReason: { type: string }
    DailyReconciliationLine:
      type: object
      properties:
        sku: { type: string }
        opening: { type: integer }
        initialBalance: { type: integer, description: (0.16.0) 초기 개시(INITIAL_BALANCE) — 개시 시점에만 }
        adjustmentIn: { type: integer }
        departed: { type: integer }
        disposed: { type: integer }
        adjustmentOut: { type: integer }
        movedNet: { type: integer, description: (0.16.0) 이동·품질 전환 순증감 — 센터 합계라 0 이어야 함 }
        closing: { type: integer }
        computedClosing: { type: integer }
        discrepancy: { type: integer, description: closing − computedClosing (0이어야 함) }
    SkuHandling:
      type: object
      required: [sku, handlingEnabled, version]
      properties:
        sku: { type: string }
        productName: { type: [string, 'null'], description: '(0.17.0) 상품 관리용 명칭(product internalName — MFC 와 같은 기준), 모르면 null' }
        handlingEnabled: { type: boolean, description: 레코드가 없으면 false }
        version: { type: integer, description: 취급 레코드 version (레코드 없음 = 0) }
        skuState: { type: string, enum: [ACTIVE, INACTIVE] }
        productId: { type: [string, 'null'] }
        changedBy: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
    SkuHandlingPage:
      type: object
      properties:
        centerId: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/SkuHandling' } }
        page: { $ref: '_common.yaml#/components/schemas/Page' }
    SkuHandlingChange:
      type: object
      required: [sku, enabled]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        enabled: { type: boolean }
        reason: { type: string, maxLength: 500 }
    SkuHandlingResult:
      type: object
      required: [status, requestId, occurredAt, handling]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        changed: { type: boolean, description: false 면 이미 같은 값이라 바뀐 것이 없음 }
        occurredAt: { type: string, format: date-time }
        handling: { $ref: '#/components/schemas/SkuHandling' }
    SkuHandlingBatchRequest:
      type: object
      required: [items]
      properties:
        reason: { type: string, maxLength: 500, description: 행에 reason 이 없을 때 쓰는 공통 사유 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/SkuHandlingBatchItem' }
    SkuHandlingBatchItem:
      type: object
      required: [sku, enabled]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        enabled: { type: boolean }
        reason: { type: string, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 0, description: 행별 낙관적 잠금(선택) }
    SkuHandlingBatchResult:
      type: object
      required: [status, requestId, occurredAt, items]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        changedCount: { type: integer }
        occurredAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/SkuHandling' } }
    SkuProjection:
      type: object
      required: [sku, state, productVersion]
      properties:
        sku: { type: string }
        productId: { type: [string, 'null'] }
        baseProductId: { type: [string, 'null'] }
        unitType: { type: [string, 'null'] }
        unitsPerSku: { type: [integer, 'null'] }
        weightG: { type: [integer, 'null'] }
        volumeMl: { type: [integer, 'null'] }
        storageType: { type: [string, 'null'], description: AMBIENT / CHILLED / FROZEN }
        alcohol: { type: [boolean, 'null'] }
        state: { type: string, enum: [ACTIVE, INACTIVE] }
        productVersion: { type: integer, description: 마지막으로 반영한 상품 버전(이보다 오래된 이벤트는 무시) }
        logistics:
          type: [object, 'null']
          description: 승인된 물류 규격(CDC-F-002). 미등록 항목은 null
          properties:
            unitsPerBox: { type: [integer, 'null'] }
            boxesPerPallet: { type: [integer, 'null'] }
            ti: { type: [integer, 'null'] }
            hi: { type: [integer, 'null'] }
        updatedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
