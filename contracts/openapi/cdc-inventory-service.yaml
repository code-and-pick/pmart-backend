openapi: 3.1.0
info:
  title: cdc-inventory-service
  version: 0.19.0
  description: |
    0.19.0(2026-11-26, 운영 제한 지키기 — WMS CDC-F-031, 사용자 "새 할당과 출발"): 새 할당(`/internal/allocations`)·추가 할당(`…/additions`) 앞에 cdc-quality 운영 제한 확인
      (활동 ALLOCATION, SKU·온도대) — 막히면 409 OPERATION_RESTRICTED, 확인이 안 되면 보류(503 DEPENDENCY_UNAVAILABLE·주소 없음 CONFIG_REQUIRED). 같은 TRF·버전 재생은 다시 묻지 않음.
    0.18.0(2026-11-26, 리콜 — WMS CDC-F-028·정책 16.13, 사용자 "리콜은 출고대기분도 막음"·"본사 승인 번호 + 모든 CDC"): quality-postings HOLD 에 `recall: true` —
      출고대기 91 까지 보류(걸린 예약은 늦은 할당부터 풀고 AllocationShortfall reason RECALL — 그 TRF 출발 전기는 보류 현물이라 거절된다). LOT 추적 `GET /internal/lot-traces`
      (모든 CDC 의 현물·출발 — cdc-quality 리콜이 센터를 찾고 출발분을 보인다).
    0.17.0(2026-11-26, CI-1 — PC5 DC 백오피스 P-1·화면 번호): 운영자 응답에 productName(product internalName, 10분 캐시 — product 가 안 되면 null)
      — stock-snapshot·location-stocks items·SkuHandling·CountSession sheet/lines·RecountHold. 실사 화면 번호 sessionNumber(C + 6자리, 무작위·겹치지 않음·바뀌지 않음 — ADR-0070 덧붙임)와 목록 찾기 number.
    0.16.1(2026-11-26, 고침): `GET /internal/transits` 줄의 r 에 미판정(pendingQty, 0.11.0)도 넣고 t = q − r − l 로 — 전에는 미판정을 빼지 않아 t 가 크게 보였다. 줄에 pendingQty 추가.
    0.16.0(2026-11-26, 일일 대사 — WMS CDC-F-034, 사용자 결정 "조회할 때 계산"·대조 "예약·운송 중"): `GET /internal/daily-reconciliations`(501 해제) — 그날(서울)
      SKU 별 수불을 원장에서 계산(저장·배치·경보 없음, 원장을 고치지 않음)하고 지금 시점의 예약 대조·운송 중 대조를 함께 준다.
    0.15.0(2026-11-26, 품질 보류·해제·폐기 반영 — WMS CDC-F-028, 사용자 결정 "재고 쪽 먼저"·"나중 예약부터 풀고 출고에 알림"·"출고대기분은 MFC 처럼 건드리지 않음"):
      `POST /internal/quality-postings`(501 해제 — 판정·승인 흐름의 cdc-quality 는 다음). HOLD 는 상태 전환(현물 차감 아님), 걸린 예약은 그 칸에 늦게 잡힌 할당부터 풀고
      `AllocationShortfall`(QUALITY_HOLD) → cdc-outbound. RELEASE·DISPOSE 는 approvalRef 필수, DISPOSE 는 실제 실행 수량·증빙(evidenceRef)만 HELD −q.
    0.14.0(2026-11-26, 운송 손실 승인 — WMS CDC-F-027, 사용자 결정 "실사 조정과 같은 본사 기준"·"MFC 입고 종결 확인을 받은 뒤에만"): MFC 입고 종결 기록
      `POST /internal/transit-closures`(mfc-inbound 또는 복구 — 요청 MI-5) · 운영자 운송 손실 `POST /cdcs/{cdcId}/transit-losses` — 종결 전이면 409 MFC_RECEIPT_OPEN,
      미정산 초과 409 LOSS_EXCEEDS_UNRECONCILED, 승인 관문(실사와 같음) 뒤 Transit −l(loss_qty) → TransitReconciled. 자동 손실 없음.
    0.13.0(2026-11-26, 수령 정정 — WMS CDC-F-024 "확정 수령의 후속 정정"): `ReceiptCorrectionPosted`(줄별 증감) 구독과 receipt-acks 의 correctionId(줄 = 정정 뒤 누계).
      correctionId 한 번, δr 만큼 Transit −δr(음수면 미정산을 다시 엶 — 실제 반송 아님), 누계가 0 아래·출발 남은 수량 초과 줄은 그 줄만 보류. 원 수령이 대사 전이면 404 RECEIPT_NOT_APPLIED.
    0.12.0(2026-11-26, DC 백오피스 CS-1 — PC 5 요청 pmart-clients docs/handoff/cdc-backoffice/2026-11-26-backend-count-session-list.md, 사용자 "응 진행해"): `GET /cdcs/{cdcId}/count-sessions?state=&page=&size=`
      — 이 센터 실사 목록(줄 = CountSession — 결정 전 lines 없음), 만든 시각 최신 순, 쪽 나눔 page 0부터·size ≤ 200·hasNext. 자기 센터 운영자만. 읽기만.
    0.11.0(2026-11-25, MFC 수령·운송 중 재고 대사 — WMS CDC-F-024·025, 설계 docs/cdc/design/2026-11-25-receipt-transit.md, 사용자 결정): `MfcReceiptPosted` 구독(mfc.inventory.v1)과
      복구용 `POST /internal/receipt-acks`(501 해제) — 같은 receiptId 한 번, 줄별(SKU·LOT)로 출발 줄에 정상·격리·미판정을 더하고 Transit −r, 출발 줄 초과·없는 LOT 은 그 줄만 보류(CONFLICT),
      t = 0 이면 TRANSIT_RECONCILED, 남으면 RECEIPT_POSTED_AWAITING_ACK(자동 손실 없음) → TransitReconciled. TOUT 보다 먼저 온 사건은 기다렸다가 TOUT 때 처리. (0.10.0 은 실사 부족 #500.)
    0.10.0(2026-11-25, 실사 부족 — 설계 §4·사용자 결정 "조정은 하고 나중 예약부터 부족 표시"): 실사 APPROVE 로 칸 현물이 예약보다 적어지면 409 대신 모자란 만큼
      그 칸에 늦게 잡힌 할당부터 예약을 풀고(같은 CNT 원결과) 할당마다 AllocationShortfall(reason COUNT_LOSS) — cdc-outbound 가 받아 다시 잡거나 못 찾음으로 처리.
    0.9.0(2026-11-25, DC 백오피스 M-6 칸별 재고 — PC 5 요청, 사용자 "응"): 직원 조회 `GET /cdcs/{cdcId}/location-stocks?locationPrefix=&sku=` — 재고 스냅샷을
      칸 기준으로 펼친 줄(칸·SKU·LOT·품질 상태·현물·예약·소비기한), 칸 코드 순. 자기 센터 운영자만. 읽기만(cdc-location occupiedQty 는 그대로 비움 — 칸 재고는 이 조회로).
    0.8.0(2026-11-25, 재계수·실사 조정 — WMS CDC-F-029·030, 설계 docs/cdc/design/2026-11-25-count-adjustment.md, 사용자 "MFC 실사와 같게"): 실사 세션
      `/cdcs/{cdcId}/count-sessions` — 시작(칸 잠금: 새 할당 후보에서 뺌)·장부 숨긴 첫 계수·다른 작업자 재계수·시작/계수자 아닌 운영자 결정 → CNT 조정·재계수 대기 해소·InventoryAdjustmentPosted.
      승인 관문 `pmart.inventory.approval-ref.mode`(VERIFY — MFC 와 같은 본사 기준, RECORD_ONLY — 번호 기록만). 실물이 예약보다 적어지는 조정은 아직 409 COUNT_BELOW_RESERVED(설계 §4 는 다음 PR).
    0.7.1(2026-11-25): 이동 종류 PICK_MOVE — 피킹한 재고를 예약과 함께 출고대기 자리(91)로 옮겨 적기(cdc-outbound, 설계 docs/cdc/design/2026-11-25-count-adjustment.md §5 — 사용자 결정). 경로·모양 변화 없음(enum 값 추가).
    0.7.0(2026-11-25, 피킹 부족 재할당 — WMS CDC-F-018, 사용자 결정): 해제 줄에 locationCode·`recountHold`(부족 칸의 그 LOT 을 재계수 대기로 — 새 할당에서 뺌, 현물은 그대로),
      추가 할당 `POST /internal/allocations/{allocationId}/additions`(같은 TRF 할당에 모자란 만큼 FEFO 로 더 잡기 — 재계수 대기 칸 제외),
      운영자 재계수 대기 목록·풀기 `GET /cdcs/{cdcId}/recount-holds`·`POST /cdcs/{cdcId}/recount-holds/{holdId}/releases`. 재계수 결과 반영(조정)은 아직.
    0.6.0(2026-11-25, DC 백오피스 1단계 재고 현황 — 사용자 "Dc 백오피스 만들어줘"): 직원 조회 `GET /cdcs/{cdcId}/stock-snapshot` — 내부 `/internal/snapshots` 와 같은
      내용(SKU별 현물·가용·예약, withPlaces=true 면 LOT·위치별)을 자기 센터 운영자(토큰 centers)에게. 읽기만.
    CDC 재고 단일 쓰기 주체. 위치·LOT·품질상태별 On-hand, 이관 예약 R(0 ≤ R ≤ E ≤ 장부), Held, 안전량 S, 가용 max(0, E−R−S),
    LOT 식별/소비기한/FEFO, 초기 보유 INITIAL_BALANCE, 승인 TRF 다LOT FEFO 할당, TOUT 1회 전기, Transit 소유·대사(q = r + l + t),
    승인 손실/폐기/ADJ 집행, 일일 수불 대사의 정본. (docs/architecture/service-map.md §4, docs/adr/0002)
    LOC 마스터·공간(cdc-location), 작업(cdc-inbound/outbound), 품질 판단(cdc-quality), MFC 재고(mfc-inventory), 승인(replenishment/approval)은 비정본.
    모든 변경 요청은 commitId를 발급하며 호출자는 자체 사본으로 성공을 판단하지 않는다. 모든 경로는 서비스 간(internal)이다.
    0.2.0(2026-11-25): 초기 보유·안전량·가용·할당/해제·TOUT·원결과·Transit 조회 구현. 안전량 설정 경로·출발 목적지 toMfcId 추가.
    잔여일수 판정은 소비기한 당일부터 차단(D ≥ 1)과 호출자가 준 minRemainingDays 만 — 총기간 T(제조일) 입력이 아직 없어 품목군 정책값은 계산하지 않는다.
    0.5.0(2026-11-25): 할당 FEFO 동률(같은 LOT·같은 기한) 안에서 피킹 선반(PICK_FACE) 먼저 — cdc-location 위치 일괄 조회. 조회가 안 되면 위치 코드 순(할당은 막지 않음).
    0.4.0(2026-11-25): 재고 스냅샷 조회(snapshots) 구현 — LOT 마다 위치별 현물·예약(locations[]), 안전량 미설정이면 available null(0 이 아님).
    0.3.0(2026-11-25): 내부 이동 전기(move-postings) 구현 — 줄에 allocationId 를 주면 그 할당의 예약을 함께 옮긴다(팔레트 랙 → 피킹 선반 보충, 칠곡 CDC-7).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: availability, description: 공급가능량·예약·Transit·스냅샷 조회 }
  - { name: allocations, description: 승인 TRF 할당/해제 (cdc-outbound) }
  - { name: postings, description: 수량 전기 명령 (TOUT·TIN 확인·MOV·품질·손실·조정·초기 보유) }
  - { name: commits, description: 원결과 조회 }
  - { name: reconciliation, description: Transit 대사·일일 수불 대사 }
  - { name: sku-handlings, description: 센터 SKU 취급 ON·OFF (운영자 — 자기 센터) }
  - { name: skus, description: 상품 SKU 투영 조회 }
  - { name: counts, description: '위치 실사·재계수·CNT 조정 (운영자 — 자기 센터 0.8.0)' }

paths:
  /internal/availability:
    get:
      tags: [availability]
      summary: '[replenishment/outbound→cdc-inventory] 공급가능량 조회 (available = max(0, E−R−S))'
      description: 조회 사본이며 할당 성공을 보장하지 않는다. E는 적격 현물(품질 RELEASED·LOT VERIFIED·FEFO 최소 잔여일수 충족).
      operationId: getAvailability
      parameters:
        - { name: cdcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '404':
          description: SKU_NOT_FOUND (SKU 투영 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONFIG_REQUIRED (안전량 S 미설정 → 가용량 계산 보류) / SKU_NOT_HANDLED (센터 취급 OFF)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/allocations:
    post:
      tags: [allocations]
      summary: '[cdc-outbound→cdc-inventory] 승인 TRF 할당 (FEFO 다LOT, 예약 R +allocated) → AllocationResult'
      description: |
        trfId·trfVersion당 1회. 부분 할당 허용(allocated 48 / short 12). 승인량을 넘는 할당 요청은 거절(승인 정본 replenishment 가 아직 없어 지금은 검사하지 않음).
        SKU별 한도 = max(0, E'−R'−S) — E'·R' 은 잔여일수 조건을 통과한 적격 현물과 거기 걸린 예약. 한도 안에서 FEFO(소비기한 → 최초 인수시각 → LOT → **피킹 선반 먼저**(0.5.0) → 위치) 순으로 여러 LOT 를 잡는다.
        피킹 선반 여부는 cdc-location `POST /internal/location-lookups`(locationType PICK_FACE)로 읽는다 — 응답이 없으면 위치 코드 순으로 잡는다(동선 선호일 뿐 FEFO·한도는 그대로).
        하나도 못 잡으면 state FAILED(200). 같은 TRF 의 다른 버전 할당이 살아 있으면 409 ALLOCATION_EXISTS(먼저 해제).
        resultId = allocationId. 같은 키·다른 본문은 409 IDEMPOTENCY_CONFLICT. 결과는 AllocationResult(토픽 cdc.inventory.v1)로도 발행한다.
      operationId: createAllocation
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, trfId, trfVersion, lines]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                trfId: { type: string }
                trfVersion: { type: integer }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, requestedQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      requestedQty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      minRemainingDays: { type: integer, description: FEFO 최소 잔여일수 (미지정 시 정책값) }
      responses:
        '200':
          description: 할당 결과
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '_common.yaml#/components/schemas/CommandResponse' }
                  - { $ref: '#/components/schemas/Allocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INVALID_STATE (이미 출발 전기된 TRF) / ALLOCATION_EXISTS
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONFIG_REQUIRED (안전량 미설정) / SKU_NOT_HANDLED (센터 취급 OFF — details 에 lines[i])
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/allocations/{allocationId}:
    get:
      tags: [allocations]
      summary: 할당 조회 (LOT별 할당 수량·해제 이력)
      operationId: getAllocation
      parameters:
        - { name: allocationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Allocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/allocations/{allocationId}/releases:
    post:
      tags: [allocations]
      summary: '[cdc-outbound→cdc-inventory] 할당 해제 (전부/일부, 예약 R −q). 출발 전기된 수량은 해제 불가'
      description: |
        lines 를 비우면 남은 할당(할당 − 해제 − 출발) 전량. lot 을 비우면 소비기한이 늦은 LOT 부터 푼다(빠른 LOT 를 남김).
        남은 할당이 0 이 되면 state RELEASED(출발분이 있으면 DEPARTED). X-Expected-Version 은 할당 version.
      operationId: releaseAllocation
      parameters:
        - { name: allocationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [TRANSFER_CANCELLED, TRANSFER_CHANGED, PICK_SHORTAGE, PRE_DEPARTURE_CANCEL, RESIDUAL_CLOSED, QUALITY_BLOCKED] }
                sourceRef: { type: string, description: 취소/변경 요청 ID }
                recountHold:
                  type: boolean
                  description: |
                    (0.7.0) true 면 줄마다 그 SKU·LOT·위치를 **재계수 대기**로 둔다 — 풀 때까지 새 할당·추가 할당 후보에서 빠진다(현물·다른 예약은 그대로, 손실 차감 없음 — WMS CDC-F-018).
                    reason PICK_SHORTAGE 에서만, 줄마다 lot·locationCode 가 있어야 한다(아니면 400). 이미 대기 중이면 그대로 둔다.
                lines:
                  type: array
                  description: 비우면 전량 해제
                  items:
                    type: object
                    required: [sku, qty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      locationCode: { type: string, description: '(0.7.0) 주면 그 위치에 남은 할당만 푼다' }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (출발 전기 완료분) / VERSION_CONFLICT / RELEASE_EXCEEDS_ALLOCATED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/allocations/{allocationId}/additions:
    post:
      tags: [allocations]
      summary: '[cdc-outbound→cdc-inventory] 추가 할당 — 피킹 부족분을 다른 적격 LOT 로 다시 잡기 (0.7.0, WMS CDC-F-018)'
      description: |
        같은 할당(같은 TRF·버전)에 줄마다 qty 만큼 더 잡는다. 규칙은 처음 할당과 같다(한도 max(0, E'−R'−S), FEFO, 같은 LOT 이면 피킹 선반 먼저) — **재계수 대기 칸은 뺀다**.
        못 잡은 만큼은 addedQty 가 작다(부분 허용, 0 도 200). 호출자(cdc-outbound)는 부족으로 푼 수량 이하만 요청한다 — 승인 정본(replenishment)이 아직 없어 승인량 초과는 검사하지 않는다.
        할당 상태가 DEPARTED 면 409 INVALID_STATE. 같은 키·같은 본문은 저장 결과, 다른 본문은 409 IDEMPOTENCY_CONFLICT.
      operationId: addToAllocation
      parameters:
        - { name: allocationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, lines]
              properties:
                reason: { type: string, enum: [PICK_SHORTAGE_REALLOCATION] }
                sourceRef: { type: string, description: 부족 보고·작업 ID }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, qty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      minRemainingDays: { type: integer }
      responses:
        '200':
          description: 추가 결과(addedQty = 이번에 잡은 합)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [APPLIED] }
                  requestId: { type: string }
                  resultId: { type: string, description: commitId }
                  addedQty: { type: integer }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { type: string }
                        requestedQty: { type: integer }
                        addedQty: { type: integer }
                        lots:
                          type: array
                          items:
                            type: object
                            properties:
                              lot: { type: string }
                              locationCode: { type: string }
                              qty: { type: integer }
                              expiresAt: { type: string, format: date }
                  occurredAt: { type: string, format: date-time }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INVALID_STATE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONFIG_REQUIRED (안전량 미설정) / SKU_NOT_HANDLED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/departure-postings:
    post:
      tags: [postings]
      summary: '[cdc-outbound→cdc-inventory] TOUT 전기 (TruckDepartureValidated 후) → TransferDeparted'
      description: |
        현물 −q · 예약 −q · Transit +q 를 한 거래로 반영한다. departureLineId당 정확히 1회(재전송은 기존 commitId 반환).
        한 차량에 TRF A/B 합차 시 TRF별로 각각 호출한다. A 성공·B 불명이면 B만 GET /internal/commits/{commitId}로 해소하고 A를 재차감하지 않는다.
        할당 R보다 큰 q는 거절(DEPARTURE_EXCEEDS_ALLOCATED). resultId = commitId.
        같은 TRF 가 같은 departureId·같은 departureLineId 묶음으로 다시 오면(키가 달라도) 기존 commitId 를 돌려준다. 다른 departureId 면 409 INVALID_STATE.
        출발 뒤 남은 할당은 예약으로 남는다 — 호출자가 RESIDUAL_CLOSED 로 해제한다. 결과는 TransferDeparted(토픽 cdc.inventory.v1)로 발행한다.
      operationId: postDeparture
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, departureId, trfId, trfVersion, allocationId, departedAt, lines]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                departureId: { type: string, description: transport-execution TruckActuallyDeparted }
                departureSource: { type: string, enum: [REAL, SIMULATED] }
                toMfcId:
                  type: string
                  description: 목적 MFC(0.2.0). TransferDeparted.toMfc·Transit.mfcId 로 간다 — 승인 TRF(replenishment)가 아직 없어 mfc-inbound 가 입고 예정을 만들 때 쓴다
                trfId: { type: string }
                trfVersion: { type: integer }
                allocationId: { type: string }
                shipmentManifestId: { type: string }
                departedAt: { type: string, format: date-time }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [departureLineId, sku, lot, qty]
                    properties:
                      departureLineId: { type: string, description: 전기 멱등 단위 }
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      locationCode: { type: string }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      lpns: { type: array, items: { type: string } }
      responses:
        '200':
          description: 전기 결과 (APPLIED 또는 기존 commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INVALID_STATE (같은 TRF 2회 출발·할당과 TRF 불일치) / DEPARTURE_EXCEEDS_ALLOCATED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/receipt-acks:
    post:
      tags: [postings]
      summary: '[MfcReceiptPosted 소비→cdc-inventory] MFC 수령 확인 (receiptId 1회 → Transit −r) → TransitReconciled / TransferAckStatus'
      description: |
        r = 정상 n + 격리 h + 미판정 p(사용자 2026-11-25 — 미판정도 받은 수량). 같은 receiptId 재수신은 기존 commitId 반환(재차감 없음), 다른 본문은 409 RECEIPT_CONFLICT.
        (0.11.0) 구현: 사건 `MfcReceiptPosted` 구독이 정 경로, 이 API 는 사건 유실 복구용(같은 규칙). 줄별로 SKU·LOT 이 같은 출발 줄(앞 줄부터 남은 수량만큼)에 더하고,
        남은 수량을 넘거나 없는 SKU·LOT 줄은 그 줄만 CONFLICT(차감 0, 응답 conflicts).
        (0.13.0) correctionId 를 주면 정정 — 줄은 그 수령의 SKU·LOT 별 **정정 뒤 누계**(LOT 필수, 줄에 없는 SKU·LOT 은 그대로). δr = 정정 누계 − 기확인 누계만 한 번 반영(Transit −δr).
        품질만 바뀐 것은 δr = 0 이라 보내지 않는다. 같은 correctionId 다른 본문 409 RECEIPT_CONFLICT, 원 수령이 대사 전이면 404 RECEIPT_NOT_APPLIED. 사건 경로는 ReceiptCorrectionPosted(줄별 증감).
        대사 후 미정산 t = q − r − l 이 0보다 크면 state RECEIPT_POSTED_AWAITING_ACK → 조사 대상. 자동 손실 전기 금지.
        정정 δr은 ReceiptCorrectionPosted의 correctionId로 별도 1회.
      operationId: acknowledgeReceipt
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiptId, trfId, departureId, mfcId, mfcCommitId, lines]
              properties:
                receiptId: { type: string }
                correctionId: { type: string, description: 정정(δr)일 때만 }
                trfId: { type: string }
                departureId: { type: string }
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                mfcCommitId: { type: string, description: mfc-inventory TIN commitId }
                receivedAt: { type: string, format: date-time }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, normalQty, quarantinedQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      normalQty: { type: integer, minimum: 0 }
                      quarantinedQty: { type: integer, minimum: 0 }
                      pendingQty: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 대사 결과 (APPLIED 또는 기존 commitId)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '_common.yaml#/components/schemas/CommandResponse' }
                  - type: object
                    properties:
                      transitState: { $ref: '#/components/schemas/TransitState' }
                      unreconciledQty: { type: integer, minimum: 0, description: t }
                      conflicts:
                        type: array
                        description: (0.11.0) 보류한 줄(차감 0) — 조사 대상
                        items:
                          type: object
                          properties:
                            sku: { type: string }
                            lot: { type: string }
                            qty: { type: integer }
                            reason: { type: string }
        '404':
          description: NOT_FOUND / DEPARTURE_NOT_POSTED (해당 departureId의 TOUT 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: IDEMPOTENCY_CONFLICT / RECEIPT_EXCEEDS_TRANSIT (r > 잔여 Transit)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/move-postings:
    post:
      tags: [postings]
      summary: '[cdc-inbound→cdc-inventory] 내부 이동 반영 (MOV·적치 — 위치 간 On-hand 이동, 수량 합 불변)'
      description: |
        S7 사가 2단계. location 공간 선점(spaceReservationId) 후 호출. 실패 시 inbound가 이번 선점분만 해제한다.
        (0.3.0) 같은 SKU·LOT·품질 상태로 fromLocationCode → toLocationCode 로 현물을 옮긴다. 센터 총량·LOT 의 최초 인수시각(FEFO 순서)은 바뀌지 않는다.
        - allocationId 가 없으면 원위치의 **예약 안 된** 현물만 옮긴다(부족하면 409 INSUFFICIENT_STOCK).
        - allocationId 를 주면 그 할당이 원위치에 잡아 둔 예약을 현물과 함께 옮긴다(예약 R 합은 그대로 — 내부 이동 점유를 새 수요로 두 번 빼지 않는다, CDC-F-008).
          그 할당의 원위치 남은 예약보다 많으면 409 INSUFFICIENT_STOCK. 할당이 ALLOCATED·PARTIAL 이 아니면 409 INVALID_STATE, 없으면 404.
        - qualityState 를 비우면 RELEASED. HELD·QUARANTINED 현물도 옮길 수 있으나 allocationId 와 함께 쓸 수 없다(예약은 정상 현물에만).
        - 같은 위치로의 이동·같은 줄 키 중복은 400. 위치 상태(BLOCKED 등)는 cdc-location 공간 선점이 판단한다 — 여기서는 보지 않는다.
        resultId = commitId(postingKind MOVE, 원위치 ON_HAND −q·도착 +q, 예약을 옮기면 RESERVED −q·+q).
      operationId: postMove
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, moveKind, sourceRef, lines]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                moveKind: { type: string, enum: [PUTAWAY, REPLENISHMENT_MOVE, RELOCATION, PICK_MOVE], description: '(0.7.1) PICK_MOVE = 피킹 재고를 출고대기 자리로(allocationId 와 함께 — 예약도 옮김, 총현물 그대로)' }
                sourceRef: { type: string, description: putawayTaskId / moveId }
                spaceReservationId: { type: string }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, lot, fromLocationCode, toLocationCode, qty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      fromLocationCode: { type: string }
                      toLocationCode: { type: string }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      qualityState: { $ref: '#/components/schemas/QualityState' }
                      allocationId: { type: string, description: '0.3.0 — 이 할당의 예약을 함께 옮긴다(보충 MOV)' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INSUFFICIENT_STOCK (원위치 수량 부족) / INVALID_STATE (할당 상태) / LOCATION_BLOCKED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/quality-postings:
    post:
      tags: [postings]
      summary: '[cdc-quality→cdc-inventory] 품질 상태 전환 (HOLD / RELEASE / DISPOSE) → LotBlocked / LotReleased / InventoryAdjustmentPosted'
      description: |
        HOLD: E → Held (유효 예약 R에 걸린 수량은 QUALITY_BLOCKED로 outbound에 통지). RELEASE: Held → E. DISPOSE: Held −q (장부 차감, approvalRef 필수).
        판단은 quality가 하고 수량 변경은 여기서만 한다.
        (0.15.0 구현, WMS CDC-F-028) 줄마다 sku·lot, locationCode 를 비우면 그 LOT 의 모든 칸(**출고대기 통로 91 제외** — 이미 피킹한 것은 MFC 처럼 건드리지 않음, 91 을 직접 주면 400 STAGING_NOT_HELD), qty 는 locationCode 와 함께만(비우면 그 범위 전량).
        (0.18.0) `recall: true`(HOLD 만 — 아니면 400): 출고대기 91 도 포함(칸을 비우면 91 까지, 91 을 직접 줄 수도 있음). 걸린 예약을 풀 때 AllocationShortfall reason RECALL.
        - HOLD: 정상(RELEASED) → 보류(HELD), 총현물 그대로. 남는 정상 현물이 예약보다 적어지면 모자란 만큼 그 칸에 **늦게 잡힌 할당부터** 예약을 풀고 할당마다 `AllocationShortfall`(reason QUALITY_HOLD)
          — cdc-outbound 가 그 TRF 작업 줄 부족·재할당으로 처리(다른 LOT 을 여기서 자동으로 잡지 않음). LOT 마다 `LotBlocked`. 보류할 정상 현물이 없으면 appliedQty 0(원결과 없음).
        - RELEASE: 보류 → 정상. approvalRef(품질 해제 승인) 필수 — 없으면 422 APPROVAL_REQUIRED(설비 복구·시간 경과·일반 운영자 확인으로 해제하지 않음). 적격(기한·LOT 식별)은 할당 때 그대로 다시 본다. LOT 마다 `LotReleased`.
        - DISPOSE: 보류 −q(실제 폐기 실행 수량만 — 승인량이 더 커도 남는 것은 보류 현물). approvalRef·evidenceRef 필수(422 APPROVAL_REQUIRED·EVIDENCE_REQUIRED), 줄마다 locationCode·qty 필수. `InventoryAdjustmentPosted`(reason DISPOSAL).
        - 범위 안 해당 현물이 qty 보다 적으면 422 INSUFFICIENT_STOCK. 같은 Idempotency-Key·같은 본문은 같은 결과(다른 본문 409). 원결과 QUALITY_HOLD / QUALITY_RELEASE / DISPOSAL.
      operationId: postQualityChange
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, action, sourceRef, lines]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                action: { type: string, enum: [HOLD, RELEASE, DISPOSE] }
                sourceRef: { type: string, description: holdId / recallId / disposalApprovalId }
                approvalRef: { type: string, description: RELEASE·DISPOSE 필수 (0.15.0 — 해제도 품질 승인) }
                recall: { type: boolean, default: false, description: '(0.18.0) 리콜 보류 — 출고대기 91 까지(HOLD 만)' }
                evidenceRef: { type: string, maxLength: 128, description: (0.15.0) DISPOSE 필수 — 실제 폐기 실행 증빙 }
                reason: { type: string }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, lot]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      locationCode: { type: string, description: 비우면 LOT 전체 }
                      qty: { type: integer, minimum: 1, description: 비우면 해당 범위 전량 }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED (RELEASE·DISPOSE 에 approvalRef 없음) / EVIDENCE_REQUIRED / INSUFFICIENT_STOCK
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/loss-postings:
    post:
      tags: [postings]
      summary: '[replenishment/backoffice→cdc-inventory] 승인 운송 손실 l 반영 (Transit −l) → q = r + l + t 종결'
      description: |
        자동 손실 전기 금지. 본사 손실 승인(approvalRef)이 있어야 한다. 손실은 MFC 재고가 아니며 CDC로 복원하지 않는다.
        (0.14.0) 아직 501 — 운영자 경로 `POST /cdcs/{cdcId}/transit-losses` 를 쓴다(승인 관문·MFC 입고 종결 확인).
      operationId: postTransportLoss
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trfId, departureId, approvalRef, lines]
              properties:
                trfId: { type: string }
                departureId: { type: string }
                approvalRef: { type: string }
                incidentRef: { type: string, description: TransportIncidentRaised }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, lot, lossQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      lossQty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      lossReason: { type: string, enum: [DAMAGE, MISSING, TEMPERATURE, OTHER] }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: IDEMPOTENCY_CONFLICT / LOSS_EXCEEDS_UNRECONCILED (l > t)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/transit-closures:
    post:
      tags: [postings]
      summary: '[mfc-inbound→cdc-inventory] MFC 이관 입고 종결 기록 — 더 받을 것 없음 (0.14.0, 운송 손실 전제)'
      description: |
        MFC 가 그 이관(TRF·출발) 입고를 "더 받을 것 없음"으로 종결한 사실(WMS CDC-F-027 "손실 확정 전 양측 확인" — 사용자 2026-11-26 "MFC 입고 종결 확인을 받은 뒤에만").
        TRF 하나에 한 번(같은 본문 = 그대로, 다른 본문 409). TOUT 전이면 404 DEPARTURE_NOT_POSTED. 종결 뒤 들어온 수령(MfcReceiptPosted)도 그대로 대사한다(종결은 손실 허용 조건일 뿐).
        정 경로는 mfc-inbound(요청 MI-5) — 사건이 정해지면 구독으로 바꾸고 이 API 는 복구용으로 남긴다.
      operationId: recordTransitClosure
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trfId, departureId, mfcId, closedAt]
              properties:
                trfId: { type: string }
                departureId: { type: string }
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                closedAt: { type: string, format: date-time }
                sourceRef: { type: string, description: MFC 입고 예정·수령 참조 }
      responses:
        '200':
          description: 기록(또는 같은 본문 그대로)
          content:
            application/json:
              schema:
                type: object
                properties:
                  trfId: { type: string }
                  closedAt: { type: string, format: date-time }
                  unreconciledQty: { type: integer, description: 지금 미정산 t — 손실 후보 }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: TRANSIT_CLOSURE_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/transit-losses:
    post:
      tags: [postings]
      summary: '[운영자] 운송 손실 승인 반영 — 미정산 t 를 손실 l 로 (0.14.0, WMS CDC-F-027)'
      description: |
        MFC 입고 종결이 기록된 TRF 만(아니면 409 MFC_RECEIPT_OPEN — 아직 받는 중일 수 있는 잔량을 손실로 종결하지 않는다). 줄마다 SKU·LOT 미정산 이하(아니면 409 LOSS_EXCEEDS_UNRECONCILED).
        승인 관문은 실사와 같다(사용자 2026-11-26 "실사 조정과 같은 본사 기준"): `pmart.inventory.approval-ref.mode` VERIFY — 손실(수량 × 판매 기준가) ≥ hq-loss-krw 또는 한 SKU ≥ hq-sku-qty 면 본사 승인 번호(approval-service 한 번 사용, 종류 CDC_STOCK_ADJUSTMENT·kind TRANSPORT_LOSS),
        아래면 센터 관리자 결정만 / RECORD_ONLY 번호 필수 / 그 밖 CONFIG_REQUIRED. 반영: 출발 줄 loss_qty +l, Transit −l(원결과 TRANSPORT_LOSS), t = 0 이면 TRANSIT_RECONCILED → TransitReconciled.
        한 TRF·같은 요청 키는 한 번. 손실로 해소한 양이 나중에 발견되면 수령으로 더하지 않고 승인 정정(아직).
      operationId: postTransitLoss
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trfId, departureId, reason, lines]
              properties:
                trfId: { type: string }
                departureId: { type: string }
                reason: { type: string, maxLength: 300 }
                incidentRef: { type: string, description: TransportIncidentRaised·조사 참조 }
                approvalRef: { type: string, maxLength: 128 }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, lot, lossQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      lossQty: { type: integer, minimum: 1 }
                      lossReason: { type: string, enum: [DAMAGE, MISSING, TEMPERATURE, OTHER] }
      responses:
        '200':
          description: 반영
          content:
            application/json:
              schema:
                type: object
                properties:
                  trfId: { type: string }
                  commitId: { type: string }
                  lossQty: { type: integer }
                  unreconciledQty: { type: integer }
                  transitState: { $ref: '#/components/schemas/TransitState' }
                  approvalRef: { type: [string, 'null'] }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: MFC_RECEIPT_OPEN / LOSS_EXCEEDS_UNRECONCILED / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: APPROVAL_REQUIRED / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/adjustments:
    post:
      tags: [postings]
      summary: '[backoffice→cdc-inventory] 승인 재고 조정 ADJ / 실사 차이 CNT 집행 → InventoryAdjustmentPosted'
