  /internal/snapshots:
    get:
      tags: [availability]
      summary: '[replenishment→cdc-inventory] 재고 스냅샷 조회 (InventorySnapshotPublished와 같은 내용·버전)'
      description: |
        (0.4.0) 지금 장부를 그대로 읽은 조회 사본(snapshotId = 이번 조회 식별, 저장하지 않음). sku 를 비우면 센터에 현물 행이 있는 SKU 전부(SKU 오름차순).
        가용 조회와 달리 취급 OFF·안전량 미설정이어도 거절하지 않는다 — handlingActive=false, safety.state NOT_SET 이면 available 은 null.
        lots[].locations[] 에 위치·품질 상태별 현물(onHand)·예약(reserved)을 준다(칠곡 시뮬레이터 실서버 모드가 칸별 재고를 그린다).
        지난 snapshotId 는 보관하지 않아 404.
      operationId: getSnapshot
      parameters:
        - { name: cdcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
