openapi: 3.1.0
info:
  title: review-service
  version: 0.8.0
  x-stage: 2
  description: |
    0.8.0(2026-11-24, 통합 백오피스 "리뷰 신고 눌러서 상세 확인" — 사용자 "보이는데 눌러서 상세확인 같은걸 할 수 없다고", 신고자는 "안 보여 줌"): 운영자
    `GET /review-reports/{reviewId}`(CS_AGENT·OPERATOR_ADMIN) — 리뷰 글 전체·사진·상태와 그 리뷰의 신고 한 건 한 건(사유·기타 글·신고 시각·처리 결과·처리 직원·처리 메모,
    최근 순, 처리 전·끝 모두). **신고자는 싣지 않는다.** 사진 본문 `GET /review-photos/{photoId}` 는 상담원·운영 관리자 토큰이면 운영자가 숨긴 리뷰의 사진도 준다
    (공개 리뷰는 그대로 토큰 없이).
    0.7.0(2026-11-23, 고객앱 BR-90 리뷰 신고 — 사용자 결정 "회원만·사유 5가지(기타만 글)·한 사람 한 리뷰 한 번·신고만으로 숨기지 않고 운영자 확인 뒤 숨김·자기 리뷰 불가·결과 안 알림",
    처리 역할 CS_AGENT·OPERATOR_ADMIN, 숨긴 리뷰는 별점·리뷰 수에서 뺌 — 사용자 "추천대로"): 고객 `POST /reviews/{reviewId}/reports`(바로 기록 — APPLIED),
    상품 리뷰 목록 카드 `reportedByMe`·`mine`(회원 토큰일 때). 운영자 `GET /review-reports`(리뷰별 신고 묶음)·`POST /review-reports/{reviewId}/resolutions`(HIDE·KEEP).
    숨기면 공개 목록·단건에서 빠지고(작성자 본인 단건·자격 목록에는 LOCKED 로 보임 — 상태 값을 새로 늘리지 않음) `ReviewDeleted`(reason OPERATOR_HIDDEN)를 내 별점·리뷰 수·순위 신호에서 빠진다.
    KEEP 은 그때까지 신고만 닫는다(뒤에 새 신고가 오면 다시 열림).
    0.6.1(2026-11-23, 고객앱 BR-86 — 사용자 "응"): `Eligibility.orderWritableCount` — 같은 주문에서 지금 리뷰를 쓸 수 있는(REV_ELIGIBLE) 품목 수. 조회 조건(state·쪽)과 상관없이 그 주문 기준 — 쪽 경계에 걸려도 주문 머리 "N개"가 맞게.
    0.6.0(2026-11-21 BR-76 — 고객 앱 요청, 사용자 "BR-76부터 해줘"): 상품 리뷰 목록 `sort=RECOMMENDED`(도움돼요 많은 순 → 같으면 최근 등록순, 기본 정렬은 NEWEST 그대로)·`sku`(옵션 하나로 거르기),
    `summary.reviewCount` = **거른 수**(sku·withPhotoOnly 적용 — averageRating 은 상품 전체 그대로). 리뷰 `helpfulCount`·`helpedByMe`(회원 토큰이 있을 때만, 없으면 null).
    도움돼요 `PUT`·`DELETE /reviews/{reviewId}/helpful`(회원만 — 멱등: 이미 눌렀으면·안 눌렀으면 그대로 200) — 내 리뷰 422 `HELPFUL_OWN_REVIEW`, 공개 아닌 리뷰(삭제) 409 `REVIEW_NOT_PUBLISHED`. 도움돼요 수는 그대로 공개(숨김·반올림 없음), 반복은 게이트웨이 요청 제한만.
    0.5.0(2026-11-20 BR-67 — 사용자 "추천대로"): 리뷰관리 화면 값. `GET /me/review-eligibilities` 응답에 `total`(조건에 맞는 전체 수)·`counts`(탭 머리 — 지금 쓸 수 있는 품목 수·쓴 리뷰 수),
    `Eligibility` 에 `orderedAt`(주문 확정 시각)·`mfcName`(주문한 센터 이름 — order 0.15.0 `mfcName` 과 같은 center-master 이름)·`imageUrl`(상품의 **지금** 대표 사진 — 주문 당시 사본 아님)·`optionLabel`(지금 콘텐츠의 그 SKU 옵션 이름).
    넷 다 모르면 null(지어내지 않는다 — 사진은 게시 안 된 상품·product-content 장애, 센터 이름은 center-master 장애). 내 리뷰 목록 경로(`/me/reviews`)는 따로 없다 — "내가 쓴 리뷰"는 이 목록의 reviewId 로 조합하고 개수는 `counts.written`.
    리뷰·사진·평점, 작성/수정/삭제 이력(REV_ELIGIBLE→SUBMIT_PENDING→PUBLISHED→LOCKED(3일) / DELETED), 자격(품목별 실제 배송완료 후 14일 1건)의 정본. (docs/architecture/service-map.md §1, 2단계)
    비정본: 배송완료 사실(delivery-execution/order), 신고·차단 정책 [팀 확인 필요]. 평점 집계 투영은 product-content.
    발행: ReviewPublished, ReviewDeleted. 구독: DeliveryCompleted(자격 시작. 분할배송은 품목별 실제 수령 시각).
    최초 등록 후 3일 미만만 수정, 삭제 후 재작성 불가.
    0.2.0(2026-11-16, 구현): 사진 올리기·보기(`/review-photos`, 리뷰당 5장·장당 10MB·JPEG/PNG/WEBP — 사용자 결정), 자격에 상품명(주문 당시 사본).
    자격은 DeliveryCompleted(품목별 첫 수령 시각)로 생긴다. 작성 때 주문 원장으로 다시 확인 — 그 품목이 받은 수량만큼 모두 반품되었으면 NOT_ELIGIBLE(사용자 결정 "전체 환불이면 새 작성 막기", 이미 쓴 리뷰는 그대로).
    작성자 표시는 고객 별명을 가린 값(customer-service 내부 조회, 작성 때 한 번 저장). 운영자 숨김·신고는 아직 없다(사용자 결정 — 정책 승인 전).
    0.3.0(2026-11-18, 사용자 결정 "A해줘" — 리뷰 요청 알림): 내부 조회 `GET /internal/orders/{orderId}/review-status` — 그 주문에서 이 계정이 리뷰를 썼는지(삭제한 것 포함)·아직 쓸 수 있는 품목 수.
    0.4.0(2026-11-20, 사용자 "응 해주는데" — 리뷰 사진 느림): 사진 본문 `?w=240|480|720` 축소본(JPEG). 올린 뒤 뒤에서 미리 만든다(앱 업로드 2048px·300~550KB 사진을 썸네일에 그대로 받던 것).
    0.4.1(2026-11-20 리뷰 지적): 사진 올리기에 화소 수 상한 4천만(작은 파일로 거대한 그림 — 서버 메모리 보호). 축소본은 요청이 몰리면 5초 안에 못 만들 때 원본을 준다.
    notification-service 가 배송 완료 1시간 뒤 "리뷰를 남겨 주세요" 알림을 보낼지 정할 때 부른다(토큰 없는 내부 호출). 반품 여부는 보지 않는다(작성 때 order 로 확인).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: eligibilities, description: 본인 리뷰 작성 자격 }
  - { name: reviews, description: 리뷰 작성·수정·삭제·조회 }
  - { name: photos, description: 리뷰 사진 올리기·본문(비공개 버킷을 이 서비스가 대신 읽어 준다) }
  - { name: internal, description: 서비스 간 조회(서비스 토큰) }

paths:
  /me/review-eligibilities:
    get:
      tags: [eligibilities]
      summary: 본인 리뷰 자격 조회 (주문 품목별. 기한은 품목 실제 배송완료 + 14일)
      operationId: listMyReviewEligibilities
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: orderId, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/ReviewState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, total, counts]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Eligibility' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
                  total: { type: integer, minimum: 0, description: '(0.5.0 BR-67) 이 조건(orderId·state)에 맞는 전체 품목 수 — 쪽 크기가 아니다', x-added-in: '2026-11-20' }
                  counts:
                    type: object
                    x-added-in: '2026-11-20'
                    description: '(0.5.0 BR-67) 리뷰관리 탭 머리 개수 — state 조건은 보지 않는다(orderId 는 본다)'
                    required: [writable, written]
                    properties:
                      writable: { type: integer, minimum: 0, description: '지금 쓸 수 있는 품목 수(state REV_ELIGIBLE — 리뷰 없음·기한 안)' }
                      written: { type: integer, minimum: 0, description: '쓴 리뷰 수(삭제한 것 빼고 — state PUBLISHED·LOCKED)' }

  /reviews:
    post:
      tags: [reviews]
      summary: 리뷰 작성 (품목당 1건. REV_ELIGIBLE → SUBMIT_PENDING → PUBLISHED)
      operationId: createReview
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
      responses:
        '201':
          description: 등록됨 (사진 처리 중이면 state SUBMIT_PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: NOT_ELIGIBLE (배송완료 사실 없음·남의 품목·받은 수량 전부 반품) / ELIGIBILITY_EXPIRED (14일 경과) / ALREADY_REVIEWED / REWRITE_AFTER_DELETE_FORBIDDEN / PHOTO_NOT_FOUND (내가 올린 사진이 아니거나 다른 리뷰에 쓰임)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /reviews/{reviewId}:
    get:
      tags: [reviews]
      summary: 리뷰 단건 조회
      operationId: getReview
      security: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    patch:
      tags: [reviews]
      summary: 리뷰 수정 (최초 등록 후 3일 미만, 본인만)
      operationId: updateReview
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                text: { type: string, maxLength: 1000 }
                photoIds: { type: array, maxItems: 5, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (LOCKED 3일 경과 또는 DELETED) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: PHOTO_NOT_FOUND (내가 올린 사진이 아니거나 다른 리뷰에 쓰임)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    delete:
      tags: [reviews]
      summary: 리뷰 삭제 (삭제 후 재작성 불가. ReviewDeleted 발행)
      operationId: deleteReview
      x-pmart-user-types: [CUSTOMER]
      x-pmart-user-types-note: "작성자 본인 삭제(운영자 숨김은 아직 없음 — 2026-11-16 사용자 결정)"
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '204': { description: 삭제됨 (이미 삭제면 멱등 성공) }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /reviews/{reviewId}/helpful:
    put:
      tags: [reviews]
      summary: 도움돼요 누르기 (0.6.0 BR-76 — 회원만, 멱등)
      description: 이미 눌렀으면 그대로 200. 내 리뷰 422 HELPFUL_OWN_REVIEW, 공개 아닌 리뷰(삭제) 409 REVIEW_NOT_PUBLISHED, 없는 리뷰 404.
      operationId: markReviewHelpful
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 바뀐 수와 눌림
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpfulResult' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: HELPFUL_OWN_REVIEW
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    delete:
      tags: [reviews]
      summary: 도움돼요 취소 (0.6.0 BR-76 — 회원만, 멱등)
      description: 안 눌렀으면 그대로 200. 공개 아닌 리뷰도 취소는 받는다(수만 줄인다).
      operationId: unmarkReviewHelpful
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 바뀐 수와 눌림
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpfulResult' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /reviews/{reviewId}/reports:
    post:
      tags: [reviews]
      summary: 리뷰 신고 (0.7.0 BR-90 — 회원만, 한 리뷰에 한 번)
      description: |
        바로 기록한다(status APPLIED, resultId = reportId). 신고만으로 숨기지 않는다 — 운영자가 확인한 뒤 숨김. 결과는 신고자에게 알리지 않는다.
        거절: 없는·숨긴·삭제된 리뷰 404 REVIEW_NOT_FOUND, 이미 신고 409 ALREADY_REPORTED, 내 리뷰 422 REPORT_OWN_REVIEW, 기타(OTHER)인데 detail 없음 400 VALIDATION_FAILED.
        detail 은 OTHER 일 때만 저장(다른 사유면 버림).
      operationId: reportReview
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/ReportReason' }
                detail: { type: [string, 'null'], maxLength: 300, description: 'OTHER 일 때 필수(공백만은 없음으로 본다)' }
      responses:
        '201':
          description: 기록됨(APPLIED)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: REPORT_OWN_REVIEW
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /review-reports:
    get:
      tags: [review-reports]
      summary: (0.7.0 BR-90) 신고된 리뷰 목록 — 리뷰마다 신고 묶음 (CS_AGENT·OPERATOR_ADMIN)
      description: state OPEN(처리 전 신고가 있는 리뷰, 기본) · RESOLVED(처리 끝). 최근 신고 순. 그 밖 역할 403.
      operationId: listReviewReports
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [OPEN, RESOLVED], default: OPEN } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReviewReportGroup' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /review-reports/{reviewId}:
    get:
      tags: [review-reports]
      summary: (0.8.0) 신고된 리뷰 상세 — 리뷰와 신고 한 건 한 건 (CS_AGENT·OPERATOR_ADMIN)
      description: |
        목록 줄을 눌러 여는 상세. 리뷰(글 전체·사진·별점·작성자 가린 이름·지금 숨김/삭제)와 그 리뷰의 **모든 신고**(처리 전·끝, 최근 신고 순).
        신고자(고객)는 싣지 않는다(사용자 2026-11-24 "안 보여 줌"). 신고가 하나도 없는 리뷰·없는 리뷰는 404 REVIEW_NOT_FOUND. 그 밖 역할 403.
      operationId: getReviewReportDetail
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewReportDetail' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /review-reports/{reviewId}/resolutions:
    post:
      tags: [review-reports]
      summary: (0.7.0 BR-90) 신고 확인 처리 — HIDE(숨김) · KEEP(문제없음) (CS_AGENT·OPERATOR_ADMIN)
      description: |
        처리 전 신고를 모두 닫는다. HIDE 면 리뷰를 숨긴다(공개 목록·단건에서 빠짐, ReviewDeleted reason OPERATOR_HIDDEN → 별점·리뷰 수에서 빠짐). 처리 전 신고가 없으면 409 NO_OPEN_REPORTS.
        이미 숨긴·삭제된 리뷰에 HIDE 는 신고만 닫는다.
      operationId: resolveReviewReports
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [HIDE, KEEP] }
                note: { type: [string, 'null'], maxLength: 300, description: 처리 메모(직원만 봄) }
      responses:
        '200':
          description: 처리됨(APPLIED, resultId = reviewId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /products/{productId}/reviews:
    get:
      tags: [reviews]
      summary: 상품 리뷰 목록 (PUBLISHED/LOCKED만. 작성자는 마스킹)
      operationId: listProductReviews
      security: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [NEWEST, RECOMMENDED, RATING_DESC, RATING_ASC], default: NEWEST }, description: '0.6.0 RECOMMENDED = 도움돼요 많은 순 → 최근 등록순' }
        - { name: withPhotoOnly, in: query, schema: { type: boolean, default: false } }
        - { name: sku, in: query, schema: { $ref: '_common.yaml#/components/schemas/Sku' }, description: '0.6.0 — 이 옵션(SKU)의 리뷰만' }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Review' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
                  summary:
                    type: object
                    properties:
                      averageRating: { type: number, description: 상품 전체 공개 리뷰 평균(거르기와 상관없음) }
                      reviewCount: { type: integer, description: '0.6.0 — 거른 수(sku·withPhotoOnly 적용). 거르지 않으면 상품 전체 공개 리뷰 수' }

  /review-photos:
    post:
      tags: [photos]
      summary: 리뷰 사진 올리기 (리뷰 작성·수정 전에 한 장씩)
      description: |
        JPEG·PNG·WEBP(파일 앞부분으로 판정), 장당 10MB 이하, 4천만 화소 이하(0.4.1 — 넘으면 422 PHOTO_INVALID). 돌려준 photoId 를 작성·수정의 photoIds 에 넣는다(리뷰당 5장).
        올린 사람만 그 사진을 리뷰에 붙일 수 있다. 24시간 안에 리뷰에 붙지 않은 사진은 지운다. 같은 Idempotency-Key 재전송은 같은 photoId.
      operationId: uploadReviewPhoto
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 저장
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPhoto' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422':
          description: PHOTO_INVALID (형식·크기)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /review-photos/{photoId}:
    get:
      tags: [photos]
      summary: 리뷰 사진 본문 (공개 리뷰에 붙은 사진만 — 토큰 없이 `<img src>`)
      operationId: getReviewPhoto
      security: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string } }
        - name: w
          in: query
          description: '(0.4.0) 축소본 폭(px) — 240·480·720. 원본 폭보다 크면 원본 크기 그대로 JPEG. JPEG·PNG 만(WEBP 는 원본). 그 밖의 값은 400 VALIDATION_FAILED. 권장 — 목록·미리보기 썸네일 240, 크게 보기 720'
          schema: { type: integer, enum: [240, 480, 720] }
      responses:
        '200':
          description: 이미지 바이트(바뀌지 않으므로 긴 캐시)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  # ---------- internal (서비스 토큰) ----------
  /internal/reviews/{reviewId}:
    get:
      tags: [internal]
      summary: '[content/case→review] 리뷰 원문·상태·작성자 조회 (신고 처리·집계 검증용)'
      operationId: getReviewInternal
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Review'
                  - type: object
                    properties:
                      accountId: { type: string }
                      orderLineId: { type: string }
                      deliveredAt: { type: string, format: date-time, description: 자격 근거 (order 사본) }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/review-status:
    get:
      tags: [internal]
      summary: '[notification→review] 주문의 리뷰 작성 여부 (토큰 없는 내부 호출) — 리뷰 요청 알림을 보낼지'
      description: |
        이 계정(accountId)의 그 주문 품목 중 리뷰 자격이 있는 품목 수·리뷰를 쓴 품목 수(삭제한 리뷰 포함 — 삭제 뒤 재작성은 못 한다)·아직 쓸 수 있는 품목 수(리뷰 없음·기한 안).
        자격이 아직 없거나 남의 주문이면 모두 0(404 아님). 반품으로 쓸 수 없게 된 품목은 여기서 가리지 않는다(작성 때 order 로 확인).
        리뷰 본문·작성자는 주지 않는다. (0.3.0, 2026-11-18)
      x-added-in: '2026-11-18'
      operationId: getOrderReviewStatus
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: accountId, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReviewStatus' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

components:
  schemas:
    OrderReviewStatus:
      type: object
      description: 주문 하나의 리뷰 작성 여부(본인 계정 기준). 0.3.0
      required: [orderId, accountId, eligibleLineCount, reviewedLineCount, openLineCount, reviewed]
      properties:
        orderId: { type: string }
        accountId: { type: string }
        eligibleLineCount: { type: integer, description: 리뷰 자격이 생긴(배송 완료된) 품목 수 }
        reviewedLineCount: { type: integer, description: 리뷰를 쓴 품목 수(삭제한 리뷰 포함) }
        openLineCount: { type: integer, description: 리뷰가 없고 작성 기한(수령 + 14일) 안인 품목 수 }
        reviewed: { type: boolean, description: reviewedLineCount > 0 }
    ReportReason:
      type: string
      description: '(0.7.0) ABUSE 욕설·비방 / AD 광고·홍보 / IRRELEVANT 상품과 관계없음 / PRIVACY 개인정보 노출 / OTHER 기타(글 필수)'
      enum: [ABUSE, AD, IRRELEVANT, PRIVACY, OTHER]
    ReviewReportGroup:
      type: object
      description: '(0.7.0) 리뷰 하나의 신고 묶음(운영자)'
      required: [reviewId, productId, rating, reportCount, state, reasonCounts, lastReportedAt]
      properties:
        reviewId: { type: string }
        productId: { type: string }
        sku: { type: [string, 'null'] }
        rating: { type: integer }
        text: { type: [string, 'null'] }
        authorMasked: { type: string }
        reviewCreatedAt: { type: string, format: date-time }
        reviewHidden: { type: boolean, description: 지금 숨겨져 있는지 }
        reviewDeleted: { type: boolean, description: 작성자가 지웠는지 }
        state: { type: string, enum: [OPEN, RESOLVED], description: 'OPEN = 처리 전 신고가 있음' }
        reportCount: { type: integer, description: 이 state 의 신고 수 }
        reasonCounts: { type: object, additionalProperties: { type: integer }, description: '사유별 수(ReportReason 키)' }
        otherDetails: { type: array, items: { type: string }, description: 기타 사유 글(최근 순, 최대 10) }
        firstReportedAt: { type: string, format: date-time }
        lastReportedAt: { type: string, format: date-time }
        resolution: { type: [string, 'null'], enum: [HIDE, KEEP, null], description: 'RESOLVED 일 때 마지막 처리' }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedBy: { type: [string, 'null'], description: 처리한 직원 ID }
    ReviewReportDetail:
      type: object
      description: '(0.8.0) 신고된 리뷰 상세(운영자) — 신고자 없음'
      required: [reviewId, productId, rating, authorMasked, reviewCreatedAt, reviewHidden, reviewDeleted, photos, openReportCount, reports]
      properties:
        reviewId: { type: string }
        productId: { type: string }
        sku: { type: [string, 'null'] }
        rating: { type: integer }
        text: { type: [string, 'null'], description: 리뷰 글 전체 }
        authorMasked: { type: string }
        reviewCreatedAt: { type: string, format: date-time }
        reviewUpdatedAt: { type: [string, 'null'], format: date-time, description: 마지막으로 바뀐 시각 — 작성자 수정·운영자 숨김(없으면 null) }
        reviewHidden: { type: boolean, description: 운영자가 숨겼는지 }
        reviewDeleted: { type: boolean, description: 작성자가 지웠는지 }
        photos:
          type: array
          description: 붙은 사진(순서대로). 숨긴 리뷰 사진은 직원 토큰(Authorization)으로만 열린다
          items:
            type: object
            required: [photoId, url]
            properties:
              photoId: { type: string }
              url: { type: string, description: '사진 본문 경로 (/api/v1/review-photos/{photoId})' }
        openReportCount: { type: integer, description: 처리 전 신고 수(0 이면 처리 버튼 없음) }
        reports:
          type: array
          description: 신고 한 건 한 건 — 최근 신고 순
          items: { $ref: '#/components/schemas/ReviewReportItem' }
    ReviewReportItem:
      type: object
      description: '(0.8.0) 신고 한 건 — 신고자 없음'
      required: [reportId, reason, reportedAt, state]
      properties:
        reportId: { type: string }
        reason: { $ref: '#/components/schemas/ReportReason' }
        detail: { type: [string, 'null'], description: 기타(OTHER) 사유 글 }
        reportedAt: { type: string, format: date-time }
        state: { type: string, enum: [OPEN, RESOLVED] }
        resolution: { type: [string, 'null'], enum: [HIDE, KEEP, null] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedBy: { type: [string, 'null'], description: 처리한 직원 ID }
        resolutionNote: { type: [string, 'null'], description: 처리 메모(직원만 봄) }
    ReviewState:
      type: string
      enum: [REV_ELIGIBLE, SUBMIT_PENDING, PUBLISHED, LOCKED, DELETED, EXPIRED]
    Eligibility:
      type: object
      properties:
        orderId: { type: string }
        orderLineId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        productId: { type: string }
        productName: { type: [string, 'null'], description: 주문 당시 상품명 사본(없을 수 있다) }
        deliveredAt: { type: string, format: date-time, description: 품목별 실제 수령 시각 }
        eligibleUntil: { type: string, format: date-time, description: deliveredAt + 14일 }
        state: { $ref: '#/components/schemas/ReviewState' }
        reviewId: { type: [string, 'null'] }
        orderedAt: { type: [string, 'null'], format: date-time, x-added-in: '2026-11-20', description: '(0.5.0 BR-67) 주문 확정 시각(order 사본). 모르면 null' }
        mfcName: { type: [string, 'null'], x-added-in: '2026-11-20', description: '(0.5.0 BR-67) 주문한 센터 이름(center-master — order 0.15.0 mfcName 과 같은 값). 모르면 null' }
        imageUrl: { type: [string, 'null'], x-added-in: '2026-11-20', description: '(0.5.0 BR-67) 상품의 지금 대표 사진 경로(product-content 카드 mainImage.url — 예 /api/v1/content-images/{imageId}, ?w= 축소본 가능). 게시 안 된 상품·조회 실패면 null' }
        orderWritableCount: { type: [integer, 'null'], minimum: 0, x-added-in: '2026-11-23', description: '(0.6.1 BR-86) 같은 주문에서 지금 쓸 수 있는 품목 수 — state·쪽과 상관없이 주문 기준' }
        optionLabel: { type: [string, 'null'], x-added-in: '2026-11-20', description: '(0.5.0 BR-67) 그 SKU 의 옵션 이름(지금 콘텐츠 — 주문 당시 사본 아님). 콘텐츠에 옵션 이름이 없거나 모르면 null' }
    CreateReviewRequest:
      type: object
      required: [orderLineId, rating]
      properties:
        orderLineId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 1000 }
        photoIds: { type: array, maxItems: 5, items: { type: string }, description: 업로드 완료된 사진 ID (POST /review-photos) }
    Review:
      type: object
      required: [reviewId, productId, rating, state, createdAt]
      properties:
        reviewId: { type: string }
        productId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        authorMasked: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        photos:
          type: array
          items:
            type: object
            properties:
              photoId: { type: string }
              url: { type: string, description: '사진 본문 경로 (/api/v1/review-photos/{photoId})' }
        state: { $ref: '#/components/schemas/ReviewState' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        createdAt: { type: string, format: date-time }
        editableUntil: { type: string, format: date-time, description: createdAt + 3일 }
        updatedAt: { type: [string, 'null'], format: date-time }
        helpfulCount: { type: integer, minimum: 0, description: '0.6.0 BR-76 — 도움돼요 수(그대로 공개)' }
        helpedByMe: { type: [boolean, 'null'], description: '0.6.0 — 회원 토큰으로 볼 때 내가 눌렀는지. 비회원·토큰 없음은 null' }
        reportedByMe: { type: [boolean, 'null'], description: '0.7.0 BR-90 — 회원 토큰으로 볼 때 내가 신고했는지(상품 리뷰 목록). 그 밖 null' }
        mine: { type: [boolean, 'null'], description: '0.7.0 BR-90 — 회원 토큰으로 볼 때 내 리뷰인지(상품 리뷰 목록 — 신고 버튼 숨김). 그 밖 null' }
    HelpfulResult:
      type: object
      required: [reviewId, helpfulCount, helpedByMe]
      properties:
        reviewId: { type: string }
        helpfulCount: { type: integer, minimum: 0 }
        helpedByMe: { type: boolean }
    ReviewPhoto:
      type: object
      required: [photoId, contentType, sizeBytes, uploadedAt]
      properties:
        photoId: { type: string }
        url: { type: string, description: '사진 본문 경로 (/api/v1/review-photos/{photoId}) — 공개 리뷰에 붙은 뒤에만 열린다' }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, format: int64 }
        uploadedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
