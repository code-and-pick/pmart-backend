openapi: 3.1.0
info:
  title: fleet-service
  version: 0.2.0
  description: |
    간선 운송사·차량·기사·점유 예약의 정본. (docs/architecture/service-map.md §6)
    라이더는 rider-service, 운행 실행은 transport-execution-service, 배차 결정은 transport-planning-service.
    점유 예약은 [시작,끝) 반열림 구간 겹침으로 판정하며 차량과 기사는 따로 검사한다.
    0.2.0(2026-11-26, TMS 1단계 — 설계 docs/cdc/design/2026-11-26-tms-first-stage.md, 사용자 "planning·execution·fleet"·"TMS 2.3 에 맞춰"):
      운송사(CR-)·차량(VH- — 계약 구분 REGULAR/SPOT·톤수·온도대 하나·최대 R/T·최대 중량)·기사(DR- — 표시 이름만, 연락처 없음) 등록·조회와 점유 예약.
      TMS 정본 4.4·4.5·7.5(같은 시간대 차량·기사 중복 배정 금지). 옛 0.1.0 의 적격 차량 조회·다음 가용 시각·구획(compartments)은 뺐다(routing 단계 때 다시).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: carriers, description: 운송사 }
  - { name: vehicles, description: 간선 차량 }
  - { name: drivers, description: 간선 기사 }
  - { name: internal, description: 서비스 간 호출(planning·execution) }

paths:
  /carriers:
    get:
      tags: [carriers]
      summary: '[0.2.0] 운송사 목록'
      operationId: listCarriers
      x-pmart-user-types: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Carrier' } }
    post:
      tags: [carriers]
      summary: '[0.2.0] 운송사 등록 (CDC_MANAGER)'
      operationId: createCarrier
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarrierInput' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrier' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /vehicles:
    get:
      tags: [vehicles]
      summary: '[0.2.0] 차량 목록 — 차량 ID 순'
      operationId: listVehicles
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: carrierId, in: query, schema: { type: string } }
        - { name: tempClass, in: query, schema: { $ref: '#/components/schemas/TempClass' } }
        - { name: contractType, in: query, schema: { $ref: '#/components/schemas/ContractType' } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Vehicle' } }
    post:
      tags: [vehicles]
      summary: '[0.2.0] 차량 등록 (CDC_MANAGER) — 같은 차량 ID 는 409'
      operationId: createVehicle
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /vehicles/{vehicleId}:
    get:
      tags: [vehicles]
      summary: '[0.2.0] 차량 상세'
      operationId: getVehicle
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /vehicles/{vehicleId}/changes:
    post:
      tags: [vehicles]
      summary: '[0.2.0] 차량 정보 바꾸기 (CDC_MANAGER) — 최대 R/T·중량·사용 여부·번호판'
      description: 온도대·운송사·계약 구분은 바꾸지 않는다(새 차량으로 등록). 사용 중지해도 이미 잡힌 점유는 그대로 둔다.
      operationId: changeVehicle
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plateNo: { type: string, maxLength: 20 }
                maxRt: { type: integer, minimum: 1, maximum: 60 }
                maxWeightKg: { type: integer, minimum: 1, maximum: 30000 }
                active: { type: boolean }
      responses:
        '200':
          description: 바뀐 차량
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /drivers:
    get:
      tags: [drivers]
      summary: '[0.2.0] 기사 목록 — 기사 ID 순'
      operationId: listDrivers
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: carrierId, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Driver' } }
    post:
      tags: [drivers]
      summary: '[0.2.0] 기사 등록 (CDC_MANAGER) — 표시 이름만(연락처·면허 번호 같은 개인정보는 받지 않는다)'
      operationId: createDriver
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverInput' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /drivers/{driverId}:
    get:
      tags: [drivers]
      summary: '[0.2.0] 기사 상세'
      operationId: getDriver
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: driverId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/reservations:
    post:
      tags: [internal]
      summary: '[planning→fleet] 점유 예약 — 차량·기사 함께, 겹치면 둘 다 잡지 않음'
      description: |
        [start, end) 가 같은 차량이나 같은 기사의 살아 있는 점유(HELD)와 겹치면 409 RESOURCE_OCCUPIED(겹친 reservationId·종류를 detail 에). 사용 중지 차량·기사 409 RESOURCE_INACTIVE.
        purposeRef(운송지시서 ID) 당 하나 — 같은 purposeRef·같은 본문이면 그대로, 다른 차량·기사로 다시 오면 앞 점유를 풀고 새로 잡는다(같은 트랜잭션).
      operationId: createReservation
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId, driverId, window, purposeRef]
              properties:
                vehicleId: { type: string }
                driverId: { type: string }
                window: { $ref: '#/components/schemas/TimeWindow' }
                purposeRef: { type: string, maxLength: 64 }
      responses:
        '200':
          description: 잡힌 점유
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetReservation' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/reservations/{reservationId}:
    get:
      tags: [internal]
      summary: 점유 예약 조회
      operationId: getReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetReservation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/reservations/{reservationId}/releases:
    post:
      tags: [internal]
      summary: '[planning·execution→fleet] 점유 해제 (멱등 — 이미 풀렸으면 그대로)'
      operationId: releaseReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [CANCELLED, REPLANNED, TRIP_ENDED] }
      responses:
        '200':
          description: 풀린 점유
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetReservation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    TempClass:
      type: string
      enum: [AMBIENT, CHILLED, FROZEN]
    ContractType:
      type: string
      description: REGULAR(정규차 — 고정 노선 계약) · SPOT(용차 — 칠곡은 지금 쓰지 않음, CDC-8)
      enum: [REGULAR, SPOT]
    TimeWindow:
      type: object
      required: [start, end]
      description: "[start, end) 반열림 구간."
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    CarrierInput:
      type: object
      required: [carrierId, name]
      properties:
        carrierId: { type: string, pattern: '^CR-[A-Z0-9-]{1,20}$' }
        name: { type: string, maxLength: 60 }
    Carrier:
      type: object
      required: [carrierId, name, active]
      properties:
        carrierId: { type: string }
        name: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    VehicleInput:
      type: object
      required: [vehicleId, carrierId, contractType, tempClass, tonnage]
      properties:
        vehicleId: { type: string, pattern: '^VH-[A-Z0-9-]{1,24}$' }
        carrierId: { type: string }
        plateNo: { type: string, maxLength: 20 }
        contractType: { $ref: '#/components/schemas/ContractType' }
        tempClass: { $ref: '#/components/schemas/TempClass' }
        tonnage: { type: number, minimum: 0.5, maximum: 25, description: 톤수(기본 5톤 — 정본 4.4) }
        maxRt: { type: integer, minimum: 1, maximum: 60, default: 20, description: '최대 적재 R/T(5톤 기본 20 [가정])' }
        maxWeightKg: { type: integer, minimum: 1, maximum: 30000, default: 5000, description: '최대 적재 중량(5톤 기본 5,000kg [가정])' }
    Vehicle:
      type: object
      required: [vehicleId, carrierId, contractType, tempClass, tonnage, maxRt, maxWeightKg, active, version]
      properties:
        vehicleId: { type: string }
        carrierId: { type: string }
        plateNo: { type: [string, 'null'] }
        contractType: { $ref: '#/components/schemas/ContractType' }
        tempClass: { $ref: '#/components/schemas/TempClass' }
        tonnage: { type: number }
        maxRt: { type: integer }
        maxWeightKg: { type: integer }
        active: { type: boolean }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DriverInput:
      type: object
      required: [driverId, carrierId, displayName]
      properties:
        driverId: { type: string, pattern: '^DR-[A-Z0-9-]{1,24}$' }
        carrierId: { type: string }
        displayName: { type: string, maxLength: 30, description: 화면 표시 이름(예 "기사 01") — 실명·연락처를 넣지 않는다 }
    Driver:
      type: object
      required: [driverId, carrierId, displayName, active, version]
      properties:
        driverId: { type: string }
        carrierId: { type: string }
        displayName: { type: string }
        active: { type: boolean }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        createdAt: { type: string, format: date-time }
    FleetReservation:
      type: object
      required: [reservationId, state, vehicleId, driverId, window, purposeRef]
      properties:
        reservationId: { type: string }
        state: { type: string, enum: [HELD, RELEASED] }
        vehicleId: { type: string }
        driverId: { type: string }
        window: { $ref: '#/components/schemas/TimeWindow' }
        purposeRef: { type: string }
        releaseReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        releasedAt: { type: [string, 'null'], format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
