        - { name: type, in: query, schema: { $ref: '#/components/schemas/TaskType' } }
        - name: state
          in: query
          description: 여러 값은 반복 파라미터. 생략 시 ASSIGNED, IN_PROGRESS (화면 기본값)
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/TaskState' } }
        - name: activityFrom
          in: query
          description: '(0.12.0, F-7 R1) 활동 날짜(Asia/Seoul) 시작 — 그날부터 시작·실적·끝(COMPLETED·CLOSED_PARTIAL·CANCELLED 로 바뀜)이 있는 작업만. activityTo 만 주면 그 하루, 최대 31일'
          schema: { type: string, format: date }
        - name: activityTo
          in: query
          description: '(0.12.0) 활동 날짜 끝(포함, Asia/Seoul)'
          schema: { type: string, format: date }
        - name: cartCode
          in: query
          description: |
            (0.25.0, mfc-app BR-52 R20-5) 장바구니 코드(`CRT-…`) — 그 장바구니로 집품한(PICK 실적 toLocation, 반영됐거나 결과 대기) 출고의 작업만.
            패킹대에서 장바구니를 찍어 주문(PACK)을 불러올 때 `type=PACK&cartCode=CRT-…`. state 를 주지 않으면 이때만 기본값이 끝나지 않은 작업
            (WAITING·READY·ASSIGNED·IN_PROGRESS·BLOCKED) — 장바구니는 다시 쓰이므로 끝난 예전 주문은 빠진다. 권한·정렬은 목록과 같다.
          schema: { type: string, maxLength: 64 }
