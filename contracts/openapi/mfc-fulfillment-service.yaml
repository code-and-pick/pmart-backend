  /shipments/promise-summary:
    get:
      tags: [shipments]
      summary: 출하 약속 요약 — 초과·임박 출고 수 (0.21.0, MFC 백오피스 OE-2)
      description: |
        센터 운영판 "출하 약속 초과·임박" 숫자. 그 센터의 취소 안 된 출고 중 **PICK·PACK 이 아직 끝나지 않은 것만** 센다(출하 대기 전).
        출고의 약속 = 열린 PICK·PACK 작업 `promisedReadyAt` 중 가장 이른 것(작업 목록의 값과 같다).
        overdue = 약속 < 지금, dueSoon = 지금 ≤ 약속 < 지금 + dueWithinMinutes, onTime = 그 뒤, noPromise = 약속 없음.
        임박 기본 **15분**(사용자 2026-11-19), 1~240. 그 센터 운영자(작업자·센터 관리자), OPERATOR_ADMIN·서비스는 모든 센터.
      operationId: getShipmentPromiseSummary
