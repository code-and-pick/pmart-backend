openapi: 3.1.0
info:
  title: mfc-fulfillment-service
  version: 0.31.1
  description: |
    0.31.1(2026-11-20, 라이더 앱 실서버 — PC 5 작성·PC 3 검토): 번호 인계 `POST /packages/handover-code-authorizations` 에서 그 출고의 **이미 인계된 포장 숫자**면 409 `ALREADY_HANDED_OVER`(틀린 횟수에 넣지 않음). 인계 뒤 같은 번호를 다시 넣으면 HANDOVER_CODE_MISMATCH 로 세어 5번이면 잠기던 것.
    MFC 작업(PICK/PACK/DISPATCH Task)·Shipment·Package·HandoverFact·**인계 fence**의 정본. (docs/architecture/service-map.md §5, ADR-0006)

    0.2.0(2026-11-07, 슬라이스 6b): 점원 단말 Task API·포장 밀봉 구현. 작업자 = 운영자 계정(작업자 로그인 BR-02 결정 전 잠정) — 그 센터 권한 +
    역할 `MFC_WORKER`. 담당은 mfc-capacity 수동 배정(센터 관리자 `MFC_SUPERVISOR`, WK-02 — Q-08 전 수동 지정만)의 투영과 시작 때 동기 조회.
    PICK 시작(센터에서 그 주문의 첫 시작)이 준비 시작 PreparationStarted(D6-1). 피킹 실적은 mfc-inventory PICK(선반 → 장바구니 또는 포장 구역)으로, 포장 밀봉은
    PACK(PICKED → PACKED, 장바구니면 패킹대로 옮기며)으로 반영한다. 결품 보고는 작업을 BLOCKED 로 두고 LineShortageReported 만 낸다(재고 처리는 IV-09 단계).
    DISPATCH·인계 fence 는 아직 501(6c).

    0.3.0(2026-11-08, IV-08 집품 뒤 취소, ADR-0046): 피킹이 시작된 주문의 **전체** 작업 중지는 PENDING 으로 받은 뒤 남은 작업 취소·작업 종료
    (완료량 있으면 CLOSED_PARTIAL)·밀봉 포장 INVALIDATED·출고 CANCELLED·복귀 작업(RETURN) 생성 → mfc-inventory cancel-returns(집품·포장분
    취소 복귀 대기, 예약 해제)가 반영되면 RESOLVED(packages[] 모두 STOPPED, notStartedLines 빈 배열)·WorkStopResult. RETURN 작업은 그때 READY.
    점원은 RETURN 을 시작해 executionType RETURN 실적(포장 위치 → 선반, inventory MOVE)으로 복귀한다 — 다 옮기면 COMPLETED, 판매 가능 복귀.
    진행 중(재고 결과 대기) 실적·포장이 있으면 그 결과가 날 때까지 PENDING(sweep 재시도). 피킹 뒤 부분 중지는 아직 없다(PENDING).

    0.4.0(2026-11-08, 슬라이스 6c 라이더 인계, ADR-0047 — 인계 계약 정본 docs/business/flows/package-handover-contract.md):
    배정은 delivery-dispatch 사건(DeliveryCreated·DeliveryAssigned·DeliveryAssignmentChanged·DeliveryCancelledBeforePickup, 토픽
    delivery.delivery.v1)의 투영. 라이더(토큰 RIDER, 주체 = riderId)가 포장 QR 을 찍으면 인계 허가(fence, 유효시간은 센터 설정
    `pmart.fulfillment.handover-fence-ttl."[센터]"` — 없으면 422 CONFIG_REQUIRED) → 인계 확정(mfc-inventory 인계 전기 H−q·E−q·R−q) →
    포장 HANDED_OVER, 출고 PARTIALLY_HANDED_OVER/HANDED_OVER, PackageHandedOver. 중지와 허가·확정은 주문 잠금으로 한 줄 — 중지 기록이 있으면
    허가 거절, 살아 있는 fence·결과 대기 인계가 있으면 중지는 그 포장 HANDOVER_IN_PROGRESS 로 대기, 인계된 포장이 있으면 전체 중지는 거절
    (packages[] 에 HANDED_OVER, 작업 그대로 — 인계분 회수는 CS). 만료된 fence 는 확정 요청 전일 때만 끝난 것으로 본다.
    비정본: 수량(mfc-inventory), 취소 판단(order-orchestration/claim), 배차(delivery-dispatch), 작업자 배정 정본(mfc-capacity), 주문 상태(order).

    상태 기계
    - TSK: WAITING→READY→ASSIGNED→IN_PROGRESS→COMPLETED / BLOCKED / FAILED / CANCELLED / CLOSED_PARTIAL (계획 = 완료 + 취소 + 잔량)
    - SHP: PREPARING→READY→PARTIALLY_HANDED_OVER→HANDED_OVER / CANCELLED / CLOSED_PARTIAL
    - PKG: OPEN→SEALED→HANDED_OVER / SEALED→INVALIDATED(재포장·피킹 뒤 중지) / OPEN→VOIDED(재고 PACK 거절)
    - 인계 fence: AuthorizePackageHandover → HANDOVER_IN_PROGRESS(handoverAuthorizationId, fenceVersion) → CommitPackageHandover → mfc-inventory 커밋 → HANDED_OVER.
      WorkStopResult와 PackageHandedOver는 같은 packageId에 상호 배타. fence 만료는 취소 성공이 아니다.

    0.5.0(2026-11-16, 오배송 재발송 — ADR-0052 결정 4, 사용자 "새상품 재배차 서비스 넣어" → "전부 PR로"): ConfirmOrder 에 `kind`(ORIGINAL 기본 / RESHIPMENT)·`reshipmentRef`(오배송 확인 사건 caseId).
      RESHIPMENT 는 **같은 주문의 두 번째 작업 지시**(원래 작업 지시와 따로 — 주문당 ORIGINAL 하나, 같은 reshipmentRef 는 하나). 자기 재고 예약(reservationId)으로 덮이는지 보고, 이미 중지된 수량은 빼지 않는다(배송된 상품을 다시 보내는 것).
      재발송 출고의 WorkAccepted·PackingFinished·ShipmentReady·DispatchRequested·LineShortageReported 에 `purpose: MISDELIVERY_RESHIPMENT`·`caseId`. WorkAccepted/WorkRejected 집계는 fulfillmentId(원래 주문 집계 버전과 겹치지 않게).
      `GET /internal/work-orders?orderId=` 와 작업 중지는 원래(ORIGINAL) 작업 지시만 본다.

    0.7.0(2026-11-16, PDA 피킹 스캔 대조 — 사용자 승인으로 PC 1 수정): 작업 상세 TaskLine 에 `barcodes`(그 SKU 의 활성 바코드 전부 — 제조사 880… + 점포 299… 처럼 여럿일 수 있음)를 더하고,
      그동안 늘 null 이던 `barcode` 는 그 첫 값으로 채운다(하위 호환). 저장하지 않고 **조회 때** mfc-inventory SKU 투영(`GET /internal/skus?skus=`, 100건씩)에서 읽는다 — 이미 만든 작업도 바로 맞는다.
      재고 조회가 안 되거나 투영이 없는 SKU 는 `barcode` null·`barcodes` 빈 배열(상세 자체는 실패하지 않음).

    0.9.0(2026-11-17, 백오피스 처리 대기 BO-12 — 요청 F-4, backoffice 사용자 결정 2026-11-16 "A안"): 멈춘 것을 찾는 목록 둘
      `GET /stop-requests?failed=true`(실패로 멈춘 집품 뒤 중지)·`GET /package-handovers?status=REJECTED`(재고가 거절한 인계 D-8) —
      OPERATOR_ADMIN(모든 센터) 토큰, 오래된 순·커서, 개인정보 없음, 처리되면(RESOLVED·다시 보냄) 빠진다. 재시도 두 경로(`/internal/…/retries`)는
      본문에 선택 `{operatorId, reason}` 을 받아 **실제로 다시 시도했을 때** 재시도 기록(`manual_retry`)으로 남기고 목록의 `lastRetry` 로 보인다.
      중지 요청에 실패 시각(`failedAt`)을 저장한다(0.9.0 전 실패분은 null — 화면은 requestedAt).

    0.10.0(2026-11-17, 백오피스 통합 조회 MFC 칸 BO-11 — 요청 F-3): `GET /work-orders?orderId=` — 주문 번호로 현장 상태(작업 지시·결정·출고별
      작업·작업자·시작/끝 시각·결품 보고·포장·인계·중지 요청). 직원 토큰: OPERATOR_ADMIN·CS_AGENT·RIDER_OPS 는 모든 센터, 그 밖 운영자는 자기 센터만.
      개인정보 없음.
    0.11.0(2026-11-17, LOT 바코드 GS1-128 — 요청 IV-4): PICK 작업 상세 `picks[].lotNo`(mfc-inventory 0.21.0 피킹 계획 사본) — PDA 가 찍은 GS1 (10) 과 대조.
    0.12.0(2026-11-17, 작업자 오늘 업무 내역 — 요청 F-7): `GET /tasks` 에 `activityFrom`·`activityTo`(서울 날짜), `TaskSummary.completedAt`,
      `GET /internal/work-activities`(작업 실적·포장 — mfc-capacity 가 모은다).
    0.13.0(2026-11-17, 포장 라벨 번호 — 요청 F-5·F-8): 화면용 주문번호 `orderNumber`(order OrderConfirmed 사본 — 포장·출고·작업 응답),
      포장 라벨 숫자 `Package.handoverCode`(6자리 무작위 → 0.23.0 센터 안 겹치지 않는 4자리), 라이더 숫자 인계 `POST /packages/handover-code-authorizations`.
    0.14.0(2026-11-17, 배차 요청 시점 — 요청 F-2): `POST /shipments/{id}/dispatch-requests` 를 피킹 시작 전(피킹 작업 READY 이후)부터 — 분 = 출하 준비까지.
    0.15.0(2026-11-17, 센터 출고 목록 — 요청 F-9, PC 2 포장 인계 현황): `GET /shipments?mfcId=&state=` — 출고마다 PICK·PACK 상태·포장별 인계(원천 값).
    0.16.0(2026-11-17, 거절 사유 — mfc-app 요청 E1·E3): `TaskExecution.rejectCode`·`rejectReason`(REJECTED 일 때, 저장해 두던 재고 거절 사유를 나눠서), 코드 목록.
    0.17.0(2026-11-18, 권한 — 요청 MB-3, PC 3 결정): 확인 필요 포장 목록(`GET /packages?checkRequired=true`)·점원 확인(`handover-checks`)을 그 센터 MFC_SUPERVISOR 도(MFC_WORKER 와 함께).
    0.18.0(2026-11-18, mfc-app 요청 — 피킹한 사람이 그 주문 패킹): 작업 목록·요약 `pickedBy`(PACK 만, 같은 출고 PICK 을 끝낸 담당). 추가 칸만.
    0.19.0(2026-11-19, 결품률 지표 — 요청 F-10, 백오피스 대시보드): `GET /metrics/picking-lines?from=&to=&mfcId=` — 날짜(Asia/Seoul, 주문 피킹 시작 시각)·센터별 pickedLines·shortLines·shortLinesByReason(SHORT·DAMAGED·BLOCKED), 줄 단위. 원래 주문 작업만(재발송 제외).
    0.20.0(2026-11-19, 출하대기 랙 — 요청 F-12·시뮬레이터 R-20·PDA BR-52 R20): `POST /packages/{packageId}/staging {stagingLocation}` — 밀봉 포장을 출하대기 랙(구역 DISPATCH_STAGING)에, mfc-inventory 작업 실행 STAGE 로 포장분 PACKED 위치만 옮김(수량·예약 불변). `Package.packingLocation`·`stagingLocation`. 인계 전기·중지 복귀는 지금 있는 곳(랙 또는 패킹대).
    0.21.0(2026-11-19, MFC 백오피스 센터 운영판 — 요청 OE-1·OE-2·DL-1): `GET /shortages`(센터 결품 보고 목록 + 전체 건수, V18 결품 줄에 상품·LOT·위치·보고자), `GET /shipments/promise-summary`(출하 약속 초과·임박·여유·없음 출고 수, 임박 기본 15분 — 사용자 2026-11-19), 인계 판정(`HandoverResolution`)에 `handoverCode`·`orderNumber`, 센터 출고 목록 `CenterShipment.packages[].handoverCode`(bff DL-2 원천).
    0.22.0(2026-11-19, 결품 사유 변질 — 품질 사고 MB-2 결정 2 "파손·변질만"): 결품 사유에 **SPOILED(변질 — 상함·부패·냉장 이탈 흔적 등 실물은 있으나 팔 수 없음)**. 재고는 DAMAGED 처럼 그 LOT 을 격리하고, mfc-quality 가 변질(SPOILAGE) 사고를 자동으로 연다. 지표 `shortLinesByReason.SPOILED`(선택 칸 — 예전 응답 하위 호환), 결품 목록 `reason=SPOILED`.
    0.23.0(2026-11-20, 포장 인계 번호 4자리 — MFC 시뮬레이터 R-26, 사용자 결정 "앞으로 발생하는 주문 인계 번호는 다 4자리"): 새 포장의 `handoverCode` 는 **4자리**, 같은 센터에서 지금 쓰는(OPEN·SEALED) 포장끼리 겹치지 않는다(인계·무효가 되면 다시 쓰인다 — 직원이 번호로 불러도 된다). 이미 6자리를 받은 포장은 그대로이고 입력도 받는다 (`handoverCode` pattern `^([0-9]{4}|[0-9]{6})$`). 숫자 인계에서 같은 라이더·배송이 **5번** 틀리면 409 `HANDOVER_CODE_LOCKED`(맞는 번호도 거절 — QR·점원 확인만), 틀릴 때 409 HANDOVER_CODE_MISMATCH details `attemptsLeft`.
    0.24.0(2026-11-20, 작업 실적 목록·출고 배송 ID — MFC 시뮬레이터 R-17·R-19): `GET /tasks/{taskId}/executions`(그 작업의 실적, 최근 순 — 유형·작업자·`fromLocation`·`toLocation`·줄(orderLineId·sku·lotId·pickedQty)·상태·`recordedAt`), `TaskExecution` 에 같은 칸(단건 조회도), 작업 상세 `lastExecution`(가장 최근 실적의 칸·시각 — 실제 작업자가 마지막으로 찍은 칸, SIM-2a). `Shipment.deliveryId` 를 채운다(인계 사실의 배송, 없으면 delivery-dispatch DeliveryCreated 투영의 취소 안 된 배송 — 배송이 생기기 전·취소만 있으면 null). 추가 칸·조회만.
    0.25.0(2026-11-20, PDA 피패킹·복귀 — mfc-app BR-52 R19·R20): 작업 상세 줄 `temperatureZone`(SKU 보관 온도대 AMBIENT·CHILLED·FROZEN — mfc-inventory SKU 사본, 조회 때 읽음, 모르면 null — R19-2). 작업 목록 `cartCode`(장바구니 `CRT-…` 를 찍으면 그 장바구니로 집품한 출고의 작업 — R20-5). 포장 밀봉·조회 `icePackCount`(아이스팩 수, 선택 — R19-9 사용자 결정 2026-11-20 "아이스팩 수만 기록"). 복귀(RETURN) 실적: 냉장·냉동 상품 줄은 보낸 resultQuality 와 상관없이 **늘 QUARANTINED**(격리로 선반에 — 품질 판정 뒤에만 판매, R19-8 사용자 결정 2026-11-20 "항상 품질 검사"), 복귀 예외 보고(`shortage` — 한 줄·옮긴 양 0, 사유 SHORT·DAMAGED·SPOILED·BLOCKED, R19-7)를 기록만 한다(재고·작업 상태 그대로).
    0.26.0(2026-11-20, 복귀 예외 처리 — mfc-app BR-52 R19-7 사용자 결정 2026-11-20 "응"): 복귀(RETURN) 예외 보고가 기록만에서 처리로. **DAMAGED·SPOILED** = `toLocation`(격리로 둘 선반) 필수(없으면 400 TO_LOCATION_REQUIRED) — 일반 복귀와 같은 재고 MOVE 를 resultQuality QUARANTINED 로(격리·보관 — 해제·폐기는 mfc-quality), 실적 appliedQty = 예외 수량, 작업 줄 완료량에 더한다. **SHORT·BLOCKED** = 재고 호출 없이 실적 APPLIED(appliedQty = 예외 수량), 작업 줄 취소량에 더한다 — 포장·장바구니 위치에 CANCEL_RETURN_PENDING 으로 남은 재고는 관리자가 재고 정정(승인)으로 맞춘다. 둘 다 남은 복귀량이 줄고 다 처리되면 작업 COMPLETED, `GET /shortages` 에 taskType RETURN 줄로 남는다(locationCode = 복귀 대상이 놓인 위치). LineShortageReported 는 내지 않는다(취소된 주문). 0.25.0 에 기록만 한 예외 보고(appliedQty 0)는 처리한 양으로 세지 않는다. 결품률 지표는 그대로(PICK 작업 줄만).
    0.27.0(2026-11-20, 센터 관리자 지난 주문 조회 — MFC 시뮬레이터 R-29 3번, 사용자 "R-29 … 니가 바로 고쳐"): `GET /work-orders` 가 `orderId` 대신 화면용 주문번호 `orderNumber`(8자리, 공백·하이픈 무시)로도 찾는다 — 둘 중 정확히 하나(아니면 400), 번호 사본이 없으면 404. `GET /shipments` 에 `orderNumber`·`createdFrom`/`createdTo`(출고 만든 날, Asia/Seoul, 최대 31일)·`sort`(oldest 기본 = 예전 그대로 / recent = 만든 순 거꾸로) — 번호·날짜를 주고 state 를 안 주면 모든 상태(지난 주문). 권한은 그대로. 추가 칸만.
    0.28.0(2026-11-20, 관리자 작업 중지 — MFC 시뮬레이터 R-29 2단계, 사용자 결정 2026-11-20, ADR-0079): `POST /tasks/{taskId}/blocks`(그 센터 `MFC_SUPERVISOR` 또는 `OPERATOR_ADMIN`, 사유 필수) — READY·ASSIGNED·IN_PROGRESS 작업을 BLOCKED(`blockKind` SUPERVISOR)로. 담당·시작·집품분·재고·예약·배차 요청은 그대로(WK-04 "고장만으로 예약 해제 안 됨"). 결과를 기다리는 실적·열린 포장이 있으면 409 EXECUTION_IN_FLIGHT. 막힌 작업의 시작·실적·포장 밀봉은 409 **TASK_BLOCKED**(결품으로 막힌 것도 같은 코드). `GET /tasks/{taskId}/controls`(관리자 조작 기록, 최근 순), 작업 상세 `blockKind`. 작업자는 예전처럼 PDA 문제 보고(결품)만.
    0.29.0(2026-11-20, 관리자 막힘 해제 — R-29 2단계, ADR-0079): `POST /tasks/{taskId}/unblocks`(같은 역할, 사유 + 실물 확인 `cartChecked: true` 필수 — 빠지면 400, false 면 422 PHYSICAL_CHECK_REQUIRED). 관리자 중지(blockKind SUPERVISOR)만 푼다(결품 BLOCKED 409 BLOCKED_BY_SHORTAGE). mfc-capacity 활성 배정이 있고 그 작업자가 지금 맡을 수 있으면(workerEligibility 없음) ASSIGNED(그 사람, 시작은 다시), 아니면 capacity 배정을 풀고 READY. 완료량 그대로. capacity 조회·해제 실패 503(바꾸지 않음).
    0.30.0(2026-11-20, 관리자 부분 종료 — R-29 2단계, ADR-0079): `POST /tasks/{taskId}/partial-closes`(같은 역할, 사유 필수, **PICK 만**). 아직 집지 않은 잔량만 끝낸다 — 집은 양이 0 이면 422 NOTHING_EXECUTED(주문 취소 OPERATOR_DECISION·복귀로). 작업은 BLOCKED(`blockKind` PARTIAL_CLOSE) + 줄마다 `LineShortageReported`(reason **PARTIAL_CLOSE**, shortQty = 잔량) — 결품과 같은 사가가 잔량 취소(shortage-resolutions) → 예약 해제(inventory PARTIAL_CLOSE_CANCELLED) → 주문 수량 변경 → 그 품목 부분 환불. 잔량이 다 취소되면 PICK **CLOSED_PARTIAL**·포장 준비(집은 양은 그대로 포장). 결품 목록 사유에 PARTIAL_CLOSE(결품률 지표에는 세지 않음). 결품으로 막힌 작업은 409 BLOCKED_BY_SHORTAGE, 처리 중이면 409 PARTIAL_CLOSE_PENDING(해제도 같은 코드).
    0.31.0(2026-11-20, 피킹 끝 PACK 바로 배정 — ADR-0080, 사용자 "응"): API 모양 변화 없음. PACK 이 대기에서 풀릴 때 내는 TaskProgressed(state READY/ASSIGNED, previousState WAITING)에 `pickedBy`(그 출고 PICK 을 끝낸 작업자)를 싣고, 결품 해결로 PICK 이 끝날 때도 이 사건을 낸다 — mfc-capacity 가 그 사람에게 PACK 을 바로 배정(→ AssignmentPublished → ASSIGNED).
    **사유 값(2026-11-19, 요청 F-11 — 화면 이름표용. 목록 밖 값이 올 수 있다: 재고 서비스가 새 거절 코드를 더하면 그대로 온다 → 화면은 코드 그대로)**
    - C1 작업 중지 실패 `lastError`(StopRequest·처리 대기 MFC_STOP_FAILED) = `코드: 상세`. 코드:
      `RECORD_MISMATCH` 집품·포장 기록이 재고 서비스와 맞지 않음(현장 확인 필요) · `RETURN_MISMATCH` 복귀할 위치별 수량 합이 집품·포장량과 다름 ·
      `INVALID_STATE` 예약 상태가 바뀜(이미 인계·소비 등) · `VERSION_CONFLICT` 동시에 다른 변경 · `NOT_FOUND`(또는 `…_NOT_FOUND`) 예약·위치 없음 · `VALIDATION_FAILED` 요청 값 오류.
      `PDA_OFFLINE` 같은 값은 없다(목 데이터). 결과 모름(재고 무응답)은 실패가 아니라 서버가 다시 시도한다(lastError 없음).
    - C2 작업·출고 막힘 `blockReason`(작업 BLOCKED) = **한국어 문장**(코드 아님) 두 가지 —
      `예약 보류(격리·실사 손실 — 재확보 못 함): <주문 줄> <수량>개, …`(피킹 시작 때 재고가 보류한 양) ·
      `결품 보고: <주문 줄> <수량>개 <사유>(재확보 못 함), …`(사유 SHORT 부족·DAMAGED 파손·BLOCKED 보류). 화면은 앞부분(`예약 보류`·`결품 보고`)으로 이름표를 붙이고 문장은 상세에.
      (0.28.0) `관리자 작업 중지: <사유>`(센터 관리자가 멈춤 — `blockKind` SUPERVISOR, 결품 둘은 blockKind null).
      (0.30.0) `부분 종료(잔량 취소 처리 중): <주문 줄> <수량>개, … — <사유>`(`blockKind` PARTIAL_CLOSE — 결품 사가가 잔량을 취소하면 CLOSED_PARTIAL).
      문장 안 주문 줄은 시스템 ID 다(ADR-0070 — 목록에는 보이지 않게).
    - C3 포장 인계 거절 `rejectReason`(PackageHandover·처리 대기 MFC_HANDOVER_REJECTED) = `코드: 상세`. 코드(재고 인계 전기):
      `INSUFFICIENT_STOCK` 포장 위치에 포장분이 모자람(다른 곳에 놓였거나 이미 나감) · `HANDOVER_QTY_EXCEEDED` 포장한 양보다 많이 넘기려 함 ·
      `INVALID_STATE` 예약이 확정 상태가 아님(취소·보류) · `FENCE_VERSION_MISMATCH` 같은 포장을 다른 인계 승인으로 이미 넘김 · `VERSION_CONFLICT` 동시에 다른 변경 · `VALIDATION_FAILED` 요청 값 오류.
      `RECORD_MISMATCH` 는 C1 의 값이다(인계에는 나오지 않음).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: work-orders, description: 서비스 간 작업 요청·중지 (orchestration) }
  - { name: tasks, description: 점원 단말 피킹/패킹 실행 }
  - { name: shipments, description: 출하 단위·포장·QR }
  - { name: handovers, description: 라이더 QR 인계 fence }
  - { name: operations, description: '백오피스 처리 대기(BO-12) — 멈춘 중지·거절된 인계 (0.9.0)' }

paths:
  /internal/work-orders:
    post:
      tags: [work-orders]
      summary: '[orchestration→fulfillment] ConfirmOrder — 작업 요청 수락/거절 (재전달 시 중복 생성 없음)'
      description: |
        확정 주문의 이행 계획(shipments)을 받아 출고마다 PICK(READY, 예약 주문은 슬롯 시작 N분 전) + PACK(WAITING) Task 를 만든다
        (docs/business/flows/order-checkout-saga.md §2.0, 슬라이스 6a 2026-11-07). 작업자 배정·DISPATCH 는 6a 범위 밖.
        결정은 응답 본문 WorkOrderDecision 이다 — 업무 거절도 201 + decision REJECTED 로 준다(같은 키 재전송 때 같은 결정을 재생).
        - 작업 버전(workVersion): 주문 하나에 작업 지시(fulfillmentId) 하나, 요청마다 버전 하나. 첫 요청 1, 거절 뒤 재시도는 이전보다 큰 값.
          같은 orderId·같은 workVersion 재전달은 기존 결정을 돌려준다. 이미 접수된 주문에 새 버전이 오거나
          마지막 버전보다 작은 값이 오면 409 INVALID_STATE.
        - 거절 사유(WorkRejectReason): INVENTORY_MISMATCH(재고 예약이 확정 상태로 요청 수량을 덮지 못함 — mfc-inventory 예약 조회),
          OPERATION_RESTRICTED(센터 운영 중단), CAPACITY_EXCEEDED, LOT_INELIGIBLE, ALREADY_STOPPED(주문 전체가 이미 중지됨).
          retryable 은 같은 MFC 재시도 대상(INVENTORY_MISMATCH·OPERATION_RESTRICTED, D6-5)인지다.
        - 이미 부분 중지(order_work_stop)된 주문은 남은 수량만 작업으로 만든다.
        - 예약 주문 PICK 준비 시각 = arrivalWindow.start − 센터 운영 설정 N분. 설정이 없는 센터는 작업은 접수하고 PICK 만 WAITING(holdReason CONFIG_REQUIRED).
        WorkAccepted / WorkRejected(토픽 mfc.fulfillment.v1)를 결정과 한 트랜잭션으로 발행한다. 상품준비(PreparationStarted)는 첫 피킹 시작 때(6b).
      operationId: confirmOrder
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmOrderRequest' }
      responses:
        '201':
          description: 결정 (ACCEPTED — fulfillmentId·작업 ID / REJECTED — rejectReason·retryable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderDecision' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503':
          description: DEPENDENCY_UNAVAILABLE (mfc-inventory 예약 조회 불가 — 결정을 기록하지 않았다. 같은 키로 재전송)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    get:
      tags: [work-orders]
      summary: 주문 ID 로 작업 지시 조회 (마지막 작업 버전 기준)
      x-added-in: '2026-11-07'
      operationId: findWorkOrderByOrder
      parameters:
        - { name: orderId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/work-orders/{fulfillmentId}:
    get:
      tags: [work-orders]
      summary: 작업 요청 조회 (Task·Shipment·Package 상태 요약)
      operationId: getWorkOrder
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/work-orders/{fulfillmentId}/stop-requests:
    post:
      tags: [work-orders]
      summary: '[orchestration→fulfillment] StopWork — 취소 접수에 따른 작업 중지, 포장별 판정 회신'
      description: |
        포장별로 STOPPED / HANDOVER_IN_PROGRESS / HANDED_OVER 를 판정한다(S3-a).
        HANDOVER_IN_PROGRESS 포장은 fence 결과를 기다려 GET …/stop-requests/{stopRequestId} 로 재조회한다.
        취소 접수시각은 우선순위 근거가 아니다. 같은 stopRequestId 재전송은 기존 판정을 반환한다.
      operationId: stopWork
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stopRequestId, orderId, scope]
              properties:
                stopRequestId: { type: string, description: claim-service 발급 }
                orderId: { type: string }
                scope: { type: string, enum: [FULL, PARTIAL] }
                lines:
                  type: array
                  description: PARTIAL 시 대상 행
                  items:
                    type: object
                    required: [orderLineId, qty]
                    properties:
                      orderLineId: { type: string }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 포장별 판정 (즉시 확정 가능 분)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopRequestResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/work-orders/{fulfillmentId}/stop-requests/{stopRequestId}:
    get:
      tags: [work-orders]
      summary: 중지 요청 판정 재조회 (fence 대기 중·응답 불명 해소)
      operationId: getStopRequest
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string } }
        - { name: stopRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopRequestResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/work-orders/{fulfillmentId}/shortage-resolutions:
    post:
      tags: [work-orders]
      summary: '[orchestration→fulfillment] 결품 해결 — 품절 상품만 취소된 수량을 작업에서 뺀다 (IV-09 2부)'
      description: |
        2026-11-07(ADR-0045). 고객 선택 CANCEL_OOS_ONLY 로 결품 수량을 취소할 때. 그 주문 줄의 PICK·PACK 작업 행에서 qty 만큼 취소(cancelledQty)하고,
        결품으로 BLOCKED 였던 PICK 작업을 다시 진행 상태로(시작한 작업자가 있으면 IN_PROGRESS, 없으면 담당 따라 READY/ASSIGNED). 남은 집품이 0 이면
        PICK COMPLETED, 포장 작업 준비. PICK 남은 양보다 많으면 409 INVALID_STATE. 같은 Idempotency-Key·같은 본문은 재생.
        (0.30.0, ADR-0079) 관리자 부분 종료로 막힌 PICK(`blockKind` PARTIAL_CLOSE)은 잔량이 남아 있는 동안 BLOCKED 그대로, 잔량이 0 이 되면 **CLOSED_PARTIAL**(완료가 아니라 부분 종료)·포장 준비.
        관리자 작업 중지(`blockKind` SUPERVISOR)로 막힌 PICK 은 취소량만 더하고 막힘은 그대로(관리자가 푼다).
      operationId: resolveShortage
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderLineId, qty, resolution]
              properties:
                orderLineId: { type: string }
                qty: { type: integer, minimum: 1 }
                resolution: { type: string, enum: [CANCEL_ITEM] }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/work-orders/{fulfillmentId}/reschedules:
    post:
      tags: [work-orders]
      summary: "[orchestration S4→fulfillment] 예약 시간 변경 — 작업 지시의 도착 시간대·PICK 준비 시각 바꾸기 (0.6.0)"
      x-added-in: '2026-11-16'
      description: |
        S4 예약 시간 변경(OMS §4 — "준비 시작과 시간 변경을 같은 주문에 대해 순서 판정, 먼저 확정된 결과만 유효"). 작업 지시 행을 잠근 뒤
        **실제 준비 시작(PICK 시작 — preparation_started_at)이 아직 없을 때만** 도착 시간대를 바꾸고 PICK 준비 시각을 다시 계산한다(새 시작 − 센터 N분;
        미래면 WAITING — 이미 READY·배정된 PICK 도 시작 전이면 WAITING 으로 돌아가고 담당은 그대로, 지났으면 READY 그대로). 작업 배정만으로는 준비 시작이 아니다.
        준비가 먼저 시작됐으면 409 PREPARATION_STARTED(바꾸지 않음), 예약배달이 아니면 422 NOT_SCHEDULED, 거절·중지된 작업은 409 INVALID_STATE.
        같은 시간대면 그대로 성공. 같은 Idempotency-Key 재전송은 같은 결과. 재고·출고 단위·포장은 바꾸지 않는다(새 피킹 없음).
      operationId: rescheduleWorkOrder
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, arrivalWindow]
              properties:
                orderId: { type: string }
                sagaId: { type: string }
                arrivalWindow:
                  type: object
                  required: [start, end]
                  properties:
                    start: { type: string, format: date-time }
                    end: { type: string, format: date-time }
      responses:
        '200':
          description: APPLIED (resultId = fulfillmentId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: PREPARATION_STARTED / INVALID_STATE / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: NOT_SCHEDULED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/stop-requests:
    post:
      tags: [work-orders]
      summary: '[orchestration→fulfillment] StopWork (주문 단위) — 작업 지시 ID 를 모르는 취소(S3-a)'
      description: |
        orchestration 이 주문 ID 로 중지를 요청한다(작업 지시가 아직 없거나 fulfillmentId 를 모를 때). 판정은 …/work-orders/{fulfillmentId}/stop-requests 와 같다.
        작업 지시가 없는 주문은 요청 수량 전부 STOPPED(notStartedLines)로 확정하고 **중지 기록을 남긴다** — 이후 같은 주문의 작업 요청(ConfirmOrder)은
        중지된 수량을 빼고 받는다(슬라이스 6). 같은 stopRequestId 재전송은 기존 판정을 반환한다(다른 본문이면 409 IDEMPOTENCY_CONFLICT).
        판정 결과는 WorkStopResult(토픽 mfc.fulfillment.v1)로도 발행한다.
      operationId: stopOrderWork
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stopRequestId, orderId, scope, lines]
              properties:
                stopRequestId: { type: string, description: claim-service 발급 }
                orderId: { type: string }
                claimId: { type: string }
                scope: { type: string, enum: [FULL, PARTIAL] }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [orderLineId, qty]
                    properties:
                      orderLineId: { type: string }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 판정 (state RESOLVED 면 확정, PENDING 이면 GET 으로 재조회)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopRequestResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/stop-requests/{stopRequestId}/retries:
    post:
      tags: [work-orders]
      summary: '[운영자·내부] 실패로 멈춘 집품 뒤 중지 다시 시도 (0.3.1)'
      description: |
        2026-11-08(ADR-0046). 집품 뒤 중지가 실패로 멈추면(재고가 취소 복귀를 거절 — RETURN_MISMATCH·위치 잔량 부족 등, 또는 이 서비스의 집품·포장 기록
        불일치 RECORD_MISMATCH) 판정은 PENDING + lastError 로 남고 자동 재시도에서 빠진다(같은 본문은 같은 거절). 원인(재고 보정 등)을 고친 뒤 이 요청으로
        사유를 지우고 다시 끝까지 진행한다. 다시 실패하면 새 lastError. PENDING 이 아니면 지금 판정을 그대로 돌려준다(여러 번 불러도 안전).
        결과 모름·미전달은 실패가 아니라 자동 재시도 대상이다. 운영자 화면은 백오피스 처리 대기(BO-12) — 목록 `GET /stop-requests?failed=true`(0.9.0).
        (0.9.0) 본문 `{operatorId, reason}`(선택)을 주면 실제로 다시 시도했을 때(PENDING + 실패 사유였을 때) 재시도 기록으로 남긴다. 본문 없이 부르던 호출자는 그대로.
      operationId: retryOrderStopRequest
      parameters:
        - { name: stopRequestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualRetryBody' }
      responses:
        '200':
          description: 재시도 뒤 판정 (RESOLVED, 또는 PENDING — lastError 가 있으면 다시 실패)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopRequestResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/stop-requests/{stopRequestId}:
    get:
      tags: [work-orders]
      summary: 주문 단위 중지 요청 판정 재조회
      operationId: getOrderStopRequest
      parameters:
        - { name: stopRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopRequestResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /tasks:
    get:
      tags: [tasks]
      summary: 점원 단말 작업 목록 (내 작업·유형·상태 필터)
      description: |
        pmart-clients BR-05. MFC-business-logic §2-2 Task, WK-01~05, 단말 표시 항목(:1183).
        assignee=me 는 인증된 작업자 주체로 해석한다(작업자 로그인 방식은 BR-02 결정 대기).
        목록의 담당자는 mfc-capacity 배정 정본(AssignmentPublished)의 fulfillment 투영이며, 응답 asOf 가 투영 기준시각이다.
        투영은 늦을 수 있으므로 시작 가능 여부는 POST …/starts 판정만 믿는다.
        정렬은 생성시각 오름차순의 표시 정렬이며 실행 우선순위가 아니다(우선순위는 Q-08 결정 대기, :866).
      x-added-in: '2026-10-24'
      operationId: listTasks
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: assignee
