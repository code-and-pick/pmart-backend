            blockKind:
              type: [string, 'null']
              enum: [SUPERVISOR, PARTIAL_CLOSE, null]
              description: '(0.28.0, R-29) BLOCKED 를 누가 걸었나 — SUPERVISOR = 센터 관리자 작업 중지(해제는 관리자). PARTIAL_CLOSE(0.30.0) = 관리자 부분 종료 처리 중(결품 사가가 잔량을 취소하면 CLOSED_PARTIAL). null = 결품·예약 보류(결품 처리가 푼다) 또는 BLOCKED 아님'
              x-added-in: '2026-11-20'
            packingLocations:
              type: array
              description: PACK — 이 출고의 집품분이 놓인 위치(PICK 실적의 도착지 — 장바구니 또는 포장 위치, 0.2.0)
              items: { type: string }
            routeMethod:
              type: [string, 'null']
              enum: [ROUTING, NEAREST_FALLBACK, CODE_ORDER, null]
              description: '(0.4.10, PICK 만) 방문 순서를 정한 방법 — ROUTING(mfc-capacity OR-Tools), NEAREST_FALLBACK(가까운 칸부터), CODE_ORDER(순서를 못 받아 칸 코드 순). 피킹 시작 때 정한다'
            asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    TaskControl:
      type: object
      description: '(0.28.0, R-29) 센터 관리자 작업 조작 한 건 — 작업 중지(BLOCK)·해제(UNBLOCK, 0.29.0)·부분 종료(PARTIAL_CLOSE, 0.30.0)'
      required: [controlId, taskId, action, fromState, toState, taskVersion, reason, actorId, at]
      properties:
        controlId: { type: string }
        taskId: { type: string }
        action: { type: string, description: 'BLOCK · UNBLOCK · PARTIAL_CLOSE(0.30.0) — 뒤 버전에서 더할 수 있다(모르는 값은 그대로 표시)' }
        fromState: { $ref: '#/components/schemas/TaskState' }
        toState: { $ref: '#/components/schemas/TaskState' }
        taskVersion: { type: integer, description: 조작 뒤 작업 버전 }
        reason: { type: string }
        actorId: { type: string, description: 조작한 운영자 ID(직원 화면용 식별자) }
        workerId: { type: [string, 'null'], description: 조작 뒤 담당(없으면 null) }
        at: { type: string, format: date-time }
    TaskStart:
      type: object
