        pmart-clients BR-05. 행 정의는 MFC-business-logic §2-2 TaskLine(계획 = 확정완료 + 승인취소 + 잔량).
        수량은 이 서비스의 작업 실적 기준이며 재고 수량 정본은 mfc-inventory 이다. 완료 표시는 서버 확정(실행 결과 APPLIED) 후에만 한다.
        재고 확정 대기는 업무 진행 상태와 별도 필드다(:808) — 행의 pendingQty, 상세의 pendingExecutions.
      x-added-in: '2026-10-24'
