  /tasks/{taskId}/executions:
    get:
      tags: [tasks]
      summary: 작업 실적 목록 — 최근 순 (0.24.0, 시뮬레이터 R-17)
      description: |
        그 작업에 등록된 실적(PICK·RETURN) 전부, **최근 순**(recordedAt 내림차순). 상태 무관(RECORDED·INVENTORY_PENDING·APPLIED·REJECTED·UNKNOWN_RESULT) —
        REJECTED 도 작업자가 그 칸에서 버튼을 누른 기록이다. 실제 작업자 위치(SIM-2a "마지막 버튼 기준")는 첫 항목의 fromLocation·toLocation.
        PACK 은 실적 대신 포장 밀봉(`POST /shipments/{id}/packages`)이라 여기 없다 — 포장의 packingLocation·stagingLocation 을 본다.
        권한은 작업 상세와 같다(그 센터 운영자, OPERATOR_ADMIN·서비스는 모든 센터). 최대 size 건(기본 50, ≤ 200).
      x-added-in: '2026-11-20'
      operationId: listTaskExecutions
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskExecutionList' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    post:
      tags: [tasks]
      summary: 점원 피킹/패킹 실행 결과 등록 (결품·파손·차단 보고 포함)
      description: |
        수량 반영은 mfc-inventory.CommitTaskExecution 으로 요청하고 commitId를 받는다. 자체 사본으로 성공 판단 금지.
        PICK(2026-11-17 PDA 요청): 집은 양이 있으면 fromLocation(찍은 집품 칸)·toLocation(찍은 장바구니 — 구역 CART, 예전 흐름은 포장 위치 PACKING)
        필수 — 없으면 400 TO_LOCATION_REQUIRED. 구역이 아니면 재고가 거절(실행 REJECTED, 사유 LOCATION_ZONE_MISMATCH). **한 출고 = 한 장바구니**:
        같은 출고의 반영됐거나 결과를 기다리는 PICK 실적과 다른 toLocation 이면 409 CART_MISMATCH. 결품 보고만(집은 양 0)이면 toLocation 은 필요 없다.
        shortage 가 있으면 LineShortageReported 발행(Task → BLOCKED 또는 CLOSED_PARTIAL). reason DAMAGED·SPOILED(0.22.0) 는 quality 가 품질 사고로 연다.
        RETURN(0.25.0): 냉장·냉동 상품 줄은 늘 QUARANTINED 로 복귀(R19-8). 복귀 예외 보고(shortage, 0.26.0 R19-7): DAMAGED·SPOILED 는 toLocation 선반으로 격리 MOVE, SHORT·BLOCKED 는 재고 호출 없이 처리한 양으로 센다(남은 재고는 관리자 재고 정정) — 둘 다 남은 복귀량이 줄고 LineShortageReported 는 없다.
      operationId: recordTaskExecution
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskExecutionRequest' }
      responses:
        '202':
          description: 접수 (resultId = executionId, nextAction QUERY_RESULT 가능)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE (Task가 ASSIGNED/IN_PROGRESS 아님) / TASK_BLOCKED (0.28.0 — 작업이 BLOCKED) / NOT_ASSIGNEE (활성 담당자 불일치) / VERSION_CONFLICT / CART_MISMATCH (이 출고가 쓰는 장바구니와 다름)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

