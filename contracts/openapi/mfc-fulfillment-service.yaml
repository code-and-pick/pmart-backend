        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /tasks/{taskId}/blocks:
    post:
      tags: [tasks]
      summary: 관리자 작업 중지 — READY·ASSIGNED·IN_PROGRESS → BLOCKED (0.28.0, ADR-0079)
      description: |
        MFC 시뮬레이터 R-29 2단계(사용자 결정 2026-11-20). 현장이 멈췄을 때(설비 고장·오주문 확인 등) 센터 관리자가 작업을 멈춘다(WK-04 해결 대기 BLOCKED).
        - 누가: 그 센터 `MFC_SUPERVISOR` 또는 `OPERATOR_ADMIN`(모든 센터). 작업자는 이 경로를 쓰지 않는다 — PDA 문제 보고(결품)만.
        - 언제: READY·ASSIGNED·IN_PROGRESS(업무 §6 상태표). 그 밖 409 INVALID_STATE. 결과를 기다리는 실적(RECORDED·UNKNOWN_RESULT)·열린 포장이 있으면 409 EXECUTION_IN_FLIGHT(retryable — 결과가 난 뒤).
        - 바뀌는 것: 작업 상태 BLOCKED(`blockKind` SUPERVISOR, `blockReason` = `관리자 작업 중지: <사유>`), 버전 +1, TaskProgressed(state BLOCKED, blockKind·reason·controlledBy).
        - 그대로인 것: 담당(capacity 배정)·시작 점유·완료량·장바구니에 집은 물건·재고 수량·예약·배차 요청(WK-04 "고장만으로 예약 해제 안 됨", IV-07/08/09 그대로).
        - 막힌 동안 작업자의 시작·실적·포장 밀봉은 409 TASK_BLOCKED. 해제는 `POST /tasks/{taskId}/unblocks`(0.29.0).
        같은 Idempotency-Key·같은 본문은 같은 결과(200), 다른 본문이면 409 IDEMPOTENCY_CONFLICT.
      operationId: blockTask
      x-pmart-user-types: [OPERATOR]
      x-added-in: '2026-11-20'
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200, description: 멈춘 이유(필수 — 기록·화면 표시) }
      responses:
        '200':
          description: 멈춤(BLOCKED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskControl' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE / VERSION_CONFLICT / EXECUTION_IN_FLIGHT / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /tasks/{taskId}/unblocks:
    post:
      tags: [tasks]
      summary: 관리자 막힘 해제 — BLOCKED → ASSIGNED(담당 살아 있으면) 또는 READY (0.29.0, ADR-0079)
      description: |
        MFC 시뮬레이터 R-29 2단계(사용자 결정 2026-11-20). 관리자 작업 중지(`blockKind` SUPERVISOR)를 푼다.
        - 누가: 작업 중지와 같다(그 센터 `MFC_SUPERVISOR` 또는 `OPERATOR_ADMIN`).
        - 본문: 사유 + **실물 확인 완료 `cartChecked: true` 필수**(장바구니·집은 물건을 사람이 확인했다는 기록, WK-05 "미확정 실물 확인") — 빠지면 400(필수 칸), false 면 422 PHYSICAL_CHECK_REQUIRED.
        - 결품으로 막힌 작업(blockKind null)은 409 BLOCKED_BY_SHORTAGE(결품 처리가 푼다), BLOCKED 아니면 409 INVALID_STATE.
        - 판정: mfc-capacity 활성 배정(`GET /assignments?taskId=`)이 있고 그 작업자가 지금 맡을 수 있으면(`workerEligibility` 없음 — 정지·퇴사·업무 변경 아님) **ASSIGNED**(그 담당, 시작 점유는 지운다 — 이어서 하려면 다시 시작, WK-05 "재개 시작은 WK-03").
          아니면 capacity 배정을 풀고(`/internal/assignments/{taskId}/releases`) **READY**(담당 없음 — 누구나 다음 작업으로 받는다). 근무표(근무 밖)는 보지 않는다(capacity 와 같이 경고만).
        - 완료량·장바구니 물건·재고·예약은 그대로. 버전 +1, TaskProgressed(controlledBy·reason).
        - capacity 조회·해제가 안 되면 503(작업은 그대로 BLOCKED — 같은 키로 다시).
      operationId: unblockTask
      x-pmart-user-types: [OPERATOR]
      x-added-in: '2026-11-20'
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, cartChecked]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
                cartChecked: { type: boolean, description: '장바구니·집은 물건·작업 위치를 실물로 확인했다(true 만 받는다)' }
      responses:
        '200':
          description: 해제됨(ASSIGNED 또는 READY — toState)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskControl' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE / BLOCKED_BY_SHORTAGE / VERSION_CONFLICT / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: PHYSICAL_CHECK_REQUIRED (cartChecked 가 true 아님)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /tasks/{taskId}/partial-closes:
    post:
      tags: [tasks]
      summary: 관리자 부분 종료 — PICK 의 아직 집지 않은 잔량만 취소, 집은 양은 포장으로 (0.30.0, ADR-0079)
      description: |
        MFC 시뮬레이터 R-29 2단계(사용자 결정 2026-11-20). WK-04 "취소 가능한 잔량만 cancelled_qty, 실행>0/잔량취소 후 CLOSED_PARTIAL".
        - 누가: 작업 중지와 같다(그 센터 `MFC_SUPERVISOR` 또는 `OPERATOR_ADMIN`). 사유 필수. **PICK 만**(그 밖 422 UNSUPPORTED_TASK_TYPE — 집은 물건 취소는 주문 취소·복귀).
        - 언제: READY·ASSIGNED·IN_PROGRESS 또는 관리자 중지로 BLOCKED. 결품으로 막힘 409 BLOCKED_BY_SHORTAGE, 이미 부분 종료 처리 중 409 PARTIAL_CLOSE_PENDING,
          결과 대기 실적 409 EXECUTION_IN_FLIGHT, 잔량 없음 409 INVALID_STATE. **집은 양이 0 이면 422 NOTHING_EXECUTED** — 주문 취소(claim 관리자 판단 취소 `OPERATOR_DECISION`)를 쓴다.
        - 하는 일: 작업 BLOCKED(`blockKind` PARTIAL_CLOSE, 시작 점유 그대로) + 잔량이 있는 줄마다 `LineShortageReported`(reason `PARTIAL_CLOSE`, shortQty = 잔량, lot 없음) —
          **결품과 같은 사가**(order-orchestration)가 그 품목만 부분 취소·환불한다: `shortage-resolutions`(작업 잔량 취소) → mfc-inventory `shortfall-releases`(사유 PARTIAL_CLOSE_CANCELLED —
          집지 않은 확정 예약 해제, R−q·A+q) → 주문 수량 변경(SHORTAGE) → 부분 환불. 모든 줄의 잔량이 취소되면 PICK **CLOSED_PARTIAL**, 같은 출고 PACK 준비(집은 양만 포장).
        - 응답 = 조작 기록(toState BLOCKED). 이 경로는 재고·환불을 직접 부르지 않는다(사가 결과는 작업 상태·TaskProgressed 로 본다).
      operationId: partialCloseTask
      x-pmart-user-types: [OPERATOR]
      x-added-in: '2026-11-20'
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: 부분 종료 접수(BLOCKED — 결품 사가가 잔량을 취소하면 CLOSED_PARTIAL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskControl' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE / BLOCKED_BY_SHORTAGE / PARTIAL_CLOSE_PENDING / EXECUTION_IN_FLIGHT / VERSION_CONFLICT / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: NOTHING_EXECUTED (집은 양 0 — 주문 취소로) / UNSUPPORTED_TASK_TYPE (PICK 아님)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

