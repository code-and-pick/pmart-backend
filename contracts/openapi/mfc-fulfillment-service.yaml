        taskVersion: { type: integer }
        decidedAt: { type: string, format: date-time }
    ShipmentState:
      type: string
      enum: [PREPARING, READY, PARTIALLY_HANDED_OVER, HANDED_OVER, CANCELLED, CLOSED_PARTIAL]
    PackageState:
