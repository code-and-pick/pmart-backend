            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /tasks/{taskId}/releases:
    post:
      tags: [tasks]
      summary: 작업 내놓기 — 교대·퇴근 때 담당을 풀고 READY 로 (0.4.8)
      description: |
        2026-11-08 사용자 결정(Q-09): 작업자가 "작업 내놓기"를 하면 잔량을 확인한 뒤 대기로 되돌린다 — 진행 중 실적(RECORDED·결과 모름)·열린 포장이 있으면
        409 EXECUTION_IN_FLIGHT(끝난 뒤). 담당 본인 또는 그 센터 관리자. ASSIGNED·IN_PROGRESS 만(아니면 409 INVALID_STATE). mfc-capacity 배정을 먼저 풀고
        (`/internal/assignments/{taskId}/releases`, 실패면 503 — 바꾸지 않음) 작업을 READY 로(담당·시작 지움, 완료량은 그대로 — 다음 사람이 남은 양을 이어서).
      operationId: releaseTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId: { type: string, description: 지금 담당 }
                reason: { type: string, maxLength: 200 }
