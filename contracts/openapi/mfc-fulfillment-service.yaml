    ConfirmOrderRequest:
      type: object
      required: [orderId, mfcId, reservationId, shipments]
      properties:
        orderId: { type: string }
        orderVersion: { type: integer }
        workVersion: { type: integer, minimum: 1, default: 1, description: '작업 버전(2026-11-07 추가). 첫 요청 1, 같은 MFC 재시도마다 1씩 증가' }
        sagaId: { type: string, description: '요청한 orchestration 사가(2026-11-07 추가, 추적용)' }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        reservationId: { type: string }
        capacityHoldId: { type: string }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        outOfStockPreference: { type: string, description: '고객 사전 선택(결품 처리, 2026-11-07 추가) — OrderConfirmed 사본' }
        arrivalWindow:
          type: object
          description: '도착 희망 시간대(2026-11-07 추가, OrderConfirmed 사본). 예약 주문 PICK 준비 시각의 기준(start − N분)'
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        promisedReadyAt: { type: string, format: date-time, description: 예약배달은 슬롯 기준 준비 완료 목표 }
        kind: { type: string, enum: [ORIGINAL, RESHIPMENT], default: ORIGINAL, description: '0.5.0 — RESHIPMENT = 오배송 재발송(같은 주문의 두 번째 작업 지시, reshipmentRef 필수)', x-added-in: '2026-11-16' }
        reshipmentRef: { type: string, maxLength: 64, description: '0.5.0 — RESHIPMENT 의 근거(오배송 확인 사건 caseId). 같은 값은 작업 지시 하나', x-added-in: '2026-11-16' }
        shipments:
          type: array
          minItems: 1
          description: '출고 단위. 6a 는 주문당 1개(D6-2)'
          items:
            type: object
            required: [shipmentId, lines]
            properties:
              shipmentId: { type: string, description: order-service 이행 계획의 shipmentId }
              deliveryId: { type: string }
              weightG: { type: integer }
              lines:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/ConfirmOrderLine' }
    ConfirmOrderLine:
      type: object
      description: '출고 행(2026-11-07 — PackageContentLine 에 단말 표시용 사본을 더함)'
      required: [orderLineId, sku, qty]
      properties:
        orderLineId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
        lotId: { type: string }
        productName: { type: string, description: '주문 당시 상품명 사본(PDA 표시)' }
        unitsPerSku: { type: integer, minimum: 1 }
        weightG: { type: integer, minimum: 0, description: 행 전체 중량 }
    WorkRejectReason:
      type: string
      description: |
        작업 거절 사유(2026-11-07). retryable(같은 MFC 재시도 대상, D6-5) = INVENTORY_MISMATCH·OPERATION_RESTRICTED.
        CAPACITY_EXCEEDED·LOT_INELIGIBLE·ALREADY_STOPPED 는 재시도하지 않는다.
      enum: [INVENTORY_MISMATCH, OPERATION_RESTRICTED, CAPACITY_EXCEEDED, LOT_INELIGIBLE, ALREADY_STOPPED]
    WorkOrderDecision:
      type: object
      description: 'ConfirmOrder 결정(2026-11-07)'
      required: [orderId, workVersion, decision, decidedAt]
      properties:
        fulfillmentId: { type: string }
        orderId: { type: string }
        workVersion: { type: integer }
        decision: { type: string, enum: [ACCEPTED, REJECTED] }
        rejectReason: { $ref: '#/components/schemas/WorkRejectReason' }
        retryable: { type: boolean, description: 'REJECTED 일 때 같은 MFC 재시도 대상인지' }
        message: { type: string }
        shipmentIds: { type: array, items: { type: string } }
        taskIds: { type: array, items: { type: string } }
        decidedAt: { type: string, format: date-time }
    WorkOrder:
      type: object
      properties:
        fulfillmentId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
        version: { type: integer }
        workVersion: { type: integer, description: '마지막 작업 버전(2026-11-07 추가)' }
        acceptance: { type: string, enum: [ACCEPTED, REJECTED] }
        rejectReason: { $ref: '#/components/schemas/WorkRejectReason' }
        preparationStartedAt: { type: [string, 'null'], format: date-time }
        tasks:
          type: array
          items:
            type: object
            properties:
              taskId: { type: string }
              taskType: { type: string, enum: [PICK, PACK, DISPATCH] }
              state: { $ref: '#/components/schemas/TaskState' }
              shipmentId: { type: string }
              readyAt: { type: [string, 'null'], format: date-time, description: 'PICK 준비 시각(2026-11-07 추가). 예약 주문은 슬롯 시작 − N분' }
              holdReason: { type: [string, 'null'], description: 'WAITING 사유(2026-11-07 추가). CONFIG_REQUIRED = 센터 준비 시각 설정 없음' }
              assigneeId: { type: string }
              assignmentVersion: { type: integer }
              plannedQty: { type: integer }
              completedQty: { type: integer }
              cancelledQty: { type: integer }
              remainingQty: { type: integer, description: 계획 = 완료 + 취소 + 잔량 }
        shipments: { type: array, items: { $ref: '#/components/schemas/Shipment' } }
    StopRequestResult:
      type: object
      properties:
        stopRequestId: { type: string }
        fulfillmentId: { type: string }
        orderId: { type: string }
        state: { type: string, enum: [PENDING, RESOLVED, UNKNOWN] }
        notStartedLines:
          type: array
          description: 작업 지시가 생기기 전에 중지된 수량(포장 없음 — 전부 STOPPED)
          items:
            type: object
            properties:
              orderLineId: { type: string }
              qty: { type: integer }
        packages:
          type: array
          items:
            type: object
            properties:
              packageId: { type: string }
              shipmentId: { type: string }
              verdict: { type: string, enum: [STOPPED, HANDOVER_IN_PROGRESS, HANDED_OVER] }
              fenceVersion: { type: integer }
              fenceExpiresAt: { type: [string, 'null'], format: date-time }
              inventoryCommitId: { type: [string, 'null'], description: HANDED_OVER 시 재고 commitId }
              stoppedLines:
                type: array
                items:
                  type: object
                  properties:
                    orderLineId: { type: string }
                    qty: { type: integer }
                    workStateAtStop: { type: string, enum: [NOT_PICKED, PICKED, PACKED] }
        resolvedAt: { type: string, format: date-time }
        lastError:
          type: [string, 'null']
          description: '0.3.1 — 집품 뒤 중지가 실패로 멈춘 사유(코드: 상세). 있으면 자동 재시도 안 함 — POST …/retries'
    TaskExecutionRequest:
      type: object
      required: [executionType, workerId, lines]
      properties:
        executionType: { type: string, enum: [PICK, PACK, RETURN], description: '0.2.0: PICK 만. PACK 실적은 포장 밀봉(POST /shipments/{id}/packages)으로 — PACK 은 422. RETURN(0.3.0) = 복귀 작업 실적(lines[].pickedQty = 옮긴 양, lotId 필수)' }
        workerId: { type: string }
        assignmentVersion: { type: integer }
        fromLocation: { type: string, description: 'PICK — 집은 선반 위치(한 실행 = 한 선반). RETURN — 복귀 대상이 놓인 위치(picks[].locations — 장바구니·패킹대)' }
        toLocation: { type: string, description: 'PICK — 담은 장바구니(구역 CART) 또는 포장 위치(PACKING). 집은 양이 있으면 필수(400 TO_LOCATION_REQUIRED), 한 출고 = 한 장바구니(409 CART_MISMATCH). RETURN — 되돌린 선반(온도대 = SKU 보관 유형)' }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [orderLineId, sku, pickedQty]
            properties:
              orderLineId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              pickedQty: { type: integer, minimum: 0 }
              resultQuality:
                type: string
                enum: [NORMAL, QUARANTINED]
                description: |
                  RETURN 만 — 복귀 중 이상품이면 QUARANTINED(격리로 선반에), 기본 NORMAL(판매 가능).
                  (0.25.0, R19-8 사용자 결정 2026-11-20 "항상 품질 검사") 상품 보관 온도대가 CHILLED·FROZEN 이면 보낸 값과 상관없이 **QUARANTINED** 로 기록·반영한다
                  (선반에 격리 — mfc-quality 해제 판정 뒤에만 판매, 폐기도 거기서). 온도대를 알려고 mfc-inventory SKU 사본을 읽는다 — 조회가 안 되면 503(기록 없음, 같은 키로 다시).
              shortage:
                type: object
                description: |
                  결품·파손·변질·차단 보고 (pickedQty < 계획량일 때).
                  RETURN(0.25.0, R19-7): 복귀 예외 보고 — 일반 복귀와 섞지 않은 한 줄(pickedQty 0 + shortage, lotId·fromLocation 필수)만 따로. qty ≤ 그 줄·LOT·위치의 남은 복귀량(아니면 409 QTY_EXCEEDS_REMAINING).
                  사유 SHORT 출발 칸에 없음·모자람 / DAMAGED 파손 / SPOILED 변질 / BLOCKED 도착 칸을 못 씀(가득·막힘·접근 불가).
                  (0.26.0, 사용자 결정 2026-11-20) **DAMAGED·SPOILED**: toLocation(격리로 둘 선반) 필수(없으면 400 TO_LOCATION_REQUIRED) — 일반 복귀와 같은 재고 MOVE 를
                  resultQuality QUARANTINED 로(재고 거절이면 실적 REJECTED, 다른 키로 다시). 반영되면 appliedQty = qty, 남은 복귀량이 준다. 해제·폐기는 mfc-quality.
                  **SHORT·BLOCKED**: 재고 호출 없이 실적 APPLIED(appliedQty = qty) — 그 양을 처리한 것으로 세어(작업 줄 취소량) 남은 복귀량이 준다. 위치에 남은 재고(CANCEL_RETURN_PENDING)는
                  관리자가 재고 정정(승인)으로 맞춘다 — `GET /shortages` 에 taskType RETURN 으로 보인다. 둘 다 다 처리되면 작업 COMPLETED, LineShortageReported 없음.
                properties:
                  qty: { type: integer, minimum: 1 }
                  reason: { type: string, enum: [SHORT, DAMAGED, SPOILED, BLOCKED], description: 'SHORT 못 찾음·DAMAGED 파손·SPOILED(0.22.0) 변질(상함·부패 등)·BLOCKED 보류' }
                  note: { type: string, maxLength: 200 }
                  evidenceRef: { type: string }
        durationSec: { type: integer, description: 패킹 소요시간 }
    TaskExecution:
      type: object
      properties:
        executionId: { type: string }
        taskId: { type: string }
        executionType: { type: string, enum: [PICK, RETURN], description: '(0.24.0, R-17) 실적 유형', x-added-in: '2026-11-20' }
        workerId: { type: string, description: '(0.24.0, R-17) 실적을 등록한 작업자', x-added-in: '2026-11-20' }
        fromLocation: { type: [string, 'null'], description: '(0.24.0, R-17) 등록 본문 그대로 — PICK 집은 선반, RETURN 복귀 대상이 놓인 위치. 결품 보고만이면 null 일 수 있다', x-added-in: '2026-11-20' }
        toLocation: { type: [string, 'null'], description: '(0.24.0, R-17) PICK 담은 장바구니(또는 포장 위치), RETURN 되돌린 선반. 결품 보고만이면 null', x-added-in: '2026-11-20' }
        lines:
          type: array
          description: '(0.24.0, R-17) 등록 본문의 줄 — 결품은 shortages 로 따로'
          x-added-in: '2026-11-20'
          items: { $ref: '#/components/schemas/TaskExecutionLine' }
        state: { type: string, enum: [RECORDED, INVENTORY_PENDING, APPLIED, REJECTED, UNKNOWN_RESULT] }
        inventoryCommitId: { type: [string, 'null'] }
        appliedQty: { type: integer }
        rejectCode:
          type: [string, 'null']
          description: |
            (0.16.0, mfc-app E1·E3) REJECTED 일 때 재고(mfc-inventory) 거절 코드 그대로, 아니면 null. 알려진 코드(재고 PICK·PACK·RETURN 반영):
            `LOT_MISMATCH`(예약에 없는 LOT — 지시 LOT 을 집을 것) · `PICK_QTY_EXCEEDED`(예약 남은 양 초과) · `INSUFFICIENT_STOCK`(그 칸에 그 LOT·상태 수량 부족) ·
            `LOCATION_ZONE_MISMATCH`(도착지가 장바구니·포장 위치 아님 등) · `LOCATION_CLOSED`(실사 잠금 등 닫힌 칸) · `LOCATION_NOT_REGISTERED`(모르는 칸) ·
            `LOCATION_ALLOCATED_TO_OTHER`(다른 주문 몫으로 배정된 칸) · `SKU_ALREADY_SHELVED`·`TEMPERATURE_ZONE_MISMATCH`(복귀 칸 규칙) · `INVALID_STATE`(업무 상태 전이 불가) ·
            `VERSION_CONFLICT` · `CONFIG_REQUIRED`. 모르는 코드는 그대로 보이면 된다(코드가 없는 옛 기록은 REJECTED).
