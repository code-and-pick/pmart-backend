  /shortages:
    get:
      tags: [metrics]
      summary: 센터 결품 보고 목록 (0.21.0, MFC 백오피스 OE-1)
      description: |
        결품 보고(`LineShortageReported`)마다 한 줄 — **재확보하지 못한 결품만**(같은 SKU 적격 LOT 으로 재확보된 결품은 결품이 아니라 남지 않는다).
        (0.26.0) 복귀(RETURN) 작업의 예외 보고도 한 줄(`taskType` RETURN — 사건 없이, 취소된 주문의 복귀분): DAMAGED·SPOILED 는 격리로 옮겨졌고(품질 처리), SHORT·BLOCKED 는
        `locationCode`(복귀 대상이 놓인 포장·장바구니 위치)에 남은 재고를 관리자가 재고 정정으로 맞출 대상.
        PICK 결품:
        사유 SHORT 부족·DAMAGED 파손·SPOILED 변질(0.22.0)·BLOCKED 예약 보류분(피킹 시작 때). 결품 뒤 처리(대체·부분 환불)는 order-orchestration 결품 사가 몫이라
        여기에는 처리 상태가 없다 — `taskState` 는 그 작업의 지금 상태(BLOCKED·CLOSED_PARTIAL 등). 최근 순, 커서 = 앞 쪽 마지막 shortageId, size ≤ 200.
        `total` = 같은 조건 전체 건수(쪽과 무관). 2026-11-19 이전 보고는 lotId·locationCode·reportedBy 가 null(상품은 출고 줄에서 채움).
        상품명은 표시용(조회 실패면 null). 그 센터 운영자, OPERATOR_ADMIN·서비스는 모든 센터.
      operationId: listShortages
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: reason
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [SHORT, DAMAGED, SPOILED, BLOCKED, PARTIAL_CLOSE] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: 보고 시각 이상 }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: 보고 시각 미만 }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, asOf]
                properties:
                  total: { type: integer }
                  nextCursor: { type: [string, 'null'] }
                  asOf: { type: string, format: date-time }
                  items:
                    type: array
                    items:
                      type: object
                      required: [shortageId, reason, taskId, orderLineId, qty, reportedAt]
                      properties:
                        shortageId: { type: string }
                        reason: { type: string, enum: [SHORT, DAMAGED, SPOILED, BLOCKED, PARTIAL_CLOSE], description: 'PARTIAL_CLOSE(0.30.0) = 관리자 부분 종료로 끝낸 잔량(재고 결품 아님, 위치·LOT 없음)' }
                        taskId: { type: string }
                        taskType: { type: [string, 'null'] }
                        taskState: { type: [string, 'null'], description: 그 작업의 지금 상태 }
                        shipmentId: { type: [string, 'null'] }
                        orderId: { type: [string, 'null'] }
                        orderNumber: { type: [string, 'null'], description: 화면용 주문번호 8자리 }
                        orderLineId: { type: string }
                        sku: { type: [string, 'null'] }
                        productName: { type: [string, 'null'] }
                        lotId: { type: [string, 'null'] }
                        locationCode: { type: [string, 'null'], description: '피킹한 칸(결품 보고 때). RETURN(0.26.0) 은 복귀 대상이 놓인 위치(fromLocation)' }
                        qty: { type: integer, description: 보고 수량 }
                        reportedBy: { type: [string, 'null'], description: 보고한 작업자(운영자 ID — 화면은 이름 · 사번, capacity staff-names) }
                        reportedAt: { type: string, format: date-time }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /metrics/picking-lines:
    get:
      tags: [metrics]
      summary: 결품률 지표 — 날짜·센터별 피킹 줄·결품 줄 (0.19.0, 요청 F-10)
      description: |
        사용자 결정(2026-11-18): 결품률은 **줄 단위·사유별**(상품마다 단위가 달라 수량을 더하지 않는다). 날짜 = 그 주문의 피킹을 처음 시작한 시각(Asia/Seoul).
        - `pickedLines` = 그날 피킹을 시작한 주문 줄 수(PICK 작업 줄). **원래 주문 작업만** — 오배송 재발송 작업은 넣지 않는다(같은 주문을 두 번 세지 않게).
        - `shortLines` = 그중 결품이 한 번이라도 보고된 줄(사유 상관없이 한 번), `shortLinesByReason` = 사유별 줄 수(한 줄에 사유가 둘이면 둘 다 센다 — 합이 shortLines 보다 클 수 있다).
        - 결품 = LineShortageReported(작업자 결품 SHORT·파손 DAMAGED·예약 보류분 BLOCKED) — **고객 주문에서 실제로 빠진 것**. 작업자가 결품을 보고했어도 같은 SKU 다른 LOT 으로 바로 재확보돼 사건이 없으면 세지 않는다. 이 기능 전(2026-11-19 배포 전) BLOCKED 는 기록이 없어 빠지고, 예전 SHORT·DAMAGED 는 실적에서 옮겼다(재확보분 포함될 수 있음).
        권한: OPERATOR_ADMIN·서비스는 모든 센터(mfcId 선택), 그 밖 운영자는 토큰 센터만(mfcId 를 주면 그 센터 — 권한 없으면 403). 기간 최대 92일. 0건 날짜는 줄 없음. 개인정보 없음.
      operationId: getPickingLineMetrics
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: 포함 }
        - { name: mfcId, in: query, required: false, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK (날짜·센터 순)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [date, mfcId, pickedLines, shortLines, shortLinesByReason]
                      properties:
                        date: { type: string, format: date }
                        mfcId: { type: string }
                        pickedLines: { type: integer }
                        shortLines: { type: integer }
                        shortLinesByReason:
                          type: object
                          required: [SHORT, DAMAGED, BLOCKED]
                          properties:
                            SHORT: { type: integer }
                            DAMAGED: { type: integer }
                            SPOILED: { type: integer, description: '(0.22.0) 변질 — 선택 칸' }
                            BLOCKED: { type: integer }
                  asOf: { type: string, format: date-time }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /shipments:
    get:
      tags: [shipments]
      summary: '[직원] 센터 출고 목록 — 포장 인계 현황(관리자 화면·센터 모니터)용 (0.15.0, F-9)'
      description: |
        업무 원문 Delivery §10.1(포장 인계 현황)·§3.1(출고요청·피킹중·패킹중·출고대기를 주문번호로, MFC 관리자 모니터)·§3.4(포장마다 인계 시각·주체)·§3.7(일부 인계).
        권한(F-3 과 같다): OPERATOR_ADMIN·CS_AGENT·RIDER_OPS 는 모든 센터, 그 밖 운영자는 그 센터 직원(센터 관리자 포함 — 작업자도 막지 않는다, bff 가 고른다).
        `state` 반복 가능, 비우면 끝나지 않은 출고(PREPARING·READY·PARTIALLY_HANDED_OVER). 만든 순(오래된 것부터), 커서 = 마지막 shipmentId.
        항목은 원천 값 그대로 — 단계 이름(출고요청·피킹중·패킹중·출고대기·일부 인계·인계 완료)은 bff 가 정한다. 포장은 살아 있는 것만(재포장 전·재고 거절 포장 제외).
        개인정보·메모·QR 없음. 배송·라이더 도착은 delivery 쪽.
        (0.27.0, R-29 — 지난 주문 조회) `orderNumber`·`createdFrom`/`createdTo`·`sort` 를 더한다. 번호나 날짜를 주고 `state` 를 비우면 **모든 상태**(인계 끝난·취소된 출고 포함 — 지난 주문을 찾는 것이므로).
        날짜는 출고를 만든 시각(작업 접수 시각)의 Asia/Seoul 날짜 — 만든 시각은 바뀌지 않아 커서가 흔들리지 않는다. `sort=recent` 는 만든 순 거꾸로(최근 것부터), 커서는 같은 방식(마지막 shipmentId).
      operationId: listCenterShipments
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: state
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/ShipmentState' } }
        - name: orderNumber
          in: query
          description: '(0.27.0, R-29) 화면용 주문번호(숫자 8자리, 공백·하이픈 무시) 완전 일치 — 그 주문의 출고(원래·재발송). 8자리가 아니면 400'
          schema: { type: string, maxLength: 12 }
          x-added-in: '2026-11-20'
        - name: createdFrom
          in: query
          description: '(0.27.0, R-29) 출고 만든 날짜(Asia/Seoul) 시작. createdTo 만 주면 그 하루, 최대 31일'
          schema: { type: string, format: date }
          x-added-in: '2026-11-20'
        - name: createdTo
          in: query
          description: '(0.27.0) 출고 만든 날짜 끝(포함, Asia/Seoul)'
          schema: { type: string, format: date }
          x-added-in: '2026-11-20'
        - name: sort
          in: query
          description: '(0.27.0, R-29) oldest(기본, 만든 순 — 예전과 같다) / recent(만든 순 거꾸로)'
          schema: { type: string, enum: [oldest, recent], default: oldest }
          x-added-in: '2026-11-20'
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CenterShipment' } }
                  nextCursor: { type: [string, 'null'] }
                  asOf: { type: string, format: date-time }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /shipments/{shipmentId}/dispatch-requests:
    post:
      tags: [shipments]
      summary: 배차 요청 — 점원만, 예상 포장 시간과 함께 (0.4.5, D-5 / 0.4.11 자동 요청 없음)
      description: |
        2026-11-08 사용자 결정 D-5(Delivery §3.1): 점원이 포장을 시작하면 예상 포장 시간(분, 필수)을 넣고 배차를 요청한다 → `DispatchRequested`
        (trigger MANUAL, estimatedReadyAt = 지금 + 분). **0.4.11(사용자 2026-11-13 "자동요청빼", BR-51): 배차는 점원 요청만** — 요청 없이
        출하 대기(READY)가 돼도 서버가 자동으로 요청하지 않는다(그 출고는 `dispatchRequest` 가 없는 채로 남고, 점원이 READY 뒤에도 요청할 수 있다).
        출고당 한 번 — 이미 요청됐으면 그 요청을 200 으로 돌려준다(새 사건 없음). 그 센터 MFC_WORKER.
        **(0.14.0, 요청 F-2 — 사용자 2026-11-13 "피킹 시작 전에 포장소요시간 입력해서 그 값이 배차요청할 때 넘어가게")** 피킹 작업이 열린 뒤(READY·ASSIGNED·
        IN_PROGRESS·BLOCKED·COMPLETED) 또는 포장이 시작·완료된 출고면 요청한다 — PDA 는 피킹 시작 전에 분을 넣고 부른다. 분 = **지금부터 출하 준비까지**
        예상 시간(피킹 전이면 피킹 포함, 1~180). 예약 주문의 대기(PICK WAITING)·출고 취소·포장 취소/부분 종료는 409 INVALID_STATE.
        배차 자체(라이더 찾기)는 delivery-dispatch.
      operationId: requestDispatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: shipmentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estimatedPackMinutes]
              properties:
                estimatedPackMinutes: { type: integer, minimum: 1, maximum: 180 }
      responses:
        '201':
          description: 요청함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchRequest' }
        '200':
          description: 이미 요청된 출고 — 그 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE(포장 시작 전·취소된 출고)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /shipments/{shipmentId}/packages:
    post:
      tags: [shipments]
      summary: 포장 밀봉 (OPEN→SEALED) → 포장 QR 발급, PackingFinished
      description: 포장 내용(PackageContent)·봉투 수·주류 여부·부피/무게를 기록한다. 모든 포장이 SEALED 되면 ShipmentReady 발행(배차 요청 정보 포함).
      operationId: sealPackage
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: shipmentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SealPackageRequest' }
      responses:
        '201':
          description: 포장 생성·QR 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '409':
          description: INVALID_STATE (Shipment CANCELLED/HANDED_OVER) / TASK_BLOCKED (0.28.0 — 포장 작업이 BLOCKED) / CONTENT_MISMATCH (패킹 완료 수량 초과)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /packages:
    get:
      tags: [handovers]
      summary: 점원 확인이 필요한 포장 목록 — 센터 전체 (0.4.9)
      description: |
        PDA 응답 다듬기(2026-11-08 공지 계획): 포장마다 handover-resolution 을 부르지 않고, 인계 허가가 만료됐지만 확정 요청이 없어
        점원 확인(POST /packages/{id}/handover-checks)이 필요한 포장을 한 번에. 지금은 checkRequired=true 만(그 밖은 400). 그 센터 작업자·센터 관리자.
        허가 만료가 오래된 순.
        (0.17.0, MB-3) 그 센터 MFC_WORKER 또는 MFC_SUPERVISOR.
      operationId: listPackagesToCheck
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: checkRequired, in: query, required: true, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HandoverResolution' } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /packages/{packageId}/staging:
    post:
      tags: [shipments]
      summary: 포장을 출하대기 랙에 올림 (0.20.0, 요청 F-12)
      description: |
        PDA 포장 ⑤단계(봉투를 출하대기 랙에 올리고 랙을 찍음)·MFC 시뮬레이터 R-20. 그 센터 MFC_WORKER·MFC_SUPERVISOR. **밀봉(SEALED) 포장만**(아니면 409 INVALID_STATE).
        mfc-inventory 작업 실행 `STAGE` 로 포장분 PACKED 위치만 지금 위치(패킹대 또는 다른 랙) → `stagingLocation`(구역 DISPATCH_STAGING — 아니면 재고 거절 422 STAGING_REJECTED). 수량·예약·포장 상태 불변.
        같은 랙이면 그대로 200. 다른 랙을 찍으면 그 랙으로 옮긴다. 같은 Idempotency-Key 다시 보내기 = 같은 반영(재고 실행 ID 를 키로 정함), 결과 모름 503 UNKNOWN_RESULT → 같은 키로 다시.
        라이더 인계(재고 인계 전기)·주문 중지 복귀는 이제 포장분이 지금 있는 곳(랙)을 쓴다. 재포장해도 랙 위치는 그대로.
      operationId: stagePackage
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stagingLocation]
              properties:
                stagingLocation: { type: string, maxLength: 40, description: '출하대기 랙 위치 코드(예 DSP-A-01)' }
      responses:
        '200':
          description: 랙에 있음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
  /packages/{packageId}:
    get:
      tags: [shipments]
      summary: 포장 조회 (상태·버전·QR·fence)
      operationId: getPackage
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /packages/handover-code-authorizations:
    post:
      tags: [handovers]
      summary: '라벨 숫자로 인계 허가 — QR 스캔이 안 될 때 (0.13.0, F-8)'
      description: |
        라이더 앱 숫자 입력(요청 F-8). 포장 라벨에 찍힌 `handoverCode`(4자리 — 0.23.0, 그 전 포장은 6자리)를 받는다. 그 배송(deliveryId)의 출고에서 숫자가 같은 **밀봉(SEALED)** 포장을 찾아
        QR 을 찍은 것과 **같은 허가**(`/packages/{packageId}/handover-authorizations` — 같은 검사·응답·멱등)로 넘긴다. 그 뒤 확정·판정 조회는 응답의
        packageId 로 그대로.
        이 센터 출고의 배송이 아니면 409 DELIVERY_MISMATCH, 그 출고에 숫자가 같은 밀봉 포장이 없으면 409 HANDOVER_CODE_MISMATCH(다른 배송·다른 센터 포장도
        여기 — 시도는 경고 로그, details `attemptsLeft` 남은 횟수), 같은 숫자 포장이 둘 이상이면 409 HANDOVER_CODE_AMBIGUOUS(QR 로 — 0.23.0 부터 센터 안 번호가
        겹치지 않아 6자리 옛 포장에서만). 같은 라이더·배송이 5번 틀리면 409 HANDOVER_CODE_LOCKED(0.23.0, R-26 — 맞는 번호도 거절, QR 을 찍거나 점원
        확인). 0.31.1(2026-11-20 — 라이더 앱 실서버): 그 출고에서 **이미 인계된(HANDED_OVER) 포장의 숫자**면 409 ALREADY_HANDED_OVER(틀린 횟수에 넣지 않음 —
        인계 뒤 같은 번호를 다시 넣어 잠기던 것). 토큰 RIDER, 주체 = riderId.
      operationId: authorizeHandoverByCode
      x-pmart-user-types: [RIDER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riderId, deliveryId, handoverCode]
              properties:
                riderId: { type: string }
                deliveryId: { type: string }
                handoverCode: { type: string, pattern: '^([0-9]{4}|[0-9]{6})$', description: '포장 라벨 숫자 — 4자리(0.23.0), 그 전 포장은 6자리' }
      responses:
        '201':
          description: fence 개시(QR 허가와 같다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverAuthorization' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /packages/{packageId}/handover-authorizations:
    post:
      tags: [handovers]
      summary: AuthorizePackageHandover — 라이더 QR 스캔, fence HANDOVER_IN_PROGRESS 개시
      description: |
        배정 라이더·배송번호·포장번호 일치, 기인계·무효 라벨·제한 라이더·중지 확정 포장을 검사한다.
        성공 시 handoverAuthorizationId·fenceVersion·fenceExpiresAt 발급. 만료 후 재스캔 필요(만료 ≠ 취소 성공).
        구현(0.4.0): 토큰 RIDER 이고 주체 = riderId(아니면 403). scannedCode = 포장 qrCode(`PKG:<id>:<버전>`, 아니면 409 PACKAGE_INVALIDATED).
        포장 SEALED·출고 READY/PARTIALLY_HANDED_OVER·주문 중지 없음(아니면 409 INVALID_STATE)·배정(deliveryId 가 이 출고의 배송, 상태 ASSIGNED —
        아니면 409 DELIVERY_MISMATCH / NOT_ASSIGNED)·배정 라이더 = riderId(아니면 403 RIDER_MISMATCH). 같은 라이더·배송이 살아 있는 fence 를
        다시 찍으면 같은 허가(201), 다른 라이더면 409 FENCE_ACTIVE, 확정 요청 뒤 결과 대기면 409 HANDOVER_RESULT_PENDING. 제한 라이더 검사는
        rider-service(RiderRestricted) 투영이 생기면.
      operationId: authorizePackageHandover
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riderId, deliveryId, scannedCode]
              properties:
                riderId: { type: string }
                deliveryId: { type: string }
                scannedCode: { type: string, description: QR 원문 (packageId + packageVersion) }
                scannedAt: { type: string, format: date-time }
      responses:
        '201':
          description: fence 개시
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverAuthorization' }
        '403':
          description: FORBIDDEN (배정 라이더 불일치·제한 라이더)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (중지 확정·SEALED 아님) / ALREADY_HANDED_OVER / PACKAGE_INVALIDATED (구 라벨) / DELIVERY_MISMATCH (타 주문·타 배송) / NOT_ASSIGNED (배정 없음·해제) / FENCE_ACTIVE (다른 승인 진행 중) / HANDOVER_RESULT_PENDING (확정 결과 대기)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONFIG_REQUIRED (센터 인계 허가 유효시간 미설정)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /packages/{packageId}/handover-commits:
    post:
      tags: [handovers]
      summary: CommitPackageHandover — mfc-inventory 커밋 후 HANDED_OVER, PackageHandedOver 발행
      description: |
        fence 유효(handoverAuthorizationId·fenceVersion 일치, 미만료)를 확인한 뒤 mfc-inventory.CommitPackageHandover 를 호출한다(2 hop).
        inventory 응답 불명이면 UNKNOWN_RESULT 로 응답하고 fence 유지. 호출자는 GET …/handover-resolution 으로 해소한다.
        구현(0.4.0): 토큰 RIDER·주체 = riderId = fence 라이더(아니면 403). 인계 ID(handoverId)는 포장당 하나 — 같은 허가로 다시 오면 같은 인계.
        재고 반영(201 APPLIED) / 결과 모름·미전달(202 UNKNOWN_RESULT, 같은 인계 ID 로 서버가 다시 보냄) / 재고 거절(202 REJECTED — fence 유지,
        재인계·취소 모두 막고 대사 필요, nextAction RECONCILE). fence 만료 뒤 첫 확정은 409 FENCE_EXPIRED(다시 찍기).
      operationId: commitPackageHandover
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handoverAuthorizationId, fenceVersion, riderId]
              properties:
                handoverAuthorizationId: { type: string }
                fenceVersion: { type: integer, minimum: 0 }
                riderId: { type: string }
                handedOverAt: { type: string, format: date-time }
      responses:
        '201':
          description: 인계 확정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverCommitResult' }
        '202':
          description: 결과 모름(UNKNOWN_RESULT) 또는 재고 거절(REJECTED) — 본문 status·nextAction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverCommitResult' }
        '409':
          description: INVALID_STATE (fence 없음) / FENCE_EXPIRED / FENCE_VERSION_MISMATCH / ALREADY_HANDED_OVER
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /packages/{packageId}/handover-resolution:
    get:
      tags: [handovers]
      summary: QueryHandoverResolution — 포장 인계 판정 조회 (stopRequest·fence·inventory commit 결합)
      operationId: getHandoverResolution
      x-pmart-user-types: [OPERATOR, RIDER]
      x-pmart-user-types-note: "추정 — 코드에 호출자 종류 검사 없음, 인계 판정은 라이더 앱·점원 단말 둘 다 조회"
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - { name: stopRequestId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverResolution' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /packages/{packageId}/handover-checks:
    post:
      tags: [handovers]
      summary: 인계 허가 만료 뒤 점원 확인 — 포장대에 있음(허가 해제) / 없음(그 라이더에게 인계 확정) (0.4.4, D-1)
      description: |
        2026-11-08 사용자 결정 D-1 안 C. 라이더가 QR 을 찍은 뒤 확정 없이 허가가 만료되면(앱 오류·통신 단절) 실물이 라이더에게 갔을 수 있다.
        그런 포장은 **같은 라이더·같은 배송의 다시 찍기만** 확인 없이 허용하고, 다른 라이더 허가(409 FENCE_EXPIRED_UNCONFIRMED)·주문 중지
        (PENDING)·재포장은 점원이 이 요청으로 실물을 확인한 뒤에만 진행한다. 배정이 바뀌어도 이전 라이더 허가를 자동으로 끝내지 않는다.
        AT_STATION = 포장대에 있음 → 허가 해제(EXPIRED), 대기 중지는 sweep 이 이어 감. TAKEN_BY_RIDER = 포장대에 없음 → 허가 라이더에게 인계된 것으로
        인계 사실을 만들고 재고 인계 전기(라이더 확정과 같은 경로, PackageHandedOver). 그 센터 MFC_WORKER. 허가가 아직 살아 있으면 409 FENCE_ACTIVE,
        확인할 허가가 없으면 409 INVALID_STATE. 같은 Idempotency-Key 는 같은 결과.
        (0.17.0, MB-3) 그 센터 MFC_WORKER 또는 MFC_SUPERVISOR.
      operationId: checkPackageHandover
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [AT_STATION, TAKEN_BY_RIDER] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 확인 뒤 판정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverResolution' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: FENCE_ACTIVE(허가 유효시간이 남음) / INVALID_STATE(확인할 허가 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/package-handovers/{handoverId}/retries:
    post:
      tags: [handovers]
      summary: '[운영자·내부] 재고가 거절한 인계 다시 보내기 (0.4.1)'
      description: |
        2026-11-08(ADR-0047, 결정 목록 D-8). 인계 확정을 재고가 거절하면 인계 사실은 REJECTED 로 멈추고 자동 재시도·재인계·취소를 모두 막는다
        (MFC 1551행 — 승인 정정/복구 전 자동 재개 금지). 운영자가 실물을 확인하고 재고를 정정한 뒤 이 요청으로 같은 인계 ID 를 재고에 다시 보낸다.
        REJECTED 가 아니면 지금 결과를 그대로 돌려준다(여러 번 불러도 안전). 다시 거절되면 새 사유로 REJECTED. 운영자 화면은 백오피스 처리 대기(BO-12) —
        목록 `GET /package-handovers?status=REJECTED`(0.9.0). (0.9.0) 본문 `{operatorId, reason}`(선택)을 주면 실제로 다시 보냈을 때(REJECTED 였을 때) 재시도 기록으로 남긴다.
      operationId: retryPackageHandover
      parameters:
        - { name: handoverId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualRetryBody' }
      responses:
        '200':
          description: 다시 보낸 뒤 결과 (APPLIED / UNKNOWN_RESULT / REJECTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverCommitResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /work-orders:
    get:
      tags: [operations]
      summary: '[직원] 주문 번호로 현장 상태 보기 — 통합 조회 MFC 칸 BO-11 (0.10.0)'
      description: |
        요청 F-3. 상담원이 "상품 준비 중" 주문이 현장 어디서 멈췄는지 본다. 이 서비스 원장만 읽는다(다른 서비스 호출 없음).
        - 권한: OPERATOR_ADMIN·CS_AGENT·RIDER_OPS 는 모든 센터. 그 밖 운영자는 토큰 센터의 작업 지시만 — 그 주문의 작업 지시가 모두 다른 센터면 403.
        - 작업 지시도 중지 요청도 없으면 404 WORK_ORDER_NOT_FOUND(주문이 아직 MFC 에 오지 않음). 중지 요청만 있으면(작업 지시 전 취소) 200 + workOrders 빈 배열 —
          센터를 알 수 없어 본사 역할만 볼 수 있다(그 밖 403).
        - 원래(ORIGINAL)와 오배송 재발송(RESHIPMENT) 작업 지시를 모두, 만든 순으로.
        - 결품은 점원이 보고한 기록(`shortages[]`)과 작업 줄의 취소 수량(`tasks[].cancelledQty` — 결품 해결·중지로 뺀 양)을 따로 준다. 결품 처리 결정은 주문·사가 쪽 정본.
        - 개인정보 없음: 배송지·고객 정보는 이 서비스에 없다. 점원 메모(결품 note)는 싣지 않는다. 작업자·라이더 ID 는 직원 화면용 식별자.
        - (0.27.0, R-29) `orderId` 대신 화면용 주문번호 `orderNumber` 로도 찾는다(센터 관리자가 라벨·화면의 8자리로). 둘 중 정확히 하나 — 둘 다·둘 다 없음은 400.
          번호는 order OrderConfirmed 사본(`orderNumber` 칸과 같은 곳)에서 orderId 로 바꾼다 — 사본이 없으면(번호 전 주문·사건이 아직 안 옴) 404 WORK_ORDER_NOT_FOUND. 권한·응답은 orderId 와 같다.
      operationId: getOrderFulfillment
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: orderId, in: query, required: false, description: 'orderId 또는 orderNumber 중 하나(0.27.0 전에는 필수)', schema: { type: string, maxLength: 64 } }
        - name: orderNumber
          in: query
          required: false
          description: '(0.27.0, R-29) 화면용 주문번호(숫자 8자리, 공백·하이픈 무시) 완전 일치. 8자리가 아니면 400'
          schema: { type: string, maxLength: 12 }
          x-added-in: '2026-11-20'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderFulfillmentView' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /stop-requests:
    get:
      tags: [operations]
      summary: '[운영자] 실패로 멈춘 집품 뒤 중지 목록 — 처리 대기 BO-12 (0.9.0)'
      description: |
        요청 F-4. 판정이 PENDING 이고 실패 사유(lastError)가 있어 자동 재시도에서 빠진 중지 요청 — 주문의 취소 사가는 이것을 기다림으로만 본다.
        OPERATOR_ADMIN 만(모든 센터, mfcId 로 거를 수 있음). 오래된 순(실패 시각, 없으면 요청 시각). 다시 시도해 RESOLVED 가 되거나 사유가 지워지면 빠진다.
        지금은 `failed=true` 만 받는다(그 밖 400). 개인정보 없음.
      operationId: listFailedStopRequests
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: failed, in: query, required: true, schema: { type: boolean } }
        - { name: mfcId, in: query, required: false, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, asOf]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FailedStopRequest' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /package-handovers:
    get:
      tags: [operations]
      summary: '[운영자] 재고가 거절한 인계 목록 — 처리 대기 BO-12 (0.9.0)'
      description: |
        요청 F-4. 인계 확정을 mfc-inventory 가 거절해 REJECTED 로 멈춘 인계(D-8) — 재인계·취소가 막혀 있다. 실물 확인 → 재고 정정 → 다시 보내기
        (`POST /internal/package-handovers/{handoverId}/retries`). OPERATOR_ADMIN 만(모든 센터, mfcId 로 거를 수 있음). 오래된 순(거절 시각).
        다시 보내면(REQUESTED·APPLIED) 빠진다. 지금은 `status=REJECTED` 만 받는다(그 밖 400). 개인정보 없음(라이더 ID 는 직원 화면용 식별자).
      operationId: listRejectedHandovers
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: status, in: query, required: true, schema: { type: string } }
        - { name: mfcId, in: query, required: false, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, asOf]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RejectedHandover' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /shipments/{shipmentId}/repackings:
    post:
      tags: [shipments]
      summary: 포장 사이 재구성 — 같은 출고의 포장 여러 개를 새 포장들로 다시 나눔 (0.4.7, C-12 1부)
      description: |
        2026-11-08(남은 일 C-12 1부). 같은 출고의 밀봉 포장들(packageIds)을 새 포장들(packages)로 다시 나눈다 — 봉투가 무겁거나 온도별로 나눌 때.
        **합계는 그대로**: (주문 줄·SKU·LOT)별 수량 합이 정확히 같아야(아니면 422 CONTENT_MISMATCH). 그래서 재고(포장 위치의 PACKED 단위)·예약은
        변하지 않는다. 수량을 줄이는 재구성(포장 중 파손 등)은 재고 PACK 되돌림이 필요해 아직 없다.
        모든 이전 포장이 같은 포장 위치·SEALED·인계 허가 없음(만료·미확인 포함)·결과 대기 인계 없음·중지 없음이어야(409, 단건 재포장과 같은 코드).
        새 포장은 새 ID·packageVersion(이전 최대+1)·새 QR, 무게·부피는 비움(다시 잴 때까지). 이전 포장은 INVALIDATED + PackageInvalidated
        (newPackageId = 첫 새 포장, newPackageIds = 전부). 그 센터 MFC_WORKER. 같은 Idempotency-Key 는 같은 새 포장들.
      operationId: regroupPackages
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: shipmentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, packageIds, packages]
              properties:
                reason: { type: string, enum: [DAMAGED_BAG, CONTENT_CHANGE, LABEL_UNREADABLE, SHORTAGE_ADJUST] }
                packageIds: { type: array, minItems: 1, items: { type: string } }
                packages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [bagCount, contents]
                    properties:
                      bagCount: { type: integer, minimum: 1 }
                      contents:
                        type: array
                        minItems: 1
                        items: { $ref: '#/components/schemas/PackageContentLine' }
      responses:
        '201':
          description: 새 포장들
          content:
            application/json:
              schema:
                type: object
                properties:
                  packages: { type: array, items: { $ref: '#/components/schemas/Package' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE / ALREADY_HANDED_OVER / FENCE_ACTIVE / FENCE_EXPIRED_UNCONFIRMED / HANDOVER_RESULT_PENDING
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONTENT_MISMATCH(합계가 다름·LOT 없음·다른 출고·다른 포장 위치)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /packages/{packageId}/repackings:
    post:
      tags: [shipments]
      summary: 재포장 — 새 Package 버전 발급, 구 라벨 INVALIDATED (PackageInvalidated)
      description: |
        인계 전(SEALED)만 가능. 재포장 후 구 QR 스캔은 PACKAGE_INVALIDATED 로 거절된다.
        구현(0.4.2, WK-07): 그 센터 작업자(MFC_WORKER). 새 포장 = 새 packageId·packageVersion+1·새 QR, 내용·봉투 수·포장 위치·PACK 확정 ID 는
        그대로(재고·예약 변화 없음). 이전 포장 INVALIDATED(invalidatedReason = `<reason>→<새 packageId>`) + PackageInvalidated(newPackageId).
        주문 잠금 아래 — 인계됨(ALREADY_HANDED_OVER)·살아 있는 fence(FENCE_ACTIVE)·결과 대기 인계(HANDOVER_RESULT_PENDING)·중지 기록·SEALED 아님
        (INVALID_STATE)은 409. contents 는 지금 내용과 같아야 한다 — 포장 사이 재구성·수량 감소는 아직 없음(422 CONTENT_MISMATCH).
        라벨 재출력은 이 요청이 아니다(기존 QR 그대로). 같은 Idempotency-Key 는 같은 새 포장.
      operationId: repackPackage
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [DAMAGED_BAG, CONTENT_CHANGE, LABEL_UNREADABLE, SHORTAGE_ADJUST] }
                contents:
                  type: array
                  description: 변경된 내용물. 생략 시 기존 내용 유지
                  items: { $ref: '#/components/schemas/PackageContentLine' }
      responses:
        '201':
          description: 새 Package (packageVersion+1, 새 QR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '409':
          description: INVALID_STATE / ALREADY_HANDED_OVER / FENCE_ACTIVE / HANDOVER_RESULT_PENDING
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONTENT_MISMATCH (내용물 변경 — 아직 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/work-activities:
    get:
      tags: [work-activities]
      summary: '[mfc-capacity→mfc-fulfillment] 작업자 한 명의 처리 내역(기간) — 요청 F-7 R3'
      description: |
        mfc-capacity 작업자 "오늘 업무 내역"(`GET /mfcs/{mfcId}/workers/{workerId}/activities`)이 모으는 이 서비스 몫. 내부 호출(토큰 없음, ADR-0026).
        이 서비스 원장에서 그 센터·그 운영자가 [from, to) 에 처리한 것: PICK·RETURN(작업 실적 — 반영된 것과 대기 중)·PACK(포장 밀봉).
        시각 순. 기간은 최대 48시간(넘으면 400), 최대 500건.
      operationId: listWorkActivities
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: operatorId, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkActivity' } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

components:
  schemas:
    CenterShipment:
      type: object
      description: '(0.15.0, F-9) 센터 출고 한 건 — 포장 인계 현황'
      required: [shipmentId, orderId, fulfillmentId, mfcId, workOrderKind, state, createdAt, packageCounts, packages]
      properties:
        shipmentId: { type: string }
        orderId: { type: string }
        orderNumber: { type: [string, 'null'], description: '화면용 주문번호(F-5) — 번호 전 주문은 null' }
        fulfillmentId: { type: string }
        mfcId: { type: string }
        workOrderKind: { type: string, description: 'ORIGINAL / RESHIPMENT(오배송 재발송)' }
        state: { $ref: '#/components/schemas/ShipmentState' }
        createdAt: { type: string, format: date-time }
        readyAt: { type: [string, 'null'], format: date-time, description: 출하 대기(READY)가 된 시각 }
        dispatchRequestedAt: { type: [string, 'null'], format: date-time, description: 점원 배차 요청 시각 }
        pick: { $ref: '#/components/schemas/CenterShipmentTask' }
        pack: { $ref: '#/components/schemas/CenterShipmentTask' }
        packageCounts:
          type: object
          required: [total, sealed, handedOver]
          properties:
            total: { type: integer, description: 살아 있는 포장(OPEN·SEALED·HANDED_OVER) }
            sealed: { type: integer, description: 밀봉(인계 대기) }
            handedOver: { type: integer }
        packages:
          type: array
          items:
            type: object
            required: [packageId, state, fenceState]
            properties:
              packageId: { type: string }
              state: { $ref: '#/components/schemas/PackageState' }
              fenceState: { type: string, description: 'NONE·HANDOVER_IN_PROGRESS·COMMITTED·EXPIRED 등 인계 허가 상태' }
              handoverAuthorizedAt: { type: [string, 'null'], format: date-time, description: 라이더 스캔(허가) 시각 }
              handedOverAt: { type: [string, 'null'], format: date-time }
              riderId: { type: [string, 'null'], description: 인계 받은 라이더(인계 끝난 포장만) }
              handoverCode: { type: [string, 'null'], description: '(0.21.0, DL-1·DL-2) 포장 라벨 숫자 4자리(0.23.0 — 그 전 포장은 6자리) — 목록 화면 표기(bff 포장 인계 현황이 그대로 넘김)', x-added-in: '2026-11-19' }
    CenterShipmentTask:
      type: [object, 'null']
      description: '작업 지금 상태(없으면 null)'
      properties:
        state: { $ref: '#/components/schemas/TaskState' }
        blockReason: { type: [string, 'null'], description: "막힌 사유 — 한국어 문장(코드 아님). (F-11) 값 목록은 info 설명 '사유 값' C2" }
        startedAt: { type: [string, 'null'], format: date-time }
    WorkActivity:
      type: object
      description: '처리 한 건(F-7 R3) — mfc-capacity 가 여러 서비스 것을 모은다(같은 모양)'
      required: [activityType, refId, at]
      properties:
        activityType: { type: string, description: '처리 종류 — 서비스마다 정한 값(경로 설명)' }
        refId: { type: string, description: 실행·실사·판정·이동 ID }
        taskId: { type: [string, 'null'], description: 작업 ID(있으면) }
        sku: { type: [string, 'null'], description: 한 SKU 일 때만 }
        qty: { type: [integer, 'null'], description: 처리 수량(SKU 단위 합) }
        result: { type: [string, 'null'], description: 'APPLIED·REJECTED·UNKNOWN_RESULT·CAPTURED·COMPLETED 등 그 원장의 상태' }
        at: { type: string, format: date-time }
    TaskState:
      type: string
      enum: [WAITING, READY, ASSIGNED, IN_PROGRESS, COMPLETED, BLOCKED, FAILED, CANCELLED, CLOSED_PARTIAL]
    TaskType:
      type: string
      enum: [PICK, PACK, DISPATCH, RETURN]
      description: RETURN(0.3.0) = 집품 뒤 취소의 복귀 작업(포장 위치 → 선반)
    TaskAssignment:
      type: object
      description: mfc-capacity 배정 정본의 투영
      properties:
        workerId: { type: [string, 'null'] }
        assignmentVersion: { type: integer }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    TaskSummary:
      type: object
      properties:
        taskId: { type: string }
        taskType: { $ref: '#/components/schemas/TaskType' }
        state: { $ref: '#/components/schemas/TaskState' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        fulfillmentId: { type: string }
        shipmentId: { type: [string, 'null'] }
        pickedBy: { type: [string, 'null'], description: '(0.18.0, mfc-app 피킹→패킹 같은 사람) PACK 만 — 같은 출고 PICK 을 끝낸 담당 작업자. 다음 작업 받기(mfc-capacity)가 이 사람에게만 그 PACK 을 준다(장바구니를 든 사람, 업무 §7-6). PICK 이 안 끝났거나 PACK 이 아니면 null', x-added-in: '2026-11-18' }
        orderNumber: { type: [string, 'null'], description: '(0.13.0, F-5) 화면용 주문번호 — 점원이 라이더·상담원과 같은 번호로 말한다. 번호 전 주문은 null' }
        assignment: { $ref: '#/components/schemas/TaskAssignment' }
        lineCount: { type: integer }
        plannedQty: { type: integer }
        completedQty: { type: integer }
        remainingQty: { type: integer }
        promisedReadyAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        late: { type: boolean, description: '(0.4.8) 시작 뒤 예상 시간의 2배를 넘김 — 센터 관리자 화면 표시만(자동으로 빼앗지 않음, Q-09)' }
        idle: { type: boolean, description: '(0.4.8) 진행 중인데 30분 동안 실적 없음 — 알림만(자동 해제 없음)' }
        lastActivityAt: { type: [string, 'null'], format: date-time, description: '(0.4.8) 시작 또는 마지막 실적 시각' }
        completedAt: { type: [string, 'null'], format: date-time, description: '(0.12.0, F-7 R2) COMPLETED·CLOSED_PARTIAL 이 된 시각. 그 밖 null' }
        headline:
          type: object
          description: '(0.4.9) 목록 표시용 — 첫 줄 상품명과 나머지 줄 수("상품명 외 N건"). 목록도 lineCount·plannedQty·completedQty·remainingQty 를 채운다'
          properties:
            productName: { type: [string, 'null'] }
            otherLineCount: { type: integer }
    TaskLine:
      type: object
      required: [taskLineId, orderLineId, sku, plannedQty, completedQty, cancelledQty, remainingQty]
      properties:
        taskLineId: { type: string }
        orderLineId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        productName: { type: string, description: 표시용 사본 }
        barcode: { type: [string, 'null'], description: '필수 스캔 대조값 — barcodes 의 첫 값(0.7.0 부터 채움, 하위 호환). 모르면 null. 스캔 대조는 barcodes 전체로 한다' }
        barcodes:
          type: array
          items: { type: string }
          description: '(0.7.0) 그 SKU 의 활성 바코드 전부(선행 0 보존, mfc-inventory SKU 투영 사본 — 조회 때 읽음). 스캔 값이 이 중 하나면 같은 상품. 재고 조회 실패·투영 없음이면 빈 배열'
          x-added-in: '2026-11-16'
        temperatureZone:
          type: [string, 'null']
          enum: [AMBIENT, CHILLED, FROZEN, null]
          description: |
            (0.25.0, mfc-app BR-52 R19-2) 상품 보관 온도대 — mfc-inventory SKU 사본 storageType(조회 때 읽음, 저장 안 함). PICK·PACK·RETURN 모두.
            PDA 는 PACK 에서 봉투 온도대를 이것으로 정하고 다른 온도대를 한 봉투에 담지 못하게 한다. 재고 조회 실패·투영 없음·모르는 값이면 null(작업자가 고름).
          x-added-in: '2026-11-20'
        locationId:
          type: [string, 'null']
          description: 지시 로케이션 (예 B04-02-205). PACK·DISPATCH 는 null 일 수 있음
        lotId:
          type: [string, 'null']
          description: 예약 로트. 다른 로트 집품은 실적 차단(IV-07)
        expiresOn: { type: [string, 'null'], format: date, description: 로트 유통기한 (Asia/Seoul) }
        picks:
          type: array
          description: |
            PICK 지시(0.2.0) — 한 줄이 여러 LOT 예약 조각으로 나뉠 수 있어(줄당 LOT 수 제한 없음) LOT 마다 남은 집품량과 선반 위치 후보.
            locationId·lotId·expiresOn 은 첫 지시의 사본. 재고 조회가 안 되면 빈 배열(asOf freshness STALE).
            RETURN(0.3.0): LOT 마다 남은 복귀량과 복귀 대상이 놓인 위치 — 포장 전이면 장바구니, 포장분은 패킹대(locations[].qty = 그 위치에서 더 옮길 양) — 이 서비스 기록이라 늘 FRESH.
          items:
            type: object
            properties:
              lotId: { type: string }
              lotNo: { type: [string, 'null'], description: '(0.11.0, IV-4) PICK 만 — LOT 번호(GS1-128 (10)). PDA 는 찍은 LOT 바코드의 (10) 을 이것과 대조(다르면 막기 — 서버도 예약 LOT 이 아니면 LOT_MISMATCH 로 거절). 재고 조회가 안 되면·RETURN 은 null' }
              expiresOn: { type: [string, 'null'], format: date }
              remainingQty: { type: integer, description: 이 LOT 조각에서 더 집을 양 }
              locations:
                type: array
                items:
                  type: object
                  properties:
                    locationCode: { type: string }
                    qty: { type: integer, description: 그 위치의 LOT 선반 잔량(이 주문 몫만이 아님) }
                    allocatedQty: { type: integer, description: '(0.4.3) 그 위치에서 이 주문 몫으로 배정된 남은 양 — 피킹 시작 때 배정. 배정된 위치가 앞에 온다' }
              visitSeq:
                type: [integer, 'null']
                description: '(0.4.10, PICK 만) 방문 순서(1부터) — 이 조각을 집는 칸(배정 칸 우선)의 순서. 냉장 → 냉동 → 상온 C~H, 칸 사이는 걷는 거리 최단(ADR-0050). 줄·조각은 이 순서로 온다'
              suggestedToLocations:
                type: array
                items: { type: string }
                description: '(0.4.6, RETURN 만) 돌려놓을 추천 선반 — 그 상품이 있던 칸 → 기타 칸 순, 진열 규칙 통과 칸만(mfc-inventory placement-suggestions). 조회 실패면 빈 배열'
              unallocatedQty:
                type: [integer, 'null']
                description: '(0.4.9, PICK 만) 칸을 못 정한 양 — 시작 전에는 선반 잔량으로 모자란 양, 시작 뒤에는 이 주문 몫으로 배정 못 한 양'
              pickStatus:
                type: [string, 'null']
                enum: [OK, PARTIAL, NOT_FOUND, DONE, null]
                description: '(0.4.9, PICK 만) 화면 표시용 — OK 칸 정해짐, PARTIAL 일부만, NOT_FOUND 어느 칸에서도 못 찾음, DONE 다 집음'
              notice:
                type: [string, 'null']
                description: '(0.4.9) 화면에 그대로 보일 짧은 안내(예: "어느 칸에서도 못 찾음 — 센터 관리자 확인"). 없으면 null'
        plannedQty: { type: integer }
        completedQty: { type: integer, description: 서버 확정 실적 }
        cancelledQty: { type: integer, description: 승인 취소 }
        remainingQty: { type: integer, description: 계획 - 확정 - 취소 }
        pendingQty:
          type: integer
          description: 접수됐지만 재고 확정 대기인 실적 (remainingQty 에 아직 반영 안 됨)
    TaskActiveStart:
