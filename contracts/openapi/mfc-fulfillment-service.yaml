        shipmentId: { type: string }
        orderId: { type: string }
        orderNumber: { type: [string, 'null'], description: '(0.13.0, F-5) 화면용 주문번호(숫자 8자리) — 라벨에 크게. 번호 전 주문은 null(orderId 를 쓴다)' }
