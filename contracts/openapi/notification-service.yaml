openapi: 3.1.0
info:
  title: notification-service
  version: 0.5.0
  description: |
    알림 요청·채널(앱 푸시·카카오 알림톡 [결정 필요])·발송 이력·재시도·읽음(본인만), 고객 알림함, 라이더 배차 알림 전송 기록, 지연 안내의 정본. (docs/architecture/service-map.md §8)
    비정본: 원사건(주문·배송·환불·배차 제안은 각 소유 서비스), 마케팅 동의(customer), OS 알림 권한(단말).
    같은 원사건 재전달은 알림을 중복 생성하지 않는다. 알림 실패로 주문·배송·환불을 재실행하지 않는다. 알림함 저장·단말 도달·고객 읽음은 별개 상태다.
    구독: OrderConfirmed, PaymentFailed/Unknown, PreparationStarted, DeliveryAssigned, PickupCompleted, DeliveryEtaUpdated, DeliveryCompleted, ClaimDecided, RefundResult,
    DispatchOfferSent, DispatchDelayed, CaseAssigned, NotificationRequested. 발행: NotificationDelivered, NotificationFailed.
    0.2.0(2026-11-16, 1차 구현 — 사용자 결정 "앱 알림함만 먼저", "이번엔 고객만"): 고객 앱 알림함(IN_APP)만. 휴대폰 푸시(APP_PUSH)·알림톡·문자는 아직 없다(CHANNEL_NOT_APPROVED).
    고객에게 쌓는 알림: 주문 확정(OrderConfirmed)·상품 준비 시작(OrderPreparationStarted)·배송 출발(PickupCompleted)·배송 완료(DeliveryCompleted, 리뷰 안내 포함)·
    주문 취소(OrderCancelled)·품절 부분 취소(OrderLineQuantityChanged SHORTAGE)·환불 결과(RefundResult SUCCESS·FAILED — RefundIntentCreated 로 주문과 잇는다, 결과 모름은 알리지 않음)·
    고객센터 답변(InquiryAnswered).
    0.3.0(2026-11-17, 클라이언트 요청 BR-09 — 사용자 승인 "백엔드 3단계"): 단말 푸시 토큰 등록·해제·목록(`/me/push-tokens`, 고객·라이더, Android 만).
    **토큰만 저장한다 — 푸시 발송(FCM)은 아직 없다**(자격증명·발송 정책 미정). 그래서 APP_PUSH 는 여전히 CHANNEL_NOT_APPROVED 이고, 응답에 토큰 값은 돌려주지 않는다.
    0.4.0(2026-11-17 — 라이더 앱 요청 §11-5, 사용자 "라이더 알림함 먼저"): **라이더 알림함**(같은 /me/notifications, 라이더 토큰) — 도움요청 지원센터 답장(HelpRequestReplied)·도움요청 처리 끝(CaseClosed RIDER_HELP)·
    라이더 문의 답변(RiderInquiryAnswered)·계정 제한·해제(RiderRestricted). 휴대폰 푸시는 여전히 없음 — 앱이 알림함을 확인한다. 운영자 알림함, 수신 설정 변경 결과 조회, 내부 범용 요청·발송 이력·배차 알림 기록은 아직 501.
    0.4.1(2026-11-17, ADR-0067 — 설명만, 경로·필드 변경 없음): **휴대폰 푸시(FCM) 발송** — 알림함에 저장된 알림을 등록 단말로도 보낸다. 라이더 알림은 전부,
    고객은 정한 종류(배송 출발·완료·결품·주문 취소·환불 결과)만. 앱의 Firebase 프로젝트마다 서버 키(없으면 그 쪽은 알림함만). 수신 설정의 APP_PUSH 변경은 여전히 CHANNEL_NOT_APPROVED(끌 수 없는 거래 안내만 보낸다).
    0.4.4(2026-11-18, 고객 앱 요청 R1): 알림함 응답 `Notification` 에 `templateKey`(알림 종류) — 리뷰 요청(REVIEW_REQUESTED)은 sourceEventType 이 배송 완료와 같아(DeliveryCompleted) 앱이 가를 수 없었다. 필드 추가만.
    0.4.3(2026-11-18, 사용자 "추천대로" — 설명만): 리뷰 요청은 오배송 확인(case `MisdeliveryConfirmed`)이 오면 보류하고, 그 주문의 다음 배송 완료(다시 배송)부터 기다림(1시간)을 다시 센다. 환불로 끝나면 보내지 않는다.
    0.4.2(2026-11-18, 사용자 결정 "A해줘" — 설명만, 경로·필드 변경 없음): **리뷰 요청 알림** — 고객 주문 배송 완료(DeliveryCompleted, 회수 목적 배송·취소된 주문 제외) 약 1시간 뒤
    (`pmart.notification.review-request.delay`), 주문당 한 번, 그 주문에 리뷰를 아직 안 썼을 때만(review-service 내부 조회 `GET /internal/orders/{orderId}/review-status` — 삭제한 리뷰도 쓴 것으로 본다)
    고객 알림함에 "받은 상품은 어떠셨나요?"(templateKey REVIEW_REQUESTED, category ORDER, destination ORDER = orderId — 앱은 그 주문의 리뷰 쓰기로). **앱 알림함만** — 휴대폰 푸시 종류에 넣지 않는다.
    review-service 가 응답하지 않으면 다음 정리 때 다시, 배송 완료 뒤 `max-age`(3일)가 지나면 보내지 않는다. 정책값이 없으면 보내지 않는다(CONFIG_REQUIRED). 수신 설정은 지금처럼 주문 안내(ORDER, IN_APP, 잠김)에 든다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: inbox, description: 본인 알림함·읽음 }
  - { name: settings, description: 본인 수신 설정(앱 채널 설정. 마케팅 동의·OS 권한과 별개) }
  - { name: push-tokens, description: "본인 단말 푸시 토큰 등록·해제(0.3.0). 발송은 0.4.1(ADR-0067) — 라이더 전부, 고객은 정한 종류" }
  - { name: internal, description: 범용 알림 요청·발송 이력·배차 알림 기록(서비스 토큰) }

paths:
  /me/notifications:
    get:
      tags: [inbox]
      summary: 알림함 목록 (본인만. 발송 문구는 당시 사실 보존, 최신 상태는 목적지에서 조회)
      operationId: listMyNotifications
      x-pmart-user-types: [CUSTOMER, RIDER]
      x-pmart-user-types-note: "고객·라이더 본인 알림함(라이더 0.4.0, 2026-11-16)"
      parameters:
        - { name: unreadOnly, in: query, schema: { type: boolean, default: false } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unreadCount: { type: integer }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /me/notifications/{notificationId}:
    get:
      tags: [inbox]
      summary: 알림 상세 (목적지 참조 포함. 접근 불가 주문은 내용 미노출)
      operationId: getMyNotification
      x-pmart-user-types: [CUSTOMER, RIDER]
      x-pmart-user-types-note: "추정 — 서비스 지도는 고객 알림함, Recipient.principalType 에 RIDER 도 있어 포함(운영자 제외), 구현 없음"
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /me/notifications/{notificationId}/reads:
    post:
      tags: [inbox]
      summary: 읽음 처리 (NOTICE_UNREAD → NOTICE_READ. 배송 수령·거래 확정 근거가 아님)
      operationId: markNotificationRead
      x-pmart-user-types: [CUSTOMER, RIDER]
      x-pmart-user-types-note: "추정 — 서비스 지도는 고객 알림함, Recipient.principalType 에 RIDER 도 있어 포함(운영자 제외), 구현 없음"
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 반영됨 (이미 읽음이면 멱등 성공)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /me/notification-settings:
    get:
      tags: [settings]
      summary: 앱 수신 설정 조회 (채널·카테고리별. 마케팅 동의·OS 권한 상태는 참조만)
      operationId: getMyNotificationSettings
      x-pmart-user-types: [CUSTOMER, RIDER]
      x-pmart-user-types-note: "추정 — 앱 수신 설정(고객 앱 중심), 라이더 앱도 같은 설정을 쓴다고 봄, 구현 없음"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }

  /me/notification-setting-changes:
    post:
      tags: [settings]
      summary: 앱 수신 설정 변경 (거래 안내는 끌 수 없음. 마케팅은 customer 동의와 함께 확인)
      operationId: changeMyNotificationSettings
      x-pmart-user-types: [CUSTOMER, RIDER]
      x-pmart-user-types-note: "추정 — 앱 수신 설정(고객 앱 중심), 라이더 앱도 같은 설정을 쓴다고 봄, 구현 없음"
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [category, channel, enabled]
                    properties:
                      category: { $ref: '#/components/schemas/Category' }
                      channel: { $ref: '#/components/schemas/Channel' }
                      enabled: { type: boolean }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: TRANSACTIONAL_CANNOT_DISABLE / CHANNEL_NOT_APPROVED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /me/notification-setting-changes/{requestId}:
    get:
      tags: [settings]
      summary: 수신 설정 변경 결과 조회
      operationId: getMyNotificationSettingChange
      x-pmart-user-types: [CUSTOMER, RIDER]
      x-pmart-user-types-note: "추정 — 앱 수신 설정(고객 앱 중심), 라이더 앱도 같은 설정을 쓴다고 봄, 구현 없음"
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /me/push-tokens:
    get:
      tags: [push-tokens]
      summary: 내 단말 푸시 토큰 목록 (토큰 값은 돌려주지 않는다 — 앱 설정·점검용)
      operationId: listMyPushTokens
      x-pmart-user-types: [CUSTOMER, RIDER]
      responses:
        '200':
          description: OK (최근 갱신 순)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PushDevice' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /me/push-tokens/{deviceId}:
    put:
      tags: [push-tokens]
      summary: 단말 푸시 토큰 등록·교체 (같은 단말이면 토큰을 바꾼다)
      description: |
        호출한 고객·라이더의 단말(deviceId)에 토큰을 둔다. 같은 deviceId 로 다시 부르면 토큰·앱 버전을 바꾼다(멱등).
        같은 토큰이 다른 주인·단말에 있으면 그 줄을 지우고 이 주인·단말로 옮긴다(토큰 하나는 한 번에 한 주인 — 로그아웃 없이 다른 계정으로 로그인한 단말).
        주인당 단말 수는 설정 `pmart.notification.push-token.max-devices` — 넘으면 가장 오래 갱신되지 않은 단말을 지운다. 설정이 없으면 422 CONFIG_REQUIRED.
        토큰 값은 로그·응답에 남기지 않는다. 발송(FCM)은 0.4.1(ADR-0067) — 이 토큰으로 라이더 알림 전부·고객은 정한 종류를 보낸다.
      operationId: registerMyPushToken
      x-pmart-user-types: [CUSTOMER, RIDER]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushTokenRegistration' }
      responses:
        '200':
          description: 등록·교체됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushDevice' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
    delete:
      tags: [push-tokens]
      summary: 단말 푸시 토큰 해제 (로그아웃·알림 끄기. 없으면 그대로 204 — 멱등, 본인 단말만)
      operationId: unregisterMyPushToken
      x-pmart-user-types: [CUSTOMER, RIDER]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '204': { description: 해제됨(또는 이미 없음) }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  # ---------- internal (서비스 토큰) ----------
  /rider-notices:
    post:
      tags: [rider-notices]
      summary: (0.5.0) 라이더 공지 보내기 — 전체 또는 센터 배달지역 라이더 (라이더 운영·관리자)
      x-added-in: '2026-11-18'
      description: |
        2026-11-18 사용자 "대상 고르기 + 알림함·푸시". RIDER_OPS·OPERATOR_ADMIN(그 밖 403). 받는 라이더 = rider 가 정한 탈퇴 안 한 라이더(전체, 또는 배달지역에
        mfcId 가 있는 라이더). 라이더마다 알림함 한 줄(templateKey RIDER_NOTICE, 분류 SYSTEM, 목적지 NONE) + 휴대폰 푸시(FCM 키가 있을 때). 같은 직원·같은
        Idempotency-Key 는 같은 결과(새로 보내지 않음). 제목 1~40자, 본문 1~500자. rider 를 못 부르면 503(보내지 않음).
      operationId: sendRiderNotice
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, target]
              properties:
                title: { type: string, minLength: 1, maxLength: 40 }
                body: { type: string, minLength: 1, maxLength: 500 }
                target:
                  type: object
                  required: [type]
                  properties:
                    type: { type: string, enum: [ALL, MFC] }
                    mfcId: { type: string, maxLength: 40, description: type MFC 일 때 }
      responses:
        '200':
          description: 보냄(또는 같은 요청의 이전 결과)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderNotice' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
    get:
      tags: [rider-notices]
      summary: (0.5.0) 보낸 라이더 공지 — 최근 순 (라이더 운영·관리자)
      x-added-in: '2026-11-18'
      operationId: listRiderNotices
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RiderNotice' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /internal/notification-requests:
    post:
      tags: [internal]
      summary: '[전 서비스→notification] 범용 알림 요청 (NotificationRequested 이벤트의 동기 대안)'
      description: |
        sourceEventId 기준으로 중복 생성을 막는다(같은 원사건은 1건). 수신자 동의·앱 설정·채널 승인 조건을 발송 시점에 확인하고 조건 미충족은 SUPPRESSED로 기록한다.
        승인되지 않은 채널(알림톡 [결정 필요])은 CHANNEL_NOT_APPROVED로 거절한다.
      operationId: requestNotification
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationRequest' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: CHANNEL_NOT_APPROVED / TEMPLATE_NOT_FOUND / RECIPIENT_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/notification-requests/{requestId}:
    get:
      tags: [internal]
      summary: 알림 요청 상태 조회 (알림함 저장·채널별 발송·읽음을 분리 표시)
      operationId: getNotificationRequest
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationRequestStatus' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/notification-requests/{requestId}/deliveries:
    get:
      tags: [internal]
      summary: 채널별 발송 이력·재시도 기록
      operationId: listNotificationDeliveries
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DeliveryAttempt' } }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/dispatch-notification-records:
    get:
      tags: [internal]
      summary: '[dispatch/bff→notification] 라이더 배차 제안 알림 전송 기록 (제안 자체는 dispatch 정본)'
      operationId: listDispatchNotificationRecords
      parameters:
        - { name: offerId, in: query, schema: { type: string } }
        - { name: riderId, in: query, schema: { type: string } }
        - { name: deliveryId, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        recordId: { type: string }
                        offerId: { type: string }
                        riderId: { type: string }
                        deliveryId: { type: string }
                        channel: { $ref: '#/components/schemas/Channel' }
                        state: { $ref: '#/components/schemas/DeliveryState' }
                        sentAt: { type: string, format: date-time }
                        deliveredAt: { type: [string, 'null'], format: date-time }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

components:
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: 앱이 단말마다 만들어 두는 식별자(설치 ID 등). 영문·숫자·`._:-` 1~128자.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
  schemas:
    PushPlatform:
      type: string
      description: 지금은 Android 만(iOS 는 만들지 않는다)
      enum: [ANDROID]
    PushTokenRegistration:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, minLength: 1, maxLength: 4096, description: FCM 등록 토큰. 응답·로그에 다시 나오지 않는다 }
        platform: { $ref: '#/components/schemas/PushPlatform' }
        appVersion: { type: [string, 'null'], maxLength: 32 }
    PushDevice:
      type: object
      description: 등록된 단말(토큰 값 없음)
      required: [deviceId, platform, registeredAt, updatedAt]
      properties:
        deviceId: { type: string }
        platform: { $ref: '#/components/schemas/PushPlatform' }
        appVersion: { type: [string, 'null'] }
        registeredAt: { type: string, format: date-time, description: 이 주인·단말에 처음 등록한 시각 }
        updatedAt: { type: string, format: date-time, description: 마지막 등록·교체 시각 }
    Channel:
      type: string
      description: KAKAO_ALIMTALK은 [결정 필요] 승인 전 거절
      enum: [APP_PUSH, IN_APP, KAKAO_ALIMTALK, SMS]
    RiderNotice:
      type: object
      x-added-in: '2026-11-18'
      required: [noticeId, title, body, targetType, sentBy, sentAt, recipientCount]
      properties:
        noticeId: { type: string }
        title: { type: string }
        body: { type: string }
        targetType: { type: string, enum: [ALL, MFC] }
        mfcId: { type: [string, 'null'] }
        sentBy: { type: string, description: 보낸 직원(운영자 ID) }
        sentAt: { type: string, format: date-time }
        recipientCount: { type: integer, description: 보낸 라이더 수 }
    Category:
      type: string
      enum: [ORDER, PAYMENT, DELIVERY, CLAIM, REFUND, DISPATCH, CASE, MARKETING, SYSTEM]
    DeliveryState:
      type: string
      description: SUPPRESSED는 동의·설정·권한 조건 미충족으로 발송하지 않음
      enum: [QUEUED, SENT, DELIVERED, FAILED, RETRY_PENDING, SUPPRESSED, UNKNOWN]
    Recipient:
      type: object
      required: [principalType, principalId]
      properties:
        principalType: { type: string, enum: [CUSTOMER, RIDER, OPERATOR] }
        principalId: { type: string }
    Destination:
      type: object
      description: 알림을 열 때 이동할 최신 목적지 (원사건 참조)
      properties:
        type: { type: string, enum: [ORDER, DELIVERY, CLAIM, REFUND, DISPATCH_OFFER, CASE, INQUIRY, NOTICE, NONE, HELP_REQUEST] }
        ref:
          type: string
          description: |
            type 별 식별자. ORDER = orderId, DELIVERY = deliveryId, CLAIM = claimId,
            **REFUND = claimId**(환불은 클레임 아래에서 조회한다 — claim-service `GET /claims/{claimId}/refunds`. 주문 취소 환불도 취소 클레임으로 만들어진다).
            INQUIRY = inquiryId(고객센터 문의 — case-service `GET /inquiries/{inquiryId}`, 0.2.0. 라이더 문의도 같은 경로).
            **HELP_REQUEST = `<deliveryId>:<requestId>`**(라이더 도움요청 — delivery-execution `GET /deliveries/{deliveryId}/help-requests/{requestId}`·대화, 0.4.0).
            NONE 이면 비어 있다. (2026-11-05 명시)
    Notification:
      type: object
      required: [notificationId, category, title, state, createdAt]
      properties:
        notificationId: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        title: { type: string }
        body: { type: string, description: 발송 당시 사실. 최신 상태와 구분 }
        destination: { $ref: '#/components/schemas/Destination' }
        sourceEventId: { type: string }
        sourceEventType: { type: string }
        templateKey: { type: string, maxLength: 64, x-added-in: '2026-11-18', description: '(0.4.4) 알림 종류(ORDER_CONFIRMED·DELIVERY_COMPLETED·REVIEW_REQUESTED 등 — 서버 문구 키). 앱이 종류별 화면을 고를 때 쓴다(예 REVIEW_REQUESTED → 그 주문의 리뷰 쓰기). 같은 사건(sourceEventType)이 여러 종류를 낼 수 있어 그것으로 가르지 않는다. 모르는 값은 기본 동작(destination)으로' }
        state: { type: string, enum: [NOTICE_UNREAD, NOTICE_READ] }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    NotificationSettings:
      type: object
      properties:
        accountId: { type: string }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        items:
          type: array
          items:
            type: object
            properties:
              category: { $ref: '#/components/schemas/Category' }
              channel: { $ref: '#/components/schemas/Channel' }
              enabled: { type: boolean }
              locked: { type: boolean, description: 거래 안내는 true }
        marketingConsent: { type: string, enum: [AGREED, WITHDRAWN, UNKNOWN], description: customer 사본 }
        osPermission: { type: string, enum: [GRANTED, DENIED, UNKNOWN], description: 단말이 마지막으로 보고한 값 }
    NotificationRequest:
      type: object
      required: [recipient, category, templateKey, sourceEventId, sourceEventType]
      properties:
        recipient: { $ref: '#/components/schemas/Recipient' }
        category: { $ref: '#/components/schemas/Category' }
        templateKey: { type: string, maxLength: 64 }
        templateParams: { type: object, additionalProperties: { type: string } }
        channels: { type: array, items: { $ref: '#/components/schemas/Channel' }, description: 생략 시 템플릿 기본 채널 }
        destination: { $ref: '#/components/schemas/Destination' }
        sourceEventId: { type: string, description: 중복 생성 방지 키 }
        sourceEventType: { type: string }
        correlationId: { type: string, description: 사가·사건 ID }
        occurredAt: { type: string, format: date-time, description: 원사건 시각 (역순 안내 방지) }
        expiresAt: { type: string, format: date-time, description: 이 시각 이후 미발송분은 폐기 (배차 제안 1분 등) }
    DeliveryAttempt:
      type: object
      properties:
        attemptId: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        attemptNo: { type: integer }
        state: { $ref: '#/components/schemas/DeliveryState' }
        providerRef: { type: string }
        failureReason: { type: string }
        sentAt: { type: string, format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        nextRetryAt: { type: [string, 'null'], format: date-time }
    NotificationRequestStatus:
      type: object
      properties:
        requestId: { type: string }
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        notificationId: { type: [string, 'null'], description: 알림함 저장 결과 }
        inboxStored: { type: boolean }
        channels:
          type: array
          items:
            type: object
            properties:
              channel: { $ref: '#/components/schemas/Channel' }
              state: { $ref: '#/components/schemas/DeliveryState' }
              attempts: { type: integer }
        readAt: { type: [string, 'null'], format: date-time }
        duplicateOf: { type: [string, 'null'], description: 같은 sourceEventId로 이미 생성된 요청 ID }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
