openapi: 3.1.0
info:
  title: backoffice-bff
  version: 0.9.2
  description: |
    관리자 화면별 조회 조합·명령 전달 계층. 상태 없음, 정본 아님. (docs/architecture/service-map.md §8)
    조회는 원천별 asOf·postedAt·신선도·확인 등급(직접확인/사본/불명)을 그대로 노출하며 기준시각이 다른 수량은 합산하지 않는다.
    명령은 대상 서비스로 그대로 전달한다(멱등키·expected version 부착). 응답 ACK(ACCEPTED)는 성공이 아니며 결과는 짝 조회로 확인한다.
    금지 — 주문 상태 직접 변경, 잔고 덮어쓰기, 강제 성공, 검증 생략.
servers:
  - url: /api/v1/backoffice
security:
  - bearerAuth: []
tags:
  - { name: views, description: 화면별 읽기 모델(원천별 asOf 포함) }
  - { name: commands, description: 대상 서비스 명령 전달(프록시) }

paths:
  /views/unified-lookup:
    get:
      tags: [views]
      summary: 통합 조회 (주문·배송·TRF·운행·사건을 식별자/고객으로 한 번에)
      operationId: getUnifiedLookupView
      x-pmart-user-types: [OPERATOR]
      x-added-in: '2026-11-16'
      description: |
        0.3.0(2026-11-16 사용자 "통합 조회로 진행해" — 업무 원문 BO-11·§5.1): 역할 OPERATOR_ADMIN·CS_AGENT·RIDER_OPS(그 밖 403). 각 원천은 **호출한 직원의 토큰**으로 다시 판정한다.
        찾는 값(q, 완전 일치): ORDER 주문 ID, DELIVERY 배송 ID, CASE 사건 ID, CUSTOMER 고객 ID. ANY(기본)는 접두어로 가린다(ORD-·DLV-·CASE-·CU-, 그 밖 422 UNSUPPORTED_LOOKUP).
        TRANSFER·TRIP 은 원천이 아직 없어 422 UNSUPPORTED_LOOKUP. 전화번호 검색은 하지 않는다(개인정보 — 주문 조회 화면).
        주문 하나로 잇는다(DELIVERY·CASE 는 그 주문을 찾아서): matches 에 원천마다 따로 — ORDER(order 직원용 상세의 요약), DELIVERY(delivery-execution 배송 목록),
        DISPATCH(delivery-dispatch 배송별 배차), CLAIM(claim 목록), CASE(case 사건 — 주문·배송 번호로, 열린 것 + 닫힌 것 최근 20건, 보이는 종류만), INQUIRY(case 고객 문의 — 주문 번호로, CS_AGENT·OPERATOR_ADMIN 만 볼 수 있어 그 밖은 원천 `case-service/inquiries` 가 unavailableSources 에, 제목·내용 없음). 서로 다른 상태를 하나로 합치지 않는다.
        CUSTOMER 는 그 고객의 주문 목록만(ORDER 요약 여럿, 최근 50건).
        원천이 실패하면 그 원천 이름을 unavailableSources 에, 그 항목은 없음(0건·정상으로 바꾸지 않는다). 403(그 원천을 볼 권한 없음)도 unavailableSources 로 —
        화면은 "권한 없음/조회 실패"로 보여 준다. 찾는 주문이 없으면 matches 비어 있음(404 아님).
        **원천 이름(sources[].system·unavailableSources·matches[].source.system)**: order-service(ORDER), delivery-execution-service(DELIVERY),
        delivery-dispatch-service(DISPATCH), claim-service(CLAIM), case-service(CASE), case-service/inquiries(INQUIRY). 이번 조회에서 부른 원천만 sources 에 나온다.
        닫힌 사건은 닫힌 시각 최근 순(case 0.5.0).
        summary 에는 개인정보 원문을 싣지 않는다(이름·연락처·주소 없음 — 원문은 주문 화면의 열람 요청으로). **MFC 현장(0.9.0, 2026-11-17 — PC 3 F-3 mfc-fulfillment 0.10.0)**: 주문으로 `GET /work-orders?orderId=`(직원 토큰) — 작업 지시마다 kind FULFILLMENT(결정·출고별 작업·결품 보고·포장·인계, 원천 모양 그대로), 중지 요청마다 MFC_STOP. 원천 이름 mfc-fulfillment-service(실패·403 은 unavailableSources, 404 는 현장 기록 없음).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 128 }, description: '주문 ID·배송 ID·사건 ID·고객 ID(완전 일치)' }
        - { name: kind, in: query, schema: { type: string, enum: [ORDER, DELIVERY, TRANSFER, TRIP, CUSTOMER, CASE, ANY] }, description: '비우면 ANY(접두어로 가림)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      matches:
                        type: array
                        items:
                          type: object
                          properties:
                            kind: { type: string, description: 'ORDER·DELIVERY·DISPATCH·CLAIM·CASE·INQUIRY·FULFILLMENT·MFC_STOP(0.9.0)' }
                            id: { type: string }
                            summary: { type: object, additionalProperties: true, description: '원천 응답 중 개인정보가 아닌 필드만(원천 이름 그대로)' }
                            source: { $ref: '#/components/schemas/SourceStamp' }
                      resolved:
                        type: object
                        description: 찾는 값을 어떻게 해석했는지(0.3.0)
                        properties:
                          kind: { type: string, description: 'ORDER·DELIVERY·CASE·CUSTOMER' }
                          orderId: { type: [string, 'null'], description: '이은 주문(CUSTOMER 는 null)' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422':
          description: UNSUPPORTED_LOOKUP(TRANSFER·TRIP, ANY 에서 접두어를 모름)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /views/approval-inbox:
    get:
      tags: [views]
      summary: 승인함 (BO-10; approval-service 읽기 + 원정본 반영 상태)
      description: |
        approval-service GET /approvals 를 운영자 본인 토큰으로 읽어 화면용으로 묶는다(2026-11-03, BR-40). 정렬은 제출 최신순.
        dossierId = approvalId(approval-service 승인 ID) — 승인 상세·결정은 approval-service /approvals/{approvalId}.
        approval-service 가 응답하지 않으면 200 + 빈 items + unavailableSources=[approval-service](추정하지 않음). 운영자가 아니면 403.
        centerId 는 아직 approval-service 가 거르지 않는다(넘기기만 함).
      operationId: getApprovalInboxView
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: approvalType, in: query, schema: { type: string } }
        - { name: reviewState, in: query, schema: { type: string } }
        - { name: centerId, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            dossierId: { type: string, description: '= approvalId' }
                            approvalId: { type: string }
                            changeRequestId: { type: string }
                            approvalType: { type: string }
                            targetService: { type: string }
                            summary: { type: string }
                            caseId: { type: [string, 'null'] }
                            expiresAt: { type: [string, 'null'], format: date-time }
                            requestState: { type: string }
                            reviewState: { type: string }
                            executionState: { type: string }
                            deliveryState: { type: string }
                            targetRef: { type: string }
                            expectedVersion: { type: integer }
                            requestedBy: { type: string }
                            submittedAt: { type: string, format: date-time }
                            source: { $ref: '#/components/schemas/SourceStamp' }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }

  /views/pending-work:
    get:
      tags: [views]
      summary: 처리 대기 — 사람 손이 필요한 멈춘 일 (BO-12, OPERATOR_ADMIN, 0.2.0)
      x-added-in: '2026-11-16'
      description: |
        2026-11-16 사용자 BO-12 결정(추천대로): 운영 관리자만. 두 원천을 모아 오래된 것부터 보여 준다.
        - order-orchestration-service 멈춘 사가(`/internal/stuck-sagas`) — kind STUCK_SAGA, allowedActions 는 그 사가에 의미 있는 조치만
          (REQUERY_RESULT = 결제 원결과 다시 확인 → 명령 `saga-requery`, MARK_RESOLVED = 밖에서 해결함 표시(사유 필수) → `saga-resolve`).
        - order-service 이행 확인 필요(`/fulfillment-issues`, OPEN, 모든 센터 — 운영자 토큰으로) — kind FULFILLMENT_ISSUE, 확인은 order-service `POST /fulfillment-issues/{id}/acknowledgements` 를 직접.
        - 0.4.0(2026-11-16 사용자 "A안"): mfc-fulfillment-service 실패로 멈춘 중지 요청 — kind MFC_STOP_FAILED(refId = stopRequestId),
          재고가 거절한 인계(D-8) — kind MFC_HANDOVER_REJECTED(refId = handoverId). 둘 다 allowedActions [RETRY] → 명령 `stop-retry`·`handover-retry`.
          **0.8.0(2026-11-17 — PC 3 F-4, mfc-fulfillment 0.9.0)**: 목록 `GET /stop-requests?failed=true`·`/package-handovers?status=REJECTED` 를 운영자 토큰으로 읽는다(설정 `pmart.bff.mfc-pending-lists` 기본 켬 — false 면 부르지도 sources 에 넣지도 않음). 항목에 `lastRetry`(최근 운영자 재시도 — operatorId·reason·retriedAt).
          재시도 명령은 MFC 에 본문 `{operatorId: 토큰 주체, reason}` 을 넘겨 MFC 재시도 기록으로 남긴다(사유 필수·500자 — BO-12).
          **0.9.1**: MFC 목록을 커서로 끝까지(최대 5쪽 × 200건) 읽는다 — 넘으면 `truncated: true`. 한 쪽이라도 실패하면 MFC 항목 전체를 빼고 unavailableSources(반만 보이지 않게).
        원천 하나가 응답하지 않으면 그 항목 없이 200 + unavailableSources(추정하지 않음).
      operationId: getPendingWorkView
      x-pmart-user-types: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PendingWorkItem' }
                      truncated: { type: boolean, x-added-in: '2026-11-17', description: '(0.9.1) MFC 목록이 1,000건(200 × 5쪽)을 넘어 뒤를 읽지 않았으면 true — 센터로 나눠 보거나 오래된 것부터 처리' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /views/case-inbox:
    get:
      tags: [views]
      summary: 사건함 (case-service 읽기 + 연결 배송·주문의 지금 상태, 0.5.0)
      x-added-in: '2026-11-16'
      description: |
        0.5.0(2026-11-16 사용자 "1번부터 진행해"): case-service `GET /cases` 를 **호출한 직원의 토큰**으로 읽고(보이는 범위·정렬은 case 가 정한다 —
        state 비우면 열린 사건, 우선순위·기한 순, CLOSED 는 닫힌 시각 최근 순), 사건마다 연결된 배송(subjectType DELIVERY 또는 refs deliveryId)·
        주문(subjectType ORDER 또는 refs orderId)의 **지금 상태**를(0.5.1 — 오배송 사건의 회수 배송 refs recoveryDeliveryId, 0.5.2 — 재발송 배송 reshipmentDeliveryId 도 배송으로) 원천에서 읽어 `linked` 에 붙인다(delivery-execution `GET /deliveries/{id}`,
        order `GET /orders/lookups/{id}` — 같은 ID 는 한 번만). 상태를 합치거나 해석하지 않는다.
        - **0.6.0(2026-11-17 — PC 5 DE-2 반영)**: 라이더 도움요청 사건(kind RIDER_HELP, refs deliveryId·requestId)은 execution `GET /deliveries/{deliveryId}/help-requests/{requestId}` 를 읽어
          `linked` 에 kind HELP_REQUEST(state = 도움요청 상태, lastRiderMessageAt·lastSupportMessageAt)를 더한다. "새 메시지"(라이더가 지원센터 뒤에 썼는지·직원별 읽음)는 화면이 두 시각으로 판단한다(bff 는 해석하지 않음).
        - 역할: 직원이면 누구나 부를 수 있고 case 의 판정(403·보이는 범위)을 그대로 따른다. case 가 응답하지 않으면 200 + 빈 items + unavailableSources.
        - 연결 원천 실패·403(예: 그 직원이 주문을 못 보는 역할)은 그 칸만 state null·confidence UNKNOWN 이고 unavailableSources 에 원천 이름. 404 는 state null·freshness CURRENT(없음).
        - size 는 최대 50(연결 조회가 사건 수만큼 늘어서). 개인정보 없음 — 사건 summary 는 case 가 원문 없이 만든 한 줄.
      operationId: getCaseInboxView
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string }, x-added-in: '2026-11-16' }
        - { name: assignee, in: query, schema: { type: string }, description: case assigneeId }
        - { name: assigneeGroup, in: query, schema: { type: string }, x-added-in: '2026-11-16' }
        - { name: unassigned, in: query, schema: { type: boolean }, x-added-in: '2026-11-16' }
        - { name: overdue, in: query, schema: { type: boolean }, x-added-in: '2026-11-16' }
        - { name: centerId, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            caseId: { type: string }
                            kind: { type: [string, 'null'], x-added-in: '2026-11-16' }
                            state: { type: string }
                            priority: { type: string }
                            summary: { type: [string, 'null'], x-added-in: '2026-11-16' }
                            subjectType: { type: [string, 'null'], x-added-in: '2026-11-16' }
                            subjectRef: { type: [string, 'null'], x-added-in: '2026-11-16' }
                            centerId: { type: [string, 'null'], x-added-in: '2026-11-16' }
                            assigneeId: { type: [string, 'null'], x-added-in: '2026-11-16' }
                            assigneeGroup: { type: [string, 'null'], x-added-in: '2026-11-16' }
                            slaDueAt: { type: [string, 'null'], format: date-time }
                            overdue: { type: [boolean, 'null'], x-added-in: '2026-11-16' }
                            openedAt: { type: [string, 'null'], format: date-time, x-added-in: '2026-11-16' }
                            openObligations: { type: integer }
                            linkedRefs: { type: array, items: { type: object, properties: { kind: { type: string }, id: { type: string } } }, description: 'case refs 그대로(kind = refType)' }
                            linked:
                              type: array
                              x-added-in: '2026-11-16'
                              description: 연결 배송·주문의 지금 상태 — 원천마다 따로
                              items:
                                type: object
                                properties:
                                  kind: { type: string, enum: [DELIVERY, ORDER, HELP_REQUEST] }
                                  id: { type: string }
                                  state: { type: [string, 'null'], description: '배송 state / 주문 status — 원천 값 그대로' }
                                  version: { type: [integer, 'null'] }
                                  lastRiderMessageAt: { type: [string, 'null'], format: date-time, x-added-in: '2026-11-17', description: '(0.6.0) HELP_REQUEST 만 — 도움요청 대화의 라이더 마지막 메시지 시각(execution DE-2)' }
                                  lastSupportMessageAt: { type: [string, 'null'], format: date-time, x-added-in: '2026-11-17', description: '(0.6.0) HELP_REQUEST 만 — 지원센터 마지막 메시지 시각' }
                                  source: { $ref: '#/components/schemas/SourceStamp' }
                            source: { $ref: '#/components/schemas/SourceStamp' }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /views/replenishment-status:
    get:
      tags: [views]
      summary: 보충 현황 (TRF별 승인/확보/편성/출발/수령 — 원천별 기준시각 분리, 합산 금지)
      operationId: getReplenishmentStatusView
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, schema: { type: string } }
        - { name: cdcId, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: trfId, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            trfId: { type: string }
                            version: { type: integer }
                            approved: { $ref: '#/components/schemas/StampedQty' }
                            allocated: { $ref: '#/components/schemas/StampedQty' }
                            transport: { $ref: '#/components/schemas/StampedState' }
                            departed: { $ref: '#/components/schemas/StampedQty' }
                            received: { $ref: '#/components/schemas/StampedQty' }
                            unsettled: { $ref: '#/components/schemas/StampedQty' }
                            replenishmentState: { $ref: '#/components/schemas/StampedState' }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }

  /views/trip-control:
    get:
      tags: [views]
      summary: 운행 관제 (planning 배정 + execution 운행/ETA/사건 + cold-chain 이탈)
      operationId: getTripControlView
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: cdcId, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            tripId: { type: string }
                            assignment: { $ref: '#/components/schemas/StampedState' }
                            trip: { $ref: '#/components/schemas/StampedState' }
                            departure: { $ref: '#/components/schemas/StampedState' }
                            vehicleId: { type: string }
                            driverId: { type: string }
                            stops: { type: array, items: { type: object, additionalProperties: true } }
                            eta: { $ref: '#/components/schemas/StampedState' }
                            openIncidents: { type: integer }
                            openExcursions: { type: integer }
                      unplanned: { type: array, items: { type: object, additionalProperties: true } }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }

  /views/live-delivery:
    get:
      tags: [views]
      summary: 실시간 배송 현황 (MFC별 고객 배송·배차·라이더 — delivery-* 읽기)
      operationId: getLiveDeliveryView
      x-pmart-user-types: [OPERATOR]
      x-added-in: '2026-11-16'
      description: |
        0.3.0(2026-11-16 사용자 "백오피스용부터 추천대로" — 배송 업무 원문 §10.1 "실시간 배송 현황", §1 고객센터·운영 관리자의 배송 관제 화면):
        역할 OPERATOR_ADMIN·CS_AGENT·RIDER_OPS(그 밖 403) — 원천은 호출한 직원 토큰으로 다시 판정(이 셋은 모든 센터).
        MFC_SUPERVISOR(센터 관리자, 0.3.1 — 2026-11-16 사용자 "추천대로", 배송 원문 §1 점포 관리자·§3.6)는 **자기 센터(토큰 centers)로 고정** — mfcId 를 비우면 하나뿐인 자기 센터(여럿이면 400), 다른 센터 403. 열린 사건은 case 가 그 직원에게 보이는 것(자기 센터 배차 실패)만.
        mfcId 를 비우면 모든 센터. state(delivery-execution ExecutionState 하나)를 비우면 **끝나지 않은 배송**(UNASSIGNED·ASSIGNED·ARRIVED_AT_STORE·
        PICKED_UP·ARRIVED_AT_CUSTOMER·FAILURE_REPORTED·SUSPENDED·RETURN_IN_PROGRESS·RETURN_PICKED_UP)을 상태마다 읽어 생긴 순(오래된 것 먼저)으로 합쳐 size 건까지
        (size 최대 50) — 이때 cursor 는 없고, 더 있으면 truncated=true(상태나 센터로 좁혀 다시 본다). state 를 주면 그 상태만, page.nextCursor 로 다음 쪽.
        항목마다 원천을 따로: delivery(delivery-execution 수행 상태)·dispatch(delivery-dispatch 배차 상태 — 배송마다 한 번 읽음)·openCases(case 열린 사건 —
        그 직원이 볼 수 있는 종류, 배송 번호로 이음). promisedAt = 배차의 arrivalWindow 끝(Asia/Seoul) — 없으면 null. **latestEta(0.7.0, 2026-11-17 — TR-3)** = delivery-tracking `GET /deliveries/{id}/eta`(직원 토큰) 의 dropEta.etaAt, dropEta.status 가 AVAILABLE 일 때만(그 밖 null — etaStatus 에 원천 값 LOCATING·ETA_PENDING·FINAL 그대로, delayedBySeconds 도 원천 값). tracking 배포 전 배송은 404 → null(없음), tracking 실패·403 은 etaSource UNKNOWN + unavailableSources.
        원천 이름: delivery-execution-service·delivery-dispatch-service·case-service·delivery-tracking-service(0.7.0). 원천 실패·403 은 unavailableSources — 배차 칸은 state null·source.confidence UNKNOWN, openCases 는 null(0건·정상으로 바꾸지 않음).
        개인정보(고객 이름·연락처·주소) 없음.
        **0.9.2**: 열린 사건은 커서로 최대 5쪽(넘으면 casesTruncated, 안 붙은 배송 openCases null). 배차·도착 예정은 이 요청에서 한 번 실패하면 남은 배송은 부르지 않고 UNKNOWN(멈춘 원천 × 배송 수만큼 기다리지 않게). 배차 404(배차 기록 없음)는 원천의 답이라 DIRECT.
      parameters:
        - { name: mfcId, in: query, required: false, schema: { type: string }, description: '센터 — 비우면 모든 센터(0.3.0)' }
        - { name: state, in: query, schema: { type: string }, description: 'ExecutionState 하나 — 비우면 끝나지 않은 배송 전부(0.3.0)' }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            deliveryId: { type: string }
                            orderId: { type: string }
                            mfcId: { type: [string, 'null'] }
                            type: { type: [string, 'null'], description: 'FORWARD·RETURN·RESHIPMENT(0.3.0)' }
                            delivery: { $ref: '#/components/schemas/StampedState' }
                            dispatch: { $ref: '#/components/schemas/StampedState' }
                            riderId: { type: [string, 'null'] }
                            createdAt: { type: [string, 'null'], format: date-time }
                            assignedAt: { type: [string, 'null'], format: date-time }
                            pickedUpAt: { type: [string, 'null'], format: date-time }
                            arrivalWindow:
                              type: [object, 'null']
                              description: delivery-dispatch arrivalWindow 그대로(date·start·end, Asia/Seoul)
                              additionalProperties: true
                            promisedAt: { type: [string, 'null'], format: date-time }
                            latestEta: { type: [string, 'null'], format: date-time }
                            etaStatus: { type: [string, 'null'], x-added-in: '2026-11-17', description: '(0.7.0) tracking dropEta.status 그대로 — AVAILABLE·LOCATING·ETA_PENDING·FINAL' }
                            delayedBySeconds: { type: [integer, 'null'], x-added-in: '2026-11-17', description: '(0.7.0) tracking 약속 대비 지연(양수 = 늦음)' }
                            etaSource: { $ref: '#/components/schemas/SourceStamp' }
                            openCases:
                              description: 열린 사건(case — 보이는 종류만). case 원천 실패면 null(0.3.0)
                              type: [array, 'null']
                              items:
                                type: object
                                properties:
                                  caseId: { type: string }
                                  kind: { type: string }
                                  priority: { type: [string, 'null'] }
                                  overdue: { type: [boolean, 'null'] }
                      truncated: { type: boolean, description: 'state 를 비웠을 때 size 를 넘는 배송이 더 있음(0.3.0)' }
                      casesTruncated: { type: boolean, x-added-in: '2026-11-17', description: '(0.9.2) 열린 사건을 1,000건(200 × 5쪽)까지만 읽음 — true 면 사건이 안 붙은 배송의 openCases 는 [] 가 아니라 null(모름)' }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }

  /views/packing-handover:
    get:
      tags: [views]
      summary: 포장 인계 현황 (MFC 포장 완료·인계 펜스·라이더 인계 — mfc-*/delivery 읽기)
      operationId: getPackingHandoverView
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            shipmentId: { type: string }
                            orderId: { type: string }
                            packing: { $ref: '#/components/schemas/StampedState' }
                            handoverFence: { $ref: '#/components/schemas/StampedState' }
                            handedOverQty: { $ref: '#/components/schemas/StampedQty' }
                            riderId: { type: [string, 'null'] }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }

  /views/metrics:
    get:
      tags: [views]
      summary: 지표 (분모 보존; 비율은 분자/분모를 함께 반환)
      operationId: getMetricsView
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string, enum: [ON_TIME_DELIVERY, SHORTAGE_RATE, TRANSPORT_ON_TIME, UNPLANNED_RATE, PAYMENT_UNKNOWN, CASE_SLA] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: centerId, in: query, schema: { type: string } }
        - { name: granularity, in: query, schema: { type: string, enum: [DAY, HOUR], default: DAY } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      metric: { type: string }
                      points:
                        type: array
                        items:
                          type: object
                          required: [bucket, numerator, denominator]
                          properties:
                            bucket: { type: string }
                            numerator: { type: integer }
                            denominator: { type: integer, description: 0이면 비율 미정의(null) }
                            ratio: { type: [number, 'null'] }
                            source: { $ref: '#/components/schemas/SourceStamp' }

  /commands/{targetService}/{command}:
    post:
      tags: [commands]
      summary: 명령 전달 프록시 (Idempotency-Key 부착; 대상 CommandResponse 그대로 반환, ACK≠성공)
      description: |
        0.2.0(2026-11-16 BO-12) 지금 열린 명령은 둘 — OPERATOR_ADMIN 만, targetRef = sagaId, reason 은 saga-resolve 만 필수(saga-requery 는 선택 — 없으면 기본 문구로 기록):
        `order-orchestration-service/saga-requery`(REQUERY_RESULT — 결제 원결과 다시 확인), `order-orchestration-service/saga-resolve`(MARK_RESOLVED — 밖에서 해결함 표시).
        0.4.0: `mfc-fulfillment-service/stop-retry`(targetRef = stopRequestId — 실패로 멈춘 집품 뒤 중지 다시 시도),
        `mfc-fulfillment-service/handover-retry`(targetRef = handoverId — 재고가 거절한 인계 다시 보내기, 실물 확인·재고 정정 뒤). 둘 다 OPERATOR_ADMIN, reason 필수.
        응답은 CommandResponse 로 옮긴다 — 중지: RESOLVED → APPLIED, PENDING+lastError → REJECTED(nextAction FIX_AND_RETRY), PENDING → ACCEPTED(QUERY_RESULT),
        UNKNOWN → UNKNOWN_RESULT. 인계: status·nextAction 그대로. resultId = targetRef. reason(필수·500자)은 운영자 ID(토큰 주체)와 함께 MFC 재시도 기록으로 남는다(0.8.0). **0.9.2**: MFC 응답 시간 초과·5xx 는 오류가 아니라 202 status UNKNOWN_RESULT·nextAction QUERY_RESULT(같은 Idempotency-Key 로 다시 보내거나 처리 대기 목록으로 확인).
        payload 는 지금 쓰지 않는다(빈 객체). 그 밖의 대상·명령은 422 UNSUPPORTED_ACTION.
        본문은 대상 서비스 계약 그대로 전달한다. BFF는 행위 시점 권한 검증(auth)을 먼저 호출하고, 통과하면 멱등키·X-Source-System=backoffice-bff·
        X-Expected-Version을 붙여 대상에 전달한다. 응답 status는 대상의 값을 변형하지 않는다. UNKNOWN_RESULT는 GET /commands/{targetService}/{command}/{requestId}로 해소.
        허용 명령은 대상 서비스 계약에 등록된 것만. 주문 상태 직접 변경·잔고 덮어쓰기·강제 성공 명령은 UNSUPPORTED_ACTION.
      operationId: proxyCommand
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: targetService, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$' }, description: 예 approval-service }
        - { name: command, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$' }, description: 대상 계약의 명령 경로 식별자 }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetRef, payload]
              properties:
                targetRef: { type: string, description: 대상 aggregate 식별자(경로 치환용) }
                reason: { type: string, maxLength: 500, description: 감사 기록 사유 }
                payload: { type: object, additionalProperties: true, description: 대상 서비스 계약 본문 그대로 }
      responses:
        '202':
          description: 대상 CommandResponse 그대로 (ACCEPTED는 성공 아님)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: UNSUPPORTED_ACTION / APPROVAL_REQUIRED / CONFIG_REQUIRED (대상 응답 그대로)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /commands/{targetService}/{command}/{requestId}:
    get:
      tags: [commands]
      summary: 전달한 명령의 원결과 조회 (대상 서비스 짝 조회로 위임)
      operationId: getProxiedCommandResult
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: targetService, in: path, required: true, schema: { type: string } }
        - { name: command, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  resultId: { type: [string, 'null'] }
                  source: { $ref: '#/components/schemas/SourceStamp' }
                  detail: { type: object, additionalProperties: true }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    SourceStamp:
      type: object
      description: 원천 서비스·기준시각·신선도·확인 등급. 화면은 이 값을 숨기지 않는다.
      required: [system, asOf, confidence]
      properties:
        system: { type: string }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        postedAt: { type: [string, 'null'], format: date-time, description: 정본 전기 시각(있을 때) }
        confidence:
          type: string
          description: DIRECT=정본 직접 확인. COPY=사본/이벤트 투영. UNKNOWN=조회 실패 또는 불명.
          enum: [DIRECT, COPY, UNKNOWN]
    StampedQty:
      type: object
      description: 수량 + 출처. 기준시각이 다른 StampedQty끼리 합산하지 않는다.
      properties:
        qty: { type: [integer, 'null'] }
        source: { $ref: '#/components/schemas/SourceStamp' }
    StampedState:
      type: object
      properties:
        state: { type: [string, 'null'] }
        version: { type: [integer, 'null'] }
        at: { type: [string, 'null'], format: date-time }
        source: { $ref: '#/components/schemas/SourceStamp' }
    PendingWorkItem:
      type: object
      x-added-in: '2026-11-16'
      required: [kind, refId, since, allowedActions, source]
      properties:
        kind: { type: string, enum: [STUCK_SAGA, FULFILLMENT_ISSUE, MFC_STOP_FAILED, MFC_HANDOVER_REJECTED] }
        refId: { type: string, description: 'STUCK_SAGA = sagaId(명령 targetRef), FULFILLMENT_ISSUE = issueId, MFC_STOP_FAILED = stopRequestId, MFC_HANDOVER_REJECTED = handoverId(둘 다 명령 targetRef)' }
        orderId: { type: [string, 'null'], description: '(0.9.2) MFC 거절 인계는 주문 ID 가 없을 수 있다(원천 값 그대로)' }
        mfcId: { type: [string, 'null'] }
        sagaType: { type: [string, 'null'], description: 'S1_CHECKOUT·S2_FULFILLMENT·S3_CANCELLATION·SHORTAGE·RESHIPMENT(오배송 재발송 — orchestration 이 2026-11-16 더함, BFF 는 그대로 전달)' }
        state: { type: string, description: '사가 상태(ESCALATED 등), 확인 필요 상태(OPEN), MFC 중지 PENDING·인계 REJECTED' }
        step: { type: [string, 'null'] }
        reasonCode: { type: [string, 'null'] }
        reasonMessage: { type: [string, 'null'] }
        since: { type: string, format: date-time, description: 멈춘(보류된) 시각 }
        lastRetry:
          type: [object, 'null']
          x-added-in: '2026-11-17'
          description: '(0.8.0) MFC 항목만 — 최근 운영자 재시도(mfc-fulfillment 0.9.0 manual_retry). 없으면 null'
          properties:
            operatorId: { type: [string, 'null'] }
            reason: { type: [string, 'null'] }
            retriedAt: { type: string, format: date-time }
        allowedActions:
          type: array
          description: 'REQUERY_RESULT·MARK_RESOLVED(사가 — 명령 saga-requery·saga-resolve), ACKNOWLEDGE(확인 필요 — order-service 직접), RETRY(MFC — stop-retry·handover-retry)'
          items: { type: string }
        source: { $ref: '#/components/schemas/SourceStamp' }
    ComposedView:
      type: object
      description: 모든 화면 응답의 공통 머리. 원천별 asOf 목록과 조회 실패 원천을 분리해 보여준다.
      required: [sources]
      properties:
        sources: { type: array, items: { $ref: '#/components/schemas/SourceStamp' } }
        unavailableSources: { type: array, items: { type: string } }
        composedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
