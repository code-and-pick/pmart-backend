openapi: 3.1.0
info:
  title: transport-execution-service
  version: 0.6.0
  description: |
    0.6.0(2026-11-27, DC 백오피스 DN-3·MFC 시뮬레이터 R-52): 화면 번호 사본 — Trip `departureNumber`(cdc-outbound 출발 검증 응답 S+6), `stops[].trfNumbers`(trfIds 순)·`transfers[].trfNumber`(T+6).
      TRF 번호는 planning 이 운행을 만들 때 TripInput `stops[].trfNumbers` 로 준다(없으면 빈 문자열·null — 옛 운행). `/mfcs/{mfcId}/inbound-trips` 도 같은 Trip.
    0.5.0(2026-11-27, DC 시뮬레이터 R-29 — 사용자 "mfc 에서 하차완료해야 자동으로 운행종료지"): MFC 인계(`…/stops/{seq}/handovers`)가 기록되면 그 정차를 인계 시각으로
      **자동 출발**(DEPARTED), 모든 정차가 출발하면 운행을 **자동 COMPLETED**(endedAt = 마지막 정차 출발 시각). fleet 차량 점유는 노선 복귀 시간(returnMinutes) 뒤에 푼다
      (사용자 결정 "자동 종료 + 복귀 시간 더함") — 그 전에 DC 복귀(`…/physical-ends`)를 등록하면 그때 푼다. 정차 출발 `…/departures` 는 그대로 받는다(이미 출발이면 그대로).
      배포 전에 인계만 되고 남은 정차(HANDED_OVER)는 주기 작업이 인계 시각으로 출발·종료한다. 운행 기록(trip_event) STOP_DEPARTED·TRIP_COMPLETED. outbox 사건은 그대로(StopArrived 만).
    0.4.0(2026-11-27, 요청 TE-1 — MFC 입고 예정 자동 도착): 정차가 처음 ARRIVED 가 되면 같은 트랜잭션에서 outbox 로 `StopArrived`(tms.trip.v1, aggregate Trip —
      tripId·stopId `<tripId>-<seq>`·mfcId·sequence·arrivedAt·arrivalBasis DRIVER_INPUT·trfIds = 그 정차에 상차한 TRF). 이 서비스가 처음 내는 사건. API 모양은 그대로.
    0.3.0(2026-11-26, DK-2): 운행에 계획완료 때 배정한 도크 사본 dockCode·dockReservationId(planning 이 운행을 만들 때 준다 — 없으면 null).
    간선 운행·정차·실제 출발 사실(departureId)·인계 증빙·운행 예외·예상 도착의 정본. (docs/architecture/service-map.md §6)
    TOUT 전기는 cdc-inventory(cdc-outbound 출발 검증이 부른다), TIN 은 mfc-inventory, 배차·재배정은 transport-planning, 차량·기사는 fleet.
    실제 출발은 사람이 등록한 사실이며 상차완료로 자동 처리하지 않는다. 실시간 GPS 는 없고 이벤트 시각·위치만 남긴다(TMS D-08). 인계 증빙은 TIN 이 아니다.
    0.2.0(2026-11-26, TMS 1단계 — 설계 docs/cdc/design/2026-11-26-tms-first-stage.md, 사용자 "TMS 2.3 에 맞춰"): 옛 0.1.0(TMS v1.1 — 출발 전 대조·비용 근거)을 바꿨다.
      - 운행 = planning 계획완료 운송지시서의 실행(tripId = orderId). 상태 SCHEDULED → CHECKED_IN → LOADED → DEPARTED → COMPLETED / CANCELLED(출차 전만). 정차 PLANNED → ARRIVED → HANDED_OVER → DEPARTED.
      - 출차 → cdc-outbound `POST /internal/departure-validations`(상차 스캔 = 출발 구성 — 동기, 키 = departureId). 인계 = 출고(상차 스캔) vs 인수 박스 대조 → MATCHED / MISMATCHED + 예외.
      - 사건(TruckActuallyDeparted·TripStateChanged 등)은 1단계에서 발행하지 않는다 — TruckActuallyDeparted 줄은 SKU·LOT 이 필요한데 execution 은 박스 바코드만 안다(내용물은 cdc-outbound 매니페스트). 구독자가 생길 때 매니페스트를 붙여 발행.
      - 운행 상태가 바뀌면 planning `POST /internal/transport-orders/{orderId}/trip-updates` 로 알린다(실패하면 주기 재시도 — 출차 사실은 그대로).
      - 예상 도착·지연 플래그(정본 9.3 — 계획 + 30분 또는 07:30 초과). DC 백오피스 TR-2 `GET /cdcs/{cdcId}/trips`, MFC 도착 예정 `GET /mfcs/{mfcId}/inbound-trips`.
      - 직원(OPERATOR — 자기 센터)이 기사·작업자 대신 입력한다(기사 앱 없음). 시뮬레이터는 같은 명령을 `/internal/trips/...` 로(source SIMULATED). 도크 배정·온도 이탈·운임 근거는 뒤로.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: trips, description: 운행 조회·입차·상차완료·출차·복귀 }
  - { name: stops, description: 정차 도착·인계·출발 }
  - { name: incidents, description: 운행 예외 }
  - { name: internal, description: 서비스 간 호출(planning·시뮬레이터) }

paths:
  /cdcs/{cdcId}/trips:
    get:
      tags: [trips]
      summary: '[0.2.0] 센터 출발 운행 목록 (DC 백오피스 TR-2) — 출고일·상태'
      description: 이 센터에서 출발하는 운행. 계획 출차 → 노선 → 온도대 순. 자기 센터 운영자만(다른 센터 403).
      operationId: listCenterTrips
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - { name: shipDate, in: query, schema: { type: string, format: date } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/TripState' } }
        - { name: delayed, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /mfcs/{mfcId}/inbound-trips:
    get:
      tags: [trips]
      summary: '[0.2.0] MFC 도착 예정 운행 (정본 18장 "MFC 도착 예정") — 그 MFC 정차가 있는 운행'
      operationId: listMfcInboundTrips
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: arrivalDate, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /trips/{tripId}:
    get:
      tags: [trips]
      summary: '[0.2.0] 운행 하나 — 정차·이벤트·예외·출발 사실'
      description: 출발 센터 운영자 또는 정차 MFC 운영자.
      operationId: getTrip
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /trips/{tripId}/check-ins:
    post:
      tags: [trips]
      summary: '[0.2.0] 입차 — 차량이 DC 에 들어옴 (SCHEDULED → CHECKED_IN, 출발 센터 운영자)'
      operationId: checkInTrip
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /trips/{tripId}/loading-completions:
    post:
      tags: [trips]
      summary: '[0.2.0] 상차완료 — 이관요청서별 상차 스캔 (CHECKED_IN → LOADED, 정본 9.1)'
      description: |
        transfers = 이 운행 이관요청서마다 실은 박스(·R/T) 바코드. 운행에 없는 TRF 는 400 UNKNOWN_TRF. 계획 TRF 가 빠졌거나 lpns 가 비면 그 TRF 는 미상차(예외 NOT_LOADED)이고
        나머지가 하나 이상이면 LOADED(미상차 TRF 는 출발 구성에서 빠진다 — 배차 담당이 다른 차량·미배차 처리, 정본 11장). 모두 빠지면 409 NOTHING_LOADED.
        다시 보내면 마지막 스캔으로 바꾼다(출차 전만).
      operationId: completeLoading
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoadingInput' }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /trips/{tripId}/departures:
    post:
      tags: [trips]
      summary: '[0.2.0] 출차 — 실제 출발 사실 departureId 발급 → cdc-outbound 출발 검증 (LOADED → DEPARTED, 정본 9.2)'
      description: |
        LOADED 에서만(409 INVALID_STATE — 이미 DEPARTED 면 그대로). departureId(DEP-) 한 번. 한 트랜잭션에 DEPARTED·출발 사실을 남기고,
        트랜잭션 밖에서 cdc-outbound `POST /internal/departure-validations`(trfCompositions = 상차 스캔, 키 = departureId). 결과는 outboundLinkage(ACKNOWLEDGED·FAILED·UNKNOWN_RESULT) —
        불명·미전달이면 주기 재시도가 같은 키로 다시 보낸다(출차 사실은 취소하지 않음 — 정본 17장). 출고 확정(TOUT)은 WMS 가 한다.
      operationId: departTrip
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartureInput' }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /trips/{tripId}/physical-ends:
    post:
      tags: [trips]
      summary: '[0.2.0] DC 복귀 — 모든 정차 인계 뒤 (DEPARTED → COMPLETED, fleet 점유 해제)'
      description: 인계 안 된 정차가 있으면 409 STOPS_OPEN. 점유 해제가 안 되면 경고만(운행은 COMPLETED).
      operationId: endTrip
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /trips/{tripId}/stops/{stopSeq}/arrivals:
    post:
      tags: [stops]
      summary: '[0.2.0] MFC 도착 (운행 DEPARTED, 정차 PLANNED → ARRIVED) — 앞 정차가 출발하지 않았으면 409 PREVIOUS_STOP_OPEN'
      operationId: arriveAtStop
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/StopSeq'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /trips/{tripId}/stops/{stopSeq}/handovers:
    post:
      tags: [stops]
      summary: '[0.2.0] 인계 — 하차 스캔으로 인계 증빙 HO- (ARRIVED → HANDED_OVER, 정본 10.2·10.3, 그 MFC 운영자)'
      description: |
        transfers = 그 정차 이관요청서마다 받은 박스 바코드. 출고(상차 스캔)와 비교: 모두 같으면 MATCHED, 빠짐(부족)·더 있음(초과·오배송)이 있으면 MISMATCHED +
        예외 QTY_MISMATCH(차이 박스 목록) — 차량 출발은 막지 않는다. 그 정차에 없는 TRF 는 400 UNKNOWN_TRF. 한 번만(다시 오면 같은 본문 = 그대로, 다른 본문 409 HANDOVER_RECORDED — 정정은 뒤로).
        인수 확정(TIN)은 MFC 가 한다 — 이 증빙은 운송 사실의 근거다.
      operationId: recordHandover
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/StopSeq'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoverInput' }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /trips/{tripId}/stops/{stopSeq}/departures:
    post:
      tags: [stops]
      summary: '[0.2.0] 정차 출발 (HANDED_OVER → DEPARTED) — 인계 증빙 없이 출발할 수 없다(409 HANDOVER_REQUIRED)'
      operationId: departStop
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/StopSeq'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /trips/{tripId}/incidents:
    post:
      tags: [incidents]
      summary: '[0.2.0] 운행 예외 등록 (지연 사유·차량 고장·사고·하차 대기·온도 이탈 — 수동, 정본 11장)'
      operationId: raiseIncident
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, description]
              properties:
                type: { $ref: '#/components/schemas/IncidentType' }
                stopSeq: { type: integer }
                description: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /trips/{tripId}/incidents/{incidentId}/resolutions:
    post:
      tags: [incidents]
      summary: '[0.2.0] 예외 해결 기록 (OPEN → RESOLVED) — 운행이 끝나도 예외는 따로 남는다'
      operationId: resolveIncident
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TripId'
        - { name: incidentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/trips:
    post:
      tags: [internal]
      summary: '[planning→execution] 운행 만들기 — 계획완료 운송지시서 사본 (tripId = orderId, 같은 본문 재전송은 그대로)'
      description: 같은 tripId·다른 본문이면 SCHEDULED 일 때만 바꾸고(지시서 version 이 더 높을 때), 아니면 409 TRIP_CONFLICT.
      operationId: createTrip
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripInput' }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/trips/{tripId}/cancellations:
    post:
      tags: [internal]
      summary: '[planning→execution] 운행 취소 — 출차 전만 (DEPARTED 뒤 409 ALREADY_DEPARTED)'
      operationId: cancelTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/trips/{tripId}/commands/{command}:
    post:
      tags: [internal]
      summary: '[시뮬레이터→execution] 운행 명령 — 직원 경로와 같은 본문·규칙 (토큰 없이 X-Source-System, 칠곡 CDC-9)'
      description: |
        command = check-ins·loading-completions·departures·physical-ends·stops-<seq>-arrivals·stops-<seq>-handovers·stops-<seq>-departures.
        본문은 같은 이름의 직원 경로와 같다. 출차 source 기본 SIMULATED. 게이트웨이는 `/internal/**` 을 막으므로 LAN 서비스 주소로 직접 부른다.
      operationId: runTripCommand
      parameters:
        - $ref: '#/components/parameters/TripId'
        - { name: command, in: path, required: true, schema: { type: string, pattern: '^(check-ins|loading-completions|departures|physical-ends|stops-[1-9]-(arrivals|handovers|departures))$' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/TripOk' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/departures/{departureId}:
    get:
      tags: [internal]
      summary: 출발 사실 조회 (cdc-outbound·mfc-inbound — UNKNOWN_RESULT 해소)
      operationId: getDepartureFact
      parameters:
        - { name: departureId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartureFact' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  parameters:
    CdcId: { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
    TripId: { name: tripId, in: path, required: true, schema: { type: string } }
    StopSeq: { name: stopSeq, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 9 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    TripOk:
      description: 바뀐(또는 지금) 운행
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Trip' }
  schemas:
    TempClass:
      type: string
      enum: [AMBIENT, CHILLED, FROZEN]
    TripState:
      type: string
      description: SCHEDULED(계획완료)·CHECKED_IN(입차)·LOADED(상차완료)·DEPARTED(출차완료 — 운행 중)·COMPLETED(운송완료 — 모든 정차 인계 + DC 복귀)·CANCELLED(출차 전 취소)
      enum: [SCHEDULED, CHECKED_IN, LOADED, DEPARTED, COMPLETED, CANCELLED]
    StopState:
      type: string
      enum: [PLANNED, ARRIVED, HANDED_OVER, DEPARTED]
    IncidentType:
      type: string
      description: NOT_LOADED(미상차 — 자동)·QTY_MISMATCH(인계 차이 — 자동)·DELAY·VEHICLE_BREAKDOWN·ACCIDENT·UNLOADING_WAIT·TEMPERATURE_EXCURSION·OTHER(수동)
      enum: [NOT_LOADED, QTY_MISMATCH, DELAY, VEHICLE_BREAKDOWN, ACCIDENT, UNLOADING_WAIT, TEMPERATURE_EXCURSION, OTHER]
    EventInput:
      type: object
      properties:
        at: { type: string, format: date-time, description: 일어난 시각(없으면 지금). 미래 시각 400 }
        location: { type: string, maxLength: 120, description: 이벤트 위치(주소·좌표 문자열 — 실시간 추적 아님) }
        temperatureC: { type: number, description: 적재함 온도 }
    LoadingInput:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          required: [transfers]
          properties:
            transfers:
              type: array
              minItems: 1
              items:
                type: object
                required: [trfId, lpns]
                properties:
                  trfId: { type: string }
                  lpns: { type: array, items: { type: string, maxLength: 64 }, description: 실은 박스(·R/T) 바코드 }
                  rtCount: { type: integer, minimum: 0 }
                  sealNos: { type: array, items: { type: string } }
    DepartureInput:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          properties:
            source: { type: string, enum: [REAL, SIMULATED], description: "비우면 직원 경로는 REAL, 시뮬레이터 명령(/internal/trips/.../commands)은 SIMULATED" }
            evidenceRef: { type: string, maxLength: 128 }
    HandoverInput:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          required: [transfers]
          properties:
            receiverName: { type: string, maxLength: 30, description: 인수자 표시 이름(직원 ID 는 토큰에서) }
            transfers:
              type: array
              minItems: 1
              items:
                type: object
                required: [trfId, receivedLpns]
                properties:
                  trfId: { type: string }
                  receivedLpns: { type: array, items: { type: string, maxLength: 64 } }
                  damagedLpns: { type: array, items: { type: string, maxLength: 64 } }
    TripInput:
      type: object
      required: [tripId, orderVersion, cdcId, shipDate, routeId, tempClass, vehicleId, driverId, plannedDepartureAt, plannedReturnAt, stops]
      properties:
        tripId: { type: string }
        orderVersion: { type: integer }
        cdcId: { type: string }
        shipDate: { type: string, format: date }
        routeId: { type: string }
        tempClass: { $ref: '#/components/schemas/TempClass' }
        vehicleId: { type: string }
        plateNo: { type: [string, 'null'] }
        driverId: { type: string }
        driverName: { type: [string, 'null'] }
        reservationId: { type: [string, 'null'] }
        dockCode: { type: [string, 'null'], description: (0.3.0) }
        dockReservationId: { type: [string, 'null'], description: (0.3.0) }
        plannedLoadingStartAt: { type: string, format: date-time }
        plannedDepartureAt: { type: string, format: date-time }
        plannedReturnAt: { type: string, format: date-time }
        returnMinutes: { type: integer }
        stops:
          type: array
          minItems: 1
          items:
            type: object
            required: [seq, mfcId, plannedArrivalAt, legMinutes, trfIds]
            properties:
              seq: { type: integer }
              mfcId: { type: string }
              plannedArrivalAt: { type: string, format: date-time }
              plannedDepartureAt: { type: string, format: date-time }
              legMinutes: { type: integer }
              trfIds: { type: array, items: { type: string } }
              trfNumbers: { type: array, items: { type: string }, description: '(0.6.0) trfIds 와 같은 순서의 TRF 화면 번호 사본(모르면 빈 문자열)' }
    Trip:
      type: object
      required: [tripId, cdcId, shipDate, routeId, tempClass, state, stops, version]
      properties:
        tripId: { type: string }
        cdcId: { type: string }
        shipDate: { type: string, format: date }
        routeId: { type: string }
        tempClass: { $ref: '#/components/schemas/TempClass' }
        vehicleId: { type: string }
        plateNo: { type: [string, 'null'] }
        driverId: { type: string }
        driverName: { type: [string, 'null'], description: 표시 이름(fleet) }
        dockCode: { type: [string, 'null'], description: '(0.3.0) 상차 도크 — 계획완료 때 자동 배정, 없으면 null' }
        state: { $ref: '#/components/schemas/TripState' }
        delayed: { type: boolean, description: '어느 정차든 예상 도착 > 계획 + 30분 또는 > 07:30(플래그 — 상태 아님)' }
        plannedLoadingStartAt: { type: string, format: date-time }
        plannedDepartureAt: { type: string, format: date-time }
        plannedReturnAt: { type: string, format: date-time }
        checkedInAt: { type: [string, 'null'], format: date-time }
        loadedAt: { type: [string, 'null'], format: date-time }
        departedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        departureId: { type: [string, 'null'] }
        departureNumber: { type: [string, 'null'], description: '(0.6.0) 출발 검증 화면 번호(cdc-outbound 응답 사본)' }
        outboundLinkage: { type: [string, 'null'], enum: [PENDING, ACKNOWLEDGED, FAILED, UNKNOWN_RESULT, null], description: cdc-outbound 출발 검증 전달 상태 }
        outboundResult: { type: [string, 'null'], description: cdc-outbound 출발 검증 결과(MATCHED·PARTIALLY_MATCHED·MISMATCHED) 또는 거절 사유 }
        trfCount: { type: integer }
        boxCount: { type: integer, description: 상차 스캔 박스 수(상차 전이면 0) }
        rtCount: { type: integer }
        stops:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              mfcId: { type: string }
              state: { $ref: '#/components/schemas/StopState' }
              trfIds: { type: array, items: { type: string } }
              trfNumbers: { type: array, items: { type: string }, description: '(0.6.0) trfIds 순 화면 번호(모르면 빈 문자열)' }
              plannedArrivalAt: { type: string, format: date-time }
              estimatedArrivalAt: { type: [string, 'null'], format: date-time, description: 최신 예상(계획을 덮지 않음) }
              arrivedAt: { type: [string, 'null'], format: date-time }
              handedOverAt: { type: [string, 'null'], format: date-time }
              departedAt: { type: [string, 'null'], format: date-time }
              delayed: { type: boolean }
              handover:
                oneOf:
                  - type: 'null'
                  - type: object
                    properties:
                      handoverId: { type: string }
                      result: { type: string, enum: [MATCHED, MISMATCHED] }
                      shippedBoxes: { type: integer }
                      receivedBoxes: { type: integer }
                      missingLpns: { type: array, items: { type: string } }
                      extraLpns: { type: array, items: { type: string } }
                      damagedLpns: { type: array, items: { type: string } }
                      receiverId: { type: [string, 'null'] }
                      receiverName: { type: [string, 'null'] }
        transfers:
          type: array
          items:
            type: object
            properties:
              trfId: { type: string }
              trfNumber: { type: [string, 'null'], description: '(0.6.0) 화면 번호 사본' }
              stopSeq: { type: integer }
              loaded: { type: boolean }
              lpns: { type: array, items: { type: string } }
              rtCount: { type: [integer, 'null'] }
        events:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              type: { type: string }
              stopSeq: { type: [integer, 'null'] }
              location: { type: [string, 'null'] }
              temperatureC: { type: [number, 'null'] }
              actorId: { type: [string, 'null'] }
              source: { type: [string, 'null'] }
        incidents:
          type: array
          items:
            type: object
            properties:
              incidentId: { type: string }
              type: { $ref: '#/components/schemas/IncidentType' }
              stopSeq: { type: [integer, 'null'] }
              state: { type: string, enum: [OPEN, RESOLVED] }
              description: { type: string }
              resolution: { type: [string, 'null'] }
              raisedAt: { type: string, format: date-time }
              resolvedAt: { type: [string, 'null'], format: date-time }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
    TripPage:
      type: object
      required: [items, page, size, hasNext]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Trip' } }
        page: { type: integer }
        size: { type: integer }
        hasNext: { type: boolean }
    DepartureFact:
      type: object
      properties:
        departureId: { type: string }
        tripId: { type: string }
        vehicleId: { type: string }
        driverId: { type: string }
        cdcId: { type: string }
        departedAt: { type: string, format: date-time }
        source: { type: string, enum: [REAL, SIMULATED] }
        trfCompositions:
          type: array
          items:
            type: object
            properties:
              trfId: { type: string }
              mfcId: { type: string }
              lpns: { type: array, items: { type: string } }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
