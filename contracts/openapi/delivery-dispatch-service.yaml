  /deliveries/{deliveryId}/dispatch:
    get:
      tags: [deliveries]
      summary: 배송 배차 조회 (배차 상태·배정 라이더·시도 이력; 점원·라이더·운영자)
      description: |
        배송 수행 상태(GET /deliveries/{deliveryId})는 delivery-execution-service 소유. 이 작업은 배차 관점만 반환한다.
        볼 수 있는 사람: 배정받았거나 제안받은 라이더(남의 제안은 안 보임), 그 센터 운영자, OPERATOR_ADMIN, 라이더 운영 RIDER_OPS·고객센터 CS_AGENT(0.3.2, 2026-11-15 BOD-1·2 — 상담원은 조회만), 서비스. 아니면 403.
      operationId: getDeliveryDispatch
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /deliveries/{deliveryId}/assignment-cancellations:
    post:
      tags: [deliveries]
      summary: 배차 취소 (픽업 전 재배차 / 픽업 후 지원센터 처리)
      description: |
        픽업 전(인계 미확정)이면 배정을 해제하고 상품은 점포에 남는다(원문 §5.4). reassign=true(기본)면 다시 배차 대기 + 새 시도(취소한 라이더는 뺀다) + DeliveryAssignmentChanged(newRiderId null, reason CANCELLED_<사유> — MFC 는 이전 라이더 인계를 막는다). reassign=false 면 DeliveryCancelledBeforePickup. 인계 fence는 mfc-fulfillment가 해제.
        응답 resultId = 재배차 시도 ID(reassign=false 면 배송 ID). 2026-11-13 구현.
        픽업 후(PackageHandedOver 수신)면 취소 불가 → 422 PICKED_UP_CASE_REQUIRED, case-service 지원센터로 안내.
        라이더 측 반복 배차취소는 DeliveryIncidentRaised 집계로 rider-service에 전달된다.
        요청자: 배정된 라이더 본인, 그 센터 운영자·OPERATOR_ADMIN·라이더 운영 RIDER_OPS(0.3.2, BOD-1 — 사유 OPERATOR 면 approvalRef 필수), 서비스. 고객센터 CS_AGENT 는 취소하지 않는다(ADR-0060).
      operationId: createAssignmentCancellation
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestedBy, reason]
              properties:
                requestedBy: { type: string, enum: [RIDER, STORE_STAFF, OPERATOR, ORCHESTRATION] }
                reason: { type: string, enum: [RIDER_UNABLE, STORE_REQUEST, ORDER_CANCELLED, NO_SHOW, OPERATOR] }
                reasonDetail: { type: string, maxLength: 300 }
                reassign: { type: boolean, default: true, description: 픽업 전 취소 후 재배차 여부 }
                approvalRef: { type: string, description: OPERATOR 사유일 때 필수 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: PICKED_UP_CASE_REQUIRED (픽업 후) / APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /deliveries/{deliveryId}/assignment-cancellations/{requestId}:
    get:
      tags: [deliveries]
      summary: 배차 취소 결과 조회
      description: 요청한 본인, 그 센터 운영자, OPERATOR_ADMIN, CS_AGENT, RIDER_OPS(0.3.2), 서비스. 볼 수 없으면 404.
      operationId: getAssignmentCancellation
      x-pmart-user-types: [RIDER, OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 취소를 요청한 쪽(라이더·점원·운영자)의 조회로 봄"
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  state: { type: string, enum: [PENDING, CANCELLED_BEFORE_PICKUP, REJECTED_PICKED_UP, UNKNOWN] }
                  reassignAttemptId: { type: string }
                  caseId: { type: string }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /dispatch-staff-actions:
    get:
