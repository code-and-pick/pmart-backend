  /dispatch-delays:
    get:
      tags: [dispatch-delays]
      summary: (0.12.0) 배차 지연 배송 — 픽업 전, 약속보다 늦을 것으로 본 배송 (MFC·고객센터)
      x-added-in: '2026-11-19'
      description: |
        2026-11-19 사용자 "1,2,3 전부"(원문 §3.6 "배차지연시간이 일정기준을 넘으면 MFC관리자·고객센터에 안내", "배차 불가로 취소해야 할 시 환불 및 쿠폰").
        DispatchDelayed 를 낸 배송(delayAlertedAt 있음) 중 아직 픽업 전(CREATED·DISPATCHING·ASSIGNED)인 것, 약속 시각이 이른 것부터. 그 센터 운영자(mfcId 필수)·OPERATOR_ADMIN·CS_AGENT·RIDER_OPS.
        MFC 백오피스는 여기서 "배차 불가 취소"(claim — 전액 환불 + 쿠폰)로 간다. 주문번호·배송 번호는 orderId 로(order·execution 화면 번호 조회).
      operationId: listDispatchDelays
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
