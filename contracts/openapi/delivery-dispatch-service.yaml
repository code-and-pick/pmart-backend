    post:
      tags: [internal]
      summary: "[mfc-fulfillment/claim→dispatch] 배송 생성 (ShipmentReady 배송 단위 / 회수 / 교환 재배송)"
      description: |
        같은 shipmentId(또는 claimId+type)로는 1건만 생성(멱등). 분할·회수·재배송은 각각 별도 deliveryId이며 orderId로 연결.
        type RETURN은 ReturnPickupRequested, type RESHIPMENT는 ExchangeReshipmentApproved 근거. 주문이 취소되었으면 422 ORDER_CANCELLED.
        autoDispatch=true면 생성 즉시 자동 배차 시도를 시작한다.
      operationId: createDeliveryInternal
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeliveryRequest' }
      responses:
        '201':
          description: 생성 또는 기존 배송 반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: ORDER_CANCELLED / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/riders/{riderId}/active-deliveries:
    get:
      tags: [internal]
      summary: '[rider-auth→dispatch] 라이더가 맡고 있는 배송 (0.3.3 — 정지·계약 종료 라이더 로그인 끊기 시점)'
      x-added-in: '2026-11-15'
      description: |
        ASSIGNED·PICKED_UP(배정됐고 아직 끝나지 않은) 배송. 정지(SUSPENDED)·계약 종료(TERMINATED) 라이더는 픽업 전 배정이 풀리고(RiderRestricted 처리) 픽업한 배송만 남는다 —
        rider-auth-service 가 이 수가 0 이 되면 로그인을 끊는다(사용자 2026-11-15 "추천대로" — 진행 중 배송이 끝난 뒤 끊기). 포장을 일부만 넘겨받은 ASSIGNED 도 들어간다.
        가입하지 않은·없는 라이더도 빈 목록(200).
      operationId: getRiderActiveDeliveries
      parameters:
        - { name: riderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [riderId, deliveryIds]
                properties:
                  riderId: { type: string }
                  deliveryIds: { type: array, items: { type: string } }

  /internal/deliveries/{deliveryId}/redelivery-releases:
    post:
      tags: [internal]
      summary: "[orchestration→dispatch] 오배송 다시 배송 결제됨 — 배차 풀기 (ADR-0065, 0.4.3)"
      description: |
        200m 이상이라 결제를 기다리던 다시 배송(purpose MISDELIVERY_REDELIVERY, paymentRequired)을 배차 대상으로 푼다 — 바로 판단 주기에 들어가고
        약속 = 풀린 때 + 50분. 이미 풀렸으면 같은 결과(멱등). 다시 배송이 아니거나 결제가 필요 없거나 이미 취소됐으면 409 INVALID_STATE.
      operationId: releaseRedelivery
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseId]
              properties:
                caseId: { type: string }
                paymentAttemptId: { type: string, description: '결제된 9,000원 결제 시도(기록용)' }
      responses:
        '200':
          description: APPLIED (resultId = deliveryId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/deliveries/{deliveryId}/redelivery-cancellations:
    post:
      tags: [internal]
      summary: "[orchestration→dispatch] 오배송 다시 배송 결제 안 됨 — 회수로 바꾸기 (ADR-0065, 0.4.3)"
      description: |
        결제 대기 중인 다시 배송을 픽업 전 취소(DeliveryCancelledBeforePickup reason MISDELIVERY_REDELIVERY_<reason>)하고, 잘못 간 상품을
        MFC 로 가져오는 회수 배송(DD-2 와 같음 — 원래 라이더 제외)을 만든다. 환불(상품값 − 9,000원)은 orchestration 이 한다.
        이미 바꿨으면 같은 결과(멱등, resultId = 회수 배송 ID). 결제 대기가 아니면(풀림·배정·다시 배송 아님) 409 INVALID_STATE.
      operationId: cancelRedelivery
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseId, reason]
              properties:
                caseId: { type: string }
                reason: { type: string, enum: [TIMED_OUT, DECLINED], description: 'TIMED_OUT 30분 안에 결제 안 함, DECLINED 고객이 회수 후 환불을 고름' }
      responses:
        '200':
          description: APPLIED (resultId = 회수 배송 ID)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/deliveries/{deliveryId}/route-points:
    get:
      tags: [internal]
      summary: "[tracking→dispatch] 배송의 픽업지·도착지 좌표 (ETA 계산 — TR-1, 0.4.4)"
      description: |
        delivery-tracking 이 ETA(DeliveryEtaUpdated)를 계산할 때만 쓴다(서비스 간 전용, 응답 저장 금지 — 진행 중 배송 동안만, 로그 금지).
        pickup = 회수지·잘못 둔 곳(회수·다시 배송) 또는 MFC, drop = 고객 배송지(회수는 MFC), pickupToDropS = 픽업지 → 도착지 도로 시간(배차가 잰 값).
        좌표가 아직 준비되지 않았으면 404 ROUTE_POINTS_NOT_READY.
      operationId: getDeliveryRoutePoints
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string }, description: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [deliveryId, pickup, drop]
                properties:
                  deliveryId: { type: string }
                  pickup: { $ref: '#/components/schemas/LatLng' }
                  drop: { $ref: '#/components/schemas/LatLng' }
                  pickupToDropS: { type: integer, minimum: 0 }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/deliveries/{deliveryId}/incident-distance:
    get:
      tags: [internal]
      summary: "[execution→dispatch] (0.9.0) 사고 지점까지 간 거리 — 사고 수행료(거리 비율)"
      description: |
        2026-11-18 사용자 "사고나면 배달료는 이동시점까지의 거리를 계산해서 지급" → "원래 금액을 거리 비율로". execution 이 사고(RIDER_INCIDENT)
        실패를 확정할 때 부른다 — 수행료 = 수락 금액 × min(1, distanceM ÷ 수락 당시 MFC → 고객 거리).
        사고 지점 = `at`(실패 등록 시각)에 가장 가까운 배정 라이더 위치 점(tracking location-at, 앞뒤 3분), 없으면 마지막으로 받은 위치(픽업 뒤에 받은 점만).
        distanceM = MFC → 사고 지점 도로 거리(배차가 쓰는 같은 거리 행렬). 좌표는 응답에 싣지 않는다.
        잴 수 없으면 404 — DELIVERY_NOT_FOUND / INCIDENT_POINT_NOT_FOUND(픽업 전·위치 없음) / NO_MFC_COORDINATES / NO_ROUTE. 호출자는 산정 불가(지원센터 조정)로 둔다.
      x-added-in: '2026-11-18'
      operationId: getDeliveryIncidentDistance
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: at, in: query, required: true, schema: { type: string, format: date-time }, description: 실패 등록 시각 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deliveryId, distanceM, source, recordedAt]
                properties:
                  deliveryId: { type: string }
                  distanceM: { type: integer, minimum: 0, description: MFC → 사고 지점 도로 거리(m) }
                  source: { type: string, enum: [LOCATION_AT, LAST_LOCATION], description: 등록 시각의 위치 점 / 마지막으로 받은 위치 }
                  recordedAt: { type: string, format: date-time, description: 쓴 위치 점의 시각 }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/deliveries/{deliveryId}/sequence:
    get:
      tags: [internal]
      summary: "[execution→dispatch] (0.10.1) 같은 주문의 몇 번째 배송(화면 배송 번호 순번 — ADR-0070)"
      description: |
        execution 이 DeliveryCreated.deliverySeq 를 받지 못한 배송(0.10.0 배포 전 배송·놓친 사건)의 순번을 채울 때 부른다. 없는 배송 404.
      x-added-in: '2026-11-18'
      operationId: getDeliverySequence
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deliveryId, deliverySeq]
                properties:
                  deliveryId: { type: string }
                  deliverySeq: { type: integer, minimum: 1 }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/deliveries/{deliveryId}/assignment:
    get:
      tags: [internal]
      summary: "[orchestration S3/execution→dispatch] 배정 상태 조회 (배정 라이더·픽업 전/후 판정 근거)"
      operationId: getDeliveryAssignment
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    OfferOrderInfo:
      type: object
      x-added-in: '2026-11-16'
      properties:
        orderId: { type: string }
        orderNumber: { type: [string, 'null'], description: '화면용 주문번호(숫자 8자리 — order). 고객·MFC·상담원과 같은 번호', x-added-in: '2026-11-16' }
        mfcName: { type: [string, 'null'], description: 픽업 지점 이름(center-master) }
        mfcAddress: { type: [string, 'null'], description: 픽업 지점 주소(center-master) }
        mfcPhone: { type: [string, 'null'], description: '픽업 지점 전화(center-master profile, 0.5.2 — 라이더 "가게 전화"). 등록 안 됐으면 null', x-added-in: '2026-11-17' }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              optionLabel: { type: [string, 'null'] }
              qty: { type: integer }
              lineAmount: { type: integer }
        itemAmount: { type: integer }
        deliveryNote: { type: [string, 'null'], description: 고객 배송 요청사항 }
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    DeliveryType:
      type: string
      enum: [FORWARD, RETURN, RESHIPMENT]
    DispatchState:
      type: string
      description: |
        CREATED 배송 생성. DISPATCHING 제안 진행. ASSIGNED 라이더 확정. PICKED_UP 인계 확정(PackageHandedOver). CANCELLED_BEFORE_PICKUP 픽업 전 취소.
        DISPATCH_FAILED 기사 없음/반복 거절/만료/장애. CLOSED 수행 종료(execution 결과 반영). BLOCKED 주문 취소로 신규 배차 차단.
      enum: [CREATED, DISPATCHING, ASSIGNED, PICKED_UP, CANCELLED_BEFORE_PICKUP, DISPATCH_FAILED, CLOSED, BLOCKED]
    PackageSpec:
      type: object
      properties:
        packagingMinutes: { type: integer, description: 포장 소요시간 }
        weightG: { type: integer }
        volumeL: { type: number }
        bagCount: { type: integer }
        containsAlcohol: { type: boolean }
        coldChain: { type: boolean }
        packageIds: { type: array, items: { type: string } }
    DispatchRequest:
      type: object
      required: [deliveryId, mfcId]
      properties:
        deliveryId: { type: string }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        packageSpec: { $ref: '#/components/schemas/PackageSpec' }
        estimatedFee: { $ref: '_common.yaml#/components/schemas/Money', description: 예상 배달료(참고) }
        note: { type: string, maxLength: 200 }
    CreateDeliveryRequest:
      type: object
      required: [type, orderId, mfcId, dropAddressRef]
      properties:
        type: { $ref: '#/components/schemas/DeliveryType' }
        orderId: { type: string }
        shipmentId: { type: string, description: FORWARD/RESHIPMENT일 때 order 이행 계획 배송 단위 }
        claimId: { type: string, description: RETURN/RESHIPMENT일 때 }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        dropAddressRef: { type: string, description: 원주문 주소 참조(회수·재배송도 원주문 주소 고정) }
        arrivalWindow:
          type: object
          properties:
            date: { type: string, format: date }
            start: { type: string }
            end: { type: string }
        packageSpec: { $ref: '#/components/schemas/PackageSpec' }
        autoDispatch: { type: boolean, default: true }
    Offer:
      type: object
      properties:
        offerId: { type: string }
        attemptId: { type: string }
        deliveryId: { type: string }
        riderId: { type: string }
        radiusKm: { type: number }
        sentAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: sentAt + 1분 }
        remainingSec:
          type: integer
          minimum: 0
          description: 응답 생성 시점 서버 기준 남은 응답 시간(초). SENT 가 아니면 0
          x-added-in: '2026-10-24'
        state: { type: string, enum: [SENT, ACCEPTED, REJECTED, EXPIRED, LATE, SEND_FAILED, SUPERSEDED] }
        viewedAt: { type: [string, 'null'], format: date-time, description: 라이더가 처음 상세를 연 시각(원문 §4.4), x-added-in: '2026-11-13' }
        source: { type: string, enum: [AI_RECOMMENDED, DELIVERY_LIST], description: 'AI 추천 제안 / 배달리스트 수락 기록', x-added-in: '2026-11-13' }
        bundleId: { type: [string, 'null'], description: '알뜰배달 묶음 — 같은 값의 제안은 한 번에 수락·거절', x-added-in: '2026-11-13' }
        bundleSize: { type: integer, minimum: 1, maximum: 3, description: '묶음 배송 수(묶음 아니면 1)', x-added-in: '2026-11-13' }
        stopSequence: { type: integer, minimum: 1, description: '묶음 안 고객 방문 순서(1부터)', x-added-in: '2026-11-13' }
        deliveryType: { $ref: '#/components/schemas/DeliveryType' }
        purpose: { $ref: '#/components/schemas/DeliveryPurpose' }
        summary:
          type: object
          description: 라이더 표시용 (타 고객 주소 비노출). 회수 배송(RETURN)이면 distanceKm = 회수지 → MFC, pickupDistanceKm·pickupEtaSeconds = 라이더 → 회수지, dropAreaLabel = 회수지 근처 동
          properties:
            mfcId: { type: string }
            dropAreaLabel: { type: string, description: 배송지 동 이름까지(예 서초구 서초동) }
            distanceKm: { type: number, description: 'MFC → 고객 도로 거리(카카오모빌리티)' }
            pickupDistanceKm: { type: number, description: '라이더 → MFC 도로 거리', x-added-in: '2026-11-13' }
            pickupEtaSeconds: { type: integer, description: '라이더 → MFC 예상 소요(초)', x-added-in: '2026-11-13' }
            dropEtaSeconds: { type: integer, description: '픽업지 → 전달지 예상 소요(초, 도로 — 카카오모빌리티). 라이더 앱 요청 §3', x-added-in: '2026-11-16' }
            pickupPoint:
              allOf: [{ $ref: '#/components/schemas/LatLng' }]
              description: '픽업지 좌표 — MFC 는 정확한 값, 회수·다시 배송(고객이 있는 곳)은 dropAreaPoint 처럼 약 1km 격자로 반올림. 라이더 앱 요청 §3'
              x-added-in: '2026-11-16'
            dropAreaPoint:
              allOf: [{ $ref: '#/components/schemas/LatLng' }]
              description: '전달지 **대략** 좌표 — 소수 둘째 자리(약 1km 격자)로 반올림한 값(동 단위 지도 핀·직선용). 정확한 주소는 지금처럼 픽업 뒤 drop-info. 라이더 앱 요청 §3'
              x-added-in: '2026-11-16'
            order:
              allOf: [{ $ref: '#/components/schemas/OfferOrderInfo' }]
              description: '주문 요약(라이더 앱 요청 §1 — 사용자 결정 2026-11-16 "수락 전부터 전부"). 좌표를 준비할 때 한 번 받아 둔 값, 못 받았으면 없음. 회수 배송은 없음'
              x-added-in: '2026-11-16'
            weightG: { type: integer }
            bagCount: { type: integer, x-added-in: '2026-11-13' }
            containsAlcohol: { type: boolean }
            deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED], x-added-in: '2026-11-13' }
            estimatedFee: { $ref: '_common.yaml#/components/schemas/Money', description: '예상 배달료 — 원문 §7.1 수단·거리 표(제안 당시 금액 기록)' }
    DeliveryListItem:
      type: object
      x-added-in: '2026-11-13'
      properties:
        deliveryId: { type: string }
        mfcId: { type: string }
        dropAreaLabel: { type: string }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        straightDistanceKm: { type: number, description: '내 위치 → MFC 직선거리(목록 정렬·반경 판정)' }
        distanceKm: { type: number, description: 'MFC → 고객 도로 거리' }
        estimatedFee: { $ref: '_common.yaml#/components/schemas/Money' }
        weightG: { type: integer }
        bagCount: { type: integer }
        containsAlcohol: { type: boolean }
        readyAt: { type: string, format: date-time, description: 출하 대기(예상) 시각 }
    OfferResponseResult:
      type: object
      required: [offerId, outcome]
      properties:
        offerId: { type: string }
        outcome: { type: string, enum: [ASSIGNED, REJECTED, LATE] }
        lateReason:
          type: string
          description: outcome=LATE일 때 분류
          enum: [EXPIRED, ALREADY_ASSIGNED, ORDER_CANCELLED, INELIGIBLE]
        deliveryId: { type: string }
        assignmentId: { type: string }
        consecutiveRejections: { type: integer }
        rejectionNotice: { type: boolean, description: 연속 거절 5회 안내 여부 }
        decidedAt: { type: string, format: date-time }
    DispatchAttempt:
      type: object
      properties:
        attemptId: { type: string }
        requestId: { type: string }
        deliveryId: { type: string }
        trigger: { type: string, enum: [AUTO, STORE_STAFF, REASSIGN, RETRY] }
        state: { type: string, enum: [SEARCHING, OFFERING, ASSIGNED, FAILED, CANCELLED] }
        currentRadiusKm: { type: number }
        retryCount: { type: integer, description: 최대 2회 }
        startedAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time, description: 시작 + 10분 }
        failureReason: { type: string, enum: [NO_RIDER, REPEATED_REJECTION, EXPIRED, SYSTEM_FAILURE] }
        splitCount: { type: integer, description: 규격 초과 시 추가 라이더 수 }
        offers: { type: array, items: { $ref: '#/components/schemas/Offer' } }
    Assignment:
      type: object
      properties:
        assignmentId: { type: string }
        deliveryId: { type: string }
        orderId: { type: string, description: '0.4.1 — 내부 조회에만(orchestration 재발송 사가)', x-added-in: '2026-11-16' }
        mfcId: { type: string, description: '0.4.1', x-added-in: '2026-11-16' }
        riderId: { type: string }
        vehicleType: { type: [string, 'null'], description: '(0.11.1, 2026-11-19 MFC 시뮬레이터 R-24) 수락한 제안의 차종 — 제안 없이 배정됐으면 null' }
        state: { type: string, enum: [ASSIGNED, PICKED_UP, CANCELLED, COMPLETED] }
        assignedAt: { type: string, format: date-time }
        bundleId: { type: [string, 'null'], description: 알뜰배달 묶음, x-added-in: '2026-11-13' }
        stopSequence: { type: [integer, 'null'], description: 묶음 안 방문 순서, x-added-in: '2026-11-13' }
        pickedUpAt: { type: string, format: date-time, description: PackageHandedOver 수신 시각 }
        handoverIds: { type: array, items: { type: string } }
        cancelledAt: { type: string, format: date-time }
        version: { type: integer }
    Delivery:
      type: object
      properties:
        deliveryId: { type: string }
        version: { type: integer }
        type: { $ref: '#/components/schemas/DeliveryType' }
        orderId: { type: string }
        shipmentId: { type: string }
        claimId: { type: string }
        mfcId: { type: string }
        state: { $ref: '#/components/schemas/DispatchState' }
        packageSpec: { $ref: '#/components/schemas/PackageSpec' }
        arrivalWindow:
          type: object
          properties:
            date: { type: string, format: date }
            start: { type: string }
            end: { type: string }
        assignment: { $ref: '#/components/schemas/Assignment' }
        attempts: { type: array, items: { $ref: '#/components/schemas/DispatchAttempt' } }
        delayAlertedAt: { type: string, format: date-time, description: 배차 지연 임계 알림 시각 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        purpose: { $ref: '#/components/schemas/DeliveryPurpose' }
        recovery: { $ref: '#/components/schemas/RecoveryInfo' }
    DeliveryPurpose:
      type: string
      x-added-in: '2026-11-16'
      description: DELIVERY 일반 배송, CLAIM_RETURN 고객 반품 회수(0.5.0 — 고객 집에서 받아 MFC 로), MISDELIVERY_RECOVERY 확인된 오배송 회수(DD-2), MISDELIVERY_RESHIPMENT 오배송 재발송(0.4.1), MISDELIVERY_REDELIVERY 고객 잘못 오배송 다시 배송(0.4.2 — 잘못 둔 곳 → 실제 집)
      enum: [DELIVERY, CLAIM_RETURN, MISDELIVERY_RECOVERY, MISDELIVERY_RESHIPMENT, MISDELIVERY_REDELIVERY, FAILED_DELIVERY_RETURN]
    RecoveryInfo:
      type: object
      x-added-in: '2026-11-16'
      description: 회수 배송 — 오배송 회수(DD-2)·고객 반품 회수(0.5.0, CLAIM_RETURN). pickup 좌표는 배정된 라이더·운영자(그 센터·OPERATOR_ADMIN·RIDER_OPS·CS_AGENT)에게만 — 제안받기만 한 라이더에게는 비운다.
      properties:
        caseId: { type: string, description: 오배송 확인 사건 }
        claimId: { type: string, description: '고객 반품 클레임(0.5.0 — CLAIM_RETURN 일 때). 반품 회수의 pickup.source 는 DROP_ADDRESS(고객 집)', x-added-in: '2026-11-17' }
        originDeliveryId: { type: string, description: 오배송된 원래 배송 }
        originRiderId: { type: string, description: 원래 라이더(이 라이더는 회수 후보에서 뺀다) — 운영자에게만 }
        pickup:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }
