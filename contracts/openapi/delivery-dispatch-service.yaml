      x-added-in: '2026-11-18'
      description: |
        2026-11-18 라이더 백오피스 요청 #4(사용자 "응 전부 진행해"). 이 라이더가 수락(또는 바로 배정)한 배송마다 한 줄, 배정 최신순.
        outcome: CURRENT(지금 이 라이더 — 진행 중) / DONE(이 라이더로 끝남 — 배차 CLOSED) / RELEASED(배정이 풀림 — 배차 취소면 cancellation 에 요청자·사유,
        계정 제한·재배정처럼 취소 기록이 없으면 cancellation null) / CANCELLED(배송이 픽업 전 취소). 개인정보 없음. 그 밖 직원 403.
      operationId: listRiderAssignmentsForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: riderId, in: query, required: true, schema: { type: string, maxLength: 64 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
