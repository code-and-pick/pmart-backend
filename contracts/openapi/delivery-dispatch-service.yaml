                        mfcId: { type: [string, 'null'] }
                        type: { type: [string, 'null'] }
                        purpose: { type: [string, 'null'] }
                        offerId: { type: string }
                        source: { type: string, description: 'AI_RECOMMENDED 제안 수락 / DELIVERY_LIST 목록에서 수락 / FAILED_RETURN 전달 실패 반납 바로 배정' }
                        fee: { type: [integer, 'null'] }
                        assignedAt: { type: string, format: date-time }
