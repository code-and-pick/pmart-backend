        이 서비스에 이미 남은 기록만: 운영자 배차 취소(assignment_cancellation — requested_by OPERATOR). 기간 기본 최근 7일(from·to, 최대 31일), 최근 것 먼저, cursor = 건너뛸 수.
      operationId: listDispatchStaffActions
