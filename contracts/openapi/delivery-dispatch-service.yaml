openapi: 3.1.0
info:
  title: delivery-dispatch-service
  version: 0.13.0
  description: |
    배송(delivery, 독립 배송번호; 분할·회수·재배송 각각 별도 번호·원주문 연결), 배차 요청, 배차 시도(attemptId)·제안(offerId)·응답, 반경 단계 탐색(1km→2km→3km [외부 참고값]), 응답 대기 1분, 동시 수락 1명 확정, 재시도(최대 2회·10분 [외부 참고값]), 배차 취소, 늦은 수락 분류의 정본. (docs/architecture/service-map.md §7)
    라이더 정본(rider), 수행 상태(execution), 인계 확정(mfc-fulfillment), 주문 취소(order/claim), 배달료 정산(execution)은 소유하지 않는다.
    취소된 주문에는 신규 배차를 차단한다. 픽업 후 배차 취소는 지원센터(case) 경로다.
    2026-11-13(ADR-0058·사용자 결정): 배차 방식은 AI 추천(서버가 제안)과 일반(배달리스트에서 골라 수락) 두 가지. 반경 단계는 라이더 탐색·제안 정책이고 반경은 MFC 중심 직선거리.
    도로 거리·시간은 delivery-tracking 거리 행렬(카카오모빌리티). AI 추천 계산은 Python AI 최적화 서버 전까지 OR-Tools 배정. 배차 가능 시간 08~24시(Asia/Seoul).
    배송 생성은 MFC 사건(DispatchRequested·ShipmentReady, mfc.fulfillment.v1)으로 한다 — 출고(shipmentId)당 배송 하나. 배차는 점원 요청(DispatchRequested)으로만 시작한다(BR-51).
    0.4.0(2026-11-16, DD-2 — 사용자 "추천대로"): **확인된 오배송 회수 배차**. case `MisdeliveryConfirmed`(platform.case.v1)를 받아 회수 배송(type RETURN, purpose MISDELIVERY_RECOVERY)을 만들고 곧바로 배차한다.
      회수지 = 원래 라이더가 전달 완료를 누른 곳(tracking 위치 기록, 없으면 원래 배송지 좌표), 도착지 = MFC. 후보는 원래 라이더를 뺀 AI 추천 모드 라이더 중 **회수지 중심 직선 반경**(같은 단계) 안, 회수지까지 도로 시간이 가장 짧은 사람. 묶지 않는다. 배달리스트에는 나오지 않는다.
      예상 배달료는 일반 표(원문 §7.1) 그대로 — 거리 = 회수지 → MFC 도로 거리. 회수 배송의 제안·조회에서 distanceKm 는 회수지 → MFC, pickupDistanceKm·pickupEtaSeconds 는 라이더 → 회수지.
      회수지 좌표는 사건에 싣지 않고 `GET /deliveries/{id}/dispatch` 의 `recovery` 로만(배정된 라이더·운영자). 회수 실패(부재·거부)는 도움요청 → 지원센터, 운영자 배차 취소(reassign=false)로 끝낸다.
    0.4.1(2026-11-16, 오배송 재발송 — ADR-0052 결정 4, 사용자 "새상품 재배차 서비스 넣어" → "전부 PR로"): MFC 재발송 출고(DispatchRequested·ShipmentReady 의 purpose MISDELIVERY_RESHIPMENT·caseId)로 만든 배송은 type RESHIPMENT·purpose MISDELIVERY_RESHIPMENT·caseId. 배송 약속 = 오배송 확인(같은 사건 회수 배송이 생긴 때, 없으면 이 배송이 생긴 때) + 50분. 배차는 일반 배송과 같다(주소·배송 방식은 주문 그대로).
      내부 배정 조회 `GET /internal/deliveries/{id}/assignment` 에 orderId·mfcId(orchestration 재발송 사가가 배송으로 주문을 찾는다).
    0.5.1(2026-11-17, DD-3 맞춤 — PC 1 요청서): 배송 하나 = claim 회수 요청 하나(`pickupRequestId`, DeliveryCreated 에 실음). **원래 배송이 전달 완료 전이면 반품 회수를 만들지 않는다**(사용자 "배달 중이나 전달 완료 전에는 반품 불가" — claim 접수가 정본, 여기서는 경고만). 회수 줄은 claimLineId·sku 까지 그대로.
    0.5.0(2026-11-17, CL-1 배송 쪽 — 사용자 결정 "바로 배차·일반 표(고객 집 → MFC)·실패마다 알림, 다시 시도는 반품 쪽"): **고객 반품 회수 배차**. claim `ReturnPickupRequested`(order.claim.v1)를 받아 회수 배송(type RETURN, purpose CLAIM_RETURN, shipment `CLR-<사건 ID>`)을 만들고 곧바로 배차한다 — 회수지 = 고객 집(원래 배송지 좌표, 없으면 주문 배송지), 도착 = MFC, 예상 배달료 = 일반 표(고객 집 → MFC). 원래 기사도 근처면 받을 수 있다. 같은 클레임에 진행 중인 회수 배송이 있으면 새로 만들지 않는다. 회수 실패(`ReturnPickupFailed`)·반납(`ReturnDelivered`)이면 배차 끝. 조회 `recovery.claimId`.
    0.4.2(2026-11-16, ADR-0065 고객 잘못): MisdeliveryConfirmed fault CUSTOMER·REDELIVER → 다시 배송(type RESHIPMENT, purpose MISDELIVERY_REDELIVERY, shipment `RDL-<caseId>`) — 픽업 = 잘못 둔 곳(회수와 같은 방법), 도착 = 상담원이 기록한 실제 집(order 내부 조회 → 좌표).
      0.4.5(같은 날, 라이더 앱 요청 §3): 제안 요약에 dropEtaSeconds(픽업지 → 전달지)·pickupPoint·dropAreaPoint(약 1km 격자로 반올림한 대략 좌표).
      0.4.4(같은 날, TR-1): 내부 `GET /internal/deliveries/{id}/route-points`(픽업지·도착지 좌표, tracking ETA 계산 전용).
      0.4.3(같은 날, 4단계): 결제 대기 다시 배송을 orchestration 이 `POST /internal/deliveries/{id}/redelivery-releases`(결제됨 → 배차, 약속 = 풀린 때 + 50분) 또는 `…/redelivery-cancellations`(30분·거절 → 픽업 전 취소 + MFC 회수 배송)로 끝낸다.
      잘못 둔 곳 ↔ 실제 집 **직선 200m 미만**: 원래 기사에게 먼저 제안(배달료 0, 반경 상관없음) — 못 받거나 거절·만료면 근처 다른 라이더(일반 표). **200m 이상**: 결제 대기 — `RedeliveryPaymentRequired`(9,000원) 사건을 내고 결제 확인까지 배차하지 않는다(orchestration·고객 앱 결제는 4단계). 배달리스트에 안 나온다.
    알뜰배달(deliveryMode BUNDLED)은 같은 MFC 의 알뜰배달 1~3건을 한 라이더에게 묶어 제안한다(원문 §5.3, 사용자 2026-11-13 '묶음 배정으로 진행'). 묶음의 제안은 배송마다 한 줄이고 bundleId·stopSequence(방문 순서)가 같다 — 하나를 수락·거절하면 묶음 전체에 적용된다. 한집·예약배달은 묶지 않는다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: dispatch-requests, description: 점원 배차 요청 (점포 단말) }
  - { name: offers, description: 라이더 제안 응답 }
  - { name: deliveries, description: 배송 조회·배차 취소 }
  - { name: internal, description: 서비스 간 (mfc-fulfillment / claim / orchestration) }
  - { name: delivery-list, description: 일반 배차모드 배달리스트 (라이더가 골라 수락 — 원문 §2.4) }

paths:
  /dispatch-requests:
    post:
      tags: [dispatch-requests]
      summary: 점원 배차 요청 (배송번호·점포·배송지·포장 소요시간·부피/무게/봉투 수·주류·예상 배달료)
      description: |
        ShipmentReady로 생성된 delivery에 대해 점원이 수동으로 배차를 요청한다(자동 배차와 병행). 같은 deliveryId의 진행 중 배차 시도가 있으면 기존 시도 반환.
        주문이 취소되었으면 422 ORDER_CANCELLED. 규격(무게·부피)이 단일 라이더 용량을 넘으면 추가·분할 배차(splitCount)로 응답.
      operationId: createDispatchRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchRequest' }
      responses:
        '202':
          description: 배차 시도 시작 (resultId = attemptId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (이미 배정·완료) / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: ORDER_CANCELLED (신규 배차 차단) / CONFIG_REQUIRED (요율·반경 미설정)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /dispatch-requests/{requestId}:
    get:
      tags: [dispatch-requests]
      summary: 배차 요청 결과 조회 (시도·제안·응답 이력)
      operationId: getDispatchRequest
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 배차를 요청한 점원의 조회로 봄"
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchAttempt' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /offers:
    get:
      tags: [offers]
      summary: 라이더 본인 활성 제안 목록 (응답 대기 중인 제안·남은 응답 시간)
      description: |
        pmart-clients BR-06. 호출자 라이더 본인의 제안만 반환한다(riderId 파라미터 없음). 토큰 주체 → riderId 대응은 라이더 로그인(BR-02) 결정을 따른다.
        state 를 생략하면 SENT 이면서 expiresAt 이 지나지 않은 제안만 반환한다. state 를 지정하면 만료 여부로 거르지 않는다.
        판정은 서버 시각 기준이므로 남은 시간은 remainingSec 또는 serverTime 과 expiresAt 의 차이로 표시한다.
        이 조회는 푸시 수신 여부와 무관하게 offerId 를 얻는 기준 경로다(알림 유실·앱 재실행 시 복구).
        폴링 간격은 응답 pollAfterSec 을 따른다. 게이트웨이 처리율 제한은 JWT subject 단위 단일 버킷(전 경로 공용)이며, 초과 시 429 + Retry-After 다.
        푸시·SSE 전달 채널과 일반배차모드 대기 목록(Delivery-business-logic :126 대기목록화면)은 이 경로에 포함하지 않는다(BR-06 보류 항목).
      x-added-in: '2026-10-24'
      operationId: listMyOffers
      x-pmart-user-types: [RIDER]
      parameters:
        - name: state
          in: query
          description: 생략 시 SENT
          schema: { type: string, enum: [SENT, ACCEPTED, REJECTED, EXPIRED, LATE, SEND_FAILED, SUPERSEDED] }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK (sentAt 내림차순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Offer' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
                  serverTime: { type: string, format: date-time, description: 응답 생성 시 서버 시각 }
                  pollAfterSec:
                    type: [integer, 'null']
                    minimum: 1
                    description: |
                      다음 조회까지 권장 대기(초). 서버 설정값이며 잠정 기본 5초다(부하 시험 후 조정).
                      null 이면 지금은 제안을 받을 수 없는 상태(운행 종료·신규배차 OFF·하나씩 배달 진행 중·계정 제한)이므로 상태가 바뀔 때까지 폴링을 멈춘다.
                    x-added-in: '2026-10-24'
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /offers/{offerId}/responses:
    post:
      tags: [offers]
      summary: 라이더 제안 응답 (ACCEPT | REJECT)
      description: |
        응답 대기 1분. 동시 수락은 1명만 ASSIGNED, 나머지는 LATE 분류 ALREADY_ASSIGNED.
        묶음 제안(bundleId 있음)은 묶음 전체가 한 번에 판정된다 — 모두 배정되거나(ASSIGNED, 배송마다 DeliveryAssigned) 하나라도 안 되면 전체 LATE. 거절도 묶음 전체(연속 거절은 1회).
        늦은 수락은 200으로 응답하되 outcome=LATE와 lateReason(EXPIRED / ALREADY_ASSIGNED / ORDER_CANCELLED / INELIGIBLE)을 반환한다.
        거절 5회 연속 시 안내(consecutiveRejections). 라이더가 하나씩 배달하기 설정이고 진행 중 배송이 있으면 INELIGIBLE.
      operationId: respondToOffer
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: string, enum: [ACCEPT, REJECT] }
                rejectReason: { type: string, enum: [TOO_FAR, OVER_CAPACITY, PERSONAL, OTHER] }
                respondedAt: { type: string, format: date-time, description: 단말 시각(참고). 판정은 서버 수신 시각 }
      responses:
        '200':
          description: 응답 판정 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferResponseResult' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /offers/{offerId}:
    get:
      tags: [offers]
      summary: 제안 조회 (라이더 본인 제안만)
      description: 처음 조회한 시각을 viewedAt 으로 남긴다 — 상세 확인 뒤 응답 없이 만료되면 거절 횟수에 넣는다(원문 §4.4).
      operationId: getOffer
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /delivery-list:
    get:
      tags: [delivery-list]
      summary: 일반 배차모드 배달리스트 — 내 위치에서 반경 안 MFC 의 배차 대기 배송(원문 §2.4)
      description: |
        라이더 마지막 위치(delivery-tracking)에서 MFC 까지 직선거리가 그 배송의 현재 반경 단계(1→2→3km) 안인 배차 대기(DISPATCHING) 배송. 고객 주소는 동 이름까지만.
        목록 선택과 배차 확정은 다르다 — 수락은 POST /delivery-list/{deliveryId}/acceptances. 운행 중·신규배차 ON·계정 제한 없음이 아니면 빈 목록 + pollAfterSec null.
      x-added-in: '2026-11-13'
      operationId: listDeliveryList
      x-pmart-user-types: [RIDER]
      responses:
        '200':
          description: OK (MFC 까지 가까운 순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DeliveryListItem' } }
                  serverTime: { type: string, format: date-time }
                  pollAfterSec: { type: [integer, 'null'], minimum: 1 }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /delivery-list/{deliveryId}/acceptances:
    post:
      tags: [delivery-list]
      summary: 배달리스트에서 수락 (일반 배차모드 — 동시 수락은 1명만)
      description: |
        이미 다른 라이더에게 배정됐으면 outcome=LATE·ALREADY_ASSIGNED(원문 §2.4 '배차 요청 실패'). 최대 3건(원문 §2.4·§5.3), 하나씩 배달하기면 1건 — 넘으면 LATE·INELIGIBLE.
        반경 밖·배차 대기 아님도 LATE(INELIGIBLE·ORDER_CANCELLED). 성공하면 제안 수락과 같은 DeliveryAssigned.
      x-added-in: '2026-11-13'
      operationId: acceptFromDeliveryList
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
