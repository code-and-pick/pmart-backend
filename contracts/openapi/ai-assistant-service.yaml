openapi: 3.1.0
info:
  title: ai-assistant-service
  version: 1.5.0
  x-stage: 3
  x-stage-note: 1차(문서 질의응답·근거 표시)를 2026-11-04 앞당겨 구현 — ADR-0036. 도메인 API 호출·명령 위임은 후속.
  description: |
    내부 운영자용 정책·업무 절차 질의응답(RAG). 저장소의 명시 목록 문서(업무 명세·흐름·서비스 지도·ADR·상태표)를 검색해
    근거와 함께 답한다. 정본 없음(문서 사본 색인과 답변 기록만 소유). (docs/architecture/service-map.md §8, ADR-0036)

    **상태**
    - 특정 주문·재고·결제의 현재 상태는 문서로 추정하지 않는다 → `REALTIME_DATA_REQUIRED`.
    - 환불·승인·재고 변경 같은 실행 요청은 하지 않는다 → `OUT_OF_SCOPE`.
    - (1.2.0, ADR-0083) 상품의 가격·판매 여부를 묻는 질문은 search-service 상품 검색 결과를 정해진 문장으로 답한다 → `PRODUCT_INFO`
      (`answerMode` `PRODUCT_TEMPLATE`, 근거 문서 없음). 검색 결과가 없거나 검색이 안 되면 문서 검색으로 답한다. context.centerId 가 있으면
      그 센터 취급 여부를 붙인다. 실시간 재고 수량·주문 상태는 여전히 `REALTIME_DATA_REQUIRED`.
    - 근거 부족은 `NO_GROUNDING`(정상 결과). 임베딩·검색·모델 장애는 503 `DEPENDENCY_UNAVAILABLE` 로 구분하고 완료 결과를 저장하지 않는다.
    - 같은 키가 처리 중이면 202 `PROCESSING`.

    **채팅 세션**(1.3.0, ADR-0084): 질문은 채팅 세션 하나에 속한다. `sessionId` 를 주면 그 세션(본인 것만 — 아니면 404)에 이어 묻고,
    주지 않으면 새 세션을 만든다(응답 `sessionId`). 같은 세션의 앞 대화(근거 있는 완료 답변 중 질문 원문이 저장된 최근 2턴)를 참고해
    이어지는 질문("그럼 반품은?")을 이해한다 — 답의 근거는 여전히 문서뿐이다. 운영자는 자기 세션을 지울 수 있고(질문·답변째),
    마지막 질문 뒤 보존 기간(`pmart.assistant.answers.retention`, 14일)이 지난 세션은 서버가 지운다. 요청 해시는 sessionId 를 줄 때만
    `sha256(위 해시 + 줄바꿈 + "session:" + sessionId)` — 같은 키를 다른 세션에 쓰면 409.

    **멱등·재조회**: 범위는 (sourceSystem, 인증 주체 subject, Idempotency-Key). 요청 해시 = sha256(정규화 질문 + "\n" + 정규화 context)
    — 질문은 NFC·앞뒤 공백 제거·연속 공백 하나로, context 는 허용 키(screen·centerId)만 같은 정규화 후 키 정렬 JSON(없으면 `{}`).
    같은 키에 다른 해시면 409 `IDEMPOTENCY_CONFLICT`. 최초 응답을 잃으면 `GET /assistant/policy-questions?requestId=` 로 찾는다.

    **출처(X-Source-System)**: 토큰에 `src` 가 있으면 헤더와 같아야 한다. 없으면 1차는 `backoffice-web` 만 허용한다. 아니면 403.

    **인용**: 서버가 검색에 실제로 쓰인 청크의 메타데이터로 만든다(모델이 경로·버전을 지어내지 않는다). 지위(authority)·생애(lifecycleStatus)·
    구현 기록(implementationEvidence)은 서로 다른 축이다.

    **기준선 표시**: `answerMode=BASELINE_EXTRACTIVE`·`retrievalMode=BASELINE_HASH` 는 외부 모델 없이 동작하는 기준선이다
    — 파이프라인·계약은 검증되지만 의미 검색·생성 답변 품질은 검증된 것이 아니다.

    **문서 관리**(1.4.0, ADR-0092): 운영자 RAG 문서의 정본은 이 서비스 DB 다(처음 한 번 저장소에서 가져옴, `customer_app/` 은 저장소가 정본 — 읽기만).
    고치기는 초안(`/assistant/knowledge-drafts`) → approval-service `RAG_DOCUMENT` 승인 → 이 서비스가 ApprovalDecided 를 받아 기준 판·본문 해시가
    같을 때만 새 판 → 1분 주기 재색인(바뀐 조각만 임베딩). 반영 결과는 `ApplicationReceiptRecorded` 로 회신하고 `/assistant/knowledge-applications` 에 남긴다.

    **상담 도우미**(1.4.0, ADR-0093): `GET /assistant/consult-guides` — 문의 종류·회원 조회 결과·주문 상태로 본인 확인 절과 정책 근거를 찾아 준다. LLM 없음, 저장 안 함.

    **권한**: 운영자(typ=OPERATOR)만. 본문 context 는 화면 힌트일 뿐 권한·검색 범위 근거가 아니다. 저장 답변을 돌려주는 모든 경로에서
    질문한 본인 + 현재 권한(지금도 운영자, 인용 근거의 접근 범위를 지금도 가짐)을 다시 확인하고, 아니면 404.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: ops, description: 운영 정보 }
  - { name: assistant, description: 정책·업무 절차 질의(읽기 전용) }
  - { name: knowledge, description: '(1.4.0) 운영자 RAG 문서 관리 — 보기·초안, 반영은 승인으로(ADR-0092)' }
  - { name: consult, description: '(1.4.0) 상담 도우미 — 상담 접수 화면 옆 칸(ADR-0093)' }

paths:
  /actuator/health:
    get:
      tags: [ops]
      summary: 헬스 (인증 불필요)
      operationId: getAssistantHealth
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE] }

  /assistant/policy-questions:
    post:
      tags: [assistant]
      summary: 정책·업무 절차 질의 — 근거와 함께 답한다(같은 Idempotency-Key 재전송은 같은 답)
      operationId: askPolicyQuestion
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyQuestion' }
            example:
              question: 주문 취소와 라이더 인계가 겹치면 어떤 절차를 따르나요?
      responses:
        '200':
          description: 완료 — ANSWERED · NO_GROUNDING · REALTIME_DATA_REQUIRED · OUT_OF_SCOPE (· FORBIDDEN_SCOPE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyAnswer' }
              examples:
                answered: { $ref: '#/components/examples/Answered' }
                noGrounding: { $ref: '#/components/examples/NoGrounding' }
                realtime: { $ref: '#/components/examples/RealtimeRequired' }
                outOfScope: { $ref: '#/components/examples/OutOfScope' }
        '202':
          description: 같은 키가 다른 요청에서 처리 중 — Retry-After 뒤 GET ?requestId= 로 조회
          headers:
            Retry-After: { schema: { type: integer }, description: 초 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyAnswer' }
              examples:
                processing: { $ref: '#/components/examples/Processing' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: IDEMPOTENCY_CONFLICT — 같은 Idempotency-Key 를 다른 질문·context 에 썼다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONFIG_REQUIRED — 활성 문서 색인이 없다(색인 작업 전). 완료 결과 없음, 색인 뒤 같은 키로 다시 보낸다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503':
          description: DEPENDENCY_UNAVAILABLE — 임베딩·검색·모델 장애 또는 처리 시간 초과. 완료 결과 없음 → 같은 Idempotency-Key 로 다시 보낸다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    get:
      tags: [assistant]
      summary: 요청 키로 답변 찾기 — 최초 응답을 잃어 answerId 를 모를 때(범위 = 출처 + 본인 + 키)
      operationId: findPolicyAnswerByRequestId
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - name: requestId
          in: query
          required: true
          description: 질의 때 보낸 Idempotency-Key
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 완료된 답변(현재 권한 재검사 통과)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyAnswer' }
        '202':
          description: 처리 중(lease 유효) — Retry-After 뒤 다시 조회
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyAnswer' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 그 범위에 기록이 없다(처리 전 실패·다른 출처·다른 운영자·현재 권한 없음 포함, 존재를 드러내지 않는다)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_STATE(retryable=true) — 직전 시도가 실패했거나 처리 중 lease 가 만료됐다 → 같은 Idempotency-Key·같은 본문으로 POST 를 다시 보낸다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /assistant/question-history:
    get:
      tags: [assistant]
      summary: 내 질문 목록(최근 순) — 질문한 운영자 본인 + 출처(X-Source-System) 범위 (BR-46, 2026-11-04)
      description: |
        질문 원문은 기본으로 저장하지 않는다(ADR-0036, pmart.assistant.answers.store-question=false) → 그때 `question` 은 null 이고
        `answerPreview`(답변 앞부분)로 구분한다. 완료 답변은 현재 권한(인용 근거의 접근 범위)을 다시 확인해, 지금 볼 수 없는 답변은 목록에서 뺀다.
        상세는 `GET /assistant/policy-questions/{answerId}`.
      operationId: listMyPolicyQuestions
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionHistoryPage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /assistant/policy-questions/{answerId}:
    get:
      tags: [assistant]
      summary: 답변 다시 보기(근거 포함, 질문한 운영자 본인 + 현재 권한)
      operationId: getPolicyAnswer
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: answerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyAnswer' }
        '202':
          description: 처리 중(lease 유효)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyAnswer' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 없거나 다른 운영자의 답변이거나 현재 권한이 없다(존재를 드러내지 않는다)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_STATE(retryable=true) — 실패했거나 lease 만료 → 같은 키로 POST 재시도
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /assistant/chat-sessions:
    get:
      tags: [assistant]
      summary: '(1.3.0) 내 채팅 목록 — 마지막 질문 최근 순(본인 + 출처 범위, ADR-0084)'
      operationId: listMyChatSessions
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSessionPage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /assistant/chat-sessions/{sessionId}:
    get:
      tags: [assistant]
      summary: '(1.3.0) 채팅 하나 — 질문·답변을 질문 순으로(본인만). 지금 권한으로 볼 수 없는 답변·실패한 시도는 빼고 보인다'
      operationId: getMyChatSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: sessionId, in: path, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 없거나 다른 운영자의 채팅(존재를 드러내지 않는다)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    delete:
      tags: [assistant]
      summary: '(1.3.0) 내 채팅 삭제 — 질문·답변째 지운다(되돌릴 수 없음)'
      description: 본인 채팅만 지운다. 없거나 이미 지웠거나 다른 운영자의 채팅이어도 204(멱등 — 존재를 드러내지 않는다, 남의 채팅은 지우지 않는다).
      operationId: deleteMyChatSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: sessionId, in: path, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '204': { description: 지움(없어도 멱등 성공) }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  # ---- (1.4.0) 운영자 RAG 문서 관리(ADR-0092) ----
  /assistant/knowledge-documents:
    get:
      tags: [knowledge]
      summary: '(1.4.0) 운영자 RAG 문서 목록 — 판·색인 상태(본문 없음, ADR-0092)'
      description: 운영자 누구나 본다. 문서 ID 순. `reindex` 는 마지막 재색인(승인 반영 뒤 1분 주기)의 결과.
      operationId: listKnowledgeDocuments
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: includeRetired, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocumentList' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /assistant/knowledge-documents/detail:
    get:
      tags: [knowledge]
      summary: '(1.4.0) 문서 하나 — 본문(지금 판 또는 고른 판)과 판 이력'
      description: 문서 ID 에 `/` 가 있어 경로 대신 query 로 받는다.
      operationId: getKnowledgeDocument
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: documentId, in: query, required: true, schema: { type: string, maxLength: 300 } }
        - { name: version, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocumentDetail' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /assistant/knowledge-applications:
    get:
      tags: [knowledge]
      summary: '(1.4.0) 최근 승인 반영 기록(최근 순)'
      operationId: listKnowledgeApplications
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeApplicationList' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /assistant/knowledge-drafts:
    get:
      tags: [knowledge]
      summary: '(1.4.0) 내 열린 초안(최근 고친 순)'
      operationId: listMyKnowledgeDrafts
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDraftList' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [knowledge]
      summary: '(1.4.0) 초안 만들기 — 새 문서·고치기(UPSERT, 본문 전체)·내리기(RETIRE)'
      description: |
        편집 역할(`pmart.assistant.knowledge.editor-roles`, 기본 OPERATOR_ADMIN)만. 같은 Idempotency-Key 는 처음 만든 초안을 돌려준다
        (다른 내용이면 409 IDEMPOTENCY_CONFLICT). 응답 `approvalRequest` 를 approval-service `POST /change-requests` 에 그대로 보내
        승인을 요청한다(→ `POST /change-requests/{id}/submissions`). 승인되면 이 서비스가 새 판을 만들고 1분 안쪽에 재색인한다.
        형식: 첫 줄 `# 제목`, 128KB 이하, 금지 표현("가정"·"설계안"·"확정 정책") 없음, 문서 ID `docs/rag/rag-docs/<영역>/<이름>.md`
        (영역은 지금 있는 폴더). `customer_app/` 은 저장소가 정본이라 400.
      operationId: createKnowledgeDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeDraftCreate' }
      responses:
        '201':
          description: 만듦(같은 키면 처음 것)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDraft' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: STALE_VERSION(baseVersion 이 지금 판과 다름)·INVALID_STATE(내릴 문서 없음)·IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /assistant/knowledge-drafts/{draftId}:
    get:
      tags: [knowledge]
      summary: '(1.4.0) 초안 하나 + 지금 판(비교용) — 승인자도 본다(운영자 누구나)'
      operationId: getKnowledgeDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: draftId, in: path, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDraft' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    put:
      tags: [knowledge]
      summary: '(1.4.0) 열린 초안 본문 고치기(만든 사람만)'
      description: 승인을 요청한 뒤 고치면 본문 해시가 달라져 승인돼도 반영되지 않는다(REJECTED·DRAFT_CHANGED) — 새 `approvalRequest` 로 다시 요청한다.
      operationId: updateKnowledgeDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: draftId, in: path, required: true, schema: { type: string, maxLength: 40 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeDraftUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDraft' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 없거나 다른 사람의 초안
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_STATE — 닫힌 초안(반영·거절·버림)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    delete:
      tags: [knowledge]
      summary: '(1.4.0) 초안 버리기(만든 사람·열린 초안만 — 아니어도 204)'
      operationId: discardKnowledgeDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: draftId, in: path, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '204': { description: 버림(멱등) }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  # ---- (1.4.0) 상담 도우미(ADR-0093) ----
  /assistant/consult-guides:
    get:
      tags: [consult]
      summary: '(1.4.0) 상담 도우미 — 문의 종류·회원 조회 결과·주문 상태로 본인 확인 절과 정책 근거(LLM 없음, 저장 안 함)'
      description: |
        `CS_AGENT`·`OPERATOR_ADMIN`(설정 `pmart.assistant.consult-guide.roles`)만. 개인정보·식별자(고객 ID·주문 번호·전화·주소)를 받지 않는다 —
        주문 상태는 화면이 이미 조회한 상태 이름뿐. 근거는 설정 검색어로 지금 스냅숏에서 찾은 문서 조각(Citation)이라 문서를 고치면(ADR-0092) 다음
        색인부터 바뀐다. 활성 색인이 없거나 임베딩이 안 되면 503 — 화면은 도우미 칸만 비우고 상담 접수는 그대로 한다.
      operationId: getConsultGuide
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - name: category
          in: query
          required: true
          description: 상담 접수(case-service cs-intakes)와 같은 문의 종류
          schema: { type: string, enum: [ORDER, DELIVERY, PAYMENT, REFUND, PRODUCT, ACCOUNT, OTHER] }
        - { name: memberFound, in: query, required: false, description: 연락한 번호로 회원이 조회됐는지(화면 값 — 응답에 그대로), schema: { type: boolean } }
        - { name: orderStatus, in: query, required: false, description: 화면이 보여 준 주문 상태 이름(order-service 값 그대로), schema: { type: string, maxLength: 40, pattern: '^[A-Z_]+$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultGuide' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '503':
          description: DEPENDENCY_UNAVAILABLE — 활성 색인 없음·임베딩·검색 장애
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'

  schemas:
    PolicyQuestion:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        sessionId:
          type: [string, 'null']
          maxLength: 40
          description: '(1.3.0) 이어 물을 채팅 세션. 없으면 새 세션. 본인 세션이 아니거나 없으면 404'
        context:
          type: object
          description: 화면 힌트. 요청 해시에 들어가지만 권한·검색 범위를 넓히지 않는다. 허용 키 밖은 무시한다.
          properties:
            screen: { type: string, maxLength: 100 }
            centerId: { type: string, maxLength: 50 }

    AnswerState:
      type: string
      enum: [ANSWERED, NO_GROUNDING, REALTIME_DATA_REQUIRED, OUT_OF_SCOPE, FORBIDDEN_SCOPE, PRODUCT_INFO, PROCESSING]
      description: |
        ANSWERED: 근거로 뒷받침되는 답. NO_GROUNDING: 허용된 문서에서 근거를 찾지 못함(정상 결과).
        REALTIME_DATA_REQUIRED: 특정 대상의 현재 상태 질문. OUT_OF_SCOPE: 실행 요청.
        FORBIDDEN_SCOPE: 명시적 접근 요청이 정책상 거부됨(1차 정상 경로에서는 나오지 않는다). PROCESSING: 처리 중(202 에서만).
        PRODUCT_INFO(1.2.0): 상품 검색 결과를 정해진 문장으로 답함(근거 문서 없음, ADR-0083).

    AnswerMode:
      type: string
      enum: [GENERATIVE, BASELINE_EXTRACTIVE, PRODUCT_TEMPLATE, NONE]
      description: GENERATIVE=모델 생성, BASELINE_EXTRACTIVE=서버 발췌(생성 없음 — 기준선), PRODUCT_TEMPLATE=상품 검색 결과를 정해진 문장으로(1.2.0), NONE=답변 생성 안 함(분류·근거 없음)

    RetrievalMode:
      type: string
      enum: [SEMANTIC, BASELINE_HASH, NONE]
      description: SEMANTIC=의미 임베딩, BASELINE_HASH=로컬 문자 n-gram 해시(기준선), NONE=검색 안 함

    Authority:
      type: string
      enum: [CONFIRMED, ADOPTED_DESIGN, PROPOSAL, ASSUMPTION, UNDECIDED, EXTERNAL_REFERENCE]
      description: 근거의 정책 지위. 문서 기본값을 절·문단 태그가 덮는다([확정 정책]·승인 ADR=CONFIRMED, [채택 설계], [설계안]·[제안]·제안 ADR, [가정], [결정 필요]·[팀 확인 필요], [외부 참고]).

    LifecycleStatus:
      type: string
      enum: [ACTIVE, SUPERSEDED, SUPERSESSION_PROPOSED, EXCLUDED_FROM_PHASE1]
      description: |
        SUPERSEDED=승인된 문서가 명시한 절·결정을 대체함(현재 정책 질문에서 제외, 이력 질문에서만). SUPERSESSION_PROPOSED=승인 안 된 문서가
        대체를 선언함(원래 지위 유지, 제안 문서 동반 표시). EXCLUDED_FROM_PHASE1=1차 범위에서 제외된 자료(항상 제외).

    Citation:
      type: object
      required: [chunkId, documentId, path, authority, lifecycleStatus, asOf, excerpt]
      properties:
        chunkId: { type: string }
        documentId: { type: string }
        path: { type: string, description: 저장소 상대 경로 }
        section: { type: [string, 'null'], description: 절 경로(제목 > 하위 제목) }
        authority: { $ref: '#/components/schemas/Authority' }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        supersededBy: { type: [string, 'null'], description: 활성 대체의 근거 문서 ID }
        proposedSupersededBy: { type: array, items: { type: string }, description: 대체를 제안한(승인 안 된) 문서 ID }
        implementationEvidence:
          type: [object, 'null']
          description: 날짜가 붙은 구현 기록 절일 때만. 그 날짜 기준의 기록이며 현재 구현을 보장하지 않는다.
          properties:
            recordDate: { type: string }
            note: { type: [string, 'null'] }
        documentVersion: { type: [string, 'null'], description: 원문에 적힌 버전(없으면 null — 지어내지 않는다) }
        effectiveDate: { type: [string, 'null'], description: 원문에 적힌 기준일·적용일(없으면 null) }
        asOf:
          type: object
          required: [snapshotId, indexedAt]
          properties:
            snapshotId: { type: string }
            sourceRevision: { type: [string, 'null'], description: 색인한 저장소 git revision }
            sourceDirty: { type: boolean, description: 색인 때 작업 트리에 커밋 안 된 변경이 있었다(파일 해시 목록으로 식별) }
            indexedAt: { type: string, format: date-time }
        excerpt: { type: string, description: 근거 청크 본문(온전한 청크 — 자르지 않는다) }

    PolicyAnswer:
      type: object
      required: [answerId, requestId, state, answer, citations, answerMode, retrievalMode, askedAt]
      properties:
        answerId: { type: string }
        sessionId: { type: string, description: '(1.3.0) 이 질문이 속한 채팅 세션' }
        question: { type: [string, 'null'], description: '(1.3.0) 질문 원문 — 원문 저장 설정일 때만' }
        requestId: { type: string, description: 질의 때의 Idempotency-Key }
        state: { $ref: '#/components/schemas/AnswerState' }
        answer: { type: string }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        answerMode: { $ref: '#/components/schemas/AnswerMode' }
        retrievalMode: { $ref: '#/components/schemas/RetrievalMode' }
        indexSnapshotId: { type: [string, 'null'] }
        askedAt: { type: string, format: date-time }
        model:
          type: object
          properties:
            chat: { type: [string, 'null'] }
            embedding: { type: [string, 'null'] }

    ChatSessionSummary:
      type: object
      required: [sessionId, questionCount, createdAt, lastAskedAt]
      properties:
        sessionId: { type: string }
        title: { type: [string, 'null'], description: '첫 질문(원문 저장 설정일 때) — 없으면 첫 답변 앞부분(최대 60자), 둘 다 없으면 null' }
        questionCount: { type: integer }
        createdAt: { type: string, format: date-time }
        lastAskedAt: { type: string, format: date-time, description: '마지막 질문 시각 — 보존 기간 기준' }
    ChatSessionPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ChatSessionSummary' } }
        page: { $ref: '_common.yaml#/components/schemas/Page' }
    ChatSession:
      type: object
      required: [sessionId, createdAt, lastAskedAt, messages]
      properties:
        sessionId: { type: string }
        createdAt: { type: string, format: date-time }
        lastAskedAt: { type: string, format: date-time }
        messages:
          type: array
          description: 질문 순. 각 항목은 PolicyAnswer(question 은 원문 저장 설정일 때만, 처리 중이면 state PROCESSING)
          items: { $ref: '#/components/schemas/PolicyAnswer' }

    QuestionHistoryItem:
      type: object
      required: [answerId, requestId, state, askedAt]
      properties:
        answerId: { type: string }
        requestId: { type: string }
        state: { $ref: '#/components/schemas/AnswerState' }
        question: { type: [string, 'null'], description: 원문 저장 설정일 때만(기본 null) }
        answerPreview: { type: [string, 'null'], description: 답변 앞부분(최대 120자, 완료 답변만) }
        answerMode: { $ref: '#/components/schemas/AnswerMode' }
        citationCount: { type: integer }
        askedAt: { type: string, format: date-time }
    QuestionHistoryPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/QuestionHistoryItem' } }
        page: { $ref: '_common.yaml#/components/schemas/Page' }

    # ---- (1.4.0) 운영자 RAG 문서 관리(ADR-0092) ----
    KnowledgeIndexState:
      type: string
      enum: [INDEXED, PENDING, FAILED, NOT_INDEXED]
      description: 지금 판이 활성 스냅숏에 들어갔는지. PENDING=재색인 대기, FAILED=판을 바꾼 뒤 재색인이 실패(1분 뒤 다시 함), NOT_INDEXED=가져온 뒤 DB 로 아직 색인 안 함
    KnowledgeDocumentSummary:
      type: object
      required: [documentId, domain, title, version, contentSha256, retired, readOnly, indexState, updatedAt, updatedBy]
      properties:
        documentId: { type: string, description: '저장소 경로 그대로(docs/rag/rag-docs/<영역>/<이름>.md) — 인용 documentId 와 같다' }
        domain: { type: string, description: 영역 폴더 }
        title: { type: string }
        version: { type: integer }
        contentSha256: { type: string }
        retired: { type: boolean, description: 내린 문서(색인 안 함) }
        readOnly: { type: boolean, description: '(1.5.0) 원본이 고객 RAG DB 인 문서(customer_app — 같은 문서를 하나로 같이 관리, ADR-0094). 여기서는 초안을 만들 수 없고 1분마다 원본 판에 맞춘다' }
        indexState: { $ref: '#/components/schemas/KnowledgeIndexState' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, description: '반영한 초안의 작성자(운영자 ID), 가져오기는 IMPORT, 원본 맞춤은 SYNC' }
    KnowledgeReindex:
      type: object
      properties:
        requestedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        lastResult: { type: [string, 'null'], description: 'OK·FAILED' }
        lastSnapshotId: { type: [string, 'null'] }
    KnowledgeDocumentList:
      type: object
      required: [items, source, reindex]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/KnowledgeDocumentSummary' } }
        source: { type: string, enum: [files, db], description: '색인 원본 설정 — files 면 승인 반영돼도 재색인하지 않는다(가져오기 전)' }
        reindex: { $ref: '#/components/schemas/KnowledgeReindex' }
    KnowledgeVersion:
      type: object
      required: [version, op, title, contentSha256, createdBy, createdAt]
      properties:
        version: { type: integer }
        op: { type: string, enum: [IMPORT, UPSERT, RETIRE, SYNC], description: '(1.5.0) SYNC = 같이 쓰는 문서(customer_app)를 원본(고객 RAG)에 맞춘 판(ADR-0094)' }
        title: { type: string }
        contentSha256: { type: string }
        approvalId: { type: [string, 'null'] }
        draftId: { type: [string, 'null'] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    KnowledgeDocumentDetail:
      type: object
      required: [document, content, shownVersion, versions]
      properties:
        document: { $ref: '#/components/schemas/KnowledgeDocumentSummary' }
        content: { type: string, description: 마크다운 본문(shownVersion 판) }
        shownVersion: { type: integer }
        versions: { type: array, items: { $ref: '#/components/schemas/KnowledgeVersion' }, description: 최근 판 순 }
    KnowledgeDraftCreate:
      type: object
      required: [documentId, op]
      properties:
        documentId: { type: string, maxLength: 300 }
        op: { type: string, enum: [UPSERT, RETIRE] }
        baseVersion: { type: [integer, 'null'], minimum: 0, description: '본 판(새 문서 0). 주면 지금 판과 같은지 본다(아니면 409 STALE_VERSION). 없으면 지금 판' }
        content: { type: [string, 'null'], description: 'UPSERT 본문 전체(마크다운). RETIRE 는 비운다' }
    KnowledgeDraftUpdate:
      type: object
      required: [content]
      properties:
        content: { type: string }
    KnowledgeDraft:
      type: object
      required: [draftId, documentId, op, baseVersion, authorId, state, createdAt, updatedAt, approvalRequest]
      properties:
        draftId: { type: string }
        documentId: { type: string }
        op: { type: string, enum: [UPSERT, RETIRE] }
        baseVersion: { type: integer }
        title: { type: [string, 'null'] }
        content: { type: [string, 'null'] }
        contentSha256: { type: [string, 'null'] }
        authorId: { type: string }
        state: { type: string, enum: [OPEN, APPLIED, REJECTED, DISCARDED] }
        approvalId: { type: [string, 'null'], description: 반영·거절한 승인 }
        resultReason: { type: [string, 'null'], description: 'REJECTED 사유: STALE_VERSION·DRAFT_CHANGED·DRAFT_MISMATCH·READ_ONLY_DOCUMENT 등' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        current:
          type: [object, 'null']
          description: 지금 판(비교용 — 새 문서면 null)
          properties:
            version: { type: integer }
            title: { type: string }
            content: { type: string }
            retired: { type: boolean }
        approvalRequest:
          type: object
          additionalProperties: true
