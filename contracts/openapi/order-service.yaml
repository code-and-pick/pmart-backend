        totalAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        itemCount: { type: integer, description: 주문행 수량 합 }
        lineCount: { type: integer, description: 주문행 수 }
        plannedShipments: { type: integer }
        openFulfillmentIssues: { type: integer, description: 열린(OPEN) 이행 확인 필요 건수 }
