openapi: 3.1.0
info:
  title: order-service
  version: 0.9.0
  description: |
    0.9.0(2026-11-16, 오배송 재발송 — ADR-0052 결정 4·5, 사용자 "새상품 재배차 서비스 넣어" → "전부 PR로", 작성 PC 5 — platform 검토): 수량 변경 사유 RESHIPMENT(미이행 +q·재발송 +q — 같은 수량을 재발송과 환불로 겹치지 않게 원장에), 내부 조회 행 reshippedQty. 재발송 상품의 인계·전달은 기존 O-1 그대로 받는다(보낼 수량에 재발송 포함).
    주문 초안·주문 원장·스냅샷·상태·이행 계획의 정본. (docs/architecture/service-map.md §2)
    사가 진행은 order-orchestration-service, PG 거래는 payment-service, 클레임 심사는 claim-service.
    0.4.0(2026-11-15): 직원용 주문 상세의 배송지는 가려서 주고(shippingAddressMasked), 원문은 사유를 적은 열람 요청(pii-reveals)으로만 —
    audit-service 개인정보 열람 기록(BO-25)이 남아야 준다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: drafts, description: 주문 초안(가격 동결 10분) }
  - { name: orders, description: 확정 주문 조회·변경 }
  - { name: internal, description: 서비스 간 조회(서비스 토큰) }
  - { name: fulfillment-issues, description: '이행 확인 필요(재고 보류 — 운영자 확인, 자동 처리 없음)' }
  - { name: order-lookups, description: '직원용 주문 검색·상세(백오피스 고객센터·라이더 운영, 0.3.0) + 개인정보 원문 열람(기록 남김, 0.4.0)' }

paths:
  /fulfillment-issues:
    get:
      tags: [fulfillment-issues]
      summary: 이행 확인 필요 주문 목록 — 운영자 (0.2.0)
      description: |
        2026-11-08 사용자 결정(외부 검토 #5 반영): MFC 재고가 격리·실사 손실로 주문 예약 일부를 보류(ReservationBlocked, 다른 LOT 으로도 못 다시 잡음)하면
        주문을 "확인 필요"로 표시해 담당자가 보게 한다. **자동 취소·환불·LOT 대체·고객 안내는 하지 않는다**(정책 확정 전) — 주문 상태도 바꾸지 않는다.
        그 센터 운영자(centers 에 mfcId), 또는 OPERATOR_ADMIN(모든 센터 — 0.6.0, 2026-11-15 BO-12 처리 대기 메뉴: mfcId 를 비우면 모든 센터). 기본은 OPEN.
      operationId: listFulfillmentIssues
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: false, schema: { type: string }, description: '센터 운영자는 필수(없으면 403). OPERATOR_ADMIN 은 비우면 모든 센터(0.6.0)', x-added-in: '2026-11-15' }
        - { name: state, in: query, schema: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] } }
      responses:
        '200':
          description: OK (새 것부터, 최대 500)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FulfillmentIssue' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /fulfillment-issues/{issueId}/acknowledgements:
    post:
      tags: [fulfillment-issues]
      summary: 이행 확인 필요 — 담당자 확인 (0.2.0)
      description: 확인 표시만 한다(처리 내용은 note). 그 센터 운영자 또는 OPERATOR_ADMIN(0.6.0). 이미 확인했으면 지금 상태.
      operationId: acknowledgeFulfillmentIssue
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: issueId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 확인됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentIssue' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /delivery-options:
    get:
      tags: [drafts]
      summary: 배송 방식별 가능 여부·사유·예상시간·배달팁·가장 빠른 예약 슬롯 (BR-13)
      description: |
        담당 MFC 기준 현재 시각(서버, Asia/Seoul)으로 판정한다. 00:00~08:00 에는 한집·알뜰을 NIGHT_TIME 으로 막고 예약만 안내한다.
        itemAmount(장바구니 selectedItemAmount 등 서버 값)를 주면 무료 사유를 적용한 배달팁을 함께 준다. 최종 금액은 주문 초안에서 확정한다.
        회원·비회원 토큰 모두 된다(비회원은 첫 구매 무료를 판정하지 않는다).
      operationId: getDeliveryOptions
      x-pmart-user-types: [CUSTOMER, GUEST]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: itemAmount, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryOptions' }
  /order-drafts:
    post:
      tags: [drafts]
      summary: "주문 초안 생성 (멱등: purchaseIntentId + Idempotency-Key)"
      operationId: createOrderDraft
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDraftRequest' }
      responses:
        '201':
          description: 초안 생성 또는 기존 초안 반환(같은 키·같은 본문)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: 검증 거절 (ACCOUNT_NOT_PURCHASABLE, SKU_NOT_SALEABLE, **INSUFFICIENT_STOCK**(0.8.0, 2026-11-16 — 담당 센터 가용이 주문 수량보다 적거나 취급 안 함, 초안을 만들지 않음 = 주문서 진입 금지. details[] field = sku, reason = `requestedQty=<q>;availableQty=<a>` 또는 `NOT_HANDLED`. 가용 조회 불명이면 막지 않고 결제 단계 재고 예약이 최종. 소비기한 부적격 LOT 은 아직 가용에 들어 있어 결제 단계에서 걸릴 수 있음 — mfc-inventory IV-1), QUANTITY_LIMIT_EXCEEDED, PRICE_NOT_SET, OUT_OF_SERVICE_AREA, SERVICEABILITY_UNKNOWN, MFC_CHANGED(409), WEIGHT_UNSPLITTABLE, CONFIG_REQUIRED). 최소주문 미달·배송 방식 불가·슬롯 문제는 거절이 아니라 초안 blockers 로 준다(모든 사유 표시)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /order-drafts/{draftId}:
    get:
      tags: [drafts]
      summary: 초안 조회 (견적·유효시간·자원 확보 상태)
      operationId: getOrderDraft
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /order-drafts/{draftId}/checkouts:
    post:
      tags: [drafts]
      summary: 결제 진입 요청 → order-orchestration S1 시작
      description: |
        가격 동결(quoteExpiresAt)과 acceptedQuoteVersion을 검증한 뒤 사가를 시작한다.
        응답 ACCEPTED는 "사가 시작"이지 재고·슬롯·결제 성공이 아니다. 진행은 GET /order-drafts/{draftId}로 조회(resultId = orderId).
        진행 중이면 status RESOURCE_PENDING·nextAction WAIT, 결제창을 열 수 있으면 PAYMENT_PENDING·PAY 와 payment, 실패하면 DRAFT·REVIEW 와 checkoutFailure.
        같은 초안에 진행 중인 결제 진입이 있으면 그 진입을 그대로 돌려준다(409 아님). 2026-10-31 단계: 결제 시작까지(승인 대사·주문 확정은 다음 단계).
      operationId: startCheckout
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptedQuoteVersion, paymentMethod]
              properties:
                acceptedQuoteVersion: { type: integer }
                paymentMethod: { type: string, enum: [TOSS_PAYMENTS] }
                consents:
                  type: array
                  items: { type: object, properties: { consentType: { type: string }, version: { type: string } } }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: RE_QUOTE_REQUIRED (10분 경과·acceptedQuoteVersion 불일치) / CHECKOUT_BLOCKED (초안 blockers 가 남음) / ACCOUNT_NOT_PURCHASABLE (초안 뒤 계정이 구매 불가로 바뀜 — 결제 진입 때 다시 확인, BR-37) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /orders:
    get:
      tags: [orders]
      summary: 본인 주문 목록 (조회 기간은 정책값)
      description: |
        고객 토큰만(그 밖 403). 본인의 확정 주문만 최근 확정 순(confirmedAt 내림차순). 결제 진입 전·확정 전 주문 ID 는 나오지 않는다 — 진행은 초안 조회로.
        page.nextCursor 는 불투명 문자열(다음 쪽 cursor 로 그대로). 조회 기간 정책값은 아직 없어 기간으로 자르지 않는다.
        itemCount 는 주문행 수량 합.
      operationId: listOrders
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /orders/{orderId}:
    get:
      tags: [orders]
      summary: 주문 상세 (스냅샷 + 소유 시스템 확정 결과의 조합, 원천별 asOf 표시)
      description: |
        고객 토큰만(그 밖 403). 남의 주문·확정 전 주문 ID 는 404(존재를 드러내지 않음).
        현재(결제 확정 단계)는 order 원장만 조합한다: 확정 스냅샷(품목·배송·견적 금액)·주문행 수량(originalQty = unfulfilledQty = 주문 수량, 나머지 0)·
        payment{paymentAttemptId, state=APPROVED}. shipments·claims 는 빈 배열, sources 는 order-service 하나(CURRENT).
        quote.firstPurchaseBenefit 는 첫 구매 무료를 실제 적용했으면 CONFIRMED, 아니면 NOT_ELIGIBLE. productName·optionLabel 은 초안 때 뜬 주문 당시 사본(BR-35, 2026-11-02 이전 주문은 비어 있음).
      operationId: getOrder
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /orders/{orderId}/reservation-time-changes:
    post:
      tags: [orders]
      summary: 예약배달 시간 변경 (상품준비 진입 전만) → S4
      operationId: requestReservationTimeChange
      x-pmart-user-types: [CUSTOMER]
      x-pmart-user-types-note: "추정 — 미구현, 본인 주문의 예약 시간 변경으로 봄"
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newArrivalWindow]
              properties:
                newArrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: INVALID_STATE (이미 상품준비 진입) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /orders/{orderId}/reservation-time-changes/{requestId}:
    get:
      tags: [orders]
      summary: 시간 변경 요청 결과 조회 (PENDING/CONFIRMED/REJECTED/UNKNOWN)
      operationId: getReservationTimeChange
      x-pmart-user-types: [CUSTOMER]
      x-pmart-user-types-note: "추정 — 미구현, 변경을 요청한 고객의 조회로 봄"
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  state: { type: string, enum: [PENDING, CONFIRMED, REJECTED, UNKNOWN] }
                  reason: { type: string }
                  newVersion: { type: integer }

  /orders/lookups:
    get:
      tags: [order-lookups]
      summary: 직원용 주문 검색 (0.3.0 — 백오피스 고객센터·라이더 운영)
      x-added-in: '2026-11-15'
      description: |
        2026-11-15 사용자 결정: 직원 백오피스(고객센터·라이더 운영 메뉴)의 주문 찾기는 order-service 가 직접 준다(backoffice-bff 아님).
        직원 토큰(OPERATOR)의 역할 OPERATOR_ADMIN·CS_AGENT·RIDER_OPS 만(그 밖 403). 고객 토큰도 403. order 원장만 읽는다(다른 서비스 호출 없음).
        확정 주문만 나온다(결제 진입 전·확정 전 주문은 없음). 최근 확정 순(confirmedAt 내림차순, 같은 시각은 orderId 내림차순).
        **기간 상한**: orderId·customerId 가 없으면 createdFrom·createdTo 둘 다 필요하고 간격은 31일 이하(아니면 400 VALIDATION_FAILED) — 전체 훑기 방지.
        createdFrom 포함·createdTo 미포함, 기준은 주문 확정 시각. 둘 다 주면 createdFrom < createdTo.
        **receiverPhone** 은 주문 당시 배송지 사본(BR-37)의 수령인 연락처와 숫자만 비교한 **완전 일치**(하이픈 무시). 부분 일치·이름·주소 검색은 없다.
        사본이 없는 주문(2026-11-02 이전)은 연락처로 찾을 수 없다.
        목록의 연락처는 가린다(receiverPhoneMasked, 예 010-****-1234). 전체 값은 상세에서만. 검색 조건(연락처)은 로그에 남기지 않는다.
      operationId: searchOrdersForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: orderId, in: query, schema: { type: string, maxLength: 64 }, description: 주문 ID 완전 일치 }
        - { name: customerId, in: query, schema: { type: string, maxLength: 64 }, description: 고객 계정 ID(accountId) 완전 일치 }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: mfcId, in: query, schema: { type: string, maxLength: 40 } }
        - { name: receiverPhone, in: query, schema: { type: string, maxLength: 20 }, description: '수령인 연락처 완전 일치(숫자 9~11자리, 하이픈 무시)' }
        - { name: createdFrom, in: query, schema: { type: string, format: date-time }, description: 확정 시각 하한(포함) }
        - { name: createdTo, in: query, schema: { type: string, format: date-time }, description: 확정 시각 상한(미포함) }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 }, description: 0부터 }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOrderSearchResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /orders/lookups/{orderId}:
    get:
      tags: [order-lookups]
      summary: 직원용 주문 상세 (0.3.0; 0.4.0 부터 배송지 가림 — 원문은 pii-reveals)
      x-added-in: '2026-11-15'
      description: |
        역할 OPERATOR_ADMIN·CS_AGENT·RIDER_OPS 만(그 밖·고객 403).
        **0.4.0(2026-11-15 사용자 "기록 남긴다")**: 주문 당시 배송지 사본은 **가려서** 싣는다(shippingAddressMasked=true, 가림 규칙은 StaffOrderDetail.shippingAddress).
        원문이 필요하면 `POST /orders/lookups/{orderId}/pii-reveals` 에 사유를 적어 요청한다 — 열람 기록(audit-service)이 남은 뒤에만 원문을 준다. 이 조회 자체는 기록하지 않는다.
        order 가 가진 것만: 주문행 수량 누계·금액 구성·결제 시도 ID·이행 확인 필요 기록. 상태 이력·클레임 목록은 order 에 저장돼 있지 않아 싣지 않는다
        (클레임은 claim-service GET /claims?orderId=, 배송은 delivery 쪽 화면에서). 확정 전 주문 ID 는 404.
      operationId: getOrderForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOrderDetail' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /orders/lookups/{orderId}/pii-reveals:
    post:
      tags: [order-lookups]
      summary: 직원용 주문 배송지 원문 열람 — 사유 필수, 열람 기록 남김 (0.4.0)
      x-added-in: '2026-11-15'
      description: |
        2026-11-15 사용자 결정("기록 남긴다", BO-25): 직원 상세의 가린 배송지 원문은 이 요청으로만 본다. 역할은 상세와 같다(OPERATOR_ADMIN·CS_AGENT·RIDER_OPS, 그 밖·고객 403).
        처리: 권한 → 주문·배송지 사본 확인(주문 없음 404 ORDER_NOT_FOUND, 사본 없는 옛 주문 404 SHIPPING_COPY_NOT_FOUND — 기록하지 않음)
        → audit-service `POST /internal/pii-access-logs` 에 **동기로** 기록(행위자·역할·고객 accountId·caseRef ORDER:<orderId>·항목·사유)
        → 기록이 된 뒤에만 원문을 돌려준다. **audit-service 에 닿지 않거나 결과를 모르면 503(DEPENDENCY_UNAVAILABLE·UNKNOWN_RESULT), 원문 없음**(BO-25 §3).
        UNKNOWN_RESULT 는 기록이 됐을 수도 있다 — 같은 Idempotency-Key 로 다시 보내면 같은 기록으로 이어진다.
        멱등: 같은 직원·같은 주문·같은 Idempotency-Key·같은 본문이면 같은 열람 기록(piiAccessLogId)으로 원문을 다시 준다. 같은 키에 다른 사유·항목이면 409 IDEMPOTENCY_CONFLICT.
        원문 응답은 저장·재생하지 않는다(매번 원장에서 읽음). 사유·원문은 로그에 남기지 않는다. 가린 상세 조회(GET)는 기록하지 않는다.
      operationId: revealOrderPiiForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffPiiRevealRequest' }
      responses:
        '200':
          description: 기록됨 — 요청한 항목만 원문, 나머지는 가린 값
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffPiiReveal' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503':
          description: 열람 기록을 남기지 못함(audit-service 미응답·결과 불명) — 원문을 주지 않는다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  # ---------- internal (서비스 토큰) ----------
  /internal/orders/{orderId}/confirmation:
    post:
      tags: [internal]
      summary: '[orchestration→order] 주문 확정 (PG 승인 대사 일치 + 자원 확정 후)'
      operationId: confirmOrder
      description: |
        서비스 토큰만. orderId 는 결제 진입(checkouts) 때 초안에 발급한 ID. 초안 스냅샷(품목·배송·동결 견적)을 주문 원장으로 옮겨 status=CONFIRMED, version=1 로 만들고
        같은 트랜잭션에서 OrderConfirmed(토픽 order.order.v1)를 Outbox 에 쓴다. 주문행 ID 는 `<orderId>-L<n>`(초안 품목 순서, 사가 시작 때 보낸 값과 같음).
        - 200 APPLIED, resultId = orderId, version = 주문 버전. 같은 Idempotency-Key 는 저장 결과 재생. 이미 확정된 주문은 다른 키로 와도 200(사건은 다시 내지 않음).
        - 404 ORDER_NOT_FOUND: 이 orderId 를 가진 초안이 없음(다른 결제 진입으로 바뀐 옛 orderId 포함).
        - 422 AMOUNT_MISMATCH: approvedAmount ≠ 초안 quote.totalAmount. 확정하지 않는다(사가가 대사 대상으로 넘긴다). 기록하지 않으므로 같은 키 재시도도 다시 판정.
        - 409 INVALID_STATE: 같은 초안이 이미 다른 orderId 로 확정됨 / SKU 구성 수를 확인하지 못함. VERSION_CONFLICT: X-Expected-Version ≠ 초안 버전.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentAttemptId, pgTransactionId, approvedAmount, reservationId]
              properties:
                paymentAttemptId: { type: string }
                pgTransactionId: { type: string }
                approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
                reservationId: { type: string }
                capacityHoldId: { type: string }
                slotHoldId: { type: string }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: AMOUNT_MISMATCH → 확정 차단, 대사 대상
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/orders/{orderId}:
    get:
      tags: [internal]
      summary: '[claim→order] 주문 원장 조회 (서비스 토큰) — 클레임 심사·환불 근거'
      description: |
        서비스 토큰만. 고객 조회와 달리 소유자(accountId)·결제 시도·승인액·행별 수량 누계를 돌려준다. 확정 전 주문 ID 는 404.
      operationId: getInternalOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalOrder' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/delivery-destination:
    get:
      tags: [internal]
      summary: '[delivery-dispatch→order] 배송지 (토큰 없는 내부 호출) — 배차 좌표·배송 방식'
      description: |
        배차가 고객 배송지 좌표(MFC → 고객 도로 거리·예상 배달료)와 배송 방식(한집·알뜰·예약)을 읽는다(2026-11-13, delivery DD-1 — 요청 O-4).
        주문 당시 사본(BR-37)의 도로명주소와 지도 핀만 준다 — 수령인·연락처·출입 정보는 주지 않는다(배차에 필요 없음). 도로명주소는 받는 쪽이 좌표로 바꾸는 데만 쓰고 저장·로그하지 않는다.
        사본이 없는 주문(2026-11-02 이전)은 roadAddress null. 확정 전 주문 ID 는 404.
        2026-11-14 고침(0.2.4): 구현이 사본을 읽지 않아 roadAddress 가 늘 null 이던 것.
      x-added-in: '2026-11-13'
      operationId: getOrderDeliveryDestination
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryDestination' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/drop-info:
    get:
      tags: [internal]
      summary: '[delivery-execution→order] 라이더용 전달지 (내부 호출) — 주소·상세·수령인·연락처·출입·요청사항'
      description: |
        픽업한 라이더에게 보여 줄 전달지(클라이언트 BR-24, 요청 O-5 — 2026-11-14 delivery PC 5 가 넣음). 공개 범위(픽업 뒤 ~ 전달 완료 전, 배정된 라이더 본인)는 delivery-execution 이 판정한다 — 이 경로는 게이트웨이에 열지 않는다.
        연락처는 고객 전화번호 그대로(안심번호 없음 — 사용자 결정 2026-11-14). 개인정보 — 받는 쪽은 저장·로그하지 않는다.
        사본이 없는 주문(2026-11-02 이전)·확정 전 주문 ID 는 404.
      x-added-in: '2026-11-14'
      operationId: getOrderDropInfo
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DropInfo' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/line-quantity-changes:
    post:
      tags: [internal]
      summary: '[orchestration/claim→order] 주문행 수량 변경 (결품·출고 전 취소·인계 누계·반품 수량 반영)'
      description: |
        구현 범위는 reason=CANCEL_BEFORE_SHIP(출고 전 취소, 2026-10-31)·SHORTAGE(결품 — 품절 상품만 취소, 2026-11-07 ADR-0045, 같은 수량 규칙·주문 상태 유지) 만. 그 밖의 사유는 422 UNSUPPORTED_ACTION.
        행마다 unfulfilledQty −= qty, cancelledBeforeShipQty += qty(qty > unfulfilledQty 면 409 INVALID_STATE, 아무것도 바꾸지 않음).
        모든 행의 unfulfilledQty·handedOverQty 가 0 이 되면 주문 status=CANCELLED. 같은 트랜잭션에서 행마다 OrderLineQuantityChanged,
        주문에 OrderCancelled(scope FULL/PARTIAL, claimId) 를 Outbox 에 쓴다(토픽 order.order.v1). 같은 Idempotency-Key 는 저장 결과 재생.
      operationId: applyLineQuantityChange
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                reason: { type: string, enum: [SHORTAGE, CANCEL_BEFORE_SHIP, HANDOVER, RETURN, EXCHANGE, RESHIPMENT], description: 'RESHIPMENT(0.9.0, 2026-11-16) — 오배송 재발송: 행마다 미이행 +q·재발송 +q(보낼 수량이 늘어난다, 상태는 그대로). 한도 = 원수량 − 출고 전 취소 − 이미 재발송' }
                sourceRef: { type: string, description: stopRequestId / handoverId / claimId }
                claimId: { type: string, description: 취소·반품 클레임(사건 OrderLineQuantityChanged·OrderCancelled 에 싣는다) }
                changes:
                  type: array
                  items:
                    type: object
                    required: [orderLineId, qty]
                    properties:
                      orderLineId: { type: string }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: 불변식 위반 (원수량 ≠ 미이행 + 인계 누계 + 출고 전 취소 누계)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/accounts/{accountId}/withdrawal-eligibility:
    get:
      tags: [internal]
      summary: '[customer→order] 탈퇴 가능 여부 (미결 주문·불명 결제·환불·회수·분쟁)'
      operationId: getWithdrawalEligibility
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligible: { type: boolean }
                  openObligations:
                    type: array
                    items: { type: object, properties: { kind: { type: string }, ref: { type: string } } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /internal/order-lines/{orderLineId}/delivery-facts:
    get:
      tags: [internal]
      summary: '[review/claim→order] 품목별 실제 배송완료 시각·수량 (리뷰 14일·반품 기한 근거)'
      operationId: getOrderLineDeliveryFacts
      parameters:
        - { name: orderLineId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderLineId: { type: string }
                  deliveredQty: { type: integer }
                  deliveredAt: { type: string, format: date-time }
                  deliveryId: { type: string }
                  evidenceRef: { type: string }

  /internal/customer-commitments:
    get:
      tags: [internal]
      summary: '[replenishment→order] 확정 미이행 고객 약속 C (센터·SKU·기간)'
      operationId: listCustomerCommitments
      parameters:
        - { name: mfcId, in: query, required: true, schema: { type: string } }
        - { name: sku, in: query, schema: { type: string } }
        - { name: dueBefore, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        orderId: { type: string }
                        orderLineId: { type: string }
                        sku: { type: string }
                        committedQty: { type: integer }
                        dueAt: { type: string, format: date-time }
                        state: { type: string, enum: [VALID, BLOCKED] }
                        version: { type: integer }

components:
  schemas:
    FulfillmentIssue:
      type: object
      properties:
        issueId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
        reservationId: { type: string }
        sku: { type: string }
        lotId: { type: [string, 'null'] }
        blockedQty: { type: integer }
        reason: { type: string, description: 'QUALITY_HOLD(품질 격리)·COUNT_LOSS(실사 손실)·SHORT·DAMAGED(피킹 결품 보고) 등 — inventory 사유 그대로' }
        state: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED], description: 'RESOLVED = 피킹 시작 전에 MFC 가 보류분을 다시 잡음(자동, 2026-11-08). 피킹 시작 뒤 남은 보류는 결품 사가가 고객 사전 선택대로 처리' }
        note: { type: [string, 'null'] }
        acknowledgedBy: { type: [string, 'null'] }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        blockedAt: { type: string, format: date-time }
    DeliveryDestination:
      type: object
      description: 배차용 배송지(개인정보 최소 — 수령인·연락처·출입 정보 없음)
      required: [orderId, mfcId, status, deliveryMode, confirmedAt]
      properties:
        orderId: { type: string }
        mfcId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED], description: 한집 / 알뜰 / 예약 }
        confirmedAt: { type: string, format: date-time, description: '주문 확정 시각 — 배송 약속(한집·알뜰 = 확정 + 50분, 사용자 2026-11-13) 계산', x-added-in: '2026-11-13' }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
        roadAddress: { type: [string, 'null'], description: 주문 당시 도로명주소 — 좌표 변환에만 쓴다(저장·로그 금지) }
        geo:
          type: [object, 'null']
          description: 고객이 지도 핀으로 맞춘 위치(참고, ADR-0023)
          properties:
            lat: { type: number }
            lng: { type: number }
    DropInfo:
      type: object
      x-added-in: '2026-11-14'
      description: 라이더용 전달지(주문 당시 사본 BR-37 + 배송 요청사항). 개인정보 — 저장·로그 금지
      required: [orderId, roadAddress, detailAddress, receiverName, receiverPhone]
      properties:
        orderId: { type: string }
        roadAddress: { type: string }
        detailAddress: { type: string }
        postalCode: { type: [string, 'null'] }
        receiverName: { type: string }
        receiverPhone: { type: string, description: 고객 전화번호(안심번호 아님 — 사용자 결정 2026-11-14) }
        entranceMethod: { type: [string, 'null'], enum: [FREE, PASSWORD, CALL, OTHER, null] }
        entranceNote: { type: [string, 'null'], description: 출입 비밀번호일 수 있다 — 로그 금지 }
        deliveryNote: { type: [string, 'null'], description: 배송 요청사항(주문 때 입력) }
        geo:
          type: [object, 'null']
          description: 전달지 지도 핀(주문 당시 사본 — 라이더 길 안내 참고, ADR-0023)
          properties:
            lat: { type: number }
            lng: { type: number }
    InternalOrder:
      type: object
      description: 서비스 간 주문 원장 사본(claim 심사·환불 근거). 금액은 주문 당시 동결 견적, 승인액은 PG 승인 사실.
      required: [orderId, accountId, status, version, mfcId, paymentAttemptId, approvedAmount, totalAmount, lines, confirmedAt]
      properties:
        orderId: { type: string }
        accountId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        version: { type: integer }
        mfcId: { type: string }
        paymentAttemptId: { type: string }
        approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        itemAmount: { $ref: '_common.yaml#/components/schemas/Money' }
