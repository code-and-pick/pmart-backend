        deliveryTip: { $ref: '_common.yaml#/components/schemas/Money' }
        deliveryTipReason: { type: string, description: 'STANDARD·OVER_30000·FIRST_PURCHASE·NONE' }
        bagFee: { $ref: '_common.yaml#/components/schemas/Money' }
        totalAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        approvedAmount: { $ref: '_common.yaml#/components/schemas/Money', description: PG 승인액 }
        firstPurchaseApplied: { type: boolean }
        quoteVersion: { type: integer }
