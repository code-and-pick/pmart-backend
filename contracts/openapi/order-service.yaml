            receiverName 첫·끝 글자만(홍길동 → 홍*동, 홍길 → 홍*, 남궁민수 → 남**수), receiverPhone 앞 3·끝 4자리(010-****-1234),
            roadAddress·postalCode·entranceMethod 그대로(권역·센터 판단용), detailAddress "***"(동·호수 가림), entranceNote null(출입 비밀번호일 수 있음), geo null(정밀 위치).
            원문은 POST /orders/lookups/{orderId}/pii-reveals.
        shippingAddressMasked: { type: boolean, description: 'shippingAddress 를 가렸는가(0.4.0 부터 늘 true; 사본이 없으면 shippingAddress 는 null)' }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        fulfillmentIssues: { type: array, items: { $ref: '#/components/schemas/FulfillmentIssue' }, description: 이 주문의 이행 확인 필요 기록(새 것부터) }
    StaffPiiField:
      type: string
      x-added-in: '2026-11-15'
      description: |
        원문으로 볼 배송지 항목(0.4.0). NAME = receiverName, PHONE = receiverPhone, ADDRESS = detailAddress + geo(핀), ENTRANCE = entranceNote + 배송 요청사항(deliveryNote, 0.5.0 — ADR-0062).
        roadAddress·postalCode·entranceMethod 는 가리지 않으므로 항목이 없다.
      enum: [NAME, PHONE, ADDRESS, ENTRANCE]
    StaffPiiRevealRequest:
      type: object
      x-added-in: '2026-11-15'
      required: [reason]
      properties:
        reason: { type: string, minLength: 2, maxLength: 200, description: '열람 사유(예 "고객 문의 — 배송지 확인"). 앞뒤 공백 제외 2자 이상. audit 에 그대로 남고 로그에는 남기지 않는다' }
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/StaffPiiField' }
          description: 볼 항목. 없으면 네 항목 모두
    StaffPiiReveal:
      type: object
      x-added-in: '2026-11-15'
      description: 열람 기록이 남은 뒤의 배송지 원문(요청한 항목만 원문, 나머지는 상세와 같은 가린 값). 로그 금지
      required: [orderId, piiAccessLogId, recordedAt, fields, shippingAddress]
      properties:
        orderId: { type: string }
        piiAccessLogId: { type: string, description: audit-service 개인정보 열람 기록 ID }
        recordedAt: { type: string, format: date-time, description: 열람 기록 시각(audit-service) }
        fields: { type: array, items: { $ref: '#/components/schemas/StaffPiiField' }, description: 원문으로 준 항목 }
        shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
        deliveryNote: { type: [string, 'null'], description: '(0.5.0) ENTRANCE 를 열었을 때만 배송 요청사항 원문 — 그 밖에는 null' }
    StaffOrderAmounts:
