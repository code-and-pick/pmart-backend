openapi: 3.1.0
info:
  title: order-service
  version: 0.2.3
  description: |
    주문 초안·주문 원장·스냅샷·상태·이행 계획의 정본. (docs/architecture/service-map.md §2)
    사가 진행은 order-orchestration-service, PG 거래는 payment-service, 클레임 심사는 claim-service.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: drafts, description: 주문 초안(가격 동결 10분) }
  - { name: orders, description: 확정 주문 조회·변경 }
  - { name: internal, description: 서비스 간 조회(서비스 토큰) }
  - { name: fulfillment-issues, description: '이행 확인 필요(재고 보류 — 운영자 확인, 자동 처리 없음)' }

paths:
  /fulfillment-issues:
    get:
      tags: [fulfillment-issues]
      summary: 이행 확인 필요 주문 목록 — 운영자 (0.2.0)
      description: |
        2026-11-08 사용자 결정(외부 검토 #5 반영): MFC 재고가 격리·실사 손실로 주문 예약 일부를 보류(ReservationBlocked, 다른 LOT 으로도 못 다시 잡음)하면
        주문을 "확인 필요"로 표시해 담당자가 보게 한다. **자동 취소·환불·LOT 대체·고객 안내는 하지 않는다**(정책 확정 전) — 주문 상태도 바꾸지 않는다.
        그 센터 운영자(centers 에 mfcId). 기본은 OPEN.
      operationId: listFulfillmentIssues
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] } }
      responses:
        '200':
          description: OK (새 것부터, 최대 500)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FulfillmentIssue' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /fulfillment-issues/{issueId}/acknowledgements:
    post:
      tags: [fulfillment-issues]
      summary: 이행 확인 필요 — 담당자 확인 (0.2.0)
      description: 확인 표시만 한다(처리 내용은 note). 그 센터 운영자. 이미 확인했으면 지금 상태.
      operationId: acknowledgeFulfillmentIssue
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: issueId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 확인됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentIssue' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /delivery-options:
    get:
      tags: [drafts]
      summary: 배송 방식별 가능 여부·사유·예상시간·배달팁·가장 빠른 예약 슬롯 (BR-13)
      description: |
        담당 MFC 기준 현재 시각(서버, Asia/Seoul)으로 판정한다. 00:00~08:00 에는 한집·알뜰을 NIGHT_TIME 으로 막고 예약만 안내한다.
        itemAmount(장바구니 selectedItemAmount 등 서버 값)를 주면 무료 사유를 적용한 배달팁을 함께 준다. 최종 금액은 주문 초안에서 확정한다.
        회원·비회원 토큰 모두 된다(비회원은 첫 구매 무료를 판정하지 않는다).
      operationId: getDeliveryOptions
      x-pmart-user-types: [CUSTOMER, GUEST]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: itemAmount, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryOptions' }
  /order-drafts:
    post:
      tags: [drafts]
      summary: "주문 초안 생성 (멱등: purchaseIntentId + Idempotency-Key)"
      operationId: createOrderDraft
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDraftRequest' }
      responses:
        '201':
          description: 초안 생성 또는 기존 초안 반환(같은 키·같은 본문)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: 검증 거절 (ACCOUNT_NOT_PURCHASABLE, SKU_NOT_SALEABLE, QUANTITY_LIMIT_EXCEEDED, PRICE_NOT_SET, OUT_OF_SERVICE_AREA, SERVICEABILITY_UNKNOWN, MFC_CHANGED(409), WEIGHT_UNSPLITTABLE, CONFIG_REQUIRED). 최소주문 미달·배송 방식 불가·슬롯 문제는 거절이 아니라 초안 blockers 로 준다(모든 사유 표시)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /order-drafts/{draftId}:
    get:
      tags: [drafts]
      summary: 초안 조회 (견적·유효시간·자원 확보 상태)
      operationId: getOrderDraft
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /order-drafts/{draftId}/checkouts:
    post:
      tags: [drafts]
      summary: 결제 진입 요청 → order-orchestration S1 시작
      description: |
        가격 동결(quoteExpiresAt)과 acceptedQuoteVersion을 검증한 뒤 사가를 시작한다.
        응답 ACCEPTED는 "사가 시작"이지 재고·슬롯·결제 성공이 아니다. 진행은 GET /order-drafts/{draftId}로 조회(resultId = orderId).
        진행 중이면 status RESOURCE_PENDING·nextAction WAIT, 결제창을 열 수 있으면 PAYMENT_PENDING·PAY 와 payment, 실패하면 DRAFT·REVIEW 와 checkoutFailure.
        같은 초안에 진행 중인 결제 진입이 있으면 그 진입을 그대로 돌려준다(409 아님). 2026-10-31 단계: 결제 시작까지(승인 대사·주문 확정은 다음 단계).
      operationId: startCheckout
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptedQuoteVersion, paymentMethod]
              properties:
                acceptedQuoteVersion: { type: integer }
                paymentMethod: { type: string, enum: [TOSS_PAYMENTS] }
                consents:
                  type: array
                  items: { type: object, properties: { consentType: { type: string }, version: { type: string } } }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: RE_QUOTE_REQUIRED (10분 경과·acceptedQuoteVersion 불일치) / CHECKOUT_BLOCKED (초안 blockers 가 남음) / ACCOUNT_NOT_PURCHASABLE (초안 뒤 계정이 구매 불가로 바뀜 — 결제 진입 때 다시 확인, BR-37) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /orders:
    get:
      tags: [orders]
      summary: 본인 주문 목록 (조회 기간은 정책값)
      description: |
        고객 토큰만(그 밖 403). 본인의 확정 주문만 최근 확정 순(confirmedAt 내림차순). 결제 진입 전·확정 전 주문 ID 는 나오지 않는다 — 진행은 초안 조회로.
        page.nextCursor 는 불투명 문자열(다음 쪽 cursor 로 그대로). 조회 기간 정책값은 아직 없어 기간으로 자르지 않는다.
        itemCount 는 주문행 수량 합.
      operationId: listOrders
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /orders/{orderId}:
    get:
      tags: [orders]
      summary: 주문 상세 (스냅샷 + 소유 시스템 확정 결과의 조합, 원천별 asOf 표시)
      description: |
        고객 토큰만(그 밖 403). 남의 주문·확정 전 주문 ID 는 404(존재를 드러내지 않음).
        현재(결제 확정 단계)는 order 원장만 조합한다: 확정 스냅샷(품목·배송·견적 금액)·주문행 수량(originalQty = unfulfilledQty = 주문 수량, 나머지 0)·
        payment{paymentAttemptId, state=APPROVED}. shipments·claims 는 빈 배열, sources 는 order-service 하나(CURRENT).
        quote.firstPurchaseBenefit 는 첫 구매 무료를 실제 적용했으면 CONFIRMED, 아니면 NOT_ELIGIBLE. productName·optionLabel 은 초안 때 뜬 주문 당시 사본(BR-35, 2026-11-02 이전 주문은 비어 있음).
      operationId: getOrder
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /orders/{orderId}/reservation-time-changes:
    post:
      tags: [orders]
      summary: 예약배달 시간 변경 (상품준비 진입 전만) → S4
      operationId: requestReservationTimeChange
      x-pmart-user-types: [CUSTOMER]
      x-pmart-user-types-note: "추정 — 미구현, 본인 주문의 예약 시간 변경으로 봄"
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newArrivalWindow]
              properties:
                newArrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: INVALID_STATE (이미 상품준비 진입) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /orders/{orderId}/reservation-time-changes/{requestId}:
    get:
      tags: [orders]
      summary: 시간 변경 요청 결과 조회 (PENDING/CONFIRMED/REJECTED/UNKNOWN)
      operationId: getReservationTimeChange
      x-pmart-user-types: [CUSTOMER]
      x-pmart-user-types-note: "추정 — 미구현, 변경을 요청한 고객의 조회로 봄"
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  state: { type: string, enum: [PENDING, CONFIRMED, REJECTED, UNKNOWN] }
                  reason: { type: string }
                  newVersion: { type: integer }

  # ---------- internal (서비스 토큰) ----------
  /internal/orders/{orderId}/confirmation:
    post:
      tags: [internal]
      summary: '[orchestration→order] 주문 확정 (PG 승인 대사 일치 + 자원 확정 후)'
      operationId: confirmOrder
      description: |
        서비스 토큰만. orderId 는 결제 진입(checkouts) 때 초안에 발급한 ID. 초안 스냅샷(품목·배송·동결 견적)을 주문 원장으로 옮겨 status=CONFIRMED, version=1 로 만들고
        같은 트랜잭션에서 OrderConfirmed(토픽 order.order.v1)를 Outbox 에 쓴다. 주문행 ID 는 `<orderId>-L<n>`(초안 품목 순서, 사가 시작 때 보낸 값과 같음).
        - 200 APPLIED, resultId = orderId, version = 주문 버전. 같은 Idempotency-Key 는 저장 결과 재생. 이미 확정된 주문은 다른 키로 와도 200(사건은 다시 내지 않음).
        - 404 ORDER_NOT_FOUND: 이 orderId 를 가진 초안이 없음(다른 결제 진입으로 바뀐 옛 orderId 포함).
        - 422 AMOUNT_MISMATCH: approvedAmount ≠ 초안 quote.totalAmount. 확정하지 않는다(사가가 대사 대상으로 넘긴다). 기록하지 않으므로 같은 키 재시도도 다시 판정.
        - 409 INVALID_STATE: 같은 초안이 이미 다른 orderId 로 확정됨 / SKU 구성 수를 확인하지 못함. VERSION_CONFLICT: X-Expected-Version ≠ 초안 버전.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentAttemptId, pgTransactionId, approvedAmount, reservationId]
              properties:
                paymentAttemptId: { type: string }
                pgTransactionId: { type: string }
                approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
                reservationId: { type: string }
                capacityHoldId: { type: string }
                slotHoldId: { type: string }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: AMOUNT_MISMATCH → 확정 차단, 대사 대상
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/orders/{orderId}:
    get:
      tags: [internal]
      summary: '[claim→order] 주문 원장 조회 (서비스 토큰) — 클레임 심사·환불 근거'
      description: |
        서비스 토큰만. 고객 조회와 달리 소유자(accountId)·결제 시도·승인액·행별 수량 누계를 돌려준다. 확정 전 주문 ID 는 404.
      operationId: getInternalOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalOrder' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/delivery-destination:
    get:
      tags: [internal]
      summary: '[delivery-dispatch→order] 배송지 (토큰 없는 내부 호출) — 배차 좌표·배송 방식'
      description: |
        배차가 고객 배송지 좌표(MFC → 고객 도로 거리·예상 배달료)와 배송 방식(한집·알뜰·예약)을 읽는다(2026-11-13, delivery DD-1 — 요청 O-4).
        주문 당시 사본(BR-37)의 도로명주소와 지도 핀만 준다 — 수령인·연락처·출입 정보는 주지 않는다(배차에 필요 없음). 도로명주소는 받는 쪽이 좌표로 바꾸는 데만 쓰고 저장·로그하지 않는다.
        사본이 없는 주문(2026-11-02 이전)은 roadAddress null. 확정 전 주문 ID 는 404.
      x-added-in: '2026-11-13'
      operationId: getOrderDeliveryDestination
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryDestination' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/line-quantity-changes:
    post:
      tags: [internal]
      summary: '[orchestration/claim→order] 주문행 수량 변경 (결품·출고 전 취소·인계 누계·반품 수량 반영)'
      description: |
        구현 범위는 reason=CANCEL_BEFORE_SHIP(출고 전 취소, 2026-10-31)·SHORTAGE(결품 — 품절 상품만 취소, 2026-11-07 ADR-0045, 같은 수량 규칙·주문 상태 유지) 만. 그 밖의 사유는 422 UNSUPPORTED_ACTION.
        행마다 unfulfilledQty −= qty, cancelledBeforeShipQty += qty(qty > unfulfilledQty 면 409 INVALID_STATE, 아무것도 바꾸지 않음).
        모든 행의 unfulfilledQty·handedOverQty 가 0 이 되면 주문 status=CANCELLED. 같은 트랜잭션에서 행마다 OrderLineQuantityChanged,
        주문에 OrderCancelled(scope FULL/PARTIAL, claimId) 를 Outbox 에 쓴다(토픽 order.order.v1). 같은 Idempotency-Key 는 저장 결과 재생.
      operationId: applyLineQuantityChange
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                reason: { type: string, enum: [SHORTAGE, CANCEL_BEFORE_SHIP, HANDOVER, RETURN, EXCHANGE] }
                sourceRef: { type: string, description: stopRequestId / handoverId / claimId }
                claimId: { type: string, description: 취소·반품 클레임(사건 OrderLineQuantityChanged·OrderCancelled 에 싣는다) }
                changes:
                  type: array
                  items:
                    type: object
                    required: [orderLineId, qty]
                    properties:
                      orderLineId: { type: string }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: 불변식 위반 (원수량 ≠ 미이행 + 인계 누계 + 출고 전 취소 누계)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/accounts/{accountId}/withdrawal-eligibility:
    get:
      tags: [internal]
      summary: '[customer→order] 탈퇴 가능 여부 (미결 주문·불명 결제·환불·회수·분쟁)'
      operationId: getWithdrawalEligibility
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligible: { type: boolean }
                  openObligations:
                    type: array
                    items: { type: object, properties: { kind: { type: string }, ref: { type: string } } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /internal/order-lines/{orderLineId}/delivery-facts:
    get:
      tags: [internal]
      summary: '[review/claim→order] 품목별 실제 배송완료 시각·수량 (리뷰 14일·반품 기한 근거)'
      operationId: getOrderLineDeliveryFacts
      parameters:
        - { name: orderLineId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderLineId: { type: string }
                  deliveredQty: { type: integer }
                  deliveredAt: { type: string, format: date-time }
                  deliveryId: { type: string }
                  evidenceRef: { type: string }

  /internal/customer-commitments:
    get:
      tags: [internal]
      summary: '[replenishment→order] 확정 미이행 고객 약속 C (센터·SKU·기간)'
      operationId: listCustomerCommitments
      parameters:
        - { name: mfcId, in: query, required: true, schema: { type: string } }
        - { name: sku, in: query, schema: { type: string } }
        - { name: dueBefore, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        orderId: { type: string }
                        orderLineId: { type: string }
                        sku: { type: string }
                        committedQty: { type: integer }
                        dueAt: { type: string, format: date-time }
                        state: { type: string, enum: [VALID, BLOCKED] }
                        version: { type: integer }

components:
  schemas:
    FulfillmentIssue:
      type: object
      properties:
        issueId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
        reservationId: { type: string }
        sku: { type: string }
        lotId: { type: [string, 'null'] }
        blockedQty: { type: integer }
        reason: { type: string, description: 'QUALITY_HOLD(품질 격리)·COUNT_LOSS(실사 손실)·SHORT·DAMAGED(피킹 결품 보고) 등 — inventory 사유 그대로' }
        state: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED], description: 'RESOLVED = 피킹 시작 전에 MFC 가 보류분을 다시 잡음(자동, 2026-11-08). 피킹 시작 뒤 남은 보류는 결품 사가가 고객 사전 선택대로 처리' }
        note: { type: [string, 'null'] }
        acknowledgedBy: { type: [string, 'null'] }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        blockedAt: { type: string, format: date-time }
    DeliveryDestination:
      type: object
      description: 배차용 배송지(개인정보 최소 — 수령인·연락처·출입 정보 없음)
      required: [orderId, mfcId, status, deliveryMode, confirmedAt]
      properties:
        orderId: { type: string }
        mfcId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED], description: 한집 / 알뜰 / 예약 }
        confirmedAt: { type: string, format: date-time, description: '주문 확정 시각 — 배송 약속(한집·알뜰 = 확정 + 50분, 사용자 2026-11-13) 계산', x-added-in: '2026-11-13' }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
        roadAddress: { type: [string, 'null'], description: 주문 당시 도로명주소 — 좌표 변환에만 쓴다(저장·로그 금지) }
        geo:
          type: [object, 'null']
          description: 고객이 지도 핀으로 맞춘 위치(참고, ADR-0023)
          properties:
            lat: { type: number }
            lng: { type: number }
    InternalOrder:
      type: object
      description: 서비스 간 주문 원장 사본(claim 심사·환불 근거). 금액은 주문 당시 동결 견적, 승인액은 PG 승인 사실.
      required: [orderId, accountId, status, version, mfcId, paymentAttemptId, approvedAmount, totalAmount, lines, confirmedAt]
      properties:
        orderId: { type: string }
        accountId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        version: { type: integer }
        mfcId: { type: string }
        paymentAttemptId: { type: string }
        approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        itemAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        deliveryTip: { $ref: '_common.yaml#/components/schemas/Money' }
        bagFee: { $ref: '_common.yaml#/components/schemas/Money' }
        totalAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        firstPurchase: { type: boolean }
        confirmedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [orderLineId, sku, quantity, unitPrice, lineAmount, originalQty, unfulfilledQty, handedOverQty, cancelledBeforeShipQty]
            properties:
              orderLineId: { type: string }
              sku: { type: string }
              quantity: { type: integer }
              unitPrice: { $ref: '_common.yaml#/components/schemas/Money' }
              lineAmount: { $ref: '_common.yaml#/components/schemas/Money' }
              discountShare: { $ref: '_common.yaml#/components/schemas/Money' }
              originalQty: { type: integer }
              unfulfilledQty: { type: integer }
              handedOverQty: { type: integer }
              cancelledBeforeShipQty: { type: integer }
    OrderStatus:
      type: string
      enum: [DRAFT, RESOURCE_PENDING, PAYMENT_PENDING, PAYMENT_UNKNOWN, CONFIRMED, PREPARING, PARTIALLY_HANDED_OVER, IN_DELIVERY, PARTIALLY_DELIVERED, COMPLETED, CANCELLED, EXPIRED]
    ArrivalWindow:
      type: object
      required: [date, start, end]
      properties:
        date: { type: string, format: date, description: Asia/Seoul }
        start: { type: string, example: '13:00' }
        end: { type: string, example: '14:00' }
    CreateDraftRequest:
      type: object
      required: [purchaseIntentId, items, shoppingAddressId, deliveryMode, outOfStockPreference]
      properties:
        purchaseIntentId: { type: string, description: 동일 주문 의도 식별 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [cartItemId, sku, quantity]
            properties:
              cartItemId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
        shoppingAddressId: { type: string }
        expectedMfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
        outOfStockPreference: { type: string, enum: [CANCEL_OOS_ONLY, CANCEL_ALL] }
        contact: { type: object, deprecated: true, description: '쓰지 않는다(BR-37) — 수령인·연락처는 shoppingAddressId 배송지의 값을 초안 때 사본으로 고정한다', properties: { phoneRef: { type: string } } }
        deliveryNote: { type: string, maxLength: 200 }
        bagOptOut: { type: boolean, description: 봉투 미사용 선택이어도 봉투값 100원은 청구 }
    Quote:
      type: object
      properties:
        quoteVersion: { type: integer }
        quoteExpiresAt: { type: string, format: date-time, description: 초안 생성 + 10분 }
        priceVersion: { type: integer }
        itemAmount: { $ref: '_common.yaml#/components/schemas/Money', description: 오퍼·프로모션 후, 쿠폰 전 상품액 }
        deliveryTip: { $ref: '_common.yaml#/components/schemas/Money' }
        deliveryTipReason: { type: string, enum: [STANDARD, OVER_30000, FIRST_PURCHASE, NONE] }
        bagFee: { $ref: '_common.yaml#/components/schemas/Money', example: 100 }
        totalAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        minOrderSatisfied:
          type: boolean
          description: 최소 주문금액 15000원은 쿠폰 전 상품액 기준
        weightG: { type: integer }
        plannedShipments:
          type: integer
          description: 총 상품중량 10000g 초과 시 2 이상
        minOrderAmount: { $ref: '_common.yaml#/components/schemas/Money', description: 최소 주문 상품액(15,000). 배달팁·봉투값 제외 }
        minOrderShortfall: { $ref: '_common.yaml#/components/schemas/Money', description: '부족액 = max(0, minOrderAmount − itemAmount). "N원 더 담기" 표시용 (BR-14)' }
        deliveryTipBase: { $ref: '_common.yaml#/components/schemas/Money', description: 무료 사유 적용 전 방식별 배달팁(한집 4,000·알뜰/예약 3,000) }
        firstPurchaseBenefit:
          type: string
          enum: [EXPECTED, CHECKING_OTHER_ORDER, CONFIRMED, NOT_ELIGIBLE]
          description: '첫 구매 무료배달 상태(Commerce 8.8, BR-14). 초안 단계는 EXPECTED 까지 — 자격 확보(CONFIRMED)는 결제 진입 때 order 가 한다. 30,000원 이상 무료면 사유는 OVER_30000 이고 이 값은 참고용'
    DraftLine:
      type: object
      description: 서버가 받아들인 품목 (BR-21)
      properties:
        cartItemId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        productId: { type: string }
        productName: { type: [string, 'null'], description: 고객용 상품명 사본(BR-35). 조회 실패면 null }
        optionLabel: { type: [string, 'null'], description: 옵션 라벨 사본. 단일 옵션 상품은 null 일 수 있다 }
        quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
        unitPrice: { $ref: '_common.yaml#/components/schemas/Money' }
        lineAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        weightG: { type: integer }
    ShippingAddress:
      type: [object, 'null']
      description: |
        주문 당시 배송지·수령 연락처 사본(BR-37, OMS 153행·Commerce 3294·3351행). 초안을 만들 때 customer-service 의 배송지를 복사해 고정하고,
        주문 확정 때 주문으로 옮긴다. 이후 주소록을 고치거나 지워도 바뀌지 않는다. 본인 주문 조회에만 싣는다(개인정보 — 이벤트·로그에 넣지 않는다).
        2026-11-02 이전에 만든 초안·주문은 사본이 없어 null 이다.
      properties:
        roadAddress: { type: string }
        detailAddress: { type: string }
        postalCode: { type: [string, 'null'] }
        receiverName: { type: string }
        receiverPhone: { type: string, description: 본인 조회라 가리지 않는다(주소록 조회와 같음) }
        entranceMethod: { type: [string, 'null'], enum: [FREE, PASSWORD, CALL, OTHER, null] }
        entranceNote: { type: [string, 'null'], description: 출입 비밀번호일 수 있다 — 로그 금지 }
        geo:
          type: [object, 'null']
          description: 고객이 지도 핀으로 맞춘 배달 위치(참고, ADR-0023)
          properties:
            lat: { type: number }
            lng: { type: number }
        capturedAt: { type: string, format: date-time, description: 사본을 뜬 시각(초안 생성) }
    DraftDelivery:
      type: object
      description: 서버가 받아들인 배송 조건 (BR-21). 배송지·수령 연락처는 초안을 만들 때 사본으로 고정하고(shippingAddress) 주문 확정 때 그대로 옮긴다(BR-37)
      properties:
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
        shoppingAddressId: { type: string }
        shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
        deliveryNote: { type: string }
        outOfStockPreference: { type: string, enum: [CANCEL_OOS_ONLY, CANCEL_ALL] }
    DraftBlocker:
      type: object
      description: '결제 진입을 막는 사유. 모두 보여 주고 주버튼에는 첫 사유(MIN_ORDER_AMOUNT → DELIVERY_MODE_UNAVAILABLE → SLOT_REQUIRED/SLOT_UNAVAILABLE 순)'
      required: [code]
      properties:
        code: { type: string, enum: [MIN_ORDER_AMOUNT, DELIVERY_MODE_UNAVAILABLE, SLOT_REQUIRED, SLOT_UNAVAILABLE] }
        detail: { type: string }
    DeliveryOption:
      type: object
      required: [mode, availability]
      properties:
        mode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        availability: { type: string, enum: [AVAILABLE, UNAVAILABLE, CONFIG_REQUIRED, UNKNOWN] }
        unavailableReason:
          type: [string, 'null']
          enum: [NIGHT_TIME, CENTER_CLOSED, NO_SLOT, CONFIG_REQUIRED, LOOKUP_FAILED, null]
          description: 'NIGHT_TIME = 00:00~08:00 실제 배송 없음(예약만). 조회 실패(LOOKUP_FAILED)를 배달 불가로 표시하지 않는다'
        eta: { $ref: '_common.yaml#/components/schemas/PolicyValue', description: '예상 소요시간 {minMinutes, maxMinutes}. 정책값 미설정이면 NOT_SET' }
        deliveryTip:
          type: object
          properties:
            base: { $ref: '_common.yaml#/components/schemas/Money' }
            applied: { type: [integer, 'null'], description: itemAmount 를 주면 무료 사유 적용 금액. 안 주면 null }
            reason: { type: [string, 'null'], enum: [STANDARD, OVER_30000, FIRST_PURCHASE, null] }
        earliestSlot: { $ref: '#/components/schemas/ArrivalWindow' }
    DeliveryOptions:
      type: object
      properties:
        mfcId: { type: string }
        evaluatedAt: { type: string, format: date-time }
        options: { type: array, items: { $ref: '#/components/schemas/DeliveryOption' } }
    ResourceState:
      type: object
      properties:
        inventoryReservation: { type: string, enum: [NOT_REQUESTED, HELD, FAILED, RELEASED, UNKNOWN, PAYMENT_PENDING_HOLD] }
        capacityHold: { type: string, enum: [NOT_REQUESTED, HELD, FAILED, RELEASED, UNKNOWN] }
        slotHold: { type: string, enum: [NOT_REQUIRED, HELD, FAILED, RELEASED, UNKNOWN] }
        payment: { type: string, enum: [NOT_STARTED, STARTED, APPROVED, FAILED, UNKNOWN, MISMATCH] }
        reservationExpiresAt: { type: string, format: date-time }
    OrderDraft:
      type: object
      properties:
        draftId: { type: string }
        purchaseIntentId: { type: string }
        version: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        mfcId: { type: string }
        quote: { $ref: '#/components/schemas/Quote' }
        resources: { $ref: '#/components/schemas/ResourceState' }
        nextAction: { type: string, enum: [REVIEW, RE_QUOTE, PAY, WAIT, DONE, EXPIRED] }
        orderId: { type: string, description: 결제 진입(checkouts) 때 발급. 결제·재고 예약·슬롯이 이 ID 를 쓴다. 확정 전에는 주문 조회 대상이 아니다 }
        payment:
          type: object
          description: nextAction=PAY 일 때만. 결제창(토스 결제위젯) 진입 정보 — 비밀값 없음. 결제창의 orderId 는 pgOrderId
          properties:
            paymentAttemptId: { type: string }
            amount: { $ref: '_common.yaml#/components/schemas/Money' }
            orderName: { type: string }
            provider: { type: string, enum: [TOSS_PAYMENTS] }
            pgOrderId: { type: string }
            clientKey: { type: string }
            checkoutUrl: { type: string }
            expiresAt: { type: string, format: date-time, description: 이 시각까지 결제창 인증을 끝내야 한다(재고 예약·슬롯·가격 동결 중 가장 이른 만료) }
        checkoutFailure:
          type: object
          description: 마지막 결제 진입이 자원 확보·결제 시작에서 실패했을 때. 확보했던 자원은 해제된다(이번 시도분만). 견적이 유효하면 다시 결제 진입할 수 있다
          properties:
            step: { type: string, description: 실패 단계(RESERVE_INVENTORY·HOLD_CAPACITY·HOLD_SLOT·START_PAYMENT·AWAIT_PAYMENT_RESULT 등) }
            code: { type: string, description: 예 INSUFFICIENT_STOCK·SKU_NOT_HANDLED·CAPACITY_EXCEEDED·SLOT_NOT_SELECTABLE·CONFIG_REQUIRED·RESOURCE_EXPIRED }
            message: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/DraftLine' } }
        delivery: { $ref: '#/components/schemas/DraftDelivery' }
        blockers: { type: array, items: { $ref: '#/components/schemas/DraftBlocker' } }
        createdAt: { type: string, format: date-time }
    OrderLine:
      type: object
      properties:
        orderLineId: { type: string }
        sku: { type: string }
        productName: { type: [string, 'null'], description: 고객용 상품명의 주문 당시 사본(BR-35, 초안 때 고정). 조회 실패·2026-11-02 이전 주문은 null — 앱은 그때만 sku 로 대신 }
        optionLabel: { type: [string, 'null'], description: 옵션 라벨의 주문 당시 사본(BR-35) }
        productId: { type: string }
        cartItemId: { type: string, description: 주문 대상이던 장바구니 품목(장바구니 정리용) }
        lineAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        unitsPerSku: { type: integer }
        unitPrice: { $ref: '_common.yaml#/components/schemas/Money' }
        discountShare: { $ref: '_common.yaml#/components/schemas/Money' }
        originalQty: { type: integer }
        unfulfilledQty: { type: integer }
        handedOverQty: { type: integer }
        cancelledBeforeShipQty: { type: integer }
        deliveredQty: { type: integer }
        returnedQty: { type: integer }
    Shipment:
      type: object
      properties:
        shipmentId: { type: string }
        deliveryId: { type: string }
        lines: { type: array, items: { type: object, properties: { orderLineId: { type: string }, qty: { type: integer } } } }
        weightG: { type: integer }
        state: { type: string, enum: [PLANNED, PREPARING, READY, HANDED_OVER, IN_DELIVERY, DELIVERED, FAILED, CANCELLED] }
        eta: { type: string, format: date-time }
    Order:
      type: object
      properties:
        orderId: { type: string }
        version: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        mfcId: { type: string }
        deliveryMode: { type: string }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
        confirmedAt: { type: string, format: date-time, description: 주문 확정 시각 }
        outOfStockPreference: { type: string, enum: [CANCEL_OOS_ONLY, CANCEL_ALL] }
        shoppingAddressId: { type: string }
        shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
        deliveryNote: { type: string }
        quote: { $ref: '#/components/schemas/Quote' }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        shipments: { type: array, items: { $ref: '#/components/schemas/Shipment' } }
        payment:
          type: object
          properties:
            paymentAttemptId: { type: string }
            state: { type: string }
            refundedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
