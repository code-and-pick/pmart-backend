        deliveryNoteMasked: { type: boolean, description: '(0.5.0) 배송 요청사항이 있는데 가렸으면 true — 화면은 "열람" 버튼을 보인다' }
        weightG: { type: integer }
        plannedShipments: { type: integer }
        amounts: { $ref: '#/components/schemas/StaffOrderAmounts' }
        payment:
