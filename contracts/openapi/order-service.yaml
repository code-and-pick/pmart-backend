            code: { type: string, description: 예 INSUFFICIENT_STOCK·SKU_NOT_HANDLED·CAPACITY_EXCEEDED·SLOT_NOT_SELECTABLE·CONFIG_REQUIRED·RESOURCE_EXPIRED }
            message: { type: string }
