openapi: 3.1.0
info:
  title: embedding-service
  version: 0.2.0
  description: |
    ES 청크 → Ollama 임베딩 → pgvector(ADR-0098, 2026-11-28) — ES-First 하이브리드 RAG 의 "ES 선 색인 → 임베딩 → pgvector 후 적재"(계획 §1-2 단계 3·4).
    chunking-service 가 문서 하나를 ES(rag-operator·rag-customer)에 반영하면 알린다. 이 서비스는 ES 에서 그 문서의 ACTIVE 청크를 읽어(말뭉치)
    임베딩할 글(제목 경로 + 본문)의 해시가 캐시에 없을 때만 Ollama qwen3-embedding:0.6b(1024차원, CPU)로 벡터를 만들고, 같은 chunkId 로 자기
    pgvector(DB embedding_service, rag-pgvector)에 넣는다. ES 에 없는 청크(옛 판·RETIRED)는 is_active=false(임베딩 없이, 계획 §1-3).
    놓친 알림은 맞춰 보기(기동 때·10분마다 ES 와 pgvector 의 문서 판 비교)가 채운다. Kafka 없음.
    서비스 간 경로(게이트웨이에 없음, 사용자 토큰 없음).
    0.2.0(2026-11-28, ADR-0099): 질문 벡터 검색 `/internal/vector-searches` — rag-query-service 가 ES 로 끝내지 못한 질문에 부른다(질문에 범위별 지시문을 붙여 같은 모델·판으로 임베딩).
servers:
  - url: /api/v1
tags:
  - { name: embedding-jobs, description: 문서 벡터 맞춤 }

paths:
  /internal/embedding-jobs:
    post:
      tags: [embedding-jobs]
      summary: "[chunking-service→embedding-service] 문서 하나를 ES 청크에 맞춰 벡터로 (비동기, 202)"
      description: |
        같은 (범위, 문서)가 이미 기다리면 다시 넣지 않는다. 처리는 스레드 하나(Ollama 를 PC 2 다른 업무와 나눠 씀). 같은 문서를 몇 번 맞춰도 결과가 같다(멱등).
      operationId: enqueueEmbeddingJob
      security: []
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, scopes]
              properties:
                documentId: { type: string, examples: [operator/order_claim/07-misdelivery.md] }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [rag-operator, rag-customer, OPERATOR, CUSTOMER] }
      responses:
        '202':
          description: 일 줄에 넣음
          content:
            application/json:
              schema:
                type: object
                required: [documentId, scopes]
                properties:
                  documentId: { type: string }
                  scopes: { type: array, items: { type: string } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
  /internal/vector-searches:
    post:
      tags: [embedding-jobs]
      summary: "[rag-query-service→embedding-service] 질문 벡터 검색(범위의 ACTIVE 청크, 코사인 높은 순)"
      operationId: vectorSearch
      security: []
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, question]
              properties:
                scope: { type: string, enum: [rag-operator, rag-customer, OPERATOR, CUSTOMER] }
                question: { type: string }
                size: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                type: object
                required: [model, version, hits, embedMillis]
                properties:
                  model: { type: string }
                  version: { type: string }
                  embedMillis: { type: integer }
                  hits:
                    type: array
                    items:
                      type: object
                      required: [chunkId, documentId, sectionPath, cosine]
                      properties:
                        chunkId: { type: string }
                        documentId: { type: string }
                        sectionPath: { type: string }
                        cosine: { type: number }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
