      summary: 문의 목록 (고객·라이더 = 본인 것, CS_AGENT = 고객 문의, RIDER_OPS = 라이더 문의, OPERATOR_ADMIN = 전체)
      description: 최근 접수 순. 고객 토큰은 본인 문의만(0.12.0 — 상담원 접수 STAFF_INTAKE 는 빼고, 상세도 404), 라이더 토큰은 본인 라이더 문의만(0.13.0), 운영자는 CS_AGENT 고객 문의·RIDER_OPS 라이더 문의(0.13.0)·OPERATOR_ADMIN 전부(그 밖 403 — OPERATOR_ADMIN 은 보기만, 0.4.2). status 로 거른다. 0.5.0(2026-11-16 통합 조회) — orderId 로도 거른다(완전 일치, 고객은 여전히 본인 것만).
      operationId: listInquiries
