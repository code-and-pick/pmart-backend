        - { name: requesterType, in: query, schema: { $ref: '#/components/schemas/InquiryRequesterType' }, description: '운영자 거르기(0.13.0). 비우면 볼 수 있는 것 전부 — CS_AGENT 는 고객 문의, RIDER_OPS 는 라이더 문의. 볼 수 없는 종류를 고르면 403. 고객 문의를 못 보는 직원이 orderId 로 거르면 403', x-added-in: '2026-11-16' }
      responses:
        '200':
