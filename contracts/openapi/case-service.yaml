      x-added-in: '2026-11-17'
      description: |
        2026-11-17 사용자 결정 — 만족도는 상담원 평가·제재에 쓰지 않고 관리자만 모아 본다(업무 원문 Commerce §14.2, 지표 BO-28: 비율은 분자·분모를 함께, 분모 0 은 N/A).
        기간 = 답변 시각 [answeredFrom, answeredTo), 92일까지(넘거나 순서가 틀리면 400). 대상 = 고객 문의(상담원 접수 STAFF_INTAKE·라이더 문의 제외).
        answeredCount(분모) 중 ratedCount(분자)가 남겼고, 평균은 scoreSum/ratedCount(남긴 건 0 이면 null). 상담원별·문의별로 나누지 않는다. OPERATOR_ADMIN 만(그 밖 403).
      operationId: getInquirySatisfactionSummary
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: answeredFrom, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: answeredTo, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquirySatisfactionSummary' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /inquiries/{inquiryId}/satisfaction:
    post:
      tags: [inquiries]
      summary: 문의 만족도 남기기 (남긴 고객 — 답변 뒤 한 번, 0.15.0)
      x-added-in: '2026-11-17'
      description: |
        2026-11-17 사용자 "답변 뒤 1~5점 + 한 줄"(업무 원문 Commerce §14.2 — 만족도는 상담 평가일 뿐 반품·환불 종결이나 라이더 평가가 아니다).
        남긴 고객 본인만(남의 문의·상담원 접수 404, 라이더·직원 403). 답변이 아직 없으면 409 INQUIRY_NOT_ANSWERED, 이미 남겼으면 409 ALREADY_RATED(고치기 없음).
        상태·version 은 그대로. 상담원에게 보이지 않는다(문의 상세의 satisfaction 은 본인·OPERATOR_ADMIN 에게만). 이벤트·알림 없음. 의견은 로그에 남기지 않는다.
      operationId: rateInquiry
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: inquiryId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 만족도가 붙은 문의
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inquiry' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /inquiries/{inquiryId}/closures:
    post:
      tags: [inquiries]
      summary: 문의 닫기 (남긴 고객·라이더 본인 또는 답변 역할 직원 — 0.19.0)
      x-added-in: '2026-11-17'
      description: |
        2026-11-17 사용자 "그 표대로 진행해, 다시 열기는 빼고"(업무 원문 Commerce §14.2-5 "상담 종료 선택은 확인 후 대화 종료로 기록" — 상담 종료는 거래 의무 종결이 아니다).
        - 닫는 사람: 문의를 남긴 고객·라이더 본인, 또는 답변 역할 직원(고객 문의·상담원이 남긴 문의 = CS_AGENT, 라이더 문의 = RIDER_OPS). OPERATOR_ADMIN 은 보기만(403).
          남의 문의·고객 앱에 안 보이는 문의(STAFF_INTAKE)를 고객이 닫으면 404.
        - **직원은 사유 필수**(2~500자, 없으면 400) — 사유는 직원에게만 보이고 고객·라이더에게는 closedByType STAFF 만. 고객·라이더가 보낸 reason 은 남기지 않는다.
        - 답변 전에도 닫을 수 있다(고객 "해결됐어요"). 이미 닫힘 409 INQUIRY_CLOSED. **다시 열기·자동 닫기 없음**(새 문의로).
        - 닫을 때 만족도(선택, 고객만): `score`(1~5)·`comment`(200자) — 답변을 받은 고객 문의만(아니면 400), 이미 남겼으면 409 ALREADY_RATED. 직원이 score 를 보내면 400.
        - 닫으면 status CLOSED(version + 1), 그 접수 건 행도 CLOSED, 이력 INQUIRY_CLOSED. 답변·사진 보완은 409 INQUIRY_CLOSED. 주문·클레임·다른 접수 건은 그대로. 이벤트·알림 없음.
      operationId: closeInquiry
      x-pmart-user-types: [CUSTOMER, RIDER, OPERATOR]
      parameters:
        - { name: inquiryId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, description: '직원 필수(2자 이상) — 고객·라이더는 비움' }
                score: { type: integer, minimum: 1, maximum: 5, description: '닫을 때 만족도(고객만, 선택)' }
                comment: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 닫힌 문의
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inquiry' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /inquiries/{inquiryId}/messages:
    get:
      tags: [inquiries]
      summary: (0.21.0) 라이더 문의 대화 — 메시지 목록 (라이더 본인 · RIDER_OPS · OPERATOR_ADMIN)
      description: |
        2026-11-17 라이더 앱 요청 §19(사용자 "문의에 대화 붙이기"): 배송 밖 문의(라이더 문의)를 채팅처럼 이어 쓴다. 도움요청 대화와 같은 모양.
        처음 문의 내용은 `GET /inquiries/{id}` 의 `body`, 이 목록은 그 뒤 주고받은 것 — 지원센터 답변(`/replies`, senderType SUPPORT)과 라이더 추가 메시지(RIDER).
        오래된 것부터. `after` = 마지막으로 받은 seq — 그보다 뒤 메시지만(앱 몇 초마다 확인용). 한 번에 200개까지.
        고객 문의·남의 문의는 404. 볼 권한은 `GET /inquiries/{id}` 와 같다.
      operationId: listInquiryMessages
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: inquiryId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 }, description: 이 seq 뒤 메시지만 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, status]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InquiryMessage' } }
                  status: { $ref: '#/components/schemas/InquiryStatus' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    post:
      tags: [inquiries]
      summary: (0.21.0) 라이더 문의 대화 — 라이더가 이어 쓰기 (남긴 라이더 본인)
      description: |
        라이더가 자기 문의에 메시지를 더한다. 문의 상태는 **RECEIVED**(지원센터 답 기다림)로 돌아가 지원센터 목록(`status=RECEIVED`)에 다시 뜬다 — 지원센터는 `POST /inquiries/{id}/replies` 로 답한다(ANSWERED + 라이더 알림 RiderInquiryAnswered).
        닫힌 문의는 409 INQUIRY_CLOSED(새 문의를 남긴다). 고객·직원은 403. 같은 멱등 키 재전송은 같은 메시지.
      operationId: postInquiryMessage
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: inquiryId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: 더함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryMessage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /inquiries/{inquiryId}/replies:
    post:
      tags: [inquiries]
      summary: 문의에 답변 (고객 문의 = CS_AGENT, 라이더 문의 = RIDER_OPS)
      description: |
        라이더 문의(0.13.0)는 지원센터(RIDER_OPS)가 답하고 CS_AGENT 는 403. 라이더 문의 답변은 고객용 `InquiryAnswered` 대신 `RiderInquiryAnswered`(라이더 알림함 — 0.13.0 같은 날, 답변 내용 없음).
        답변을 붙이면 상태가 ANSWERED. 닫힌(CLOSED) 문의는 409 INQUIRY_CLOSED. X-Expected-Version = 문의 version.
        고객 앱 알림은 notification-service 구현 뒤(지금은 고객이 문의 페이지에서 확인).
        0.12.0: 상담원 접수(origin STAFF_INTAKE) 문의에 답을 붙이면 상태는 같게 바뀌지만 InquiryAnswered 를 내지 않는다(고객 앱에 없는 문의 — 답변은 통화·채팅 기록).
      operationId: replyInquiry
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: inquiryId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: 답변 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inquiry' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

