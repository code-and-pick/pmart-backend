openapi: 3.1.0
info:
  title: case-service
  version: 0.21.0
  description: |
    Case/SubCase·Obligation·ActionRequest·EvidenceReference·ShiftHandover/CloseSnapshot(BO-27)·CS 접수·MFC 문제함(WK-12)·라이더 도움요청·귀책/비용 결정 기록의 정본. (docs/architecture/service-map.md §8, ADR-0004)
    비정본: 도메인 사고·클레임·수불 정본(각 서비스), 알림(notification), 지급(회계).
    사건 상태: OPEN / ASSIGNED / ACTION_PENDING / MONITORING / RESOLUTION_REVIEW / CLOSED / REOPENED. **시간 경과 자동 종결 없음** — 종결은 모든 Obligation 해소 후 명시적 closures 명령으로만.
    접수 ≠ 명령: CS 접수·도움요청은 사건을 만들 뿐 도메인 상태를 바꾸지 않는다. 도메인 행위는 ActionRequest 로 요청하고 상대 commit/거래 ID 로 결과를 연결한다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: cases, description: 사건 생성·배정·이관·종결·재개 }
  - { name: obligations, description: 의무 등록·해소 }
  - { name: action-requests, description: 도메인 행위 요청 연결 }
  - { name: intakes, description: CS 접수·라이더 도움요청·교대 인수인계 }
  - { name: inquiries, description: '고객센터 문의(고객앱 문의 페이지·고객 RAG 연결) 0.2.0' }
  - { name: inquiry-photos, description: '문의 사진 올리기·본문(0.14.0 — 비공개 버킷을 이 서비스가 대신 읽어 준다)' }
  - { name: rider-complaints, description: '라이더 컴플레인 기록(신고·오배송·파손 → RiderComplaintRecorded, RS-3) 0.3.0' }

paths:
  /cases:
    post:
      tags: [cases]
      summary: 사건 생성 (OPEN, CaseOpened; 도메인 이벤트 자동 생성과 같은 경로)
      description: |
        같은 sourceEventId 재전송은 기존 caseId 반환. parentCaseId 지정 시 SubCase. 병합 시 원 ID 는 보존된다.
        0.4.0(2026-11-16): 직원이 직접 여는 종류는 지금 **MISDELIVERY(오배송 확인 — R-7)** 하나 — subjectType DELIVERY + subjectRef = deliveryId, summary = 확인 근거(고객 주소 원문 금지).
        0.11.0(2026-11-16, ADR-0065 — 귀책별 처리): MISDELIVERY 에 `misdelivery`(fault CUSTOMER·RIDER·SYSTEM, resolution, redeliveryDestinationId). 사건 refs 와 MisdeliveryConfirmed 에 싣는다.
          resolution: RIDER·SYSTEM → RESHIP(기본, 다시 피킹·포장해 원래 주소로)·REFUND(전 품목 환불), CUSTOMER → REDELIVER(기본, 잘못 간 상품을 실제 집으로 — 200m 안 원래 기사 무료, 넘으면 고객 앱 9,000원 결제 뒤)·REFUND(회수 후 상품값 − 9,000원).
          CUSTOMER·REDELIVER 는 redeliveryDestinationId(order 에 기록한 실제 주소 — 주소 원문은 사건에 두지 않는다) 필수, 아니면 422 REDELIVERY_DESTINATION_REQUIRED. 맞지 않는 조합은 422 INVALID_MISDELIVERY_RESOLUTION.
          misdelivery 를 보내지 않으면 예전과 같다(회수 + 재발송, 라이더 배달료 지급) — 백오피스 화면이 귀책을 고르게 바뀌면 늘 보낸다.
        CS_AGENT·RIDER_OPS·OPERATOR_ADMIN. 열면 CaseOpened 와 함께 MisdeliveryConfirmed(delivery 회수 배차 DD-2 가 구독)를 낸다. 같은 배송의 열린 오배송 사건이 있으면 409 CASE_ALREADY_OPEN.
        그 밖의 종류는 도메인 사건으로만 열린다(422 UNSUPPORTED_KIND).
      operationId: createCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseRequest' }
      responses:
        '201':
          description: 생성 또는 기존 사건 반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
    get:
      tags: [cases]
      summary: 사건함 (종류·상태·센터·담당·우선순위 필터)
      operationId: listCases
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/CaseKind' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/CaseState' } }
        - { name: centerId, in: query, schema: { type: string } }
        - { name: assigneeId, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/Priority' } }
        - { name: subjectRef, in: query, schema: { type: string, description: orderId / deliveryId / claimId 등 } }
        - { name: assigneeGroup, in: query, schema: { $ref: '#/components/schemas/AssigneeGroup' }, x-added-in: '2026-11-16' }
        - { name: unassigned, in: query, schema: { type: boolean }, description: 'true = 아무도 안 집은 것만(팀 공용 목록, 0.4.0)', x-added-in: '2026-11-16' }
        - { name: overdue, in: query, schema: { type: boolean }, description: 'true = 처리 기한(slaDueAt) 넘긴 열린 사건만(0.4.0)', x-added-in: '2026-11-16' }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      description: |
        0.4.0(2026-11-16 사용자 "추천대로" — 사건함 공통 결정): state 를 비우면 열린 사건(CLOSED 제외). 우선순위 높은 것(P1)·기한 이른 것 먼저. state=CLOSED 는 닫힌 시각 최근 순(0.5.1).
        0.5.2(2026-11-16 사용자 "추천대로", 배송 원문 §3.6): MFC_SUPERVISOR(센터 관리자)는 자기 센터(토큰 centers)의 DISPATCH_FAILED 만 본다 — 다른 센터·센터 없는 사건은 목록에 없고 단건 404, 집기·닫기 403. 관리자·지원센터·상담원 역할이 함께 있으면 그 역할 범위.
        보이는 범위: OPERATOR_ADMIN 모두, RIDER_OPS·CS_AGENT 는 배송 쪽 사건(RIDER_HELP·DELIVERY_INCIDENT·RIDER_LOCATION_STALE·MISDELIVERY·DISPATCH_FAILED)만(CS_AGENT 는 보기만). 사가·결제 이상(RECONCILIATION·PAYMENT_UNKNOWN, 0.5.0)은 OPERATOR_ADMIN 만 보고 집고 닫는다(assigneeGroup ORDER_OPS).
        고객 문의(CS_INQUIRY)는 /inquiries 로 — 여기에 나오지 않는다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cases/metrics:
    get:
      tags: [cases]
      summary: 접수 건 현황 건수 (본사 관리자 — BO-28 1단계, 0.18.0)
      x-added-in: '2026-11-17'
      description: |
        2026-11-17 사용자 "우리 데이터 건수부터"(업무 원문 BO-28 — BackOffice 는 운영 판단용 현황을 보여 주고 BI 를 대신 확정하지 않는다).
        이 서비스 표만 센 지금 시각 스냅샷: 사건함 종류별 열린·아무도 안 집은·처리 기한 지난 건, 후속 처리 담당 팀별 열린·기한 지난 것,
        수락 전 교대 인계서, 답변 기다리는 문의(고객·라이더 — 상담원 접수 STAFF_INTAKE 제외)와 가장 오래 기다린 접수 시각.
        비율·목표·SLA 달성률은 승인된 정의가 없어 내지 않는다(화면이 "N건 중 M건"으로 보여 준다). 직원 개인별로 나누지 않는다.
        종류·팀이 0건이면 줄이 없다. OPERATOR_ADMIN 만(그 밖 403). 문의 만족도는 GET /inquiries/satisfaction-summary.
      operationId: getCaseMetrics
      x-pmart-user-types: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseMetrics' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cases/{caseId}:
    get:
      tags: [cases]
      summary: 사건 상세 (의무·행위 요청·증빙·하위 사건·이력)
      operationId: getCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cases/{caseId}/assignments:
    post:
      tags: [cases]
      summary: 담당 배정 (→ ASSIGNED, CaseAssigned)
      description: |
        0.4.0(2026-11-16 "팀 공용 목록에서 집어 간다"): 팀 직원은 assigneeId = 자기 자신으로만(아직 아무도 안 집은 사건). OPERATOR_ADMIN 은 다른 사람에게 배정·다시 배정.
        assigneeGroup·priority·slaDueAt 은 지금 무시(종류별 규칙). 결과는 사건 상세(200). 닫힌 사건 409.
      operationId: assignCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              properties:
                assigneeId: { type: string }
                assigneeGroup: { type: string, enum: [CS, MFC_OPS, DELIVERY_OPS, SCM, FINANCE, QUALITY, SECURITY] }
                priority: { $ref: '#/components/schemas/Priority' }
                slaDueAt: { type: string, format: date-time, description: 승인된 SLA 입력 }
      responses:
        '200':
          description: 배정됨(0.4.0 — 사건 상세)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /cases/{caseId}/transfers:
    post:
      tags: [cases]
      summary: 이관 (담당 팀 변경, CaseTransferred; 원 ID 보존 — 0.7.0)
      x-added-in: '2026-11-16'
      description: |
        0.7.0(2026-11-16 사용자 "A안" — 업무 원문 §5.3 "넘긴 의무는 이관 완료/상대 처리 중으로 표시하며 해결 완료로 위장하지 않는다"):
        - **배송 쪽 사건만**, 사람이 있는 두 팀 사이: `DELIVERY_OPS`(지원센터 RIDER_OPS) ↔ `ORDER_OPS`(운영 관리자 OPERATOR_ADMIN 만 처리).
          사가·결제 사건(이미 ORDER_OPS)·그 밖 팀·센터 이관(toCenterId)·병합(mergeIntoCaseId)은 422 UNSUPPORTED_ACTION.
        - 누가: 지금 그 사건을 다룰 수 있는 사람(지금 팀 = DELIVERY_OPS 면 RIDER_OPS·관리자, ORDER_OPS 면 관리자). 다른 직원이 맡은 사건은 관리자만.
        - 넘기면 담당을 비운다(ASSIGNED → OPEN). 처리 기한·보이는 범위는 그대로 — ORDER_OPS 로 간 배송 쪽 사건은 지원센터·상담원이 계속 보지만
          집기·닫기·재개·이관은 관리자만. reason 필수(이력에 남고 로그 금지). 같은 팀으로는 409 INVALID_STATE, 닫힌 사건 409 INVALID_STATE.
      operationId: transferCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toGroup, reason]
              properties:
                toGroup: { $ref: '#/components/schemas/AssigneeGroup' }
                toCenterId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                reason: { type: string, minLength: 1, maxLength: 500 }
                mergeIntoCaseId: { type: string, description: 병합 대상(지금은 422) }
      responses:
        '200':
          description: 이관됨(0.7.0 — 사건 상세)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE(닫힘·같은 팀) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: UNSUPPORTED_ACTION(배송 쪽 아님·그 밖 팀·센터 이관·병합)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cases/{caseId}/closures:
    post:
      tags: [cases]
      summary: 종결 (RESOLUTION_REVIEW→CLOSED, CaseClosed; 열린 Obligation 있으면 거절)
      description: |
        귀책·비용 결정을 기록한다(지급은 회계). CloseSnapshot 을 남긴다. 시간 경과 자동 종결은 없다.
        0.4.0(2026-11-16): 그 종류의 팀(배송 쪽 = RIDER_OPS)·OPERATOR_ADMIN. 다른 사람이 집은 사건은 OPERATOR_ADMIN 만. liability 는 지금 저장하지 않는다. 결과는 사건 상세(200).
        0.8.0(2026-11-16): 열린 의무(OPEN·PARTIALLY_RESOLVED)가 있으면 409 OPEN_OBLIGATIONS — 의무를 해소하거나 관리자가 면제·실패로 끝낸 뒤 닫는다(업무 원문 §5.3 "상담 종료와 의무 종결은 구분").
      operationId: closeCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, summary]
              properties:
                resolution: { type: string, enum: [RESOLVED, NOT_REPRODUCIBLE, DUPLICATE, NO_ACTION_REQUIRED, ESCALATED_EXTERNAL] }
                summary: { type: string, maxLength: 2000 }
                liability:
                  type: object
                  description: 귀책·비용 결정 기록
                  properties:
                    party: { type: string, enum: [PMART, MFC, RIDER, CARRIER, CUSTOMER, SUPPLIER, UNDETERMINED] }
                    amount: { $ref: '_common.yaml#/components/schemas/Money' }
                    approvalRef: { type: string }
                duplicateOfCaseId: { type: string }
      responses:
        '200':
          description: 종결됨(0.4.0 — 사건 상세)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE / OPEN_OBLIGATIONS (미해소 의무 존재) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cases/{caseId}/reopenings:
    post:
      tags: [cases]
      summary: 재개 (CLOSED→REOPENED, CaseReopened — 0.6.0)
      x-added-in: '2026-11-16'
      description: |
        0.6.0(2026-11-16 사용자 "1번 + 이전 사건 연결" — 업무 원문 §5.3·BO-27 "늦은 원사실이 종결 근거를 바꾸면 새 이력으로 재개"):
        - 사람이 사유를 적고 연다(자동 재개 없음 — 근거가 뒤집혔는지는 사람이 판단). 닫기와 같은 사람: 그 종류 팀(배송 쪽 = RIDER_OPS)·OPERATOR_ADMIN.
          기간 제한 없음.
        - 재개하면 담당을 비워 팀 공용 목록으로 돌아가고, 처리 기한은 재개 시각부터 그 종류 기본값으로 다시 센다. 마지막 종결 내용(resolution·closureSummary)은 남긴다.
        - 같은 일로 이미 열린 사건이 있으면(예: 닫힌 뒤 같은 배송 사고로 새 사건이 열림) 409 CASE_ALREADY_OPEN — 그 사건에서 처리한다.
        - 닫히지 않은 사건은 409 INVALID_STATE. reason 은 이력에 남고 로그에는 남기지 않는다.
      operationId: reopenCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
                sourceEventId: { type: string, description: 지금 쓰지 않는다 }
      responses:
        '200':
          description: 재개됨(0.6.0 — 사건 상세)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
