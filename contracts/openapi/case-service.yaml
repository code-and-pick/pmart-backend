  /shift-handovers/{shiftHandoverId}/acceptances:
    post:
      tags: [intakes]
      summary: 후임 수락 — 건별 (교대 완료, ShiftHandoverCompleted — 0.9.0)
      x-added-in: '2026-11-16'
      description: |
        **후임 본인만**(관리자도 대신 못 함 — 원문 "후임 수락"). 받지 않을 건은 excludedCaseIds — 그 건은 전임 담당 그대로, 미인수(EXCLUDED).
        나머지 건마다: 그사이 닫혔거나·넘겨졌거나·담당이 바뀌었으면 건너뜀(SKIPPED_CHANGED), 후임이 그 건을 다룰 수 없는 역할이면 건너뜀(SKIPPED_NOT_ALLOWED),
        아니면 담당을 후임으로(ACCEPTED — 이력 HANDED_OVER "다음 조치", CaseAssigned). 인계서 COMPLETED. 진행 중이 아니면 409 INVALID_STATE.
        후임의 **근무** 확인은 하지 않는다(본사 근무표 데이터 없음 — 역할만).
        **0.13.1(2026-11-17 사용자 (나))**: 후임에게 그 팀 역할(DELIVERY_OPS = RIDER_OPS·OPERATOR_ADMIN, ORDER_OPS = OPERATOR_ADMIN)이 없으면 403 — 인계서는 PENDING 그대로, 전임·관리자가 취소하고 다시 쓴다(작성 때는 후임 역할을 알 수 없어 수락 때 막는다).
      operationId: acceptShiftHandover
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: shiftHandoverId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                excludedCaseIds: { type: array, items: { type: string } }
      responses:
        '200':
          description: 완료된 인계서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftHandover' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /shift-handovers/{shiftHandoverId}/cancellations:
    post:
      tags: [intakes]
      summary: 인계서 취소 (수락 전, 전임·관리자 — 0.9.0)
      x-added-in: '2026-11-16'
      operationId: cancelShiftHandover
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: shiftHandoverId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 취소된 인계서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftHandover' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /rider-complaints:
    post:
      tags: [rider-complaints]
      summary: 라이더 컴플레인 기록 (상담원 — 0.3.0, service-requests case R-5)
      description: |
        2026-11-15 사용자 결정: 고객센터 상담원이 백오피스에서 라이더에 대한 컴플레인(신고 REPORT·오배송 MISDELIVERY·파손 DAMAGE)을 기록한다.
        라이더는 서버가 delivery-dispatch `GET /internal/deliveries/{deliveryId}/assignment` 로 채운다 — 배정된 라이더가 없으면 422 RIDER_NOT_ASSIGNED,
        배송이 없으면 422 DELIVERY_NOT_FOUND, dispatch 응답 불가 503.
        기록과 같은 트랜잭션에서 `RiderComplaintRecorded`(platform.case.v1)를 낸다 — rider-service 가 종류마다 7일 안 서로 다른 배송 3건 이상이면 제한 검토 대상으로 올린다(자동 제재 없음).
        inquiryId 를 주면 그 문의의 사건(caseId)을 잇는다(없는 문의 422 INQUIRY_NOT_FOUND). note 는 개인정보가 들어갈 수 있어 로그·사건에 싣지 않는다.
        역할: CS_AGENT·OPERATOR_ADMIN(그 밖 403). 같은 Idempotency-Key 재전송은 같은 컴플레인.
      operationId: recordRiderComplaint
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveryId, complaintType]
              properties:
                deliveryId: { type: string, minLength: 1, maxLength: 64 }
                complaintType: { $ref: '#/components/schemas/RiderComplaintType' }
                orderId: { type: string, maxLength: 64 }
                note: { type: string, maxLength: 1000, description: 상담원 메모(개인정보가 들어갈 수 있음 — 로그·사건 금지) }
                inquiryId: { type: string, maxLength: 64, description: 고객 문의에서 넘어왔으면 그 문의 ID(사건 연결) }
      responses:
        '201':
          description: 기록(재전송이면 같은 컴플레인)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderComplaint' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: RIDER_NOT_ASSIGNED / DELIVERY_NOT_FOUND / INQUIRY_NOT_FOUND / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
    get:
      tags: [rider-complaints]
      summary: 라이더 컴플레인 목록 (백오피스 — 최근 기록 순)
      description: 역할 CS_AGENT·OPERATOR_ADMIN·RIDER_OPS(그 밖 403). from 이상 to 미만(recordedAt). note 는 상세에만.
      operationId: listRiderComplaints
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - { name: riderId, in: query, schema: { type: string } }
        - { name: deliveryId, in: query, schema: { type: string } }
        - { name: complaintType, in: query, schema: { $ref: '#/components/schemas/RiderComplaintType' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RiderComplaintSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /rider-complaints/{complaintId}:
    get:
      tags: [rider-complaints]
      summary: 라이더 컴플레인 상세 (메모 포함)
      description: 역할 CS_AGENT·OPERATOR_ADMIN·RIDER_OPS(그 밖 403).
      operationId: getRiderComplaint
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: complaintId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderComplaint' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    CaseKind:
      type: string
      enum: [RECONCILIATION, PAYMENT_UNKNOWN, DISPATCH_FAILED, DELIVERY_INCIDENT, TRANSPORT_INCIDENT, LINE_SHORTAGE, RECEIPT_DISCREPANCY, OUTBOUND_DISCREPANCY, QUALITY_RECALL, CS_INTAKE, RIDER_HELP, MFC_ISSUE, SECURITY, OTHER, RIDER_LOCATION_STALE, MISDELIVERY]
      description: |
        0.4.0(2026-11-16 사건함 공통 결정) 지금 여는 종류 — RIDER_HELP(라이더 도움요청, R-4), DELIVERY_INCIDENT(전달 실패 등록, R-4), RIDER_LOCATION_STALE(배달 중 위치 끊김, R-6), MISDELIVERY(오배송 확인, R-7 — 직원이 연다).
        0.5.0(2026-11-16 배차 실패, 사용자 — 중간안·지원센터·10분) DISPATCH_FAILED: delivery-dispatch DispatchFailed — reason SYSTEM_FAILURE(자동 재배차 없음)는 첫 실패에, 그 밖(NO_RIDER·REPEATED_REJECTION·EXPIRED — 10분마다 자동 재배차)은 같은 배송의 두 번째 실패부터 연다(배송별 횟수는 case 가 센다 — 이벤트 attempts 는 재배차 시도마다 다시 셈). 배송 쪽(DELIVERY_OPS), 배송마다 열린 사건 하나, 그 뒤 실패는 이력(RECURRED). 배차가 뒤에 성공해도 자동으로 닫지 않는다. refs deliveryId·orderId. 사건 centerId = 이벤트의 mfcId(0.5.2 — delivery-dispatch 가 싣기 전에는 null, 그 사건은 센터 관리자에게 안 보임).
        0.5.0(2026-11-16 R-3, 사용자 — 기한 1시간·"이상만"·멈춘 사가는 안 함) 사가·결제 이상: RECONCILIATION(order-orchestration ReconciliationRequired 전부·CompensationExecuted 중 result 가 SUCCESS 아닌 것, payment PaymentMismatch 전부), PAYMENT_UNKNOWN(PaymentResultUnknown 중 escalated=true). 주문(없으면 사가·결제 시도)마다 같은 종류 열린 사건 하나 — 재발은 이력(RECURRED), 결제 불명 반복은 이력도 없음. refs 에 orderId·sagaId·paymentAttemptId·resourceId(있는 것만), 금액·상세는 싣지 않는다. 사건은 알림·기록이고 조치는 backoffice-bff 처리 대기(BO-12)·각 메뉴. 업무 거절로 멈춘 사가(ESCALATED)는 사건으로 열지 않는다(처리 대기에 보인다).
    CaseState:
      type: string
      enum: [OPEN, ASSIGNED, ACTION_PENDING, MONITORING, RESOLUTION_REVIEW, CLOSED, REOPENED]
    Priority:
      type: string
      enum: [P1, P2, P3, P4]
    EvidenceReference:
      type: object
      required: [system, ref]
      properties:
        system: { type: string, description: 결과를 보유한 서비스 }
        ref: { type: string, description: commitId / pgTransactionId / handoverId / receiptId 등 }
        kind: { type: string, enum: [COMMIT, TRANSACTION, EVENT, DOCUMENT, PHOTO, LOG] }
        asOf: { type: string, format: date-time }
    CreateCaseRequest:
      type: object
      required: [kind, subjectRef, summary]
      properties:
        kind: { $ref: '#/components/schemas/CaseKind' }
        sourceEventId: { type: string, description: 도메인 이벤트 eventId (멱등) }
        sourceEventType: { type: string }
        subjectRef: { type: string }
        subjectType: { type: string, enum: [ORDER, DELIVERY, CLAIM, PAYMENT, TRANSFER, TRIP, PACKAGE, RECEIPT, LOT, ACCOUNT, RIDER, OTHER] }
        centerId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        parentCaseId: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        summary: { type: string, maxLength: 2000 }
        evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceReference' } }
        initialObligations: { type: array, items: { $ref: '#/components/schemas/ObligationBody' } }
        misdelivery: { $ref: '#/components/schemas/MisdeliveryDecision' }
    AssigneeGroup:
      type: string
      enum: [CS, MFC_OPS, DELIVERY_OPS, ORDER_OPS, SCM, FINANCE, QUALITY, SECURITY]
      description: '담당 팀. 배송 쪽 사건 = DELIVERY_OPS(역할 RIDER_OPS — 지원센터 겸함, 2026-11-16), 사가·결제 사건과 관리자에게 넘긴 배송 쪽 사건 = ORDER_OPS(OPERATOR_ADMIN 만 처리 — 0.5.0·0.7.0)'
    CaseSummary:
      type: object
      properties:
        caseId: { type: string }
        parentCaseId: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/CaseKind' }
        state: { $ref: '#/components/schemas/CaseState' }
        priority: { $ref: '#/components/schemas/Priority' }
        subjectRef: { type: string }
        subjectType: { type: string }
        centerId: { type: [string, 'null'] }
        assigneeId: { type: [string, 'null'] }
        assigneeGroup: { type: [string, 'null'] }
        openObligationCount: { type: integer }
        myLastSeenAt: { type: [string, 'null'], format: date-time, x-added-in: '2026-11-17', description: '(0.20.0) 부른 직원이 이 건을 마지막으로 본 시각(POST …/views) — 본 적 없으면 null. 새 메시지 점 = 도움요청 lastRiderMessageAt > myLastSeenAt' }
        slaDueAt: { type: [string, 'null'], format: date-time }
        overdue: { type: boolean, description: '열린 사건이 처리 기한을 넘겼는가(0.4.0 — 화면 강조용, 알림 없음)', x-added-in: '2026-11-16' }
        summary: { type: string, description: '한 줄 요약(0.4.0 — 개인정보 원문 없음)', x-added-in: '2026-11-16' }
        refs:
          type: array
          x-added-in: '2026-11-16'
          description: '관련 참조(0.4.0) — incidentId·deliveryId·orderId·riderId 등. RIDER_HELP·DELIVERY_INCIDENT 는 incidentId(= deliveryId:requestId)·deliveryId 가 늘 있고, 0.4.1(2026-11-16)부터 requestId(도움요청 단건 GET /deliveries/{deliveryId}/help-requests/{requestId})도 — 그 전에 열린 사건은 없다. RIDER_LOCATION_STALE·MISDELIVERY 에는 incidentId 가 없다. 0.6.0(2026-11-16): 같은 종류·같은 대상(subjectRef)의 닫힌 사건이 있을 때 새로 열린 사건에 previousCaseId(가장 최근 닫힌 것 하나) — 근거가 뒤집혔으면 그 사건을 재개(POST …/reopenings) 0.8.1(2026-11-16 — DD-2 연결): 오배송 사건에 회수 배송이 생기면 recoveryDeliveryId(회수 배송 번호), 이력에 RECOVERY_CREATED·RECOVERY_PICKED_UP·RECOVERY_RETURNED(상태는 그대로, 자동 종결 없음) 0.11.2(2026-11-16 — 오배송 재발송 연결): 재발송 배송이 생기면 reshipmentDeliveryId, 이력 RESHIPMENT_CREATED(상태 그대로)'
          items:
            type: object
            properties:
              refType: { type: string }
              refId: { type: string }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Case:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          properties:
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            summary: { type: string }
            sourceEventId: { type: [string, 'null'] }
            subCaseIds: { type: array, items: { type: string } }
            mergedFromCaseIds: { type: array, items: { type: string }, description: 병합 시 원 ID 보존 }
            obligations: { type: array, items: { $ref: '#/components/schemas/Obligation' } }
            actionRequests: { type: array, items: { $ref: '#/components/schemas/ActionRequest' } }
            evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceReference' } }
            closure:
              type: object
              properties:
                resolution: { type: string }
                summary: { type: string }
                liability: { type: object, additionalProperties: true }
                closedBy: { type: string }
                closedAt: { type: string, format: date-time }
            history:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  actorId: { type: string }
                  action: { type: string }
                  fromState: { type: string }
                  toState: { type: string }
                  note: { type: string }
    CaseNote:
      type: object
      x-added-in: '2026-11-16'
      description: 접수 건 메모(0.10.0) — 덧붙이기만. 가리면 text null 이고 maskedAt·maskedBy·maskReason 이 있다.
      properties:
        noteId: { type: string }
        caseId: { type: string }
        text: { type: [string, 'null'] }
        authorId: { type: string }
        createdAt: { type: string, format: date-time }
        masked: { type: boolean }
        maskedAt: { type: [string, 'null'], format: date-time }
        maskedBy: { type: [string, 'null'] }
        maskReason: { type: [string, 'null'] }
    ObligationBody:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [REFUND, RETURN_PICKUP, REDELIVERY, INVENTORY_RECOVERY, RECONCILIATION, CUSTOMER_CONTACT, EVIDENCE_COLLECTION, COMPENSATION, DISPOSAL, SUPPLIER_CLAIM, OTHER] }
        owner: { type: string, enum: [DELIVERY_OPS, ORDER_OPS, CS], description: '담당 팀(0.8.0) — 비우면 사건 팀. DELIVERY_OPS·CS 는 배송 쪽 사건에만' }
        targetRef: { type: string, maxLength: 100 }
        qty: { type: integer, minimum: 0, description: 수량 의무. 금액과 분리 }
        amount: { $ref: '_common.yaml#/components/schemas/Money' }
        dueAt: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
    Obligation:
      allOf:
        - $ref: '#/components/schemas/ObligationBody'
        - type: object
          properties:
            obligationId: { type: string }
            caseId: { type: string }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            state: { type: string, enum: [OPEN, PARTIALLY_RESOLVED, RESOLVED, WAIVED, FAILED] }
            resolvedQty: { type: integer }
            resolvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
            resolutions:
              type: array
              items:
                type: object
                properties:
                  outcome: { type: string }
                  qty: { type: integer }
                  amount: { type: integer }
                  evidence: { $ref: '#/components/schemas/EvidenceReference' }
                  note: { type: [string, 'null'], description: '0.8.0 — 해소·시도 메모(직원이 씀, 로그 금지)' }
                  resolvedBy: { type: string }
                  resolvedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
    ActionRequestBody:
      type: object
      required: [actionType, targetService, command]
      properties:
        actionType: { type: string, enum: [REQUERY_RESULT, RESEND_UNDELIVERED, EXECUTE_APPROVED_COMPENSATION, REQUEST_DOMAIN_REVIEW] }
        targetService: { type: string, maxLength: 64 }
        command: { type: string, maxLength: 100, description: 대상 서비스 operationId }
        targetRef: { type: string, maxLength: 100 }
        idempotencyKey: { type: string, maxLength: 128, description: 대상 명령에 사용한 멱등키 }
        approvalRef: { type: string, maxLength: 100, description: EXECUTE_APPROVED_COMPENSATION 시 필수 }
        payloadSummary: { type: object, additionalProperties: true }
    ActionRequest:
      allOf:
        - $ref: '#/components/schemas/ActionRequestBody'
        - type: object
          properties:
            actionRequestId: { type: string }
            caseId: { type: string }
            state: { type: string, enum: [REQUESTED, SENT, ACCEPTED, APPLIED, REJECTED, UNKNOWN_RESULT] }
            resultRef: { $ref: '#/components/schemas/EvidenceReference' }
            requestedBy: { type: string }
            requestedAt: { type: string, format: date-time }
            resultAt: { type: [string, 'null'], format: date-time }
            resultNote: { type: [string, 'null'], x-added-in: '2026-11-17' }
            resultBy: { type: [string, 'null'], x-added-in: '2026-11-17' }
            version: { type: integer, x-added-in: '2026-11-17' }
    RiderComplaintType:
      type: string
      enum: [REPORT, MISDELIVERY, DAMAGE]
      description: REPORT 고객 신고(불친절·위험 운전 등) / MISDELIVERY 오배송 / DAMAGE 파손 (RiderComplaintRecorded 와 같은 값)
    RiderComplaintSummary:
      type: object
      required: [complaintId, riderId, deliveryId, complaintType, source, recordedBy, recordedAt]
      properties:
        complaintId: { type: string }
        caseId: { type: string, nullable: true, description: 문의에서 넘어왔으면 그 문의의 사건 }
        riderId: { type: string, description: dispatch 배정 조회로 채운 라이더 }
        deliveryId: { type: string }
        orderId: { type: string, nullable: true }
        inquiryId: { type: string, nullable: true }
        complaintType: { $ref: '#/components/schemas/RiderComplaintType' }
        source: { type: string, description: '접수 경로(지금 CS_AGENT)' }
        recordedBy: { type: string, description: 기록한 직원 ID }
        recordedAt: { type: string, format: date-time }
    RiderComplaint:
      allOf:
        - $ref: '#/components/schemas/RiderComplaintSummary'
        - type: object
          properties:
            note: { type: string, nullable: true }
    InquiryCategory:
      type: string
      enum: [ORDER, DELIVERY, PAYMENT, REFUND, PRODUCT, ACCOUNT, OTHER, SETTLEMENT, APP_ERROR]
      description: '주문·배송·결제·환불·상품·회원·기타 + 라이더 정산·앱 오류(0.13.0). 고객 = ORDER~OTHER, 라이더 = SETTLEMENT·ACCOUNT·APP_ERROR·OTHER'
    InquiryDeliveryIssue:
      type: string
      enum: [DELAYED, NOT_RECEIVED, MISDELIVERED]
      description: '배송 신고 종류(0.16.0) — 늦음·완료인데 못 받음·다른 곳에 옴'
      x-added-in: '2026-11-17'
    InquiryRequesterType:
      type: string
      enum: [CUSTOMER, RIDER]
      x-added-in: '2026-11-16'
    InquiryStatus:
      type: string
      enum: [RECEIVED, ANSWERED, CLOSED]
      description: 접수 → 답변됨 → 종료(종료는 아직 API 없음)
    InquirySummary:
      type: object
      required: [inquiryId, category, status, createdAt, version]
      properties:
        inquiryId: { type: string }
        category: { $ref: '#/components/schemas/InquiryCategory' }
        orderId: { type: string, nullable: true }
        title: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/InquiryStatus' }
        origin: { type: string, description: 'INQUIRY_PAGE / ASSISTANT_HANDOFF / STAFF_INTAKE(0.12.0 — 상담원이 전화·채팅·메일로 받아 남긴 것, 고객 앱에는 안 보임)' }
        channel: { type: [string, 'null'], x-added-in: '2026-11-16', description: '(0.12.0) STAFF_INTAKE 의 연락 경로 PHONE·CHAT·EMAIL' }
        callerRelation: { type: [string, 'null'], x-added-in: '2026-11-16', description: '(0.12.0) STAFF_INTAKE 의 본인/대리 — PROXY 면 화면 경고' }
        requesterType: { $ref: '#/components/schemas/InquiryRequesterType' }
        deliveryId: { type: [string, 'null'], description: '배송 신고의 배송 ID(0.16.0)', x-added-in: '2026-11-17' }
        deliveryIssue:
          oneOf: [{ $ref: '#/components/schemas/InquiryDeliveryIssue' }, { type: 'null' }]
          x-added-in: '2026-11-17'
        createdAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time, nullable: true }
        version: { type: integer }
    InquiryMessage:
      type: object
      x-added-in: '2026-11-17'
      required: [messageId, seq, senderType, body, createdAt]
      properties:
        messageId: { type: string }
        seq: { type: integer, format: int64, description: 대화 안 순번(오름차순) — 다음 조회의 after }
        senderType: { type: string, enum: [RIDER, SUPPORT] }
        senderId: { type: [string, 'null'], description: 보낸 사람 ID — 직원에게만(라이더에게 상담원 ID 는 null) }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    Inquiry:
      allOf:
        - $ref: '#/components/schemas/InquirySummary'
        - type: object
          required: [body, replies, caseId]
          properties:
            caseId: { type: string }
            customerId: { type: string, description: '운영자 조회에만 의미(고객에게는 본인). 라이더 문의는 없음' }
            riderId: { type: string, description: '라이더 문의를 남긴 라이더(0.13.0). 고객 문의는 없음', x-added-in: '2026-11-16' }
            body: { type: string }
            replies:
              type: array
              items:
                type: object
                properties:
                  replyId: { type: string }
                  authorType: { type: string, enum: [AGENT, RIDER], description: '(0.21.0) RIDER = 라이더가 대화로 이어 쓴 메시지' }
                  body: { type: string }
                  createdAt: { type: string, format: date-time }
            closedAt: { type: [string, 'null'], format: date-time, x-added-in: '2026-11-17', description: '(0.19.0) 닫힌 시각' }
            closedByType: { type: [string, 'null'], enum: [CUSTOMER, RIDER, STAFF, null], x-added-in: '2026-11-17', description: '(0.19.0) 누가 닫았나 — STAFF 면 화면에 "상담원이 종료함"' }
            closeReason: { type: [string, 'null'], x-added-in: '2026-11-17', description: '(0.19.0) 직원이 닫은 사유 — 직원에게만' }
            satisfaction:
              x-added-in: '2026-11-17'
              description: '(0.15.0) 고객이 남긴 만족도 — 남긴 본인과 OPERATOR_ADMIN 에게만(상담원·지원센터에게는 없음). 안 남겼으면 없음'
              allOf: [{ $ref: '#/components/schemas/InquirySatisfaction' }]
            photos:
              type: array
              x-added-in: '2026-11-17'
              description: '(0.14.0) 붙은 사진(붙인 순서). 본문은 url — 본인과 그 문의를 볼 수 있는 직원만'
              items: { $ref: '#/components/schemas/InquiryPhoto' }
    InquiryPhoto:
      type: object
      x-added-in: '2026-11-17'
      required: [photoId, url, contentType, sizeBytes, uploadedAt]
      properties:
        photoId: { type: string }
        url: { type: string, description: '본문 경로 /api/v1/inquiry-photos/{photoId} — 토큰 필요' }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, format: int64 }
        uploadedAt: { type: string, format: date-time }
    InquirySatisfaction:
      type: object
      x-added-in: '2026-11-17'
      required: [score, ratedAt]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'], maxLength: 200 }
        ratedAt: { type: string, format: date-time }
    InquirySatisfactionSummary:
      type: object
      x-added-in: '2026-11-17'
      required: [answeredFrom, answeredTo, answeredCount, ratedCount, scoreSum, byScore]
      properties:
        answeredFrom: { type: string, format: date-time }
        answeredTo: { type: string, format: date-time }
        answeredCount: { type: integer, format: int64, description: '분모 — 기간 안에 답변된 고객 문의' }
        ratedCount: { type: integer, format: int64, description: '분자 — 그중 만족도를 남긴 문의' }
        scoreSum: { type: integer, format: int64 }
        averageScore: { type: [number, 'null'], description: 'scoreSum / ratedCount — ratedCount 0 이면 null(N/A)' }
        byScore:
          type: object
          description: '점수(1~5)별 건수 — 키 "1"~"5"'
          additionalProperties: { type: integer, format: int64 }
    CaseMetrics:
      type: object
      x-added-in: '2026-11-17'
      required: [asOf, cases, obligations, pendingHandovers, inquiries]
      properties:
        asOf: { type: string, format: date-time, description: 센 시각 }
        cases:
          type: array
          items:
            type: object
            required: [kind, open, unassigned, overdue]
            properties:
              kind: { $ref: '#/components/schemas/CaseKind' }
              open: { type: integer, format: int64, description: 처리 끝나지 않은 건 }
              unassigned: { type: integer, format: int64, description: 그중 아무도 안 집은 건 }
              overdue: { type: integer, format: int64, description: 그중 처리 기한(표시용 SLA)이 지난 건 }
        obligations:
          type: array
          items:
            type: object
            required: [owner, open, overdue]
            properties:
              owner: { type: string, description: 담당 팀 }
              open: { type: integer, format: int64, description: 'OPEN·PARTIALLY_RESOLVED' }
              overdue: { type: integer, format: int64, description: 그중 기한이 지난 것 }
        pendingHandovers: { type: integer, format: int64, description: 수락 전 교대 인계서 }
        inquiries:
          type: array
          items:
            type: object
            required: [requesterType, awaitingAnswer]
            properties:
              requesterType: { $ref: '#/components/schemas/InquiryRequesterType' }
              awaitingAnswer: { type: integer, format: int64, description: '답변 전(RECEIVED) — 상담원 접수 제외' }
              oldestReceivedAt: { type: [string, 'null'], format: date-time }
    Intake:
      type: object
      properties:
        intakeId: { type: string }
        intakeType: { type: string, enum: [CS, RIDER_HELP] }
        caseId: { type: string }
        channel: { type: string }
        category: { type: string }
        subjectRef: { type: [string, 'null'] }
        summary: { type: string }
        consentRecorded: { type: boolean }
        receivedBy: { type: string }
        receivedAt: { type: string, format: date-time }
        inquiryId: { type: [string, 'null'], x-added-in: '2026-11-16', description: '(0.12.0) 새로 만든 고객 문의. linkCaseId 로 연결했으면 null' }
        linked: { type: boolean, x-added-in: '2026-11-16', description: '(0.12.0) 기존 건에 연결한 접수' }
        customerRef: { type: string, x-added-in: '2026-11-16' }
        callerRelation: { type: string, enum: [SELF, PROXY], x-added-in: '2026-11-16' }
        identityCheck:
          type: object
          x-added-in: '2026-11-16'
          properties:
            method: { type: string, enum: [ORDER_DETAILS_MATCH, APP_SIGNED_IN_CHAT, OTHER] }
            note: { type: [string, 'null'] }
        consent:
          type: [object, 'null']
          x-added-in: '2026-11-16'
          properties:
            consentType: { type: string }
            given: { type: boolean }
            detail: { type: [string, 'null'] }
            recordedAt: { type: string, format: date-time }
    ShiftHandover:
      type: object
      x-added-in: '2026-11-16'
      description: 교대 인계서(0.9.0 — BO-27). items = 넘기는 건과 건별 결과, teamSnapshot = 작성 시점 그 팀의 열린 건 요약(CloseSnapshot).
      properties:
        shiftHandoverId: { type: string }
        group: { type: string }
        centerId: { type: [string, 'null'] }
        fromOperatorId: { type: string }
        toOperatorId: { type: string }
        createdBy: { type: string }
        state: { type: string, enum: [PENDING, COMPLETED, CANCELLED] }
        unreceived: { type: boolean, description: '미인수 — 수락 전이거나 빠진 건이 있음' }
        items:
          type: array
          items:
            type: object
            properties:
              caseId: { type: string }
              nextAction: { type: string }
              checkDueAt: { type: [string, 'null'], format: date-time }
              caseStateAt: { type: string, description: 작성 시점 상태 }
              priorityAt: { type: [string, 'null'] }
              openObligationsAt: { type: integer }
              outcome: { type: string, enum: [PENDING, ACCEPTED, EXCLUDED, SKIPPED_CHANGED, SKIPPED_NOT_ALLOWED, CANCELLED] }
              resolvedAt: { type: [string, 'null'], format: date-time }
        teamSnapshot:
          type: array
          description: CloseSnapshot — 작성 시점 그 팀(group)의 열린 접수 건(최대 200)
          items:
            type: object
            properties:
              caseId: { type: string }
              kind: { type: string }
              state: { type: string }
              priority: { type: [string, 'null'] }
              assigneeId: { type: [string, 'null'] }
              openObligationCount: { type: integer }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
    MisdeliveryDecision:
      type: object
      x-added-in: '2026-11-16'
      description: 'MISDELIVERY 의 귀책·고객 선택(ADR-0065). 상담원·지원센터가 고객과 확인해 기록한다'
      required: [fault]
      properties:
        fault: { type: string, enum: [CUSTOMER, RIDER, SYSTEM], description: 'CUSTOMER 고객 주소 오입력 등 / RIDER 라이더 실수(원래 배달료 미지급) / SYSTEM 지도·시스템 오류(라이더처럼 처리, 배달료 지급)' }
        resolution: { type: string, enum: [RESHIP, REFUND, REDELIVER], description: '없으면 RIDER·SYSTEM = RESHIP, CUSTOMER = REDELIVER' }
        redeliveryDestinationId: { type: string, maxLength: 64, description: 'CUSTOMER·REDELIVER — order 에 기록한 실제 주소의 ID' }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
