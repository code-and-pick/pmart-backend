  /shift-handovers:
    post:
      tags: [intakes]
      summary: 교대 인계서 작성 (BO-27 — 0.9.0)
      x-added-in: '2026-11-16'
      description: |
        0.9.0(2026-11-16 사용자 "진행해 줘" — 업무 원문 BO-27 최대한 그대로):
        - 전임이 **집은 열린 접수 건**을 건마다 **다음 조치(필수)**·확인 기한(선택)과 함께 후임에게 넘긴다("단순 담당자 이름 교체로 끝내지 않는다").
          작성만으로는 담당이 바뀌지 않는다 — **후임이 수락해야** 교대 완료(…/acceptances). 수락 전까지 전임이 담당.
        - 작성: 전임 본인, 또는 관리자(전임 부재 — fromOperatorId 지정). group(업무) 필수 — DELIVERY_OPS·ORDER_OPS, centerId 선택(본사 팀은 없음).
        - **역할(0.13.1 — 2026-11-17 사용자 (나), 건을 맡을 수 있는 사람과 같게)**: 지원센터 팀 DELIVERY_OPS = RIDER_OPS·OPERATOR_ADMIN, 관리자 팀 ORDER_OPS = OPERATOR_ADMIN 만. 그 밖(상담원·센터 관리자·작업자 등) 403.
        - 각 건: 볼 수 있고, 열려 있고, **전임이 맡은 건**이며 그 group 의 건이어야(아니면 422 NOT_HANDOVERABLE). 다른 진행 중 인계서에 든 건 409 CASE_IN_HANDOVER.
        - 작성 시점 그 팀의 열린 접수 건·후속 처리 요약을 teamSnapshot 으로(CloseSnapshot). 메모는 로그 금지. 알림 없음(ADR-0064).
      operationId: createShiftHandover
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group, toOperatorId, items]
              properties:
                group: { type: string, enum: [DELIVERY_OPS, ORDER_OPS] }
                centerId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                fromOperatorId: { type: string, description: '비우면 나. 남의 것은 관리자만(전임 부재)' }
                toOperatorId: { type: string }
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [caseId, nextAction]
                    properties:
                      caseId: { type: string }
                      nextAction: { type: string, minLength: 1, maxLength: 500 }
                      checkDueAt: { type: string, format: date-time }
                note: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: 작성(PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftHandover' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: NOT_HANDOVERABLE(못 넘기는 건)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    get:
      tags: [intakes]
      summary: 교대 인계서 목록 (0.9.0 — 관리자는 모두, 그 밖은 내가 전임·후임인 것)
      x-added-in: '2026-11-16'
      description: |
        state(PENDING·COMPLETED·CANCELLED), unreceived=true 면 **미인수**(원문 BO-27 §5 "미인수 상신") — 수락 전(PENDING)이거나 수락 때 빠진 건(EXCLUDED)이
        있는 인계서. 최근 것부터.
      operationId: listShiftHandovers
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [PENDING, COMPLETED, CANCELLED] } }
        - { name: unreceived, in: query, schema: { type: boolean } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ShiftHandover' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /shift-handovers/{shiftHandoverId}:
    get:
      tags: [intakes]
      summary: 교대 인계서 조회 (전임·후임·관리자 — 그 밖 404)
      operationId: getShiftHandover
      x-pmart-user-types: [OPERATOR]
      parameters:
