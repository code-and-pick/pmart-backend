                photoIds: { type: array, maxItems: 5, items: { type: string }, x-added-in: '2026-11-17', description: '(0.14.0) 먼저 POST /inquiry-photos 로 올린 내 사진 — 문의 하나에 5장. 남의·이미 붙은 사진이면 422 PHOTO_NOT_FOUND(문의도 남지 않음)' }
                deliveryId: { type: string, maxLength: 64, description: '배송 신고의 배송 ID(0.16.0 — 참고값, 주문 소유만 확인)', x-added-in: '2026-11-17' }
                deliveryIssue: { $ref: '#/components/schemas/InquiryDeliveryIssue' }
      responses:
