  /inquiries:
    post:
      tags: [inquiries]
      summary: 고객센터 문의 남기기 (고객 — 0.2.0, 라이더 — 0.13.0)
      description: |
        2026-11-09 사용자 결정(C4): 고객앱 "고객센터 문의" 페이지 + 고객 RAG 가 답하지 못할 때 연결할 곳. 회원(고객 토큰)만 — 비회원 불가(C2).
        **배송 신고(0.16.0, 2026-11-17 — 사용자 결정 "기존 문의로, 배송 연결", 고객앱 빠진 기능 B 배달 지연 제보·오배송 확인)**: 고객이 category DELIVERY·orderId 와 함께
        `deliveryIssue`(DELAYED 늦음·NOT_RECEIVED 못 받음·MISDELIVERED 다른 곳에 옴)·`deliveryId`(선택)를 보낸다. 그 밖(분류·주문 없음·라이더)이면 400. 상담원(CS_AGENT)이 받는다.
        **라이더(0.13.0, 2026-11-16 — 라이더 앱 요청 §11-4, 사용자 "추천대로")**: 배송과 상관없는 문의(정산·계정·앱 오류·기타)를 라이더 토큰으로 남긴다.
        분류는 SETTLEMENT·ACCOUNT·APP_ERROR·OTHER 만(그 밖 400), orderId 는 받지 않는다(400 — 배송 건은 배송 화면 도움요청).
        사건 종류 RIDER_INQUIRY, 답은 지원센터(RIDER_OPS)가 한다. 고객 분류에 SETTLEMENT·APP_ERROR 는 쓰지 않는다(400).
        CS 접수(channel APP)와 사건(CS_INQUIRY)을 함께 만든다. 접수는 명령이 아니다 — 취소·환불을 실행하지 않는다.
        orderId 를 주면 order-service 에 고객 토큰으로 본인 주문인지 확인한다(남의·없는 주문 422 ORDER_NOT_FOUND, order 응답 불가 503).
        같은 Idempotency-Key 재전송은 같은 문의. 내용은 로그에 남기지 않는다.
      operationId: createInquiry
      x-pmart-user-types: [CUSTOMER, RIDER]
