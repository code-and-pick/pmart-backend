        - 회원만(C2): customerRef(고객 accountId) 필수. 비회원 연락은 받지 않는다.
        - subjectRef = 주문 ID(선택). 주면 order-service `GET /orders/lookups/{orderId}` 를 직원 토큰으로 불러 그 고객의 주문인지 본다 — 없는 주문 422 ORDER_NOT_FOUND, 다른 고객 주문 422 CUSTOMER_ORDER_MISMATCH, 주문을 볼 수 없는 역할 403, order 응답 불가 503.
        - **본인 확인(identityCheck) 필수**: 어떻게 확인했는지만 남긴다 — ORDER_DETAILS_MATCH(주문 내용 대조, subjectRef 필요), APP_SIGNED_IN_CHAT(앱 로그인 채팅, channel CHAT 만), OTHER(note 필수). 고객이 말한 내용(번호·주소 등)은 저장하지 않는다.
        - **callerRelation**: SELF(본인) / PROXY(가족 등 대리). 대리는 기록만 — 서버가 클레임을 막지는 않는다(대리 정책 없음). 화면은 대리 건에 "본인 확인 전 취소·환불 요청 금지" 경고를 보인다.
        - consent: 고객이 동의한 것의 기록(무엇·동의 여부·설명) — 실행하지 않는다.
        - linkCaseId 없음 → 고객 문의(사건 CS_INQUIRY, origin STAFF_INTAKE)를 새로 만든다. **고객 앱에는 보이지 않고, 답변해도 고객 알림(InquiryAnswered)을 내지 않는다.**
          linkCaseId 있음 → 새 사건 없이 그 건에 연결(사건함에서 볼 수 있는 건, 또는 고객 문의 건 — 못 보면 404). 그 건 이력에 CS_INTAKE_LINKED.
        - 같은 Idempotency-Key 재전송은 같은 접수. 요약·메모는 로그에 남기지 않는다. 이벤트 없음.
        **0.19.2**: order 가 응답하지 않으면(5xx·연결 실패) 503 — 전에는 500. 같은 Idempotency-Key 재전송은 order 가 내려가 있어도 저장된 결과를 재생한다(새 요청만 503).
      operationId: createCsIntake
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, category, customerRef, summary, identityCheck, callerRelation]
              properties:
                channel: { type: string, enum: [APP, PHONE, CHAT, EMAIL, RIDER_APP, STAFF_APP], description: '0.12.0 은 PHONE·CHAT·EMAIL 만 받는다(그 밖 400)' }
                category: { type: string, enum: [ORDER, DELIVERY, PAYMENT, REFUND, PRODUCT, ACCOUNT, RIDER, OTHER], description: 'RIDER 는 400 — 라이더 컴플레인 기록(POST /rider-complaints)으로' }
                customerRef: { type: string, maxLength: 64, description: 고객 accountId (안심번호 등 원문 저장 금지) }
                subjectRef: { type: string, maxLength: 64, description: '주문 ID(0.12.0 — 선택, 주면 그 고객 주문인지 확인)' }
                summary: { type: string, minLength: 1, maxLength: 2000 }
                identityCheck:
                  type: object
                  required: [method]
                  description: 본인 확인을 어떻게 했는지(결과 기록만 — 고객이 말한 값은 넣지 않는다)
                  properties:
                    method: { type: string, enum: [ORDER_DETAILS_MATCH, APP_SIGNED_IN_CHAT, OTHER] }
                    note: { type: string, maxLength: 200, description: 'OTHER 이면 필수 — 어떻게 확인했는지' }
                callerRelation: { type: string, enum: [SELF, PROXY], description: '본인 / 대리(가족 등)' }
                consent:
                  type: object
                  description: 고객 동의 기록 (결품 처리·대체 등) — 기록만, 실행하지 않는다
                  required: [consentType, given]
                  properties:
                    consentType: { type: string, maxLength: 50 }
                    given: { type: boolean }
                    detail: { type: string, maxLength: 500, description: '무엇을·얼마만큼(품목·수량·금액)' }
                    recordedAt: { type: string, format: date-time, description: 없으면 접수 시각 }
                linkCaseId: { type: string, description: 기존 건에 연결(새 사건 없음) }
      responses:
        '201':
          description: 접수 (caseId = 새 문의 사건 또는 연결한 건)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intake' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
    get:
      tags: [intakes]
      summary: CS 접수 목록 — 건·고객·주문으로 (0.12.0)
      x-added-in: '2026-11-16'
      description: CS_AGENT·OPERATOR_ADMIN(그 밖 403). caseId·customerRef·subjectRef 중 하나 이상 필수(없으면 400). 최근 접수 순.
      operationId: listCsIntakes
