openapi: 3.1.0
info:
  title: case-service
  version: 0.5.1
  description: |
    Case/SubCase·Obligation·ActionRequest·EvidenceReference·ShiftHandover/CloseSnapshot(BO-27)·CS 접수·MFC 문제함(WK-12)·라이더 도움요청·귀책/비용 결정 기록의 정본. (docs/architecture/service-map.md §8, ADR-0004)
    비정본: 도메인 사고·클레임·수불 정본(각 서비스), 알림(notification), 지급(회계).
    사건 상태: OPEN / ASSIGNED / ACTION_PENDING / MONITORING / RESOLUTION_REVIEW / CLOSED / REOPENED. **시간 경과 자동 종결 없음** — 종결은 모든 Obligation 해소 후 명시적 closures 명령으로만.
    접수 ≠ 명령: CS 접수·도움요청은 사건을 만들 뿐 도메인 상태를 바꾸지 않는다. 도메인 행위는 ActionRequest 로 요청하고 상대 commit/거래 ID 로 결과를 연결한다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: cases, description: 사건 생성·배정·이관·종결·재개 }
  - { name: obligations, description: 의무 등록·해소 }
  - { name: action-requests, description: 도메인 행위 요청 연결 }
  - { name: intakes, description: CS 접수·라이더 도움요청·교대 인수인계 }
  - { name: inquiries, description: '고객센터 문의(고객앱 문의 페이지·고객 RAG 연결) 0.2.0' }
  - { name: rider-complaints, description: '라이더 컴플레인 기록(신고·오배송·파손 → RiderComplaintRecorded, RS-3) 0.3.0' }

paths:
  /cases:
    post:
      tags: [cases]
      summary: 사건 생성 (OPEN, CaseOpened; 도메인 이벤트 자동 생성과 같은 경로)
      description: |
        같은 sourceEventId 재전송은 기존 caseId 반환. parentCaseId 지정 시 SubCase. 병합 시 원 ID 는 보존된다.
        0.4.0(2026-11-16): 직원이 직접 여는 종류는 지금 **MISDELIVERY(오배송 확인 — R-7)** 하나 — subjectType DELIVERY + subjectRef = deliveryId, summary = 확인 근거(고객 주소 원문 금지).
        CS_AGENT·RIDER_OPS·OPERATOR_ADMIN. 열면 CaseOpened 와 함께 MisdeliveryConfirmed(delivery 회수 배차 DD-2 가 구독)를 낸다. 같은 배송의 열린 오배송 사건이 있으면 409 CASE_ALREADY_OPEN.
        그 밖의 종류는 도메인 사건으로만 열린다(422 UNSUPPORTED_KIND).
      operationId: createCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseRequest' }
      responses:
        '201':
          description: 생성 또는 기존 사건 반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
    get:
      tags: [cases]
      summary: 사건함 (종류·상태·센터·담당·우선순위 필터)
      operationId: listCases
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/CaseKind' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/CaseState' } }
        - { name: centerId, in: query, schema: { type: string } }
        - { name: assigneeId, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/Priority' } }
        - { name: subjectRef, in: query, schema: { type: string, description: orderId / deliveryId / claimId 등 } }
        - { name: assigneeGroup, in: query, schema: { $ref: '#/components/schemas/AssigneeGroup' }, x-added-in: '2026-11-16' }
        - { name: unassigned, in: query, schema: { type: boolean }, description: 'true = 아무도 안 집은 것만(팀 공용 목록, 0.4.0)', x-added-in: '2026-11-16' }
        - { name: overdue, in: query, schema: { type: boolean }, description: 'true = 처리 기한(slaDueAt) 넘긴 열린 사건만(0.4.0)', x-added-in: '2026-11-16' }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      description: |
        0.4.0(2026-11-16 사용자 "추천대로" — 사건함 공통 결정): state 를 비우면 열린 사건(CLOSED 제외). 우선순위 높은 것(P1)·기한 이른 것 먼저. state=CLOSED 는 닫힌 시각 최근 순(0.5.1).
        보이는 범위: OPERATOR_ADMIN 모두, RIDER_OPS·CS_AGENT 는 배송 쪽 사건(RIDER_HELP·DELIVERY_INCIDENT·RIDER_LOCATION_STALE·MISDELIVERY·DISPATCH_FAILED)만(CS_AGENT 는 보기만). 사가·결제 이상(RECONCILIATION·PAYMENT_UNKNOWN, 0.5.0)은 OPERATOR_ADMIN 만 보고 집고 닫는다(assigneeGroup ORDER_OPS).
        고객 문의(CS_INQUIRY)는 /inquiries 로 — 여기에 나오지 않는다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cases/{caseId}:
    get:
      tags: [cases]
      summary: 사건 상세 (의무·행위 요청·증빙·하위 사건·이력)
      operationId: getCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cases/{caseId}/assignments:
    post:
      tags: [cases]
      summary: 담당 배정 (→ ASSIGNED, CaseAssigned)
      description: |
        0.4.0(2026-11-16 "팀 공용 목록에서 집어 간다"): 팀 직원은 assigneeId = 자기 자신으로만(아직 아무도 안 집은 사건). OPERATOR_ADMIN 은 다른 사람에게 배정·다시 배정.
        assigneeGroup·priority·slaDueAt 은 지금 무시(종류별 규칙). 결과는 사건 상세(200). 닫힌 사건 409.
      operationId: assignCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              properties:
                assigneeId: { type: string }
                assigneeGroup: { type: string, enum: [CS, MFC_OPS, DELIVERY_OPS, SCM, FINANCE, QUALITY, SECURITY] }
                priority: { $ref: '#/components/schemas/Priority' }
                slaDueAt: { type: string, format: date-time, description: 승인된 SLA 입력 }
      responses:
        '200':
          description: 배정됨(0.4.0 — 사건 상세)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /cases/{caseId}/transfers:
    post:
      tags: [cases]
      summary: 이관 (담당 그룹·센터 변경, CaseTransferred; 원 ID 보존)
      operationId: transferCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toGroup, reason]
              properties:
                toGroup: { type: string, enum: [CS, MFC_OPS, DELIVERY_OPS, SCM, FINANCE, QUALITY, SECURITY] }
                toCenterId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                reason: { type: string, maxLength: 500 }
                mergeIntoCaseId: { type: string, description: 병합 대상. 지정 시 본 사건은 SubCase 로 연결 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /cases/{caseId}/closures:
    post:
      tags: [cases]
      summary: 종결 (RESOLUTION_REVIEW→CLOSED, CaseClosed; 열린 Obligation 있으면 거절)
      description: |
        귀책·비용 결정을 기록한다(지급은 회계). CloseSnapshot 을 남긴다. 시간 경과 자동 종결은 없다.
        0.4.0(2026-11-16): 그 종류의 팀(배송 쪽 = RIDER_OPS)·OPERATOR_ADMIN. 다른 사람이 집은 사건은 OPERATOR_ADMIN 만. liability 는 지금 저장하지 않는다. 결과는 사건 상세(200).
      operationId: closeCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, summary]
              properties:
                resolution: { type: string, enum: [RESOLVED, NOT_REPRODUCIBLE, DUPLICATE, NO_ACTION_REQUIRED, ESCALATED_EXTERNAL] }
                summary: { type: string, maxLength: 2000 }
                liability:
                  type: object
                  description: 귀책·비용 결정 기록
                  properties:
                    party: { type: string, enum: [PMART, MFC, RIDER, CARRIER, CUSTOMER, SUPPLIER, UNDETERMINED] }
                    amount: { $ref: '_common.yaml#/components/schemas/Money' }
                    approvalRef: { type: string }
                duplicateOfCaseId: { type: string }
      responses:
        '200':
          description: 종결됨(0.4.0 — 사건 상세)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE / OPEN_OBLIGATIONS (미해소 의무 존재) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cases/{caseId}/reopenings:
    post:
      tags: [cases]
      summary: 재개 (CLOSED→REOPENED, CaseReopened)
      operationId: reopenCase
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
                sourceEventId: { type: string }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /cases/{caseId}/obligations:
    post:
      tags: [obligations]
      summary: 의무 등록 (종류별 수량/금액 분리, ObligationCreated)
      operationId: createObligation
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObligationBody' }
      responses:
        '201':
          description: 생성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Obligation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /obligations/{obligationId}:
    get:
      tags: [obligations]
      summary: 의무 조회
      operationId: getObligation
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: obligationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Obligation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /obligations/{obligationId}/resolutions:
    post:
      tags: [obligations]
      summary: 의무 해소 (도메인 결과 참조 필수, ObligationResolved; 부분 해소 가능)
      operationId: resolveObligation
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: obligationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, evidence]
              properties:
                outcome: { type: string, enum: [FULFILLED, WAIVED, FAILED] }
                resolvedQty: { type: integer, minimum: 0 }
                resolvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
                evidence: { $ref: '#/components/schemas/EvidenceReference' }
                note: { type: string, maxLength: 1000 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (이미 해소) / QTY_EXCEEDS_OBLIGATION / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cases/{caseId}/action-requests:
    post:
      tags: [action-requests]
      summary: 도메인 행위 요청 기록 (원결과 재조회·미전달 재전송·승인된 보상 실행; 상대 commit/거래 ID 연결)
      description: |
        사건 서비스는 도메인 명령을 대신 실행하지 않는다. 요청 사실과 대상 서비스·명령·멱등키·결과 ID 를 기록한다.
        "강제 성공"·"잔고 덮어쓰기" 종류의 행위는 UNSUPPORTED_ACTION.
      operationId: createActionRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionRequestBody' }
      responses:
        '201':
          description: 생성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: UNSUPPORTED_ACTION / APPROVAL_REQUIRED (보상 실행에 approvalRef 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cases/{caseId}/action-requests/{actionRequestId}:
    get:
      tags: [action-requests]
      summary: 행위 요청 조회 (대상 서비스 결과 ID·상태)
      operationId: getActionRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
        - { name: actionRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cs-intakes:
    post:
      tags: [intakes]
      summary: CS 접수 (접수 ≠ 명령; 동의는 별도 기록) → 사건 생성·연결
      operationId: createCsIntake
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, category, subjectRef, summary]
              properties:
                channel: { type: string, enum: [APP, PHONE, CHAT, EMAIL, RIDER_APP, STAFF_APP] }
                category: { type: string, enum: [ORDER, DELIVERY, PAYMENT, REFUND, PRODUCT, ACCOUNT, RIDER, OTHER] }
                customerRef: { type: string, description: accountId (안심번호 등 원문 저장 금지) }
                subjectRef: { type: string, description: orderId / deliveryId / claimId }
                summary: { type: string, maxLength: 2000 }
                consent:
                  type: object
                  description: 고객 동의 기록 (결품 처리·대체 등)
                  properties:
                    consentType: { type: string }
                    given: { type: boolean }
                    recordedAt: { type: string, format: date-time }
                linkCaseId: { type: string, description: 기존 사건에 연결 }
      responses:
        '201':
          description: 접수 (resultId = intakeId, caseId 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intake' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /cs-intakes/{intakeId}:
    get:
      tags: [intakes]
      summary: CS 접수 조회
      operationId: getCsIntake
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: intakeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intake' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /inquiries:
    post:
      tags: [inquiries]
      summary: 고객센터 문의 남기기 (고객 — 0.2.0)
      description: |
        2026-11-09 사용자 결정(C4): 고객앱 "고객센터 문의" 페이지 + 고객 RAG 가 답하지 못할 때 연결할 곳. 회원(고객 토큰)만 — 비회원 불가(C2).
        CS 접수(channel APP)와 사건(CS_INQUIRY)을 함께 만든다. 접수는 명령이 아니다 — 취소·환불을 실행하지 않는다.
        orderId 를 주면 order-service 에 고객 토큰으로 본인 주문인지 확인한다(남의·없는 주문 422 ORDER_NOT_FOUND, order 응답 불가 503).
        같은 Idempotency-Key 재전송은 같은 문의. 내용은 로그에 남기지 않는다.
      operationId: createInquiry
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, body]
              properties:
                category: { $ref: '#/components/schemas/InquiryCategory' }
                orderId: { type: string, description: 주문 건 문의면 주문 ID(본인 주문만) }
                title: { type: string, maxLength: 100 }
                body: { type: string, minLength: 1, maxLength: 2000 }
                origin: { type: string, enum: [INQUIRY_PAGE, ASSISTANT_HANDOFF], description: '문의 페이지에서 직접 / 고객 RAG 가 답하지 못해 넘어옴(기본 INQUIRY_PAGE)' }
      responses:
        '201':
          description: 접수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inquiry' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
    get:
      tags: [inquiries]
      summary: 문의 목록 (고객 = 본인 것, CS_AGENT·OPERATOR_ADMIN = 전체)
      description: 최근 접수 순. 고객 토큰은 본인 문의만, 운영자는 역할 CS_AGENT·OPERATOR_ADMIN 만(그 밖 403 — OPERATOR_ADMIN 은 보기만, 0.4.2). status 로 거른다. 0.5.0(2026-11-16 통합 조회) — orderId 로도 거른다(완전 일치, 고객은 여전히 본인 것만).
      operationId: listInquiries
      x-pmart-user-types: [CUSTOMER, OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InquiryStatus' } }
        - { name: orderId, in: query, schema: { type: string, maxLength: 64 }, description: '주문 ID 완전 일치(0.5.0 — 백오피스 통합 조회)', x-added-in: '2026-11-16' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InquirySummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /inquiries/{inquiryId}:
    get:
      tags: [inquiries]
      summary: 문의 상세 + 답변 (고객 = 본인 것, CS_AGENT·OPERATOR_ADMIN)
      description: 남의 문의는 404(존재를 드러내지 않음). OPERATOR_ADMIN 은 보기만(답변은 CS_AGENT — 0.4.2).
      operationId: getInquiry
      x-pmart-user-types: [CUSTOMER, OPERATOR]
      parameters:
        - { name: inquiryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inquiry' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /inquiries/{inquiryId}/replies:
    post:
      tags: [inquiries]
      summary: 문의에 답변 (운영자 CS_AGENT)
      description: |
        답변을 붙이면 상태가 ANSWERED. 닫힌(CLOSED) 문의는 409 INQUIRY_CLOSED. X-Expected-Version = 문의 version.
        고객 앱 알림은 notification-service 구현 뒤(지금은 고객이 문의 페이지에서 확인).
      operationId: replyInquiry
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: inquiryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: 답변 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inquiry' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /help-requests:
    post:
      tags: [intakes]
      summary: 라이더 도움요청 (배송 중 문제·고객 연락 기록) → 사건 생성·연결
      operationId: createHelpRequest
      x-pmart-user-types: [RIDER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riderId, deliveryId, kind]
              properties:
                riderId: { type: string }
                deliveryId: { type: string }
                kind: { type: string, enum: [CUSTOMER_UNREACHABLE, ADDRESS_ISSUE, PACKAGE_DAMAGED, ACCESS_DENIED, VEHICLE_ISSUE, SAFETY, OTHER] }
                note: { type: string, maxLength: 1000 }
                location: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
                contactAttempts:
                  type: array
                  items:
                    type: object
                    properties:
                      attemptedAt: { type: string, format: date-time }
                      method: { type: string, enum: [SAFE_NUMBER_CALL, APP_MESSAGE] }
                      result: { type: string, enum: [ANSWERED, NO_ANSWER, FAILED] }
                evidenceRefs: { type: array, items: { type: string } }
      responses:
        '201':
          description: 접수 (caseId 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intake' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /help-requests/{intakeId}:
    get:
      tags: [intakes]
      summary: 도움요청 조회
      operationId: getHelpRequest
      x-pmart-user-types: [RIDER, OPERATOR]
      x-pmart-user-types-note: "추정 — 구현 없음. 요청한 라이더 본인과 처리하는 운영자가 볼 것으로 봄"
      parameters:
        - { name: intakeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intake' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /shift-handovers:
    post:
      tags: [intakes]
      summary: 교대 인수인계 기록 (BO-27; 열린 사건·의무 스냅샷, ShiftHandoverCompleted)
      operationId: createShiftHandover
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [centerId, fromOperatorId, toOperatorId]
              properties:
                centerId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                group: { type: string, enum: [CS, MFC_OPS, DELIVERY_OPS] }
                fromOperatorId: { type: string }
                toOperatorId: { type: string }
                caseIds: { type: array, items: { type: string }, description: 생략 시 담당 열린 사건 전부 }
                note: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: 기록 (resultId = shiftHandoverId)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftHandover' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /shift-handovers/{shiftHandoverId}:
    get:
      tags: [intakes]
      summary: 교대 인수인계 조회
      operationId: getShiftHandover
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: shiftHandoverId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftHandover' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /rider-complaints:
    post:
      tags: [rider-complaints]
      summary: 라이더 컴플레인 기록 (상담원 — 0.3.0, service-requests case R-5)
      description: |
        2026-11-15 사용자 결정: 고객센터 상담원이 백오피스에서 라이더에 대한 컴플레인(신고 REPORT·오배송 MISDELIVERY·파손 DAMAGE)을 기록한다.
        라이더는 서버가 delivery-dispatch `GET /internal/deliveries/{deliveryId}/assignment` 로 채운다 — 배정된 라이더가 없으면 422 RIDER_NOT_ASSIGNED,
        배송이 없으면 422 DELIVERY_NOT_FOUND, dispatch 응답 불가 503.
        기록과 같은 트랜잭션에서 `RiderComplaintRecorded`(platform.case.v1)를 낸다 — rider-service 가 종류마다 7일 안 서로 다른 배송 3건 이상이면 제한 검토 대상으로 올린다(자동 제재 없음).
        inquiryId 를 주면 그 문의의 사건(caseId)을 잇는다(없는 문의 422 INQUIRY_NOT_FOUND). note 는 개인정보가 들어갈 수 있어 로그·사건에 싣지 않는다.
        역할: CS_AGENT·OPERATOR_ADMIN(그 밖 403). 같은 Idempotency-Key 재전송은 같은 컴플레인.
      operationId: recordRiderComplaint
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveryId, complaintType]
              properties:
                deliveryId: { type: string, minLength: 1, maxLength: 64 }
                complaintType: { $ref: '#/components/schemas/RiderComplaintType' }
                orderId: { type: string, maxLength: 64 }
                note: { type: string, maxLength: 1000, description: 상담원 메모(개인정보가 들어갈 수 있음 — 로그·사건 금지) }
                inquiryId: { type: string, maxLength: 64, description: 고객 문의에서 넘어왔으면 그 문의 ID(사건 연결) }
      responses:
        '201':
          description: 기록(재전송이면 같은 컴플레인)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderComplaint' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: RIDER_NOT_ASSIGNED / DELIVERY_NOT_FOUND / INQUIRY_NOT_FOUND / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
    get:
      tags: [rider-complaints]
      summary: 라이더 컴플레인 목록 (백오피스 — 최근 기록 순)
      description: 역할 CS_AGENT·OPERATOR_ADMIN·RIDER_OPS(그 밖 403). from 이상 to 미만(recordedAt). note 는 상세에만.
      operationId: listRiderComplaints
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - { name: riderId, in: query, schema: { type: string } }
        - { name: deliveryId, in: query, schema: { type: string } }
        - { name: complaintType, in: query, schema: { $ref: '#/components/schemas/RiderComplaintType' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RiderComplaintSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /rider-complaints/{complaintId}:
    get:
      tags: [rider-complaints]
      summary: 라이더 컴플레인 상세 (메모 포함)
      description: 역할 CS_AGENT·OPERATOR_ADMIN·RIDER_OPS(그 밖 403).
      operationId: getRiderComplaint
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: complaintId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderComplaint' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    CaseKind:
      type: string
      enum: [RECONCILIATION, PAYMENT_UNKNOWN, DISPATCH_FAILED, DELIVERY_INCIDENT, TRANSPORT_INCIDENT, LINE_SHORTAGE, RECEIPT_DISCREPANCY, OUTBOUND_DISCREPANCY, QUALITY_RECALL, CS_INTAKE, RIDER_HELP, MFC_ISSUE, SECURITY, OTHER, RIDER_LOCATION_STALE, MISDELIVERY]
      description: |
        0.4.0(2026-11-16 사건함 공통 결정) 지금 여는 종류 — RIDER_HELP(라이더 도움요청, R-4), DELIVERY_INCIDENT(전달 실패 등록, R-4), RIDER_LOCATION_STALE(배달 중 위치 끊김, R-6), MISDELIVERY(오배송 확인, R-7 — 직원이 연다).
        0.5.0(2026-11-16 배차 실패, 사용자 — 중간안·지원센터·10분) DISPATCH_FAILED: delivery-dispatch DispatchFailed — reason SYSTEM_FAILURE(자동 재배차 없음)는 첫 실패에, 그 밖(NO_RIDER·REPEATED_REJECTION·EXPIRED — 10분마다 자동 재배차)은 같은 배송의 두 번째 실패부터 연다(배송별 횟수는 case 가 센다 — 이벤트 attempts 는 재배차 시도마다 다시 셈). 배송 쪽(DELIVERY_OPS), 배송마다 열린 사건 하나, 그 뒤 실패는 이력(RECURRED). 배차가 뒤에 성공해도 자동으로 닫지 않는다. refs deliveryId·orderId.
        0.5.0(2026-11-16 R-3, 사용자 — 기한 1시간·"이상만"·멈춘 사가는 안 함) 사가·결제 이상: RECONCILIATION(order-orchestration ReconciliationRequired 전부·CompensationExecuted 중 result 가 SUCCESS 아닌 것, payment PaymentMismatch 전부), PAYMENT_UNKNOWN(PaymentResultUnknown 중 escalated=true). 주문(없으면 사가·결제 시도)마다 같은 종류 열린 사건 하나 — 재발은 이력(RECURRED), 결제 불명 반복은 이력도 없음. refs 에 orderId·sagaId·paymentAttemptId·resourceId(있는 것만), 금액·상세는 싣지 않는다. 사건은 알림·기록이고 조치는 backoffice-bff 처리 대기(BO-12)·각 메뉴. 업무 거절로 멈춘 사가(ESCALATED)는 사건으로 열지 않는다(처리 대기에 보인다).
    CaseState:
      type: string
      enum: [OPEN, ASSIGNED, ACTION_PENDING, MONITORING, RESOLUTION_REVIEW, CLOSED, REOPENED]
    Priority:
      type: string
      enum: [P1, P2, P3, P4]
    EvidenceReference:
      type: object
      required: [system, ref]
      properties:
        system: { type: string, description: 결과를 보유한 서비스 }
        ref: { type: string, description: commitId / pgTransactionId / handoverId / receiptId 등 }
        kind: { type: string, enum: [COMMIT, TRANSACTION, EVENT, DOCUMENT, PHOTO, LOG] }
        asOf: { type: string, format: date-time }
    CreateCaseRequest:
      type: object
      required: [kind, subjectRef, summary]
      properties:
        kind: { $ref: '#/components/schemas/CaseKind' }
        sourceEventId: { type: string, description: 도메인 이벤트 eventId (멱등) }
        sourceEventType: { type: string }
        subjectRef: { type: string }
        subjectType: { type: string, enum: [ORDER, DELIVERY, CLAIM, PAYMENT, TRANSFER, TRIP, PACKAGE, RECEIPT, LOT, ACCOUNT, RIDER, OTHER] }
        centerId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        parentCaseId: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        summary: { type: string, maxLength: 2000 }
        evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceReference' } }
        initialObligations: { type: array, items: { $ref: '#/components/schemas/ObligationBody' } }
    AssigneeGroup:
      type: string
      enum: [CS, MFC_OPS, DELIVERY_OPS, SCM, FINANCE, QUALITY, SECURITY]
      description: 담당 팀. 배송 쪽 사건 = DELIVERY_OPS(역할 RIDER_OPS — 지원센터 겸함, 2026-11-16)
    CaseSummary:
      type: object
      properties:
        caseId: { type: string }
        parentCaseId: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/CaseKind' }
        state: { $ref: '#/components/schemas/CaseState' }
        priority: { $ref: '#/components/schemas/Priority' }
        subjectRef: { type: string }
        subjectType: { type: string }
        centerId: { type: [string, 'null'] }
        assigneeId: { type: [string, 'null'] }
        assigneeGroup: { type: [string, 'null'] }
        openObligationCount: { type: integer }
        slaDueAt: { type: [string, 'null'], format: date-time }
        overdue: { type: boolean, description: '열린 사건이 처리 기한을 넘겼는가(0.4.0 — 화면 강조용, 알림 없음)', x-added-in: '2026-11-16' }
        summary: { type: string, description: '한 줄 요약(0.4.0 — 개인정보 원문 없음)', x-added-in: '2026-11-16' }
        refs:
          type: array
          x-added-in: '2026-11-16'
          description: '관련 참조(0.4.0) — incidentId·deliveryId·orderId·riderId 등. RIDER_HELP·DELIVERY_INCIDENT 는 incidentId(= deliveryId:requestId)·deliveryId 가 늘 있고, 0.4.1(2026-11-16)부터 requestId(도움요청 단건 GET /deliveries/{deliveryId}/help-requests/{requestId})도 — 그 전에 열린 사건은 없다. RIDER_LOCATION_STALE·MISDELIVERY 에는 incidentId 가 없다'
          items:
            type: object
            properties:
              refType: { type: string }
              refId: { type: string }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Case:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          properties:
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            summary: { type: string }
            sourceEventId: { type: [string, 'null'] }
            subCaseIds: { type: array, items: { type: string } }
            mergedFromCaseIds: { type: array, items: { type: string }, description: 병합 시 원 ID 보존 }
            obligations: { type: array, items: { $ref: '#/components/schemas/Obligation' } }
            actionRequests: { type: array, items: { $ref: '#/components/schemas/ActionRequest' } }
            evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceReference' } }
            closure:
              type: object
              properties:
                resolution: { type: string }
                summary: { type: string }
                liability: { type: object, additionalProperties: true }
                closedBy: { type: string }
                closedAt: { type: string, format: date-time }
            history:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  actorId: { type: string }
                  action: { type: string }
                  fromState: { type: string }
                  toState: { type: string }
                  note: { type: string }
    ObligationBody:
      type: object
      required: [kind, owner]
      properties:
        kind: { type: string, enum: [REFUND, RETURN_PICKUP, REDELIVERY, INVENTORY_RECOVERY, RECONCILIATION, CUSTOMER_CONTACT, EVIDENCE_COLLECTION, COMPENSATION, DISPOSAL, SUPPLIER_CLAIM, OTHER] }
        owner: { type: string, description: 해소 책임 서비스/그룹 }
        targetRef: { type: string }
        qty: { type: integer, minimum: 0, description: 수량 의무. 금액과 분리 }
        amount: { $ref: '_common.yaml#/components/schemas/Money' }
        dueAt: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
    Obligation:
      allOf:
        - $ref: '#/components/schemas/ObligationBody'
        - type: object
          properties:
            obligationId: { type: string }
            caseId: { type: string }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            state: { type: string, enum: [OPEN, PARTIALLY_RESOLVED, RESOLVED, WAIVED, FAILED] }
            resolvedQty: { type: integer }
            resolvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
            resolutions:
              type: array
              items:
                type: object
                properties:
                  outcome: { type: string }
                  qty: { type: integer }
                  amount: { type: integer }
                  evidence: { $ref: '#/components/schemas/EvidenceReference' }
                  resolvedBy: { type: string }
                  resolvedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
    ActionRequestBody:
      type: object
      required: [actionType, targetService, command]
      properties:
        actionType: { type: string, enum: [REQUERY_RESULT, RESEND_UNDELIVERED, EXECUTE_APPROVED_COMPENSATION, REQUEST_DOMAIN_REVIEW] }
        targetService: { type: string }
        command: { type: string, description: 대상 서비스 operationId }
        targetRef: { type: string }
        idempotencyKey: { type: string, description: 대상 명령에 사용한 멱등키 }
        approvalRef: { type: string, description: EXECUTE_APPROVED_COMPENSATION 시 필수 }
        payloadSummary: { type: object, additionalProperties: true }
    ActionRequest:
      allOf:
        - $ref: '#/components/schemas/ActionRequestBody'
        - type: object
          properties:
            actionRequestId: { type: string }
            caseId: { type: string }
            state: { type: string, enum: [REQUESTED, SENT, ACCEPTED, APPLIED, REJECTED, UNKNOWN_RESULT] }
            resultRef: { $ref: '#/components/schemas/EvidenceReference' }
            requestedBy: { type: string }
            requestedAt: { type: string, format: date-time }
            resultAt: { type: [string, 'null'], format: date-time }
    RiderComplaintType:
      type: string
      enum: [REPORT, MISDELIVERY, DAMAGE]
      description: REPORT 고객 신고(불친절·위험 운전 등) / MISDELIVERY 오배송 / DAMAGE 파손 (RiderComplaintRecorded 와 같은 값)
    RiderComplaintSummary:
      type: object
      required: [complaintId, riderId, deliveryId, complaintType, source, recordedBy, recordedAt]
      properties:
        complaintId: { type: string }
        caseId: { type: string, nullable: true, description: 문의에서 넘어왔으면 그 문의의 사건 }
        riderId: { type: string, description: dispatch 배정 조회로 채운 라이더 }
        deliveryId: { type: string }
        orderId: { type: string, nullable: true }
        inquiryId: { type: string, nullable: true }
        complaintType: { $ref: '#/components/schemas/RiderComplaintType' }
        source: { type: string, description: '접수 경로(지금 CS_AGENT)' }
        recordedBy: { type: string, description: 기록한 직원 ID }
        recordedAt: { type: string, format: date-time }
    RiderComplaint:
      allOf:
        - $ref: '#/components/schemas/RiderComplaintSummary'
        - type: object
          properties:
            note: { type: string, nullable: true }
    InquiryCategory:
      type: string
      enum: [ORDER, DELIVERY, PAYMENT, REFUND, PRODUCT, ACCOUNT, OTHER]
      description: 주문·배송·결제·환불·상품·회원·기타
    InquiryStatus:
      type: string
      enum: [RECEIVED, ANSWERED, CLOSED]
      description: 접수 → 답변됨 → 종료(종료는 아직 API 없음)
    InquirySummary:
      type: object
      required: [inquiryId, category, status, createdAt, version]
      properties:
        inquiryId: { type: string }
        category: { $ref: '#/components/schemas/InquiryCategory' }
        orderId: { type: string, nullable: true }
        title: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/InquiryStatus' }
        origin: { type: string }
        createdAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time, nullable: true }
        version: { type: integer }
    Inquiry:
      allOf:
        - $ref: '#/components/schemas/InquirySummary'
        - type: object
          required: [body, replies, caseId]
          properties:
            caseId: { type: string }
            customerId: { type: string, description: 운영자 조회에만 의미(고객에게는 본인) }
            body: { type: string }
            replies:
              type: array
              items:
                type: object
                properties:
                  replyId: { type: string }
                  authorType: { type: string, enum: [AGENT] }
                  body: { type: string }
                  createdAt: { type: string, format: date-time }
    Intake:
      type: object
      properties:
        intakeId: { type: string }
        intakeType: { type: string, enum: [CS, RIDER_HELP] }
        caseId: { type: string }
        channel: { type: string }
        category: { type: string }
        subjectRef: { type: string }
        summary: { type: string }
        consentRecorded: { type: boolean }
        receivedBy: { type: string }
        receivedAt: { type: string, format: date-time }
    ShiftHandover:
      type: object
      properties:
        shiftHandoverId: { type: string }
        centerId: { type: string }
        group: { type: string }
        fromOperatorId: { type: string }
        toOperatorId: { type: string }
        snapshot:
          type: array
          description: CloseSnapshot — 인계 시점 열린 사건·의무 요약
          items:
            type: object
            properties:
              caseId: { type: string }
              state: { $ref: '#/components/schemas/CaseState' }
              priority: { $ref: '#/components/schemas/Priority' }
              openObligationCount: { type: integer }
              nextAction: { type: string }
        note: { type: string }
        completedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
