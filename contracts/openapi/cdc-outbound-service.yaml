openapi: 3.1.0
info:
  title: cdc-outbound-service
  version: 0.8.0
  description: |
    승인 TRF 인수(1요청·1이관·1출발)·Wave·Task·실피킹·부족 보고·분류/검품(BOX SEALED / PLT READY)·LPN 구성·계보·
    가상 상차 LOADED(≠출발)·출발 사실 검증·출발 매니페스트·미출발 취소의 정본. (docs/architecture/service-map.md §4)
    수량 전기는 cdc-inventory(할당/해제/TOUT), 차량·운행은 TMS(transport-*), 승인은 replenishment가 정본.
    불변식: 상차 ≤ 검품합격 ≤ 분류 ≤ 실피킹 ≤ 유효할당 ≤ 승인. 같은 TRF의 후속 분할 출발 금지.
    0.2.0(2026-11-25): 작업자 PDA 다음 작업 받기(시스템 자동 배정 — 사용자 결정 "피킹은 다음 작업을 PDA 가 자동 배정")·작업 착수 추가.
    MFC 의 mfc-capacity `POST /mfcs/{mfcId}/workers/{workerId}/next-tasks` 를 CDC 판으로 옮긴 것(사용자 "MFC 기능의 DC 버전"). CDC 는 작업자·근무 정본이 아직 없어 근무·업무 자격·온도대 출입 검사는 뒤로 미룬다.
    0.3.0(2026-11-25, 첫 구현): TRF 인수·cdc-inventory 할당 요청·Wave 생성/릴리스(피킹 Task 생성)·Task 조회/다음 작업 받기/착수/피킹 실적. **Task 경로를 `/cdcs/{cdcId}/tasks…` 로 옮김**
    — 게이트웨이 `/api/v1/tasks/**` 가 mfc-fulfillment 라우트라 겹치지 않게(PR #443 검토). 분류·검품·상차·출발 검증·매니페스트·출발 준비·미출발 취소는 아직 501.
    0.4.0(2026-11-25): 분류·검품·상차 결과, 출발 검증 → cdc-inventory TOUT(+ 잔여 해제), 출발 매니페스트 구현. LPN 단위에 RT(롤테이너) 추가 —
    TMS 정본 D-07 "적재 용량 = 롤테이너, 수량 검증 = 박스"(칠곡 CDC-8). 수량은 BOX 만 가진다(RT·PLT 는 담는 그릇 — contents 비움, 하위 BOX 는 parentLpn).
    출발 준비·미출발 취소는 아직 501.
    0.8.0(2026-11-25): 출발 검증 불일치 UNEXPLAINED_QTY 추가 — TRF 의 실피킹이 그 TRF BOX 분류보다 많으면(SKU 별) 그 TRF 는 MISMATCHED·TOUT 하지 않음
    (WMS CDC-F-017 "미설명 수량은 영향 출발 보류", 사용자 결정 2026-11-25 — 묶음 피킹 설계 §7 결정 4, 단건 피킹에도 적용). 경로·모양 변화 없음(enum 값 추가).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: waves, description: Wave 생성·릴리스 (DRAFT→PLANNED→RELEASED→IN_PROGRESS→WORK_DONE→CLOSED) }
  - { name: tasks, description: 작업·실피킹 결과 }
  - { name: results, description: 분류·검품·상차 결과 등록 }
  - { name: transfers, description: 미출발 취소 }
  - { name: internal, description: 서비스 간 호출 (replenishment / transport / cdc-inventory / mfc-inbound) }

paths:
  /internal/transfer-intakes:
    post:
      tags: [internal]
      summary: '[TransferApproved 소비→cdc-outbound] 승인 TRF 인수 → cdc-inventory 할당 요청 → AllocationResult'
      description: |
        trfId·trfVersion당 1건. 같은 버전·다른 본문은 409 TRANSFER_INTAKE_CONFLICT. 새 버전(TransferChanged)은 기존 인수를 대체한다.
        인수(ACCEPTED)는 확보가 아니다. 확보 결과는 GET /internal/transfer-intakes/{trfId}.
        (0.3.0) 인수 뒤 같은 요청 안에서 cdc-inventory `POST /internal/allocations` 를 부른다(멱등 키 = trfId·버전 고정). 결과에 따라 상태
        ALLOCATED / PARTIALLY_ALLOCATED / ALLOCATION_FAILED(재고 쪽 4xx — 사유를 남김). 응답 불명·미전달이면 ALLOCATING 으로 남고, **같은 본문을 다시 보내면 같은 키로 다시 부른다**(재고는 한 번만 반영).
        응답 status 는 ACCEPTED(resultId = trfId) — 결과는 조회로. 새 버전으로 대체하는 것(할당 해제·재할당)은 아직 없다 — 409 TRANSFER_CHANGE_NOT_SUPPORTED. 더 낮은 버전은 409 INVALID_STATE.
      operationId: intakeTransfer
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferIntakeInput' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: TRANSFER_INTAKE_CONFLICT (같은 버전 다른 본문) / IDEMPOTENCY_CONFLICT / INVALID_STATE (이미 출발·낮은 버전) / TRANSFER_CHANGE_NOT_SUPPORTED (0.3.0)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /internal/transfer-intakes/{trfId}:
    get:
      tags: [internal]
      summary: TRF 인수·확보·작업 진행 조회 (불변식 단계별 수량)
      operationId: getTransferIntake
      parameters:
        - { name: trfId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferIntake' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /waves:
    post:
      tags: [waves]
      summary: Wave 생성 (여러 TRF 묶음, 출발 창·차량 유형 기준)
      description: |
        (0.3.0) 만든 Wave 는 PLANNED. TRF 는 같은 센터이고 확보(ALLOCATED·PARTIALLY_ALLOCATED)된 것만 — 아니면 409 INVALID_STATE, 다른 Wave 에 있으면 409 TRF_ALREADY_IN_WAVE.
        자기 센터 운영자만(centers 클레임).
      operationId: createWave
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 서비스 코드 없음, 센터·운송 운영 업무라 직원 화면용"
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, trfIds]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                trfIds: { type: array, minItems: 1, items: { type: string } }
                plannedDepartureWindow:
                  type: object
                  properties:
                    start: { type: string, format: date-time }
                    end: { type: string, format: date-time }
                temperatureZone: { type: string, enum: [AMBIENT, CHILLED, FROZEN] }
      responses:
        '201':
          description: Wave 생성 또는 기존 반환(같은 키·같은 본문)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wave' }
        '409':
          description: IDEMPOTENCY_CONFLICT / TRF_ALREADY_IN_WAVE / INVALID_STATE (미확보 TRF)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /waves/{waveId}:
    get:
      tags: [waves]
      summary: Wave 조회 (상태·TRF·작업 요약)
      operationId: getWave
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 서비스 코드 없음, 센터·운송 운영 업무라 직원 화면용"
      parameters:
        - { name: waveId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wave' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /waves/{waveId}/releases:
    post:
      tags: [waves]
      summary: Wave 릴리스 (PLANNED→RELEASED, 피킹 Task 생성) → WaveStateChanged
      description: |
        (0.3.0) 릴리스 때 TRF 마다 cdc-inventory `GET /internal/allocations/{id}` 로 **지금** 잡힌 LOT·위치를 읽어(보충 MOV 로 선반에 옮긴 예약은 선반 위치)
        TRF × 구역 × 층(위치 코드 둘째·셋째 구간)마다 PICK Task 하나를 만든다(줄 = SKU·LOT·위치·계획 수량, CREATED·담당 없음).
        잡힌 예약이 0 인 TRF 는 Task 를 만들지 않는다. 재고 조회가 안 되면 503(릴리스 안 함). 팔레트 예약을 선반으로 먼저 보충할지는 호출자가 정한다.
      operationId: releaseWave
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 서비스 코드 없음, 센터·운송 운영 업무라 직원 화면용"
      parameters:
        - { name: waveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: INVALID_STATE / VERSION_CONFLICT / OPERATION_RESTRICTED (cdc-quality 운영 제한)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/tasks:
    get:
      tags: [tasks]
      summary: 작업 목록 (Wave·상태·작업자 기준 — 0.3.0 경로 `/cdcs/{cdcId}/tasks`)
      operationId: listTasks
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: waveId, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/TaskState' } }
        - { name: assigneeId, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Task' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /cdcs/{cdcId}/workers/{workerId}/next-tasks:
    post:
      tags: [tasks]
      summary: '[작업자 PDA] 다음 작업 받기 — 시스템이 작업을 하나씩 자동 배정 (0.2.0)'
      description: |
        2026-11-25 사용자 결정: 피킹은 PDA 가 다음 작업을 자동 배정한다(관리자 배정 아님). 작업자 본인(토큰 주체 = workerId, centers 클레임에 cdcId)이 부른다.
        - 이미 들고 있는 작업(이 작업자가 담당인 ACCEPTED·IN_PROGRESS)이 있으면 그 작업을 200 으로 돌려준다(한 번에 하나).
        - 없으면 RELEASED·IN_PROGRESS Wave 의 **담당 없는 CREATED 작업** 중 하나를 이 작업자에게 배정해 201(state ACCEPTED — 받기가 곧 수락, CDC-F-017 상세안 5번).
          동시에 두 작업자가 받으면 한 작업은 한 사람에게만 간다(조건부 갱신 — 진 쪽은 다음 후보를 받거나 409 NO_TASK_AVAILABLE).
        - 순서: TRF 기한(dueAt) 이른 순 → 작업 만든 순. 원문의 품질·안전·유효 할당 검사를 먼저 통과한 작업만 후보다. 가중치·SCM 우선순위는 승인 전이라 쓰지 않는다(CDC-F-017 상세안 3번).
        - 본문 kind(PICK·SORT·INSPECT·LOAD)·zone(구역 글자)·floor(층)를 주면 그 범위 안에서만 배정한다. 생략하면 전체.
        - 줄 작업이 없으면 409 NO_TASK_AVAILABLE. 근무·업무 자격·온도대 출입 검사(CDC 만 구분)는 작업자 정본이 생기면 더한다 — 그 전에는 하지 않는다.
        - 관리자 수동 배정은 예외 처리용으로 나중에 따로 둔다(지금 계약에 없음).
      operationId: pullNextTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [PICK, SORT, INSPECT, LOAD] }
                zone: { type: string, pattern: '^[A-Z]$', description: 구역 글자(칠곡 CDC-4) }
                floor: { type: string, description: 층(칠곡 5·6·7) }
      responses:
        '200':
          description: 이미 들고 있는 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '201':
          description: 새로 배정한 작업(state ACCEPTED, assigneeId = workerId)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: NO_TASK_AVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/tasks/{taskId}/starts:
    post:
      tags: [tasks]
      summary: '[작업자 PDA] 작업 착수 (ACCEPTED → IN_PROGRESS, 0.2.0)'
      description: |
        담당(assigneeId)만 착수한다 — 다른 작업자는 409 NOT_ASSIGNEE(이전 단말·다른 작업자의 동시 시작 차단, CDC-F-017). 이미 IN_PROGRESS 면 그대로 200.
        착수는 실피킹 완료가 아니다. 첫 착수 때 Wave 가 RELEASED 면 IN_PROGRESS 로. X-Expected-Version 은 Task version.
      operationId: startTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      responses:
        '200':
          description: 착수(또는 이미 착수)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: NOT_ASSIGNEE / INVALID_STATE / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/tasks/{taskId}:
    get:
      tags: [tasks]
      summary: 작업 상세 (피킹 결과·부족 포함)
      operationId: getTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/tasks/{taskId}/pick-results:
    post:
      tags: [tasks]
      summary: 실피킹 결과 등록 (부족 보고 → PickShortageReported → 재할당 또는 축소)
      description: |
        실피킹 ≤ 유효할당. 부족분은 cdc-inventory 해제 후 재할당을 시도하며 불가하면 TRF 축소 대상으로 replenishment에 통지한다.
        (0.2.0) 담당(workerId = assigneeId)의 IN_PROGRESS 작업에만 — 아니면 409 NOT_ASSIGNEE / INVALID_STATE.
        (0.3.0) 줄은 Task 줄(SKU·LOT·위치)과 맞아야 한다(없으면 400). 한 번에 다 보내도, 나눠 보내도 된다 — 줄마다 pickedQty + shortQty ≤ 남은 계획(아니면 409 PICK_EXCEEDS_ALLOCATION).
        모든 줄이 끝나면(실피킹 + 부족 = 계획) Task DONE(부족이 있으면 PARTIAL), Wave 의 모든 Task 가 끝나면 Wave WORK_DONE. 부족은 PickShortageReported(cdc.outbound.v1)로 알린다.
        부족분의 재고 해제·재할당은 아직 하지 않는다 — 예약은 출발 뒤 잔여 해제(RESIDUAL_CLOSED)로 풀린다.
      operationId: reportPickResult
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId, lines]
              properties:
                workerId: { type: string }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, lot, locationCode, pickedQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lot: { type: string }
                      locationCode: { type: string }
                      pickedQty: { type: integer, minimum: 0 }
                      shortQty: { type: integer, minimum: 0 }
                      shortReason: { type: string, enum: [NOT_FOUND, DAMAGED, EXPIRED, LOCATION_BLOCKED, OTHER] }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE / VERSION_CONFLICT / PICK_EXCEEDS_ALLOCATION / NOT_ASSIGNEE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /sorting-results:
    post:
      tags: [results]
      summary: 분류 결과 등록 (BOX SEALED / PLT·RT READY, LPN 구성·계보)
      description: |
        분류 ≤ 실피킹. LPN은 물류 취급 단위이며 상품 수량과 별도다. 한 LPN은 하나의 TRF에만 속한다.
        (0.4.0) 수량은 BOX 의 contents 만 센다 — TRF·SKU·LOT 마다 BOX 합 ≤ 실피킹(Task 실적)이어야 한다(409 SORT_EXCEEDS_PICKED). RT·PLT 는 contents 를 비우고(아니면 400),
        BOX 의 parentLpn 은 같은 결과 또는 이미 등록된 같은 TRF 의 RT·PLT 여야 한다(400). 이미 등록된 LPN 은 다시 분류하지 않는다(409 LPN_ALREADY_SEALED).
        TRF 는 그 Wave 의 것이어야 한다(409 INVALID_STATE). 자기 센터 운영자만.
      operationId: reportSortingResult
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 서비스 코드 없음, 센터·운송 운영 업무라 직원 화면용"
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [waveId, trfId, workerId, lpns]
              properties:
                waveId: { type: string }
                trfId: { type: string }
                workerId: { type: string }
                lpns:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/LpnComposition' }
      responses:
        '202':
          description: 접수. resultId = workResultId
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409':
          description: IDEMPOTENCY_CONFLICT / SORT_EXCEEDS_PICKED / LPN_ALREADY_SEALED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /inspection-results:
    post:
      tags: [results]
      summary: 검품 결과 등록 (LPN 단위 합격/불합격, 온도·봉인 확인)
      description: |
        검품합격 ≤ 분류. 불합격 LPN은 재분류 또는 cdc-quality 보류 대상.
        (0.4.0) RT·PLT 를 검품하면 그 안의 BOX 모두에 같은 결과. 다시 검품하면 덮어쓴다 — 단 상차된 LPN 은 409 INVALID_STATE. 그 TRF 의 LPN 이 아니면 404.
      operationId: reportInspectionResult
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 서비스 코드 없음, 센터·운송 운영 업무라 직원 화면용"
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trfId, inspectorId, items]
              properties:
                trfId: { type: string }
                inspectorId: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [lpn, result]
                    properties:
                      lpn: { type: string }
                      result: { type: string, enum: [PASSED, FAILED] }
                      failReason: { type: string, enum: [QTY_MISMATCH, SEAL_BROKEN, TEMPERATURE, DAMAGE, WRONG_TRF, OTHER] }
                      temperatureC: { type: number }
                      evidenceRef: { type: string }
      responses:
        '202':
          description: 접수. resultId = workResultId
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /loading-results:
    post:
      tags: [results]
      summary: 가상 상차 결과 등록 (LOADED ≠ 출발, 차량·구획별 LPN)
      description: |
        상차 ≤ 검품합격. LOADED는 출발 사실이 아니며 수량 전기를 일으키지 않는다.
        출발 전 하차(UNLOADED)도 같은 경로로 등록한다. 출발 준비 적격은 TMS 창·MFC 수령창 조건을 소비한다.
        (0.4.0) RT·PLT 를 실으면 그 안의 BOX 를 싣는다(구획·봉인은 BOX 에 붙음). BOX 가 PASSED 가 아니면 409 LPN_NOT_PASSED, 다른 운행에 실려 있으면 409 TRIP_MISMATCH,
        UNLOADED 는 이 운행에 실린 것만. 이미 출발한 TRF 는 409 INVALID_STATE. 방문 역순 상차 순서는 검사하지 않는다(TMS 몫).
      operationId: reportLoadingResult
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 서비스 코드 없음, 센터·운송 운영 업무라 직원 화면용"
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trfId, tripId, vehicleId, workerId, action, lpns]
              properties:
                trfId: { type: string }
                tripId: { type: string, description: TMS TripAssigned }
                vehicleId: { type: string }
                dockCode: { type: string }
                workerId: { type: string }
                action: { type: string, enum: [LOADED, UNLOADED] }
                lpns:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [lpn]
                    properties:
                      lpn: { type: string }
                      compartment: { type: string, description: 차량 구획 (온도대) }
                      sealNo: { type: string }
      responses:
        '202':
          description: 접수. resultId = workResultId
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409':
          description: IDEMPOTENCY_CONFLICT / LOAD_EXCEEDS_INSPECTED / LPN_NOT_PASSED / TRIP_MISMATCH
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /work-results/{workResultId}:
    get:
      tags: [results]
      summary: 분류/검품/상차 결과 조회 (명령 짝 조회)
      operationId: getWorkResult
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 서비스 코드 없음, 센터·운송 운영 업무라 직원 화면용"
      parameters:
        - { name: workResultId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workResultId: { type: string }
                  kind: { type: string, enum: [SORTING, INSPECTION, LOADING] }
                  trfId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  rejectReason: { type: string }
                  recordedAt: { type: string, format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/departure-validations:
    post:
      tags: [internal]
      summary: '[TruckActuallyDeparted 소비→cdc-outbound] 출발 사실 검증 (상차 대조) → TruckDepartureValidated → cdc-inventory TOUT 요청'
      description: |
        TMS 출발 구성(trfCompositions)과 상차 LOADED를 LPN 단위로 대조한다. 타 MFC 혼입·누락·봉인 불일치는 mismatches로 반환하고
        OutboundDiscrepancyRaised를 발행한다. 일치 TRF만 cdc-inventory POST /internal/departure-postings를 호출한다.
        departureId당 1회. 승인 60·실출발 48이면 출발 구성 48을 동결하고 미출발 12는 replenishment 잔량 정리 대상이다.
        (0.4.0)
        - TruckActuallyDeparted 에서 옮기는 값: departureId·tripId·vehicleId·departedAt·source·evidenceRef, trfCompositions[].trfId, toMfc → mfcId, lines[].lpn → lpns(중복 없이), sealIds → sealNos.
        - 대조는 BOX 단위(RT·PLT 는 안의 BOX 로 펼침): 출발에만 있음 → LPN_NOT_LOADED(다른 TRF 의 BOX 면 WRONG_TRF), 이 운행에 실렸는데 출발에 없음 → LPN_NOT_IN_DEPARTURE,
          mfcId 가 TRF 목적지와 다름 → WRONG_MFC, sealNos 를 주면 실린 BOX 의 봉인이 그 안에 있어야(SEAL_MISMATCH). 불일치 TRF 는 TOUT 하지 않는다.
        - (0.8.0) 미설명 수량: TRF 줄의 실피킹이 그 TRF 의 모든 BOX 분류(contents)보다 SKU 별로 많으면 UNEXPLAINED_QTY(SKU 마다 하나, detail = 실피킹·분류·차이) —
          그 TRF 는 MISMATCHED, OutboundDiscrepancyRaised 유형 MISSING(WMS CDC-F-017 — 60 을 56 으로 덮거나 4 를 손실로 지우지 않는다). 출발 준비 조회의 UNSORTED_QTY 와 같은 사실이다.
        - 일치 TRF: 출발 BOX 의 contents 를 SKU·LOT 로 합쳐 TOUT(줄 = departureLineId 고정값·lpns, departureSource = source — **SIMULATED 도 TOUT 하며 재고·Transit 기록에 SIMULATED 표시가 남는다**,
          칠곡 CDC-9 시뮬레이터 실서버 모드) → 남은 할당 해제(RESIDUAL_CLOSED) → TRF DEPARTED, 매니페스트 발행(TransferShipmentManifestIssued).
        - 잔여 해제 결과는 transfers[].residualStatus·residualReason(0.5.0) — 재고가 거절하면 FAILED 와 사유를 남기고, 같은 본문 재전송이 다시 부른다.
        - 재고 응답이 불명이면 그 TRF 는 postingStatus UNKNOWN_RESULT — **같은 본문을 다시 보내면 같은 키로 다시 전기**한다(재고는 한 번만 반영). 같은 departureId·다른 본문은 409 DEPARTURE_ALREADY_VALIDATED.
        - 없는 TRF 나 이미 다른 출발로 나간 TRF 가 있으면 409 INVALID_STATE(아무것도 기록하지 않음).
      operationId: validateDeparture
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departureId, tripId, vehicleId, departedAt, source, trfCompositions]
              properties:
                departureId: { type: string }
                tripId: { type: string }
                vehicleId: { type: string }
                departedAt: { type: string, format: date-time }
                source: { type: string, enum: [REAL, SIMULATED] }
                evidenceRef: { type: string }
                trfCompositions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [trfId, lpns]
                    properties:
                      trfId: { type: string }
                      mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                      lpns: { type: array, items: { type: string } }
                      sealNos: { type: array, items: { type: string } }
      responses:
        '200':
          description: 검증 결과 (TRF별 일치 여부·cdc-inventory 전기 상태)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartureValidation' }
        '409':
          description: IDEMPOTENCY_CONFLICT / DEPARTURE_ALREADY_VALIDATED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/departure-validations/{departureId}:
    get:
      tags: [internal]
      summary: 출발 검증 결과 조회 (TRF별 TOUT commitId·불일치)
      operationId: getDepartureValidation
      parameters:
        - { name: departureId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartureValidation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/shipment-manifests/{trfId}:
    get:
      tags: [internal]
      summary: '[mfc-inbound/transport→cdc-outbound] 출발 매니페스트 조회 (TransferShipmentManifestIssued와 동일 내용)'
      description: (0.4.0) lpns = 출발한 BOX 와 그 RT·PLT, lines = BOX 마다 SKU·LOT·수량(lpn = BOX, expiresAt = 할당 LOT 소비기한). TOUT 이 반영된 TRF 만 — 아니면 404 NOT_DEPARTED.
      operationId: getShipmentManifest
      parameters:
        - { name: trfId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentManifest' }
        '404':
          description: NOT_FOUND / NOT_DEPARTED (아직 출발 검증 전)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/transfers/{trfId}/pre-departure-cancellations:
    post:
      tags: [transfers]
      summary: 미출발 취소·축소 — 0.7.0 은 피킹 시작 전까지 (작업 중지 → cdc-inventory 할당 해제)
      description: |
        (0.7.0, WMS CDC-F-026) 경로를 `/cdcs/{cdcId}/transfers/…` 로 옮겼다 — 게이트웨이 `/api/v1/transfers/**` 는 replenishment-service.
        현장 결정으로 자기 센터 운영자가 부른다(공급 쪽 TransferCancelled/Changed 사건은 받지 않는다 — 사용자 2026-11-25 "공급쪽은 안 해"). 요청 결과는 `requestId`(= Idempotency-Key)로 조회한다.
        **취소는 피킹 시작 전에만**(사용자 2026-11-25 "피킹 전에만 취소가 가능함" — 확정, 0.7.1):
        - 승인·미할당(RECEIVED·ALLOCATION_FAILED): FULL 만 — 바로 CANCELLED(현물 변화 0, 재고 호출 없음).
        - 할당·미피킹: FULL = 남은 PICK 작업(CREATED·ASSIGNED·ACCEPTED)을 CANCELLED 로 막은 뒤 할당 전량 해제 → TRF CANCELLED(Wave 에 남은 작업이 없으면 Wave 도 닫음).
          PARTIAL = Wave 릴리스 **전**에만 — SKU 별 reduceQty 중 할당된 만큼 해제(늦은 LOT 부터, cdc-inventory 규칙), TRF 는 그대로 남는다.
        - 피킹이 시작됐거나(실피킹·착수·LPN) 분류·상차된 TRF 는 409 PICKING_STARTED — 취소할 수 없다. 남은 물량은 출발 뒤 잔여 해제(RESIDUAL_CLOSED)로 정리된다.
        - 출발했거나 출발 검증된 TRF 는 409 INVALID_STATE(출발 후 취소 없음). 할당 결과가 불명(ALLOCATING)이면 409 ALLOCATION_IN_PROGRESS(인수 재전송으로 먼저 확정).
        - 재고 해제 응답이 불명이면 결과 UNKNOWN·TRF CANCELLING — 같은 본문을 다시 보내면 같은 키로 다시 해제한다(재고는 한 번만 반영). 그동안 Wave 편성·출발 검증은 막힌다.
          재고가 거절하면 REJECTED(사유) — FULL 은 TRF CANCEL_HOLD(작업은 이미 막힘, 조사 몫).
        - 재고 해제 사유: TRANSFER_CANCELLED·TRANSFER_CHANGED·PICK_SHORTAGE·QUALITY_BLOCKED 는 그대로, 그 밖은 PRE_DEPARTURE_CANCEL.
      operationId: cancelBeforeDeparture
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: trfId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, scope]
              properties:
                reason: { type: string, enum: [TRANSFER_CANCELLED, TRANSFER_CHANGED, PICK_SHORTAGE, TRANSPORT_UNAVAILABLE, QUALITY_BLOCKED, OTHER] }
                scope: { type: string, enum: [FULL, PARTIAL] }
                sourceRef: { type: string, description: replenishment 요청 ID }
                lines:
                  type: array
                  description: PARTIAL 일 때만(SKU 한 번씩). reduceQty 합은 승인량 − 이미 줄인 양을 넘지 못한다(400 REDUCE_EXCEEDS_APPROVED).
                  items:
                    type: object
                    required: [sku, reduceQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      reduceQty: { $ref: '_common.yaml#/components/schemas/Quantity' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (출발 후·이미 취소) / VERSION_CONFLICT / PICKING_STARTED / PARTIAL_AFTER_RELEASE / ALLOCATION_IN_PROGRESS / CANCELLATION_IN_PROGRESS / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/transfers/{trfId}/pre-departure-cancellations/{requestId}:
    get:
      tags: [transfers]
      summary: 미출발 취소 요청 결과 조회 (PENDING/APPLIED/REJECTED/UNKNOWN)
      description: requestId = 취소 요청의 Idempotency-Key. unloadedLpns 는 0.7.0 에서 늘 비어 있다(피킹 전 취소만).
      operationId: getPreDepartureCancellation
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: trfId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  cancellationId: { type: string }
                  scope: { type: string, enum: [FULL, PARTIAL] }
                  state: { type: string, enum: [PENDING, APPLIED, REJECTED, UNKNOWN] }
                  releasedQty: { type: integer }
                  unloadedLpns: { type: array, items: { type: string } }
                  releaseCommitId: { type: string }
                  reason: { type: string, description: 요청 사유 }
                  rejectReason: { type: string, description: REJECTED 일 때 재고 응답(HTTP 상태·코드·설명) }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/outbound-readiness:
    get:
      tags: [internal]
      summary: '[transport-planning→cdc-outbound] 출발 준비 적격 조회 (TMS 편성 조건)'
      description: |
        (0.6.0 구현, WMS CDC-F-020) TRF 하나의 **WMS 자기 화물·작업 사실만**으로 단계와 막힌 이유를 돌려준다. 조회만 한다.
        TMS 운행·구획·ETA·MFC 수령창은 보지 않는다 — 외부 조건과 합쳐 "실행 가능"을 판정하는 것은 transport-planning 몫이다.
        - readiness: DEPARTED·CANCELLED(TRF 상태) → NOT_STARTED(피킹 실적 없음) → PICKING(끝나지 않은 PICK 작업, 또는 실피킹+부족 < 할당)
          → PICKED(피킹 끝·분류 BOX 없음) → SORTED(BOX 수량 < 실피킹, 또는 합격 아닌 BOX) → INSPECTED(모든 BOX 합격·수량 일치) → LOADED(그 BOX 모두 상차).
        - readyLpnCount·readyQty·totalWeightG·temperatureZones: 검품 합격 BOX(DEPARTED 면 출발한 BOX) 기준. RT·PLT 는 세지 않는다(수량은 BOX 에만).
        - earliestReadyAt: INSPECTED·LOADED·DEPARTED 일 때 마지막 BOX 합격 시각(화물 전체가 준비된 때), 그 밖에는 null.
        - blockers: NOT_ALLOCATED·ALLOCATION_FAILED·NOT_IN_WAVE·TASK_EXCEPTION·NOTHING_PICKED(전량 부족)·UNSORTED_QTY·NOT_INSPECTED·INSPECTION_FAILED,
          (0.7.0) CANCELLATION_PENDING(미출발 취소의 재고 해제 불명)·CANCELLATION_HOLD(재고가 해제를 거절 — 조사).
      operationId: getOutboundReadiness
      parameters:
        - { name: trfId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  trfId: { type: string }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  readiness: { type: string, enum: [NOT_STARTED, PICKING, PICKED, SORTED, INSPECTED, LOADED, DEPARTED, CANCELLED] }
                  readyLpnCount: { type: integer }
                  readyQty: { type: integer }
                  totalWeightG: { type: integer }
                  temperatureZones: { type: array, items: { type: string, enum: [AMBIENT, CHILLED, FROZEN] } }
                  earliestReadyAt: { type: [string, 'null'], format: date-time }
                  blockers: { type: array, items: { type: string } }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    WaveState:
      type: string
      enum: [DRAFT, PLANNED, RELEASED, IN_PROGRESS, WORK_DONE, CLOSED, CANCELLED]
    TaskState:
      type: string
      enum: [CREATED, ASSIGNED, ACCEPTED, IN_PROGRESS, PARTIAL, DONE, EXCEPTION, CANCELLED]
    TransferIntakeInput:
      type: object
      required: [trfId, trfVersion, cdcId, mfcId, approvalRef, deadlineMeaning, dueAt, lines]
      properties:
        trfId: { type: string }
        trfVersion: { type: integer }
        cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        approvalRef: { type: string }
        deadlineMeaning: { type: string, enum: [ARRIVAL, HANDOVER, READY] }
        dueAt: { type: string, format: date-time }
        conditions: { type: array, items: { type: object, properties: { kind: { type: string }, value: { type: string } } } }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, approvedQty]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              approvedQty: { $ref: '_common.yaml#/components/schemas/Quantity' }
    TransferIntake:
      allOf:
        - { $ref: '#/components/schemas/TransferIntakeInput' }
        - type: object
          properties:
            state: { type: string, enum: [RECEIVED, ALLOCATING, ALLOCATED, PARTIALLY_ALLOCATED, ALLOCATION_FAILED, IN_WAVE, PICKED, SORTED, INSPECTED, LOADED, DEPARTED, CANCELLED, CANCELLING, CANCEL_HOLD], description: '(0.7.0) CANCELLING = 미출발 취소의 재고 해제 불명(같은 본문 재전송으로 확정), CANCEL_HOLD = 재고가 해제를 거절(작업은 막힘, 조사)' }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            allocationId: { type: string }
            waveId: { type: string }
            tripId: { type: string }
            departureId: { type: string }
            shipmentManifestId: { type: string }
            progress:
              type: array
              description: 불변식 단계별 수량. 상차 ≤ 검품합격 ≤ 분류 ≤ 실피킹 ≤ 유효할당 ≤ 승인
              items:
                type: object
                properties:
                  sku: { type: string }
                  approvedQty: { type: integer }
                  allocatedQty: { type: integer }
                  pickedQty: { type: integer }
                  sortedQty: { type: integer }
                  inspectedQty: { type: integer }
                  loadedQty: { type: integer }
                  departedQty: { type: integer }
            inventoryAsOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    Wave:
      type: object
      properties:
        waveId: { type: string }
        cdcId: { type: string }
        state: { $ref: '#/components/schemas/WaveState' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        trfIds: { type: array, items: { type: string } }
        plannedDepartureWindow: { type: object, properties: { start: { type: string, format: date-time }, end: { type: string, format: date-time } } }
        taskSummary: { type: object, properties: { total: { type: integer }, done: { type: integer }, exception: { type: integer } } }
        createdAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }
    Task:
      type: object
      properties:
        taskId: { type: string }
        waveId: { type: string }
        trfId: { type: string }
        kind: { type: string, enum: [PICK, SORT, INSPECT, LOAD] }
        zone: { type: string, description: 구역 글자(0.2.0 — 다음 작업 받기 거르기) }
        floor: { type: string, description: 층(0.2.0) }
        dueAt: { type: string, format: date-time, description: TRF 기한(0.2.0 — 배정 순서) }
        state: { $ref: '#/components/schemas/TaskState' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        assigneeId: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              lot: { type: string }
              locationCode: { type: string }
              plannedQty: { type: integer }
              pickedQty: { type: integer }
              shortQty: { type: integer }
              shortReason: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    LpnComposition:
      type: object
      description: LPN(BOX/PLT) 구성·계보. PLT는 하위 BOX를 가질 수 있다.
      required: [lpn, unitType, state, contents]
      properties:
        lpn: { type: string }
        unitType: { type: string, enum: [BOX, PLT, RT], description: 'RT = 롤테이너(0.4.0). 수량은 BOX 만 — RT·PLT 는 contents 비움' }
        state: { type: string, enum: [SEALED, READY] }
        parentLpn: { type: [string, 'null'] }
        sealNo: { type: string }
        temperatureZone: { type: string, enum: [AMBIENT, CHILLED, FROZEN] }
        weightG: { type: integer }
        contents:
          type: array
          items:
            type: object
            required: [sku, lot, qty]
            properties:
              sku: { type: string }
              lot: { type: string }
              qty: { type: integer, minimum: 1 }
    DepartureValidation:
      type: object
      properties:
        departureId: { type: string }
        tripId: { type: string }
        vehicleId: { type: string }
        source: { type: string, enum: [REAL, SIMULATED] }
        validatedAt: { type: string, format: date-time }
        overallResult: { type: string, enum: [MATCHED, PARTIALLY_MATCHED, MISMATCHED] }
        transfers:
          type: array
          items:
            type: object
            properties:
              trfId: { type: string }
              result: { type: string, enum: [MATCHED, MISMATCHED] }
              departedQty: { type: integer }
              postingStatus: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
              commitId: { type: string, description: cdc-inventory TOUT commitId }
              shipmentManifestId: { type: string }
              residualStatus:
                type: string
                enum: [DONE, PENDING, FAILED]
                description: |
                  (0.5.0) 출발 뒤 남은 할당 해제(RESIDUAL_CLOSED). 비어 있으면 아직 부르지 않음(TOUT 전·불일치).
                  DONE = 풀었거나 이미 닫힘(재고 409 INVALID_STATE), PENDING = 재고 응답 불명·미전달,
                  FAILED = 재고가 그 밖의 이유로 거절(residualReason). PENDING·FAILED 는 같은 본문을 다시 보내면 같은 키로 다시 부른다.
              residualReason: { type: string, description: '(0.5.0) FAILED 일 때 재고 응답 — HTTP 상태·코드·설명' }
        mismatches:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [LPN_NOT_LOADED, LPN_NOT_IN_DEPARTURE, WRONG_TRF, WRONG_MFC, SEAL_MISMATCH, COMPARTMENT_MISMATCH, UNEXPLAINED_QTY] }
              lpn: { type: string }
              trfId: { type: string }
              detail: { type: string }
    ShipmentManifest:
      type: object
      properties:
        shipmentManifestId: { type: string }
        trfId: { type: string }
        trfVersion: { type: integer }
        departureId: { type: string }
        tripId: { type: string }
        vehicleId: { type: string }
        cdcId: { type: string }
        mfcId: { type: string }
        departedAt: { type: string, format: date-time }
        lpns: { type: array, items: { $ref: '#/components/schemas/LpnComposition' } }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              lot: { type: string }
              expiresAt: { type: string, format: date }
              qty: { type: integer }
        issuedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
