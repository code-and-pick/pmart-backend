openapi: 3.1.0
info:
  title: cdc-outbound-service
  version: 0.17.0
  description: |
    0.17.0(2026-11-25, 실사 부족 받기 — 설계 docs/cdc/design/2026-11-25-count-adjustment.md §4): cdc-inventory `AllocationShortfall`(COUNT_LOSS) 구독(첫 사건 구독) —
      그 TRF 의 안 끝난 작업 줄에 부족(사유 COUNT_LOSS)·TRF 줄 부족 + → 피킹 부족 후속(재고가 이미 풀었으니 해제 건너뜀)으로 다른 LOT 재할당·새 작업 또는 못 찾음(PickShortageResolved). 경로·모양 변화 없음.
    0.16.0(2026-11-25, DC 백오피스 M-3 — PC 5 요청 pmart-clients docs/handoff/cdc-backoffice/2026-11-25-backend-monitoring-gaps.md, 사용자 "응"): 직원 조회 2개(자기 센터 운영자만, 읽기만).
      `GET /cdcs/{cdcId}/departures?result=&page=&size=`(출발 검증 결과 — 줄 = 내부 `DepartureValidation` 과 같은 모양: TRF 별 결과·잔량 해제·불일치 사유, 검증 최신 순),
      `GET /cdcs/{cdcId}/transfers/{trfId}/readiness`(출발 준비 단계·막힌 이유 — 내부 `/internal/outbound-readiness` 와 같은 내용). 운송(차량·기사·운행)은 TMS 서비스 뒤.
    0.15.0(2026-11-25, DC 백오피스 W-1 — PC 5 요청 pmart-clients docs/handoff/cdc-backoffice/2026-11-25-backend-wave-list.md): 직원 조회 `GET /cdcs/{cdcId}/waves?state=&page=&size=`
      — 이 센터 Wave 목록(줄 = `Wave` 그대로 — trfIds·taskSummary 포함), 만든 시각 최신 순, 쪽 나눔은 transfers 와 같게(page 0부터, size ≤ 200, hasNext). 자기 센터 운영자만. 읽기만.
    0.14.0(2026-11-25, 피킹 재고는 출고대기 자리로 옮겨 적기 — 사용자 결정, 설계 docs/cdc/design/2026-11-25-count-adjustment.md §5): 피킹 실적의 실피킹(TRF 몫마다)을
      cdc-inventory move-postings(PICK_MOVE, allocationId)로 그 칸 → 그 층 출고대기(통로 91)의 목적 MFC 자리로 옮겨 적는다(총현물·예약 그대로 — 칸 장부에 실제 칸 물건만 남아 실사가 맞는다).
      지역표에 MFC 출고대기 자리 stagingBay(칠곡 01 BJG·02 BNG·03 MOKPO·04 SEJ·05 CHC — CDC-5). 출발 준비 blockers PICK_MOVE_PENDING.
    0.13.0(2026-11-25, TRF 새 승인 버전 대체 — WMS CWC-03 TransferChanged, 사용자 "피킹 시작 전까지"): 같은 TRF 의 더 높은 trfVersion 을 transfer-intakes 로 받으면
      피킹 시작 전에 한해 대체한다 — 안 끝난 작업에서 그 TRF 몫을 빼고 Wave 에서 뺀 뒤(CHANGING), 예전 할당을 해제(TRANSFER_CHANGED)하고 새 버전으로 다시 할당한다.
      운영자가 다시 Wave 에 넣는다. 피킹이 시작됐으면 409 PICKING_STARTED. (0.12.0 은 피킹 부족 재할당 PR #492.)
    0.12.0(2026-11-25, 피킹 부족 재할당 — WMS CDC-F-018, 사용자 결정): 부족 보고 뒤 cdc-outbound 가 재고에 그 LOT·위치를 해제하며 재계수 대기로 두고(cdc-inventory 0.7.0),
      같은 할당에 다른 적격 LOT 을 더 잡아 새 PICK 작업을 만든다. 못 잡은 만큼은 "못 찾음" — 집은 만큼만 출발(사용자 "48개만 보냄"). 결과 사건 PickShortageResolved.
      출발 준비 blockers 에 SHORTAGE_REALLOCATING. TRF 줄 shortQty 는 재할당 뒤 남은(못 찾은) 부족이다.
    0.11.0(2026-11-25, DC 백오피스 1단계 — 사용자 "Dc 백오피스 만들어줘", 계획 docs/cdc/cdc-backoffice-plan.md): 직원 조회 3개(자기 센터 운영자 — 토큰 centers 에 cdcId).
      `GET /cdcs/{cdcId}/transfers`(TRF 목록 — 상태·MFC 거르기, 기한 순), `GET /cdcs/{cdcId}/transfers/{trfId}`(줄별 승인·할당·피킹·부족 수량),
      `GET /cdcs/{cdcId}/outbound-summary?date=`(그날(Asia/Seoul, TRF 기한 기준) 출고 집계 — TRF 상태별 수·수량 합·진행률, Wave 상태별 수, 작업 종류×상태별 수). 읽기만.
    승인 TRF 인수(1요청·1이관·1출발)·Wave·Task·실피킹·부족 보고·분류/검품(BOX SEALED / PLT READY)·LPN 구성·계보·
    가상 상차 LOADED(≠출발)·출발 사실 검증·출발 매니페스트·미출발 취소의 정본. (docs/architecture/service-map.md §4)
    수량 전기는 cdc-inventory(할당/해제/TOUT), 차량·운행은 TMS(transport-*), 승인은 replenishment가 정본.
    불변식: 상차 ≤ 검품합격 ≤ 분류 ≤ 실피킹 ≤ 유효할당 ≤ 승인. 같은 TRF의 후속 분할 출발 금지.
    0.2.0(2026-11-25): 작업자 PDA 다음 작업 받기(시스템 자동 배정 — 사용자 결정 "피킹은 다음 작업을 PDA 가 자동 배정")·작업 착수 추가.
    MFC 의 mfc-capacity `POST /mfcs/{mfcId}/workers/{workerId}/next-tasks` 를 CDC 판으로 옮긴 것(사용자 "MFC 기능의 DC 버전"). CDC 는 작업자·근무 정본이 아직 없어 근무·업무 자격·온도대 출입 검사는 뒤로 미룬다.
    0.3.0(2026-11-25, 첫 구현): TRF 인수·cdc-inventory 할당 요청·Wave 생성/릴리스(피킹 Task 생성)·Task 조회/다음 작업 받기/착수/피킹 실적. **Task 경로를 `/cdcs/{cdcId}/tasks…` 로 옮김**
    — 게이트웨이 `/api/v1/tasks/**` 가 mfc-fulfillment 라우트라 겹치지 않게(PR #443 검토). 분류·검품·상차·출발 검증·매니페스트·출발 준비·미출발 취소는 아직 501.
    0.4.0(2026-11-25): 분류·검품·상차 결과, 출발 검증 → cdc-inventory TOUT(+ 잔여 해제), 출발 매니페스트 구현. LPN 단위에 RT(롤테이너) 추가 —
    TMS 정본 D-07 "적재 용량 = 롤테이너, 수량 검증 = 박스"(칠곡 CDC-8). 수량은 BOX 만 가진다(RT·PLT 는 담는 그릇 — contents 비움, 하위 BOX 는 parentLpn).
    출발 준비·미출발 취소는 아직 501.
    0.8.0(2026-11-25): 출발 검증 불일치 UNEXPLAINED_QTY 추가 — TRF 의 실피킹이 그 TRF BOX 분류보다 많으면(SKU 별) 그 TRF 는 MISMATCHED·TOUT 하지 않음
    (WMS CDC-F-017 "미설명 수량은 영향 출발 보류", 사용자 결정 2026-11-25 — 묶음 피킹 설계 §7 결정 4, 단건 피킹에도 적용). 경로·모양 변화 없음(enum 값 추가).
    0.9.0(2026-11-25): 묶음 피킹(docs/cdc/design/2026-11-25-batch-picking.md, 사용자 결정 §7) — Wave 릴리스가 cdc-location 통로 피킹 방식(pickMethod, cdc-location 0.5.0)으로
    DISCRETE(TRF 하나)·REGION_BATCH(지역 묶음)·SKU_BATCH(라인 — Wave 안 모든 MFC) 작업을 만든다. Task 에 pickMode·pickMethod·regionCode·trfIds, 줄마다 shares[](TRF·MFC 별 몫).
    묶음 작업이면 trfId 는 비운다(사용자 2026-11-25). 묶음 실피킹은 기한 이른 TRF 몫부터 채우고 부족은 기한 늦은 몫부터(같으면 trfId 순). 지역 ↔ MFC 대응표 `GET·POST /cdcs/{cdcId}/regions`.
    0.10.0(2026-11-25): DPS 작업은 TRF × 선반 통로 하나(Task.aisle) — 컨베이어 통로마다 자리를 지키는 작업자가 자기 통로 몫만 받게, 다음 작업 받기 본문 aisles[] 거르기(시뮬레이터 R-20, 사용자 "제안대로"). TRF 끼리는 묶지 않음.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: waves, description: Wave 생성·릴리스 (DRAFT→PLANNED→RELEASED→IN_PROGRESS→WORK_DONE→CLOSED) }
  - { name: tasks, description: 작업·실피킹 결과 }
  - { name: results, description: 분류·검품·상차 결과 등록 }
  - { name: transfers, description: 미출발 취소 }
  - { name: staff-views, description: "(0.11.0) DC 백오피스 직원 조회 — TRF 목록·상세·출고 집계" }
  - { name: internal, description: 서비스 간 호출 (replenishment / transport / cdc-inventory / mfc-inbound) }

paths:
  /internal/transfer-intakes:
    post:
      tags: [internal]
      summary: '[TransferApproved 소비→cdc-outbound] 승인 TRF 인수 → cdc-inventory 할당 요청 → AllocationResult'
      description: |
        trfId·trfVersion당 1건. 같은 버전·다른 본문은 409 TRANSFER_INTAKE_CONFLICT. 새 버전(TransferChanged)은 기존 인수를 대체한다.
        인수(ACCEPTED)는 확보가 아니다. 확보 결과는 GET /internal/transfer-intakes/{trfId}.
        (0.3.0) 인수 뒤 같은 요청 안에서 cdc-inventory `POST /internal/allocations` 를 부른다(멱등 키 = trfId·버전 고정). 결과에 따라 상태
        ALLOCATED / PARTIALLY_ALLOCATED / ALLOCATION_FAILED(재고 쪽 4xx — 사유를 남김). 응답 불명·미전달이면 ALLOCATING 으로 남고, **같은 본문을 다시 보내면 같은 키로 다시 부른다**(재고는 한 번만 반영).
        응답 status 는 ACCEPTED(resultId = trfId) — 결과는 조회로. 더 낮은 버전은 409 INVALID_STATE.
        (0.13.0) 더 높은 버전 = 대체(피킹 시작 전만 — 사용자 2026-11-25): 한 트랜잭션에서 TRF 를 새 버전(줄·승인량·기한)으로 바꾸고 안 끝난 PICK 작업에서 그 TRF 몫을 빼며
        (묶음 작업이면 몫만, 빈 작업은 CANCELLED) Wave 에서 뺀다 → state CHANGING. 이어서 트랜잭션 밖에서 예전 할당 해제(TRANSFER_CHANGED, 키 `outbound-change-<trfId>-v<새 버전>`) → 새 버전 할당(키 `outbound-alloc-<trfId>-v<새 버전>`).
        해제 응답이 불명이면 CHANGING 으로 남는다 — 같은 본문을 다시 보내면 같은 키로 이어서 한다. 재고가 해제를 거절하면 CHANGE_HOLD(사유 allocationError, 같은 본문 재전송이 다시 시도).
        막는 경우: 피킹·분류가 시작됨 409 PICKING_STARTED, 출발·취소된 TRF 409 INVALID_STATE, 예전 버전 할당 결과 불명 409 ALLOCATION_IN_PROGRESS, 다른 대체 진행 중 409 VERSION_CHANGE_IN_PROGRESS, 미출발 취소 진행 중 409 CANCELLATION_IN_PROGRESS.
      operationId: intakeTransfer
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferIntakeInput' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: TRANSFER_INTAKE_CONFLICT (같은 버전 다른 본문) / IDEMPOTENCY_CONFLICT / INVALID_STATE (이미 출발·취소·낮은 버전) / PICKING_STARTED·ALLOCATION_IN_PROGRESS·VERSION_CHANGE_IN_PROGRESS·CANCELLATION_IN_PROGRESS (0.13.0 새 버전 대체)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /internal/transfer-intakes/{trfId}:
    get:
      tags: [internal]
      summary: TRF 인수·확보·작업 진행 조회 (불변식 단계별 수량)
      operationId: getTransferIntake
      parameters:
        - { name: trfId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferIntake' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /waves:
    post:
      tags: [waves]
      summary: Wave 생성 (여러 TRF 묶음, 출발 창·차량 유형 기준)
      description: |
        (0.3.0) 만든 Wave 는 PLANNED. TRF 는 같은 센터이고 확보(ALLOCATED·PARTIALLY_ALLOCATED)된 것만 — 아니면 409 INVALID_STATE, 다른 Wave 에 있으면 409 TRF_ALREADY_IN_WAVE.
        자기 센터 운영자만(centers 클레임).
      operationId: createWave
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 서비스 코드 없음, 센터·운송 운영 업무라 직원 화면용"
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, trfIds]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                trfIds: { type: array, minItems: 1, items: { type: string } }
                plannedDepartureWindow:
                  type: object
                  properties:
                    start: { type: string, format: date-time }
                    end: { type: string, format: date-time }
                temperatureZone: { type: string, enum: [AMBIENT, CHILLED, FROZEN] }
      responses:
        '201':
          description: Wave 생성 또는 기존 반환(같은 키·같은 본문)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wave' }
        '409':
          description: IDEMPOTENCY_CONFLICT / TRF_ALREADY_IN_WAVE / INVALID_STATE (미확보 TRF)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /waves/{waveId}:
    get:
      tags: [waves]
      summary: Wave 조회 (상태·TRF·작업 요약)
      operationId: getWave
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 서비스 코드 없음, 센터·운송 운영 업무라 직원 화면용"
      parameters:
        - { name: waveId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wave' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /waves/{waveId}/releases:
    post:
      tags: [waves]
      summary: Wave 릴리스 (PLANNED→RELEASED, 피킹 Task 생성) → WaveStateChanged
      description: |
        (0.3.0) 릴리스 때 TRF 마다 cdc-inventory `GET /internal/allocations/{id}` 로 **지금** 잡힌 LOT·위치를 읽어(보충 MOV 로 선반에 옮긴 예약은 선반 위치)
        TRF × 구역 × 층(위치 코드 둘째·셋째 구간)마다 PICK Task 하나를 만든다(줄 = SKU·LOT·위치·계획 수량, CREATED·담당 없음).
        잡힌 예약이 0 인 TRF 는 Task 를 만들지 않는다. 재고 조회가 안 되면 503(릴리스 안 함). 팔레트 예약을 선반으로 먼저 보충할지는 호출자가 정한다.
        (0.9.0) 묶음 피킹: 위치마다 cdc-location `POST /internal/location-lookups` 의 pickMethod 로 방식을 정한다 —
          방식 없음(팔레트 랙·설정 없는 통로) → DISCRETE: 지금처럼 TRF × 구역 × 층(사용자 2026-11-25 "지금처럼 TRF 하나씩"). 위치 조회가 안 되면 503(릴리스 안 함).
          DPS → DISCRETE: (0.10.0) TRF × 구역 × 층 × **선반 통로**(Task.aisle — 컨베이어 통로 작업자가 자기 통로 몫만, R-20).
          BOX_PICK·FC·DISTRIBUTION → REGION_BATCH: (지역 × 방식 × 구역 × 층) — 지역은 TRF 목적 MFC 의 대응표(`/cdcs/{cdcId}/regions`).
          LINE → SKU_BATCH: (방식 × 구역 × 층) — Wave 안 모든 TRF.
          묶음 작업은 같은 SKU·LOT·위치를 한 줄로 합치고 줄 밑 shares[] 에 TRF 별 계획 몫을 남긴다(WMS CDC-F-017 "원요청행별 배분 근거"). 작업 dueAt = 몫 TRF 중 가장 이른 기한.
          설정 `pmart.outbound.batch-max-lines` 가 있으면 묶음 작업을 그 줄 수로 자른다(없으면 자르지 않음 — 기본값 없음).
          재고 할당·예약은 TRF 마다 그대로다(재고 MOV 없음 — 설계 §4).
      operationId: releaseWave
      x-pmart-user-types: [OPERATOR]
