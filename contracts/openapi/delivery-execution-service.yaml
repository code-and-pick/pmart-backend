        대화에 고객 전화번호·출입 비밀번호 같은 것이 적혔을 때 OPERATOR_ADMIN 이 사유(2~500자)와 함께 가린다(case 메모 가림과 같게, ADR-0062).
        글을 DB 에서 지우고(body null) 누가·언제·왜는 남긴다 — 라이더에게도 가려져 보인다(masked true). 사진 참조는 그대로. 이미 가렸으면 그대로 200.
        그 밖 직원·라이더 403, 볼 수 없는 도움요청·없는 메시지 404. 사유는 로그에 남기지 않는다.
      operationId: maskHelpRequestMessage
      x-pmart-user-types: [OPERATOR]
