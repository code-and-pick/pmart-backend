      parameters:
        - { name: state, in: query, schema: { type: string, enum: [REQUESTED, APPROVED, REJECTED] }, description: '(0.22.2, 2026-11-18) 비우면 **모든 상태**(최근 신청부터) — 라이더 백오피스 "전체" 탭. 상태를 주면 그 상태만(오래된 것부터). 예전에는 비우면 REQUESTED 였다' }
        - { name: riderId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: mfcId, in: query, schema: { type: string, maxLength: 64 }, x-added-in: '2026-11-23', description: '(0.37.0, RS-7 — 라이더 백오피스 센터 고르기) 그 배송의 센터(execution_delivery.mfcId)가 이 센터인 것만. 권한은 그대로(보기 거르기)' }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
