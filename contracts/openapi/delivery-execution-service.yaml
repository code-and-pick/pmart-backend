        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StaffHelpRequestSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /internal/riders/{riderId}/withdrawal-blockers:
    get:
      tags: [internal]
      summary: '[rider→execution] 라이더 탈퇴를 막는 것 (0.12.0)'
      x-added-in: '2026-11-17'
      description: |
        rider-service 탈퇴 신청(라이더 앱 요청 §17, 사용자 결정 2026-11-17)이 부른다. ACTIVE_DELIVERY(끝나지 않은 배정 — 배정~실패 등록·회수 중),
        UNCONFIRMED_EARNING(산정 가능·확정 전 ESTIMATED·PENDING_CONFIRMATION — 확정 뒤는 막지 않는다), EARNING_ADJUSTMENT_PENDING(산정 불가·조정 전),
        OPEN_HELP_REQUEST(도움요청 OPEN·IN_PROGRESS). 없는 라이더·막는 것 없음은 빈 목록(200). 토큰 없음(/internal).
      operationId: getRiderWithdrawalBlockers
      parameters:
        - { name: riderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [riderId, blockers]
                properties:
                  riderId: { type: string }
                  blockers: { type: array, items: { type: string, enum: [ACTIVE_DELIVERY, UNCONFIRMED_EARNING, EARNING_ADJUSTMENT_PENDING, OPEN_HELP_REQUEST] } }
  /deliveries/{deliveryId}/status-corrections:
    post:
      tags: [staff]
      summary: (0.17.0) 운영자 상태 정정 — 라이더가 단계를 잘못 눌렀을 때 (RIDER_OPS·OPERATOR_ADMIN)
      x-added-in: '2026-11-17'
      description: |
        원문 §9.3 "배달 상태 잘못 변경 → 실제 수행 확인 → 관리자 정정", §6.4 "관리자 정정 시 확인 근거·처리자·시각 기록". 사용자 2026-11-17 **"라이더 운영 관리자가 승인"** —
        정정하는 라이더 운영(RIDER_OPS)·관리자(OPERATOR_ADMIN)가 곧 승인자(따로 승인 번호 없음, 그 밖 403). 사유 2~500자 필수, 근거 사진(evidenceRefs)은 선택.
        **바꿀 수 있는 것만**(그 밖 422 CORRECTION_NOT_ALLOWED): 픽업 전 ASSIGNED ↔ ARRIVED_AT_STORE, 픽업 뒤 PICKED_UP ↔ ARRIVED_AT_CUSTOMER. 픽업 자체·완료·실패·취소는
        정정으로 바꾸지 않는다(픽업은 포장 인계 사실, 완료는 증빙·자동 완료, 실패는 failure-decisions). 일반·재발송 배송만.
        정정은 새 사실 기록 — 이력에 OPERATOR 로 남고(이전 이력은 그대로), `DeliveryStatusCorrected`(from·to·operatorId·basis) → tracking 진행 단계도 맞춘다.
      operationId: correctDeliveryStatus
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetState, reason]
              properties:
                targetState: { type: string, enum: [ASSIGNED, ARRIVED_AT_STORE, PICKED_UP, ARRIVED_AT_CUSTOMER] }
                reason: { type: string, minLength: 2, maxLength: 500 }
                evidenceRefs: { type: array, maxItems: 10, items: { type: string, maxLength: 128 } }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: CORRECTION_NOT_ALLOWED(바꿀 수 없는 단계)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/deliveries/{deliveryId}/status-corrections:
    post:
      tags: [internal]
      deprecated: true
      summary: "[사용 안 함] 운영자 상태 정정 — 0.17.0 `/deliveries/{id}/status-corrections`(직원 토큰)로"
      description: |
        2026-11-17: 만들지 않는다 — 직원 토큰 경로(`POST /deliveries/{deliveryId}/status-corrections`)가 대신한다(승인은 정정하는 라이더 운영 관리자 — 사용자). 계속 501.
        정정은 새 사실 기록이며 기존 이력을 삭제하지 않는다. COMPLETED를 되돌리는 정정은 허용하지 않고 사고 사건(DeliveryIncidentRaised)으로 처리한다.
        픽업 정정은 handoverIds 근거가 있어야 한다.
      operationId: createStatusCorrection
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetState, reason, approvalRef, evidenceRefs]
              properties:
                targetState: { $ref: '#/components/schemas/ExecutionState' }
                reason: { type: string, maxLength: 500 }
                approvalRef: { type: string }
                evidenceRefs: { type: array, minItems: 1, items: { type: string } }
                handoverIds: { type: array, items: { type: string } }
                occurredAt: { type: string, format: date-time, description: 실제 발생 시각 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / EVIDENCE_REQUIRED / UNSUPPORTED_ACTION (COMPLETED 되돌리기)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/deliveries/{deliveryId}/status-corrections/{requestId}:
    get:
      tags: [internal]
      summary: 상태 정정 결과 조회
      operationId: getStatusCorrection
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  state: { type: string, enum: [ACCEPTED, APPLIED, REJECTED] }
                  fromState: { $ref: '#/components/schemas/ExecutionState' }
                  toState: { $ref: '#/components/schemas/ExecutionState' }
                  operatorId: { type: string }
                  approvalRef: { type: string }
                  appliedAt: { type: string, format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /deliveries/{deliveryId}/recovery-contact:
    get:
      tags: [returns]
      summary: 회수지 연락처 — 오배송 회수는 전화만, 고객 반품 회수는 주소까지 (회수 라이더 본인)
      description: |
        **2026-11-17 통합(사용자 "라이더 입장에서는 MFC 로 이동하는 배달 하나")**: 회수 배송(type RETURN) 두 목적 모두 이 하나로 — 라이더 앱은 purpose 로 문구만 바꾸고 같은 회수 화면을 쓴다.
        고객 반품 회수(CLAIM_RETURN)는 회수지가 그 고객 집이라 `receiverName`·`roadAddress`·`detailAddress`·`entranceMethod`·`entranceNote` 도 준다(주소가 있으면 보이면 된다). 열리는 때에 FAILURE_REPORTED(받기 전 실패 등록 중)도 더함.
        2026-11-16 사용자 "원래 고객의 전화는 회수 라이더에게 보여야 해". 회수 배송(purpose MISDELIVERY_RECOVERY)에 배정된 라이더 본인만(아니면 404 — 있는지 알리지 않음, 직원 토큰 403).
        열리는 때: ASSIGNED·RETURN_PICKED_UP(회수 진행 중). 반납 뒤·취소는 409 RECOVERY_CONTACT_CLOSED, 회수 배송이 아니면 409 NOT_RECOVERY.
        **전화번호만** 준다(원래 고객 주소·출입 정보는 주지 않는다). 원천은 order 주문 당시 사본(O-5) — 저장·로그하지 않는다(`Cache-Control: no-store`). 사본 없음 404 DROP_INFO_NOT_FOUND, order 장애 503.
      x-added-in: '2026-11-16'
      operationId: getRecoveryContact
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryContact' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /deliveries/{deliveryId}/evidence-photos/{photoRef}:
    get:
      tags: [execution]
      summary: 증빙 사진 보기 (원본 이미지)
      description: |
        2026-11-16 사용자 "사진보기 기능 넣어". 이 배송에 올린 사진(photoRef)의 원본 이미지. 비공개 저장소에서 읽어 그대로 돌려준다(`Cache-Control: no-store, private` — 앱·브라우저가 남기지 않게).
        볼 수 있는 사람: 이 배송에 배정된 라이더(지금 배정), **이 배송을 회수하는 라이더**(이 배송이 원래 배송인 오배송 회수에 배정 — ASSIGNED·RETURN_PICKED_UP 동안), 그 센터 운영자·OPERATOR_ADMIN·CS_AGENT·RIDER_OPS.
        **고객(0.9.0, 2026-11-17 사용자 "본인 배송 완료 사진 공개")**: 본인 주문의 배송이 전달 완료(COMPLETED)된 뒤 **전달 완료 증빙 사진만**(`GET …/delivery-proof` 의 photoRefs). 실패 등록·회수 사진은 안 됨.
        그 밖·없는 사진·다른 배송의 사진은 404(있는지 알리지 않음). 저장소 미설정·장애 503.
      x-added-in: '2026-11-16'
      operationId: getEvidencePhoto
      x-pmart-user-types: [RIDER, OPERATOR, CUSTOMER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: photoRef, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 사진 원본(올린 형식 그대로)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /deliveries/{deliveryId}/delivery-proof:
    get:
      tags: [execution]
      summary: 고객용 전달 완료 증빙 — 놓은 곳·사진 (0.9.0)
      x-added-in: '2026-11-17'
      description: |
        2026-11-17 사용자 결정 "본인 배송 완료 사진 공개" — 오배송·미수령을 고객이 확인하게. **본인 주문의 배송**(order 내부 조회 accountId = 토큰 sub)이
        **전달 완료(COMPLETED)** 된 뒤만. 놓은 곳(placement·placementDetail)·사진 참조·완료 시각. 라이더 ID·위치·전화는 없다(라이더 통화 없음 — 문의로 상담원이 연락).
        사진은 `GET …/evidence-photos/{photoRef}`(고객은 이 photoRefs 만). 남의·없는 배송 404, 아직 완료 전 409 DELIVERY_NOT_COMPLETED, 고객이 아니면 403.
      operationId: getDeliveryProof
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deliveryId, photoRefs]
                properties:
                  deliveryId: { type: string }
                  orderId: { type: string }
                  completedAt: { type: [string, 'null'], format: date-time }
                  placement: { type: [string, 'null'], description: 놓은 곳 코드(라이더가 고른 값) }
                  placementDetail: { type: [string, 'null'], description: 놓은 곳 설명(라이더가 쓴 글) }
                  photoRefs: { type: array, items: { type: string } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

components:
  schemas:
    DropInfo:
      type: object
      x-added-in: '2026-11-14'
      description: 라이더용 전달지(order 주문 당시 사본 O-5). 개인정보 — 앱도 화면 밖에 남기지 않는다(전달 완료 뒤 지움)
      required: [deliveryId, roadAddress, detailAddress, receiverName, receiverPhone]
      properties:
        deliveryId: { type: string }
        roadAddress: { type: string }
        detailAddress: { type: string }
        postalCode: { type: [string, 'null'] }
        receiverName: { type: string }
        receiverPhone: { type: string, description: 고객 전화번호(안심번호 아님 — 사용자 결정 2026-11-14) }
        entranceMethod: { type: [string, 'null'], enum: [FREE, PASSWORD, CALL, OTHER, null], description: 'FREE 자유 출입, PASSWORD 공동현관 비밀번호, CALL 호출, OTHER 기타' }
        entranceNote: { type: [string, 'null'], description: 출입 메모(비밀번호일 수 있다) }
        deliveryNote: { type: [string, 'null'], description: 배송 요청사항 }
        lat: { type: [number, 'null'], description: 지도 핀(참고) }
        lng: { type: [number, 'null'] }
    HelpCategory:
      type: string
      description: 원문 §5.4 도움요청 버튼(점포 대기 STORE_WAITING·상태 정정 STATUS_CORRECTION 은 0.3.0 에 더함). 배차취소는 dispatch 배차 취소 API. DELIVERY_FAILURE(0.14.0)는 실패 등록이 여는 대화 — 도움요청 만들기로는 400
      enum: [CUSTOMER_UNREACHABLE, ADDRESS_ISSUE, GOODS_ISSUE, PHOTO_UPLOAD_FAILED, ACCIDENT, APP_ERROR, STORE_WAITING, STATUS_CORRECTION, OTHER, DELIVERY_FAILURE]
    HelpResolution:
      type: object
      x-added-in: '2026-11-15'
      properties:
        note: { type: string, maxLength: 300, description: 처리 메모(선택, 개인정보 금지) }
    HelpMessage:
      type: object
      x-added-in: '2026-11-16'
      required: [messageId, seq, senderType, body, createdAt]
      properties:
        messageId: { type: string }
        seq: { type: integer, format: int64, description: 대화 안 순번(오름차순) — 다음 조회의 after }
        senderType: { type: string, enum: [RIDER, SUPPORT] }
        senderId: { type: [string, 'null'], description: 보낸 사람 ID — 직원에게만(라이더에게 상담원 ID 는 null) }
        body: { type: [string, 'null'], description: '내용 — 관리자가 가렸으면 null(0.8.0)' }
        masked: { type: boolean, description: '관리자가 가림(0.8.0 DE-2) — 라이더에게도 보인다', x-added-in: '2026-11-17' }
        maskedAt: { type: [string, 'null'], format: date-time, x-added-in: '2026-11-17' }
        maskedBy: { type: [string, 'null'], description: 가린 관리자 — 직원에게만, x-added-in: '2026-11-17' }
        maskReason: { type: [string, 'null'], description: 가린 사유 — 직원에게만, x-added-in: '2026-11-17' }
        photoRefs: { type: array, items: { type: string }, description: '사진 보기 GET /deliveries/{id}/evidence-photos/{photoRef}' }
        createdAt: { type: string, format: date-time }
    HelpRequest:
      type: object
      properties:
        requestId: { type: string }
        deliveryId: { type: string }
        incidentId: { type: string, description: 'DeliveryIncidentRaised.incidentId = <deliveryId>:<requestId>' }
        caseId: { type: [string, 'null'], description: 지원센터 사건 번호 — case-service 가 사건을 만든 뒤 }
        state: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
        category: { type: string }
        stage: { $ref: '#/components/schemas/ExecutionState' }
        detail: { type: [string, 'null'], description: 라이더가 쓴 내용(0.4.0 — 단건에서만) }
        evidenceRefs: { type: array, items: { type: string }, description: 0.4.0 }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time, description: 0.4.0 }
        resolvedBy: { type: [string, 'null'], description: 닫은 직원 ID(직원에게만, 0.4.0) }
        resolutionNote: { type: [string, 'null'], description: 처리 메모(직원에게만, 0.4.0) }
        lastRiderMessageAt: { type: [string, 'null'], format: date-time, description: '대화의 라이더 마지막 메시지 시각 — 직원에게만(0.8.0 DE-2, 직원별 읽음은 화면이 기억)', x-added-in: '2026-11-17' }
        lastSupportMessageAt: { type: [string, 'null'], format: date-time, description: '지원센터 마지막 메시지 시각 — 직원에게만(0.8.0 DE-2)', x-added-in: '2026-11-17' }
    StaffHelpRequestSummary:
      type: object
      x-added-in: '2026-11-15'
      properties:
        incidentId: { type: string }
        requestId: { type: string }
        deliveryId: { type: string }
        orderId: { type: [string, 'null'] }
        mfcId: { type: [string, 'null'] }
        riderId: { type: string }
        category: { type: string }
        stage: { $ref: '#/components/schemas/ExecutionState' }
        state: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
        caseId: { type: [string, 'null'] }
        photoCount: { type: integer, description: 붙인 증빙 참조 수 }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    StaffDeliverySummary:
      type: object
