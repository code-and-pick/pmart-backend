  /deliveries/{deliveryId}/help-requests/{requestId}/messages:
    get:
      tags: [execution]
      summary: 도움요청 대화 — 라이더 ↔ 지원센터 상담원 메시지 목록 (0.6.0)
      x-added-in: '2026-11-16'
      description: |
        도움요청 한 건(= 사건함 RIDER_HELP 한 건)에 딸린 메시지(pmart-clients 라이더 앱 요청 §11-3, 2026-11-16 사용자 "라이더랑 얘기가 되어야").
        볼 수 있는 사람은 도움요청 조회와 같다(요청한 라이더 본인, 그 센터 운영자·OPERATOR_ADMIN·CS_AGENT·RIDER_OPS — 아니면 404).
        오래된 것부터. `after` = 마지막으로 받은 seq — 그보다 뒤 메시지만(앱 4초 확인용). 한 번에 200개까지.
        senderType RIDER·SUPPORT. 상담원 ID(senderId)는 직원에게만(라이더에게는 null — "지원센터"로 보인다).
      operationId: listHelpRequestMessages
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 }, description: 이 seq 뒤 메시지만 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HelpMessage' } }
                  helpState: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED], description: 도움요청 상태(RESOLVED 면 더 쓸 수 없다) }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    post:
      tags: [execution]
      summary: 도움요청 대화 — 메시지 보내기 (라이더 본인 / 지원센터 상담원, 0.6.0)
      x-added-in: '2026-11-16'
      description: |
        **(0.32.1, 2026-11-19)**: 닫힌(RESOLVED) 도움요청이라도, 배송이 아직 FAILURE_REPORTED 이고 그 전달 불가가 연 대화에 **라이더**가 쓰면 409 대신
        도움요청을 다시 연다(OPEN, 처리 기록 지움) + 사건 `HelpRequestReopened`(case 가 접수 건을 다시 연다 — PC 2). 재개 요청(`failures/resume-requests`)도 같다.
        라이더: 도움요청을 보낸 본인만. photoRefs 는 이 배송에 본인이 올린 증빙 사진(`POST …/evidence-photos`)만(아니면 422 PHOTO_NOT_FOUND).
        직원(0.8.0 DE-2 — 접수 건 규칙): **지원센터 RIDER_OPS·OPERATOR_ADMIN 만**. 접수 건이 관리자 팀(ORDER_OPS)으로 넘어가면 OPERATOR_ADMIN 만. CS_AGENT 는 보기만, 센터 관리자(MFC_SUPERVISOR)는 답장 없음(403). 직원은 사진을 붙이지 않는다.
        처리된(RESOLVED) 도움요청에는 쓸 수 없다 — 409 HELP_REQUEST_CLOSED(사건함에서 다시 열면 OPEN 으로 돌아와 다시 쓸 수 있다).
        같은 Idempotency-Key·같은 본문 재전송은 같은 메시지. 내용은 로그에 남기지 않는다(개인정보를 적지 않도록 화면에서 안내).
      operationId: postHelpRequestMessage
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
                photoRefs: { type: array, maxItems: 5, items: { type: string } }
      responses:
        '201':
          description: 보냄
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpMessage' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: HELP_REQUEST_CLOSED / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: PHOTO_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /deliveries/{deliveryId}/help-requests/{requestId}/messages/{messageId}/maskings:
    post:
      tags: [staff]
