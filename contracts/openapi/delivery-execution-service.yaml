              schema: { $ref: '#/components/schemas/RecoveryContact' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /deliveries/{deliveryId}/evidence-photos/{photoRef}:
    get:
      tags: [execution]
      summary: 증빙 사진 보기 (원본 이미지)
      description: |
        2026-11-16 사용자 "사진보기 기능 넣어". 이 배송에 올린 사진(photoRef)의 원본 이미지. 비공개 저장소에서 읽어 그대로 돌려준다(`Cache-Control: no-store, private` — 앱·브라우저가 남기지 않게).
        볼 수 있는 사람: 이 배송에 배정된 라이더(지금 배정), **이 배송을 회수하는 라이더**(이 배송이 원래 배송인 오배송 회수에 배정 — ASSIGNED·RETURN_PICKED_UP 동안), 그 센터 운영자·OPERATOR_ADMIN·CS_AGENT·RIDER_OPS.
        **고객(0.9.0, 2026-11-17 사용자 "본인 배송 완료 사진 공개")**: 본인 주문의 배송이 전달 완료(COMPLETED)된 뒤 **전달 완료 증빙 사진만**(`GET …/delivery-proof` 의 photoRefs). 실패 등록·회수 사진은 안 됨.
        그 밖·없는 사진·다른 배송의 사진은 404(있는지 알리지 않음). 저장소 미설정·장애 503.
      x-added-in: '2026-11-16'
      operationId: getEvidencePhoto
      x-pmart-user-types: [RIDER, OPERATOR, CUSTOMER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: photoRef, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 사진 원본(올린 형식 그대로)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /deliveries/{deliveryId}/delivery-proof:
    get:
      tags: [execution]
      summary: 고객용 전달 완료 증빙 — 놓은 곳·사진 (0.9.0)
      x-added-in: '2026-11-17'
      description: |
        2026-11-17 사용자 결정 "본인 배송 완료 사진 공개" — 오배송·미수령을 고객이 확인하게. **본인 주문의 배송**(order 내부 조회 accountId = 토큰 sub)이
        **전달 완료(COMPLETED)** 된 뒤만. 놓은 곳(placement·placementDetail)·사진 참조·완료 시각. 라이더 ID·위치·전화는 없다(라이더 통화 없음 — 문의로 상담원이 연락).
        사진은 `GET …/evidence-photos/{photoRef}`(고객은 이 photoRefs 만). 남의·없는 배송 404, 아직 완료 전 409 DELIVERY_NOT_COMPLETED, 고객이 아니면 403.
      operationId: getDeliveryProof
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deliveryId, photoRefs]
                properties:
                  deliveryId: { type: string }
                  orderId: { type: string }
                  completedAt: { type: [string, 'null'], format: date-time }
                  placement: { type: [string, 'null'], description: 놓은 곳 코드(라이더가 고른 값) }
                  placementDetail: { type: [string, 'null'], description: 놓은 곳 설명(라이더가 쓴 글) }
                  photoRefs: { type: array, items: { type: string } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

