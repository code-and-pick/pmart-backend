        APPROVE → 그 수행료 합계에 금액을 더하고(보상 칸) RiderEarningRecorded(바뀐 합계) — 지급일은 그 수행료 그대로. REJECT 는 메모 필수. 한 번만(아니면 409 NOT_DECIDABLE).
        그사이 수행료가 지급 중·지급됨이면 409 EARNING_NOT_OPEN. 승인한 사람·시각이 남는다(원문 "승인자·추가 금액·지급일 기록").
      operationId: decideSurchargeRequest
