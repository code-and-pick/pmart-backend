  /deliveries/{deliveryId}/receipt-confirmations:
    post:
      tags: [execution]
      summary: (0.20.0) 고객이 "받았어요" — 고객 수령 확인으로 전달 완료 (주문한 고객 본인)
      x-added-in: '2026-11-17'
      description: |
        사용자 2026-11-17 **"도착예정 시간보다 20분이 지나면 고객에게 음식을 받았는지 물어보고 고객이 전달완료를 눌러주면 라이더앱에도 반영"** — 묻는 것은
        delivery-tracking `DeliveryReceiptCheckRequested` → notification 고객 알림. 고객이 누르면 PICKED_UP·ARRIVED_AT_CUSTOMER 배송을 COMPLETED
        (method CUSTOMER_CONFIRMED, 이력 actor CUSTOMER, 사진 없음) + DeliveryCompleted(인계 줄) + 라이더 수행료(수락 당시 금액 — 고객이 받았으니 정상). 라이더 앱은 배송 조회에서
        COMPLETED 를 본다. 남의 주문 404, 실패 등록 중·이미 끝남 409. 같은 키 재전송은 같은 결과.
      operationId: confirmDeliveryReceipt
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /deliveries/{deliveryId}/surcharge-requests:
    post:
      tags: [execution]
      summary: (0.19.0) 엘리베이터 고장 추가 배달료 신청 (배정 라이더 — 전달 완료 뒤)
      x-added-in: '2026-11-17'
      description: |
        원문 §9.2 "보상배차(추가보상) — 지원센터에 사유·사진 등록, 승인자·실제 수행·추가 금액·지급일 기록, 엘리베이터 고장 15층부터 5층 단위로 500원". 사용자 2026-11-17
        **"다른 사유로 추가금을 주진 않음"** — 엘리베이터 고장만. 금액은 서버가 층으로 정한다: 15~19층 500원, 20~24층 1,000원 … (15층 아래 422 FLOOR_BELOW_SURCHARGE).
        이 배송을 전달 완료한 라이더 본인, 이 배송에 올린 사진 1장 이상(엘리베이터 고장 — 아니면 422 EVIDENCE_REQUIRED). 수행료가 지급 중·지급됨·산정 불가면 409 EARNING_NOT_OPEN.
        배송마다 하나(이미 신청·승인됐으면 409 SURCHARGE_ALREADY_REQUESTED). 지원센터가 승인하면 그 수행료 합계에 더해진다(보상 칸).
      operationId: requestSurcharge
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [floor, evidenceRefs]
              properties:
                floor: { type: integer, minimum: 1, maximum: 200, description: 걸어 올라간 층 }
                evidenceRefs: { type: array, minItems: 1, maxItems: 5, items: { type: string } }
      responses:
        '201':
          description: 신청됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurchargeRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: FLOOR_BELOW_SURCHARGE / EVIDENCE_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /surcharge-requests:
    get:
      tags: [staff]
      summary: (0.19.0) 추가 배달료 신청 목록 — 오래된 것 먼저 (RIDER_OPS·OPERATOR_ADMIN·CS_AGENT 보기)
      x-added-in: '2026-11-17'
