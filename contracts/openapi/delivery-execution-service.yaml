          items: { $ref: '#/components/schemas/ReturnLine' }
        originDeliveryId: { type: string, description: 'MISDELIVERY_RECOVERY — 오배송된 원래 배송' }
        recoveryOrigin:
          type: object
          description: 'MISDELIVERY_RECOVERY — 원래 배송의 완료 증빙(회수 라이더가 놓인 곳을 찾도록). 배정 라이더·운영자에게만'
          properties:
            placement: { type: string }
            placementDetail: { type: string }
            photoRefs: { type: array, items: { type: string } }
            takenAt: { type: string, format: date-time }
            completedAt: { type: string, format: date-time }
    ReturnLine:
      type: object
