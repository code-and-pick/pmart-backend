                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SurchargeRequest' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /surcharge-requests/{requestId}/decisions:
    post:
      tags: [staff]
