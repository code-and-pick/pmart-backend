  /deliveries/{deliveryId}/status-corrections:
    post:
      tags: [staff]
      summary: (0.17.0) 운영자 상태 정정 — 라이더가 단계를 잘못 눌렀을 때 (RIDER_OPS·OPERATOR_ADMIN)
      x-added-in: '2026-11-17'
      description: |
        원문 §9.3 "배달 상태 잘못 변경 → 실제 수행 확인 → 관리자 정정", §6.4 "관리자 정정 시 확인 근거·처리자·시각 기록". 사용자 2026-11-17 **"라이더 운영 관리자가 승인"** —
        정정하는 라이더 운영(RIDER_OPS)·관리자(OPERATOR_ADMIN)가 곧 승인자(따로 승인 번호 없음, 그 밖 403). 사유 2~500자 필수, 근거 사진(evidenceRefs)은 선택.
        **바꿀 수 있는 것만**(그 밖 422 CORRECTION_NOT_ALLOWED): 픽업 전 ASSIGNED ↔ ARRIVED_AT_STORE, 픽업 뒤 PICKED_UP ↔ ARRIVED_AT_CUSTOMER. 픽업 자체·완료·실패·취소는
        정정으로 바꾸지 않는다(픽업은 포장 인계 사실, 완료는 증빙·자동 완료, 실패는 failure-decisions). 일반·재발송 배송만.
        정정은 새 사실 기록 — 이력에 OPERATOR 로 남고(이전 이력은 그대로), `DeliveryStatusCorrected`(from·to·operatorId·basis) → tracking 진행 단계도 맞춘다.
      operationId: correctDeliveryStatus
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetState, reason]
              properties:
                targetState: { type: string, enum: [ASSIGNED, ARRIVED_AT_STORE, PICKED_UP, ARRIVED_AT_CUSTOMER] }
                reason: { type: string, minLength: 2, maxLength: 500 }
                evidenceRefs: { type: array, maxItems: 10, items: { type: string, maxLength: 128 }, description: '(0.22.0) 이 배송의 사진만 — 직원은 staff-evidence-photos 로 올린다. 아니면 422 PHOTO_NOT_FOUND' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: CORRECTION_NOT_ALLOWED(바꿀 수 없는 단계)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

