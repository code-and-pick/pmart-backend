        2026-11-17 사용자 "대시보드에 필요한 것만 더해". 지금 스냅샷 — 진행 중 상태별 수(배정 전 ~ 실패 등록·회수 중), 오늘(Asia/Seoul) 완료·실패,
        열린 도움요청, 수행료 조정 대기, 추가 배달료 신청 대기. mfcId 를 주면 그 센터만(센터 직원은 필수 — `GET /deliveries` 와 같은 범위).
      operationId: getDeliveryStatsForStaff
