openapi: 3.1.0
info:
  title: delivery-execution-service
  version: 0.3.0
  description: |
    배송 수행 상태(배정→가게 도착→픽업 완료(인계 확정 후)→고객 도착→전달 완료 / 실패 / 중단 / 회수 중→점포 반납), 전달 증빙(대면/비대면 사진 필수), 상태 정정, 도움요청, 회수 수행, 수행료 근거·정산 상태, 라이더 배송 이력의 정본. (docs/architecture/service-map.md §7)
    0.2.0(2026-11-13, PR #8 H2 — 픽업한 배송은 전달 완료까지 진행 중): 배정 사건 구독 → 가게 도착 → 픽업 완료(모든 포장 PackageHandedOver, DE-1) → 고객 도착 → 증빙 사진 올리기 → 전달 완료(DeliveryCompleted). 상태 조회·내 배송.
    0.3.0(2026-11-13, 사용자 결정): 전달 실패 = 라이더 등록(FAILURE_REPORTED — 아직 진행 중) → 운영자 확정(FAILED, DeliveryFailed — 배송 종료, 이어지는 회수 배차는 새 배송) 또는 반려(원래 상태로). 도움요청 = 이 서비스에 기록 + DeliveryIncidentRaised(case-service 가 받아 지원센터 사건으로 — 구현 전, caseId 는 그때부터). 수행료 = 수락 당시 금액(dispatch DeliveryAssigned.fee) → 완료 5시간 뒤 확정·지급 예정일 3영업일, 실패·취소는 산정 불가(calculable false). 회수·정정은 아직 501.
    배정(dispatch), 인계 fence·재고(mfc), 주문 완료 판단(order), 환불(claim/payment), 위치(tracking)는 소유하지 않는다.
    시간 경과 자동완료 없음 [확정]. 주류 전달은 PG 인증 통합이므로 현장 신분증 절차 없음 [확정]. GPS·버튼만으로 픽업 확정 금지(PackageHandedOver 근거 필요).
    완료 후 사고 신고는 기존 완료를 유지하고 사건을 별도로 올린다. 지급 실행은 외부 회계.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: execution, description: 라이더 상태 전이 (라이더 앱) }
  - { name: returns, description: 회수 수행 }
  - { name: me, description: 라이더 본인 이력·수행료 }
  - { name: internal, description: 운영자 정정 (승인 필요) }

paths:
  /deliveries/{deliveryId}:
    get:
      tags: [execution]
      summary: 배송 수행 상태 조회 (라이더·점원·운영자)
      operationId: getDeliveryExecution
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryExecution' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /deliveries/{deliveryId}/store-arrivals:
    post:
      tags: [execution]
      summary: 가게 도착 (ASSIGNED → ARRIVED_AT_STORE)
      operationId: reportStoreArrival
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /deliveries/{deliveryId}/pickups:
    post:
      tags: [execution]
      summary: 픽업 완료 (ARRIVED_AT_STORE → PICKED_UP; 인계 확정 handoverIds 필수)
      description: |
        mfc-fulfillment의 CommitPackageHandover로 발급된 handoverId(=PackageHandedOver)가 배송의 모든 포장에 대해 확인되어야 한다.
        미확인 포장이 있으면 422 HANDOVER_NOT_CONFIRMED. QR 스캔·GPS·버튼만으로 픽업 처리하지 않는다(ADR-0006).
      operationId: reportPickup
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TransitionRequest'
                - type: object
                  required: [handoverIds]
                  properties:
                    handoverIds: { type: array, minItems: 1, items: { type: string } }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: HANDOVER_NOT_CONFIRMED (일부 포장 인계 미확정) / HANDOVER_RIDER_MISMATCH
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /deliveries/{deliveryId}/customer-arrivals:
    post:
      tags: [execution]
      summary: 고객 도착 (PICKED_UP → ARRIVED_AT_CUSTOMER)
      operationId: reportCustomerArrival
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /deliveries/{deliveryId}/evidence-photos:
    post:
      tags: [execution]
      summary: 전달 증빙 사진 올리기 (전달 완료 전, 배정 라이더 본인)
      description: |
        원문 §6.2 — 사진 업로드 성공 → 전달 완료. 별도 파일 서비스가 없어 이 서비스가 비공개 S3 호환 저장소(ADR-0016)에 둔다.
        JPEG·PNG·WEBP(파일 앞부분으로 판정), 10MB 이하. 고객 도착(ARRIVED_AT_CUSTOMER) 또는 픽업 완료(PICKED_UP) 상태에서만.
        돌려준 photoRef 를 전달 완료 evidence.photoRefs 에 넣는다. 사진에 다른 고객·신분증·출입 비밀번호가 보이지 않게 찍는 것은 라이더 앱 안내.
      operationId: uploadEvidencePhoto
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 저장
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePhoto' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: PHOTO_INVALID (형식·크기)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /deliveries/{deliveryId}/completions:
    post:
      tags: [execution]
      summary: 전달 완료 (ARRIVED_AT_CUSTOMER → COMPLETED; 증빙 사진 필수)
      description: |
        대면(FACE)·비대면(CONTACTLESS) 모두 사진 업로드 성공 후에만 완료 가능. 업로드 실패 시 재시도 또는 지원센터 대체 증빙(substituteEvidenceCaseId).
        시간 경과 자동완료는 없다. 주류 포함 배송도 현장 신분증 절차 없음(PG 인증 통합).
        완료 시 DeliveryCompleted(배송 단위, 증빙 참조) 발행 → order 완료 집계·review 자격·claim 기한 기산.
      operationId: reportCompletion
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletionRequest' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: EVIDENCE_REQUIRED (사진 참조 없음·업로드 미완료) / EVIDENCE_INVALID
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /deliveries/{deliveryId}/failures:
    post:
      tags: [execution]
      summary: 전달 실패 (고객 부재·주소 오류·연락 두절 등; 자동 환불 없음)
      description: 실패 후 처리(고객 연락·보관·회수)는 case-service 판단. 재배송은 교환 승인 건만.
      operationId: reportFailure
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TransitionRequest'
                - type: object
                  required: [reason, evidenceRefs]
                  properties:
                    reason: { type: string, enum: [CUSTOMER_ABSENT, ADDRESS_ERROR, UNREACHABLE, REFUSED, DAMAGED, RIDER_INCIDENT, OTHER] }
                    detail: { type: string, maxLength: 500 }
                    evidenceRefs: { type: array, minItems: 1, items: { type: string }, description: 이 배송에 같은 라이더가 올린 사진 photoRef(POST …/evidence-photos) }
                    goodsLocation: { type: string, enum: [WITH_RIDER, RETURNED_TO_STORE, LEFT_AT_DOOR, UNKNOWN] }
                    contactAttempts:
                      type: array
                      description: 고객 연락 기록. 고객 사유(CUSTOMER_ABSENT·UNREACHABLE·ADDRESS_ERROR·REFUSED)는 2회 이상 필수(원문 §9.2 "연락 시도 2회 이상")
                      items:
                        type: object
                        required: [attemptedAt, result]
                        properties:
                          attemptedAt: { type: string, format: date-time }
                          method: { type: string, enum: [SAFE_NUMBER_CALL, APP_MESSAGE] }
                          result: { type: string, enum: [ANSWERED, NO_ANSWER, FAILED] }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: EVIDENCE_REQUIRED(사진 없음·남의 사진) / CONTACT_ATTEMPTS_REQUIRED(고객 사유인데 연락 2회 미만)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /deliveries/{deliveryId}/failure-decisions:
    post:
      tags: [execution]
      summary: 전달 실패 확정·반려 (운영자 — 지원센터 화면 전까지 백오피스 권한자)
      description: |
        FAILURE_REPORTED 배송만. CONFIRM → FAILED + DeliveryFailed(배송 종료 — dispatch 는 CLOSED, 라이더 진행 중 수에서 빠짐). 이어지는 회수 배차는 새 배송.
        REJECT → 실패 등록 전 상태로 되돌린다(라이더가 전달을 계속). 그 센터 운영자·OPERATOR_ADMIN·CS_AGENT.
      operationId: decideFailure
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [CONFIRM, REJECT] }
                note: { type: string, maxLength: 500 }
                custody: { type: string, enum: [RIDER, STORE], description: 확정 때 상품이 있는 곳(없으면 라이더 등록 goodsLocation 으로 — RETURNED_TO_STORE 면 STORE, 그 밖 RIDER) }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /deliveries/{deliveryId}/help-requests:
    post:
      tags: [execution]
      summary: 도움요청 (→ case-service 지원센터)
      description: |
        이 서비스에 기록하고 DeliveryIncidentRaised(type HELP_REQUEST, category·단계·내용)를 낸다 — case-service 가 받아 지원센터 사건을 만든다(구현 전, 2026-11-13 사용자 결정 1번).
        사건 번호(caseId)는 case-service 가 생긴 뒤 연결된다(지금은 비어 있음). 배정 라이더 본인, 배정~실패 등록 단계에서.
      operationId: createHelpRequest
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category:
                  type: string
                  description: 원문 §5.4 도움요청 버튼(점포 대기 STORE_WAITING·상태 정정 STATUS_CORRECTION 은 0.3.0 에 더함). 배차취소는 dispatch 배차 취소 API
                  enum: [CUSTOMER_UNREACHABLE, ADDRESS_ISSUE, GOODS_ISSUE, PHOTO_UPLOAD_FAILED, ACCIDENT, APP_ERROR, STORE_WAITING, STATUS_CORRECTION, OTHER]
                detail: { type: string, maxLength: 500 }
                evidenceRefs: { type: array, maxItems: 10, items: { type: string } }
      responses:
        '202':
          description: 접수 (resultId = 도움요청 ID — requestId 와 같다. 사건 번호는 조회의 caseId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /deliveries/{deliveryId}/help-requests/{requestId}:
    get:
      tags: [execution]
      summary: 도움요청 상태 조회
      description: 요청한 라이더 본인, 그 센터 운영자·OPERATOR_ADMIN·CS_AGENT. 볼 수 없으면 404. state 는 case-service 가 생기기 전까지 OPEN.
      operationId: getHelpRequest
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  caseId: { type: [string, 'null'], description: 지원센터 사건 번호 — case-service 가 사건을 만든 뒤 }
                  state: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
                  category: { type: string }
                  stage: { $ref: '#/components/schemas/ExecutionState' }
                  createdAt: { type: string, format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /deliveries/{deliveryId}/returns/pickups:
    post:
      tags: [returns]
      summary: 회수 고객 수거 (type RETURN; → ReturnPickedUp)
      operationId: reportReturnPickup
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TransitionRequest'
                - type: object
                  required: [items, evidenceRefs]
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          claimLineId: { type: string }
                          qty: { type: integer, minimum: 0 }
                    evidenceRefs: { type: array, minItems: 1, items: { type: string } }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /deliveries/{deliveryId}/returns/store-deliveries:
    post:
      tags: [returns]
      summary: 회수품 점포 반납 (→ ReturnDelivered; 점원 수령 확인은 mfc-inbound)
      operationId: reportReturnStoreDelivery
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TransitionRequest'
                - type: object
                  properties:
                    evidenceRefs: { type: array, items: { type: string } }
                    receivedByStaffRef: { type: string, description: 점원 확인 참조(있으면) }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /riders/me/deliveries:
    get:
      tags: [me]
      summary: 내 배송 이력·오늘 내역 (진행 중 포함)
      operationId: listMyDeliveries
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: date, in: query, schema: { type: string, format: date, description: Asia/Seoul } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/ExecutionState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DeliveryExecution' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /riders/me/earnings:
    get:
      tags: [me]
      summary: 수행료·정산 조회 (요율표 버전·할증·보상·공제; 요율 미등록=산정 불가)
      operationId: listMyEarnings
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: settlementState, in: query, schema: { $ref: '#/components/schemas/SettlementState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Earning' } }
                  totals:
                    type: object
                    properties:
                      estimated: { $ref: '_common.yaml#/components/schemas/Money' }
                      confirmed: { $ref: '_common.yaml#/components/schemas/Money' }
                      paid: { $ref: '_common.yaml#/components/schemas/Money' }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /internal/deliveries/{deliveryId}/status-corrections:
    post:
      tags: [internal]
      summary: "[bo→execution] 운영자 상태 정정 (처리자·근거·approvalRef 필수)"
      description: |
        정정은 새 사실 기록이며 기존 이력을 삭제하지 않는다. COMPLETED를 되돌리는 정정은 허용하지 않고 사고 사건(DeliveryIncidentRaised)으로 처리한다.
        픽업 정정은 handoverIds 근거가 있어야 한다.
      operationId: createStatusCorrection
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetState, reason, approvalRef, evidenceRefs]
              properties:
                targetState: { $ref: '#/components/schemas/ExecutionState' }
                reason: { type: string, maxLength: 500 }
                approvalRef: { type: string }
                evidenceRefs: { type: array, minItems: 1, items: { type: string } }
                handoverIds: { type: array, items: { type: string } }
                occurredAt: { type: string, format: date-time, description: 실제 발생 시각 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / EVIDENCE_REQUIRED / UNSUPPORTED_ACTION (COMPLETED 되돌리기)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/deliveries/{deliveryId}/status-corrections/{requestId}:
    get:
      tags: [internal]
      summary: 상태 정정 결과 조회
      operationId: getStatusCorrection
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  state: { type: string, enum: [ACCEPTED, APPLIED, REJECTED] }
                  fromState: { $ref: '#/components/schemas/ExecutionState' }
                  toState: { $ref: '#/components/schemas/ExecutionState' }
                  operatorId: { type: string }
                  approvalRef: { type: string }
                  appliedAt: { type: string, format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    ExecutionState:
      type: string
      description: |
        UNASSIGNED = 배송은 생겼지만 배정 전(또는 픽업 전 배차 취소로 다시 배차 대기, 0.2.0).
        FAILURE_REPORTED = 라이더가 전달 실패를 등록, 운영자 확정 전(아직 진행 중 — 0.3.0). FAILED = 운영자가 확정(배송 종료).
      enum: [UNASSIGNED, ASSIGNED, ARRIVED_AT_STORE, PICKED_UP, ARRIVED_AT_CUSTOMER, FAILURE_REPORTED, COMPLETED, FAILED, SUSPENDED, RETURN_IN_PROGRESS, RETURN_PICKED_UP, RETURNED_TO_STORE, CANCELLED]
    SettlementState:
      type: string
      description: 지급 실행은 외부 회계. PAID는 회계 결과 반영
      enum: [ESTIMATED, PENDING_CONFIRMATION, CONFIRMED, PAYING, PAID, PAYMENT_FAILED, ADJUSTED]
    TransitionRequest:
      type: object
      properties:
        occurredAt: { type: string, format: date-time, description: 단말 시각(참고). 정본 시각은 서버 수신 }
        location:
          type: object
          description: 참고용 좌표. 상태 확정 근거로 쓰지 않는다
          properties:
            lat: { type: number }
            lng: { type: number }
            accuracyM: { type: number }
        note: { type: string, maxLength: 300 }
    CompletionRequest:
      allOf:
        - $ref: '#/components/schemas/TransitionRequest'
        - type: object
          required: [method, evidence]
          properties:
            method: { type: string, enum: [FACE, CONTACTLESS] }
            evidence:
              type: object
              required: [photoRefs, takenAt]
              properties:
                photoRefs: { type: array, minItems: 1, items: { type: string }, description: 이 배송에 올린 증빙 사진 photoRef(POST …/evidence-photos, 같은 라이더) }
                takenAt: { type: string, format: date-time }
                placement: { type: string, enum: [HANDED_TO_CUSTOMER, FRONT_DOOR, SECURITY_OFFICE, DELIVERY_BOX, OTHER], description: 보관 장소 }
                placementDetail: { type: string, maxLength: 200 }
                substituteEvidenceCaseId: { type: string, description: 업로드 불가 시 지원센터 대체 증빙 사건 }
    EvidencePhoto:
      type: object
      required: [photoRef, contentType, sizeBytes, uploadedAt]
      properties:
        photoRef: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer }
        uploadedAt: { type: string, format: date-time }
    Evidence:
      type: object
      properties:
        evidenceRef: { type: string }
        method: { type: string }
        photoRefs: { type: array, items: { type: string } }
        takenAt: { type: string, format: date-time }
        placement: { type: string }
        substituteEvidenceCaseId: { type: string }
    StatusHistoryEntry:
      type: object
      properties:
        state: { $ref: '#/components/schemas/ExecutionState' }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        actor: { type: string, enum: [RIDER, SYSTEM_EVENT, OPERATOR] }
        sourceRef: { type: string, description: handoverId / correction requestId / case }
    DeliveryExecution:
      type: object
      properties:
        deliveryId: { type: string }
        version: { type: integer }
        type: { type: string, enum: [FORWARD, RETURN, RESHIPMENT] }
        orderId: { type: string }
        riderId: { type: string }
        mfcId: { type: string }
        state: { $ref: '#/components/schemas/ExecutionState' }
        handoverIds: { type: array, items: { type: string } }
        packageIds: { type: array, items: { type: string } }
        evidence: { $ref: '#/components/schemas/Evidence' }
        failure:
          type: object
          properties:
            reason: { type: string }
            detail: { type: string }
            goodsLocation: { type: string }
            caseId: { type: string }
            photoRefs: { type: array, items: { type: string } }
            contactAttempts: { type: integer, description: 기록된 고객 연락 횟수 }
            reportedAt: { type: string, format: date-time }
            decision: { type: string, enum: [CONFIRM, REJECT], description: 운영자 결정(없으면 확정 전) }
            decidedBy: { type: string }
            decidedAt: { type: string, format: date-time }
            custody: { type: string, enum: [RIDER, STORE] }
        incidents:
          type: array
          description: 이 배송의 도움요청(0.3.0)
          items: { type: object, properties: { incidentId: { type: string }, category: { type: string }, raisedAt: { type: string, format: date-time } } }
        history: { type: array, items: { $ref: '#/components/schemas/StatusHistoryEntry' } }
        earning: { $ref: '#/components/schemas/Earning' }
        assignedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    Earning:
      type: object
      properties:
        earningId: { type: string }
        deliveryId: { type: string }
        riderId: { type: string }
        calculable: { type: boolean, description: false면 요율표 미등록 등으로 산정 불가 }
        rateTableVersion: { type: integer }
        basis:
          type: object
          properties:
            vehicleType: { type: string }
            distanceBandKm: { type: string }
            cancelStage: { type: string, description: 취소 시점별 기준 }
        baseFee: { $ref: '_common.yaml#/components/schemas/Money' }
        surcharge: { $ref: '_common.yaml#/components/schemas/Money', description: 할증 }
        compensation: { $ref: '_common.yaml#/components/schemas/Money', description: 보상 }
        deduction: { $ref: '_common.yaml#/components/schemas/Money', description: 공제 }
        total: { $ref: '_common.yaml#/components/schemas/Money' }
        settlementState: { $ref: '#/components/schemas/SettlementState' }
        adjustmentRef: { type: string }
        recordedAt: { type: string, format: date-time }
        confirmAt: { type: string, format: date-time, description: 수익 확정 시각 — 전달 완료 + 5시간(원문 §7.2, 0.3.0) }
        payoutDate: { type: string, format: date, description: 지급 예정일 — 수행일(Asia/Seoul) + 3영업일(주말·법정공휴일 제외 — 사용자 결정 2026-11-13). 실제 지급은 외부 회계 }
        note: { type: string, description: 산정 불가 사유 등(calculable false 면 지원센터 조정 필요) }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
