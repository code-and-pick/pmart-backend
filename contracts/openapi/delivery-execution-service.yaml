        seconds: { type: integer, format: int64 }
        connectedSeconds: { type: [integer, 'null'], format: int64, x-added-in: '2026-11-18', description: (직원용만) 그날 접속 시간 }
        waitingSeconds: { type: [integer, 'null'], format: int64, x-added-in: '2026-11-18', description: (직원용만) 그날 대기 시간 }
