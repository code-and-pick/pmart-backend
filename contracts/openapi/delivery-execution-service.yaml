      properties:
        deliveryId: { type: string }
        version: { type: integer }
        type: { type: string, enum: [FORWARD, RETURN, RESHIPMENT] }
        orderId: { type: [string, 'null'] }
        mfcId: { type: [string, 'null'] }
        riderId: { type: [string, 'null'], description: 지금 배정 라이더(배정 전·해제 뒤 null) }
        state: { $ref: '#/components/schemas/ExecutionState' }
        assignedAt: { type: [string, 'null'], format: date-time }
        pickedUpAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        resumeRequestedAt: { type: [string, 'null'], format: date-time, description: '전달 실패 대기 중 라이더가 전달 재개를 요청한 시각(0.14.0) — 반려 판단', x-added-in: '2026-11-17' }
    ExecutionState:
      type: string
      description: |
        UNASSIGNED = 배송은 생겼지만 배정 전(또는 픽업 전 배차 취소로 다시 배차 대기, 0.2.0).
        FAILURE_REPORTED = 라이더가 전달 실패를 등록, 운영자 확정 전(아직 진행 중 — 0.3.0). FAILED = 운영자가 확정(배송 종료).
      enum: [UNASSIGNED, ASSIGNED, ARRIVED_AT_STORE, PICKED_UP, ARRIVED_AT_CUSTOMER, FAILURE_REPORTED, COMPLETED, FAILED, SUSPENDED, RETURN_IN_PROGRESS, RETURN_PICKED_UP, RETURNED_TO_STORE, CANCELLED]
    SettlementState:
      type: string
      description: 지급 실행은 외부 회계. PAID는 회계 결과 반영
      enum: [ESTIMATED, PENDING_CONFIRMATION, CONFIRMED, PAYING, PAID, PAYMENT_FAILED, ADJUSTED]
    TransitionRequest:
      type: object
      properties:
        occurredAt: { type: string, format: date-time, description: 단말 시각(참고). 정본 시각은 서버 수신 }
        location:
          type: object
          description: 참고용 좌표. 상태 확정 근거로 쓰지 않는다
          properties:
            lat: { type: number }
            lng: { type: number }
            accuracyM: { type: number }
        note: { type: string, maxLength: 300 }
    CompletionRequest:
      allOf:
        - $ref: '#/components/schemas/TransitionRequest'
        - type: object
          required: [method, evidence]
          properties:
            method: { type: string, enum: [FACE, CONTACTLESS] }
            evidence:
              type: object
              required: [photoRefs, takenAt]
              properties:
                photoRefs: { type: array, minItems: 1, items: { type: string }, description: 이 배송에 올린 증빙 사진 photoRef(POST …/evidence-photos, 같은 라이더) }
                takenAt: { type: string, format: date-time }
                placement: { type: string, enum: [HANDED_TO_CUSTOMER, FRONT_DOOR, SECURITY_OFFICE, DELIVERY_BOX, OTHER], description: 보관 장소 }
                placementDetail: { type: string, maxLength: 200 }
                substituteEvidenceCaseId: { type: string, description: 업로드 불가 시 지원센터 대체 증빙 사건 }
    EvidencePhoto:
      type: object
      required: [photoRef, contentType, sizeBytes, uploadedAt]
      properties:
        photoRef: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer }
        uploadedAt: { type: string, format: date-time }
    Evidence:
      type: object
      properties:
        evidenceRef: { type: string }
        method: { type: string }
        photoRefs: { type: array, items: { type: string } }
        takenAt: { type: string, format: date-time }
        placement: { type: string }
        substituteEvidenceCaseId: { type: string }
    StatusHistoryEntry:
      type: object
      properties:
        state: { $ref: '#/components/schemas/ExecutionState' }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        actor: { type: string, enum: [RIDER, SYSTEM_EVENT, OPERATOR] }
        sourceRef: { type: string, description: handoverId / correction requestId / case }
    DeliveryExecution:
      type: object
      properties:
        orderSummary:
          type: object
          x-added-in: '2026-11-16'
          description: '라이더에게 보일 주문 요약(라이더 앱 요청 §1 — 사용자 결정 2026-11-16 "수락 전부터 전부"): 품목·수량·줄 금액·상품 합계·배송 요청사항. order 에서 조회 때 읽는다(저장 안 함), 못 읽으면 없음. 고객 이름·연락처·주소는 drop-info(픽업 뒤)'
          properties:
            orderNumber: { type: [string, 'null'], description: '화면용 주문번호(숫자 8자리 — order)', x-added-in: '2026-11-16' }
            items:
              type: array
              items:
                type: object
                properties:
                  orderLineId: { type: string, description: '주문 줄(order 0.11.1 — 2026-11-17)', x-added-in: '2026-11-17' }
                  name: { type: string }
                  optionLabel: { type: [string, 'null'] }
                  qty: { type: integer }
                  lineAmount: { type: integer }
            itemAmount: { type: integer }
            deliveryNote: { type: [string, 'null'] }
        deliveryId: { type: string }
        version: { type: integer }
        type: { type: string, enum: [FORWARD, RETURN, RESHIPMENT] }
        orderId: { type: string }
        riderId: { type: string }
        mfcId: { type: string }
        state: { $ref: '#/components/schemas/ExecutionState' }
        handoverIds: { type: array, items: { type: string } }
        packageIds: { type: array, items: { type: string } }
        evidence: { $ref: '#/components/schemas/Evidence' }
        failure:
          type: object
          properties:
            reason: { type: string }
            detail: { type: string }
            goodsLocation: { type: string }
            caseId: { type: string }
            photoRefs: { type: array, items: { type: string } }
            contactAttempts: { type: integer, description: 기록된 고객 연락 횟수 }
            reportedAt: { type: string, format: date-time }
            decision: { type: string, enum: [CONFIRM, REJECT], description: 운영자 결정(없으면 확정 전) }
            decidedBy: { type: string }
            decidedAt: { type: string, format: date-time }
            custody: { type: string, enum: [RIDER, STORE] }
            helpRequestId: { type: string, description: '함께 열린 지원센터 대화(도움요청) ID(0.14.0) — 이 배포 전 실패 등록은 없음', x-added-in: '2026-11-17' }
            resumeRequestedAt: { type: string, format: date-time, description: '라이더 전달 재개 요청 시각(0.14.0)', x-added-in: '2026-11-17' }
            returnDeliveryId: { type: [string, 'null'], description: '(0.15.0) 확정 뒤 상품이 라이더 손(custody RIDER)이면 같은 라이더에게 바로 배정된 반납 배송(purpose FAILED_DELIVERY_RETURN) — 만들어지기 전·STORE 면 null', x-added-in: '2026-11-17' }
        incidents:
          type: array
          description: 이 배송의 도움요청(0.3.0)
          items: { type: object, properties: { incidentId: { type: string }, category: { type: string }, raisedAt: { type: string, format: date-time } } }
        history: { type: array, items: { $ref: '#/components/schemas/StatusHistoryEntry' } }
        earning: { $ref: '#/components/schemas/Earning' }
        assignedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        purpose: { type: string, enum: [DELIVERY, CLAIM_RETURN, MISDELIVERY_RECOVERY, MISDELIVERY_RESHIPMENT, MISDELIVERY_REDELIVERY, FAILED_DELIVERY_RETURN], description: '0.5.0 — RETURN 의 목적. MISDELIVERY_RESHIPMENT(2026-11-16) = 오배송 재발송 배송(type RESHIPMENT — 수행은 일반 배송과 같다). MISDELIVERY_REDELIVERY(ADR-0065) = 고객 잘못 다시 배송 — 배정 → 잘못 둔 곳에서 사진·받음(returns/pickups → PICKED_UP) → 고객 도착 → 전달 완료(가게 도착·MFC 픽업 409, 전달지 = 실제 집 + 주문 당시 수령인·연락처)' }
        caseId: { type: string, description: 'MISDELIVERY_RECOVERY — 오배송 확인 사건' }
        claimId: { type: string, description: 'CLAIM_RETURN(0.10.1, 2026-11-17) — 고객 반품 클레임', x-added-in: '2026-11-17' }
        orderNumber: { type: [string, 'null'], description: '화면용 주문번호(0.11.0 — 배정 때 받은 값, 내 배달 내역 목록용). 이 배포 전 배정은 null', x-added-in: '2026-11-17' }
        mfcName: { type: [string, 'null'], description: '픽업지 지점 이름(0.11.0 — 배정 때 받은 값, 원문 §8.1 배달현황 "픽업지 마트 이름")', x-added-in: '2026-11-17' }
        mfcPhone: { type: [string, 'null'], description: '픽업 지점 전화(center-master profile — 배정 때 받은 값, 2026-11-17 라이더 "가게 전화"). 없으면 null', x-added-in: '2026-11-17' }
        returnLines:
          type: array
          x-added-in: '2026-11-17'
          description: 'CLAIM_RETURN(0.10.1 — DD-3 "회수 라이더에게 회수 품목이 보여야") — 고객에게 받을 줄·수량. 상품 이름은 각 줄의 name·optionLabel(2026-11-17 — 서버가 주문 요약의 같은 orderLineId 에서 채움)'
          items: { $ref: '#/components/schemas/ReturnLine' }
        originDeliveryId: { type: string, description: 'MISDELIVERY_RECOVERY — 오배송된 원래 배송' }
        recoveryOrigin:
          type: object
          description: 'MISDELIVERY_RECOVERY — 원래 배송의 완료 증빙(회수 라이더가 놓인 곳을 찾도록). 배정 라이더·운영자에게만'
          properties:
            placement: { type: string }
            placementDetail: { type: string }
            photoRefs: { type: array, items: { type: string } }
            takenAt: { type: string, format: date-time }
            completedAt: { type: string, format: date-time }
    ReturnLine:
      type: object
      x-added-in: '2026-11-17'
      description: 고객 반품 회수 줄(0.10.1)
      required: [orderLineId, qty]
      properties:
        orderLineId: { type: string }
        qty: { type: integer, minimum: 1 }
        claimLineId: { type: [string, 'null'] }
        sku: { type: [string, 'null'] }
        name: { type: [string, 'null'], description: '상품명(2026-11-17 — 라이더 앱 "이름이 짝지어지지 않음"): 배송 조회 때 order 주문 요약의 같은 orderLineId 에서. 못 읽으면 null', x-added-in: '2026-11-17' }
        optionLabel: { type: [string, 'null'], x-added-in: '2026-11-17' }
    OperatingTime:
      type: object
      x-added-in: '2026-11-17'
      description: 내 운행시간(0.11.0) — 배차 수락 ~ 전달 완료, 겹치면 한 번
      required: [from, to, totalSeconds, days]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalSeconds: { type: integer, format: int64 }
        days:
          type: array
          items: { $ref: '#/components/schemas/OperatingTimeDay' }
    OperatingTimeDay:
      type: object
      x-added-in: '2026-11-17'
      required: [date, seconds]
      properties:
        date: { type: string, format: date, description: Asia/Seoul 날짜 }
        seconds: { type: integer, format: int64 }
    EarningFault:
      type: string
      x-added-in: '2026-11-17'
      description: 산정 불가 수행료 조정의 귀책(0.13.0) — RIDER 면 미지급, 그 밖은 수락 당시 금액 지급
      enum: [RIDER, CUSTOMER, STORE, PMART]
    EarningAdjustmentResult:
      type: object
      x-added-in: '2026-11-17'
      required: [adjustmentId, decision, fault, earning]
      properties:
        adjustmentId: { type: string }
        decision: { type: string, enum: [PAY, NO_PAY] }
        fault: { $ref: '#/components/schemas/EarningFault' }
        earning: { $ref: '#/components/schemas/Earning' }
    Earning:
      type: object
      properties:
        earningId: { type: string }
        deliveryId: { type: string }
        riderId: { type: string }
        calculable: { type: boolean, description: false면 요율표 미등록 등으로 산정 불가 }
        rateTableVersion: { type: integer }
        basis:
          type: object
          properties:
            vehicleType: { type: string }
            distanceBandKm: { type: string }
            cancelStage: { type: string, description: 취소 시점별 기준 }
        baseFee: { $ref: '_common.yaml#/components/schemas/Money' }
        surcharge: { $ref: '_common.yaml#/components/schemas/Money', description: 할증 }
        compensation: { $ref: '_common.yaml#/components/schemas/Money', description: 보상 }
        deduction: { $ref: '_common.yaml#/components/schemas/Money', description: 공제 }
        total: { $ref: '_common.yaml#/components/schemas/Money' }
        settlementState: { $ref: '#/components/schemas/SettlementState' }
        adjustmentRef: { type: string }
        recordedAt: { type: string, format: date-time }
        confirmAt: { type: string, format: date-time, description: 수익 확정 시각 — 전달 완료 + 5시간(원문 §7.2, 0.3.0) }
        payoutDate: { type: string, format: date, description: 지급 예정일 — 수행일(Asia/Seoul) + 3영업일(주말·법정공휴일 제외 — 사용자 결정 2026-11-13). 실제 지급은 외부 회계 }
        note: { type: string, description: 산정 불가 사유 등(calculable false 면 지원센터 조정 필요) }
    RecoveryContact:
      type: object
      x-added-in: '2026-11-16'
      description: 회수 라이더용 회수지 연락처 — 오배송 회수는 원래 고객 전화만, 고객 반품 회수는 주소·출입까지(2026-11-17). 개인정보 — 앱도 화면 밖에 남기지 않는다
      required: [deliveryId, receiverPhone]
      properties:
        deliveryId: { type: string, description: 회수 배송 }
        purpose: { type: string, enum: [MISDELIVERY_RECOVERY, CLAIM_RETURN], x-added-in: '2026-11-17' }
        originDeliveryId: { type: [string, 'null'], description: 원래 배송(오배송된 배송 / 반품한 주문의 배송 — 모르면 null) }
        receiverPhone: { type: string, description: 고객 전화번호(안심번호 아님) }
        receiverName: { type: [string, 'null'], description: 'CLAIM_RETURN 만 — 받는 분(주문 당시)', x-added-in: '2026-11-17' }
        roadAddress: { type: [string, 'null'], description: 'CLAIM_RETURN 만 — 회수지(고객 집) 도로명주소', x-added-in: '2026-11-17' }
        detailAddress: { type: [string, 'null'], description: 'CLAIM_RETURN 만', x-added-in: '2026-11-17' }
        entranceMethod: { type: [string, 'null'], description: 'CLAIM_RETURN 만 — 출입 방법', x-added-in: '2026-11-17' }
        entranceNote: { type: [string, 'null'], description: 'CLAIM_RETURN 만 — 출입 메모', x-added-in: '2026-11-17' }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
