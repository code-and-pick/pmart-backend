        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /deliveries/{deliveryId}/help-requests/{requestId}/resolutions:
    post:
      tags: [staff]
      summary: 도움요청 처리함으로 닫기 (0.4.0 — 지원센터 사건함 전까지, BOD-4)
      x-added-in: '2026-11-15'
      description: |
        **(0.32.2, 2026-11-19 사용자 "라이더 백오피스만")**: 라이더 운영(RIDER_OPS)·관리자(OPERATOR_ADMIN)만 — 상담원(CS_AGENT, 통합 백오피스)·센터 관리자(MFC_SUPERVISOR, MFC 백오피스)는 403(보기만). 아래 옛 권한 설명보다 이 줄이 앞선다.
        **(0.32.1, 2026-11-19 라이더 앱 요청 — 사용자 "연락불가 도움요청을 지원센터가 처리해버리면 반려 요청도 대화도 안 됨")**: 배송이 FAILURE_REPORTED 이고 이 도움요청이
        그 전달 불가가 연 대화면 409 `FAILURE_DECISION_PENDING` — 먼저 실패를 확정·반려(`failure-decisions`)해야 닫힌다.
        지원센터 사건함(case R-4)이 없는 동안 직원이 도움요청을 처리했다고 닫는다 — OPEN·IN_PROGRESS → RESOLVED. 이미 RESOLVED 면 409 INVALID_STATE(같은 키·같은 본문 재전송은 같은 결과).
        **0.5.1(2026-11-16, DE-CASE)**: 사건함이 이 도움요청으로 사건을 열면(`CaseOpened` RIDER_HELP·DELIVERY_INCIDENT) 도움요청에 `caseId`·IN_PROGRESS, 사건을 닫으면(`CaseClosed`) RESOLVED(resolvedBy `case:<caseId>`, 메모 = 결과), 다시 열면(`CaseReopened`) IN_PROGRESS.
        사건이 붙은 도움요청은 여기서 닫지 않는다 — **409 HELP_REQUEST_HAS_CASE**(사건함에서 닫기). 사건이 없는 예전 도움요청만 이 경로로 닫는다.
        권한은 전달 실패 결정과 같다: 그 센터 MFC_SUPERVISOR, OPERATOR_ADMIN, CS_AGENT, RIDER_OPS(아니면 403, 없는 도움요청은 404).
        배송 상태·버전은 바꾸지 않고 사건도 내지 않는다(받는 쪽이 없다 — 라이더 앱은 조회로 본다). note 에는 개인정보를 적지 않는다(로그에 남기지 않음).
      operationId: resolveHelpRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HelpResolution' }
      responses:
        '200':
          description: 닫힌 도움요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /deliveries/{deliveryId}/returns/pickups:
    post:
      tags: [returns]
      summary: 회수 고객 수거 (type RETURN; → ReturnPickedUp)
      description: |
        0.5.0(2026-11-16) — 오배송 회수(MISDELIVERY_RECOVERY). ASSIGNED → RETURN_PICKED_UP. evidenceRefs = 이 배송에 같은 라이더가 올린 사진 참조(1장 이상, 아니면 422 EVIDENCE_REQUIRED).
        items 는 쓰지 않는다(빈 배열) — 사건 lines 는 오배송 회수면 원래 배송이 전달한 줄·수량, **고객 반품 회수(CLAIM_RETURN, 0.10.0 — 2026-11-17)면 claim 이 회수 요청한 줄·수량**(DeliveryCreated returnLines). ReturnPickedUp 에 claimId.
      operationId: reportReturnPickup
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TransitionRequest'
                - type: object
                  required: [items, evidenceRefs]
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          claimLineId: { type: string }
                          qty: { type: integer, minimum: 0 }
                    evidenceRefs: { type: array, minItems: 1, items: { type: string } }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /deliveries/{deliveryId}/returns/store-deliveries:
    post:
      tags: [returns]
      summary: 회수품 점포 반납 (→ ReturnDelivered; 점원 수령 확인은 mfc-inbound)
      description: |
        0.5.0(2026-11-16) — RETURN_PICKED_UP → RETURNED_TO_STORE(배송 끝, 수행료 = 수락 당시 금액 → 확정 대기). 0.15.0: 전달 실패 반납(FAILED_DELIVERY_RETURN)은 배정(ASSIGNED)에서 바로(받음 없음 — returns/pickups 409), 앞 실패가 고객 사유가 아니면 수행료 산정 불가(지원센터 조정). 사용자 "추천대로"(2026-11-16): mfc-inbound 점원 수령 확인이 생기기 전까지 MFC 도착을 반납으로 본다.
        evidenceRefs(있으면 이 배송에 올린 사진)·receivedByStaffRef 는 선택.
        **0.28.0(2026-11-18 사용자 "직원이나 어딘가에 뜨는 인증코드(번호)를 입력해야 전달완료가 되도록", "여기서 구현하고 바로 PR")**: `handoverCode` = 그 센터 직원 화면
        (`GET /return-handovers?mfcId=`)에 뜨는 숫자 4자리 반납 인증번호. 라이더 응답에는 번호를 넣지 않는다. 회수·반납 배송마다 하나, 반납이 끝날 때까지 유효(시간 제한 없음).
        틀리면 422 `RETURN_HANDOVER_CODE_MISMATCH`(상태 그대로, details 에 field attemptsLeft·reason 남은 횟수), 5번 틀리면 잠김 422 `RETURN_HANDOVER_LOCKED`(맞는 번호도 거절 —
        직원이 `POST /return-handovers/{deliveryId}/code-reissues` 로 새 번호를 내면 풀림). 번호를 주지 않으면: 설정 `pmart.execution.return-handover.required`
        가 true 면 422 `RETURN_HANDOVER_CODE_REQUIRED`, false(기본 — 라이더 앱이 번호 입력을 내보낼 때까지)면 지금처럼 반납. 번호는 로그·사건에 남기지 않는다.
      operationId: reportReturnStoreDelivery
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TransitionRequest'
                - type: object
                  properties:
                    evidenceRefs: { type: array, items: { type: string } }
                    receivedByStaffRef: { type: string, description: 점원 확인 참조(있으면) }
                    handoverCode: { type: string, pattern: '^[0-9]{4}$', description: (0.28.0) MFC 직원 화면의 반납 인증번호 }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: RETURN_HANDOVER_CODE_MISMATCH · RETURN_HANDOVER_LOCKED · RETURN_HANDOVER_CODE_REQUIRED (0.28.0)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

