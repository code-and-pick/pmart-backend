  /deliveries/{deliveryId}/recovery-contact:
    get:
      tags: [returns]
      summary: 회수지 연락처 — 오배송 회수는 전화만, 고객 반품 회수는 주소까지 (회수 라이더 본인)
      description: |
        **2026-11-17 통합(사용자 "라이더 입장에서는 MFC 로 이동하는 배달 하나")**: 회수 배송(type RETURN) 두 목적 모두 이 하나로 — 라이더 앱은 purpose 로 문구만 바꾸고 같은 회수 화면을 쓴다.
        고객 반품 회수(CLAIM_RETURN)는 회수지가 그 고객 집이라 `receiverName`·`roadAddress`·`detailAddress`·`entranceMethod`·`entranceNote` 도 준다(주소가 있으면 보이면 된다). 열리는 때에 FAILURE_REPORTED(받기 전 실패 등록 중)도 더함.
        2026-11-16 사용자 "원래 고객의 전화는 회수 라이더에게 보여야 해". 회수 배송(purpose MISDELIVERY_RECOVERY)에 배정된 라이더 본인만(아니면 404 — 있는지 알리지 않음, 직원 토큰 403).
        열리는 때: ASSIGNED·RETURN_PICKED_UP(회수 진행 중). 반납 뒤·취소는 409 RECOVERY_CONTACT_CLOSED, 회수 배송이 아니면 409 NOT_RECOVERY.
        **전화번호만** 준다(원래 고객 주소·출입 정보는 주지 않는다). 원천은 order 주문 당시 사본(O-5) — 저장·로그하지 않는다(`Cache-Control: no-store`). 사본 없음 404 DROP_INFO_NOT_FOUND, order 장애 503.
      x-added-in: '2026-11-16'
      operationId: getRecoveryContact
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
