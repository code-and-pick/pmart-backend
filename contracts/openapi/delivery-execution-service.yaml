          description: |
            (직원용만, 2026-11-18 — 사용자 "접속 시간 따로 더함") 접속 시간 = 운행(ON_DUTY)을 켜 둔 시간 합(rider 운행 구간). 운행시간(totalSeconds — 수락 ~ 완료)과 다르다.
            rider 를 못 부르면 null. 라이더 본인 조회(/riders/me/operating-time)에는 없음.
        waitingSeconds:
          type: [integer, 'null']
          format: int64
          x-added-in: '2026-11-18'
          description: (직원용만) 대기 시간 = 운행 중 + 신규배차 켬 + 맡은 배송 0건인 시간 합(사용자 2026-11-18). 배송을 맡은 동안 = 배정 ~ 끝(완료·실패·취소, 진행 중이면 지금).
