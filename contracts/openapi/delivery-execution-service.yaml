openapi: 3.1.0
info:
  title: delivery-execution-service
  version: 0.17.0
  description: |
    배송 수행 상태(배정→가게 도착→픽업 완료(인계 확정 후)→고객 도착→전달 완료 / 실패 / 중단 / 회수 중→점포 반납), 전달 증빙(대면/비대면 사진 필수), 상태 정정, 도움요청, 회수 수행, 수행료 근거·정산 상태, 라이더 배송 이력의 정본. (docs/architecture/service-map.md §7)
    0.2.0(2026-11-13, PR #8 H2 — 픽업한 배송은 전달 완료까지 진행 중): 배정 사건 구독 → 가게 도착 → 픽업 완료(모든 포장 PackageHandedOver, DE-1) → 고객 도착 → 증빙 사진 올리기 → 전달 완료(DeliveryCompleted). 상태 조회·내 배송.
    0.3.0(2026-11-13, 사용자 결정): 전달 실패 = 라이더 등록(FAILURE_REPORTED — 아직 진행 중) → 운영자 확정(FAILED, DeliveryFailed — 배송 종료, 이어지는 회수 배차는 새 배송) 또는 반려(원래 상태로). 도움요청 = 이 서비스에 기록 + DeliveryIncidentRaised(case-service 가 받아 지원센터 사건으로 — 구현 전, caseId 는 그때부터). 수행료 = 수락 당시 금액(dispatch DeliveryAssigned.fee) → 완료 5시간 뒤 확정·지급 예정일 3영업일, 실패·취소는 산정 불가(calculable false). 회수·정정은 아직 501.
    0.4.0(2026-11-15, 백오피스 고객센터·라이더 운영 — 요청서 service-requests/delivery-backoffice-staff-apis.md BOD-1·4·5): 직원 배송 찾기(GET /deliveries — 주문 ID·라이더·상태, 전달 실패 대기는 state=FAILURE_REPORTED), 도움요청 대기 목록(GET /delivery-help-requests), 도움요청 처리함 닫기(…/resolutions — 지원센터 사건함(case R-4)이 생기면 그 사건이 정본). 역할 RIDER_OPS 를 운영자 조회·결정에 더함.
    0.14.0(2026-11-17, 라이더 앱 요청 §13 — 사용자 "실패 등록이 대화도 열기"): 전달 실패 등록이 같은 ID 의 도움요청(DELIVERY_FAILURE 대화)을 함께 연다(응답 resultId). 라이더 전달 재개 요청 `POST …/failures/resume-requests` — 실패 기록 resumeRequestedAt·대화 메시지, 직원 배송 목록·조회에 표시.
    0.13.0(2026-11-17, 산정 불가 수행료 조정 — 사용자 결정 "라이더 운영·관리자", "귀책에 따라 지급/미지급, 지급이면 거리별 금액", "바로 확정·조정일 + 3영업일"): `GET /rider-earnings/adjustment-queue`·`POST /rider-earnings/{earningId}/adjustments`. RiderEarningRecorded 에 `adjustment`(결과만). 라이더 탈퇴의 EARNING_ADJUSTMENT_PENDING 은 조정 전 산정 불가 전부.
    0.11.0(2026-11-17, 라이더 앱 기록 화면 — 원문 §8.1): **내 운행시간** `GET /riders/me/operating-time`(사용자 결정 "배차 수락하고 전달완료까지", 겹치면 한 번, 날짜별). 배송 조회·내 배달 내역에 `orderNumber`·`mfcName`(배정 때 dispatch 가 실어 줌). 고객 연락 방법에 PHONE_CALL·SMS(고객 전화번호 그대로 — 안심번호 없음).
    0.10.1(2026-11-17, DD-3 맞춤): 배송 조회에 `claimId`·`returnLines`(받을 줄·수량 — 라이더에게 회수 품목). ReturnPickedUp·ReturnDelivered lines 에 claim 이 실은 claimLineId·sku 를 그대로.
    0.10.0(2026-11-17, CL-1 배송 쪽 — 사용자 결정 "바로 배차·일반 표(고객 집 → MFC)·실패마다 알림, 다시 시도는 반품 쪽·고객 사정 실패도 수락 당시 금액"): **고객 반품 회수 수행**. 회수 배송(type RETURN, purpose CLAIM_RETURN — DeliveryCreated claimId·returnLines): 배정 → 전달지(= 회수지, 고객 집 — 받기 전에도) → 사진·받음(`returns/pickups`, lines = claim 요청 줄) → MFC 반납(`returns/store-deliveries`, ReturnDelivered claimId, 수행료 수락 당시 금액). 받기 전 실패 등록 → 확정이면 FAILED + `ReturnPickupFailed`(customerReason·contactAttempts 횟수 — 다시 보낼지는 claim). 일반 배송 단계는 409.
    0.5.0(2026-11-16, DD-2 오배송 회수 — 사용자 "추천대로"): 회수 배송(type RETURN, purpose MISDELIVERY_RECOVERY — dispatch 가 case MisdeliveryConfirmed 로 만든다)의 수행.
      배정(ASSIGNED) → 회수지에서 회수품 사진 올리기 → 회수(`returns/pickups` → RETURN_PICKED_UP, ReturnPickedUp) → MFC 도착 = 반납(`returns/store-deliveries` → RETURNED_TO_STORE, ReturnDelivered, 수행료).
      MFC 점원 수령 확인(mfc-inbound)이 생기기 전까지는 MFC 도착을 반납으로 본다. 회수 배송에서 일반 배송 단계(가게 도착·픽업·고객 도착·전달 완료·실패 등록)는 409, 전달지(drop-info)는 409 NO_CUSTOMER_DROP(원래 고객 정보를 열지 않는다).
      회수 라이더가 찾아갈 곳: 좌표는 dispatch `GET /deliveries/{id}/dispatch` 의 recovery.pickup, 원래 배송의 완료 증빙(놓은 곳·사진 참조)은 이 서비스 `GET /deliveries/{id}` 의 recoveryOrigin. 고객 반품 회수(CLAIM_RETURN)는 아직 없다.
      ADR-0065(2026-11-16, 고객 잘못 다시 배송 purpose MISDELIVERY_REDELIVERY): 배정 → 잘못 둔 곳에서 사진 → `returns/pickups`(PICKED_UP, ReturnPickedUp purpose) → 고객 도착 → 사진 → 전달 완료(DeliveryCompleted purpose — lines 는 원래 배송 줄, order 는 수량을 다시 세지 않음). 가게 도착·MFC 픽업·반납 단계는 쓰지 않는다. 전달지는 실제 집 주소 + 주문 당시 수령인·연락처·출입. 원래 배송 사진 보기도 된다.
      같은 날(사용자 "원래 고객의 전화는 회수 라이더에게 보여야 해", "사진보기 기능 넣어"): 원래 고객 전화번호 `GET /deliveries/{id}/recovery-contact`(회수 라이더 — 전화만, 주소는 주지 않는다), 증빙 사진 보기 `GET /deliveries/{id}/evidence-photos/{photoRef}`(원본 이미지 — 배정 라이더·회수 라이더·운영자).
    배정(dispatch), 인계 fence·재고(mfc), 주문 완료 판단(order), 환불(claim/payment), 위치(tracking)는 소유하지 않는다.
    시간 경과 자동완료 없음 [확정]. 주류 전달은 PG 인증 통합이므로 현장 신분증 절차 없음 [확정]. GPS·버튼만으로 픽업 확정 금지(PackageHandedOver 근거 필요).
    완료 후 사고 신고는 기존 완료를 유지하고 사건을 별도로 올린다. 지급 실행은 외부 회계.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: execution, description: 라이더 상태 전이 (라이더 앱) }
  - { name: returns, description: 회수 수행 }
  - { name: me, description: 라이더 본인 이력·수행료 }
  - { name: internal, description: 운영자 정정 (승인 필요) }
  - { name: staff, description: 직원(백오피스 고객센터·라이더 운영) 목록·처리 (0.4.0) }

paths:
  /deliveries/{deliveryId}:
    get:
      tags: [execution]
      summary: 배송 수행 상태 조회 (라이더·점원·운영자)
      description: 배정 라이더 본인, 그 센터 운영자·OPERATOR_ADMIN·CS_AGENT·RIDER_OPS(0.4.0), 서비스. 볼 수 없으면 404.
      operationId: getDeliveryExecution
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryExecution' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /deliveries/{deliveryId}/drop-info:
    get:
      tags: [execution]
      summary: 라이더용 전달지 (픽업 뒤 ~ 전달 완료 전, 배정 라이더 본인 — 클라이언트 BR-24)
      description: |
        주소·상세주소·우편번호·수령인·**고객 전화번호**(안심번호 아님 — 사용자 결정 2026-11-14)·출입 방법·출입 메모·배송 요청사항·지도 핀. 원천은 order 주문 당시 사본(O-5) — 이 서비스는 저장·로그하지 않는다(매번 order 에서 읽음, `Cache-Control: no-store`).
        열리는 때: 상태 PICKED_UP·ARRIVED_AT_CUSTOMER·FAILURE_REPORTED(아직 진행 중). 그 전(픽업 전)·뒤(전달 완료·실패 확정·취소)는 409 DROP_INFO_CLOSED. 배정 라이더가 아니면 404(있는지 알리지 않음).
        주문 당시 사본이 없는 주문(2026-11-02 이전)은 404 DROP_INFO_NOT_FOUND. order 를 못 부르면 503.
        오배송 회수 배송(purpose MISDELIVERY_RECOVERY, 0.5.0)은 409 NO_CUSTOMER_DROP — 원래 고객 주소는 열지 않는다. 원래 고객 전화번호는 `recovery-contact` 로.
        고객 반품 회수(CLAIM_RETURN, 0.10.0 — 2026-11-17)는 회수지 = 고객 집이라 **배정(ASSIGNED)·실패 등록(FAILURE_REPORTED) 동안** 연다(받은 뒤 RETURN_PICKED_UP 부터 409).
      x-added-in: '2026-11-14'
      operationId: getDeliveryDropInfo
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DropInfo' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /deliveries/{deliveryId}/store-arrivals:
    post:
      tags: [execution]
      summary: 가게 도착 (ASSIGNED → ARRIVED_AT_STORE)
      operationId: reportStoreArrival
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /deliveries/{deliveryId}/pickups:
    post:
      tags: [execution]
      summary: 픽업 완료 (ARRIVED_AT_STORE → PICKED_UP; 인계 확정 handoverIds 필수)
      description: |
        mfc-fulfillment의 CommitPackageHandover로 발급된 handoverId(=PackageHandedOver)가 배송의 모든 포장에 대해 확인되어야 한다.
        미확인 포장이 있으면 422 HANDOVER_NOT_CONFIRMED. QR 스캔·GPS·버튼만으로 픽업 처리하지 않는다(ADR-0006).
      operationId: reportPickup
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TransitionRequest'
                - type: object
                  required: [handoverIds]
                  properties:
                    handoverIds: { type: array, minItems: 1, items: { type: string } }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: HANDOVER_NOT_CONFIRMED (일부 포장 인계 미확정) / HANDOVER_RIDER_MISMATCH
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /deliveries/{deliveryId}/customer-arrivals:
    post:
      tags: [execution]
      summary: 고객 도착 (PICKED_UP → ARRIVED_AT_CUSTOMER)
      operationId: reportCustomerArrival
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /deliveries/{deliveryId}/evidence-photos:
    post:
      tags: [execution]
      summary: 전달 증빙 사진 올리기 (전달 완료 전, 배정 라이더 본인)
      description: |
        원문 §6.2 — 사진 업로드 성공 → 전달 완료. 별도 파일 서비스가 없어 이 서비스가 비공개 S3 호환 저장소(ADR-0016)에 둔다.
        JPEG·PNG·WEBP(파일 앞부분으로 판정), 10MB 이하. 고객 도착(ARRIVED_AT_CUSTOMER) 또는 픽업 완료(PICKED_UP) 상태에서만.
        회수 배송(RETURN, 0.5.0)은 배정(ASSIGNED)·회수(RETURN_PICKED_UP) 상태 — 회수품을 받은 곳에서 찍어 returns/pickups evidenceRefs 에 넣는다.
        돌려준 photoRef 를 전달 완료 evidence.photoRefs 에 넣는다. 사진에 다른 고객·신분증·출입 비밀번호가 보이지 않게 찍는 것은 라이더 앱 안내.
      operationId: uploadEvidencePhoto
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 저장
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePhoto' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: PHOTO_INVALID (형식·크기)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /deliveries/{deliveryId}/completions:
    post:
      tags: [execution]
      summary: 전달 완료 (ARRIVED_AT_CUSTOMER → COMPLETED; 증빙 사진 필수)
      description: |
        대면(FACE)·비대면(CONTACTLESS) 모두 사진 업로드 성공 후에만 완료 가능. 업로드 실패 시 재시도 또는 지원센터 대체 증빙(substituteEvidenceCaseId).
        시간 경과 자동완료는 없다. 주류 포함 배송도 현장 신분증 절차 없음(PG 인증 통합).
        완료 시 DeliveryCompleted(배송 단위, 증빙 참조) 발행 → order 완료 집계·review 자격·claim 기한 기산.
      operationId: reportCompletion
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletionRequest' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: EVIDENCE_REQUIRED (사진 참조 없음·업로드 미완료) / EVIDENCE_INVALID
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /deliveries/{deliveryId}/failures:
    post:
      tags: [execution]
      summary: 전달 실패 (고객 부재·주소 오류·연락 두절 등; 자동 환불 없음)
      description: |
        실패 후 처리(고객 연락·보관·회수)는 case-service 판단. 재배송은 교환 승인 건만.
        **지원센터 대화(0.14.0, 2026-11-17 라이더 앱 요청 §13 — 사용자 "실패 등록이 대화도 열기")**: 등록하면 같은 ID(= Idempotency-Key)의 도움요청(category DELIVERY_FAILURE)이 함께 열린다 —
        응답 `resultId` 가 그 도움요청 ID, 대화는 `…/help-requests/{resultId}/messages`. 앱은 도움요청을 따로 보내지 않는다(사건함에도 한 건). 고객과 다시 연락되면 `…/failures/resume-requests`.
        **고객 반품 회수(CLAIM_RETURN, 0.10.0 — 2026-11-17 사용자 "실패마다 알림, 다시 시도는 반품 쪽")**: 고객에게서 받기 전(ASSIGNED)에만 — 같은 증빙 규칙(사진 + 고객 사유면 연락 2회).
        지원센터·관리자가 확정(`failure-decisions` CONFIRM)하면 FAILED + `ReturnPickupFailed`(DeliveryFailed 아님 — 상품은 고객에게 그대로). 수행료: 고객 사유(부재·연락 두절·주소 오류·거부)면 수락 당시 금액(사용자 "수락 당시 금액 지급"), 그 밖은 산정 불가(지원센터 조정). 받은 뒤 문제는 도움요청.
      operationId: reportFailure
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TransitionRequest'
                - type: object
                  required: [reason, evidenceRefs]
                  properties:
                    reason: { type: string, enum: [CUSTOMER_ABSENT, ADDRESS_ERROR, UNREACHABLE, REFUSED, DAMAGED, RIDER_INCIDENT, OTHER] }
                    detail: { type: string, maxLength: 500 }
                    evidenceRefs: { type: array, minItems: 1, items: { type: string }, description: 이 배송에 같은 라이더가 올린 사진 photoRef(POST …/evidence-photos) }
                    goodsLocation: { type: string, enum: [WITH_RIDER, RETURNED_TO_STORE, LEFT_AT_DOOR, UNKNOWN] }
                    contactAttempts:
                      type: array
                      description: 고객 연락 기록. 고객 사유(CUSTOMER_ABSENT·UNREACHABLE·ADDRESS_ERROR·REFUSED)는 2회 이상 필수(원문 §9.2 "연락 시도 2회 이상")
                      items:
                        type: object
                        required: [attemptedAt, result]
                        properties:
                          attemptedAt: { type: string, format: date-time }
                          method: { type: string, enum: [SAFE_NUMBER_CALL, APP_MESSAGE, PHONE_CALL, SMS], description: 'PHONE_CALL·SMS(0.11.0, 2026-11-17) — 고객 전화번호 그대로 걸기·문자(안심번호 없음 — 사용자 2026-11-14)' }
                          result: { type: string, enum: [ANSWERED, NO_ANSWER, FAILED] }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: EVIDENCE_REQUIRED(사진 없음·남의 사진) / CONTACT_ATTEMPTS_REQUIRED(고객 사유인데 연락 2회 미만)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /deliveries/{deliveryId}/failures/resume-requests:
    post:
      tags: [execution]
      summary: 전달 재개 요청 — 전달 불가를 알린 뒤 고객과 다시 연락됨 (0.14.0)
      x-added-in: '2026-11-17'
      description: |
        라이더 앱 요청 §13-3(사용자 결정 2026-11-17 "실패 등록이 대화도 열기" — 재개 요청을 구조화된 값으로). 배정 라이더 본인, FAILURE_REPORTED 일 때만(아니면 409).
        라이더가 직접 되돌리지 않는다 — 지원센터가 `failure-decisions` REJECT 해야 원래 단계로 돌아간다. 요청 시각을 실패 기록(`failure.resumeRequestedAt`)에 남겨
        운영자 전달 실패 대기 목록(`GET /deliveries?state=FAILURE_REPORTED` 의 `resumeRequestedAt`)·배송 조회에 보이고, 연결된 대화에 라이더 메시지("[전달 재개 요청] …" + note)를 남긴다.
        이미 요청했으면 그대로(처음 시각). 결과는 `GET /deliveries/{id}` 상태로 확인.
      operationId: requestFailureResume
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 300, description: 라이더 메모(선택 — 대화에 함께 남는다) }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /deliveries/{deliveryId}/failure-decisions:
    post:
      tags: [execution]
      summary: 전달 실패 확정·반려 (운영자 — 지원센터 화면 전까지 백오피스 권한자)
      description: |
        FAILURE_REPORTED 배송만. CONFIRM → FAILED + DeliveryFailed(배송 종료 — dispatch 는 CLOSED, 라이더 진행 중 수에서 빠짐). 이어지는 회수 배차는 새 배송.
        **2026-11-17(사용자 결정)**: custody RIDER(상품이 라이더 손)면 dispatch 가 반납 배송(type RETURN, purpose FAILED_DELIVERY_RETURN)을 만들어 **같은 라이더에게 제안 없이 바로 배정**한다(배송 조회 `failure.returnDeliveryId`, 내 배송 목록에 새 배송). 반납 배송은 받음 없이 배정(ASSIGNED)에서 바로 `returns/store-deliveries`(MFC 반납).
        수행료: 고객 사유(CUSTOMER_ABSENT·UNREACHABLE·ADDRESS_ERROR·REFUSED)면 실패한 배송 = 수락 당시 금액, 반납 배송 = 일반 표(고객 집 → MFC) 따로. 그 밖 사유는 둘 다 산정 불가 → 지원센터 조정(`/rider-earnings/{id}/adjustments`). custody STORE 면 라이더 할 일 없음(배송 FAILED 로 끝).
        REJECT → 실패 등록 전 상태로 되돌린다(라이더가 전달을 계속). 관리자만 — 그 센터의 MFC_SUPERVISOR·OPERATOR_ADMIN·CS_AGENT(0.3.1, 같은 센터 작업자는 403)·RIDER_OPS(0.4.0).
      operationId: decideFailure
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [CONFIRM, REJECT] }
                note: { type: string, maxLength: 500 }
                custody: { type: string, enum: [RIDER, STORE], description: 확정 때 상품이 있는 곳(없으면 라이더 등록 goodsLocation 으로 — RETURNED_TO_STORE 면 STORE, 그 밖 RIDER) }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /deliveries/{deliveryId}/help-requests:
    get:
      tags: [execution]
      summary: 배송별 도움요청 목록 (0.7.0 — 라이더 앱 요청 §10)
      x-added-in: '2026-11-16'
      description: |
        라이더는 이 배송에서 **본인이 보낸** 도움요청만(앱을 다시 켜도 보낸 요청이 남게 — pmart-clients 라이더 앱 요청 §10), 직원은 도움요청 조회와 같은 범위(그 센터 운영자·OPERATOR_ADMIN·CS_AGENT·RIDER_OPS).
        오래된 것부터. 항목은 단건 조회와 같은 모양(라이더에게 resolvedBy·resolutionNote 는 null). 볼 수 없는 배송이면 404.
      operationId: listHelpRequests
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HelpRequest' } }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    post:
      tags: [execution]
      summary: 도움요청 (→ case-service 지원센터)
      description: |
        이 서비스에 기록하고 DeliveryIncidentRaised(type HELP_REQUEST, category·단계·내용)를 낸다 — case-service 가 받아 지원센터 사건을 만든다(구현 전, 2026-11-13 사용자 결정 1번).
        사건 번호(caseId)는 case-service 가 생긴 뒤 연결된다(지금은 비어 있음). 배정 라이더 본인, 배정~실패 등록 단계에서.
      operationId: createHelpRequest
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { $ref: '#/components/schemas/HelpCategory' }
                detail: { type: string, maxLength: 500 }
                evidenceRefs: { type: array, maxItems: 10, items: { type: string } }
      responses:
        '202':
          description: 접수 (resultId = 도움요청 ID — requestId 와 같다. 사건 번호는 조회의 caseId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /deliveries/{deliveryId}/help-requests/{requestId}:
    get:
      tags: [execution]
      summary: 도움요청 상태 조회
      description: |
        요청한 라이더 본인, 그 센터 운영자·OPERATOR_ADMIN·CS_AGENT·RIDER_OPS(0.4.0). 볼 수 없으면 404.
        state 는 OPEN → 직원이 처리함으로 닫으면 RESOLVED(0.4.0, 사건함 전까지). IN_PROGRESS 는 사건함이 생긴 뒤.
        detail·evidenceRefs(0.4.0)는 단건에서만 준다. resolvedBy·resolutionNote 는 직원에게만(라이더에게는 null).
      operationId: getHelpRequest
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /deliveries/{deliveryId}/help-requests/{requestId}/messages:
    get:
      tags: [execution]
      summary: 도움요청 대화 — 라이더 ↔ 지원센터 상담원 메시지 목록 (0.6.0)
      x-added-in: '2026-11-16'
      description: |
        도움요청 한 건(= 사건함 RIDER_HELP 한 건)에 딸린 메시지(pmart-clients 라이더 앱 요청 §11-3, 2026-11-16 사용자 "라이더랑 얘기가 되어야").
        볼 수 있는 사람은 도움요청 조회와 같다(요청한 라이더 본인, 그 센터 운영자·OPERATOR_ADMIN·CS_AGENT·RIDER_OPS — 아니면 404).
        오래된 것부터. `after` = 마지막으로 받은 seq — 그보다 뒤 메시지만(앱 4초 확인용). 한 번에 200개까지.
        senderType RIDER·SUPPORT. 상담원 ID(senderId)는 직원에게만(라이더에게는 null — "지원센터"로 보인다).
      operationId: listHelpRequestMessages
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 }, description: 이 seq 뒤 메시지만 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HelpMessage' } }
                  helpState: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED], description: 도움요청 상태(RESOLVED 면 더 쓸 수 없다) }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    post:
      tags: [execution]
      summary: 도움요청 대화 — 메시지 보내기 (라이더 본인 / 지원센터 상담원, 0.6.0)
      x-added-in: '2026-11-16'
      description: |
        라이더: 도움요청을 보낸 본인만. photoRefs 는 이 배송에 본인이 올린 증빙 사진(`POST …/evidence-photos`)만(아니면 422 PHOTO_NOT_FOUND).
        직원(0.8.0 DE-2 — 접수 건 규칙): **지원센터 RIDER_OPS·OPERATOR_ADMIN 만**. 접수 건이 관리자 팀(ORDER_OPS)으로 넘어가면 OPERATOR_ADMIN 만. CS_AGENT 는 보기만, 센터 관리자(MFC_SUPERVISOR)는 답장 없음(403). 직원은 사진을 붙이지 않는다.
        처리된(RESOLVED) 도움요청에는 쓸 수 없다 — 409 HELP_REQUEST_CLOSED(사건함에서 다시 열면 OPEN 으로 돌아와 다시 쓸 수 있다).
        같은 Idempotency-Key·같은 본문 재전송은 같은 메시지. 내용은 로그에 남기지 않는다(개인정보를 적지 않도록 화면에서 안내).
      operationId: postHelpRequestMessage
      x-pmart-user-types: [RIDER, OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
                photoRefs: { type: array, maxItems: 5, items: { type: string } }
      responses:
        '201':
          description: 보냄
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpMessage' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: HELP_REQUEST_CLOSED / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: PHOTO_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /deliveries/{deliveryId}/help-requests/{requestId}/messages/{messageId}/maskings:
    post:
      tags: [staff]
      summary: 도움요청 대화 메시지 가림 (관리자 — 0.8.0 DE-2)
      x-added-in: '2026-11-17'
      description: |
        대화에 고객 전화번호·출입 비밀번호 같은 것이 적혔을 때 OPERATOR_ADMIN 이 사유(2~500자)와 함께 가린다(case 메모 가림과 같게, ADR-0062).
        글을 DB 에서 지우고(body null) 누가·언제·왜는 남긴다 — 라이더에게도 가려져 보인다(masked true). 사진 참조는 그대로. 이미 가렸으면 그대로 200.
        그 밖 직원·라이더 403, 볼 수 없는 도움요청·없는 메시지 404. 사유는 로그에 남기지 않는다.
      operationId: maskHelpRequestMessage
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
        - { name: messageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 2, maxLength: 500 }
      responses:
        '200':
          description: 가림(또는 이미 가려 있음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpMessage' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /deliveries/{deliveryId}/help-requests/{requestId}/resolutions:
    post:
      tags: [staff]
      summary: 도움요청 처리함으로 닫기 (0.4.0 — 지원센터 사건함 전까지, BOD-4)
      x-added-in: '2026-11-15'
      description: |
        지원센터 사건함(case R-4)이 없는 동안 직원이 도움요청을 처리했다고 닫는다 — OPEN·IN_PROGRESS → RESOLVED. 이미 RESOLVED 면 409 INVALID_STATE(같은 키·같은 본문 재전송은 같은 결과).
        **0.5.1(2026-11-16, DE-CASE)**: 사건함이 이 도움요청으로 사건을 열면(`CaseOpened` RIDER_HELP·DELIVERY_INCIDENT) 도움요청에 `caseId`·IN_PROGRESS, 사건을 닫으면(`CaseClosed`) RESOLVED(resolvedBy `case:<caseId>`, 메모 = 결과), 다시 열면(`CaseReopened`) IN_PROGRESS.
        사건이 붙은 도움요청은 여기서 닫지 않는다 — **409 HELP_REQUEST_HAS_CASE**(사건함에서 닫기). 사건이 없는 예전 도움요청만 이 경로로 닫는다.
        권한은 전달 실패 결정과 같다: 그 센터 MFC_SUPERVISOR, OPERATOR_ADMIN, CS_AGENT, RIDER_OPS(아니면 403, 없는 도움요청은 404).
        배송 상태·버전은 바꾸지 않고 사건도 내지 않는다(받는 쪽이 없다 — 라이더 앱은 조회로 본다). note 에는 개인정보를 적지 않는다(로그에 남기지 않음).
