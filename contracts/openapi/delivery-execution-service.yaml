        receiverPhone: { type: string, description: 고객 전화번호(안심번호 아님) }
        receiverName: { type: [string, 'null'], description: 'CLAIM_RETURN 만 — 받는 분(주문 당시)', x-added-in: '2026-11-17' }
        roadAddress: { type: [string, 'null'], description: 'CLAIM_RETURN 만 — 회수지(고객 집) 도로명주소', x-added-in: '2026-11-17' }
        detailAddress: { type: [string, 'null'], description: 'CLAIM_RETURN 만', x-added-in: '2026-11-17' }
        entranceMethod: { type: [string, 'null'], description: 'CLAIM_RETURN 만 — 출입 방법', x-added-in: '2026-11-17' }
        entranceNote: { type: [string, 'null'], description: 'CLAIM_RETURN 만 — 출입 메모', x-added-in: '2026-11-17' }
