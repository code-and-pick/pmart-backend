        FAILED → PAYMENT_FAILED(지급중·확정에서, failureReason 필수). 이미 PAID 인 줄은 그대로. 지급 예정일이 오늘(Asia/Seoul)보다 뒤면 PAYING·PAID 는 422 PAYOUT_NOT_DUE.
