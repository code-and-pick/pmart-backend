openapi: 3.1.0
info:
  title: product-content-service
  version: 0.8.0
  description: |
    0.8.0(2026-11-24, 사용자 "사진이 들어가는 곳 옆에 사진 규격 필요"·"가로 세로 크기나 비율이 필요한건데"·"저 대안대로 작업"): 상품 사진 규격 —
      대표(MAIN) 1:1 권장 1000×1000 이상, 상세 설명(DESCRIPTION)·상세정보 표(DETAIL) 가로 1000px 권장·세로 자유(고객 앱이 대표는 정사각형 칸,
      상세는 화면 폭에 맞춰 그림). **막지 않고 경고만** — 초안 `warnings`(MAIN_IMAGE_NOT_SQUARE ±10% 밖 · MAIN_IMAGE_SMALL · IMAGE_NARROW ·
      IMAGE_SIZE_UNKNOWN), 제출·일괄 등록은 그대로. 화면이 띄울 규격 `GET /content-drafts/image-specs`.
    0.7.0(2026-11-23, 검색·홈 목록 판매 가능 여부가 느림 — 사용자 "다 하면 될 것"): 카드 일괄 조회 `view=availability` 면 카드마다 `productId`·`options[{sku, availability}]` 만
    (이름·이미지·가격·평점·표시사항·search 없음 — 가격 조회·평점 집계를 하지 않는다). mfcId 와 같이 쓴다(없으면 availability 도 비어 있다). 쓰는 곳 search·storefront 목록 품절 판정.
    0.6.0(2026-11-23, 검색 영양·알레르기 — 사용자 "영양 넣어줘"·"알레르기도 넣어주는데 필터는 빼고 표시·검색만"): 콘텐츠에 표시사항 값 `nutrition`
    (100g 또는 100mL 기준 열량·나트륨·당류·단백질·지방 — 표시사항에서 읽은 값만, 모르는 칸은 null)과 `allergens`(함유 contains·같은 시설 제조 mayContain·
    원문 text — 법정 알레르기 유발물질 이름으로)를 둔다. 초안 입력(`ContentDraftInput`, seed-v1 content 블록 같은 이름)으로 받고 DISPLAY 승인으로 게시,
    상세·카드에 그대로. **값이 없으면 "모름"이다 — 없음(무첨가·알레르기 없음)이 아니다.** 지어내지 않는다.
    0.5.0(2026-11-22, 검색 products-v8 — 사용자 "원산지는 필터와 검색, 설명은 낮은 비중 검색, 영양은 넣지 않음"): 카드 일괄 조회
    `GET /product-contents?include=search` 면 카드마다 `search`(originType DOMESTIC·IMPORTED·null, originText, description)를 붙인다.
    원산지는 게시 콘텐츠 notices 의 "원산지:" 줄을 읽어 나눈다 — 적힌 원산지가 모두 국내면 DOMESTIC, 하나라도 외국이면 IMPORTED,
    그 밖(줄 없음·원양산만·판독 못 함)은 null(지어내지 않는다). 검색 색인(Logstash)용 — 앱 카드에는 include 없이 지금과 같다. 영양은 싣지 않는다.
    0.4.0(2026-11-20, 백오피스 PCT-1 CD-1·CD-2 — PC 2 요청 #274, 사용자 "진행해라"): 직원 `GET /content-drafts`(초안 목록 — state 여럿·productId 거르기, 최근 바뀐 것 먼저, 커서),
    `GET /content-drafts/counts`(같은 거르기 — state 제외 — 로 상태별 수, 모든 상태 0 까지, capped 늘 false).
    0.3.0(2026-11-19, 상품 상세 느림 — 사용자 "1 -> 해줘"): `GET /content-images/{imageId}?w=` 휴대폰용 축소본. `w` 는 240·480·720 중 하나,
    원본 비율 그대로 원본 폭보다 작을 때만 줄여 **JPEG** 로 준다(투명 배경은 흰색). 원본이 그 폭 이하이거나 줄일 수 없는 형식(WEBP 등)이면 원본 그대로.
    처음 요청 때 만들어 저장해 두고 다시 쓴다(내용 주소라 바뀌지 않음 — 긴 캐시, ETag `<sha256>-w<폭>`). `w` 없으면 지금처럼 원본. 응답 URL 은 그대로 — 앱이 붙인다.
    같은 0.3.0(클라이언트 BR-63 "햇양파 리뷰 480개가 홈·상세에 안 보임"): 상세·카드의 `rating`(RatingSummary)을 평점 집계와 같은 값으로 채운다(전에는 늘 비어 있었다).
    리뷰가 없으면 reviewCount 0·averageRating null.
    0.2.1(2026-11-19, 사용자 "리뷰에서 api 는 구현하고"): `GET /product-contents/{productId}/rating-summary` 구현(전에는 501) — review 사건
    (commerce.review.v1 `ReviewPublished`·`ReviewDeleted`)을 리뷰마다 사본으로 두고(버전 큰 것만, 삭제 반영) 조회 때 센다. **비회원도 본다**(security: [] — 상세와 같음).
    0.2.0(2026-11-19, 클라이언트 BR-19 "100g당 가격" — 사용자 "응"): 판매 옵션에 `netContent`(product 사본 — SKU 내용량 g·mL)와
    `unitPrice`(basis 100, unit G/ML, price = 기본가 × 100 ÷ 내용량, 원 단위 반올림). 내용량이나 가격이 없으면 둘 다(또는 unitPrice) 없다.
    할인가 기준 단위 가격은 앱이 netContent 로 같은 식을 쓴다(이 서비스는 할인을 모른다).
    고객용 상품명·사진·설명·보관/반품 안내·판매 옵션 해석과 평점·리뷰 수 집계 투영의 정본. (docs/architecture/service-map.md §1)
    비정본: 상품 정본·판매 상태(product), 리뷰 원문(review), 가격(pricing), 재고(각 inventory).
    구독: ProductVersionPublished, ReviewPublished/Deleted, ApprovalDecided(콘텐츠 승인 BO-05). 발행: ProductContentPublished.
    승인 변경은 5분 내 고객 노출 반영을 목표로 하며, 투영 지연은 projection-status로 드러낸다.
    임시 백오피스 등록(docs/architecture/product-registration-design.md): 콘텐츠 초안(개별·seed-v1 배치)과 이미지(S3 호환 저장소, ADR-0016)를
    받고, product-service 의 ProductVersionPublished.sources 로 상품에 연결한 뒤, DISPLAY 승인(ApprovalDecided)으로만 게시한다(ADR-0014).
    ProductContentPublished 는 상품 이벤트와 같은 토픽 commerce.product.v1(키 productId)로 낸다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: product-contents, description: 고객용 상품 상세 조회 }
  - { name: publications, description: 콘텐츠 게시 명령(승인 결과 참조) }
  - { name: internal, description: 서비스 간 조회(서비스 토큰) }
  - { name: registration, description: 임시 백오피스 콘텐츠 초안·이미지·배치·제출 준비(승인은 approval-service) }
  - { name: content-images, description: 상품 이미지 본문(비공개 버킷을 이 서비스가 대신 읽어 준다) }

paths:
  /product-contents/{productId}:
    get:
      tags: [product-contents]
      summary: 상품 상세 조회 (고객용 명칭·사진·설명·옵션·평점 집계)
      description: |
        판매 상태·가격·현재 PPC 가용은 각 정본의 사본이며 asOf를 함께 반환한다. 이 응답으로 구매 가능을 확정하지 않는다.
      operationId: getProductContent
      security: []   # 비회원 둘러보기(Commerce 비회원 조회 허용). 게시·발효된 것만 보인다
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: mfcId, in: query, description: 현재 쇼핑 주소의 담당 센터. 취급 여부 표시용, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductContent' }
        '404':
          description: NOT_FOUND / CONTENT_NOT_PUBLISHED (승인 콘텐츠 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /product-contents:
    get:
      tags: [product-contents]
      summary: 상품 카드 일괄 조회 (목록·장바구니·진열용, 최대 100건)
      operationId: listProductContents
      security: []   # 비회원 둘러보기(Commerce 비회원 조회 허용). 게시·발효된 것만 보인다
      parameters:
        - name: productIds
          in: query
          required: true
          style: form
          explode: false
          schema: { type: array, maxItems: 100, items: { type: string } }
        - { name: mfcId, in: query, description: 현재 쇼핑 주소의 담당 센터. 주면 옵션별 취급·가용(availability)을 채운다, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: include, in: query, x-added-in: '0.5.0', description: 'search 면 카드에 search(원산지·설명 — 검색 색인용)를 붙인다', schema: { type: string, enum: [search] } }
        - { name: view, in: query, x-added-in: '0.7.0', description: 'availability 면 productId·options[sku, availability] 만(가격·평점 조회 안 함 — 목록 품절 판정용)', schema: { type: string, enum: [availability] } }
      responses:
        '200':
          description: OK (미게시 상품은 items에서 제외하고 missing에 나열)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
                  missing: { type: array, items: { type: string } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /product-contents/{productId}/rating-summary:
    get:
      tags: [product-contents]
      summary: 평점·리뷰 수 집계 (review 이벤트 투영)
      description: |
        (0.2.1) 공개 리뷰(삭제 제외)의 개수·평균 별점(소수 첫째 자리 반올림)·별점별 개수. 리뷰가 없으면 reviewCount 0·averageRating 없음(0점으로 쓰지 않는다).
        리뷰 사본은 사건으로 채우므로 리뷰 등록 직후 몇 초 늦을 수 있다(asOf). 게시 콘텐츠가 없어도 리뷰 사본으로 센다.
      operationId: getRatingSummary
      security: []   # 비회원 둘러보기(상세와 같음, 2026-11-19)
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingSummary' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /product-contents/{productId}/publications:
    post:
      tags: [publications]
      summary: 콘텐츠 게시 (approval BO-05 승인 결과 참조)
      description: |
        승인된 콘텐츠 초안을 고객 노출 버전으로 게시한다. 반영 시 ProductContentPublished 발행.
        과거 주문의 상품 설명·규격은 덮어쓰지 않는다(order 스냅샷 별도).
      operationId: publishProductContent
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현(501), 승인 결과를 게시하는 운영 명령"
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalId, draftId]
              properties:
                approvalId: { type: string }
                draftId: { type: string, description: 승인된 콘텐츠 초안 ID }
                effectiveFrom: { type: string, format: date-time, description: 생략 시 즉시 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / DRAFT_NOT_FOUND / PRODUCT_VERSION_MISMATCH (초안이 참조한 product 버전이 현재와 다름)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /product-contents/{productId}/publications/{requestId}:
    get:
      tags: [publications]
      summary: 게시 요청 결과 조회
      operationId: getPublication
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현(501), 게시 명령의 짝 조회"
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  contentVersion: { type: integer }
                  publishedAt: { type: string, format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  # ---------- 등록(임시 백오피스, 운영자) ----------
  /content-drafts:
    post:
      tags: [registration]
      summary: 콘텐츠 초안 1건 (고객용 상품명·설명·안내·옵션)
      description: |
        seed-v1 product.json 의 content 블록과 같은 모양. sourceSystem·sourceKey 가 있으면 그 키의 열린 초안을 갱신(upsert)한다.
        productId 를 생략하면 같은 원천 키로 발행된 ProductVersionPublished.sources 를 받을 때(이미 받았으면 지금) 연결된다.
        이미지는 POST /content-drafts/{draftId}/images 로 따로 올린다.
      operationId: createContentDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentDraftInput' }
      responses:
        '201':
          description: 초안 생성(또는 원천 키의 열린 초안 갱신)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentDraft' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422':
          description: PRODUCT_NOT_FOUND (productId 가 아직 수신한 상품이 아님) / DRAFT_NOT_EDITABLE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

    get:
      tags: [registration]
      summary: 콘텐츠 초안 목록 (0.4.0 PCT-1 CD-1 — 백오피스 콘텐츠 조회)
      description: |
        작성 중·승인 대기·게시·반려 초안을 최근 바뀐 순(updatedAt·draftId 내림차순)으로. `state` 는 여러 번 줄 수 있다(?state=DRAFT&state=SUBMITTED).
        커서는 응답 `page.nextCursor` 그대로(틀리면 400). 권한은 초안 만들기와 같다(운영자).
      operationId: listContentDrafts
      x-pmart-user-types: [OPERATOR]
      parameters:
        - name: state
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [DRAFT, SUBMITTED, PUBLISHED, REJECTED] } }
        - { name: productId, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ContentDraftSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /content-drafts/counts:
    get:
      tags: [registration]
      summary: 콘텐츠 초안 상태별 수 (0.4.0 PCT-1 CD-2)
      description: 목록과 같은 거르기(productId, state 제외)로 상태별 수 — 모든 상태를 0 까지. 정확히 세므로 capped 는 늘 false.
      operationId: countContentDrafts
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: productId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusCounts' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /content-drafts/image-specs:
    get:
      tags: [registration]
      summary: 상품 사진 규격 (0.8.0)
      x-added-in: '2026-11-24'
      description: 화면이 사진 올리는 곳 옆에 띄울 규격. 초안 warnings 가 쓰는 값과 같다. 직원 토큰이면 누구나.
      operationId: getContentImageSpecs
      x-pmart-user-types: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [maxBytes, contentTypes, maxImagesPerDraft, items]
                properties:
                  maxBytes: { type: integer, format: int64, description: '한 장 최대 바이트(20MB — 넘으면 막음)' }
                  contentTypes: { type: array, items: { type: string } }
                  maxImagesPerDraft: { type: integer, description: '초안 1건 최대 장수(넘으면 막음)' }
                  items:
                    type: array
                    items:
                      type: object
                      required: [role, recommendedWidth]
                      properties:
                        role: { $ref: '#/components/schemas/ImageRole' }
                        ratioLabel: { type: [string, 'null'], description: '대표 "1:1" — 상세는 null(세로 자유)' }
                        ratioTolerance: { type: [number, 'null'] }
                        recommendedWidth: { type: integer }
                        recommendedHeight: { type: [integer, 'null'], description: '상세는 null(세로 자유)' }
                        maxCount: { type: [integer, 'null'], description: '대표 1장' }

  /content-drafts/{draftId}:
    get:
      tags: [registration]
      summary: 콘텐츠 초안 조회 (이미지·제출 가능 여부 포함)
      operationId: getContentDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentDraft' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    put:
      tags: [registration]
      summary: 콘텐츠 초안 수정 (제출 전 DRAFT 만, 이미지는 그대로)
      operationId: updateContentDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentDraftInput' }
      responses:
        '200':
          description: 수정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentDraft' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: DRAFT_NOT_EDITABLE / PRODUCT_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /content-drafts/{draftId}/images:
    post:
      tags: [registration]
      summary: 초안 이미지 업로드 (MAIN=대표, DESCRIPTION=상세설명, DETAIL=상세정보 표)
      description: |
        파일 본체는 S3 호환 저장소(비공개 버킷)에, DB 에는 키·메타만 둔다. 같은 (role, sortOrder) 자리에 다시 올리면 바꾼다.
        같은 내용(sha256)의 파일은 저장소에 다시 올리지 않는다. MAIN 은 1장(sortOrder 0). 허용 형식 JPEG·PNG·WebP(파일 앞부분으로 판정).
      operationId: uploadContentImage
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, role]
              properties:
                file: { type: string, format: binary }
                role: { $ref: '#/components/schemas/ImageRole' }
                sortOrder: { type: integer, minimum: 0, description: 같은 role 안의 순서(0부터). 생략 시 0 }
      responses:
        '201':
          description: 저장
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentImage' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '422':
          description: IMAGE_INVALID (형식·크기·자리) / DRAFT_NOT_EDITABLE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /content-drafts/{draftId}/submissions:
    post:
      tags: [registration]
      summary: 초안 1건 제출 준비 — 잠그고 DISPLAY 승인 요청 본문을 돌려준다
      description: |
        상품에 연결되고(productId) 상품명·대표 이미지가 있는 DRAFT 를 SUBMITTED 로 잠그고 draftHash 를 확정한다. 응답의 approvalRequest 를
        approval-service 에 그대로 보내면(POST /change-requests → /submissions) 승인자가 결정한다. 승인되면 ApprovalDecided 를 받아
        새 콘텐츠 버전을 게시하고 ProductContentPublished 를 발행한다. 승인 행의 draftHash 가 잠근 값과 다르면 APPROVAL_SCOPE_MISMATCH 로 반영하지 않는다.
      operationId: submitContentDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 잠금 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentSubmissionResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '422':
          description: PRODUCT_NOT_LINKED (상품 승인 전) / DRAFT_INVALID (상품명·대표 이미지 누락 등, details 에 사유) / DRAFT_NOT_EDITABLE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /content-import-batches:
    post:
      tags: [registration]
      summary: 콘텐츠 일괄 등록 — seed-v1 묶음(zip) 업로드
      description: |
        수집 저장소(code-and-pick/product-data) 형식 seed-v1. products/*/product.json 의 content 블록과 images/ 만 읽는다
        (product·skus 는 product-service 가 같은 묶음을 따로 받는다). (source.system, seedProductId) 로 초안을 갱신(upsert)하고,
        이미지 role 은 content.images[] 를 따르되 없으면 파일 이름(main.jpg=MAIN, description_NN.jpg=DESCRIPTION, info.jpg=DETAIL)으로 정한다.
        같은 묶음을 다시 올리면 초안·이미지가 늘지 않는다(바뀐 것이 없으면 UNCHANGED).
      operationId: uploadContentImportBatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: seed-v1.zip }
      responses:
        '201':
          description: 업로드 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentImportBatch' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '422':
          description: BUNDLE_INVALID / IMAGE_INVALID
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /content-import-batches/{batchId}:
    get:
      tags: [registration]
      summary: 배치 상태·상품별 결과
      operationId: getContentImportBatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentImportBatch' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /content-import-batches/{batchId}/submissions:
    post:
      tags: [registration]
      summary: 배치의 제출 가능한 초안을 잠그고 DISPLAY 승인 요청 본문(행 N개)을 돌려준다
      operationId: submitContentImportBatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 잠금 완료 (상품 미연결·누락이 있는 초안은 빠지고 excludedDraftIds 에 나열)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentSubmissionResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '422':
          description: NOTHING_TO_SUBMIT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /content-images/{imageId}:
    get:
      tags: [content-images]
      summary: 이미지 본문 (버킷이 비공개라 이 서비스가 대신 읽어 준다)
      description: |
        내용 주소(sha256) 기반이라 같은 imageId 의 본문은 바뀌지 않는다(긴 캐시, ETag=sha256). 게시된 이미지는 토큰 없이 읽는다(`<img src>` 가능). 초안 이미지는 운영자·서비스 토큰만.
      operationId: getContentImage
      security: []   # 비회원 둘러보기(Commerce 비회원 조회 허용). 게시·발효된 것만 보인다
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string } }
        - name: w
          in: query
          description: '(0.3.0) 축소본 폭(px) — 240·480·720. 원본 폭보다 작을 때만 줄인 JPEG, 아니면 원본. 그 밖의 값은 400 VALIDATION_FAILED. 권장 — 상세 설명·대표 720, 목록 카드 480'
          schema: { type: integer, enum: [240, 480, 720] }
      responses:
        '200':
          description: 이미지 바이트
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  # ---------- internal (서비스 토큰) ----------
  /internal/product-contents/{productId}/snapshot:
    get:
      tags: [internal]
      summary: '[order/cart→content] 주문 스냅샷용 표시 정보 (상품명·대표 이미지·옵션 라벨)'
      operationId: getContentSnapshotInternal
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: sku, in: query, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentSnapshot' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/product-contents/{productId}/projection-status:
    get:
      tags: [internal]
      summary: '[approval/bff→content] 승인 변경 반영 상태 (원승인 버전 vs 고객 노출 버전)'
      operationId: getProjectionStatusInternal
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  productId: { type: string }
                  exposedProductVersion: { type: integer, description: 현재 고객에게 노출 중인 product 버전 }
                  latestProductVersion: { type: integer, description: 수신한 최신 ProductVersionPublished 버전 }
                  contentVersion: { type: integer }
                  lag: { type: string, enum: [IN_SYNC, PENDING, DELAYED, FAILED] }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

components:
  schemas:
    Image:
      type: object
      properties:
        imageId: { type: string }
        url: { type: string, format: uri, description: '이미지 본문 경로 (상대 경로 /api/v1/content-images/{imageId})' }
        role: { type: string, enum: [MAIN, DETAIL, DESCRIPTION] }
        sortOrder: { type: integer }
    ImageRole:
      type: string
      description: MAIN=대표(카드), DESCRIPTION=상세설명(롱이미지 조각), DETAIL=상세정보 표
      enum: [MAIN, DESCRIPTION, DETAIL]
    ContentOption:
      type: object
      required: [label]
      properties:
        label: { type: string, maxLength: 100, example: 1팩(6입) }
        capacityLabel: { type: [string, 'null'], maxLength: 100, example: 500ml }
    ContentDraftInput:
      type: object
      description: seed-v1 product.json 의 content 블록 (+ 원천 키·상품 연결)
      properties:
        sourceSystem: { type: string, maxLength: 64, description: '외부 원천 (예: bmart-capture). 개별 입력은 생략' }
        sourceKey: { type: string, maxLength: 128, description: '원천 키 (seedProductId). sourceSystem 과 함께 upsert·상품 연결 기준' }
        productId: { type: string, maxLength: 40, description: 이미 승인된 상품에 붙일 때. 생략하면 원천 키로 연결 }
        name: { type: string, maxLength: 200, description: 고객용 상품명 (제출 시 필수) }
        description: { type: [string, 'null'], description: 상세설명 (seed 의 OCR 초안이면 검수 필요) }
        storageGuide: { type: [string, 'null'] }
        returnGuide: { type: [string, 'null'] }
        notices: { type: array, items: { type: string, maxLength: 500 }, description: '"항목: 값" 고시 정보' }
        options: { type: array, items: { $ref: '#/components/schemas/ContentOption' } }
        nutrition: { $ref: '#/components/schemas/Nutrition' }
        allergens: { $ref: '#/components/schemas/Allergens' }
    Nutrition:
      type: [object, 'null']
      description: '(0.6.0) 표시사항 영양정보를 100g(basisUnit G) 또는 100mL(ML) 기준으로 환산한 값. 표시에 없거나 "1g 미만"처럼 정확한 값이 아니면 그 칸은 null'
      required: [basisUnit]
      properties:
        basisUnit: { type: string, enum: [G, ML] }
        energyKcal: { type: [number, 'null'], minimum: 0 }
        sodiumMg: { type: [number, 'null'], minimum: 0 }
        sugarsG: { type: [number, 'null'], minimum: 0 }
        proteinG: { type: [number, 'null'], minimum: 0 }
        fatG: { type: [number, 'null'], minimum: 0 }
    Allergens:
      type: [object, 'null']
      description: '(0.6.0) 표시사항 알레르기 유발물질. 이름은 법정 표시 이름(알류·우유·메밀·땅콩·대두·밀·고등어·게·새우·돼지고기·복숭아·토마토·아황산류·호두·닭고기·쇠고기·오징어·조개류·잣). 비어 있거나 null 이면 모름 — 없다는 뜻이 아니다'
      properties:
        contains: { type: array, items: { type: string }, description: 함유 }
        mayContain: { type: array, items: { type: string }, description: '같은 제조시설에서 제조(혼입 가능) — 함유와 겹치지 않음' }
        text: { type: [string, 'null'], maxLength: 1000, description: 표시사항 원문 }
    ContentImage:
      type: object
      required: [imageId, role, sortOrder]
      properties:
        imageId: { type: string }
        role: { $ref: '#/components/schemas/ImageRole' }
        sortOrder: { type: integer }
        url: { type: string, description: '이미지 본문 경로 (/api/v1/content-images/{imageId})' }
        contentType: { type: string }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        bytes: { type: integer, format: int64 }
        sha256: { type: string }
    ContentDraftProblem:
      type: object
      required: [code]
      properties:
        code: { type: string, description: 'NAME_REQUIRED / MAIN_IMAGE_REQUIRED / PRODUCT_NOT_LINKED / APPROVAL_REJECTED / APPROVAL_SCOPE_MISMATCH' }
        field: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
    ContentDraft:
      type: object
      required: [draftId, state, version]
      properties:
        draftId: { type: string }
        sourceSystem: { type: [string, 'null'] }
        sourceKey: { type: [string, 'null'] }
        productId: { type: [string, 'null'], description: 연결된 상품 (상품 승인 후) }
        state: { type: string, enum: [DRAFT, SUBMITTED, PUBLISHED, REJECTED] }
        input: { $ref: '#/components/schemas/ContentDraftInput' }
        images: { type: array, items: { $ref: '#/components/schemas/ContentImage' } }
        problems: { type: array, items: { $ref: '#/components/schemas/ContentDraftProblem' }, description: 지금 제출하면 막히는 사유(DRAFT) 또는 반려 사유 }
        warnings: { type: array, x-added-in: '2026-11-24', items: { $ref: '#/components/schemas/ContentDraftProblem' }, description: '(0.8.0) 막지 않는 사진 규격 경고 — MAIN_IMAGE_NOT_SQUARE·MAIN_IMAGE_SMALL·IMAGE_NARROW·IMAGE_SIZE_UNKNOWN(field = images[역할:순서], detail = 지금 크기·권장)' }
        submittable: { type: boolean }
        draftHash: { type: [string, 'null'] }
        approvalId: { type: [string, 'null'] }
        contentVersion: { type: [integer, 'null'], description: 게시된 버전 (PUBLISHED) }
        registration:
          type: [string, 'null']
          enum: [NEW, UPDATE, null]
          description: |
            심사 전 초안(DRAFT·SUBMITTED)만. 연결 상품(productId) 또는 같은 원천 키(sourceSystem, sourceKey)에 이미 게시된 콘텐츠가
            있으면 UPDATE — 승인하면 그 상품의 새 contentVersion 으로 게시되어 고객에게 보이던 이름·이미지·설명을 대체한다. 없으면 NEW.
            게시·반려된 초안은 null. 승인 요청 행 attributes 에도 같은 값(registration, publishedContentVersion)이 실린다. (BR-44, 2026-11-04)
        publishedContentVersion: { type: [integer, 'null'], description: registration=UPDATE 일 때 지금 게시돼 있는 콘텐츠 버전 }
        publishedDraftId: { type: [string, 'null'], description: registration=UPDATE 일 때 지금 게시본을 만든 초안 }
        publishedAt: { type: [string, 'null'], format: date-time, description: registration=UPDATE 일 때 지금 게시본의 게시 시각 }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        updatedAt: { type: string, format: date-time }
    ContentDraftSummary:
      type: object
      x-added-in: '2026-11-20'
      required: [draftId, state, updatedAt, version]
      properties:
        draftId: { type: string }
        productId: { type: [string, 'null'] }
        state: { type: string, enum: [DRAFT, SUBMITTED, PUBLISHED, REJECTED] }
        name: { type: [string, 'null'], description: 고객용 상품명 }
        imageId: { type: [string, 'null'], description: '대표(MAIN 첫째) 이미지 — GET /content-images/{imageId}' }
        approvalId: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    StatusCounts:
      type: object
      x-added-in: '2026-11-20'
      description: 목록 상태별 수 — 웹 숫자 띠 공통 모양(case-service StatusCounts 와 같음)
      required: [counts, asOf]
      properties:
        counts:
          type: array
          items:
            type: object
            required: [key, count, capped]
            properties:
              key: { type: string, description: 초안 상태 값 }
              count: { type: integer, format: int64 }
              capped: { type: boolean, description: 셀 수 있는 상한을 넘었으면 true — 여기서는 늘 false }
        asOf: { type: string, format: date-time }
    ContentImportBatch:
      type: object
      required: [batchId, state, productCount]
      properties:
        batchId: { type: string }
        format: { type: string, enum: [SEED_V1] }
        sourceSystem: { type: string }
        state: { type: string, enum: [UPLOADED, SUBMITTED, PUBLISHED, PARTIALLY_PUBLISHED, REJECTED] }
        productCount: { type: integer }
        createdCount: { type: integer }
        updatedCount: { type: integer }
        unchangedCount: { type: integer }
        imageCount: { type: integer, description: 묶음의 이미지 수 }
        uploadedImageCount: { type: integer, description: 저장소에 새로 올린 이미지 수 (같은 sha256 은 다시 올리지 않음) }
        pendingSubmission:
          description: '제출 뒤 승인 대기(SUBMITTED) 동안만. 제출 응답과 같은 본문을 잠긴 행으로 다시 만든다 — 화면을 떠났다 와도 승인 요청을 이어서 올릴 수 있게(BR-41, 2026-11-03). 승인 ID 는 approval-service GET /approvals?targetRef=… (targetRef contentImportBatch:{batchId})'
          allOf: [{ $ref: '#/components/schemas/ContentSubmissionResult' }]
        items:
          type: array
          items:
            type: object
            properties:
              sourceKey: { type: string }
              draftId: { type: string }
              outcome: { type: string, enum: [CREATED, UPDATED, UNCHANGED, LOCKED] }
              draft: { $ref: '#/components/schemas/ContentDraft' }
        createdAt: { type: string, format: date-time }
    ContentApprovalRequestBody:
      type: object
      description: approval-service ChangeRequestBody 와 같은 모양. 그대로 POST /change-requests 본문으로 쓴다.
      required: [type, targetService, targetRef, allowedActions, summary]
      properties:
        type: { type: string, enum: [DISPLAY] }
        targetService: { type: string, enum: [product-content-service] }
        targetRef: { type: string, description: 'contentDraft:{draftId} / contentImportBatch:{batchId}' }
        allowedActions: { type: array, items: { type: string } }
        summary: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [lineKey]
            properties:
              lineKey: { type: string, description: draftId }
              targetRef: { type: string }
              attributes: { type: object, additionalProperties: true, description: 'draftId·draftHash·productId·name 등 잠근 값' }
    ContentSubmissionResult:
      type: object
      required: [submittedDraftIds, approvalRequest]
      properties:
        submittedDraftIds: { type: array, items: { type: string } }
        excludedDraftIds: { type: array, items: { type: string } }
        approvalRequest: { $ref: '#/components/schemas/ContentApprovalRequestBody' }
    SaleOption:
      type: object
      description: |
        고객 화면의 판매 옵션 해석. 실제 구매 단위는 sku. 콘텐츠에 옵션이 없고 상품 SKU 가 1개면 그 SKU 하나를 옵션으로 낸다(label 없음).
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        label: { type: string, example: 1팩(6입), description: 콘텐츠의 옵션 이름. 없을 수 있다 — 그때는 상품명만 보이면 된다(SKU 코드를 라벨로 쓰지 말 것) }
        unitType: { type: string, enum: [E, B] }
        unitsPerSku: { type: integer }
        capacityLabel: { type: string, example: 500ml }
        saleState: { type: string, description: product 사본 }
        netContent:
          type: object
          description: '0.2.0 — product 사본(SKU 내용량, 판매 단위 전체에 든 양). 상품이 내용량 없이 등록됐으면 없다(개수로 파는 상품 등)'
          required: [amount, unit]
          properties:
            amount: { type: integer, minimum: 1, description: 'g 또는 mL' }
            unit: { type: string, enum: [G, ML] }
        unitPrice:
          type: object
          description: |
            0.2.0 — 단위 가격(레퍼런스 카드 "100g당 999원"). price = round(basePrice × basis ÷ netContent.amount) 원 단위 반올림(0.5 올림).
            basePrice·netContent 가 둘 다 있을 때만. 할인가 기준이 필요하면 앱이 같은 식을 쓴다. 화면 문구는 "{basis}{g|mL}당 {price}원".
          required: [basis, unit, price]
          properties:
            basis: { type: integer, example: 100, description: 기준 양(지금은 늘 100) }
            unit: { type: string, enum: [G, ML] }
            price: { $ref: '_common.yaml#/components/schemas/Money' }
        price:
          type: object
          description: 'pricing 사본(0.1.2, 2026-11-19 BR-36 — 전에는 늘 null): 상세·카드를 읽을 때 pricing `GET /prices` 로 채운다. 가격 미설정 SKU 는 비어 있고, pricing 을 못 읽으면 비우고 상세 sources 에 pricing-service UNAVAILABLE(0원 아님). 견적 확정은 order 초안.'
          properties:
            basePrice: { $ref: '_common.yaml#/components/schemas/Money' }
            priceVersion: { type: integer }
        availability:
          type: object
          description: |
            요청 mfcId(담당 센터) 기준 mfc-inventory 취급·가용 사본. mfcId 를 주고 옵션에 sku 가 있을 때만 채운다. 구매·예약 보장이 아니다.
            carried=false 면 그 센터가 취급하지 않는다(state UNKNOWN). 취급하면 가용 0 이하 SOLD_OUT, 그 밖 AVAILABLE.
            재고 조회 실패는 carried 없음 + UNKNOWN(0 아님). LOW("N개 남음")는 노출 임계값이 운영 설정이라 아직 쓰지 않는다.
          properties:
            carried: { type: boolean }
            state: { type: string, enum: [AVAILABLE, LOW, SOLD_OUT, UNKNOWN] }
    ProductCard:
      type: object
      properties:
        productId: { type: string }
        name: { type: string, description: 고객용 상품명 }
        mainImage: { $ref: '#/components/schemas/Image' }
        rating: { $ref: '#/components/schemas/RatingSummary', description: '(0.3.0 BR-63) 평점 집계(rating-summary)와 같은 값 — 상세·카드 모두' }
        options: { type: array, items: { $ref: '#/components/schemas/SaleOption' } }
        contentVersion: { type: integer }
        nutrition: { $ref: '#/components/schemas/Nutrition' }
        allergens: { $ref: '#/components/schemas/Allergens' }
        search: { $ref: '#/components/schemas/CardSearchFields' }
    CardSearchFields:
      type: object
      description: '(0.5.0) include=search 일 때만 — 검색 색인용'
      required: [originType]
      properties:
        originType: { type: [string, 'null'], enum: [DOMESTIC, IMPORTED, null], description: '원산지가 모두 국내 DOMESTIC, 하나라도 외국 IMPORTED, 판단 못 하면 null' }
        originText: { type: [string, 'null'], description: '"원산지:" 줄의 값(앞머리 뺀 그대로)' }
        description: { type: [string, 'null'], description: 게시 콘텐츠 설명 }
    ProductContent:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          properties:
            productVersion: { type: integer, description: 이 콘텐츠가 참조하는 product 승인 버전 }
            description: { type: string }
            images: { type: array, items: { $ref: '#/components/schemas/Image' } }
            storageGuide: { type: string }
            returnGuide: { type: string }
            notices: { type: array, items: { type: string } }
            categoryPath: { type: array, items: { type: string }, description: 대표 노출 경로 }
            sources:
              type: array
              description: 사본 원천별 기준시각
              items:
                type: object
                properties:
                  system: { type: string }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    RatingSummary:
      type: object
      required: [productId, reviewCount]
      properties:
        productId: { type: string }
        averageRating: { type: [number, 'null'], minimum: 0, maximum: 5, description: '리뷰가 없으면 null(0점 아님)' }
        reviewCount: { type: integer, minimum: 0 }
        ratingCounts:
          type: object
          description: '0.2.1 — 별점별 개수(키 "1"~"5", 없는 별점은 0)'
          additionalProperties: { type: integer, minimum: 0 }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    ContentSnapshot:
      type: object
      properties:
        productId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        name: { type: string }
        optionLabel: { type: string }
        mainImageUrl: { type: string, format: uri }
        contentVersion: { type: integer }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
