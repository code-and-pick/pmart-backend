openapi: 3.1.0
info:
  title: approval-service
  version: 0.8.0
  description: |
    0.8.0(2026-11-28, ADR-0094 — 사용자 "운영자랑 고객 둘다 DB에"): `RAG_DOCUMENT` 정본에 `customer-assistant-service`(고객 RAG)를 더함, 문서 ID 에 `docs/business/customer-faq/<이름>.md`.
    0.7.0(2026-11-28, ADR-0092 — 사용자 "rag 문서를 백오피스에서 관리하고 수정"): 종류 `RAG_DOCUMENT`(정본 ai-assistant-service) — 형식은 ApprovalType 설명.
    0.6.0(2026-11-20, ADR-0082 쿠폰·기간 할인 — 사용자 결정): 종류 `PROMOTION`(정본 promotion-service). 승인자 역할 설정이 쉼표로 여럿이면 그중 하나(PROMOTION = MARKETING,OPERATOR_ADMIN).
    ChangeRequest(초안)·ApprovalDossier(승인 단위·원도메인 승인 ID 참조, 이중 발급 금지)·5축 상태·부분 집행·재심사 계보·통합 승인함(BO-10)·대량 변경(BO-26)·PolicyReference(BO-09)·ApplicationReceipt 의 정본. (docs/architecture/service-map.md §8, ADR-0004)
    비정본: 승인 결과의 업무 정본(product/pricing/replenishment/claim/quality/serviceability/auth/inventory/center-master), 사건(case-service).

    5축 상태
    - 요청: DRAFT / SUBMITTED / WITHDRAW_REQUESTED / WITHDRAWN
    - 심사: REVIEW_PENDING / EVIDENCE_REQUIRED / APPROVED / PARTIALLY_APPROVED / REJECTED / EXPIRED / SUPERSEDED
    - 실행: NOT_REQUESTED / VALIDATING / ACCEPTED / IN_PROGRESS / PARTIAL / APPLIED / REJECTED / UNKNOWN_RESULT
    - 전달: PENDING / DELIVERED / ACKNOWLEDGED / RETRY_PENDING / FAILED
    - 사건: caseId 연결 여부
    부분 집행 불변식: **승인량 = 누적 유효 집행 + 승인된 미집행 취소 + 열린 집행 잔량**.
    발효는 approval → ApprovalDecided(이벤트) → 정본 반영 → ApplicationReceipt 회신 순. approval 이 정본을 거쳐 3자를 동기 호출하지 않는다.
    승인 번호로 집행하는 정본(MFC — AP-1, 0.3.0): 정본이 명령에 실린 승인 번호(approvalRef)를 `/internal/approval-ref-checks` 로 확인하고 `/internal/approval-ref-uses` 로 한 번만 쓴다(같은 useRef 는 같은 결과).
    보는 사람이 결정할 수 있는지(AP-3, 0.4.0, 2026-11-18): 승인 상세·승인함 행에 `viewerCanDecide`·`viewerDecideBlockedReason` — 결정 API(`POST /approvals/{id}/decisions`)와 같은 검사(심사 중인지 → 자기 요청 → 승인 역할 설정 → 역할 → 자기 권한 요청)를 같은 순서로 하고, 첫 번째로 막힌 이유를 준다. 결정 종류(APPROVE·REJECT 지원 여부)·기대 버전은 판정에 넣지 않는다. 승인함은 `decidableByMe=true` 로 지금 결정할 수 있는 것만 거른다.
    검색 동의어(ADR-0073 단계 B, 0.5.0, 2026-11-20): 종류 `SEARCH_SYNONYM`(정본 search-service) — 형식은 ApprovalType 설명. 종류별 요청 역할 설정 `requester-roles.<종류>` 가 있으면 그 역할만 변경 요청을 만든다(아니면 403).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: change-requests, description: 변경 요청 초안·제출·철회 }
  - { name: approvals, description: 승인함·결정·재심사·반영 확인 }
  - { name: batch-changes, description: 대량 변경 BO-26 }
  - { name: policy-references, description: 정책 참조 레지스트리 BO-09 }
  - { name: internal, description: 정본 서비스의 반영 결과 회신·승인 번호 확인과 사용 }

paths:
  /change-requests:
    post:
      tags: [change-requests]
      summary: 변경 요청 초안 생성 (DRAFT; 승인 아님)
      operationId: createChangeRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRequestBody' }
      responses:
        '201':
          description: 생성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403':
          description: 그 종류의 요청 역할(requester-roles)이 없음 — 0.5.0
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /change-requests/{changeRequestId}:
    get:
      tags: [change-requests]
      summary: 변경 요청 조회
      operationId: getChangeRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: changeRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /change-requests/{changeRequestId}/submissions:
    post:
      tags: [change-requests]
      summary: 제출 (DRAFT→SUBMITTED, ApprovalDossier 생성, ChangeRequestSubmitted)
      description: 제출 시 승인 단위(종류·원객체/행·범위·예상 버전·허용 행위·수량/금액·조건·효력/만료)를 확정하고 approvalId 를 발급한다. 같은 원객체·종류의 열린 승인이 있으면 DUPLICATE_APPROVAL.
      operationId: submitChangeRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: changeRequestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      responses:
        '202':
          description: 제출됨 (resultId = approvalId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE / VERSION_CONFLICT / DUPLICATE_APPROVAL (이중 발급 금지)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: EVIDENCE_REQUIRED (종류별 필수 증빙 누락)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /change-requests/{changeRequestId}/withdrawals:
    post:
      tags: [change-requests]
      summary: 철회 (SUBMITTED→WITHDRAW_REQUESTED→WITHDRAWN; 집행 시작 후는 불가)
      operationId: withdrawChangeRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: changeRequestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: INVALID_STATE (실행 축 IN_PROGRESS 이후 → 취소 승인 별도 요청)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /approvals:
    get:
      tags: [approvals]
      summary: 통합 승인함 (BO-10; 종류·심사 상태·센터 범위·담당 필터)
      operationId: listApprovals
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ApprovalType' } }
        - { name: reviewState, in: query, schema: { $ref: '#/components/schemas/ReviewState' } }
        - { name: executionState, in: query, schema: { $ref: '#/components/schemas/ExecutionState' } }
        - { name: centerId, in: query, schema: { type: string } }
        - { name: assigneeId, in: query, schema: { type: string } }
        - { name: requesterId, in: query, schema: { type: string } }
        - { name: targetRef, in: query, description: '대상 참조와 정확히 일치(예 productImportBatch:{batchId}) — 정본 화면이 자기 대상의 승인을 찾을 때(BR-41, 2026-11-03)', schema: { type: string, maxLength: 128 } }
        - { name: decidableByMe, in: query, description: 'true 면 지금 토큰의 사람이 지금 결정할 수 있는 승인만(viewerCanDecide=true 와 같은 판정 — 심사 중·자기 요청 아님·승인 역할 보유·자기 권한 요청 아님). false·생략이면 거르지 않는다(AP-3, 2026-11-18)', schema: { type: boolean, default: false } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ApprovalSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /approvals/{approvalId}:
    get:
      tags: [approvals]
      summary: 승인 상세 (5축 상태·승인 단위·집행 누계·계보)
      operationId: getApproval
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /approvals/{approvalId}/decisions:
    post:
      tags: [approvals]
      summary: 심사 결정 (APPROVE / PARTIALLY_APPROVE / REJECT / REQUEST_EVIDENCE) → ApprovalDecided
      description: |
        승인자 권한·센터 범위·대행 기간·자기승인 분리는 auth-service 행위 시점 검증. 요청자 = 승인자이면 FORBIDDEN.
        PARTIALLY_APPROVE 는 lines 의 approvedQty/approvedAmount 로 승인량을 줄인다(요청량 초과 불가).
        효력은 effectiveFrom 부터. 결정 후 실행 축은 NOT_REQUESTED→VALIDATING 으로 넘어가고 정본의 Receipt 로 갱신된다.
      operationId: decideApproval
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '202':
          description: 결정 기록 (resultId = decisionId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403':
          description: FORBIDDEN (권한·범위·자기승인·대행 기간 외)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (REVIEW_PENDING/EVIDENCE_REQUIRED 아님) / VERSION_CONFLICT / STALE_VERSION (원객체 예상 버전 불일치)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: VALIDATION_FAILED (부분 승인량 > 요청량) / EVIDENCE_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /approvals/{approvalId}/decisions/{decisionId}:
    get:
      tags: [approvals]
      summary: 결정 조회
      operationId: getDecision
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string } }
        - { name: decisionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /approvals/{approvalId}/re-reviews:
    post:
      tags: [approvals]
      summary: 재심사 요청 (새 승인 버전 발급, 계보 유지; 기존은 SUPERSEDED)
      description: 집행된 수량은 되돌리지 않는다. 새 버전의 승인량은 기존 미집행 잔량 범위에서 조정 가능.
      operationId: requestReReview
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
                revisedLines: { type: array, items: { $ref: '#/components/schemas/ApprovalLine' } }
                evidenceRefs: { type: array, items: { type: string } }
      responses:
        '202':
          description: 새 승인 버전 (resultId = 새 approvalId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /approvals/{approvalId}/receipts:
    get:
      tags: [approvals]
      summary: 반영 확인 목록 (수신자별 ApplicationReceipt; 실행·전달 축 근거)
      operationId: listApplicationReceipts
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvalId: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/ApplicationReceipt' } }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/application-receipts:
    post:
      tags: [internal]
      summary: '[정본 서비스→approval] 반영 결과 회신 (APPLIED / PARTIAL / REJECTED / UNKNOWN_RESULT)'
      description: 이벤트(ProductVersionPublished 등)로도 수신하지만 동기 회신 경로를 함께 둔다. 같은 receiverService·approvalId·receiptSeq 재전송은 멱등.
      operationId: reportApplicationReceipt
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationReceiptRequest' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INVARIANT_VIOLATION (집행 누계 > 승인량)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/approval-ref-checks:
    post:
      tags: [internal]
      summary: '[MFC 정본→approval] 승인 번호(approvalRef) 확인 — 바꾸지 않음 (AP-1)'
      description: |
        명령에 실린 승인 번호가 이 집행에 쓸 수 있는 승인인지 본다. 상태를 바꾸지 않는다(화면 미리 확인·집행 전 검사).
        실제 집행은 `/internal/approval-ref-uses` 로 한 번만 쓴다 — 확인만으로 집행하지 않는다.
        결과는 늘 200: `usable` 이 false 면 `reason`(NOT_FOUND 포함). 판정 순서 = TYPE_MISMATCH → TARGET_MISMATCH → NOT_APPROVED → SELF_APPROVAL → ALREADY_USED(다른 useRef 가 이미 씀 — 같은 useRef 면 usable) → NOT_YET_EFFECTIVE → EXPIRED.
        Idempotency-Key 는 공통 헤더 검사(POST)가 요구해서 받을 뿐 쓰지 않는다 — 요청마다 아무 고유값.
      operationId: checkApprovalRef
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRefRequest' }
      responses:
        '200':
          description: 판정 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRefResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/approval-ref-uses:
    post:
      tags: [internal]
      summary: '[MFC 정본→approval] 승인 번호 한 번 사용 (useRef 멱등, AP-1)'
      description: |
        확인(approval-ref-checks 와 같은 판정)과 사용 기록을 한 트랜잭션에서 한다. 한 승인은 **한 번만** 쓴다.
        - `useRef` 가 업무 멱등 키다 — 정본이 자기 집행에서 결정적으로 만든다(예 `mfc-inventory-service:COUNT_ADJUSTMENT:CNT-…`). 같은 useRef 를 다시 보내면 같은 결과(usable, 처음 사용 기록), 다른 useRef 면 ALREADY_USED.
        - 쓸 수 없는 결과(usable=false)는 기록하지 않는다 — 승인이 난 뒤 같은 useRef 로 다시 보내면 다시 판정한다. 그래서 Idempotency-Key 응답 재생(request_record)을 쓰지 않는다 — 헤더는 공통 검사 때문에 받을 뿐이고 useRef 를 그대로 넣어도 된다.
        - 정본은 자기 변경을 확정하기 **전에** 부른다. 자기 변경이 실패해도 같은 집행의 재시도는 같은 useRef 라 통과한다.
      operationId: useApprovalRef
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRefRequest' }
      responses:
        '200':
          description: 판정·사용 결과 (usable=true 면 use 에 사용 기록)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRefResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /batch-changes:
    post:
      tags: [batch-changes]
      summary: 대량 변경 배치 등록 (BO-26; fileHash 고정·행별 멱등·결과 분리)
      description: 같은 fileHash 재등록은 기존 batchId 반환. 각 행은 rowKey 로 멱등하며 개별 ChangeRequest 로 전개된다.
      operationId: createBatchChange
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, fileHash, fileName, rows]
              properties:
                type: { $ref: '#/components/schemas/ApprovalType' }
                fileHash: { type: string, description: SHA-256 hex }
                fileName: { type: string }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [rowKey, payload]
                    properties:
                      rowKey: { type: string, description: 파일 내 유일 키 (행 멱등) }
                      targetRef: { type: string }
                      payload: { type: object, additionalProperties: true }
      responses:
        '201':
          description: 배치 생성 (resultId = batchId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /batch-changes/{batchId}:
    get:
      tags: [batch-changes]
      summary: 배치 조회 (집계)
      operationId: getBatchChange
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchChange' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /batch-changes/{batchId}/rows:
    get:
      tags: [batch-changes]
      summary: 배치 행별 결과 (BatchRowResultRecorded)
      operationId: listBatchChangeRows
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/BatchRowState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BatchRow' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /policy-references:
    get:
      tags: [policy-references]
      summary: 정책 참조 조회 (BO-09; 소유 서비스·정책 키·반영 상태)
      operationId: listPolicyReferences
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: ownerService, in: query, required: true, schema: { type: string } }
        - { name: policyKey, in: query, schema: { type: string } }
        - { name: applyState, in: query, schema: { type: string, enum: [APPROVED, PENDING_APPLY, APPLIED, FAILED, UNKNOWN] } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PolicyReference' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
    post:
      tags: [policy-references]
      summary: 정책 참조 등록 (원정책 ID·버전 연결; 계산 엔진 복제 없음, PolicyVersionApproved)
      operationId: registerPolicyReference
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerService, policyKey, policyVersion, approvalId]
              properties:
                ownerService: { type: string }
                policyKey: { type: string, description: 예 ORDER.MIN_ORDER_AMOUNT }
                policyId: { type: string, description: 소유 서비스의 정책 ID }
                policyVersion: { type: integer }
                approvalId: { type: string }
                effectiveFrom: { type: string, format: date-time }
                summary: { type: string, maxLength: 500 }
      responses:
        '201':
          description: 등록 (resultId = policyReferenceId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED (approvalId 가 APPROVED 아님)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  schemas:
    ApprovalType:
      type: string
      description: |
        승인 종류 → 정본 (service-map §8 approval-service 표).
        MFC 종류(AP-1, 0.3.0 — 승인 번호를 명령에 실어 정본이 확인·사용한다):
        - `MFC_STOCK_ADJUSTMENT` 재고 조정·폐기·정정·격리 해제의 본사 승인(Q-11: 한 건 손실 10만 원 이상 또는 한 SKU 20개 이상 — 기준 판정은 MFC 정본). 승인자 역할 설정 `approver-roles.MFC_STOCK_ADJUSTMENT`(INVENTORY_APPROVER).
        - `MFC_OPERATION_RESTRICTION` 운영 제한(BO-08) 해제(재개)의 본사 승인. 승인자 역할 `approver-roles.MFC_OPERATION_RESTRICTION`(OPERATOR_ADMIN).
        두 종류는 targetRef = `<mfcId>:<kind>:<ref>` 이고 kind 가 정본(targetService)을 정한다 — ChangeRequestBody.targetRef 참조.
        CDC 쪽 OPERATION_RESTRICTION·INVENTORY_ADJUSTMENT 등은 그대로 둔다(정본 cdc-*).
        `SEARCH_SYNONYM`(0.5.0, ADR-0073 — 2026-11-20): 검색 동의어 규칙 바꾸기. 정본 `search-service`, targetRef = `pmart-product-synonyms`, `allowedActions` = `[APPLY_SYNONYM_RULES]`(2026-11-20 확정 — 다른 값은 지금 검사하지 않지만 이 값으로 보낸다), `targetExpectedVersion` 필수(요청을 만들 때 본 규칙 버전 — search-service `GET /search/synonym-rules` 의 version. 승인 뒤 버전이 달라졌으면 반영하지 않고 회신 REJECTED·STALE_VERSION). 행 = 바꾸는 규칙(1~200개): `lineKey` = 규칙 ID(영문·숫자·`_.-` 1~64자, 겹치지 않음), `attributes.op` = `UPSERT`(넣기·고치기)·`DELETE`, UPSERT 는 `attributes.terms` = 같은 뜻 낱말 2~20개(각 1~30자, 쉼표·`=>`·`#` 없음, 겹치지 않음). 화면 표시용으로 `attributes.before`(바꾸기 전 낱말) 를 실어도 된다. 어긋나면 400 VALIDATION_FAILED. 요청 역할 `requester-roles.SEARCH_SYNONYM`(MD·OPERATOR_ADMIN — 아니면 403), 승인자 역할 `approver-roles.SEARCH_SYNONYM`(OPERATOR_ADMIN), 자기 승인 금지. 반영 회신은 search-service 가 `ApplicationReceiptRecorded` 로(전부 반영 APPLIED 아니면 REJECTED — 일부만 반영하지 않는다).
        `PROMOTION`(0.6.0, ADR-0082 — 2026-11-20): 기간 할인·쿠폰 행사의 발효·조기 종료. 정본 `promotion-service`, targetRef = 행사 ID, 행 attributes 에 잠근 `draftHash`. 요청 역할 `requester-roles.PROMOTION`(MARKETING·OPERATOR_ADMIN), 승인자 역할 `approver-roles.PROMOTION`(MARKETING,OPERATOR_ADMIN — 쉼표로 여럿 중 하나), 자기 승인 금지. 반영 회신은 promotion-service 가 `ApplicationReceiptRecorded` 로.
        `SUPPLY_BUSINESS`(0.4.1 뜻 — 클라이언트 code-names C7, 2026-11-18): SCM 공급 심사(BackOffice BO-18) — 센터 간 공급 요청(TRF)의 승인·부분 승인·반려. 지금 이 종류로 만들어지는 요청은 없다(SCM 공급 흐름 미구현).
        `RAG_DOCUMENT`(0.7.0, ADR-0092 — 2026-11-28): 운영자 RAG 문서 하나 바꾸기(새 문서·고치기·내리기). 정본 `ai-assistant-service`(운영자 RAG) 또는 `customer-assistant-service`(고객 RAG, 0.8.0 ADR-0094), targetRef = 초안 ID(`KDR-…` — ai-assistant `POST /assistant/knowledge-drafts` 응답의 `approvalRequest` 를 그대로 쓴다), `allowedActions` = `[APPLY_KNOWLEDGE_DOCUMENT]`, `targetExpectedVersion` 필수(초안의 기준 판, 새 문서 0 — 승인 뒤 지금 판이 다르면 반영하지 않고 회신 REJECTED·STALE_VERSION). 행 정확히 하나: `lineKey` = 문서 ID(`docs/rag/rag-docs/<영역>/<이름>.md`, 고객 FAQ `docs/business/customer-faq/<이름>.md`), `attributes.op` = `UPSERT`·`RETIRE`, `attributes.draftId` = targetRef, UPSERT 는 `attributes.contentSha256`(초안 본문 sha256 — 승인 뒤 초안을 고쳤으면 REJECTED·DRAFT_CHANGED). 어긋나면 400 VALIDATION_FAILED. 요청 역할 `requester-roles.RAG_DOCUMENT`(OPERATOR_ADMIN — 아니면 403), 승인자 역할 `approver-roles.RAG_DOCUMENT`(OPERATOR_ADMIN), 자기 승인 금지. 반영 회신은 ai-assistant-service 가 `ApplicationReceiptRecorded` 로(반영 = 새 판 저장 — 색인은 그 뒤 1분 주기).
      enum: [PRODUCT, PRICE, DISPLAY, CENTER_MASTER, SERVICEABILITY, INITIAL_STOCK, OPERATION_RESTRICTION, OPERATION_RESUME, POLICY, SUPPLY_BUSINESS, REFUND_CLAIM, QUALITY_RECALL, INVENTORY_ADJUSTMENT, INVENTORY_LOSS, GRANT, CENTER_CLOSURE, BATCH, MFC_STOCK_ADJUSTMENT, MFC_OPERATION_RESTRICTION, SEARCH_SYNONYM, PROMOTION, RAG_DOCUMENT]
    RequestState:
      type: string
      enum: [DRAFT, SUBMITTED, WITHDRAW_REQUESTED, WITHDRAWN]
    ReviewState:
      type: string
      enum: [REVIEW_PENDING, EVIDENCE_REQUIRED, APPROVED, PARTIALLY_APPROVED, REJECTED, EXPIRED, SUPERSEDED]
    ExecutionState:
      type: string
      enum: [NOT_REQUESTED, VALIDATING, ACCEPTED, IN_PROGRESS, PARTIAL, APPLIED, REJECTED, UNKNOWN_RESULT]
    DeliveryState:
      type: string
      enum: [PENDING, DELIVERED, ACKNOWLEDGED, RETRY_PENDING, FAILED]
    BatchRowState:
      type: string
      enum: [PENDING, VALID, INVALID, SUBMITTED, APPLIED, REJECTED, UNKNOWN_RESULT]
    ApprovalLine:
      type: object
      required: [lineKey]
      properties:
        lineKey: { type: string, description: 원객체 행 식별 (sku / orderLineId / locationCode 등). MFC_STOCK_ADJUSTMENT 는 sku }
        targetRef: { type: string }
        requestedQty: { type: integer, minimum: 0, description: 'MFC_STOCK_ADJUSTMENT 는 필수·1 이상 — 그 SKU 의 움직이는 수량(절대값, 증감 방향은 attributes.delta)' }
        approvedQty: { type: integer, minimum: 0 }
        requestedAmount:
          $ref: '_common.yaml#/components/schemas/Money'
          description: 'MFC_STOCK_ADJUSTMENT 는 추정 손실 금액(KRW, 단가 × 감소 수량). 단가를 모르면 생략하고 attributes.unpriced=true'
        approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        attributes:
          type: object
          additionalProperties: true
          description: |
            종류별 변경 내용 (before/after).
            MFC_STOCK_ADJUSTMENT 권장 항목: delta(정수, 음수 = 줄어듦), lotId, locationCode, unitPrice(KRW), priceVersion, unpriced(단가 미설정), productName, reason.
    ChangeRequestBody:
      type: object
      required: [type, targetService, targetRef, allowedActions, summary]
      properties:
        type: { $ref: '#/components/schemas/ApprovalType' }
        targetService: { type: string, description: 정본 서비스 }
        targetRef:
          type: string
          maxLength: 128
          description: |
            원객체 ID. MFC 종류는 `<mfcId>:<kind>:<ref>` (콜론·공백 없는 세 마디) 이고 kind 가 targetService 를 정한다:
            - MFC_STOCK_ADJUSTMENT: `COUNT_ADJUSTMENT`(실사 조정, ref = 실사 세션 ID)·`CORRECTION`(재고 정정, ref = 정정 참조) → mfc-inventory-service, `DISPOSAL`(폐기, ref = 폐기 요청 ID)·`QUALITY_RELEASE`(격리 해제, ref = 품질 판정·보류 ID) → mfc-quality-service
            - MFC_OPERATION_RESTRICTION: `RESTRICTION_LIFT`(운영 제한 해제, ref = 운영 제한 ID) → mfc-capacity-service
            어긋나면 400 VALIDATION_FAILED. MFC_STOCK_ADJUSTMENT 는 lines 1개 이상(lineKey = sku, requestedQty ≥ 1).
        targetExpectedVersion: { type: integer, description: 원객체 예상 버전 (STALE_VERSION 판정) }
        centerScope: { type: array, items: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        allowedActions: { type: array, minItems: 1, items: { type: string } }
        summary: { type: string, maxLength: 500 }
        lines: { type: array, items: { $ref: '#/components/schemas/ApprovalLine' } }
        conditions: { type: array, items: { type: string } }
        requestedEffectiveFrom: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        evidenceRefs: { type: array, items: { type: string } }
        caseId: { type: string }
    ChangeRequest:
      allOf:
        - $ref: '#/components/schemas/ChangeRequestBody'
        - type: object
          properties:
            changeRequestId: { type: string }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            requestState: { $ref: '#/components/schemas/RequestState' }
            requesterId: { type: string }
            approvalId: { type: [string, 'null'], description: 제출 후 발급 }
            createdAt: { type: string, format: date-time }
            submittedAt: { type: [string, 'null'], format: date-time }
    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, PARTIALLY_APPROVE, REJECT, REQUEST_EVIDENCE] }
        lines:
          type: array
          description: PARTIALLY_APPROVE 시 행별 approvedQty/approvedAmount
          items: { $ref: '#/components/schemas/ApprovalLine' }
        conditions: { type: array, items: { type: string } }
        effectiveFrom: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        comment: { type: string, maxLength: 1000 }
        requiredEvidence: { type: array, items: { type: string }, description: REQUEST_EVIDENCE 시 }
        delegationId: { type: string, description: 대행 승인 시 auth Delegation }
    Decision:
      allOf:
        - $ref: '#/components/schemas/DecisionRequest'
        - type: object
          properties:
            decisionId: { type: string }
            approvalId: { type: string }
            approverId: { type: string }
            decidedAt: { type: string, format: date-time }
    ApprovalSummary:
      type: object
      properties:
        approvalId: { type: string }
        changeRequestId: { type: string }
        type: { $ref: '#/components/schemas/ApprovalType' }
        targetService: { type: string }
        targetRef: { type: string }
        summary: { type: string }
        requesterId: { type: string }
        requestState: { $ref: '#/components/schemas/RequestState' }
        reviewState: { $ref: '#/components/schemas/ReviewState' }
        executionState: { $ref: '#/components/schemas/ExecutionState' }
        deliveryState: { $ref: '#/components/schemas/DeliveryState' }
        caseId: { type: [string, 'null'] }
        submittedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        viewerCanDecide: { type: boolean, description: '지금 토큰의 사람이 지금 이 승인을 결정(APPROVE·REJECT)할 수 있는지 — 결정 API 와 같은 검사(AP-3, 2026-11-18)' }
        viewerDecideBlockedReason: { $ref: '#/components/schemas/DecideBlockedReason' }
    DecideBlockedReason:
      type: string
      description: |
        viewerCanDecide=false 인 이유(true 면 생략·null). 결정 API 의 검사 순서대로 첫 번째로 막힌 것 하나(AP-3, 2026-11-18).
        NOT_PENDING 심사 중(REVIEW_PENDING) 아님 — 결정 API 409 INVALID_STATE ·
        SELF_APPROVAL 발의자 본인 — 403 FORBIDDEN ·
        CONFIG_REQUIRED 이 종류의 승인 역할(`pmart.approval.approver-roles.<종류>`)이 설정되지 않음 — CONFIG_REQUIRED ·
        NO_ROLE 이 종류의 승인 역할이 없음 — 403 FORBIDDEN ·
        GRANT_TO_SELF 자기에게 온 직원 권한 요청(GRANT 대상 = 본인) — 403 FORBIDDEN
      enum: [NOT_PENDING, SELF_APPROVAL, CONFIG_REQUIRED, NO_ROLE, GRANT_TO_SELF]
    Approval:
      allOf:
        - $ref: '#/components/schemas/ApprovalSummary'
        - type: object
          properties:
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            approvalVersion: { type: integer, description: 재심사마다 증가 }
            lineage:
              type: object
              properties:
                previousApprovalId: { type: [string, 'null'] }
                supersededByApprovalId: { type: [string, 'null'] }
            targetExpectedVersion: { type: integer }
            centerScope: { type: array, items: { type: string } }
            allowedActions: { type: array, items: { type: string } }
            lines: { type: array, items: { $ref: '#/components/schemas/ApprovalLine' } }
            conditions: { type: array, items: { type: string } }
            effectiveFrom: { type: [string, 'null'], format: date-time }
            execution:
              type: object
              description: 부분 집행 불변식 (승인량 = 누적 유효 집행 + 승인된 미집행 취소 + 열린 집행 잔량)
              properties:
                approvedQty: { type: integer }
                executedQty: { type: integer }
                cancelledUnexecutedQty: { type: integer }
                openRemainingQty: { type: integer }
                approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
                executedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
            decisions: { type: array, items: { $ref: '#/components/schemas/Decision' } }
            receipts: { type: array, items: { $ref: '#/components/schemas/ApplicationReceipt' } }
            evidenceRefs: { type: array, items: { type: string } }
    ApplicationReceiptRequest:
      type: object
      required: [approvalId, receiverService, receiptSeq, result]
      properties:
        approvalId: { type: string }
        receiverService: { type: string }
        receiptSeq: { type: integer, minimum: 1, description: 수신자별 회신 순번 (멱등) }
        result: { type: string, enum: [ACCEPTED, APPLIED, PARTIAL, REJECTED, UNKNOWN_RESULT] }
        appliedQty: { type: integer }
        appliedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        domainRef: { type: string, description: 정본 측 결과 ID (commitId / versionId / grantId) }
        domainVersion: { type: integer }
        reason: { type: string }
        occurredAt: { type: string, format: date-time }
        lines:
          type: array
          description: 행별 결과(ADR-0039). 회신 이벤트 ApplicationReceiptRecorded 의 lines 그대로
          items: { $ref: '#/components/schemas/ApplicationReceiptLine' }
    ApplicationReceiptLine:
      type: object
      required: [lineKey, result]
      properties:
        lineKey: { type: string }
        result: { type: string, enum: [APPLIED, REJECTED] }
        reasonCode: { type: [string, 'null'], description: '거절 사유 코드(정본 서비스 정의, 예: PRICE_SCHEDULE_CONFLICT)' }
        domainRef: { type: [string, 'null'] }
        domainVersion: { type: [integer, 'null'] }
    ApplicationReceipt:
      allOf:
        - $ref: '#/components/schemas/ApplicationReceiptRequest'
        - type: object
          properties:
            receiptId: { type: string }
            deliveryState: { $ref: '#/components/schemas/DeliveryState' }
            receivedAt: { type: string, format: date-time }
    ApprovalRefRequest:
      type: object
      required: [approvalId, type, targetService, targetRef]
      description: 승인 번호 확인·사용 요청 (AP-1). 정본이 자기 집행을 그대로 적는다 — 승인 단위와 한 글자라도 다르면 쓸 수 없다.
      properties:
        approvalId: { type: string, maxLength: 64, description: 명령에 실린 승인 번호(approvalRef) }
        type: { $ref: '#/components/schemas/ApprovalType' }
        targetService: { type: string, maxLength: 64, description: 집행하는 정본(자기 서비스 이름) }
        targetRef: { type: string, maxLength: 128, description: 집행 대상. MFC 종류는 `<mfcId>:<kind>:<ref>` }
        actorId: { type: string, maxLength: 128, description: 집행하는 운영자(토큰 sub). 승인자와 같으면 SELF_APPROVAL — 승인자와 실행자 분리 }
        useRef:
          type: string
          maxLength: 128
          description: 사용 멱등 키. approval-ref-uses 는 필수(없으면 400). 확인에도 넣으면 이 useRef 가 이미 쓴 승인을 usable 로 본다
    ApprovalRefReason:
      type: string
      description: |
        쓸 수 없는 이유. NOT_FOUND 없는 승인 · TYPE_MISMATCH 종류 다름 · TARGET_MISMATCH 정본·대상 다름 · NOT_APPROVED 승인(APPROVED) 아님(심사 중·반려 등) ·
        SELF_APPROVAL 집행자 = 승인자 · ALREADY_USED 다른 useRef 가 이미 씀 · NOT_YET_EFFECTIVE 효력 시작 전 · EXPIRED 만료
      enum: [NOT_FOUND, TYPE_MISMATCH, TARGET_MISMATCH, NOT_APPROVED, SELF_APPROVAL, ALREADY_USED, NOT_YET_EFFECTIVE, EXPIRED]
    ApprovalRefUse:
      type: object
      description: 사용 기록(한 승인에 하나)
      properties:
        useRef: { type: string }
        usedByService: { type: string, description: 쓴 호출자(X-Source-System, 자기 신고) }
        actorId: { type: string, description: 집행자(요청에 있었으면) }
        usedAt: { type: string, format: date-time }
    ApprovalRefResult:
      type: object
      required: [approvalId, usable]
      description: 판정 결과. 승인이 있으면(NOT_FOUND 아님) 승인 단위를 함께 준다 — 정본은 lines(SKU·수량)로 자기 집행이 승인 범위 안인지 본다. 값 없는 필드는 생략한다.
      properties:
        approvalId: { type: string }
        usable: { type: boolean, description: 'true = 이 집행에 쓸 수 있다(uses 는 이번에 또는 같은 useRef 로 이미 사용 기록됨)' }
        reason: { $ref: '#/components/schemas/ApprovalRefReason' }
        type: { $ref: '#/components/schemas/ApprovalType' }
        targetService: { type: string }
        targetRef: { type: string }
        reviewState: { $ref: '#/components/schemas/ReviewState' }
        requesterId: { type: string }
        approverId: { type: string, description: 승인 결정자 }
        decidedAt: { type: string, format: date-time }
        effectiveFrom: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/ApprovalLine' } }
        use: { $ref: '#/components/schemas/ApprovalRefUse' }
    BatchChange:
      type: object
      properties:
        batchId: { type: string }
        type: { $ref: '#/components/schemas/ApprovalType' }
        fileHash: { type: string }
        fileName: { type: string }
        state: { type: string, enum: [VALIDATING, READY, SUBMITTED, COMPLETED, PARTIALLY_FAILED, REJECTED] }
        totalRows: { type: integer }
        counts:
          type: object
          additionalProperties: { type: integer }
          description: BatchRowState 별 건수
        approvalId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    BatchRow:
      type: object
      properties:
        rowKey: { type: string }
        state: { $ref: '#/components/schemas/BatchRowState' }
        changeRequestId: { type: [string, 'null'] }
        domainRef: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        recordedAt: { type: string, format: date-time }
    PolicyReference:
      type: object
      properties:
        policyReferenceId: { type: string }
        ownerService: { type: string }
        policyKey: { type: string }
        policyId: { type: string }
        policyVersion: { type: integer }
        approvalId: { type: string }
        applyState: { type: string, enum: [APPROVED, PENDING_APPLY, APPLIED, FAILED, UNKNOWN] }
        effectiveFrom: { type: [string, 'null'], format: date-time }
        appliedAt: { type: [string, 'null'], format: date-time }
        summary: { type: string }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
