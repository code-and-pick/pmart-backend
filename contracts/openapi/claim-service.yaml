  /claims/metrics/refunds:
    get:
      tags: [claim-metrics]
      summary: 기간 환불 금액 합·건수 — 사유 묶음별 (0.5.0, 대시보드 D2)
      x-added-in: '2026-11-18'
      description: |
        2026-11-18 사용자 결정(CL-3): 매출에서 환불을 빼지 않고 환불 금액을 따로 보인다. 직원 토큰(OPERATOR)의 역할 **OPERATOR_ADMIN 만**(그 밖 직원·고객·라이더 403).
        **기준 = 환불 완료 시각(`completedAt` — PG 환불 성공을 확인한 시각)의 한국 날짜(Asia/Seoul)** — from 00:00(KST) 이상, to 다음 날 00:00(KST) 미만. from·to 필수·포함.
        from > to 이면 400, 기간이 93일(포함)을 넘으면 400 VALIDATION_FAILED. **완료(COMPLETED)된 환불만** — 실행 중·결과 불명·실패는 세지 않는다.
        **센터(mfcId) 거르기는 없다**(사용자 동의 2026-11-18 — 출고 전 취소 클레임에는 센터가 없다). 주문 쪽 집계(order `GET /orders/metrics/summary`)는 센터로 거를 수 있지만 이 값은 늘 모든 센터다.
        사유 묶음(환불 의도의 근거 `reason`):
        - `CANCEL` = CANCEL_BEFORE_SHIP — 출고 전 전체 취소(고객·고객센터·시스템 자동 취소(이행 거절·전체 결품) 모두. 앞선 결품 부분 환불이 있으면 남은 금액만)
        - `SHORTAGE` = OUT_OF_STOCK — 결품 부분 환불(ADR-0045)
        - `RETURN` = RETURN — 반품 검수 환불(검수마다 하나, CL-1)
        - `RETURN_FEE` = RETURN_FEE — 반품 취소 때 돌려준 회수비(원주문 결제가 아니라 **회수비 결제**의 취소 — 주문 결제 환불만 보려면 이 묶음을 뺀다)
        - `OTHER` = 그 밖의 근거(지금은 없음 — 새 근거가 생기면 여기에 먼저 모인다)
        totalAmount·totalCount 는 다섯 묶음 전부의 합. byReason 은 늘 다섯 줄(0 포함, 위 순서). 정수 KRW. 개인정보 없음.
      operationId: getRefundMetrics
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date }, description: '시작 날짜(Asia/Seoul, 포함) — 환불 완료 시각의 한국 날짜 기준' }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: '끝 날짜(Asia/Seoul, 포함). from 이상, from 부터 93일(포함) 이하' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundMetrics' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
