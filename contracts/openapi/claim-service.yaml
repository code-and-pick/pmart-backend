  /claims/{claimId}/fee-payment-attempts:
    post:
      tags: [claims]
      summary: "[고객] 반품 회수비 결제 — 새 결제 시도 (앞 시도가 실패·취소됐을 때)"
      description: |
        2026-11-17(0.2.0, CL-1). 회수비 결제 대기(FEE_PENDING) 반품 클레임의 고객 본인만. 지금 결제 시도가 없거나 실패·취소면 새 시도를 만들고,
        아직 쓸 수 있는 시도(CREATED·PENDING 등)면 그대로 돌려준다. 결제는 토스 결제위젯 `orderId = feePayment.paymentAttemptId`, amount 9,000 →
        payment `POST /payment-confirmations`(기존 결제 승인 그대로). 결제 승인(PaymentApproved)을 받으면 클레임 IN_PROGRESS + 회수 요청.
        - 남의 것·없는 것 404. 결제 대기가 아니거나 기한(feePayment.deadlineAt)이 지났으면 409 INVALID_STATE. payment 응답 불가 503.
      x-added-in: '2026-11-17'
      operationId: createReturnFeePaymentAttempt
      x-pmart-user-types: [CUSTOMER]
