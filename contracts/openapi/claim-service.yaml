        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /claims/{claimId}/recovery-actions:
    post:
      tags: [claims]
      summary: "[상담원] 반품 회수 후속 조치 — 다시 회수 요청 / 반품 취소 / 받은 만큼만 끝내기"
      description: |
        2026-11-17(0.2.0, CL-1 ③). 역할 CS_AGENT·OPERATOR_ADMIN(그 밖 403). type RETURN 만(그 밖 422 UNSUPPORTED_ACTION).
        - RETRY_PICKUP: RECOVERY_FAILED(두 번 실패 뒤 상담원이 고객과 다시 연락)에서만 → IN_PROGRESS + 새 회수 요청(ReturnPickupRequested). 회수비는 다시 받지 않는다.
          (0.3.0) 회수 시도는 전체 3번(자동 2 + 상담원 1 — 라이더·우리 잘못 RIDER_INCIDENT 실패는 세지 않음): 다 썼으면 409 PICKUP_ATTEMPTS_EXHAUSTED, 반품 기한(returnDeadlineAt)이 지났으면 409 RETURN_DEADLINE_PASSED — 둘 다 반품 취소만 할 수 있다.
        - CANCEL: FEE_PENDING·RECOVERY_FAILED 이고 수거·반입된 회수품이 없을 때만 → CANCELLED + ClaimClosed(RETURN_CANCELLED). 결제 대기 중 회수비는 더 받지 않는다(그 뒤 승인되면 자동 보상 취소).
          (0.3.0) 이미 낸 회수비: 회수 실패에 고객 사유(부재·연락 두절·주소 오류·거부)가 있으면 돌려주지 않음, 우리 잘못(RIDER_INCIDENT)뿐이면 돌려줌, 파손·기타면 상담원 판단 — `feeRefund`(기본 false).
          정해진 규칙과 다른 feeRefund(고객 사유에 true, 우리 잘못에 false)·낸 회수비가 없는데 true 는 422 FEE_REFUND_NOT_ALLOWED. 돌려주면 회수비 결제의 전액 취소(환불 kind RETURN_FEE — refunds[]·feePayment.refundIntentId).
        - CLOSE_AS_RECEIVED(0.3.0, "받은 만큼만 끝내기"): IN_PROGRESS·RECOVERY_FAILED 에서 MFC 가 요청보다 적게 받았을 때 → 행마다 정산 수량(approvedQty) = 받은 수량, 남은 수량은 환불 없음.
          받은 수량이 모두 검수·환불되면 바로 CLOSED(ClaimClosed RETURN_SHORT_CLOSED), 아니면 IN_PROGRESS 로 두고 검수·환불 뒤 CLOSED. 받은 것이 없으면 409 NOTHING_RECEIVED(취소를 쓴다), 다 받았으면 409 NOT_SHORT, 진행 중인 회수 요청이 있으면 409 PICKUP_IN_PROGRESS.
          남은 수량은 이 주문에서 다시 반품 접수할 수 없다(반품 가능 수량은 요청 수량으로 계속 점유).
        - feeRefund 는 CANCEL 에만(그 밖 400). 그 밖 상태 409 INVALID_STATE. note(조치 사유, 필수)는 클레임 조치 기록에만 남고 로그에 쓰지 않는다. X-Expected-Version 이 있으면 클레임 version 과 비교(다르면 409 VERSION_CONFLICT).
      x-added-in: '2026-11-17'
      operationId: createReturnRecoveryAction
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryActionRequest' }
      responses:
        '200':
          description: 조치가 반영된 클레임 (같은 키·같은 본문은 재생)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE / VERSION_CONFLICT / PICKUP_ATTEMPTS_EXHAUSTED / RETURN_DEADLINE_PASSED / NOTHING_RECEIVED / NOT_SHORT / PICKUP_IN_PROGRESS (0.3.0)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: UNSUPPORTED_ACTION (RETURN 아님) / FEE_REFUND_NOT_ALLOWED (0.3.0 — 회수비 규칙과 다른 feeRefund)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/accounts/{accountId}/withdrawal-eligibility:
    get:
      tags: [internal]
      summary: '[customer→claim] 탈퇴 가능 여부 (진행 중 클레임·환불·분쟁) — 0.9.0, ADR-0077'
      description: |
        그 고객이 낸 클레임 중 끝 상태(완료·거절·철회 등 더 바뀌지 않는 상태)가 아닌 것을 돌려준다.
        kind — CLAIM_IN_PROGRESS(취소·반품·교환 진행), REFUND_IN_PROGRESS(환불 요청됐으나 결과 전·결과 모름), DISPUTE_OPEN(분쟁·사건 열림). ref = claimId.
        하나도 없으면 eligible=true. 클레임이 없는 고객도 eligible=true.
      operationId: getWithdrawalEligibility
