                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /internal/claims/system-cancellations:
    post:
      tags: [internal]
      summary: "[orchestration→claim] 시스템 자동 전체 취소 접수 (MFC 작업 거절 뒤, D6-4)"
      description: |
        슬라이스 6a(2026-11-07). order-orchestration 이 MFC 작업 거절(재시도 대상이 아니거나 재시도가 끝남)을 확인한 뒤 호출한다
        (docs/business/flows/order-checkout-saga.md §2.0 D6-4). 고객 선택 단계 없이 주문 전체(모든 행 × 미이행 수량)를 취소하고
        원 승인액 전액을 환불한다 — 접수 뒤 흐름은 고객 취소와 같다(CancellationRequested → S3 → OrderCancelled → 환불).
        클레임은 channel SYSTEM, reason 은 요청 값(FULFILLMENT_REJECTED, 2026-11-08 부터 OUT_OF_STOCK — 결품 전체 취소, ADR-0046).
        - 주문이 CONFIRMED·PREPARING(피킹 시작 뒤 — 현장 중지가 집품분을 취소 복귀로 돌린다) 이 아니면 422 ORDER_NOT_CANCELLABLE.
        - 앞서 결품 부분 환불이 있었으면 환불은 원 승인액에서 그 합을 뺀 잔액(봉투값·배달팁 포함).
        - 진행 중인 결품 부분 환불 클레임(현장 중지 없음)은 "진행 중인 취소" 로 보지 않는다.
        - 같은 주문에 진행 중인 취소 클레임이 이미 있으면(고객이 먼저 취소 등) 새로 만들지 않고 그 클레임을 200 으로 돌려준다.
        - 같은 Idempotency-Key·같은 본문은 기존 결과를 재생한다.
      x-added-in: '2026-11-07'
      operationId: createSystemCancellation
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemCancellationRequest' }
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '200':
          description: 이미 진행 중인 취소 클레임 (새로 만들지 않음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: ORDER_NOT_CANCELLABLE (CONFIRMED 아님·취소할 미이행 수량 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/claims/shortage-refunds:
    post:
      tags: [internal]
      summary: "[orchestration→claim] 결품 부분 환불 (품절 상품만 취소, IV-09 2부)"
      description: |
        2026-11-07(ADR-0045). order-orchestration 결품 사가가 고객 사전 선택 CANCEL_OOS_ONLY 인 주문의 결품 수량을 **주문 수량 변경(SHORTAGE) 뒤** 호출한다.
        - 행마다 요청 수량 ≤ 주문 원장의 출고 전 취소 누계(cancelledBeforeShipQty) − 이미 결품 환불한 수량. 넘으면 422 QUANTITY_EXCEEDS_AVAILABLE.
        - 환불액 = 원주문 단가 × 수량(1차는 할인 안분 없음 — discountShare 가 0 이 아니면 422 UNSUPPORTED_ACTION). 봉투값·배달팁은 돌려주지 않는다(부분 취소, OMS 10.2).
        - 클레임은 바로 IN_PROGRESS(type CANCEL, reason OUT_OF_STOCK, channel SYSTEM, 행 APPROVED), 환불 의도 PARTIAL → payment 부분 취소. CancellationRequested 는 내지 않는다(현장 중지는 결품 사가가 이미 했다).
        - 같은 Idempotency-Key·같은 본문은 재생.
      x-added-in: '2026-11-07'
      operationId: createShortageRefund
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, lines]
              properties:
                orderId: { type: string }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [orderLineId, qty]
                    properties:
                      orderLineId: { type: string }
                      qty: { type: integer, minimum: 1 }
                reasonDetail: { type: string, maxLength: 1000 }
                sourceRef: { type: string, description: 결품 사가 ID }
                feeDeduction:
                  type: integer
                  minimum: 0
                  x-added-in: '2026-11-16'
                  description: '공제액(원) — 환불 = 단가 × 수량 − 공제(0 아래로 내려가지 않음). ADR-0065 고객 잘못 오배송 회수 후 환불은 회수비 9,000원. 환불액이 0 이면 환불 의도 없이 클레임을 바로 닫는다'
      responses:
        '201':
          description: 접수됨(환불 실행은 비동기)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: QUANTITY_EXCEEDS_AVAILABLE / UNSUPPORTED_ACTION
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/claims/{claimId}/return-receipts:
    post:
      tags: [internal]
      summary: "[mfc-inbound→claim] 회수품 점포 수령 확인 (품목별 실수령 수량)"
      description: |
        회수 승인량 2 / 실수령 1이면 미수령 1을 남긴다. 수령 확인은 검수·환불 완료가 아니다.
        검수 결과(RESALE/DISPOSE)는 ReturnInspected 이벤트로 수신하며 이 API는 수령 사실만 기록한다.
      operationId: createReturnReceipt
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnReceiptRequest' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (회수 미승인·종결) / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: RECEIPT_EXCEEDS_APPROVED (승인 회수량 초과)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/claims/{claimId}/return-receipts/{requestId}:
    get:
      tags: [internal]
      summary: 회수 수령 확인 결과 조회
      operationId: getReturnReceipt
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnReceipt' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    RefundMetrics:
      type: object
      x-added-in: '2026-11-18'
      description: 기간 완료 환불 합(CL-3, 0.5.0) — 환불 완료 시각 한국 날짜 기준, 모든 센터
      required: [from, to, totalAmount, totalCount, byReason]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalAmount: { type: integer, format: int64, minimum: 0, description: 완료 환불 금액 합(정수 KRW, RETURN_FEE 포함) }
        totalCount: { type: integer, description: 완료 환불 건수(환불 의도 수) }
        byReason:
          type: array
          description: 사유 묶음별 — 늘 다섯 줄(CANCEL·SHORTAGE·RETURN·RETURN_FEE·OTHER 순, 0 포함)
          items:
            type: object
            required: [reason, amount, count]
            properties:
              reason: { type: string, enum: [CANCEL, SHORTAGE, RETURN, RETURN_FEE, OTHER] }
              amount: { type: integer, format: int64, minimum: 0 }
              count: { type: integer }
    ClaimType:
      type: string
      enum: [CANCEL, RETURN, EXCHANGE]
    ClaimState:
      type: string
      description: |
        OPENED 접수. UNDER_REVIEW 심사 중. DECIDED 결정(일부 승인 가능). IN_PROGRESS 회수·환불·재배송 진행. CLOSED 모든 의무 확인 후 종결. WITHDRAWN 철회.
        CANCEL 유형은 OPENED → STOP_PENDING(출고 중지/인계 확인 중) → IN_PROGRESS → CLOSED 또는 REJECTED(취소 불가).
        RETURN 유형(0.2.0, 2026-11-17): FEE_PENDING(회수비 결제 대기 — 면제면 건너뜀) → IN_PROGRESS(회수·반입·검수·환불) → CLOSED(모든 행 검수·환불 완료).
        RECOVERY_FAILED 회수 두 번 실패(상담원 재연락 — 다시 회수 요청·취소·받은 만큼만 끝내기). CANCELLED 회수비 미결제(기한)·상담원 취소·반품 기한(접수 + 7일, 0.3.0) 안에 회수 안 됨.
      enum: [OPENED, UNDER_REVIEW, STOP_PENDING, DECIDED, IN_PROGRESS, CLOSED, WITHDRAWN, REJECTED, FEE_PENDING, RECOVERY_FAILED, CANCELLED]
    ClaimReason:
      type: string
      description: DEFECT·WRONG_ITEM·NOT_AS_ADVERTISED는 교환 특례 기한(3개월/인지 30일) 대상. FULFILLMENT_REJECTED·OUT_OF_STOCK 는 시스템 접수만(2026-11-07, 고객 접수 불가 — OUT_OF_STOCK 은 결품 부분 환불). DISPATCH_UNAVAILABLE(0.7.0 CL-5)·OPERATOR_DECISION(0.8.0 ADR-0076 관리자 판단 — reasonDetail 필수) 은 직원 전체 취소만(고객 접수 불가)
      enum: [CHANGE_OF_MIND, DEFECT, WRONG_ITEM, NOT_AS_ADVERTISED, DAMAGED_IN_DELIVERY, MISSING_ITEM, LATE_DELIVERY, CUSTOMER_ABSENT, ADDRESS_ERROR, OTHER, FULFILLMENT_REJECTED, OUT_OF_STOCK, DISPATCH_UNAVAILABLE, OPERATOR_DECISION]
    ReturnFaultCode:
      type: string
      x-added-in: '2026-11-17'
      description: |
        회사 잘못 사유 — 있으면 반품 회수비 9,000원 면제(사용자 결정 2026-11-17 CL-1 ②). MISDELIVERY 오배송, DEFECTIVE 상품 불량,
        DAMAGED_IN_DELIVERY 배송 중 파손, SEVERE_DELAY 약속 시간 크게 지연, WRONG_SUBSTITUTE 잘못된 대체. 없으면 고객 사유(회수비 고객 부담).
      enum: [MISDELIVERY, DEFECTIVE, DAMAGED_IN_DELIVERY, SEVERE_DELAY, WRONG_SUBSTITUTE]
    IdentityCheck:
      type: object
      x-added-in: '2026-11-17'
      description: 상담원이 본인 확인을 어떻게 했는지(결과 기록만 — 고객이 말한 값은 넣지 않는다. case CS 접수와 같은 값)
      required: [method]
      properties:
        method: { type: string, enum: [ORDER_DETAILS_MATCH, APP_SIGNED_IN_CHAT, OTHER] }
        note: { type: string, maxLength: 200, description: 'OTHER 이면 필수 — 어떻게 확인했는지' }
    RecoveryActionRequest:
      type: object
      x-added-in: '2026-11-17'
      required: [action, note]
      properties:
        action: { type: string, enum: [RETRY_PICKUP, CANCEL, CLOSE_AS_RECEIVED], description: 'CLOSE_AS_RECEIVED(0.3.0) — 받은 만큼만 끝내기' }
        note: { type: string, minLength: 1, maxLength: 500, description: 조치 사유(고객과 다시 연락한 결과 등) }
        feeRefund:
          type: boolean
          x-added-in: '2026-11-17'
          description: 'CANCEL 만(0.3.0) — 낸 회수비를 돌려주나. 회수 실패가 파손·기타일 때만 상담원이 정한다(없으면 false). 고객 사유면 false, 우리 잘못이면 true 로 정해져 있어 다른 값은 422 FEE_REFUND_NOT_ALLOWED'
    ReturnFeePayment:
      type: object
      x-added-in: '2026-11-17'
      description: |
        반품 회수비 결제(상품 환불과 별개 거래). state WAITING 결제 대기 · PAID 결제됨 · UNPAID 기한까지 미결제·취소(클레임 CANCELLED) ·
        LATE_CANCEL_PENDING/LATE_CANCELLED/LATE_CANCEL_FAILED 기한·취소 뒤 늦게 승인된 결제의 보상 취소 진행·완료·실패(운영자 확인).
        paymentAttemptId 가 비어 있으면 결제 시도를 준비 중(잠시 뒤 다시 조회).
      properties:
        amount: { $ref: '_common.yaml#/components/schemas/Money' }
        state: { type: string, enum: [WAITING, PAID, UNPAID, LATE_CANCEL_PENDING, LATE_CANCELLED, LATE_CANCEL_FAILED] }
        paymentAttemptId: { type: string, description: 토스 결제위젯 orderId }
        orderName: { type: string, description: 결제창 표시용 주문명 }
        deadlineAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
        refundDecision:
          type: string
          enum: [REFUND, KEEP]
          x-added-in: '2026-11-17'
          description: '0.3.0 — 결제된 회수비가 있는 반품이 취소됐을 때 회수비를 돌려주나(회수 실패 고객 사유 KEEP·우리 잘못 REFUND·파손·기타 상담원 판단). 없으면 아직 정하지 않음(진행 중·결제 안 됨)'
        refundIntentId:
          type: string
          x-added-in: '2026-11-17'
          description: '0.3.0 — 돌려줄 때 환불 의도(진행은 refunds[] 의 같은 ID, kind RETURN_FEE)'
    SystemCancellationRequest:
      type: object
      description: 시스템 자동 전체 취소(2026-11-07)
      required: [orderId, reason]
      properties:
        orderId: { type: string }
        reason: { type: string, enum: [FULFILLMENT_REJECTED, OUT_OF_STOCK, DISPATCH_UNAVAILABLE], description: 'DISPATCH_UNAVAILABLE(0.9.1, 2026-11-20 — delivery-dispatch 자동 취소: 약속+30분 라이더 없음, 인계 전) · OUT_OF_STOCK(2026-11-08, ADR-0046) = 결품 사가의 전체 취소(고객 선택 CANCEL_ALL·주문 전체 결품)' }
        reasonDetail: { type: string, maxLength: 1000, description: '예 작업 거절 사유 코드·마지막 작업 버전' }
        sourceRef: { type: string, description: 요청한 사가 ID(추적용) }
    ClaimLineRequest:
      type: object
      required: [orderLineId, qty]
      properties:
        orderLineId: { type: string }
        qty: { type: integer, minimum: 1 }
        exchangeSku:
          $ref: '_common.yaml#/components/schemas/Sku'
          description: EXCHANGE일 때 교환 대상 SKU (동일 SKU 기본)
    CreateClaimRequest:
      type: object
      required: [orderId, type, lines, reason]
      properties:
        orderId: { type: string }
        type: { $ref: '#/components/schemas/ClaimType' }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ClaimLineRequest' } }
        reason: { $ref: '#/components/schemas/ClaimReason' }
        reasonDetail: { type: string, maxLength: 1000 }
        evidenceRefs:
          type: array
          description: 사진 등 증빙 참조(file-service). 하자·오배송·광고 상이 사유는 필수
          items: { type: string }
        receivedAt:
          type: string
          format: date-time
          description: 고객이 주장하는 수령 시각(참고). 기한 판정은 delivery-execution 실제 전달 시각으로 한다
        awareAt:
          type: string
          format: date-time
          description: 하자 등을 안 날(알 수 있었던 날). 특례 30일 기산점. 불명이면 증빙 보완 심사
        channel: { type: string, enum: [CUSTOMER_APP, CS, OPERATOR] }
        faultCode:
          $ref: '#/components/schemas/ReturnFaultCode'
          description: RETURN(직원 접수)만 — 있으면 회수비 면제
        identityCheck:
          $ref: '#/components/schemas/IdentityCheck'
          description: 직원 접수(RETURN·CANCEL — 0.4.0) 필수
        caseRef: { type: string, maxLength: 64, description: '직원 접수(RETURN·CANCEL) — 연결할 CS 접수·사건 ID(선택, 기록만)', x-added-in: '2026-11-17' }
    ClaimLine:
      type: object
      properties:
        claimLineId: { type: string }
        orderLineId: { type: string }
        sku: { type: string }
        requestedQty: { type: integer }
        approvedQty: { type: integer, description: 'RETURN — 정산 수량(접수 때 요청 수량, 받은 만큼만 끝내기 뒤 받은 수량 — 0.3.0)' }
        decision: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejectReason: { type: string }
        pickupRequired: { type: boolean }
        pickedUpQty: { type: integer, description: 'RETURN — 라이더가 회수지에서 받은 수량(ReturnPickedUp, 0.2.0)' }
        receivedQty: { type: integer, description: 점포 실수령 수량 }
        inspection:
          type: object
          properties:
            resaleQty: { type: integer }
            disposeQty: { type: integer }
            inspectedAt: { type: string, format: date-time }
        refundAmount: { $ref: '_common.yaml#/components/schemas/Money', description: 원가격·원안분 기준 }
        deliveredAt: { type: string, format: date-time, description: 기한 기산 근거(실제 전달 시각) }
        windowDeadline: { type: string, format: date-time, description: 적용된 접수 기한(Asia/Seoul 경계) }
        windowRule: { type: string, enum: [GENERAL_7D, FRESH_24H, DEFECT_3M, DEFECT_AWARE_30D] }
    PickupState:
      type: string
      description: 'FAILED(0.2.0) — 회수 두 번 실패(클레임 RECOVERY_FAILED)'
      enum: [NOT_REQUIRED, REQUESTED, DISPATCHED, PICKED_UP, DELIVERED_TO_STORE, RECEIVED, INSPECTED, FAILED]
    Claim:
      type: object
      properties:
        claimId: { type: string }
        version: { type: integer }
        orderId: { type: string }
        type: { $ref: '#/components/schemas/ClaimType' }
        state: { $ref: '#/components/schemas/ClaimState' }
        reason: { $ref: '#/components/schemas/ClaimReason' }
        reasonDetail: { type: string }
        channel: { type: string, enum: [CUSTOMER_APP, CS, OPERATOR, SYSTEM], x-added-in: '2026-11-17' }
        faultCode:
          $ref: '#/components/schemas/ReturnFaultCode'
          description: RETURN — 회사 잘못 사유(있으면 회수비 면제)
        feePayment:
          $ref: '#/components/schemas/ReturnFeePayment'
          description: RETURN 고객 사유 — 회수비 결제(면제·RETURN 아님이면 없음)
        evidenceRefs: { type: array, items: { type: string } }
        lines: { type: array, items: { $ref: '#/components/schemas/ClaimLine' } }
        stopRequestId: { type: string, description: CANCEL일 때 S3 멱등 키 }
        returnDeadlineAt: { type: string, format: date-time, x-added-in: '2026-11-17', description: 'RETURN(0.3.0) — 반품 전체 기한(접수 + 7일). 그 안에 회수가 안 되면 자동 취소' }
        sagaId: { type: string }
        pickup:
          type: object
          properties:
            state: { $ref: '#/components/schemas/PickupState' }
            deliveryId: { type: string, description: 회수 배송번호(dispatch) }
            addressFixedToOrder: { type: boolean, default: true }
            attempts: { type: integer, description: '회수 요청 횟수(0.2.0)' }
            failedAttempts: { type: integer, description: '실패한 회수 수(0.2.0) — 자동 재요청은 한 번, 두 번째 실패면 RECOVERY_FAILED' }
            countedFailures: { type: integer, x-added-in: '2026-11-17', description: '0.3.0 — 횟수에 드는 실패 수(라이더·우리 잘못 RIDER_INCIDENT 는 빼고). 전체 3번(자동 2 + 상담원 1)' }
            retryAllowed: { type: boolean, x-added-in: '2026-11-17', description: '0.3.0 — 회수 시도가 남았나(countedFailures < 3). 상담원 다시 회수는 state RECOVERY_FAILED 이고 이 값이 true 이고 returnDeadlineAt 전일 때만' }
        fees:
          type: object
          properties:
            exchangeRoundTripFee: { $ref: '_common.yaml#/components/schemas/Money', description: 단순 변심 교환 9000 }
            returnPickupFee: { $ref: '_common.yaml#/components/schemas/Money' }
            decidedBy: { type: string }
            evidenceRef: { type: string }
        refunds: { type: array, items: { $ref: '#/components/schemas/Refund' } }
        reshipment:
          type: object
          description: EXCHANGE 승인 시 교환 이행 단위 (새 주문·새 결제 생성 없음)
          properties:
            state: { type: string, enum: [NOT_APPLICABLE, APPROVED, FULFILLMENT_CREATED, IN_PROGRESS, DELIVERED, OUT_OF_STOCK] }
            shipmentId: { type: string }
        openedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        sources:
          type: array
          description: 조합한 원천별 기준시각 (order·delivery·payment·mfc)
          items:
            type: object
            properties:
              system: { type: string }
              asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    ClaimSummary:
      type: object
      properties:
        claimId: { type: string }
        orderId: { type: string }
        type: { $ref: '#/components/schemas/ClaimType' }
        state: { $ref: '#/components/schemas/ClaimState' }
        openedAt: { type: string, format: date-time }
        reason: { $ref: '#/components/schemas/ClaimReason' }
        channel: { type: string, enum: [CUSTOMER_APP, CS, OPERATOR, SYSTEM], x-added-in: '2026-11-19' }
        closedAt: { type: [string, 'null'], format: date-time, x-added-in: '2026-11-19' }
        refund: { $ref: '#/components/schemas/ClaimRefundSummary' }
    ClaimRefundSummary:
      type: object
      description: (0.6.0 BR-33) 클레임의 상품 환불 요약 — 환불 의도(refund_intent)들의 합. 회수비 돌려주기는 빼고 상세에서
      required: [state, requestedAmount, refundedAmount]
      properties:
        state: { type: string, enum: [NONE, IN_PROGRESS, COMPLETED, FAILED] }
        requestedAmount: { $ref: '_common.yaml#/components/schemas/Money', description: 환불하기로 한 금액 합 }
        refundedAmount: { $ref: '_common.yaml#/components/schemas/Money', description: PG 가 성공한 금액 합 }
        completedAt: { type: [string, 'null'], format: date-time, description: 마지막으로 PG 성공한 시각 }
    ClaimDecisionRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [claimLineId, decision]
            properties:
              claimLineId: { type: string }
              decision: { type: string, enum: [APPROVED, REJECTED] }
              approvedQty: { type: integer, minimum: 0 }
              pickupRequired: { type: boolean, default: true }
              rejectReason: { type: string }
        skipPickupReason: { type: string, description: 회수 생략 시 필수 }
        skipPickupEvidenceRefs: { type: array, items: { type: string } }
        fees:
          type: object
          properties:
            exchangeRoundTripFee: { $ref: '_common.yaml#/components/schemas/Money' }
            returnPickupFee: { $ref: '_common.yaml#/components/schemas/Money' }
            evidenceRef: { type: string }
        refundTrigger:
          type: string
          description: 환불 개시점. 미지정이면 등록된 정책값, 정책 미설정이면 심사 대기 상신(자동 환불 없음)
          enum: [ON_PICKUP_CONFIRMED, ON_STORE_RECEIVED, ON_INSPECTED]
        approvalRef: { type: string, description: 정책 밖 결정(비용 면제 등)일 때 승인 건 ID }
        note: { type: string, maxLength: 1000 }
    ClaimDecision:
      type: object
      properties:
        requestId: { type: string }
        claimId: { type: string }
        operatorId: { type: string }
        state: { type: string, enum: [ACCEPTED, APPLIED, REJECTED] }
        lines: { type: array, items: { $ref: '#/components/schemas/ClaimLine' } }
        decidedAt: { type: string, format: date-time }
    RefundState:
      type: string
      description: 접수 → 심사/승인 → 실행 대기 → PG 결과 확인 → 완료 / 실패 / 확인 중
      enum: [RECEIVED, APPROVED, PENDING_EXECUTION, PG_PENDING, COMPLETED, FAILED, UNKNOWN]
    Refund:
      type: object
      properties:
        refundIntentId: { type: string }
        claimId: { type: string }
        kind:
          type: string
          enum: [ITEMS, RETURN_FEE]
          x-added-in: '2026-11-17'
          description: '0.3.0 — ITEMS 상품 환불(원주문 결제의 취소), RETURN_FEE 반품 회수비 돌려주기(회수비 결제의 전액 취소 — breakdown 은 모두 0, amount 가 회수비)'
        state: { $ref: '#/components/schemas/RefundState' }
        amount: { $ref: '_common.yaml#/components/schemas/Money', description: 원주문 가격 스냅샷·품목별 할인 안분 }
        breakdown:
          type: object
          properties:
            itemAmount: { $ref: '_common.yaml#/components/schemas/Money' }
            discountShare: { $ref: '_common.yaml#/components/schemas/Money' }
            bagFee: { $ref: '_common.yaml#/components/schemas/Money', description: 전체 취소만 환불 }
            deliveryTip: { $ref: '_common.yaml#/components/schemas/Money', description: 확정 기준 }
            feeDeduction: { $ref: '_common.yaml#/components/schemas/Money', description: 교환 왕복·회수비 공제 }
        paymentAttemptId: { type: string }
        cancellationRequestId: { type: string, description: payment 취소 거래 requestId }
        pgResult: { type: string, enum: [SUCCESS, FAILED, UNKNOWN] }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    ReturnReceiptRequest:
      type: object
      required: [mfcId, deliveryId, lines, receivedAt, receivedBy]
      properties:
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        deliveryId: { type: string, description: 회수 배송번호 }
        receivedBy: { type: string, description: 점원 식별자 }
        receivedAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [claimLineId, receivedQty]
            properties:
              claimLineId: { type: string }
              receivedQty: { type: integer, minimum: 0 }
              note: { type: string }
    ReturnReceipt:
      type: object
      properties:
        requestId: { type: string }
        claimId: { type: string }
        state: { type: string, enum: [ACCEPTED, APPLIED, REJECTED] }
        lines:
          type: array
          items:
            type: object
            properties:
              claimLineId: { type: string }
              approvedQty: { type: integer }
              receivedQty: { type: integer }
              outstandingQty: { type: integer, description: 미수령 잔량 }
        receivedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
