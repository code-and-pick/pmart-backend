openapi: 3.1.0
info:
  title: claim-service
  version: 0.9.1
  description: |
    0.9.1(2026-11-20, PC 5 요청 — 사용자 "쿠폰 안 되면 자동취소만", "약속+30분"): 내부 시스템 취소 `POST /internal/claims/system-cancellations` 사유에 **`DISPATCH_UNAVAILABLE`** — delivery-dispatch 가 배송 약속 시각 + 30분이 지나도 라이더가 배정되지 않은(픽업 전) 고객 배송의 주문을 자동 취소. 범위·흐름은 시스템 취소 그대로(CONFIRMED·PREPARING, 전액 환불, 고객 알림은 배차 불가 문구). 2,000원 쿠폰은 promotion 이 생길 때.
    0.9.0(2026-11-20, ADR-0077 고객 탈퇴): 내부 `GET /internal/accounts/{accountId}/withdrawal-eligibility` — 끝나지 않은 클레임(취소·반품·교환)·환불·분쟁.
    0.8.0(2026-11-20, ADR-0076 — 사용자 "관리자 사유 취소만 넓힘", MFC 시뮬레이터 R-29 "니가 바로 고쳐"): 사유 **`OPERATOR_DECISION`**(관리자 판단) 직원 전체 취소 —
    역할은 그 센터 `MFC_SUPERVISOR`·`OPERATOR_ADMIN` 만(**CS_AGENT 403** — 배차 불가와 다름), 배차 불가(0.7.0)와 같은 범위(**상품준비 뒤라도 인계 전**, 인계 뒤·미이행 0 은 422)·흐름, 본인 확인 없음,
    **사유 메모 `reasonDetail` 필수**(비면 400). 고객 접수 400. CancellationRequested·OrderCancelled `cancelReason` 에 그대로 실린다. 고객 취소 범위(상품준비 전만, ADR-0060)는 그대로.
    0.7.0(2026-11-19, CL-5 — PC 5 요청, PC 1 사용자 "추천대로 일단" — 쿠폰은 promotion 이 생길 때): 사유 **`DISPATCH_UNAVAILABLE`**(배차 불가) 직원 전체 취소 —
    그 센터 `MFC_SUPERVISOR`·`CS_AGENT`·`OPERATOR_ADMIN`, **상품준비(PREPARING) 뒤라도 인계 전이면**(시스템 취소와 같은 범위 — 인계 뒤·미이행 0 은 422), 본인 확인 필요 없음(회사 사유),
    채널 CS·OPERATOR. 뒤 흐름은 그대로(CancellationRequested → S3 → OrderCancelled → 원 승인액 전액 환불). 2,000원 쿠폰은 아직 없다(promotion 미구현).
    0.5.0(2026-11-18, CL-3 — 백오피스 대시보드 D2, 사용자 "환불은 따로"): 직원(OPERATOR_ADMIN 만) 기간 환불 합 `GET /claims/metrics/refunds?from&to` — 환불 완료 시각(`refund_intent.completed_at`)의 한국 날짜, from·to 포함·필수, 93일 이하. 완료(COMPLETED)된 환불 의도의 금액 합·건수 + 사유 묶음(CANCEL·SHORTAGE·RETURN·RETURN_FEE·OTHER)별. **센터(mfcId) 거르기는 없다**(사용자 동의 2026-11-18 — 취소 클레임에는 센터가 없다). 주문 매출(order `GET /orders/metrics/summary`)에서 빼지 않고 나란히 보인다.
    0.3.0(2026-11-17, CL-1 추가 결정 1~9 — 사용자 "추천대로"): 회수비 결제 기한 24시간 확정. 반품 전체 기한(접수 + 7일, `Claim.returnDeadlineAt`) — 그 안에 회수가 안 되면 자동 취소(ClaimClosed RETURN_EXPIRED).
    회수 시도 전체 3번(자동 2 + 상담원 다시 회수 1 — 넘으면 409 PICKUP_ATTEMPTS_EXHAUSTED), 라이더·우리 잘못(RIDER_INCIDENT) 실패는 횟수에서 빼고 바로 다시 요청(`pickup.countedFailures`·`retryAllowed`).
    회수 실패로 반품을 취소할 때 낸 회수비: 고객 사유 → 돌려주지 않음, 우리 잘못 → 돌려줌, 파손·기타 → 상담원 판단(`RecoveryActionRequest.feeRefund`, 기본 돌려주지 않음) — `feePayment.refundDecision`, 돌려주면 `refunds[]` 에 kind RETURN_FEE.
    상담원 "받은 만큼만 끝내기"(recovery-actions action CLOSE_AS_RECEIVED — 받은 수량만 환불, 남은 수량 환불 없음 → CLOSED, ClaimClosed RETURN_SHORT_CLOSED). 반품 종결 ClaimClosed 에 행별 반품 수량(returnedLines — order 가 returnedQty 로 기록, O-7).
    취소·반품·교환 신청·심사·승인 범위, 자격 판정, 신청 가능량, 회수 지시·검수 결과 연결, 환불 의도·금액·상태, 철회의 정본. (docs/architecture/service-map.md §2)
    PG 실행(payment), 회수 수행(delivery), 검수·재입고(mfc), 주문 수량 정본(order)은 소유하지 않는다.
    취소(CANCEL)는 접수 후 order-orchestration S3로, 반품·교환은 S6(docs/business/flows/return-exchange-refund.md)로 진행한다.
    1단계는 취소·반품 접수, 2단계에서 교환·회수를 완성한다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: claims, description: 고객·CS 클레임 접수·조회·철회 }
  - { name: decisions, description: 운영자 심사 (BO-12~14) }
  - { name: refunds, description: 환불 상태 조회 }
  - { name: internal, description: 서비스 간 (mfc-inbound 회수 수령·orchestration 자동 취소) }
  - { name: claim-metrics, description: '직원용 기간 집계(백오피스 대시보드 D2, 0.5.0) — OPERATOR_ADMIN 만' }

paths:
  /claims:
    post:
      tags: [claims]
      summary: 클레임 접수 (CANCEL | RETURN | EXCHANGE)
      description: |
        자격·대상 수량·중복·진행 점유를 검증해 접수한다. 접수는 심사·승인이 아니다.
        접수 기한(Asia/Seoul 실제 수령시각 기준, 경계시각까지 가능)
        - 일반 교환·반품 수령 후 7일
        - 신선식품(냉장/냉동) 24시간
        - 하자·오배송·광고 상이 사유의 교환 수령 후 3개월(달력 월, 없는 날은 말일) 또는 안 날(알 수 있었던 날)부터 30일 중 하나
        분할배송은 신청 품목의 실제 수령시각(delivery-execution DeliveryCompleted) 기준. 신선 24h 경과라도 사유가 하자이면 특례로 심사한다.
        신청 가능 수량 = 실제 전달량 − 완료/진행 클레임 점유. CANCEL은 원수량 − 기취소 − 인계 − 진행 클레임.
        회수·재배달 주소는 원주문 주소 고정. 단순 변심 교환은 왕복 9,000원 청구, 상품/배달 문제는 0원.
        [2026-10-31 구현] CANCEL 만, 고객 본인 주문(CONFIRMED)의 전체 취소만 받는다(모든 행 × 미이행 수량). 접수와 함께 stopRequestId 를 발급하고
        ClaimOpened·CancellationRequested(order.claim.v1)를 발행해 orchestration S3 를 시작한다. 상태 OPENED → STOP_PENDING → IN_PROGRESS(취소 확정·환불 실행) → CLOSED(PG 환불 성공) / REJECTED(인계됨).
        [2026-11-18 구현, 0.4.0 — 고객센터 주문 취소, 사용자 결정] 직원 토큰 + CS_AGENT·OPERATOR_ADMIN(그 밖 403)이 **상품준비 전(주문 CONFIRMED — 첫 피킹 시작 전, 작업자 배정만 된 주문 포함) 주문 전체 취소**를 고객 대신 접수한다.
        고객 앱 취소와 범위·흐름이 같다(모든 행 × 미이행 수량, STOP_PENDING → OrderCancelled → 전액 환불, 진행 중 취소가 있으면 DUPLICATE_CLAIM). 클레임 계정은 주문의 고객이라 고객이 앱에서 본다.
        - identityCheck 필수(OTHER 면 note — RETURN 과 같은 규칙, 없으면 400), reason 필수(시스템 사유 400), channel CS(기본)·OPERATOR(CUSTOMER_APP 400), faultCode 는 400(반품 전용), caseRef 선택. 접수 직원·본인 확인 방법·메모·CS 사건은 클레임에 남는다.
        - 상품준비(PREPARING) 뒤는 ADR-0060 그대로 422 ORDER_NOT_CANCELLABLE(detail 에 "받으신 뒤 반품으로 안내"). 부분 취소 422 PARTIAL_CANCEL_NOT_ALLOWED.
        - 예외(회사 사유 — 본인 확인 없음, 인계 전이면 상품준비 뒤라도): reason `DISPATCH_UNAVAILABLE`(0.7.0 배차 불가)·`OPERATOR_DECISION`(0.8.0 관리자 판단, ADR-0076 — reasonDetail 필수).
          배차 불가는 그 센터 MFC_SUPERVISOR(남의 센터 404)·CS_AGENT·OPERATOR_ADMIN, 관리자 판단은 그 센터 MFC_SUPERVISOR·OPERATOR_ADMIN 만(CS_AGENT 403). 채널 CS·OPERATOR.
        [2026-11-17 구현, 0.2.0 — CL-1·D-7·ADR-0060 결정 2] **인계 뒤 회수(type RETURN)는 고객센터만** 접수한다. 흐름 정본 docs/business/flows/return-exchange-refund.md §6.
        - 직원 토큰(OPERATOR) + 역할 CS_AGENT·OPERATOR_ADMIN(그 밖 403). 직원은 RETURN 과 아래 CANCEL(0.4.0)만(EXCHANGE 422 UNSUPPORTED_ACTION). 고객 토큰의 RETURN 은 422 UNSUPPORTED_ACTION(고객센터로 문의).
        - identityCheck 필수(본인 확인 방법만 기록 — case CS 접수와 같은 값, OTHER 면 note 필수). channel 은 CS(기본)·OPERATOR.
        - order `GET /internal/orders/{id}` 로 심사: 없는 주문 404, 행마다 요청 ≤ **전달 완료 수량(deliveredQty — 2026-11-17 사용자 "배달 중이나 전달 완료 전에는 반품 불가")** − 이 주문의 진행·완료 반품 수량(취소된 반품 제외). 전달 완료된 수량이 없으면 422 NOT_DELIVERED_YET, 넘으면 QUANTITY_EXCEEDS_AVAILABLE. 접수 기한(7일·24시간)은 아직 보지 않는다(상담원 판단).
        - faultCode(회사 잘못 — 오배송·상품 불량·배송 중 파손·약속 시간 크게 지연·잘못된 대체)가 있으면 **회수비 면제** → 바로 IN_PROGRESS + 회수 요청(ReturnPickupRequested).
          없으면(고객 사유) **회수비 9,000원**(상품 환불과 따로 결제) → FEE_PENDING, 결제 시도를 만들고 ReturnFeePaymentRequested. 고객이 앱에서 결제하면 IN_PROGRESS + 회수 요청.
          기한(`pmart.claim.return-fee-payment-wait`, 접수 + 이 시간 — 사용자 확정 24시간) 안에 결제하지 않으면 CANCELLED. 설정이 없으면 회수비 있는 접수만 422 CONFIG_REQUIRED.
        - 반품 전체 기한(0.3.0): 접수 + `pmart.claim.return-deadline`(사용자 7일) = `returnDeadlineAt`. 그 안에 회수(수거)가 하나도 안 되면 자동 취소(CANCELLED, ClaimClosed RETURN_EXPIRED — 진행 중인 회수가 있으면 그 결과를 기다림). 설정이 없으면 반품 접수 422 CONFIG_REQUIRED.
        - 회수 실패(고객 부재 등, delivery ReturnPickupFailed): 첫 실패는 자동으로 두 번째 회수 요청, 두 번째 실패면 RECOVERY_FAILED + ReturnRecoveryFailed(상담원 재연락) — 회수비는 다시 받지 않는다.
          (0.3.0) 전체 3번(자동 2 + 상담원 1). 라이더·우리 잘못(reason RIDER_INCIDENT)은 횟수에서 빼고 바로 다시 요청.
        - 회수품 MFC 반입(ReturnItemReceived) → 검수(ReturnInspected)된 수량마다 **원단가 × 수량 − 할인 안분** 전액 환불(RESALE·DISPOSE 모두, 1차 감액 없음), 봉투값·배달팁은 돌려주지 않는다. 모든 행이 검수·환불되면 CLOSED.
      operationId: createClaim
      x-pmart-user-types: [CUSTOMER, OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClaimRequest' }
      responses:
        '201':
          description: 접수됨 (같은 키·같은 본문은 기존 클레임 반환)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: CLAIM_WINDOW_EXPIRED / QUANTITY_EXCEEDS_AVAILABLE / DUPLICATE_CLAIM / NOT_DELIVERED_YET / EVIDENCE_REQUIRED / ORDER_NOT_CANCELLABLE / PARTIAL_CANCEL_NOT_ALLOWED (고객 취소는 주문 전체만) / UNSUPPORTED_ACTION (고객 RETURN·직원 CANCEL·EXCHANGE) / NOT_HANDED_OVER (RETURN — 인계된 수량 없음, 0.2.0) / CONFIG_REQUIRED (RETURN 회수비 결제 기한 미설정, 0.2.0)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
    get:
      tags: [claims]
      summary: 클레임 목록 (고객은 본인, 운영자는 orderId·상태 필터)
      description: |
        0.6.0(2026-11-19, 클라이언트 BR-33 "내 취소·반품·환불 목록"): 고객 토큰이면 **본인 클레임만**, 최근 접수 순(openedAt·claimId 내림차순).
        **커서가 실제로 동작한다**(전에는 받기만 하고 늘 첫 쪽) — 응답 `page.nextCursor` 를 다음 요청 `cursor` 로, 없으면 끝. 틀린 커서 400.
        항목마다 `refund`(상품 환불 요약 — 환불 의도들의 합): NONE 환불 없음 · IN_PROGRESS 진행 중(PG 결과 전 — 완료로 표시하지 않는다) ·
        COMPLETED 모두 PG 성공 · FAILED 하나라도 실패(상담 필요). 반품 회수비 돌려주기(RETURN_FEE)는 여기에 넣지 않는다 — 상세는 `GET /claims/{id}/refunds`.
      operationId: listClaims
      x-pmart-user-types: [CUSTOMER, OPERATOR]
      parameters:
        - { name: orderId, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ClaimType' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/ClaimState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClaimSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /claims/{claimId}:
    get:
      tags: [claims]
      summary: 클레임 상세 (심사 결과·회수·환불·재배송 상태를 각각 표시)
      operationId: getClaim
      x-pmart-user-types: [CUSTOMER, OPERATOR]
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /claims/{claimId}/decisions:
    post:
      tags: [decisions]
      summary: "[운영자 BO-14] 심사 결정 (품목별 APPROVED/REJECTED, 회수 필요 여부)"
      description: |
        부분 승인 가능(3건 중 2건 승인 → 2건만 후속). 회수 없는 처리(skipPickup)는 승인 사유·증빙 필수.
        비용 결정(회수비·교환비)은 근거·승인자와 함께 기록. 환불 의도는 여기서 산정되며 PG 실행은 payment가 한다.
        CANCEL 유형은 S3 결과(orchestration 확정 수량)로 자동 결정되므로 운영자 결정 대상이 아니다(UNSUPPORTED_ACTION).
      operationId: createClaimDecision
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimDecisionRequest' }
      responses:
