openapi: 3.1.0
info:
  title: order-orchestration-service
  version: 0.3.0
  description: |
    사가 인스턴스·단계·타임아웃·재시도·보상 로그·결과 불명 추적·운영자 수동 개입 기록의 정본. (docs/architecture/service-map.md §2)
    주문 상태(order), 결제·재고·슬롯·작업의 성공 확정(각 정본)은 소유하지 않는다.
    사가: S1 결제 진입·확정, S2 이행·결품·부분취소, S3 취소 vs 인계, S4 예약 시간 변경 (docs/business/flows/).
    S2(2026-11-07, 슬라이스 6a): OrderConfirmed(order.order.v1) 구독으로 시작 → REQUEST_FULFILLMENT(mfc-fulfillment ConfirmOrder) →
    접수면 COMPLETED. 거절이 재시도 대상이면 AWAIT_RECOVERY(RETRY_WAITING) 뒤 새 작업 버전, 아니거나 끝나면 REQUEST_SYSTEM_CANCEL
    (claim POST /internal/claims/system-cancellations → S3) 뒤 COMPLETED. 조회는 GET /internal/sagas?orderId=&sagaType=S2_FULFILLMENT.
    모든 엔드포인트는 서비스 간 전용(/internal) — 0.3.0 의 고객 경로 `/redelivery-payments` 만 예외. BackOffice BO-12는 승인 건(approvalRef)을 동반해야 수동 개입할 수 있다.
    0.3.0(2026-11-16, ADR-0065 고객 잘못 오배송 다시 배송 9,000원): delivery-dispatch `RedeliveryPaymentRequired`(delivery.delivery.v1) 구독 →
    결제 시도 생성(payment `POST /internal/payments`, 주문 참조 `RDL-<caseId>` — 원래 주문 결제와 별개, customerRef = 주문 accountId, 만료 = 기한) →
    고객 앱이 결제위젯으로 결제(orderId = paymentAttemptId) 후 payment `POST /payment-confirmations` → PaymentApproved 면 dispatch 다시 배송 풀기
    (`POST /internal/deliveries/{id}/redelivery-releases`). **30분** 기한까지 승인이 없거나 고객이 거절하면 dispatch 에 회수로 바꾸기
    (`…/redelivery-cancellations`) + 재발송 사가 CUSTOMER_REFUND(회수 후 상품값 − 9,000원 환불). 기한 뒤 늦은 승인은 보상 취소.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: sagas, description: 사가 조회·수동 개입 }
  - { name: checkout, description: S1 시작 (order-service) }
  - { name: cancellation, description: S3 시작 (claim-service) }
  - { name: redelivery-payment, description: '오배송 다시 배송 9,000원 결제 대기(고객 앱 — ADR-0065)' }

paths:
  /redelivery-payments:
    get:
      tags: [redelivery-payment]
      summary: "[고객 앱] 내 오배송 다시 배송 결제 대기 목록"
      description: |
        고객 토큰만 — 본인(주문 accountId) 것만, 최근 순 20건. 결제할 것은 status WAITING_PAYMENT 인 건의 paymentAttemptId 로
        결제위젯(orderId = paymentAttemptId, amount, orderName)을 띄우고 payment-service `POST /payment-confirmations` 로 승인 요청한다.
        결제 결과는 payment `GET /payments/{paymentAttemptId}` 로 본다. paymentAttemptId 가 비었으면(결제 시도 준비 중) 잠시 뒤 다시 읽는다.
      operationId: listRedeliveryPayments
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: orderId, in: query, schema: { type: string, maxLength: 64 }, description: 이 주문 것만 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RedeliveryPayment' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /redelivery-payments/{redeliveryPaymentId}/payment-attempts:
    post:
      tags: [redelivery-payment]
      summary: "[고객 앱] 결제 다시 시도 — 앞 결제 시도가 실패·만료됐으면 새 결제 시도"
      description: |
        기한 안의 결제 대기(WAITING_PAYMENT)만. 지금 결제 시도가 아직 쓸 수 있거나 진행 중이면 그대로, 실패·취소됐으면 새 시도를 만든다(paymentAttemptId 가 바뀐다).
        남의 것·없는 것 404, 결제 대기가 아니면(기한 지남·거절·결제됨) 409 INVALID_STATE.
      operationId: retryRedeliveryPayment
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: redeliveryPaymentId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: 지금 쓸 결제 시도
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeliveryPayment' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /redelivery-payments/{redeliveryPaymentId}/declines:
    post:
      tags: [redelivery-payment]
      summary: "[고객 앱] 결제하지 않고 회수 후 환불 고르기"
      description: |
        고객이 9,000원 결제 대신 "회수 후 취소·환불"을 고른다(ADR-0065 결정 3) — 잘못 간 상품은 회수, 환불은 상품값 − 9,000원.
        이미 결제됐으면 409 ALREADY_PAID(결제가 처리 중이면 결과가 나온 뒤 판단). 이미 거절·기한 지남이면 그대로 200.
      operationId: declineRedeliveryPayment
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: redeliveryPaymentId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeliveryPayment' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: ALREADY_PAID
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/sagas:
    get:
      tags: [sagas]
      summary: "[bo/order→orchestration] 원요청 ID로 사가 목록 조회"
      operationId: listSagas
      parameters:
        - { name: orderId, in: query, schema: { type: string } }
        - { name: draftId, in: query, schema: { type: string } }
        - { name: stopRequestId, in: query, schema: { type: string } }
        - { name: sagaType, in: query, schema: { $ref: '#/components/schemas/SagaType' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/SagaState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK (orderId·draftId·stopRequestId 중 하나 이상 필수)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SagaSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/stuck-sagas:
    get:
      tags: [sagas]
      summary: "[backoffice-bff→orchestration] 멈춘 사가 목록 — 사람 손이 필요한 것(BO-12 처리 대기, 0.2.0)"
      x-added-in: '2026-11-16'
      description: |
        2026-11-16 사용자 BO-12 결정(추천대로): 운영 관리자 처리 대기 화면. 네 사가 표(결제 진입·이행 요청·취소·결품)에서
        ESCALATED·RECONCILIATION_REQUIRED·UNKNOWN_TRACKING 이고 아직 "처리 완료"로 표시되지 않은 것. 오래 멈춘 것부터.
        allowedActions = 그 사가에 의미 있는 조치 — 결제 확인 대기(UNKNOWN_TRACKING·결제 진입)는 REQUERY_RESULT(원결과 다시 확인),
        업무 거절로 멈춘 것(ESCALATED)·대사 불일치(RECONCILIATION_REQUIRED)는 MARK_RESOLVED(밖에서 해결 — 사유 필수). 같은 요청을 다시 보내도 같은 거절이라 재시도는 주지 않는다.
        서비스 간 경로(권한 검사는 backoffice-bff — OPERATOR_ADMIN).
      operationId: listStuckSagas
      parameters:
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StuckSaga' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /internal/sagas/{sagaId}:
    get:
      tags: [sagas]
      summary: 사가 상세 (단계·타임아웃·재시도·보상 로그·불명 추적·수동 개입 기록)
      description: |
        조회 결과는 orchestration이 기록한 진행 사본이다. 결제·재고·슬롯의 성공 여부는 각 정본(payment, mfc-inventory, delivery-capacity)의 원결과 조회로만 확정한다.
      operationId: getSaga
      parameters:
        - { name: sagaId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Saga' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/sagas/{sagaId}/manual-actions:
    post:
      tags: [sagas]
      summary: "[bo→orchestration] 수동 재처리 (원결과 재조회 / 미전달 재전송 / 승인된 보상 실행)"
      description: |
        BO-12 운영자 동작. 동작은 각각 분리된다.
        0.2.0(2026-11-16 사용자 BO-12 결정): **REQUERY_RESULT·MARK_RESOLVED 는 승인 없이**(돈·재고를 움직이지 않음 — backoffice-bff 가 OPERATOR_ADMIN 만 통과시킴, operatorId·reason 필수).
        RESEND_NOTIFICATION·EXECUTE_COMPENSATION 은 approvalRef 필요(아직 구현 안 함 — 422 UNSUPPORTED_ACTION).
        - REQUERY_RESULT: 지금은 결제 진입 사가의 결제 확인 대기(WAITING_RESULT·UNKNOWN_TRACKING)만 — 결제 원결과를 바로 다시 확인해 사가를 이어 간다(자동 점검을 당겨 하는 것). 그 밖은 422 NOT_REQUERYABLE.
        - MARK_RESOLVED: ESCALATED·RECONCILIATION_REQUIRED 사가를 "사람이 밖에서 해결함"으로 표시만 한다(사가 상태·자원은 그대로, 멈춘 사가 목록에서 빠짐). 그 밖은 422 NOT_RESOLVABLE.
        같은 (X-Source-System, Idempotency-Key)는 같은 결과.
        "강제 취소 성공", "예약 강제 해제" 같은 동작은 존재하지 않는다(UNSUPPORTED_ACTION).
        - REQUERY_RESULT 지정 단계의 원결과를 소유 서비스에 재조회해 사가 상태를 갱신한다.
        - RESEND_NOTIFICATION 미전달 고객 통지만 재전송한다(상태 변경 없음).
        - EXECUTE_COMPENSATION 보상 로그에 기록된 이번 시도 신규 확보 자원만 해제한다. 해제 응답 불명은 원예약 조회로 확인 전 "해제 완료" 표시 금지.
      operationId: createManualAction
      parameters:
        - { name: sagaId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualActionRequest' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED (approvalRef 누락·미승인·만료) / UNSUPPORTED_ACTION / STEP_NOT_COMPENSABLE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/sagas/{sagaId}/manual-actions/{requestId}:
    get:
      tags: [sagas]
      summary: 수동 재처리 결과 조회
      operationId: getManualAction
      parameters:
        - { name: sagaId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualAction' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/checkout-sagas:
    post:
      tags: [checkout]
      summary: "[order→orchestration] S1 시작 (결제 진입 요청)"
      description: |
        order-service가 가격 동결·acceptedQuoteVersion 검증 후 호출. 같은 draftId+Idempotency-Key 재전송은 기존 사가 반환.
        S1 단계는 재고 예약(ttl 10분) → 작업 여력 Hold → 슬롯 Hold(예약배달만) → 결제 시작 → 승인 대사 → 주문 확정 → 자원 확정 순서다.
        ACCEPTED는 "사가 시작"이며 재고·슬롯·결제 성공이 아니다. 단계는 응답 뒤 비동기로 진행하고(동기 체인 2 hop 규칙) GET /internal/sagas/{sagaId} 로 조회한다.
        단계 명령의 Idempotency-Key 는 sagaId:단계 로 고정이라 중단 후 재개해도 정본에 한 번만 반영된다.
        결제 시작 뒤 WAITING_RESULT. 결제 원결과(사건은 깨우는 신호, 정본은 결제 시도 조회)가 승인이면 RECONCILE_PAYMENT(승인액=청구액) → CONFIRM_RESOURCES(재고·여력·슬롯) → CONFIRM_ORDER → COMPLETED.
        실패면 해제, 미승인은 자원 만료 뒤 해제(RESOURCE_EXPIRED), 불명이면 UNKNOWN_TRACKING(해제 금지), 금액 불일치면 RECONCILIATION_REQUIRED(확정·취소·해제 모두 멈춤).
        승인 뒤 확정 실패(점유 소멸 RESERVATION_LOST·주문 확정 거절)면 보상 취소(전액)를 CANCELLED 로 확인한 뒤에만 자원을 해제한다.
        같은 초안의 RUNNING·WAITING_RESULT·UNKNOWN_TRACKING·COMPENSATING·RECONCILIATION_REQUIRED·COMPLETED 사가가 있으면 409 SAGA_ALREADY_ACTIVE.
      operationId: startCheckoutSaga
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartCheckoutSagaRequest' }
      responses:
        '202':
          description: 사가 시작 접수 (resultId = sagaId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT / SAGA_ALREADY_ACTIVE (같은 draftId의 진행 중 사가 존재)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: RE_QUOTE_REQUIRED (quoteExpiresAt 경과) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/cancellation-sagas:
    post:
      tags: [cancellation]
      summary: "[claim→orchestration] S3 시작 (취소 접수 → 현장 중지 vs 인계 판정)"
      description: |
        claim-service가 자격·대상 수량 심사 후 CancellationRequested와 함께 호출. stopRequestId가 멱등 단위.
        S3 단계는 mfc-fulfillment.StopWork → 포장별 STOPPED/HANDOVER_IN_PROGRESS/HANDED_OVER → 배차 취소(전 포장 STOPPED일 때만) → 재고 복귀 확인 → order 수량 반영 → claim에 확정 수량 회신 순서다.
        취소 접수시각은 우선순위 근거가 아니다(ADR-0006). HANDED_OVER 수량은 S6(회수)로 분기.
      operationId: startCancellationSaga
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartCancellationSagaRequest' }
      responses:
        '202':
          description: 사가 시작 접수 (resultId = sagaId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT / SAGA_ALREADY_ACTIVE (같은 stopRequestId 진행 중)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: ORDER_NOT_CANCELLABLE (전량 인계·이미 취소·만료)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  schemas:
    RedeliveryPayment:
      type: object
      description: 오배송 다시 배송 9,000원 결제 대기(ADR-0065). 주소·좌표 없음.
      required: [redeliveryPaymentId, orderId, amount, status, deadlineAt, createdAt]
      properties:
        redeliveryPaymentId: { type: string }
        orderId: { type: string }
        caseId: { type: string }
        amount: { type: integer, description: 고객 부담(원) — 9,000 }
        orderName: { type: string, description: 결제위젯 주문명 }
        paymentAttemptId: { type: string, description: '결제위젯 orderId 로 그대로 쓴다. 준비 중이면 없음' }
        status:
          type: string
          enum: [WAITING_PAYMENT, PAID, DECLINED, TIMED_OUT]
          description: WAITING_PAYMENT 결제 대기, PAID 결제됨(다시 배송 배차), DECLINED 고객이 회수 후 환불 고름, TIMED_OUT 기한(30분) 지나 회수 후 환불
        deadlineAt: { type: string, format: date-time, description: 결제 기한(배송 준비 + 30분) }
        createdAt: { type: string, format: date-time }
    SagaType:
      type: string
      enum: [S1_CHECKOUT, S2_FULFILLMENT, S3_CANCELLATION, S4_RESERVATION_TIME_CHANGE]
    SagaState:
      type: string
      description: |
        RUNNING 단계 진행 중. WAITING_RESULT 하위 정본 결과 대기(타임아웃 감시). UNKNOWN_TRACKING 결과 불명 추적(1분×5회→상신→15분).
        COMPENSATING 보상 실행 중. COMPLETED 정상 종료. COMPENSATED 보상 완료 종료. ESCALATED case-service 상신(수동 개입 대기).
        RECONCILIATION_REQUIRED 대사 불일치(강제 출고·강제 취소 금지).
        RETRY_WAITING S2 작업 거절 뒤 같은 MFC 재시도 대기(1분마다 원래 예약 재확인, 처음 거절부터 W분, 2026-11-07).
        CONFIG_REQUIRED S2 재시도 설정(W·최대 횟수) 미설정 센터 — 그 주문만 보류(자동 취소하지 않음).
      enum: [RUNNING, WAITING_RESULT, UNKNOWN_TRACKING, COMPENSATING, COMPLETED, COMPENSATED, ESCALATED, RECONCILIATION_REQUIRED, RETRY_WAITING, CONFIG_REQUIRED]
    StepName:
      type: string
      enum:
        - VALIDATE_QUOTE
        - RESERVE_INVENTORY
        - HOLD_CAPACITY
        - HOLD_SLOT
        - START_PAYMENT
        - AWAIT_PAYMENT_RESULT
        - RECONCILE_PAYMENT
        - CONFIRM_ORDER
        - CONFIRM_RESOURCES
        - REQUEST_FULFILLMENT
        - STOP_WORK
        - CANCEL_ASSIGNMENT
        - RELEASE_INVENTORY
        - APPLY_LINE_QUANTITY
        - NOTIFY_CLAIM
        - AWAIT_RECOVERY
        - REQUEST_SYSTEM_CANCEL
        - HOLD_NEW_SLOT
        - RELEASE_OLD_SLOT
    StepState:
      type: string
      enum: [PENDING, IN_PROGRESS, SUCCEEDED, FAILED, UNKNOWN, SKIPPED, COMPENSATED, TIMED_OUT]
    SagaStep:
      type: object
      properties:
        step: { $ref: '#/components/schemas/StepName' }
        state: { $ref: '#/components/schemas/StepState' }
        targetSystem: { type: string, description: 명령을 보낸 정본 서비스 }
        requestId: { type: string, description: 하위 명령 멱등 키 }
        resultId:
          type: string
          description: 정본이 발급한 결과 ID (reservationId / holdId / paymentAttemptId 등)
        attempt: { type: integer, description: 재시도 횟수(1부터) }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        timeoutAt: { type: string, format: date-time }
        lastErrorCode: { type: string }
        lastErrorMessage: { type: string }
    CompensationLogEntry:
      type: object
      description: 이번 시도에서 새로 확보한 자원만 기록. 기존 약속 자원은 보상 대상이 아니다.
      properties:
        resourceType:
          type: string
          enum: [INVENTORY_RESERVATION, CAPACITY_HOLD, SLOT_HOLD, PAYMENT_APPROVAL, FULFILLMENT_WORK, DISPATCH_ASSIGNMENT]
        resourceId: { type: string }
        ownerSystem: { type: string }
        acquiredAt: { type: string, format: date-time }
        releaseState: { type: string, enum: [NOT_REQUESTED, RELEASE_REQUESTED, RELEASED, RELEASE_UNKNOWN, RELEASE_FAILED] }
        releaseRequestId: { type: string }
        releaseVerifiedAt:
          type: string
          format: date-time
          description: 원예약 조회로 해제를 확인한 시각. 확인 전에는 RELEASED로 표시하지 않는다
    UnknownTracking:
      type: object
      description: 결과 불명 추적 (1분 간격 5회 → case 상신 → 15분 간격)
      properties:
        step: { $ref: '#/components/schemas/StepName' }
        phase: { type: string, enum: [FAST_RETRY, ESCALATED, SLOW_RETRY, RESOLVED] }
        attempts: { type: integer }
        nextQueryAt: { type: string, format: date-time }
        caseId: { type: string, description: case-service 상신 건 }
        resolvedState: { type: string, enum: [SUCCEEDED, FAILED] }
        resolvedEvidenceRef: { type: string, description: PG 원거래 등 정본 증거 참조 }
    ManualActionType:
      type: string
      enum: [REQUERY_RESULT, RESEND_NOTIFICATION, EXECUTE_COMPENSATION, MARK_RESOLVED]
    ManualActionRequest:
      type: object
      required: [action, reason, operatorId]
      properties:
        action: { $ref: '#/components/schemas/ManualActionType' }
        approvalRef:
          type: string
          description: approval-service 승인 건 ID — RESEND_NOTIFICATION·EXECUTE_COMPENSATION 만 필요(0.2.0). 미승인·만료 시 APPROVAL_REQUIRED
        operatorId: { type: string, maxLength: 128, description: '조치한 직원(운영자 ID — backoffice-bff 가 토큰에서 채움, 0.2.0)', x-added-in: '2026-11-16' }
        reason: { type: string, maxLength: 500 }
        step: { $ref: '#/components/schemas/StepName' }
        compensationResourceIds:
          type: array
          description: EXECUTE_COMPENSATION일 때 해제 대상(보상 로그에 있는 ID만 허용)
          items: { type: string }
        notificationRef: { type: string, description: RESEND_NOTIFICATION 대상 통지 ID }
    StuckSaga:
      type: object
      required: [sagaId, sagaType, orderId, state, currentStep, updatedAt, allowedActions]
      x-added-in: '2026-11-16'
      properties:
        sagaId: { type: string }
        sagaType: { type: string, description: 'S1_CHECKOUT·S2_FULFILLMENT·S3_CANCELLATION·SHORTAGE(결품 사가)·RESHIPMENT(오배송 재발송 사가 — 2026-11-16)' }
        orderId: { type: string, description: 'RESHIPMENT 가 주문을 찾기 전에 멈췄으면 빈 문자열 — lastErrorMessage 앞에 오배송 사건·배송 ID' }
        state: { type: string, enum: [ESCALATED, RECONCILIATION_REQUIRED, UNKNOWN_TRACKING] }
        currentStep: { type: string }
        lastErrorStep: { type: [string, 'null'] }
        lastErrorCode: { type: [string, 'null'] }
        lastErrorMessage: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time, description: 마지막으로 바뀐 시각(멈춘 시각) }
        allowedActions: { type: array, items: { $ref: '#/components/schemas/ManualActionType' } }
    ManualAction:
      type: object
      properties:
        requestId: { type: string }
        sagaId: { type: string }
        action: { $ref: '#/components/schemas/ManualActionType' }
        approvalRef: { type: string }
        operatorId: { type: string }
        state: { type: string, enum: [ACCEPTED, EXECUTING, SUCCEEDED, FAILED, UNKNOWN] }
        resultSummary: { type: string }
        requestedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    SagaSummary:
      type: object
      properties:
        sagaId: { type: string }
        sagaType: { $ref: '#/components/schemas/SagaType' }
        state: { $ref: '#/components/schemas/SagaState' }
        orderId: { type: string }
        draftId: { type: string }
        currentStep: { $ref: '#/components/schemas/StepName' }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Saga:
      type: object
      properties:
        sagaId: { type: string }
        sagaType: { $ref: '#/components/schemas/SagaType' }
        state: { $ref: '#/components/schemas/SagaState' }
        version: { type: integer }
        orderId: { type: string }
        draftId: { type: string }
        originRequestId:
          type: string
          description: 시작 명령의 Idempotency-Key (checkout requestId / stopRequestId)
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        currentStep: { $ref: '#/components/schemas/StepName' }
        steps: { type: array, items: { $ref: '#/components/schemas/SagaStep' } }
        compensationLog: { type: array, items: { $ref: '#/components/schemas/CompensationLogEntry' } }
        unknownTracking: { type: array, items: { $ref: '#/components/schemas/UnknownTracking' } }
        reconciliation:
          type: object
          description: 대사 불일치 사건 (승인액 ≠ 청구액, WorkStopResult vs PackageHandedOver 충돌 등)
          properties:
            kind: { type: string, enum: [AMOUNT_MISMATCH, HANDOVER_CONFLICT, RELEASE_UNVERIFIED, RESULT_CONFLICT] }
            caseId: { type: string }
            detectedAt: { type: string, format: date-time }
        manualActions: { type: array, items: { $ref: '#/components/schemas/ManualAction' } }
        timers:
          type: object
          properties:
            quoteExpiresAt: { type: string, format: date-time, description: 가격 동결 10분 }
            reservationExpiresAt: { type: string, format: date-time, description: 재고 예약 10분 }
            paymentPendingHold: { type: boolean, description: 불명 시 결제 확인 대기 점유로 전환(해제 금지) }
        payment:
          type: object
          description: START_PAYMENT 성공 후 결제창 진입 정보(payment-service 응답 사본, 비밀값 없음). order-service 가 초안 nextAction=PAY 로 고객에게 준다
          properties:
            paymentAttemptId: { type: string }
            amount: { $ref: '_common.yaml#/components/schemas/Money' }
            orderName: { type: string }
            provider: { type: string, enum: [TOSS_PAYMENTS] }
            pgOrderId: { type: string }
            clientKey: { type: string }
            checkoutUrl: { type: string }
            expiresAt: { type: string, format: date-time }
        lastError:
          type: object
          description: 실패·보상으로 끝난 사가의 원인(첫 실패 단계의 정본 오류 코드)
          properties:
            step: { $ref: '#/components/schemas/StepName' }
            code: { type: string, description: '예 INSUFFICIENT_STOCK, CAPACITY_EXCEEDED, SLOT_NOT_SELECTABLE, CONFIG_REQUIRED, RE_QUOTE_REQUIRED, RESOURCE_EXPIRED' }
            message: { type: string }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    StartCheckoutSagaRequest:
      type: object
      required: [draftId, orderId, purchaseIntentId, acceptedQuoteVersion, quoteExpiresAt, mfcId, deliveryMode, amount, customerRef, lines]
      properties:
        draftId: { type: string }
        orderId: { type: string, description: order-service 가 결제 진입 때 발급한 주문 ID(재고 예약·슬롯·결제의 orderId) }
        purchaseIntentId: { type: string }
        customerRef: { type: string, description: 고객 계정 ID(결제 시도 소유 확인용) }
        orderName: { type: string, maxLength: 100, description: 결제창 표시용 주문명 }
        demand:
          type: object
          description: 작업 여력 환산 입력(mfc-capacity CapacityDemand 사본)
          properties:
            lineCount: { type: integer }
            itemCount: { type: integer }
            weightG: { type: integer }
            plannedShipments: { type: integer }
        acceptedQuoteVersion: { type: integer }
        quoteExpiresAt: { type: string, format: date-time }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        arrivalWindow:
          type: object
          description: SCHEDULED일 때 필수 (date는 Asia/Seoul)
          properties:
            date: { type: string, format: date }
            start: { type: string, example: '13:00' }
            end: { type: string, example: '14:00' }
        amount: { $ref: '_common.yaml#/components/schemas/Money' }
        currency: { type: string, enum: [KRW], default: KRW }
        paymentMethod: { type: string, enum: [TOSS_PAYMENTS] }
        containsAlcohol: { type: boolean, description: 주류 포함 시 PG 결제 인증 결과 확인 필수 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [orderLineId, sku, quantity]
            properties:
              orderLineId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
    StartCancellationSagaRequest:
      type: object
      required: [claimId, stopRequestId, orderId, scope, lines]
      properties:
        claimId: { type: string }
        stopRequestId: { type: string, description: StopWork 멱등 키. 같은 ID 재전송은 기존 사가 }
        orderId: { type: string }
        scope: { type: string, enum: [FULL, PARTIAL] }
        reason: { type: string, enum: [CUSTOMER_REQUEST, SHORTAGE_CANCEL_ALL, DISPATCH_FAILED, OPERATION_RESTRICTED, FULFILLMENT_REJECTED] }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [orderLineId, qty]
            properties:
              orderLineId: { type: string }
              qty:
                type: integer
                minimum: 1
                description: 취소 요청 수량 (원수량 − 기취소 − 인계 − 진행 클레임 이내)
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
