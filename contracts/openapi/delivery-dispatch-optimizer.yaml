openapi: 3.1.0
info:
  title: delivery-dispatch-optimizer
  version: 0.1.1
  description: |
    AI 추천 배차 계산 서버(Python FastAPI, ADR-0058 결정 9~13). delivery-dispatch 만 부르는 내부 계산 API — 자체 DB·사건 없음, 게이트웨이에 열지 않음, 상태 없음.
    원문 Delivery §2.1 ③: 기사·주문 정보, 거리·이동시간 행렬, 배차 제약을 받아 기사별 담당 주문과 방문 순서를 낸다. 모델은 RouteFinder(ai4co).
    결과는 "배정안"이다 — delivery-dispatch 가 검증·제안·확정한다(④). 이 서버가 답하지 않거나(3초) 오류면 dispatch 는 OR-Tools 로 대신한다(결정 13).
    시각·거리는 초·미터 정수, 좌표는 WGS84. 고객 주소·이름은 받지 않는다(좌표·배송 ID 만).
    0.1.1(2026-11-13, PC 1 검토 L6): betweenSeconds 행·열과 allowedDeliveryIds 도 최대 50 — 넘으면 400.
servers:
  - url: /api/v1

paths:
  /internal/dispatch-plans:
    post:
      tags: [internal]
      summary: "[delivery-dispatch→optimizer] 라이더 ↔ 배송 묶음 배정안 계산"
      description: |
        알뜰배달(bundlable=true)끼리만 1~maxBundleSize 건으로 묶고 방문 순서를 정한다. 그 밖 배송은 1건 묶음.
        라이더는 묶음 하나까지, 그 라이더가 갈 수 있는 배송(allowedDeliveryIds)·남은 용량(capacity) 안에서만. 짝짓지 못한 배송은 결과에 없다.
        묶었을 때 어느 배송이든 바로 갈 때(directSeconds)보다 maxExtraSeconds 넘게 늦어지면 그 묶음은 나눈다(도로 시간 기준).
      operationId: planDispatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
      responses:
        '200':
          description: 배정안
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanResponse' }
        '400':
          description: VALIDATION_FAILED — 행렬 크기·참조가 맞지 않음
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: MODEL_UNAVAILABLE — 모델을 올리지 못함(dispatch 는 OR-Tools 로 대신)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /health:
    get:
      tags: [ops]
      summary: 살아 있음 + 모델 적재 여부
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [UP, DEGRADED] }
                  model: { type: string, description: '적재된 모델(예 routefinder rf-transformer-100), 없으면 null' }

components:
  schemas:
    Point:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    PlanDelivery:
      type: object
      required: [deliveryId, at, directSeconds, readyInSeconds, bundlable]
      properties:
        deliveryId: { type: string }
        at: { $ref: '#/components/schemas/Point' }
        directSeconds: { type: integer, minimum: 0, description: 'MFC → 고객 도로 소요(카카오모빌리티)' }
        readyInSeconds: { type: integer, minimum: 0, description: 지금부터 출하 대기까지 }
        bundlable: { type: boolean, description: '알뜰배달이면 true(한집·예약은 false)' }
    PlanRider:
      type: object
      required: [riderId, pickupSeconds, capacity, allowedDeliveryIds]
      properties:
        riderId: { type: string }
        pickupSeconds: { type: integer, minimum: 0, description: '라이더 → MFC 도로 소요' }
        capacity: { type: integer, minimum: 1, maximum: 3, description: 이번에 더 맡을 수 있는 배송 수 }
        allowedDeliveryIds: { type: array, maxItems: 50, items: { type: string }, description: '반경 단계 안·이번 회차 미제안' }
    PlanRequest:
      type: object
      required: [mfc, deliveries, riders, betweenSeconds, maxBundleSize, maxExtraSeconds, lateWeight]
      properties:
        mfc: { $ref: '#/components/schemas/Point' }
        deliveries: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/PlanDelivery' } }
        riders: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/PlanRider' } }
        betweenSeconds:
          type: array
          description: '[i][j] = deliveries[i] 고객 → deliveries[j] 고객 도로 소요(초), 길 없음·모름은 null. deliveries 순서, 정사각'
          maxItems: 50
          items: { type: array, maxItems: 50, items: { type: [integer, 'null'] } }
        maxBundleSize: { type: integer, minimum: 1, maximum: 3 }
        maxExtraSeconds: { type: integer, minimum: 0 }
        lateWeight: { type: integer, minimum: 1, description: '출하 대기보다 늦게 도착한 초의 가중(비용식 — dispatch BundleProblem 과 같음)' }
    PlanAssignment:
      type: object
      required: [riderId, deliveryIds]
      properties:
        riderId: { type: string }
        deliveryIds: { type: array, minItems: 1, maxItems: 3, items: { type: string }, description: 방문 순서 }
    PlanResponse:
      type: object
      required: [assignments, solver]
      properties:
        assignments: { type: array, items: { $ref: '#/components/schemas/PlanAssignment' } }
        solver: { type: string, description: '예 ROUTEFINDER rf-transformer-100' }
        computeMillis: { type: integer }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
