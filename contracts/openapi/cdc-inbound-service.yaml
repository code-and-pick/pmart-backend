openapi: 3.1.0
info:
  title: cdc-inbound-service
  version: 0.2.1
  description: |
    0.2.1(2026-11-26, 고침): 결정 역할을 직원 권한 정본(docs/architecture/auth/staff-roles.md)의 센터 관리자 `CDC_SUPERVISOR` 로 — 전에는 정본에 없는 `CDC_MANAGER` 를 요구해 LAN 관리자(claude-cdc-sup)도 403 이었다. 경로·모양 변화 없음.
    CDC 적치 지시·내부 이동 MOV·피킹 위치 최소 이하 자동 보충·가상 설비 어댑터 결과 검증의 정본. (docs/architecture/service-map.md §4)
    1~2단계 범위는 적치·MOV·보충. ASN·실수령·검수·입고 차이는 3단계(x-stage 3 자리표시자).
    수량은 cdc-inventory, 공간 예약은 cdc-location, 품질 판정은 cdc-quality가 정본.
    사가 S7: location 공간 선점 → inventory 이동 반영 → 작업 완료. 실패 시 이번 선점분만 해제한다.
    0.2.0(2026-11-26, 첫 구현 — 사용자 "입고·적치·보충"·"적치 지시까지"·"박스 입수"): 작업 하나 = 출발 칸 → 목적 칸 이동 한 줄(PUTAWAY 운영자 지시·REPLENISHMENT 자동 보충).
      만들 때 cdc-location 공간 예약(현물은 cdc-inventory 스냅샷) → DISPATCHED → 가상 설비가 다음 작업 받기(claim) → 결과(work-results 증가분, eventId 한 번) → cdc-inventory move-postings →
      cdc-location 예약 소비. 실패·취소는 남은 예약만 해제(이미 옮긴 것은 그대로). 자동 보충은 최소 이하 피킹 선반만(설정 없는 칸은 보충하지 않음 — 설정 대기). ASN·실수령·검수는 3단계 그대로.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: putaway-tasks, description: 적치 지시 (CREATED→RESERVED→DISPATCHED→IN_PROGRESS→PARTIALLY_COMPLETED→COMPLETED / FAILED→RETRY_READY / CANCELLED) }
  - { name: replenishment-moves, description: 피킹 위치 보충 MOV }
  - { name: internal, description: 서비스 간 호출 (가상 설비 어댑터 등) }
  - { name: asn, description: ASN·실수령·검수 (3단계) }

paths:
  /cdcs/{cdcId}/putaway-tasks:
    post:
      tags: [putaway-tasks]
      summary: '[0.2.0] 적치 지시 — 출발 칸의 재고를 목적 칸으로 (운영자)'
      description: |
        WMS CDC-F-010. 그 센터 운영자. 줄 하나(sku·lot·출발·목적·qty·품질 상태 기본 RELEASED). 검사(트랜잭션 밖):
        출발 칸에 예약 안 된 그 SKU·LOT·품질 현물 ≥ qty(cdc-inventory 스냅샷, 아니면 409 SOURCE_SHORT) · 목적 칸 ACTIVE·PICK_FACE/RESERVE·온도대 = 상품 보관 온도(409 DESTINATION_INVALID) ·
        목적 칸 공간 예약(cdc-location — 넘치면 409 CAPACITY_EXCEEDED). 통과하면 DISPATCHED(가상 설비가 받아 갈 수 있음). 같은 Idempotency-Key·같은 본문은 같은 작업.
      operationId: createPutawayTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutawayTaskInput' }
      responses:
        '201':
          description: 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PutawayTask' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: SOURCE_SHORT / DESTINATION_INVALID / CAPACITY_EXCEEDED / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    get:
      tags: [putaway-tasks]
      summary: '[0.2.0] 적치·보충 작업 목록 — 최신 순'
      operationId: listPutawayTasks
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/PutawayTaskState' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/PutawayTaskKind' } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PutawayTask' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cdcs/{cdcId}/putaway-tasks/{taskId}:
    get:
      tags: [putaway-tasks]
      summary: '[0.2.0] 작업 조회 — 진행·결과 이력'
      operationId: getPutawayTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PutawayTask' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/putaway-tasks/{taskId}/cancellations:
    post:
      tags: [putaway-tasks]
      summary: '[0.2.0] 작업 취소 — 남은 수량만(이미 옮긴 것은 그대로), 남은 공간 예약 해제'
      description: |
        CDC_SUPERVISOR. DISPATCHED·IN_PROGRESS·PARTIALLY_COMPLETED 만, 반영 중인 결과가 있으면 409 RESULT_IN_FLIGHT(결과가 끝난 뒤). 취소 요청만으로 운반 중 물건이 돌아온 것으로 보지 않는다 — 결과가 나중에 오면 받지 않는다(409).
      operationId: cancelPutawayTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: 취소된 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PutawayTask' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /cdcs/{cdcId}/replenishment-checks:
    get:
      tags: [replenishment-moves]
      summary: '[0.2.0] 자동 보충 판단 — 피킹 선반마다 마지막 계산(지시량 또는 0 의 사유)'
      description: |
        WMS CDC-F-013 "계산 결과 0은 작업을 만들지 않고 부족·단위·용량 사유를 표시". 주기 감지(`pmart.inbound.replenishment-interval`)의 칸별 마지막 결과 — 칸 코드 순.
        reason: ABOVE_MIN(최소 초과) · CREATED(작업 만듦) · OPEN_TASK_COVERS(진행 중 보충이 채움) · UNIT_MISSING(박스 입수 미등록 — 설정 대기) · NO_SKU(빈 칸 — 어떤 SKU 칸인지 모름) ·
        SOURCE_SHORT(랙 적격 재고 부족) · ROOM_SHORT(칸 여유 부족) · BELOW_UNIT(배수 때문에 0) · RESERVE_FAILED(공간 예약 실패).
      operationId: listReplenishmentChecks
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: reason, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReplenishmentCheck' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /internal/putaway-task-claims:
    post:
      tags: [internal]
      summary: '[가상 설비→cdc-inbound] 다음 작업 받기 (0.2.0) — DISPATCHED 하나를 이 설비에 (만든 순)'
      description: |
        한 작업 한 설비(`FOR UPDATE SKIP LOCKED`). 이 설비가 이미 IN_PROGRESS·PARTIALLY_COMPLETED 작업을 들고 있으면 그것. 없으면 204. 같은 Idempotency-Key 는 같은 결과(시뮬레이터 요청 — 여러 대가 같은 작업을 집지 않게).
      operationId: claimPutawayTask
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, deviceId]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                deviceId: { type: string, maxLength: 64 }
                kinds: { type: array, items: { $ref: '#/components/schemas/PutawayTaskKind' } }
      responses:
        '200':
          description: 받은 작업(IN_PROGRESS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PutawayTask' }
        '204': { description: 받을 작업 없음 }

  /internal/work-results:
    post:
      tags: [internal]
      summary: '[가상 설비→cdc-inbound] 작업 결과 (0.2.0) — eventId 한 번, 완료 증가분만 재고 이동'
      description: |
        WMS CDC-F-011. 그 작업을 받은 설비만(409 NOT_CLAIMED). SUCCESS = 남은 전량 완료(completedQty = 남은 수량, 아니면 400) · PARTIAL = 일부(completedQty ≤ 남은 수량) · FAILED = 더 못 함(completedQty 0).
        완료 증가분은 cdc-inventory move-postings(PUTAWAY·REPLENISHMENT_MOVE, 키 `inb-move-<eventId>`) → cdc-location 예약 소비 → 작업 completedQty +. SUCCESS·누계 = 지시량이면 COMPLETED, 일부면 PARTIALLY_COMPLETED.
        FAILED 면 FAILED + 남은 예약 해제. 재고가 거절하면 그 결과 REJECTED·작업 FAILED(남은 예약 해제), 응답 불명이면 결과 PENDING(서버가 같은 키로 다시). 같은 eventId 는 같은 응답(본문이 다르면 409). Idempotency-Key 는 공통 헤더 검사용 — eventId 를 그대로 쓴다(한 번 처리는 eventId 가 지킨다).
      operationId: receiveWorkResult
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, taskId, deviceId, status, completedQty]
              properties:
                eventId: { type: string, maxLength: 64 }
                taskId: { type: string }
                deviceId: { type: string, maxLength: 64 }
                status: { type: string, enum: [SUCCESS, PARTIAL, FAILED] }
                completedQty: { type: integer, minimum: 0, description: 이번 증가분 }
                failureReason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: 결과 반영 뒤 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PutawayTask' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /asn:
    post:
      tags: [asn]
      summary: ASN 등록 (공급사 입고 예정) → 실수령·검수·입고 차이
      description: 3단계. 1차 제외 (SCM 문서 0.1). CDC 실입고 확정은 cdc-inbound 3단계에서 정의한다.
      operationId: createAsn
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 3단계 자리표시자. 공급사 사용자 종류가 없어 직원 대리 등록으로 봄"
      x-stage: 3
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }

  /asn/{asnId}:
    get:
      tags: [asn]
      summary: ASN 조회
      description: 3단계. 1차 제외 (SCM 문서 0.1)
      operationId: getAsn
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 3단계 자리표시자. CDC 센터 직원 조회로 봄"
      x-stage: 3
      parameters:
        - { name: asnId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK (3단계 정의 예정)
          content:
            application/json:
              schema:
                type: object
                properties:
                  asnId: { type: string }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    PutawayTaskState:
      type: string
      description: (0.2.0) RESERVED·CREATED 는 만드는 중의 짧은 상태. DISPATCHED = 설비가 받아 갈 수 있음, IN_PROGRESS = 받음.
      enum: [CREATED, RESERVED, DISPATCHED, IN_PROGRESS, PARTIALLY_COMPLETED, COMPLETED, FAILED, CANCELLED]
    PutawayTaskKind:
      type: string
      description: PUTAWAY(운영자 적치 지시) · REPLENISHMENT(최소 이하 자동 보충 — 수동 생성 없음, CDC-F-013)
      enum: [PUTAWAY, REPLENISHMENT]
    PutawayTaskInput:
      type: object
      required: [sku, lot, fromLocationCode, toLocationCode, qty]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        lot: { type: string }
        fromLocationCode: { type: string }
        toLocationCode: { type: string }
        qty: { type: integer, minimum: 1 }
        qualityState: { type: string, enum: [RELEASED, HELD, QUARANTINED], default: RELEASED }
        reason: { type: string, maxLength: 300 }
    PutawayTask:
      type: object
      properties:
        taskId: { type: string }
        cdcId: { type: string }
        kind: { $ref: '#/components/schemas/PutawayTaskKind' }
        state: { $ref: '#/components/schemas/PutawayTaskState' }
        sku: { type: string }
        lot: { type: string }
        qualityState: { type: string }
        fromLocationCode: { type: string }
        toLocationCode: { type: string }
        qty: { type: integer }
        completedQty: { type: integer }
        reservationId: { type: [string, 'null'], description: cdc-location 공간 예약 }
        deviceId: { type: [string, 'null'] }
        createdBy: { type: string }
        reason: { type: [string, 'null'] }
        failureReason: { type: [string, 'null'] }
        results:
          type: array
          items:
            type: object
            properties:
              eventId: { type: string }
              status: { type: string }
              completedQty: { type: integer }
              state: { type: string, enum: [PENDING, APPLIED, REJECTED], description: 재고 반영 상태 }
              commitId: { type: [string, 'null'] }
              rejectReason: { type: [string, 'null'] }
              receivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReplenishmentCheck:
      type: object
      properties:
        locationCode: { type: string }
        sku: { type: [string, 'null'] }
        currentQty: { type: [integer, 'null'] }
        minQty: { type: integer }
        targetQty: { type: integer }
        openQty: { type: [integer, 'null'], description: 진행 중 보충 }
        needQty: { type: [integer, 'null'] }
        orderedQty: { type: [integer, 'null'], description: 이번에 만든 지시량 }
        unitQty: { type: [integer, 'null'], description: 박스 입수 }
        reason: { type: string }
        taskId: { type: [string, 'null'] }
        checkedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
