openapi: 3.1.0
info:
  title: customer-assistant-service
  version: 0.6.0
  x-stage: 3
  x-stage-note: 고객앱 RAG 1차(2026-11-09, ADR-0051) — 고객 공개 안내 문서 질의응답 + 근거 표시 + 내 주문 상태 안내 + 고객센터 문의 연결.
  description: |
    0.4.0(2026-11-23, 고객앱 BR-91 — 사용자 "2번으로"(PC 1 이 넣음, PC 4 확인)·"추천대로"(글 없이)): FAQ 답 의견 [도움이 되었어요]/[수정이 필요해요].
    `POST /customer-assistant/faqs/{faqId}/feedback` {helpful} — 회원 고객, 한 고객 한 FAQ 하나(다시 누르면 마지막 값으로 바꿈 — 같은 요청을 다시 보내도 안전), 글은 받지 않는다.
    FAQ 항목 `myFeedback`(회원이 누른 값, 없으면 null). 운영 집계 `GET /customer-assistant/faq-feedback`(CS_AGENT·OPERATOR_ADMIN) — 고객 화면엔 숫자 없음.
    0.4.1(2026-11-23 CA-3 — PC 2 요청): 집계 줄에 `categoryTitle`(안내 문서 제목 — FaqItem.categoryTitle 과 같은 값, 지금 색인에 없으면 null). 직원 화면이 분류 이름을 고정하지 않게.
    0.5.0(2026-11-23 CA-2 — PC 2 요청, 사용자 "A는 문의나 채팅에 입력 자체가 안 되게"·"B도"): 질문에 **막기 단어**(욕설 — 설정
    `pmart.assistant.customer.blocked-words`, case `pmart.cases.blocked-words` 와 같은 목록)가 있으면 422 `BLOCKED_WORDS` 로 받지 않는다.
    답하지 않고, 정지 없음, 질문·요청 해시를 저장하지 않으며(같은 키로 고쳐 보내도 된다) 요청 제한에도 세지 않는다. 대조는 case 와 같게 소문자 + 띄어쓰기·문장부호 제거 뒤 포함 비교.
    faqId 는 같은 문서·같은 질문이면 재색인해도 같아 의견이 이어진다(질문 문구를 고치면 새 faqId — 옛 의견은 집계에 옛 id 로 남는다).
    고객앱 고객센터 채팅의 AI 상담(RAG). 승인된 고객 공개 안내 문서(`docs/business/customer-faq/`)만 검색해 근거와 함께 답한다.
    운영자 문서·답변은 다른 서비스(ai-assistant-service)가 갖고, 이 서비스는 그 DB 에 접속할 계정이 없다(ADR-0051).

    **누가**: 로그인한 회원 고객만(typ=CUSTOMER). 비회원(GUEST)·운영자 토큰은 403(사용자 결정 2026-11-09 C2).
    **출처(X-Source-System)**: 토큰에 `src` 가 있으면 헤더와 같아야 한다. 없으면 `customer-app` 만 허용한다.

    **요청 제한(C3)**: 고객마다 1분에 5개, 하루(Asia/Seoul 자정 기준) 50개. 넘으면 429 `RATE_LIMITED` + `Retry-After`(초).
    같은 Idempotency-Key 재전송(같은 답 다시 받기)은 세지 않는다.

    **질문 저장(C5)**: 질문 원문은 저장하지 않는다 — 요청 해시(sha256)만. 그래서 질문 목록 API 가 없다(채팅 기록은 앱 화면에만).
    답변 문장·인용·고른 주문 ID 는 같은 키 재조회를 위해 저장한다.

    **결과(state)**
    - `ANSWERED`: 안내 문서를 근거로 답함.
    - `NO_GROUNDING`: 안내 문서에서 근거를 못 찾음 → `handoff`(고객센터 문의 남기기, C4).
    - `REALTIME_DATA_REQUIRED`: 특정 주문의 지금 상태를 물었는데 주문을 고르지 않음 → `recentOrders`(최근 주문 최대 5개)에서 고르게 한다(C6).
    - `ORDER_STATUS`: 고른 주문의 지금 상태를 물음 → 주문 상태를 order-service 에서 읽어 정해진 문장으로 답한다(모델이 상태를 지어내지 않는다).
    - `PRODUCT_INFO`(0.3.0, ADR-0083): 상품의 가격·판매 여부를 물음 → search-service 상품 검색 결과를 정해진 문장으로 답한다(`answerMode`
      `PRODUCT_TEMPLATE`, 근거 문서 없음, 센터 취급 여부는 답하지 않음). 검색 결과가 없거나 검색이 안 되면 안내 문서로 답한다.
    - `OUT_OF_SCOPE`: 취소·환불·반품 같은 실행 요청, 지시 무력화 시도 → 하지 않음 + `handoff`.
    - `PROCESSING`: 같은 키가 처리 중(202).

    **주문(orderId)**: 고르면 서버가 고객 토큰을 order-service `GET /orders/{orderId}` 로 넘겨 본인 주문인지 확인한다(남의·없는 주문 422 `ORDER_NOT_FOUND`).
    응답의 `order` 는 응답할 때마다 order-service 에서 새로 읽는다(저장하지 않음). 읽지 못하면 null.
    주문 정보는 모델에 넘기지 않는다 — 안내 답변은 문서만 근거로 한다.

    **멱등**: 범위는 (sourceSystem, 고객 subject, Idempotency-Key). 요청 해시 = sha256(정규화 질문 + "\n" + {"orderId"} JSON).
    같은 키에 다른 질문·주문이면 409 `IDEMPOTENCY_CONFLICT`. 최초 응답을 잃으면 `GET /customer-assistant/questions?requestId=`.

    **FAQ 목록·검색(0.2.0, 2026-11-18 — 사용자 "A해줘", 고객앱 빠진 기능 "FAQ 목록·검색")**: `GET /customer-assistant/faqs`·`/faqs/{faqId}`.
    AI 상담이 근거로 쓰는 **같은 고객 안내 문서·같은 색인 스냅숏(ACTIVE)** 에서 나온다 — 색인할 때 문서의 `## 질문` 절마다 한 항목(질문 = 절 제목, 답 = 절 본문)으로 나눠 두므로
    FAQ 화면과 AI 답변의 근거가 어긋나지 않는다(안내 문서를 고치면 재색인 때 함께 바뀐다). 모델·임베딩을 부르지 않고, 요청 제한(C3)에 세지 않으며, 검색어를 저장·로그하지 않는다.
    누가: 다른 고객 API 와 같이 로그인한 회원 고객만(C2 — 비회원·운영자 403). 색인 전이거나 이 기능 전에 만든 색인이면 422 `CONFIG_REQUIRED`(재색인 필요 — 빈 목록으로 숨기지 않는다).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: ops, description: 운영 정보 }
  - { name: customer-assistant, description: 고객센터 AI 상담(읽기 전용) }
  - { name: faqs, description: '고객센터 FAQ 목록·검색(0.2.0) — AI 상담과 같은 안내 문서' }
  - { name: knowledge, description: '(0.6.0) 고객 RAG 문서 관리 — 직원(OPERATOR)만, 보기·초안, 반영은 승인으로(ADR-0094)' }
  - { name: internal, description: '(0.6.0) 서비스 사이(토큰 없음)' }

paths:
  /actuator/health:
    get:
      tags: [ops]
      summary: 헬스 (인증 불필요)
      operationId: getCustomerAssistantHealth
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE] }

  /customer-assistant/questions:
    post:
      tags: [customer-assistant]
      summary: 고객센터 AI 상담 질문 — 안내 문서를 근거로 답한다(같은 Idempotency-Key 재전송은 같은 답)
      operationId: askCustomerQuestion
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerQuestion' }
            example:
              question: 상품 준비가 시작된 주문도 취소할 수 있나요?
      responses:
        '200':
          description: 완료 — ANSWERED · NO_GROUNDING · REALTIME_DATA_REQUIRED · ORDER_STATUS · OUT_OF_SCOPE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
              examples:
                answered: { $ref: '#/components/examples/Answered' }
                noGrounding: { $ref: '#/components/examples/NoGrounding' }
                realtime: { $ref: '#/components/examples/RealtimeRequired' }
                orderStatus: { $ref: '#/components/examples/OrderStatus' }
        '202':
          description: 같은 키가 다른 요청에서 처리 중 — Retry-After 뒤 GET ?requestId= 로 조회
          headers:
            Retry-After: { schema: { type: integer }, description: 초 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: IDEMPOTENCY_CONFLICT — 같은 Idempotency-Key 를 다른 질문·주문에 썼다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: |
            ORDER_NOT_FOUND(남의·없는 주문), CONFIG_REQUIRED(안내 문서 색인 전) 또는 BLOCKED_WORDS(0.5.0 — 질문에 쓸 수 없는 말,
            detail "쓸 수 없는 말이 들어 있어요. 고쳐서 다시 보내 주세요." 를 그대로 보여 준다. 걸린 단어는 알려 주지 않는다)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '429':
          description: RATE_LIMITED — 1분 5개·하루 50개를 넘었다. Retry-After 초 뒤에 다시
          headers:
            Retry-After: { schema: { type: integer }, description: 초 }
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503':
          description: DEPENDENCY_UNAVAILABLE — 검색·모델·주문 조회 장애 또는 시간 초과. 같은 Idempotency-Key 로 다시 보낸다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    get:
      tags: [customer-assistant]
      summary: 요청 키로 답변 찾기 — 최초 응답을 잃었을 때(범위 = 출처 + 본인 + 키)
      operationId: findCustomerAnswerByRequestId
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - name: requestId
          in: query
          required: true
          description: 질문 때 보낸 Idempotency-Key
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 완료된 답변
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
        '202':
          description: 처리 중 — Retry-After 뒤 다시 조회
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 그 범위에 기록이 없다(다른 고객 포함, 존재를 드러내지 않는다)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_STATE(retryable=true) — 직전 시도가 실패했거나 처리 중 lease 가 만료됐다 → 같은 키·같은 본문으로 POST 다시
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /customer-assistant/questions/{answerId}:
    get:
      tags: [customer-assistant]
      summary: 답변 다시 보기(질문한 고객 본인만)
      operationId: getCustomerAnswer
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: answerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
        '202':
          description: 처리 중
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 없거나 다른 고객의 답변
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_STATE(retryable=true) — 실패했거나 lease 만료 → 같은 키로 POST 재시도
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /customer-assistant/recent-orders:
    get:
      tags: [customer-assistant]
      summary: '"주문 건에 대한 문의"에서 고를 최근 주문(본인, 최근 확정 순, 최대 10개) — order-service GET /orders 를 고객 토큰으로 부른다(C6)'
      operationId: listRecentOrdersForChat
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        '200':
          description: OK (요청 제한에 세지 않는다)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrderBrief' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '503':
          description: DEPENDENCY_UNAVAILABLE — 주문 조회 장애
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /customer-assistant/faqs:
    get:
      tags: [faqs]
      summary: FAQ 목록·검색(회원 고객) — 분류·검색어로 거른다
      x-added-in: '2026-11-18'
      description: |
        0.2.0(2026-11-18): AI 상담이 쓰는 ACTIVE 색인 스냅숏의 FAQ 항목. 순서 = 안내 문서 순(manifest) → 문서 안 절 순. 페이지 없음(항목 수십 개).
        `q`: 질문·답변에서 부분 문자열(대소문자 무시, 앞뒤 공백 무시, 답변의 굵게·코드 표시는 빼고 찾는다). 비우면 전체. 맞는 것이 없으면 items 빈 배열(200).
        `category`: 분류 하나(완전 일치, `categories[].category` 값). 모르는 분류는 빈 배열.
        `categories` 는 거르기와 상관없이 전체 분류와 분류마다 항목 수(앱의 분류 탭).
      operationId: listCustomerFaqs
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 검색어(부분 문자열) }
        - { name: category, in: query, schema: { type: string, maxLength: 40, pattern: '^[a-z0-9-]+$' }, description: '분류(예 cancel·delivery-status·refund)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqList' }
              example:
                items:
                  - faqId: cancel-1a2b3c4d5e
                    category: cancel
                    categoryTitle: 주문 취소
                    question: 취소하면 봉투값도 돌려받나요?
                    answer: "- **주문 전체를 취소하면** 결제 금액과 함께 **봉투값(100원)도 환불**돼요.
- 결품 등으로 **일부만 취소**되면 봉투값은 환불되지 않아요."
                categories:
                  - { category: customer-center, title: 고객센터 이용 안내, count: 5 }
                  - { category: cancel, title: 주문 취소, count: 6 }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422':
          description: CONFIG_REQUIRED — FAQ 가 든 색인이 없다(색인 전, 또는 0.2.0 전에 만든 색인 → 재색인)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /customer-assistant/faqs/{faqId}:
    get:
      tags: [faqs]
      summary: FAQ 한 항목(회원 고객)
      x-added-in: '2026-11-18'
      description: 0.2.0(2026-11-18). faqId 는 같은 문서·같은 질문이면 재색인해도 같다(질문 문구를 고치면 바뀐다). 지금 색인에 없으면 404.
      operationId: getCustomerFaq
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: faqId, in: path, required: true, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqItem' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 지금 색인에 없는 항목
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONFIG_REQUIRED — FAQ 가 든 색인이 없다(재색인)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /customer-assistant/faqs/{faqId}/feedback:
    post:
      tags: [faqs]
      summary: (0.4.0 BR-91) FAQ 답 의견 — 도움이 되었어요(true) / 수정이 필요해요(false)
      description: 회원 고객만. 한 고객 한 FAQ 에 하나 — 다시 누르면 마지막 값으로 바꾼다(같은 요청 재전송 안전). 지금 색인에 없는 FAQ 404. 글은 받지 않는다.
      operationId: sendFaqFeedback
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: faqId, in: path, required: true, schema: { type: string, maxLength: 80 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helpful]
              properties:
                helpful: { type: boolean }
      responses:
        '200':
          description: 지금 내 값
          content:
            application/json:
              schema:
                type: object
                required: [faqId, helpful]
                properties:
                  faqId: { type: string }
                  helpful: { type: boolean }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 지금 색인에 없는 FAQ
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CONFIG_REQUIRED — FAQ 가 든 색인이 없다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /customer-assistant/faq-feedback:
    get:
      tags: [faqs]
      summary: (0.4.0 BR-91) FAQ 의견 집계 — 운영(CS_AGENT·OPERATOR_ADMIN)
      description: faqId 마다 도움 수·수정 필요 수·마지막 의견 시각, 지금 색인의 질문·분류(지금 색인에 없으면 null). 수정 필요 많은 순.
      operationId: listFaqFeedbackStats
      x-pmart-user-types: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [faqId, helpfulCount, notHelpfulCount, lastAt]
                      properties:
                        faqId: { type: string }
                        category: { type: [string, 'null'] }
                        categoryTitle: { type: [string, 'null'], description: '(0.4.1 CA-3) 분류 이름(안내 문서 제목) — 지금 색인에 없는 FAQ 면 null' }
                        question: { type: [string, 'null'], description: 지금 색인의 질문(없어진 FAQ 면 null) }
                        helpfulCount: { type: integer }
                        notHelpfulCount: { type: integer }
                        lastAt: { type: string, format: date-time }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  # ---- (0.6.0) 고객 RAG 문서 관리(ADR-0094 — 운영자 RAG ADR-0092 와 같은 API) ----
  /customer-assistant/knowledge-documents:
    get:
      tags: [knowledge]
      summary: '(0.6.0) 고객 RAG 문서 목록(customer_app 16 + 고객 FAQ 13) — 판·색인 상태(본문 없음, ADR-0092)'
      description: 직원(OPERATOR) 토큰만 — 고객 토큰은 403. 운영자 누구나 본다. 문서 ID 순. `reindex` 는 마지막 재색인(승인 반영 뒤 1분 주기)의 결과.
      operationId: listKnowledgeDocuments
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: includeRetired, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocumentList' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /customer-assistant/knowledge-documents/detail:
    get:
      tags: [knowledge]
      summary: '(0.6.0) 문서 하나 — 본문(지금 판 또는 고른 판)과 판 이력'
      description: 문서 ID 에 `/` 가 있어 경로 대신 query 로 받는다.
      operationId: getKnowledgeDocument
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: documentId, in: query, required: true, schema: { type: string, maxLength: 300 } }
        - { name: version, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocumentDetail' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /customer-assistant/knowledge-applications:
    get:
      tags: [knowledge]
      summary: '(0.6.0) 최근 승인 반영 기록(최근 순)'
      operationId: listKnowledgeApplications
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeApplicationList' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /customer-assistant/knowledge-drafts:
    get:
      tags: [knowledge]
      summary: '(0.6.0) 내 열린 초안(최근 고친 순)'
      operationId: listMyKnowledgeDrafts
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDraftList' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [knowledge]
      summary: '(0.6.0) 초안 만들기 — 새 문서·고치기(UPSERT, 본문 전체)·내리기(RETIRE)'
      description: |
        편집 역할(`pmart.assistant.knowledge.editor-roles`, 기본 OPERATOR_ADMIN)만. 같은 Idempotency-Key 는 처음 만든 초안을 돌려준다
        (다른 내용이면 409 IDEMPOTENCY_CONFLICT). 응답 `approvalRequest` 를 approval-service `POST /change-requests` 에 그대로 보내(정본 customer-assistant-service)
        승인을 요청한다(→ `POST /change-requests/{id}/submissions`). 승인되면 이 서비스가 새 판을 만들고 1분 안쪽에 재색인한다.
        형식: 첫 줄 `# 제목`, 128KB 이하, 문서 ID `docs/rag/rag-docs/customer_app/<이름>.md`(AI 답변 근거 — 운영자 RAG 도 같은 판을 씀) 또는
        `docs/business/customer-faq/<이름>.md`(FAQ 목록). 금지 표현("가정"·"설계안"·"확정 정책")은 customer_app 만 본다 — FAQ 는 지위 태그
        `[확정 정책]` 을 쓰는 형식이다.
      operationId: createKnowledgeDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeDraftCreate' }
      responses:
        '201':
          description: 만듦(같은 키면 처음 것)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDraft' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: STALE_VERSION(baseVersion 이 지금 판과 다름)·INVALID_STATE(내릴 문서 없음)·IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /customer-assistant/knowledge-drafts/{draftId}:
    get:
      tags: [knowledge]
      summary: '(0.6.0) 초안 하나 + 지금 판(비교용) — 승인자도 본다(운영자 누구나)'
      operationId: getKnowledgeDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: draftId, in: path, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDraft' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    put:
      tags: [knowledge]
      summary: '(0.6.0) 열린 초안 본문 고치기(만든 사람만)'
      description: 승인을 요청한 뒤 고치면 본문 해시가 달라져 승인돼도 반영되지 않는다(REJECTED·DRAFT_CHANGED) — 새 `approvalRequest` 로 다시 요청한다.
      operationId: updateKnowledgeDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: draftId, in: path, required: true, schema: { type: string, maxLength: 40 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeDraftUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDraft' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 없거나 다른 사람의 초안
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_STATE — 닫힌 초안(반영·거절·버림)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    delete:
      tags: [knowledge]
      summary: '(0.6.0) 초안 버리기(만든 사람·열린 초안만 — 아니어도 204)'
      operationId: discardKnowledgeDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: draftId, in: path, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '204': { description: 버림(멱등) }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /internal/knowledge-documents/shared:
    get:
      tags: [internal]
      summary: '(0.6.0)[운영자 RAG → 고객 RAG] 같이 쓰는 문서(customer_app)의 지금 판 — 운영자 RAG 가 1분마다 맞춘다(ADR-0094 결정 3)'
      description: |
        토큰 없음(서비스 사이, ADR-0026 — 게이트웨이에 없음). 내린 문서는 빠진다. 운영자 RAG(ai-assistant-service)는 이 판을 자기 DB 의
        읽기 전용 사본으로 맞추고 재색인한다 — 같은 문서는 원본 하나(고객 RAG DB)로 같이 관리.
      operationId: listSharedKnowledgeDocuments
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedKnowledgeDocumentList' }


components:
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'

  schemas:
    CustomerQuestion:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 500 }
        orderId:
          type: [string, 'null']
          maxLength: 64
          description: '"주문 건에 대한 문의"로 고른 주문. 본인 주문이어야 한다(아니면 422 ORDER_NOT_FOUND)'

    FaqItem:
      type: object
      required: [faqId, category, categoryTitle, question, answer]
      x-added-in: '2026-11-18'
      properties:
        faqId: { type: string, description: '<분류>-<질문 해시 10자>' }
        category: { type: string, description: 분류(안내 문서 파일 이름에서 — 예 cancel) }
        categoryTitle: { type: string, description: 분류 이름(안내 문서 제목 — 예 "주문 취소") }
        question: { type: string, description: 질문(절 제목, 지위 표시 태그는 뺀다) }
        answer: { type: string, description: '답(절 본문, 마크다운 — 목록·굵게·표). 지위 표시 태그는 빼고, 다른 안내 문서 링크는 ‘그 문서 제목’ 글자로 바꾼다(파일 경로 없음)' }
        myFeedback: { type: [boolean, 'null'], description: '(0.4.0 BR-91) 내가 남긴 의견 — true 도움이 되었어요, false 수정이 필요해요, 안 남겼으면 null' }

    FaqCategory:
      type: object
      required: [category, title, count]
      x-added-in: '2026-11-18'
      properties:
        category: { type: string }
        title: { type: string }
        count: { type: integer, description: 그 분류의 전체 항목 수(검색어와 무관) }

    FaqList:
      type: object
      required: [items, categories]
      x-added-in: '2026-11-18'
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FaqItem' } }
        categories: { type: array, items: { $ref: '#/components/schemas/FaqCategory' } }

    CustomerAnswerState:
      type: string
      enum: [ANSWERED, NO_GROUNDING, REALTIME_DATA_REQUIRED, ORDER_STATUS, PRODUCT_INFO, OUT_OF_SCOPE, PROCESSING]

    AnswerMode:
      type: string
      enum: [GENERATIVE, BASELINE_EXTRACTIVE, ORDER_TEMPLATE, PRODUCT_TEMPLATE, NONE]
      description: GENERATIVE=모델 생성(인용 검사 통과), BASELINE_EXTRACTIVE=안내 문서 원문 발췌, ORDER_TEMPLATE=주문 상태를 정해진 문장으로, PRODUCT_TEMPLATE=상품 검색 결과를 정해진 문장으로(0.3.0), NONE=답 생성 안 함

    Citation:
      type: object
      required: [documentId, title, excerpt]
      properties:
        documentId: { type: string, description: 안내 문서 경로(docs/business/customer-faq/…) }
        title: { type: string, description: 안내 문서 제목(첫 제목 줄) }
        section: { type: [string, 'null'], description: 절 제목 }
        excerpt: { type: string, description: 근거 절 본문(지위 표시 태그는 뺀다) }

    OrderBrief:
      type: object
      required: [orderId, status, statusLabel]
      properties:
        orderId: { type: string }
        status: { type: string, description: order-service OrderStatus 그대로 }
        statusLabel: { type: string, description: 고객에게 보일 상태 이름(예 "상품 준비 중") }
        orderedAt: { type: [string, 'null'], format: date-time }
        itemCount: { type: [integer, 'null'] }
        totalAmount: { type: [integer, 'null'], description: 원 }
        arrivalWindow:
          type: [object, 'null']
          description: 도착 예정 시간대(주문 상세에서만, Asia/Seoul)
          properties:
            date: { type: string, format: date }
            start: { type: string }
            end: { type: string }

    Handoff:
      type: object
      required: [target, message]
      description: 고객센터 문의 남기기 연결(C4). 앱은 버튼을 보이고, 누르면 case-service POST /inquiries 를 origin=ASSISTANT_HANDOFF 로 연다.
      properties:
        target: { type: string, enum: [INQUIRY] }
        message: { type: string, description: 버튼 위 안내 문구 }
        buttonLabel: { type: string, description: '버튼 문구 — "고객센터에 문의 남기기"' }
        orderId: { type: [string, 'null'], description: 고른 주문이 있으면 문의에 그대로 }

    CustomerAnswer:
      type: object
      required: [answerId, requestId, state, answer, citations, answerMode, askedAt]
      properties:
        answerId: { type: string }
        requestId: { type: string, description: 질문 때의 Idempotency-Key }
        state: { $ref: '#/components/schemas/CustomerAnswerState' }
        answer: { type: string }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        answerMode: { $ref: '#/components/schemas/AnswerMode' }
        orderId: { type: [string, 'null'] }
        order:
          $ref: '#/components/schemas/OrderBrief'
          description: 고른 주문의 지금 상태(응답 때마다 새로 읽음). 고르지 않았거나 못 읽으면 없음(null)
        recentOrders:
          type: array
          description: REALTIME_DATA_REQUIRED 일 때 고를 최근 주문(최대 5개, 그 밖은 빈 배열)
          items: { $ref: '#/components/schemas/OrderBrief' }
        handoff:
          $ref: '#/components/schemas/Handoff'
          description: 고객센터 문의 연결(NO_GROUNDING·OUT_OF_SCOPE·ORDER_STATUS). 그 밖은 없음(null)
        askedAt: { type: string, format: date-time }

    # ---- (0.6.0) 고객 RAG 문서 관리(ADR-0094) ----
    KnowledgeIndexState:
      type: string
      enum: [INDEXED, PENDING, FAILED, NOT_INDEXED]
      description: 지금 판이 활성 스냅숏에 들어갔는지. PENDING=재색인 대기, FAILED=판을 바꾼 뒤 재색인이 실패(1분 뒤 다시 함), NOT_INDEXED=가져온 뒤 DB 로 아직 색인 안 함
    KnowledgeDocumentSummary:
      type: object
      required: [documentId, domain, title, version, contentSha256, retired, readOnly, indexState, updatedAt, updatedBy]
      properties:
        documentId: { type: string, description: '저장소 경로 그대로(docs/rag/rag-docs/<영역>/<이름>.md) — 인용 documentId 와 같다' }
        domain: { type: string, description: 영역 폴더 }
        title: { type: string }
        version: { type: integer }
        contentSha256: { type: string }
        retired: { type: boolean, description: 내린 문서(색인 안 함) }
        readOnly: { type: boolean, description: '고객 RAG 에서는 늘 false(모두 DB 가 정본, ADR-0094)' }
        indexState: { $ref: '#/components/schemas/KnowledgeIndexState' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, description: '반영한 초안의 작성자(운영자 ID), 가져오기는 IMPORT' }
    KnowledgeReindex:
      type: object
      properties:
        requestedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        lastResult: { type: [string, 'null'], description: 'OK·FAILED' }
        lastSnapshotId: { type: [string, 'null'] }
    KnowledgeDocumentList:
      type: object
      required: [items, source, reindex]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/KnowledgeDocumentSummary' } }
        source: { type: string, enum: [files, db], description: '색인 원본 설정 — files 면 승인 반영돼도 재색인하지 않는다(가져오기 전)' }
        reindex: { $ref: '#/components/schemas/KnowledgeReindex' }
    KnowledgeVersion:
      type: object
      required: [version, op, title, contentSha256, createdBy, createdAt]
      properties:
        version: { type: integer }
        op: { type: string, enum: [IMPORT, UPSERT, RETIRE] }
        title: { type: string }
        contentSha256: { type: string }
        approvalId: { type: [string, 'null'] }
        draftId: { type: [string, 'null'] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    KnowledgeDocumentDetail:
      type: object
      required: [document, content, shownVersion, versions]
      properties:
        document: { $ref: '#/components/schemas/KnowledgeDocumentSummary' }
        content: { type: string, description: 마크다운 본문(shownVersion 판) }
        shownVersion: { type: integer }
        versions: { type: array, items: { $ref: '#/components/schemas/KnowledgeVersion' }, description: 최근 판 순 }
    KnowledgeDraftCreate:
      type: object
      required: [documentId, op]
      properties:
        documentId: { type: string, maxLength: 300 }
        op: { type: string, enum: [UPSERT, RETIRE] }
        baseVersion: { type: [integer, 'null'], minimum: 0, description: '본 판(새 문서 0). 주면 지금 판과 같은지 본다(아니면 409 STALE_VERSION). 없으면 지금 판' }
        content: { type: [string, 'null'], description: 'UPSERT 본문 전체(마크다운). RETIRE 는 비운다' }
    KnowledgeDraftUpdate:
      type: object
      required: [content]
      properties:
        content: { type: string }
    KnowledgeDraft:
      type: object
      required: [draftId, documentId, op, baseVersion, authorId, state, createdAt, updatedAt, approvalRequest]
      properties:
        draftId: { type: string }
        documentId: { type: string }
