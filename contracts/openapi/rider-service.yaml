openapi: 3.1.0
info:
  title: rider-service
  version: 0.4.0
  description: |
    라이더 프로필(전화번호 고유성·계좌·거주지·배달지역·수단), 운행 상태, 하나씩 배달하기, 배차 모드, 계정 제한(증빙 기반), 마지막 통신 시각, 탈퇴의 정본. (docs/architecture/service-map.md §7)
    특정 배송의 배정 권리(dispatch), 수행·정산(execution), 인증 토큰(auth), 간선기사(fleet)는 소유하지 않는다.
    후기만으로 자동 제재하지 않는다. 수단 변경은 배송 중 불가. 가입은 전화번호 중복만 확인한다(면허·주민번호는 받지 않음 — 사용자 결정 2026-11-10, RS-2).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: signup, description: 가입 }
  - { name: me, description: 라이더 본인 프로필·상태·설정 }
  - { name: operator, description: 운영자 — 계정 제한(RS-1) }
  - { name: internal, description: 서비스 간 조회 (dispatch) }

paths:
  /riders/signups:
    post:
      tags: [signup]
      summary: 라이더 가입 (전화번호 중복 확인, 즉시 운행 승인)
      description: |
        라이더 토큰(rider-auth-service, Google 로그인)으로 받는다. riderId = 토큰 주체(RD-…) — 본문에 riderId 를 받지 않는다(RS-2, ADR-0054 결정 G).
        입력은 전화번호·배달 지역·배달 수단·약관(사용자 결정 2026-11-10: 면허·주민번호는 가입 때 받지 않는다). 전화번호는 본인인증 없이 중복만 확인한다(같은 번호 409 DUPLICATE_RIDER).
        같은 주체가 이미 가입했으면 409 DUPLICATE_RIDER(같은 Idempotency-Key 재전송은 기존 결과). 가입 직후 OFF_DUTY·NORMAL — 즉시 운행 승인(원문 §1.2).
      operationId: createRiderSignup
      x-pmart-user-types: [RIDER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiderSignupRequest' }
      responses:
        '201':
          description: 가입됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderProfile' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: DUPLICATE_RIDER (같은 주체 또는 전화번호) / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /riders/signups/{requestId}:
    get:
      tags: [signup]
      summary: 가입 신청 결과 조회
      operationId: getRiderSignup
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  state: { type: string, enum: [CREATED, PENDING_REVIEW, REJECTED] }
                  riderId: { type: string }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /riders/me:
    get:
      tags: [me]
      summary: 내 프로필·운행 상태·설정·계정 제한 조회
      operationId: getMyRider
      x-pmart-user-types: [RIDER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderProfile' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    patch:
      tags: [me]
      summary: 프로필 변경 (계좌·거주지·배달지역·수단)
      description: 수단(vehicleType) 변경은 진행 중 배송이 있으면 409 INVALID_STATE.
      operationId: updateMyRider
      x-pmart-user-types: [RIDER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiderProfileUpdate' }
      responses:
        '200':
          description: 변경 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderProfile' }
        '409':
          description: INVALID_STATE (배송 중 수단 변경) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /riders/me/state:
    put:
      tags: [me]
      summary: 운행 상태 변경 (운행 종료 / 운행 중·신규배차 허용 / 운행 중·신규배차 중지)
      description: |
        계정 제한 DISPATCH_RESTRICTED·SUSPENDED·TERMINATED이면 newDispatchEnabled=true로 전환 불가(403).
        진행 중 배송이 있으면 OFF_DUTY 전환 불가(409). 변경은 RiderStateChanged로 전파되어 dispatch 적격 판정에 반영된다.
      operationId: setMyOperatingState
      x-pmart-user-types: [RIDER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatingStateRequest' }
      responses:
        '200':
          description: 반영된 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatingState' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
    get:
      tags: [me]
      summary: 내 운행 상태 조회
      operationId: getMyOperatingState
      x-pmart-user-types: [RIDER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatingState' }

  /riders/me/settings:
    put:
      tags: [me]
      summary: 배차 설정 (하나씩 배달하기, 배차 모드 일반/AI추천)
      operationId: setMyDispatchSettings
      x-pmart-user-types: [RIDER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchSettings' }
      responses:
        '200':
          description: 반영된 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchSettings' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: 'AI_DISPATCH_NOT_AVAILABLE — 2026-11-13 부터 내지 않는다(AI 추천 배차 사용 가능, ADR-0058)'
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    get:
      tags: [me]
      summary: 배차 설정 조회
      operationId: getMyDispatchSettings
      x-pmart-user-types: [RIDER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchSettings' }

  /riders/me/withdrawals:
    post:
      tags: [me]
      summary: 탈퇴 신청 (진행 중 배송·미정산 수행료 없을 때만)
      operationId: createMyWithdrawal
      x-pmart-user-types: [RIDER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: INVALID_STATE (진행 중 배송 / 미정산 / 제한 조사 중)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /riders/me/withdrawals/{requestId}:
    get:
      tags: [me]
      summary: 탈퇴 신청 결과 조회
      operationId: getMyWithdrawal
      x-pmart-user-types: [RIDER]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  state: { type: string, enum: [PENDING, COMPLETED, REJECTED] }
                  blockers: { type: array, items: { type: string } }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /riders:
    get:
      tags: [operator]
      summary: 직원용 라이더 찾기 (0.4.0 — 라이더 ID·전화번호 완전 일치, BOD-3)
      x-added-in: '2026-11-15'
      description: |
        백오피스 라이더 운영·고객센터가 riderId 를 찾는 입구. **이름 검색은 없다**(사용자 2026-11-15 "아이디로 찾는 게 낫지 않아? 이름은 동명이인이 있을 수도") — 라이더 ID 또는 전화번호 **완전 일치**(숫자만 비교, 하이픈 무시)로 찾고, 제한·운행 상태·운행 MFC·수단으로 거른다.
        권한: OPERATOR_ADMIN·RIDER_OPS·CS_AGENT(그 밖·라이더·고객 403).
        목록의 이름·전화번호는 가린다(이름 첫·끝 글자, 전화 앞 3·끝 4자리 — ADR-0062 와 같은 방식). 계좌·거주지는 내보내지 않는다. 검색 조건(전화번호)은 로그에 남기지 않는다(ADR-0062 결정 14와 같음).
        restriction 은 지금 유효한 제한으로 거른다(기한 지난 제한은 NORMAL).
        정렬 JOINED_DESC(최근 가입, 기본)·STATE_CHANGED_DESC(최근 운행 상태 변경). page 는 0부터.
      operationId: searchRidersForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: riderId, in: query, schema: { type: string, maxLength: 64 }, description: 라이더 ID 완전 일치 }
        - { name: phone, in: query, schema: { type: string, maxLength: 20 }, description: '전화번호 완전 일치(숫자 10~11자리, 하이픈 무시)' }
        - { name: restriction, in: query, schema: { $ref: '#/components/schemas/AccountRestriction' } }
        - { name: operatingStatus, in: query, schema: { $ref: '#/components/schemas/OperatingStatus' } }
        - { name: operatingMfcId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: vehicleType, in: query, schema: { $ref: '#/components/schemas/VehicleType' } }
        - { name: sort, in: query, schema: { type: string, enum: [JOINED_DESC, STATE_CHANGED_DESC], default: JOINED_DESC } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffRiderSearchResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /riders/{riderId}:
    get:
      tags: [operator]
      summary: 직원용 라이더 상세 (0.4.0 — 이름·전화 가림, 원문은 pii-reveals, BOD-3·6)
      x-added-in: '2026-11-15'
      description: |
        권한: OPERATOR_ADMIN·RIDER_OPS·CS_AGENT(그 밖·라이더·고객 403). 없는 라이더 404 RIDER_NOT_FOUND.
        이름·전화번호는 가린 값만 — 원문은 `POST /riders/{riderId}/pii-reveals`(사유 + audit-service 기록 뒤, ADR-0062 적용 범위). 계좌·거주지는 내보내지 않는다(정산 화면이 생길 때 따로).
        `version` 은 지금 라이더 행 버전 — 계정 제한 `POST /riders/{riderId}/restrictions` 의 X-Expected-Version 에 쓴다(BOD-6). 상세 조회 자체는 기록하지 않는다.
      operationId: getRiderForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: riderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffRiderDetail' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /riders/{riderId}/pii-reveals:
    post:
      tags: [operator]
      summary: 직원용 라이더 이름·전화번호 원문 열람 — 사유 필수, 열람 기록 남김 (0.4.0, ADR-0062)
      x-added-in: '2026-11-15'
      description: |
        ADR-0062(직원의 개인정보 원문 열람은 사유 + audit-service 동기 기록 뒤에만)를 라이더 상세에 적용한다. 권한은 상세와 같다(OPERATOR_ADMIN·RIDER_OPS·CS_AGENT).
        처리: 권한 → 라이더 확인(없으면 404, 기록하지 않음) → audit-service `POST /internal/pii-access-logs` 에 **동기로** 기록(subjectType RIDER, subjectRef = riderId, caseRef RIDER:<riderId>, 항목·사유·역할)
        → 기록이 된 뒤에만 고른 항목 원문을 돌려준다. **audit-service 에 닿지 않거나 결과를 모르면 503(DEPENDENCY_UNAVAILABLE·UNKNOWN_RESULT), 원문 없음**.
        멱등: 같은 직원·같은 라이더·같은 Idempotency-Key 면 같은 열람 기록으로 이어진다(같은 키에 다른 사유·항목이면 409 — audit 판정). 원문 응답은 저장하지 않는다(매번 원장에서 읽음). 사유·원문은 로그에 남기지 않는다.
      operationId: revealRiderPiiForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: riderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiderPiiRevealRequest' }
      responses:
        '200':
          description: 기록됨 — 요청한 항목만 원문, 나머지는 null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderPiiReveal' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503':
          description: 열람 기록을 남기지 못함(audit-service 미응답·결과 불명) — 원문을 주지 않는다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /riders/{riderId}/restrictions:
    post:
      tags: [operator]
      summary: 계정 제한 걸기·바꾸기·풀기 (RS-1, 2026-11-14)
      description: |
        백오피스 운영자가 증빙·소명을 확인한 뒤 건다(원문 §9.6, BO-20). 승인 화면(BO-20) 전에는 이 운영자 API 로 바로 건다(사용자 2026-11-14) — OPERATOR_ADMIN·RIDER_OPS(0.4.0, 라이더 운영 역할 — BOD-1).
        X-Expected-Version 은 라이더 행 버전 — 상세(`GET /riders/{riderId}`) 또는 이력 조회의 `version`(0.4.0, BOD-6)으로 얻는다.
        `NORMAL` 은 제한 풀기. 바꿀 때마다 `RiderRestricted`(delivery.rider.v1, 풀기는 restriction=NORMAL) — delivery-dispatch 가 그 라이더의 **픽업 전 배정을 풀고 다시 배차**하고 남은 제안을 거둔다. **픽업한 배송은 끝까지 전달**한다(사용자 2026-11-14 — 모든 제한 단계 같음).
        제한이 걸리면 신규배차는 꺼진다(`RiderStateChanged`). 일시 중지·계약 종료라도 운행 상태는 그대로 둔다(픽업한 배송 전달 중 위치를 계속 보내도록) — 운행 시작·신규배차 켜기만 막는다.
        `until` 이 지나면 제한이 없는 것으로 본다(적격 조회·운행 시작 판정). 그때 따로 사건은 내지 않는다.
      operationId: changeRiderRestriction
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: riderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiderRestrictionChange' }
      responses:
        '200':
          description: 반영된 제한
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderRestrictionRecord' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
    get:
      tags: [operator]
      summary: 계정 제한 이력 (최근 순)
      description: OPERATOR_ADMIN·RIDER_OPS(0.4.0). `version` 은 지금 라이더 행 버전(0.4.0, BOD-6 — 이력 줄의 version 은 그때 값이라 프로필·운행 변경으로 낡을 수 있다).
      operationId: listRiderRestrictions
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: riderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: { $ref: '#/components/schemas/AccountRestriction' }
                  version: { type: integer, description: '지금 라이더 행 버전 — 제한 바꾸기의 X-Expected-Version(0.4.0, BOD-6)' }
                  items: { type: array, items: { $ref: '#/components/schemas/RiderRestrictionRecord' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /riders/restriction-reviews:
    get:
      tags: [operator]
      summary: 제한 검토 대상 목록 (컴플레인 누적 — RS-3, 최근 순 200)
      description: |
        OPERATOR_ADMIN·RIDER_OPS(0.4.0).
        case `RiderComplaintRecorded`(신고·오배송·파손)를 종류마다 세어 **7일 안 서로 다른 배송 3건 이상**이면 시스템이 연다(사용자 2026-11-14). 자동 제재는 없다 — 운영자가 확인 뒤 계정 제한(`POST /riders/{riderId}/restrictions`)을 걸고 검토를 닫는다.
        라이더·종류마다 열린 검토는 하나 — 열려 있는 동안 온 같은 종류 컴플레인은 거기에 묶인다. 닫힌 검토에 묶인 컴플레인은 다시 세지 않는다.
      operationId: listRiderRestrictionReviews
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [OPEN, RESTRICTED, DISMISSED], default: OPEN } }
        - { name: riderId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RestrictionReview' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /riders/restriction-reviews/{reviewId}/decisions:
    post:
      tags: [operator]
      summary: 제한 검토 닫기 (RESTRICTED — 먼저 계정 제한을 건 뒤 / DISMISSED)
      operationId: decideRiderRestrictionReview
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestrictionReviewDecision' }
      responses:
        '200':
          description: 닫힌 검토
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictionReview' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/riders/eligible:
    get:
      tags: [internal]
      summary: "[dispatch→rider] 적격 라이더 조회 (운행중·신규배차 ON·권역·수단·제한 없음·용량)"
      description: |
        조회 사본(asOf). 배정 권리는 dispatch가 제안·수락으로 확정한다. 응답은 개인정보 없이 riderId·수단·용량·마지막 위치 갱신 시각만 포함한다.
        위치는 delivery-tracking이 정본이므로 여기서는 반경으로 거르지 않는다(radiusKm 는 받기만 한다). 조건: 운행 중·신규배차 ON·계정 제한 NORMAL·배달지역에 mfcId. 반경(직선, 사용자 2026-11-13)은 dispatch 가 tracking 위치로, 도로 거리·시간은 tracking 거리 행렬(카카오모빌리티)로 계산한다.
        capacity·alcoholEligible·consecutiveRejections 는 아직 원천이 없어 비운다(수단별 적재 기준 미정, 연속 거절은 dispatch 가 센다).
      operationId: listEligibleRiders
      parameters:
        - { name: mfcId, in: query, required: true, schema: { type: string } }
        - { name: radiusKm, in: query, required: true, schema: { type: number, minimum: 0.5, maximum: 10 } }
        - { name: vehicleType, in: query, schema: { $ref: '#/components/schemas/VehicleType' } }
        - { name: requiresColdChain, in: query, schema: { type: boolean } }
        - { name: requiresAlcoholEligible, in: query, schema: { type: boolean } }
        - { name: excludeRiderIds, in: query, style: form, explode: false, schema: { type: array, items: { type: string } } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/EligibleRider' } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/riders/{riderId}:
    get:
      tags: [internal]
      summary: "[dispatch/execution→rider] 라이더 상태·제한 조회 (개인정보 제외)"
      operationId: getRiderInternal
      parameters:
        - { name: riderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibleRider' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    VehicleType:
      type: string
      enum: [MOTORCYCLE, BICYCLE, CAR, WALK]
    OperatingStatus:
      type: string
      description: OFF_DUTY 운행 종료. ON_DUTY 운행 중 (newDispatchEnabled로 신규배차 허용/중지 구분)
      enum: [OFF_DUTY, ON_DUTY]
    AccountRestriction:
      type: string
      description: NORMAL 정상. DISPATCH_RESTRICTED 신규배차 제한. SUSPENDED 일시 중지. TERMINATED 계약 종료. 증빙 기반(BO-20 승인)
      enum: [NORMAL, DISPATCH_RESTRICTED, SUSPENDED, TERMINATED]
    RiderRestrictionChange:
      type: object
      x-added-in: '2026-11-14'
      required: [restriction, reason]
      properties:
        restriction: { $ref: '#/components/schemas/AccountRestriction' }
        reason: { type: string, minLength: 1, maxLength: 300, description: '사유(확인한 사건·소명 요약). 개인정보를 적지 않는다' }
        until: { type: string, format: date-time, description: '제한 끝(없으면 무기한). NORMAL 이면 비운다' }
        evidenceRefs: { type: array, maxItems: 20, items: { type: string, maxLength: 200 }, description: '증빙 참조(사건·사진 ID 등)' }
        approvalRef: { type: string, maxLength: 100, description: 'BO-20 승인 번호(승인 화면 뒤 — 지금은 선택)' }
    RiderRestrictionRecord:
      type: object
      x-added-in: '2026-11-14'
      properties:
        riderId: { type: string }
        restriction: { $ref: '#/components/schemas/AccountRestriction' }
        previous: { $ref: '#/components/schemas/AccountRestriction' }
        reason: { type: string }
        until: { type: string, format: date-time }
        evidenceRefs: { type: array, items: { type: string } }
        approvalRef: { type: string }
        changedBy: { type: string, description: 운영자 ID }
        changedAt: { type: string, format: date-time }
        version: { type: integer, description: 바꾼 뒤 라이더 버전 }
    RestrictionReview:
      type: object
      x-added-in: '2026-11-14'
      properties:
        reviewId: { type: string }
        riderId: { type: string }
        complaintType: { type: string, enum: [REPORT, MISDELIVERY, DAMAGE], description: 'REPORT 신고, MISDELIVERY 오배송, DAMAGE 파손' }
        state: { type: string, enum: [OPEN, RESTRICTED, DISMISSED] }
        complaints:
          type: array
          items:
            type: object
            properties:
              complaintId: { type: string }
              deliveryId: { type: string }
              recordedAt: { type: string, format: date-time }
        openedAt: { type: string, format: date-time }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        note: { type: string }
    RestrictionReviewDecision:
      type: object
      x-added-in: '2026-11-14'
      required: [decision]
      properties:
        decision: { type: string, enum: [RESTRICTED, DISMISSED] }
        note: { type: string, maxLength: 300, description: '확인 결과 메모(개인정보를 적지 않는다)' }
    RiderSignupRequest:
      type: object
      description: 'RS-2·ADR-0054 결정 G — 면허·주민번호 칸은 2026-11-13 뺐다(사용자 결정 2026-11-10, 가입 때 받지 않음)'
      required: [phone, vehicleType, deliveryAreas, consents]
      properties:
        phone: { type: string, pattern: '^01[0-9]{8,9}$', description: '휴대전화 번호(숫자만). 중복만 확인 — 본인인증 없음', x-added-in: '2026-11-13' }
        name: { type: string, maxLength: 50 }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        bankAccount:
          type: object
          description: 정산 계좌(선택 — 가입 뒤 프로필 변경으로도 넣는다)
          required: [bankCode, accountNumber, holderName]
          properties:
            bankCode: { type: string }
            accountNumber: { type: string }
            holderName: { type: string }
        residence:
          type: object
          properties:
            roadAddress: { type: string }
            detail: { type: string }
        deliveryAreas:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
              zoneId: { type: string }
        consents:
          type: array
          items:
            type: object
            properties:
              consentType: { type: string }
              version: { type: string }
    RiderProfileUpdate:
      type: object
      properties:
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        bankAccount:
          type: object
          properties:
            bankCode: { type: string }
            accountNumber: { type: string }
            holderName: { type: string }
        residence:
          type: object
          properties:
            roadAddress: { type: string }
            detail: { type: string }
        deliveryAreas:
          type: array
          items:
            type: object
            properties:
              mfcId: { type: string }
              zoneId: { type: string }
    RiderProfile:
      type: object
      properties:
        riderId: { type: string }
        version: { type: integer }
        name: { type: string }
        phoneMasked: { type: string }
        licenseNumberMasked: { type: string }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        bankAccountMasked: { type: string }
        residence:
          type: object
          properties:
            roadAddress: { type: string }
            detail: { type: string }
        deliveryAreas:
          type: array
          items:
            type: object
            properties:
              mfcId: { type: string }
              zoneId: { type: string }
        operating: { $ref: '#/components/schemas/OperatingState' }
        settings: { $ref: '#/components/schemas/DispatchSettings' }
        restriction:
          type: object
          properties:
            state: { $ref: '#/components/schemas/AccountRestriction' }
            reason: { type: string }
            evidenceRef: { type: string }
            approvalRef: { type: string }
            until: { type: string, format: date-time }
        lastHeartbeatAt: { type: string, format: date-time, description: 마지막 통신 시각 }
        joinedAt: { type: string, format: date-time }
    OperatingStateRequest:
      type: object
      required: [status, newDispatchEnabled]
      properties:
        status: { $ref: '#/components/schemas/OperatingStatus' }
        newDispatchEnabled: { type: boolean, description: ON_DUTY일 때만 의미. OFF_DUTY면 false 강제 }
        mfcId: { type: string, description: 운행 시작 시 기준 MFC }
    OperatingState:
      type: object
      properties:
        status: { $ref: '#/components/schemas/OperatingStatus' }
        newDispatchEnabled: { type: boolean }
        mfcId: { type: string }
        activeDeliveryCount: { type: integer, description: 진행 중 배송 수(execution 사본) }
        changedAt: { type: string, format: date-time }
        version: { type: integer }
    DispatchSettings:
      type: object
      properties:
        oneAtATime: { type: boolean, description: 하나씩 배달하기 }
        dispatchMode: { type: string, enum: [NORMAL, AI_RECOMMENDED], description: '일반(배달리스트에서 골라 수락) / AI 추천(서버가 제안). 첫 가입 기본 AI_RECOMMENDED(원문 §2.2). AI 추천 계산은 ADR-0058(Python AI 서버 전에는 OR-Tools)' }
        version: { type: integer }
    StaffRiderSummary:
      type: object
      x-added-in: '2026-11-15'
      properties:
        riderId: { type: string }
        version: { type: integer }
        nameMasked: { type: [string, 'null'], description: '이름 첫·끝 글자(예 김*수)' }
        phoneMasked: { type: string, description: '예 010****5678' }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        operatingStatus: { $ref: '#/components/schemas/OperatingStatus' }
        newDispatchEnabled: { type: boolean }
        operatingMfcId: { type: [string, 'null'] }
        restriction: { $ref: '#/components/schemas/AccountRestriction' }
        restrictionUntil: { type: [string, 'null'], format: date-time }
        stateChangedAt: { type: string, format: date-time }
        joinedAt: { type: string, format: date-time }
    StaffRiderSearchResult:
      type: object
      x-added-in: '2026-11-15'
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffRiderSummary' } }
        page: { type: integer }
        size: { type: integer }
        hasNext: { type: boolean }
    StaffRiderDetail:
      type: object
      x-added-in: '2026-11-15'
      properties:
        riderId: { type: string }
        version: { type: integer, description: '지금 라이더 행 버전 — 계정 제한 X-Expected-Version(BOD-6)' }
        nameMasked: { type: [string, 'null'] }
        phoneMasked: { type: string }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        deliveryAreas:
          type: array
          items:
            type: object
            properties:
              mfcId: { type: string }
              zoneId: { type: string }
        operating: { $ref: '#/components/schemas/OperatingState' }
        settings: { $ref: '#/components/schemas/DispatchSettings' }
        restriction:
          type: object
          properties:
            state: { $ref: '#/components/schemas/AccountRestriction' }
            reason: { type: [string, 'null'] }
            until: { type: [string, 'null'], format: date-time }
        lastHeartbeatAt: { type: [string, 'null'], format: date-time }
        joinedAt: { type: string, format: date-time }
    RiderPiiField:
      type: string
      x-added-in: '2026-11-15'
      enum: [NAME, PHONE]
    RiderPiiRevealRequest:
      type: object
      x-added-in: '2026-11-15'
      required: [reason]
      properties:
        reason: { type: string, minLength: 2, maxLength: 200, description: '열람 사유(예 "라이더 컴플레인 확인 — 연락"). 앞뒤 공백 제외 2자 이상. audit 에 남고 로그에는 남기지 않는다' }
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/RiderPiiField' }
          description: 볼 항목. 없으면 둘 다
    RiderPiiReveal:
      type: object
      x-added-in: '2026-11-15'
      properties:
        riderId: { type: string }
        piiAccessLogId: { type: string, description: audit-service 열람 기록 ID }
        recordedAt: { type: string, format: date-time }
        fields: { type: array, items: { $ref: '#/components/schemas/RiderPiiField' } }
        name: { type: [string, 'null'], description: NAME 을 골랐을 때만 }
        phone: { type: [string, 'null'], description: PHONE 을 골랐을 때만 }
    EligibleRider:
      type: object
      properties:
        riderId: { type: string }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        operating: { $ref: '#/components/schemas/OperatingState' }
        restriction: { $ref: '#/components/schemas/AccountRestriction' }
        oneAtATime: { type: boolean }
        dispatchMode: { type: string }
        capacity:
          type: object
          description: 수단별 적재 용량 (추가·분할 배차 판단 입력)
          properties:
            maxWeightG: { type: integer }
            maxVolumeL: { type: integer }
            coldChain: { type: boolean }
        alcoholEligible: { type: boolean }
        consecutiveRejections: { type: integer, description: 연속 거절 횟수 (5회 안내 기준) }
        lastHeartbeatAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
