openapi: 3.1.0
info:
  title: rag-query-service
  version: 0.1.0
  description: |
    새 RAG 질문 검색(ADR-0099, 2026-11-28) — ES-First 하이브리드의 질문 쪽(계획 §2-1). DB·Kafka 없음, ③ 생성(LLM)은 아직 없음(근거만 돌려준다).
    1. ES BM25(범위 색인 rag-operator·rag-customer, chunking-service 소유 — 읽기만). 운영자는 POLICY 문서 점수 ×1.5 로 다시 정렬(정렬에만).
    2. SearchConfidenceEvaluator — 원래 BM25 점수로 지표(핵심어 비율·상대 점수 차, 기록용 제목·어구·FAQ 질문 일치)를 내고,
       핵심어 비율 ≥0.7 그리고 상대 점수 차 ≥0.1 이면 **ES 에서 끝**(상위 3 카드, 모델 호출 없음).
    3. 아니면 embedding-service 벡터 검색 → BM25 와 RRF → 벡터 1위 코사인 <0.58 이면 **답변 불가**, 아니면 상위 3 근거(HYBRID).
    기준값은 ES-First 2차 검증(docs/rag/verification/2026-11-28/es-first-v2)에서 고정한 값. 서비스 간 경로(게이트웨이에 없음) — 화면 공개는 권한과 함께 따로.
servers:
  - url: /api/v1
tags:
  - { name: rag-searches, description: 질문 검색 }
paths:
  /internal/rag-searches:
    post:
      tags: [rag-searches]
      summary: "질문 하나를 ES-First 로 검색(ES → 벡터 → 답변 불가)"
      operationId: ragSearch
      security: []
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, question]
              properties:
                scope: { type: string, enum: [OPERATOR, CUSTOMER] }
                question: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RagSearchResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
components:
  schemas:
    Hit:
      type: object
      required: [chunkId, documentId, sectionPath, raw, score]
      properties:
        chunkId: { type: string }
        documentId: { type: string }
        sectionPath: { type: string }
        heading: { type: string }
        documentType: { type: [string, 'null'], enum: [POLICY, REFERENCE, APP_GUIDE, FAQ, null] }
        raw: { type: number, description: 원래 점수(BM25 _score 또는 벡터 코사인) }
        score: { type: number, description: 정렬에 쓴 점수(가중치 또는 RRF) }
    RagSearchResult:
      type: object
      required: [exit, evidence, decision, embeddingCalls, millis]
      properties:
        exit: { type: string, enum: [ES, HYBRID, NO_ANSWER] }
        evidence: { type: array, items: { $ref: '#/components/schemas/Hit' } }
        decision:
          type: object
          properties:
            acceptAtEs: { type: boolean }
            reason: { type: string }
            features:
              type: object
              properties:
                top1: { type: number }
                gap: { type: number }
                relGap: { type: number }
                coverage: { type: number }
                titleMatch: { type: number }
                phraseMatch: { type: number }
                faqQuestionMatch: { type: number }
        vectorTop1Cosine: { type: [number, 'null'] }
        embeddingCalls: { type: integer }
        millis: { type: object, additionalProperties: { type: integer } }
