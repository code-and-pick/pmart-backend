openapi: 3.1.0
info:
  title: cdc-quality-service
  version: 0.4.0
  description: |
    CDC 품질 보류·격리·해제·리콜 판단과 승인 기록(본사 품질 책임자)·폐기 승인·FEFO 예외 이중 승인·온도 이탈 판정·LOT 계보·
    CDC 운영 제한(CDC-F-031)의 정본. (docs/architecture/service-map.md §4)
    수량 변경은 cdc-inventory(품질 전기·폐기 차감), 상품 마스터는 product-service가 정본. 판단은 여기서, 수량은 inventory에서.
    0.4.0(2026-11-26, 운영 제한 — WMS CDC-F-031, 사용자 "새 할당과 출발"·"문서 그대로"): `/cdcs/{cdcId}/operation-restrictions`(걸기·목록·조회·해제)와
      내부 확인 `POST /internal/operation-restriction-checks`(cdc-inventory 새 할당·cdc-outbound 출발 검증이 부른다 — 확인이 안 되면 그쪽이 새 처리를 보류). 자동 해제 없음.
    0.3.0(2026-11-26, 리콜 — WMS CDC-F-028·정책 16.13, 사용자 "리콜"·"리콜은 출고대기분도 막음"·"본사 승인 번호 + 모든 CDC"): `/cdc-recalls`(여러 센터라 `/cdcs/{cdcId}` 밖 —
      MFC `/recalls` 와 겹치지 않게). 발령 = 본사 승인 번호 필수 → RecallIssued(cdc.quality.v1) → cdc-inventory LOT 추적으로 현물이 있는 모든 CDC 에 보류(reason RECALL — 출고대기 91 까지).
    0.2.0(2026-11-26, 첫 구현 — 사용자 결정 "보류·해제·폐기만"·"MFC 품질과 같게"): 보류·해제 요청/결정·폐기 요청/결정/실행을 `/cdcs/{cdcId}/…` 아래로 옮겨 구현
      (게이트웨이에서 MFC 품질 `/disposal-approvals` 와 겹치지 않게). 재고 반영은 cdc-inventory `POST /internal/quality-postings`(0.15.0). 결정은 그 센터 CDC_MANAGER·요청자 본인 아님(422 SELF_APPROVAL),
      수량 × 판매 기준가 ≥ 10만 원 또는 한 SKU ≥ 20개면 본사 승인 번호(approval-service CDC_STOCK_ADJUSTMENT — 실사와 같은 관문, `pmart.quality.approval-ref.*`). 리콜·FEFO 예외·운영 제한·LOT 계보는 아직 501.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: holds, description: 품질 보류·격리·해제 }
  - { name: recalls, description: 리콜 }
  - { name: disposals, description: 폐기 승인 (실행은 cdc-inventory) }
  - { name: fefo-exceptions, description: FEFO 예외 이중 승인 }
  - { name: operation-restrictions, description: CDC 운영 제한·재개 }
  - { name: lot-traces, description: LOT 계보 추적 }

paths:
  /cdcs/{cdcId}/quality-holds:
    post:
      tags: [holds]
      summary: '[0.2.0] 품질 보류 — 줄마다 cdc-inventory HOLD(정상 → 보류, 걸린 예약은 늦은 할당부터 풀려 출고에 통지)'
      description: |
        그 센터 운영자. 줄 = sku·lot(·locationCode·qty — 칸을 비우면 그 LOT 의 모든 칸, 출고대기 91 은 빠짐 — cdc-inventory 규칙). 줄마다 재고 반영(키 `cdcq-hold-<holdId>-<줄>`):
        다 반영되면 APPLIED(일부 줄만 거절이면 그 줄 REJECTED·rejectReason, 보류는 APPLIED), 응답 불명이면 UNKNOWN_RESULT(서버가 같은 키로 다시), 모든 줄이 거절이면 REJECTED. 줄별 heldQty = 실제로 보류된 수량(0 일 수 있음 — 남은 보류가 0 이면 CLOSED).
        같은 Idempotency-Key·같은 본문은 같은 보류.
      operationId: createHold
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HoldInput' }
      responses:
        '201':
          description: 보류(상태는 재고 반영 결과)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
    get:
      tags: [holds]
      summary: '[0.2.0] 보류 목록 — 최신 순'
      operationId: listHolds
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/HoldState' } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: 앞 쪽 마지막 holdId, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Hold' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cdcs/{cdcId}/quality-holds/{holdId}:
    get:
      tags: [holds]
      summary: '[0.2.0] 보류 조회 — 줄별 보류·해제·폐기 수량과 해제 요청'
      operationId: getHold
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: holdId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/quality-holds/{holdId}/release-requests:
    post:
      tags: [holds]
      summary: '[0.2.0] 보류 해제 요청 — 줄(sku·lot·locationCode·qty)마다 그 보류의 남은 수량 이하'
      description: |
        그 센터 운영자. 줄의 sku·lot 은 보류 줄에 있어야 하고(칸을 지정한 보류 줄이면 같은 칸), 수량은 그 sku·lot 의 보류 − 해제 − 폐기 − 진행 중 요청 이하(아니면 422 QTY_EXCEEDS_HELD).
        보류가 APPLIED·PARTIALLY_RELEASED 일 때만(409 INVALID_STATE). 상태 REQUESTED — 결정은 decisions.
      operationId: requestRelease
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: holdId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                note: { type: string, maxLength: 500 }
                lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/ExactLine' } }
      responses:
        '201':
          description: 해제 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldRelease' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: QTY_EXCEEDS_HELD / LINE_NOT_IN_HOLD
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/quality-holds/{holdId}/release-requests/{releaseId}/decisions:
    post:
      tags: [holds]
      summary: '[0.2.0] 해제 결정 — APPROVE 면 cdc-inventory RELEASE(보류 → 정상)'
      description: |
        그 센터 CDC_MANAGER, 요청자 본인은 안 됨(422 SELF_APPROVAL). REQUESTED 만(409 INVALID_STATE). APPROVE → 본사 기준 검사(이상이면 approvalRef 필수 — 없으면 422 APPROVAL_REQUIRED, details 에 승인 요청 본문)
        → 재고 반영(키 `cdcq-rel-<releaseId>`, approvalRef 없으면 `CENTER:<releaseId>`) → APPLIED / UNKNOWN_RESULT(서버가 다시) / REJECTED(재고 거절 — 사유). REJECT → DECLINED.
      operationId: decideRelease
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: holdId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '200':
          description: 결정 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldRelease' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SELF_APPROVAL / APPROVAL_REQUIRED / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdc-recalls:
    post:
      tags: [recalls]
      summary: '[0.3.0] 리콜 발령 — 제조 LOT 리콜, 현물이 있는 모든 CDC 에 보류(출고대기까지)'
      description: |
        운영자 + 본사 승인 번호(approvalRef 필수 — 없으면 422 APPROVAL_REQUIRED, 사용자 "본사 승인 번호 + 모든 CDC"; 지금은 기록만, approval-service 확인은 AP-4 뒤).
        발령과 같은 트랜잭션에 `RecallIssued`(cdc.quality.v1 — mfc-quality 등이 MFC·운송 중·고객 출고 쪽을 처리). 그다음(트랜잭션 밖) cdc-inventory `GET /internal/lot-traces` 로
        LOT 마다 현물이 있는 CDC 를 찾아 센터·LOT 마다 보류(reason RECALL, sourceRef = recallId — 재고 HOLD `recall: true` 라 출고대기 91 까지, 걸린 예약은 풀려 출고에 RECALL 로 통지).
        추적이 안 되면 TRACING 에 두고 서버가 다시. 같은 Idempotency-Key·같은 본문은 같은 리콜.
      operationId: issueRecall
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, lots, reason, approvalRef]
              properties:
                sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                lots: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
                reason: { type: string, enum: [SAFETY, LABELING, CONTAMINATION, SUPPLIER_NOTICE, OTHER] }
                severity: { type: string, enum: [CLASS_1, CLASS_2, CLASS_3] }
                approvalRef: { type: string, maxLength: 128 }
                externalRef: { type: string, maxLength: 128, description: 공급사·기관 리콜 번호 }
                note: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: 리콜(센터별 보류는 추적 뒤 — state)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recall' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    get:
      tags: [recalls]
      summary: '[0.3.0] 리콜 목록 — 최신 순'
      operationId: listRecalls
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: sku, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: 앞 쪽 마지막 recallId, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Recall' } }
                  nextCursor: { type: [string, 'null'] }

  /cdc-recalls/{recallId}:
    get:
      tags: [recalls]
      summary: '[0.3.0] 리콜 조회 — 센터별 보류·출발한 물량(정방향 추적)'
      description: |
        centers = 이 리콜로 건 센터·LOT 별 보류(보류 상태·보류 수량). departures = cdc-inventory LOT 추적의 출발(어느 MFC 로 얼마, 받은·미정산 — 지금 조회, 안 되면 비우고 traceFreshness UNAVAILABLE).
        MFC 안의 재고·고객 출고는 각 정본이 본다(RecallIssued 구독).
      operationId: getRecall
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: recallId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recall' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/disposal-approvals:
    post:
      tags: [disposals]
      summary: '[0.2.0] 폐기 요청 — 보류된 수량만(holdId 필수)'
      description: |
        그 센터 운영자. 줄(sku·lot·locationCode·qty)은 그 보류의 남은 수량 이하(422 QTY_EXCEEDS_HELD — 보류되지 않은 수량은 폐기 불가). 상태 REQUESTED → decisions.
      operationId: requestDisposal
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holdId, reason, lines]
              properties:
                holdId: { type: string }
                reason: { type: string, enum: [EXPIRED, DAMAGED, RECALL, TEMPERATURE, CONTAMINATION, OTHER] }
                note: { type: string, maxLength: 500 }
                lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/ExactLine' } }
      responses:
        '201':
          description: 폐기 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisposalApproval' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: QTY_EXCEEDS_HELD / LINE_NOT_IN_HOLD
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    get:
      tags: [disposals]
      summary: '[0.2.0] 폐기 목록 — 최신 순'
      operationId: listDisposals
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/DisposalState' } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: 앞 쪽 마지막 disposalApprovalId, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DisposalApproval' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cdcs/{cdcId}/disposal-approvals/{disposalApprovalId}:
    get:
      tags: [disposals]
      summary: '[0.2.0] 폐기 조회 — 승인·실행 누계·실행 이력'
      operationId: getDisposalApproval
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: disposalApprovalId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisposalApproval' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/disposal-approvals/{disposalApprovalId}/decisions:
    post:
      tags: [disposals]
      summary: '[0.2.0] 폐기 결정 — APPROVE 면 APPROVED(실행 대기), REJECT 면 DECLINED'
      description: |
        그 센터 CDC_MANAGER, 요청자 본인 아님(422 SELF_APPROVAL). REQUESTED 만. 본사 기준(해제와 같음) 이상이면 approvalRef 필수. 승인만으로는 장부를 바꾸지 않는다(실행 뒤에만).
      operationId: decideDisposal
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: disposalApprovalId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '200':
          description: 결정 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisposalApproval' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SELF_APPROVAL / APPROVAL_REQUIRED / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /cdcs/{cdcId}/disposal-approvals/{disposalApprovalId}/executions:
    post:
      tags: [disposals]
      summary: '[0.2.0] 폐기 실행 — 실제 폐기한 수량·증빙만 cdc-inventory DISPOSE(보류 −q)'
      description: |
        그 센터 운영자. APPROVED·PARTIALLY_EXECUTED 만. 줄마다 승인량 − 실행 누계 − 진행 중 실행 이하(422 QTY_EXCEEDS_APPROVED), evidenceRef 필수(422 EVIDENCE_REQUIRED).
        실행 = Idempotency-Key 하나(재고 키 `cdcq-dex-<실행 ID>`). APPLIED 면 누계 +q, 다 실행하면 COMPLETED, 불명은 서버가 다시, 거절은 REJECTED(잔량 되돌림).
        승인 5·실행 3 이면 3 만 빠지고 2 는 보류 현물로 남는다(WMS CDC-F-028).
      operationId: executeDisposal
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: disposalApprovalId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidenceRef, lines]
              properties:
                evidenceRef: { type: string, maxLength: 128 }
                note: { type: string, maxLength: 500 }
                lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/ExactLine' } }
      responses:
        '200':
          description: 실행 결과가 반영된 폐기
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisposalApproval' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: QTY_EXCEEDS_APPROVED / EVIDENCE_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /fefo-exceptions:
    post:
      tags: [fefo-exceptions]
      summary: FEFO 예외 요청 (최소 잔여일수 미달 LOT 출고 허용, 이중 승인)
      description: |
        1차 승인(센터 품질 담당) + 2차 승인(본사 품질 책임자) 모두 기록돼야 APPROVED. 같은 사람이 둘 다 할 수 없다.
        승인된 예외는 TRF·LOT·수량·유효기간으로 한정되며 cdc-inventory 할당 시 참조된다.
      operationId: createFefoException
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, sku, lot, qty, trfId, reason, requesterId]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                lot: { type: string }
                qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                trfId: { type: string }
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                reason: { type: string, maxLength: 500 }
                requesterId: { type: string }
                validUntil: { type: string, format: date-time }
                firstApproval: { $ref: '#/components/schemas/ApprovalRecord' }
                secondApproval: { $ref: '#/components/schemas/ApprovalRecord' }
      responses:
        '201':
          description: 예외 요청 생성 또는 기존 반환(같은 키·같은 본문)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FefoException' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / SAME_APPROVER (1차·2차 동일인) / LOT_NOT_SHORT_DATED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /fefo-exceptions/{fefoExceptionId}:
    get:
      tags: [fefo-exceptions]
      summary: FEFO 예외 조회 (승인 단계·사용 수량)
      operationId: getFefoException
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: fefoExceptionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FefoException' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/operation-restrictions:
    post:
      tags: [operation-restrictions]
      summary: '[0.4.0] 운영 제한 걸기 — 센터(·온도대·SKU) 범위의 새 할당·출발 막기 → OperationRestrictionApplied'
      description: |
        WMS CDC-F-031(사용자 2026-11-26 "문서 그대로"): 사유별 거는 사람 —
        CONGESTION(혼잡) = 그 센터 CDC_MANAGER, SAFETY(안전 긴급) = 그 센터 운영자 누구나(현장 책임자), HQ(본사 부과)·QUALITY(품질) = 그 센터 운영자 + 본사 승인 번호(approvalRef — 없으면 422 APPROVAL_REQUIRED).
        activities(ALLOCATION 새 할당·추가 할당, DEPARTURE 출발 검증) 중 하나 이상. 범위: temperatureZone·skus 를 비우면 센터 전체, 둘 다 주면 둘 다 맞아야 한다. 이미 출발한 실적·잡힌 예약은 그대로(그 뒤의 새 처리만).
        중첩되면 활동마다 가장 강한 조건 — 맞는 제한이 하나라도 있으면 막는다. 시간이 지나도 자동으로 풀지 않는다(plannedUntil 은 안내).
      operationId: applyOperationRestriction
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRestrictionInput' }
      responses:
        '201':
          description: 제한(같은 키·같은 본문은 같은 제한)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationRestriction' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    get:
      tags: [operation-restrictions]
      summary: '[0.4.0] 운영 제한 목록 — 최신 순'
      operationId: listOperationRestrictions
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: state, in: query, schema: { type: string, enum: [ACTIVE, LIFTED] } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OperationRestriction' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cdcs/{cdcId}/operation-restrictions/{restrictionId}:
    get:
      tags: [operation-restrictions]
      summary: '[0.4.0] 운영 제한 조회'
      operationId: getOperationRestriction
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: restrictionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationRestriction' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/operation-restrictions/{restrictionId}/lifts:
    post:
      tags: [operation-restrictions]
      summary: '[0.4.0] 운영 제한 풀기(재개) → OperationRestrictionLifted'
      description: |
        CONGESTION = 그 센터 CDC_MANAGER. SAFETY·HQ·QUALITY = 그 센터 CDC_MANAGER + 본사 승인 번호(422 APPROVAL_REQUIRED — 안전 사고 재개·본사 부과·품질은 본사 승인). ACTIVE 만(409 INVALID_STATE).
      operationId: liftOperationRestriction
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: restrictionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approvalRef: { type: string, maxLength: 128 }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 풀린 제한
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationRestriction' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/operation-restriction-checks:
    post:
      tags: [operation-restrictions]
      summary: '[cdc-inventory·cdc-outbound→cdc-quality] 운영 제한 확인 (0.4.0) — 읽기만'
      description: |
        이 센터·활동에서 줄(sku·온도대)마다 맞는 ACTIVE 제한이 있는지. 아무것도 바꾸지 않는다 — POST 라 Idempotency-Key 는 아무 고유값(저장·재생 없음).
        부르는 쪽은 restricted 면 새 처리를 거절(OPERATION_RESTRICTED), 이 호출이 안 되면 새 처리를 보류한다(WMS CDC-F-031 "조회 실패면 해당 신규 처리를 보류").
      operationId: checkOperationRestrictions
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cdcId, activity, items]
              properties:
                cdcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                activity: { $ref: '#/components/schemas/RestrictedActivity' }
                items:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    required: [sku]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      temperatureZone: { type: [string, 'null'] }
      responses:
        '200':
          description: 확인 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  restricted: { type: boolean }
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        restrictionId: { type: string }
                        reason: { type: string }
                        sku: { type: string }

  /lot-traces:
    get:
      tags: [lot-traces]
      summary: LOT 계보 추적 (입고·적치·할당·출발·수령·보류·폐기 이력, 센터·TRF·LPN 연결)
      description: 각 정본의 사건 사본을 시간순으로 조합한 읽기 전용 보고서. 원천별 asOf를 포함한다.
      operationId: getLotTrace
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: sku, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - { name: lot, in: query, required: true, schema: { type: string } }
        - { name: centerId, in: query, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LotTrace' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    QuantityScope:
      type: object
      required: [sku, lot]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        lot: { type: string }
        locationCode: { type: string, description: 비우면 LOT 전체 }
        qty: { type: integer, minimum: 1, description: 비우면 범위 전량 }
    ApprovalRecord:
      type: object
      required: [approverId, approvalRef, decidedAt]
      properties:
        approverId: { type: string }
        approverRole: { type: string, enum: [CENTER_QUALITY, HQ_QUALITY_OFFICER] }
        approvalRef: { type: string }
        decision: { type: string, enum: [APPROVED, REJECTED] }
        decidedAt: { type: string, format: date-time }
    HoldInput:
      type: object
      required: [reason, lines]
      properties:
        reason: { type: string, enum: [TEMPERATURE_EXCURSION, TRANSPORT_INCIDENT, INSPECTION_FAILED, RECALL, SUSPECTED_CONTAMINATION, MANUAL] }
        sourceRef: { type: string, maxLength: 128, description: excursionId / incidentId / workResultId / recallId }
        evidenceRef: { type: string, maxLength: 128 }
        note: { type: string, maxLength: 1000 }
        lines: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/QuantityScope' } }
    HoldState:
      type: string
      description: APPLYING(반영 중) · UNKNOWN_RESULT(불명 — 서버가 다시) · APPLIED · REJECTED(재고 거절) · PARTIALLY_RELEASED · CLOSED(남은 보류 0 — 해제·폐기로 다 처리)
      enum: [APPLYING, UNKNOWN_RESULT, APPLIED, REJECTED, PARTIALLY_RELEASED, CLOSED]
    ExactLine:
      type: object
      required: [sku, lot, locationCode, qty]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        lot: { type: string }
        locationCode: { type: string }
        qty: { type: integer, minimum: 1 }
    DecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        reason: { type: string, maxLength: 500 }
        approvalRef: { type: string, maxLength: 128, description: 본사 승인 번호 — 본사 기준 이상일 때 }
    Hold:
      type: object
      properties:
        holdId: { type: string }
        cdcId: { type: string }
        reason: { type: string }
        sourceRef: { type: [string, 'null'] }
        evidenceRef: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/HoldState' }
        requestedBy: { type: string }
        rejectReason: { type: [string, 'null'] }
        lines:
          type: array
          items:
            type: object
            properties:
              lineNo: { type: integer }
              sku: { type: string }
              lot: { type: string }
              locationCode: { type: [string, 'null'] }
              requestedQty: { type: [integer, 'null'] }
              heldQty: { type: integer, description: 재고에서 실제로 보류된 수량 }
              releasedQty: { type: integer }
              disposedQty: { type: integer }
              commitId: { type: [string, 'null'] }
              state: { type: string, enum: [PENDING, UNKNOWN_RESULT, APPLIED, REJECTED] }
        releases: { type: array, items: { $ref: '#/components/schemas/HoldRelease' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HoldRelease:
      type: object
      properties:
        releaseId: { type: string }
        holdId: { type: string }
        state: { type: string, enum: [REQUESTED, APPLYING, UNKNOWN_RESULT, APPLIED, REJECTED, DECLINED] }
        requestedBy: { type: string }
        note: { type: [string, 'null'] }
        decidedBy: { type: [string, 'null'] }
        decisionReason: { type: [string, 'null'] }
        approvalRef: { type: [string, 'null'] }
        commitId: { type: [string, 'null'] }
        rejectReason: { type: [string, 'null'] }
        lines: { type: array, items: { $ref: '#/components/schemas/ExactLine' } }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    Recall:
      type: object
      properties:
        recallId: { type: string }
        sku: { type: string }
        lots: { type: array, items: { type: string } }
        reason: { type: string }
        severity: { type: [string, 'null'] }
        approvalRef: { type: string }
        externalRef: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        state: { type: string, enum: [TRACING, ISSUED], description: 'TRACING: 센터 찾기·보류 걸기 중(서버가 다시), ISSUED: 현물이 있던 모든 CDC 에 보류를 걸었다' }
        issuedBy: { type: string }
        centers:
          type: array
          items:
            type: object
            properties:
              cdcId: { type: string }
              lot: { type: string }
              holdId: { type: string }
              holdState: { type: string }
              heldQty: { type: integer }
        departures:
          type: array
          items:
            type: object
            properties:
              cdcId: { type: string }
              lot: { type: string }
              trfId: { type: string }
              departureId: { type: string }
              mfcId: { type: [string, 'null'] }
              departedAt: { type: string, format: date-time }
              q: { type: integer }
              received: { type: integer }
              unreconciled: { type: integer }
        traceFreshness: { type: string, enum: [CURRENT, UNAVAILABLE] }
        createdAt: { type: string, format: date-time }
    DisposalState:
      type: string
      enum: [REQUESTED, APPROVED, DECLINED, PARTIALLY_EXECUTED, COMPLETED]
    DisposalApproval:
      type: object
      properties:
        disposalApprovalId: { type: string }
        cdcId: { type: string }
        holdId: { type: string }
        reason: { type: string }
        note: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/DisposalState' }
        requestedBy: { type: string }
        decidedBy: { type: [string, 'null'] }
        decisionReason: { type: [string, 'null'] }
        approvalRef: { type: [string, 'null'] }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              lot: { type: string }
              locationCode: { type: string }
              approvedQty: { type: integer }
              executedQty: { type: integer }
        executions:
          type: array
          items:
            type: object
            properties:
              executionId: { type: string }
              state: { type: string, enum: [APPLYING, UNKNOWN_RESULT, APPLIED, REJECTED] }
              evidenceRef: { type: string }
              executedBy: { type: string }
              commitId: { type: [string, 'null'] }
              rejectReason: { type: [string, 'null'] }
              lines: { type: array, items: { $ref: '#/components/schemas/ExactLine' } }
              createdAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    FefoException:
      type: object
      properties:
        fefoExceptionId: { type: string }
        cdcId: { type: string }
        sku: { type: string }
        lot: { type: string }
        qty: { type: integer }
        trfId: { type: string }
        mfcId: { type: string }
        remainingDays: { type: integer }
        minRemainingDaysPolicy: { $ref: '_common.yaml#/components/schemas/PolicyValue' }
        state: { type: string, enum: [REQUESTED, FIRST_APPROVED, APPROVED, REJECTED, EXPIRED, CONSUMED] }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        firstApproval: { $ref: '#/components/schemas/ApprovalRecord' }
        secondApproval: { $ref: '#/components/schemas/ApprovalRecord' }
        validUntil: { type: string, format: date-time }
        consumedQty: { type: integer, description: cdc-inventory 할당에 사용된 수량 }
        createdAt: { type: string, format: date-time }
    RestrictedActivity:
      type: string
      description: ALLOCATION(cdc-inventory 새 할당·추가 할당) · DEPARTURE(cdc-outbound 출발 검증)
      enum: [ALLOCATION, DEPARTURE]
    OperationRestrictionInput:
      type: object
      required: [activities, reason]
      properties:
        activities: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RestrictedActivity' } }
        temperatureZone: { type: string, enum: [AMBIENT, CHILLED, FROZEN], description: 비우면 모든 온도대 }
        skus: { type: array, maxItems: 500, items: { $ref: '_common.yaml#/components/schemas/Sku' }, description: 비우면 모든 SKU }
        reason: { type: string, enum: [CONGESTION, SAFETY, HQ, QUALITY] }
