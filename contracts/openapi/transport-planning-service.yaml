openapi: 3.1.0
info:
  title: transport-planning-service
  version: 0.4.0
  description: |
    0.4.0(2026-11-27, DC 백오피스 화면 번호 DN-4): TransportOrder 에 `trfNumbers`(trfIds 순)·`stops[].trfNumbers`(그 정차 trfIds 순) —
      cdc-outbound 화면 번호(T+6) 사본(운송 요청 가져올 때 받은 값, 없으면 빈 문자열). 경로·나머지 모양 그대로.
    0.3.0(2026-11-26, 도크 배정 — DC 백오피스 TR-3/DK-2, 사용자 "계획완료 때 자동"): 계획완료가 fleet 점유 뒤 cdc-location 도크 예약(창 = 상차 시작 ~ 계획 출차, 지시서 온도대)을 잡는다.
      그 온도대 도크 칸이 없으면(409 NO_DOCK — LAN 옛 배치 등) 도크 없이 계획완료(dockCode null, 이력 NO_DOCK), 칸은 있으나 다 차면 409 CAPACITY_EXCEEDED 로 계획완료 거절(이번 점유만 풂).
      출차(운행 DEPARTED 사본)·취소 때 도크 예약을 푼다. TransportOrder·운행 사본에 dockCode·dockReservationId.
    간선(DC→MFC) 노선 마스터·이관요청서 수신·검증·운송지시서(배차 계획)의 정본. (docs/architecture/service-map.md §6)
    차량·기사·점유 정본은 fleet-service, 실제 입차·출차·인계는 transport-execution-service, TRF 수량·화물은 cdc-outbound·cdc-inventory. 이 서비스는 그 값의 사본만 가진다.
    0.2.0(2026-11-26, TMS 1단계 — 설계 docs/cdc/design/2026-11-26-tms-first-stage.md, 사용자 "TMS 2.3 에 맞춰"): 옛 0.1.0(TMS v1.1 — 후보 계산·S8 자원 예약 사가·지시서)을 바꿨다.
      - 노선(RT-)·노선 × 온도대 정규차 계약 → 출고일마다 운송지시서(TO-) 자동 생성(정본 7.1) → 수동 요청서 이동(7.3 의 1·2단계) → 계획완료(fleet 점유 + execution 운행) / 결행 / 취소.
      - 이관요청서는 cdc-outbound `GET /internal/transport-feed` 에서 가져온다(pull — cdc-outbound 가 TMS 를 부르지 않는다). 검증 V1~V8(정본 5.2), 온도대 하나(D-06).
      - 용차·자동 잔량 배분·OR-Tools 보조·도크 예약·운임은 뒤로. 칠곡은 용차 없음(CDC-8) — 용량을 넘으면 플래그만.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: routes, description: 고정 노선과 정규차 계약 }
  - { name: transport-requests, description: 이관요청서(TRF) 수신·검증 }
  - { name: transport-orders, description: 운송지시서(배차) }
  - { name: internal, description: 서비스 간 호출 }

paths:
  /cdcs/{cdcId}/routes:
    get:
      tags: [routes]
      summary: '[0.2.0] 노선 목록 — 노선 ID 순, 정차·정규차 포함'
      operationId: listRoutes
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Route' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [routes]
      summary: '[0.2.0] 노선 등록 (CDC_SUPERVISOR) — 정차 1~3곳(멀티드롭 최대 3 — 정본 7.4)'
      description: |
        정차 순서 = 방문 순서. 시각 검증(정본 3.3): 첫 정차 계획 도착 = 출차 + 첫 구간 분, 다음 정차 = 앞 정차 도착 + 하차 30분 + 구간 분.
        마지막 정차 도착이 07:30(Asia/Seoul, 출고 다음 날)을 넘으면 400 ROUTE_TIME_INFEASIBLE. 같은 MFC 가 살아 있는 다른 노선에 있으면 409 MFC_ALREADY_ROUTED.
      operationId: createRoute
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteInput' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /cdcs/{cdcId}/routes/{routeId}:
    get:
      tags: [routes]
      summary: '[0.2.0] 노선 하나'
      operationId: getRoute
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - { name: routeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/routes/{routeId}/regular-vehicles:
    post:
      tags: [routes]
      summary: '[0.2.0] 노선 × 온도대 정규차·기본 기사 지정 (CDC_SUPERVISOR) — 이미 있으면 바꿈'
      description: |
        fleet 에서 차량(REGULAR·사용 중·온도대 일치 — 아니면 409 VEHICLE_NOT_ELIGIBLE)과 기사(사용 중)를 확인하고 최대 R/T·중량 사본을 둔다. fleet 이 안 되면 503.
        이미 만든 운송지시서는 바뀌지 않는다(다음 생성부터).
      operationId: setRegularVehicle
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - { name: routeId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tempClass, vehicleId, driverId]
              properties:
                tempClass: { $ref: '#/components/schemas/TempClass' }
                vehicleId: { type: string }
                driverId: { type: string }
      responses:
        '200':
          description: 바뀐 노선
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /cdcs/{cdcId}/transport-requests:
    get:
      tags: [transport-requests]
      summary: '[0.2.0] 이관요청서 목록 — 잔여 물량 화면(state=HELD·ACCEPTED)'
      description: 출고일·상태·MFC 로 거른다. 기한(dueAt) 빠른 순. 보류·반려도 사유와 함께 그대로 보인다(정본 5.2 "숨기지 않음").
      operationId: listTransportRequests
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - { name: shipDate, in: query, schema: { type: string, format: date } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/TransportRequestState' } }
        - { name: mfcId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, hasNext]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TransportRequest' } }
                  page: { type: integer }
                  size: { type: integer }
                  hasNext: { type: boolean }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cdcs/{cdcId}/transport-requests/{trfId}:
    get:
      tags: [transport-requests]
      summary: '[0.2.0] 이관요청서 하나'
      operationId: getTransportRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - { name: trfId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/transport-orders/generations:
    post:
      tags: [transport-orders]
      summary: '[0.2.0] 출고일 배차 생성 — TRF 가져오기·검증 → 노선 × 온도대 운송지시서(계획중) (정본 7.1)'
      description: |
        1) cdc-outbound `GET /internal/transport-feed`(dueAt 이 [D 12:00, D+1 12:00) Asia/Seoul)에서 TRF 를 읽어 이관요청서를 만들거나 새 버전을 반영(V4·V5 — 계획중이면 반영·다시 연결, 계획완료 뒤 새 버전은 반영하지 않고 reason NEWER_VERSION(배차 담당이 지시서를 취소하고 다시 생성), 출차 뒤 새 버전은 반려 VERSION_AFTER_DEPARTURE).
        2) 검증(정본 5.2): V1 필수값·V2 노선에 든 MFC(없으면 HELD NO_ROUTE)·V6 할당(ALLOCATED 수용, PARTIALLY_ALLOCATED 할당량만, 전·실패 HELD ALLOCATION_PENDING, 취소 EXCLUDED)·
           D-06 온도대 하나(둘 이상 HELD MIXED_TEMPERATURE, 아직 모름 HELD TEMP_UNKNOWN)·V8 R/T > 그 온도대 정규차 최대 HELD OVER_VEHICLE_CAPACITY(R/T 카운팅 전이면 미룸)·V7 21:30 뒤 수신은 lateReceipt 표시만.
        3) 살아 있는 노선 × 온도대마다 운송지시서가 없으면 만든다(정규차·기본 기사 사본, 계획 시각 = 노선 시각). 정규차가 없는 노선·온도대는 만들지 않고 unplannedReasons 에 NO_REGULAR_VEHICLE.
        4) 수용 요청서를 그 MFC 노선·온도대의 계획중 지시서에 연결(이미 연결된 것은 그대로). 물량 0 지시서는 cancelCandidate. 적재 초과면 OVER_CAPACITY 플래그.
        다시 부르면 새·바뀐 TRF 만 반영한다(계획완료 뒤 지시서는 건드리지 않고, 새 TRF 는 HELD ORDER_CLOSED). cdc-outbound 가 안 되면 503(아무것도 바꾸지 않음).
      operationId: generateTransportOrders
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipDate]
              properties:
                shipDate: { type: string, format: date, description: 출고일 D(Asia/Seoul) }
      responses:
        '200':
          description: 생성 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipDate: { type: string, format: date }
                  orders: { type: array, items: { $ref: '#/components/schemas/TransportOrder' } }
                  requests:
                    type: object
                    description: 이번 호출에서 상태별 요청서 수
                    additionalProperties: { type: integer }
                  unplannedReasons:
                    type: array
                    items:
                      type: object
                      properties:
                        routeId: { type: string }
                        tempClass: { $ref: '#/components/schemas/TempClass' }
                        reason: { type: string }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /cdcs/{cdcId}/transport-orders:
    get:
      tags: [transport-orders]
      summary: '[0.2.0] 운송지시서 목록 — 배차 현황(노선 × 온도대·상태·적재율)'
      operationId: listTransportOrders
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - { name: shipDate, in: query, schema: { type: string, format: date } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/TransportOrderState' } }
        - { name: routeId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 출고일 → 계획 출차 → 노선 → 온도대 순
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, hasNext]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TransportOrder' } }
                  page: { type: integer }
                  size: { type: integer }
                  hasNext: { type: boolean }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /cdcs/{cdcId}/transport-orders/{orderId}:
    get:
      tags: [transport-orders]
      summary: '[0.2.0] 운송지시서 하나 — 정차·연결 요청서·변경 이력'
      operationId: getTransportOrder
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportOrder' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /cdcs/{cdcId}/transport-orders/{orderId}/request-moves:
    post:
      tags: [transport-orders]
      summary: '[0.2.0] 요청서 옮기기 — 이 계획중 지시서의 요청서를 같은 온도대 다른 계획중 지시서로 (정본 7.3 의 1·2단계, 수동)'
      description: |
        둘 다 PLANNING 이고 같은 출고일·온도대여야 한다(409 INVALID_STATE·TEMP_MISMATCH). 받는 지시서에 그 MFC 정차가 없으면 끝에 더한다 — 정차 3곳을 넘으면 409 TOO_MANY_STOPS,
        시각 검증(07:30)을 넘으면 409 ROUTE_TIME_INFEASIBLE. 받는 쪽 적재가 넘으면 OVER_CAPACITY 플래그(막지 않음). 두 지시서 version +1.
      operationId: moveTransportRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trfId, toOrderId]
              properties:
                trfId: { type: string }
                toOrderId: { type: string }
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: 받는 지시서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportOrder' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /cdcs/{cdcId}/transport-orders/{orderId}/confirmations:
    post:
      tags: [transport-orders]
      summary: '[0.2.0] 계획완료 — 차량·기사 확정(fleet 점유) → execution 운행 만들기 (정본 7.5)'
      description: |
        PLANNING 에서만, 연결 요청서가 하나 이상, OVER_CAPACITY 아님(409 OVER_CAPACITY — 용차 없음, 요청서를 옮기거나 WMS 가 나눠야 함).
        vehicleId·driverId 를 주면 바꾼다(차량은 같은 온도대·최대 R/T·중량이 지금 적재 이상 — 409 VEHICLE_NOT_ELIGIBLE). 트랜잭션 밖에서:
        fleet `POST /internal/reservations`(창 = 계획 상차 시작 ~ 계획 복귀, purposeRef = orderId — 겹치면 409 RESOURCE_OCCUPIED 그대로) → CONFIRMING →
        (0.3.0) cdc-location `POST /internal/dock-reservations`(창 = 상차 시작 ~ 계획 출차 — NO_DOCK 이면 도크 없이, CAPACITY_EXCEEDED 면 거절) →
        execution `POST /internal/trips`(tripId = orderId) → DISPATCHED, 요청서 ASSIGNED. execution 이 불명이면 CONFIRMING 으로 남고 같은 요청을 다시 보내면 이어서 한다(같은 키).
      operationId: confirmTransportOrder
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicleId: { type: string }
                driverId: { type: string }
      responses:
        '200':
          description: 계획완료된 지시서(DISPATCHED) 또는 CONFIRMING(execution 불명)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportOrder' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /cdcs/{cdcId}/transport-orders/{orderId}/skips:
    post:
      tags: [transport-orders]
      summary: '[0.2.0] 결행 — 운행하지 않음 (PLANNING, 연결 요청서 없을 때만 — 있으면 409 HAS_REQUESTS)'
      operationId: skipTransportOrder
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: 결행된 지시서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportOrder' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /cdcs/{cdcId}/transport-orders/{orderId}/cancellations:
    post:
      tags: [transport-orders]
      summary: '[0.2.0] 취소 — 출차 전만 (정본 11.1)'
      description: |
        PLANNING 이면 바로 CANCELLED. DISPATCHED 면 execution `POST /internal/trips/{tripId}/cancellations`(출차 뒤면 409 ALREADY_DEPARTED 그대로) → fleet 점유 해제 → CANCELLED.
        연결 요청서는 ACCEPTED 로 돌아가 잔여 물량에 다시 보인다.
      operationId: cancelTransportOrder
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CdcId'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: 취소된 지시서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportOrder' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/transport-orders/{orderId}/trip-updates:
    post:
      tags: [internal]
      summary: '[execution→planning] 운행 상태 사본 — 출차·운송완료를 지시서·요청서에 적는다 (멱등, 낮은 tripVersion 무시)'
      description: DEPARTED 면 요청서 DEPARTED, COMPLETED 면 정차별 인계 결과로 요청서 HANDED_OVER. 지시서 상태는 DISPATCHED 그대로(tripState 사본만).
      operationId: recordTripUpdate
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripState, tripVersion, at]
              properties:
                tripState: { type: string }
                tripVersion: { type: integer }
                at: { type: string, format: date-time }
                handedOverTrfIds: { type: array, items: { type: string } }
      responses:
        '204': { description: 반영함(또는 이미 반영) }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  parameters:
    CdcId: { name: cdcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  schemas:
    TempClass:
      type: string
      enum: [AMBIENT, CHILLED, FROZEN]
    RouteStopInput:
      type: object
      required: [mfcId, legMinutes]
      properties:
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        legMinutes: { type: integer, minimum: 1, maximum: 900, description: '앞 지점(첫 정차는 DC)에서 이 정차까지 주행 분 [가정 — 실측 행렬은 routing 단계]' }
    RouteInput:
      type: object
      required: [routeId, name, departureTime, stops, returnMinutes]
      properties:
        routeId: { type: string, pattern: '^RT-[0-9]{2,3}$' }
        name: { type: string, maxLength: 60 }
        departureTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: '계획 출차(Asia/Seoul, 출고일 D — 23:00 이전이면 D, 00:00~ 이면 D+1). 상차 시작은 30분 전' }
        stops: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/RouteStopInput' } }
        returnMinutes: { type: integer, minimum: 1, maximum: 900, description: 마지막 정차 → DC 복귀 주행 분 }
    Route:
      type: object
      required: [routeId, cdcId, name, departureTime, stops, returnMinutes, active, regularVehicles]
      properties:
        routeId: { type: string }
        cdcId: { type: string }
        name: { type: string }
        departureTime: { type: string }
        returnMinutes: { type: integer }
        active: { type: boolean }
        stops:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              mfcId: { type: string }
              legMinutes: { type: integer }
              plannedArrivalOffsetMinutes: { type: integer, description: 출차부터 이 정차 도착까지 분(하차 30분 포함 계산) }
        regularVehicles:
          type: array
          items:
            type: object
            properties:
              tempClass: { $ref: '#/components/schemas/TempClass' }
              vehicleId: { type: string }
              driverId: { type: string }
              maxRt: { type: integer }
              maxWeightKg: { type: integer }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
    TransportRequestState:
      type: string
      description: RECEIVED(검증 전 짧은 상태)·ACCEPTED(배차 대기)·HELD(보류)·REJECTED(반려)·EXCLUDED(제외 — 취소)·ASSIGNED(계획완료 지시서)·DEPARTED·HANDED_OVER
      enum: [RECEIVED, ACCEPTED, HELD, REJECTED, EXCLUDED, ASSIGNED, DEPARTED, HANDED_OVER]
    TransportRequest:
      type: object
      required: [trfId, trfVersion, cdcId, mfcId, shipDate, state]
      properties:
        trfId: { type: string }
        trfNumber: { type: [string, 'null'], description: cdc-outbound 화면 번호 }
        trfVersion: { type: integer }
        cdcId: { type: string }
        mfcId: { type: string }
        shipDate: { type: string, format: date }
        dueAt: { type: string, format: date-time }
        tempClass: { oneOf: [ { $ref: '#/components/schemas/TempClass' }, { type: 'null' } ], description: 온도대가 하나일 때만(둘 이상이면 null + HELD MIXED_TEMPERATURE) }
        tempClasses: { type: array, items: { $ref: '#/components/schemas/TempClass' } }
        allocationState: { type: string, description: cdc-outbound TRF 상태 사본 }
        approvedQty: { type: integer }
        acceptedQty: { type: integer, description: 수용 수량 — 부분할당이면 할당량(V6) }
        boxCount: { type: integer }
        rtCount: { type: [integer, 'null'], description: 'R/T 수(cdc-outbound RT LPN — 22:00 카운팅 전이면 null, 그동안 V8·적재 초과 검사는 미룬다)' }
        weightKg: { type: number }
        state: { $ref: '#/components/schemas/TransportRequestState' }
        reason: { type: [string, 'null'], description: '보류·반려 사유: NO_ROUTE·ALLOCATION_PENDING·MIXED_TEMPERATURE·TEMP_UNKNOWN·OVER_VEHICLE_CAPACITY·ORDER_CLOSED·NEWER_VERSION·MISSING_FIELDS·VERSION_AFTER_DEPARTURE·WRONG_ORIGIN' }
        lateReceipt: { type: boolean, description: 'V7 — 출고일 21:30 뒤 처음 받음(이월 판단은 배차 담당)' }
        orderId: { type: [string, 'null'] }
        receivedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransportOrderState:
      type: string
      description: PLANNING(계획중)·CONFIRMING(계획완료 진행 중 — execution 응답 대기)·DISPATCHED(계획완료 → 운행으로 넘김)·SKIPPED(결행)·CANCELLED
      enum: [PLANNING, CONFIRMING, DISPATCHED, SKIPPED, CANCELLED]
    TransportOrder:
      type: object
      required: [orderId, cdcId, shipDate, routeId, tempClass, state, version]
      properties:
        orderId: { type: string, description: 'TO-yyyyMMdd-nnn(출고일·순번) — 운행 tripId 와 같다' }
        cdcId: { type: string }
        shipDate: { type: string, format: date }
        arrivalDate: { type: string, format: date }
        routeId: { type: string }
        tempClass: { $ref: '#/components/schemas/TempClass' }
        contractType: { type: string, enum: [REGULAR, SPOT] }
        vehicleId: { type: [string, 'null'] }
        driverId: { type: [string, 'null'] }
        maxRt: { type: integer }
        maxWeightKg: { type: integer }
        loadRt: { type: integer }
        loadWeightKg: { type: number }
        loadRatio: { type: number, description: loadRt / maxRt }
        plannedLoadingStartAt: { type: string, format: date-time }
        plannedDepartureAt: { type: string, format: date-time }
        plannedReturnAt: { type: string, format: date-time }
        stops:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              mfcId: { type: string }
              plannedArrivalAt: { type: string, format: date-time }
              plannedDepartureAt: { type: string, format: date-time }
              trfIds: { type: array, items: { type: string } }
              trfNumbers: { type: array, items: { type: string }, description: '(0.4.0) trfIds 와 같은 순서의 화면 번호(없으면 빈 문자열)' }
              boxCount: { type: integer }
              rtCount: { type: integer }
        trfIds: { type: array, items: { type: string } }
        trfNumbers: { type: array, items: { type: string }, description: '(0.4.0) trfIds 와 같은 순서의 화면 번호(없으면 빈 문자열)' }
        cancelCandidate: { type: boolean, description: 물량 0 — 결행 후보(정본 7.1) }
        flags: { type: array, items: { type: string, enum: [OVER_CAPACITY] } }
        state: { $ref: '#/components/schemas/TransportOrderState' }
        reservationId: { type: [string, 'null'], description: fleet 점유 }
        dockCode: { type: [string, 'null'], description: '(0.3.0) 계획완료 때 자동 배정한 도크(cdc-location DOCK 칸) — 도크 칸이 없으면 null' }
        dockReservationId: { type: [string, 'null'] }
        tripState: { type: [string, 'null'], description: execution 운행 상태 사본 }
        reason: { type: [string, 'null'] }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        history:
          type: array
          description: 변경 이력(정본 8.2 — 생성·이동·차량 변경·계획완료·결행·취소)
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              action: { type: string }
              actorId: { type: [string, 'null'] }
              detail: { type: [string, 'null'] }
              version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
