openapi: 3.1.0
info:
  title: storefront-service
  version: 0.14.0
  description: |
    0.14.0(2026-11-24, 백오피스 행사 대상 테마 — 사용자 "행사 대상에 테마도 추가"): 내부 `GET /internal/storefront/themes` — 지금 게시된 진열의 테마(sectionId·kind·title·productIds).
      promotion-service 가 1분마다 받아 기간 할인 대상 THEME(그 테마 상품의 모든 옵션)을 정한다. 고객 API 는 그대로.
    0.13.0(2026-11-23, 백엔드 요청 availability-display §2 — 사용자 "모든 옵션 품절일 때만"·"조회 때 바로 묻기", 고객앱 SPLASH 회신 — 사용자 "넣어줘"):
      ① 진열 항목 `availability`(AVAILABLE·SOLD_OUT·UNKNOWN) — mfcId 를 줬을 때만. 응답에 담긴 상품으로 product-content 카드 일괄 조회(옵션별 mfc-inventory 가용 사본)를
      한 번(100건씩) 불러, 그 센터가 취급하는 옵션 중 하나라도 팔 수 있으면 AVAILABLE, 취급 옵션이 모두 품절이면 SOLD_OUT, 그 밖·조회 실패·시간 초과는 UNKNOWN. 없으면 null.
      검색 0.10.0 과 같은 판정. 거르기·정렬에는 쓰지 않는다. ② 고객용 배너(`Banner` — 홈 banners·BANNER 영역·`GET /storefront/banners`)에 편성의 `startsAt`·`endsAt`
      (없으면 null) — 앱이 저장해 둔 로딩 화면(SPLASH) 이미지를 기간이 지나면 그리지 않게.
    0.12.0(2026-11-23, 클라이언트 BR-84 — 사용자 "그 타이머 선택하는걸 백오피스에 기능을 넣고 싶고"): 편성 테마 `timerStyle`(LABEL 제목 위 글자 · BAND 띠 + 시·분·초 칸, 기본 LABEL) — `showTimer=true` 일 때만 뜻이 있고 false 면 null 로 저장·응답.
      홈·MD 탭 내용의 영역(Section)에도 같은 값. MD 탭 자체 타이머(`CustomTab.showTimer`)는 모양이 하나라 그대로.
    0.11.0(2026-11-22, 클라이언트 BR-82 "카테고리 화면 배너"): 편성 배너 자리에 `CATEGORY`(카테고리 화면 맨 위 — 모든 카테고리 화면 공통). 홈 `banners`·placement 없는
    배너 목록에는 나오지 않고 `GET /storefront/banners?placement=CATEGORY` 로만(POPUP·SPLASH 와 같음).
    0.10.0(2026-11-21 — 사용자 "넘김 간격 MD 가 편성 가능하도록, 순서 섞기도 추천대로"):
    ① 배너 넘김 간격 — 편성 `bannerIntervalSeconds`(2~30초, 비우면 앱 기본값). 홈 응답 `bannerIntervalSeconds`·배너 묶음 영역 `intervalSeconds`. 배너가 1개면 앱이 넘기지 않는다.
    ② 배너·테마 순서 섞기 — 배너 자리 `HOME_INLINE` + `groupId`(`G-…`, 같은 묶음은 한 자리에서 넘기기), 편성 `homeOrder`(배너 묶음 groupId·테마 sectionId 를 보일 순서대로).
    홈 `sections` 가 그 순서를 따르고 배너 묶음은 `kind: BANNER` 영역(`banners`·`intervalSeconds`, items 비움)으로 온다. homeOrder 에 없는 테마는 그 뒤에 예전처럼 sortOrder 순, 마지막은 "전체 상품".
    HOME_TOP(맨 위 넘기기)·HOME_MIDDLE 은 그대로 — `banners` 칸도 그대로(예전 앱).
    0.9.0(2026-11-21 홈 프로모션 보충 — 사용자 "1.(가) 2.풀어줘 진행순서대로"):
    ① 배너 자리 `POPUP`(앱 첫 화면 팝업)·`SPLASH`(처음 로딩 화면) — 홈 `banners` 에는 나오지 않고 `GET /storefront/banners?placement=POPUP|SPLASH` 로(placement 없으면 HOME_TOP·HOME_MIDDLE 만). "오늘 그만 보기"는 앱이 bannerId 로 기억한다.
    ② 타이머 테마 — 테마 `showTimer`(endsAt 필수), 홈 영역(Section)에 `endsAt`·`showTimer`(앱이 남은 시간 표시, 끝나면 서버가 자동으로 뺌).
    ③ 자동 랭킹 테마 — 테마 kind `RANKING_AUTO`(productIds 비움, `autoSize` 1~30 — 랭킹 탭과 같은 판매·평점 순위 상위 N, 랭킹 설정이 꺼져 있으면 영역 생략).
    ④ MD 탭 — 편성 본문 `tabs`(tabKey `X-…`·제목·테마 sectionIds·기간·showTimer). 탭에 넣은 테마는 HOME 에서 빠진다. 홈 응답 `customTabs`, 내용 `GET /storefront/custom-tabs/{tabKey}`.
    ⑤ 문구 검사 완화 — 할인·특가·쿠폰·세일·1+1 문구 허용(ADR-0082 쿠폰·기간 할인 활성). 근거 없는 "최저가"·"신선 보장"만 PROMOTION_NOT_ALLOWED 로 막는다.
    0.8.0(2026-11-21, ADR-0082 4단계 할인가 표시): 진열 항목에 기간 할인 `salePrice`·`discountRatePercent`·`discountName`·`discountEndsAt`
    (promotion-service SkuDisplayDiscountChanged — commerce.sku-display-discount.v1 사본). 대표 SKU 가격 사본과 같은 priceVersion 이고 끝 시각 전일 때만, 아니면 null(정가).
    표시용 — 결제 금액은 주문서 견적. 구독 추가: SkuDisplayDiscountChanged.
    0.7.1(2026-11-20 PC 2 요청): DISPLAY_APPROVER 도 초안 조회·목록·초안 배너 이미지를 읽는다(승인 전 내용 확인, 고치기·제출은 그대로 MD·OPERATOR_ADMIN).
    0.7.0(2026-11-20 ADR-0075 ② — BO-05 일반 배너·상품 테마 편성): 운영 초안 `/storefront/layout-drafts`(만들기·고치기·제출)·배너 이미지 `/storefront/banner-images`.
    제출 → approval DISPLAY(정본 storefront-service) 승인 → ApprovalDecided 를 받아 새 진열 버전(layoutVersion 1부터) 게시·반영 회신. HOME 탭 = 기간 안 배너(HOME_TOP·HOME_MIDDLE)
    + 기간 안 테마 영역(sortOrder 순, 넣은 상품 순서, 진열 가능·센터 취급만) + 마지막 "전체 상품". `POST /storefront/layout-publications` 는 쓰지 않는다(승인 반영으로 대체, 501).
    할인·쿠폰·특가·증정 문구는 제출 때 422 PROMOTION_NOT_ALLOWED(1차 범위).
    0.6.0(2026-11-20 ADR-0075 — 사용자 "프로모션부터 하자" → "탭 + 배너·테마"): **랭킹·신상품 탭** — 정책값 `pmart.storefront.tabs.new-window-days`(신규 판정기간)·
    `ranking-size`(랭킹 상품 수)가 있을 때만 `tabs` 에 RANKING·NEW 가 있고, 없으면 그 탭은 404(TAB_NOT_CONFIGURED). 랭킹 = 최근 판매(순위 신호 집계기간, ADR-0072) 많은 순 →
    베이지안 별점 점수 → 상품 ID, 판매 0 은 빠짐, 1위부터 ranking-size 까지(영역 `S-RANKING`, badge RANK·rank). 신상품 = 처음 게시가 신규 기간 안, 최신 순(영역 `S-NEW`, badge NEW).
    다른 영역(S-ALL)도 신규 기간 안 상품은 badge NEW. 배너·테마 편성(BO-05)은 다음 단계.
    0.5.0(2026-11-19 ADR-0072 — 사용자 "추천대로 5번 6번"): 상품 순위 신호를 낸다 — 사건 `ProductRankingSignalsChanged`(commerce.product-ranking.v1:
    별점·리뷰 수·베이지안 점수·최근 30일 판매), 구독 추가 order.order.v1 OrderConfirmed·OrderLineQuantityChanged. 내부 `POST /internal/storefront/ranking-signal-republications`
    (새 검색 색인 채우기 — 지금 값을 모두 다시 냄).
    홈 진열·배너·일반 테마·홈/랭킹/신상품 탭 구성과 발효 버전의 정본. 추천은 3차. (docs/architecture/service-map.md §1, 1단계 기본)
    비정본: 상품·가격·재고 정본. 같은 상품을 여러 진열에 보여도 다른 SKU·독립 재고를 만들지 않는다. 특가·기간 할인·할인 탭은 1차 제외.
    구독: ApprovalDecided(전시 승인 BO-05), ProductVersionPublished, PriceVersionEffective, SkuHandlingChanged(0.2.0).
    0.4.0(2026-11-19, 클라이언트 BR-63 "햇양파 리뷰 480개가 홈에 안 보임"): 진열 항목 `rating`(평균, 소수 첫째 — 리뷰 없으면 null)·`reviewCount`(공개 리뷰 수, 없으면 0)를
    채운다 — review 사건(commerce.review.v1 ReviewPublished·ReviewDeleted) 사본으로 센다(product-content 평점 집계와 같은 기준). 구독 추가: ReviewPublished·ReviewDeleted.
    0.3.0(2026-11-19, 클라이언트 BR-19 "100g당 가격" — 사용자 "응"): 진열 항목에 `netContent`(대표 SKU 내용량 — ProductVersionPublished 사본)와
    `unitPrice`(basis 100, unit G/ML, price = basePrice × 100 ÷ 내용량, 원 단위 반올림). 내용량·가격 중 하나라도 없으면 unitPrice 없음.
    0.2.0(2026-11-19, 클라이언트 BR-49 — 사용자 "진행해줘"): **mfcId 를 주면 그 센터가 취급하지 않는 상품은 홈·탭·섹션 항목에서 뺀다**(검색 기본
    includeNotCarried=false 와 같은 기준 — 상품 대표 SKU 의 센터 취급 사본, mfc-inventory SkuHandlingChanged, 레코드 없음 = 취급 안 함).
    남은 항목은 `carried=true`. mfcId 가 없으면 거르지 않고 `carried=null`(불명). 빼고 나서 섹션이 비어도 **섹션은 생략하지 않고 items=[]·nextCursor=null**
    (state OK) — 섹션 항목 목록도 빈 쪽 + 다음 커서 없음(검색과 같음). 정책: 미취급은 **숨김**(검색과 같다 — 사용자 결정, Commerce "구분 표시"와 다름은 회신에 적음).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: storefront, description: 고객 홈·탭·진열 영역·배너 조회 }
  - { name: layouts, description: 전시 구성 발효 명령(승인 결과 참조) }
  - { name: internal, description: 서비스 간 조회(서비스 토큰) }

paths:
  /storefront/home:
    get:
      tags: [storefront]
      summary: 홈 화면 구성 (탭·진열 영역 목록·배너. 영역별 첫 묶음 포함)
      description: |
        영역별 조회는 독립적으로 실패할 수 있다. 실패 영역은 sections[].state=UNAVAILABLE로 표시하고 성공 영역은 유지한다.
        가격·판매 상태는 사본이며 영역별 asOf를 표시한다.
      operationId: getHome
      security: []
      parameters:
        - { name: mfcId, in: query, description: 현재 쇼핑 주소 담당 센터, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: tab, in: query, schema: { $ref: '#/components/schemas/TabKey' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeLayout' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /storefront/custom-tabs/{tabKey}:
    get:
      tags: [storefront]
      summary: MD 탭 진열 (0.9.0) — 지금 버전의 기간 안 MD 탭과 그 테마 영역
      operationId: getCustomTab
      security: []
      parameters:
        - { name: tabKey, in: path, required: true, schema: { type: string, pattern: '^X-[A-Za-z0-9_-]{1,38}$' } }
        - { name: mfcId, in: query, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomTabLayout' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /storefront/tabs/{tabKey}:
    get:
      tags: [storefront]
      summary: 탭별 진열 (HOME/RANKING/NEW. 신규 판정기간·순위 집계기간은 승인 설정)
      operationId: getTab
      security: []
      parameters:
        - { name: tabKey, in: path, required: true, schema: { $ref: '#/components/schemas/TabKey' } }
        - { name: mfcId, in: query, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeLayout' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /storefront/sections/{sectionId}/items:
    get:
      tags: [storefront]
      summary: 진열 영역의 다음 상품 묶음 (가로 넘기기·전체보기. 같은 응답 재수신 시 중복 추가 없음)
      operationId: listSectionItems
      security: []
      parameters:
        - { name: sectionId, in: path, required: true, schema: { type: string } }
        - { name: mfcId, in: query, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: layoutVersion, in: query, description: 홈 응답의 layoutVersion. 다르면 LAYOUT_VERSION_CHANGED, schema: { type: integer } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sectionId: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/DisplayItem' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: LAYOUT_VERSION_CHANGED (새 구성 발효. 홈 재조회)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /storefront/banners:
    get:
      tags: [storefront]
      summary: 일반 배너 목록 (쿠폰·행사 배너는 1차 제외)
      operationId: listBanners
      security: []
      parameters:
        - { name: placement, in: query, schema: { type: string, enum: [HOME_TOP, HOME_MIDDLE, CATEGORY, POPUP, SPLASH] }, description: '없으면 HOME_TOP·HOME_MIDDLE(0.9.0). POPUP·SPLASH 는 지정해야 나온다' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  layoutVersion: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/Banner' } }

  /storefront/layout-drafts:
    post:
      tags: [layouts]
      summary: '[운영] 진열 편성 초안 만들기 — 일반 배너·상품 테마 (0.7.0, ADR-0075 BO-05)'
      description: |
        MD·OPERATOR_ADMIN. `fromCurrent=true` 면 지금 게시본(배너·테마)을 복사해 시작한다(본문은 무시). 초안은 고객 화면을 바꾸지 않는다.
        본문 형식은 LayoutDraftBody — 할인·쿠폰·특가·증정 문구는 제출 때 막는다(1차 범위).
      operationId: createLayoutDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: fromCurrent, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutDraftBody' }
      responses:
        '201':
          description: 초안
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutDraft' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    get:
      tags: [layouts]
      summary: '[운영] 진열 편성 초안 목록 (0.7.0) — 최근 순'
      description: MD·OPERATOR_ADMIN·DISPLAY_APPROVER(승인 전 내용 확인, 0.7.1).
      operationId: listLayoutDrafts
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [DRAFT, SUBMITTED, PUBLISHED, REJECTED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LayoutDraft' } }
                  currentLayoutVersion: { type: integer, description: 지금 게시된 버전(0 = 기본 진열) }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /storefront/layout-drafts/{draftId}:
    get:
      tags: [layouts]
      summary: '[운영] 진열 편성 초안 (0.7.0)'
      description: MD·OPERATOR_ADMIN·DISPLAY_APPROVER(승인 전 내용 확인, 0.7.1). 초안 이미지(banner-images)도 같은 역할이면 읽을 수 있다.
      operationId: getLayoutDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutDraft' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    put:
      tags: [layouts]
      summary: '[운영] 진열 편성 초안 고치기 (DRAFT·REJECTED 만, 0.7.0)'
      operationId: updateLayoutDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutDraftBody' }
      responses:
        '200':
          description: 고친 초안(REJECTED 였으면 DRAFT 로)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutDraft' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /storefront/layout-drafts/{draftId}/submissions:
    post:
      tags: [layouts]
      summary: '[운영] 진열 편성 초안 제출 — 검사·잠금, 승인 요청 본문 (0.7.0)'
      description: |
        검사를 통과하면 SUBMITTED·draftHash 를 확정하고 `approvalRequest` 를 준다 — 백오피스가 approval-service `POST /change-requests` → `/submissions`
        로 그대로 보낸다(종류 DISPLAY, 정본 storefront-service, targetRef = draftId). DISPLAY_APPROVER 가 승인하면 storefront 가 ApprovalDecided 를 받아
        새 진열 버전으로 게시한다(승인 행의 draftHash 가 다르면 반영하지 않음). 반려되면 초안은 REJECTED(고쳐서 다시 제출).
        422 code LAYOUT_INVALID, 걸린 곳 모두 details(field·reason): PRODUCT_NOT_PUBLISHED(진열할 수 없는 상품 — field = productId) ·
        IMAGE_NOT_FOUND · INVALID_LINK · INVALID_PERIOD · INVALID_PLACEMENT · DUPLICATE_ID · DUPLICATE_PRODUCT ·
        PROMOTION_NOT_ALLOWED(할인·"N% off"·쿠폰·특가·증정·사은품·1+1·세일·최저가·신선 보장 문구 — 1차 범위. "100% 국내산" 같은 %는 통과).
        배너·테마가 없는 본문도 제출할 수 있다(철회 = 뺀 새 버전).
      operationId: submitLayoutDraft
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 잠금·승인 요청 본문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutDraftSubmission' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: 검사 실패(details 위)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /storefront/banner-images:
    post:
      tags: [layouts]
      summary: '[운영] 배너 이미지 올리기 (0.7.0) — JPEG·PNG·WEBP 5MB 이하'
      operationId: uploadBannerImage
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 저장
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BannerImage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422':
          description: IMAGE_INVALID(형식·크기)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /storefront/banner-images/{imageId}:
    get:
      tags: [storefront]
      summary: 배너 이미지 본문 (0.7.0 — 토큰 없이, 게시된 진열에 쓰인 것만. MD·OPERATOR_ADMIN·DISPLAY_APPROVER 토큰이면 초안 것도, 0.7.1)
      operationId: getBannerImage
      security: []
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 이미지 바이트(바뀌지 않음 — 1년 immutable)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /storefront/layout-publications:
    post:
      tags: [layouts]
      summary: 전시 구성 발효 (approval BO-05 승인 결과 참조) — 0.7.0 부터 쓰지 않음(501, 승인 반영이 게시)
      description: |
        **0.7.0(ADR-0075): 쓰지 않는다** — storefront 가 ApprovalDecided(DISPLAY·storefront-service)를 받아 바로 게시한다. 501 NOT_IMPLEMENTED.
        승인된 전시 초안(draftId)을 새 layoutVersion으로 발효한다. 참조 상품은 product 승인 버전·판매 상태를 재확인하며 판매중지 상품은 진열에서 제외한다.
        테마 진열을 새 공식 카테고리·독립 SKU로 전환하지 않는다.
      operationId: publishLayout
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 승인(BO-05) 결과를 반영하는 백오피스 작업으로 봄"
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalId, draftId]
              properties:
                approvalId: { type: string }
                draftId: { type: string }
                effectiveFrom: { type: string, format: date-time, description: 생략 시 즉시 }
                scope: { type: string, enum: [HOME, RANKING, NEW, BANNERS, ALL], default: ALL }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / DRAFT_NOT_FOUND / PRODUCT_NOT_PUBLISHED (초안 참조 상품의 승인 버전 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /storefront/layout-publications/{requestId}:
    get:
      tags: [layouts]
      summary: 전시 발효 결과 조회 (발효 layoutVersion·제외된 상품)
      operationId: getLayoutPublication
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 발효 요청자(운영자)의 결과 조회로 봄"
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  layoutVersion: { type: integer }
                  effectiveFrom: { type: string, format: date-time }
                  excludedProducts:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string }
                        reason: { type: string }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  # ---------- internal (서비스 토큰) ----------
  /internal/storefront/ranking-signal-republications:
    post:
      tags: [internal]
      summary: '[운영·재색인] 상품 순위 신호를 모두 다시 낸다 (0.5.0, ADR-0072)'
      description: 새 검색 색인(products-v6 등)을 채울 때 부른다 — 바뀌지 않았어도 상품마다 ProductRankingSignalsChanged 를 다시 낸다(버전 +1). 게이트웨이에 없다.
      operationId: republishRankingSignals
      responses:
        '200':
          description: 낸 건수
          content:
            application/json:
              schema:
                type: object
                required: [published]
                properties:
                  published: { type: integer }

  /internal/storefront/themes:
    get:
      tags: [internal]
      summary: '[promotion→storefront] 지금 게시된 진열의 테마 목록 (0.14.0)'
      description: |
        2026-11-24 행사 대상 테마(promotion THEME). 지금 게시 버전(가장 큰 layoutVersion)의 테마 전부 — MD 탭에 넣은 테마도 포함, 테마 노출 기간은 보지 않는다(행사 기간은 promotion 이 본다).
        게시 버전이 없으면 layoutVersion 0·빈 목록(기본 진열의 자동 영역은 테마가 아니다). RANKING_AUTO 는 productIds 가 비어 있다.
      operationId: listPublishedThemesInternal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [layoutVersion, themes]
                properties:
                  layoutVersion: { type: integer }
                  themes:
                    type: array
                    items:
                      type: object
                      required: [sectionId, kind, title, productIds]
                      properties:
                        sectionId: { type: string }
                        kind: { type: string, enum: [THEME, SEASON, WEEKLY_PICK, RANKING_AUTO] }
                        title: { type: string }
                        productIds: { type: array, items: { type: string } }

  /internal/storefront/layout-versions/current:
    get:
      tags: [internal]
      summary: '[approval/bff→storefront] 현재 발효 구성 버전·원승인 참조·반영 상태'
      operationId: getCurrentLayoutVersionInternal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  layoutVersion: { type: integer }
                  approvalId: { type: string }
                  effectiveFrom: { type: string, format: date-time }
                  scheduled:
                    type: array
                    items:
                      type: object
                      properties:
                        layoutVersion: { type: integer }
                        effectiveFrom: { type: string, format: date-time }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

components:
  schemas:
    TabKey:
      type: string
      description: 할인 탭(DEAL)은 1차 제외
      enum: [HOME, RANKING, NEW]
    DisplayItem:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        imageUrl: { type: string, format: uri }
        representativeSku: { $ref: '_common.yaml#/components/schemas/Sku' }
        basePrice: { $ref: '_common.yaml#/components/schemas/Money', description: pricing 사본 }
        priceVersion: { type: integer }
        salePrice: { type: [integer, 'null'], minimum: 0, description: '(0.8.0) 기간 할인가(대표 SKU 개당). 할인 없음·가격 버전 다름·끝남이면 null' }
        discountRatePercent: { type: [integer, 'null'], description: '(0.8.0) 할인율(내림, %)' }
        discountName: { type: [string, 'null'], description: '(0.8.0) 행사 이름' }
        discountEndsAt: { type: [string, 'null'], format: date-time, description: '(0.8.0) 행사 끝' }
        netContent:
          type: [object, 'null']
          description: '0.3.0 — 대표 SKU 내용량(product 사본, 판매 단위 전체). 내용량 없이 등록된 상품은 null'
          required: [amount, unit]
          properties:
            amount: { type: integer, minimum: 1, description: 'g 또는 mL' }
            unit: { type: string, enum: [G, ML] }
        unitPrice:
          type: [object, 'null']
          description: '0.3.0 — 카드의 "100g당 999원". price = round(basePrice × basis ÷ netContent.amount), 0.5 올림. basePrice·netContent 가 둘 다 있을 때만. 할인가 기준이면 앱이 같은 식을 쓴다'
          required: [basis, unit, price]
          properties:
            basis: { type: integer, example: 100 }
            unit: { type: string, enum: [G, ML] }
            price: { $ref: '_common.yaml#/components/schemas/Money' }
        saleState: { type: string, enum: [ON_SALE, TEMPORARILY_SOLD_OUT, SALE_STOPPED, UNKNOWN] }
        carried: { type: [boolean, 'null'], description: '0.2.0 — mfcId 를 주면 미취급은 오지 않으므로 늘 true. mfcId 가 없으면 null(판정 안 함)' }
        availability:
          type: [string, 'null']
          enum: [AVAILABLE, SOLD_OUT, UNKNOWN, null]
          description: '(0.13.0) mfcId 지정 시 그 센터의 판매 가능 여부 — 취급 옵션 하나라도 가능 AVAILABLE, 취급 옵션 모두 품절 SOLD_OUT, 그 밖·조회 실패 UNKNOWN(품절이라고 하지 않음). mfcId 없으면 null'
        rating: { type: [number, 'null'], description: '(0.4.0 BR-63) 공개 리뷰 평균 별점(소수 첫째). 리뷰가 없으면 null(0점 아님)' }
        reviewCount: { type: integer, minimum: 0, description: '(0.4.0 BR-63) 공개 리뷰 수' }
        badge: { type: string, enum: [NEW, RANK, NONE] }
        rank: { type: integer }
    LayoutBanner:
      type: object
      x-added-in: '2026-11-20'
      required: [bannerId, placement, imageId, altText, linkType]
      properties:
        bannerId: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$', description: 초안 안에서 고유 }
        placement: { type: string, enum: [HOME_TOP, HOME_MIDDLE, POPUP, SPLASH, HOME_INLINE, CATEGORY], description: '0.11.0 CATEGORY = 카테고리 화면 맨 위(홈에는 안 나옴). 0.9.0 POPUP = 앱 첫 화면 팝업, SPLASH = 처음 로딩 화면. 0.10.0 HOME_INLINE = 홈 순서(homeOrder) 안의 배너 묶음 자리(groupId 필수)' }
        groupId: { type: [string, 'null'], pattern: '^G-[A-Za-z0-9_-]{1,38}$', description: '0.10.0 HOME_INLINE 배너 묶음 ID(같은 묶음은 한 자리에서 넘기기). 다른 자리면 비움(INVALID_GROUP)' }
        imageId: { type: string, description: '`POST /storefront/banner-images` 결과' }
        altText: { type: string, minLength: 1, maxLength: 100, description: 접근성 설명(화면 읽기) }
        linkType: { type: string, enum: [SECTION, CATEGORY, PRODUCT, NONE] }
        linkRef: { type: [string, 'null'], maxLength: 80, description: 'SECTION = 같은 초안의 테마 sectionId · CATEGORY = 카테고리 ID · PRODUCT = 상품 ID · NONE = 비움' }
        sortOrder: { type: integer, minimum: 0 }
        startsAt: { type: [string, 'null'], format: date-time, description: 비우면 게시 즉시 }
        endsAt: { type: [string, 'null'], format: date-time, description: 비우면 끝 없음 }
    LayoutTheme:
      type: object
      x-added-in: '2026-11-20'
      required: [sectionId, kind, title]
      properties:
        sectionId: { type: string, pattern: '^T-[A-Za-z0-9_-]{1,38}$', description: '테마 영역 ID(T- 로 시작, 초안 안에서 고유) — 영역 다음 묶음 경로에 쓴다' }
        kind: { type: string, enum: [THEME, SEASON, WEEKLY_PICK, RANKING_AUTO], description: '0.9.0 RANKING_AUTO = 상품을 넣지 않고 랭킹 상위 autoSize 개를 자동으로' }
        title: { type: string, minLength: 1, maxLength: 40 }
        subtitle: { type: [string, 'null'], maxLength: 80 }
        productIds: { type: array, maxItems: 50, items: { type: string }, description: '보일 순서 그대로. RANKING_AUTO 가 아니면 1개 이상(EMPTY_THEME), RANKING_AUTO 는 비움(INVALID_AUTO_THEME)' }
        autoSize: { type: [integer, 'null'], minimum: 1, maximum: 30, description: '0.9.0 RANKING_AUTO 의 상위 몇 개(필수)' }
        showTimer: { type: boolean, default: false, description: '0.9.0 남은 시간 표시 — endsAt 필수(TIMER_NEEDS_END)' }
        timerStyle: { type: [string, 'null'], enum: [LABEL, BAND, null], x-added-in: '2026-11-23', description: '0.12.0 BR-84 남은 시간 머리 모양 — LABEL(제목 위 분홍 글자, 기본)·BAND(연분홍 띠 + 시·분·초 칸). showTimer=false 면 무시(null 로 저장)' }
        sortOrder: { type: integer, minimum: 0 }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
    LayoutDraftBody:
      type: object
      x-added-in: '2026-11-20'
      properties:
        banners: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/LayoutBanner' } }
        themes: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/LayoutTheme' } }
        tabs: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/LayoutTab' }, description: '0.9.0 MD 탭' }
        homeOrder:
          type: array
          maxItems: 40
          items: { type: string }
          description: '0.10.0 홈 순서 — 배너 묶음 groupId(G-…)·테마 sectionId(T-…)를 보일 순서대로. 없는 것·MD 탭에 넣은 테마 UNKNOWN_SECTION, 중복 DUPLICATE_ID, HOME_INLINE 묶음이 빠지면 UNPLACED_GROUP. 비우면 예전 순서(테마 sortOrder)'
        bannerIntervalSeconds: { type: [integer, 'null'], minimum: 2, maximum: 30, description: '0.10.0 배너 자동 넘김 간격(초) — 맨 위 넘기기·배너 묶음 모두. 비우면 앱 기본값(INVALID_INTERVAL)' }
        note: { type: [string, 'null'], maxLength: 200, description: 운영 메모(고객에게 안 보임) }
    LayoutTab:
      type: object
      x-added-in: '2026-11-21'
      required: [tabKey, title, sectionIds]
      properties:
        tabKey: { type: string, pattern: '^X-[A-Za-z0-9_-]{1,38}$', description: 'MD 탭 ID(X- 로 시작, 초안 안에서 고유)' }
        title: { type: string, minLength: 1, maxLength: 20 }
        sectionIds: { type: array, minItems: 1, maxItems: 10, items: { type: string }, description: '이 탭에 보일 테마 sectionId(보일 순서). 한 테마는 한 탭에만, 탭에 넣은 테마는 HOME 에서 빠진다(UNKNOWN_SECTION·DUPLICATE_ID)' }
        sortOrder: { type: integer, minimum: 0 }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        showTimer: { type: boolean, default: false, description: 'endsAt 필수' }
    LayoutDraft:
      allOf:
        - $ref: '#/components/schemas/LayoutDraftBody'
        - type: object
          required: [draftId, state, version, createdBy, createdAt]
          properties:
            draftId: { type: string }
            state: { type: string, enum: [DRAFT, SUBMITTED, PUBLISHED, REJECTED] }
            version: { type: integer, description: '고칠 때 X-Expected-Version' }
            draftHash: { type: [string, 'null'], description: 제출 때 잠근 본문 해시 }
            approvalId: { type: [string, 'null'] }
            layoutVersion: { type: [integer, 'null'], description: 게시된 진열 버전(PUBLISHED) }
            rejectionReason: { type: [string, 'null'] }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: [string, 'null'], format: date-time }
    LayoutDraftSubmission:
      type: object
      x-added-in: '2026-11-20'
      required: [draftId, draftHash, approvalRequest]
      properties:
        draftId: { type: string }
        draftHash: { type: string }
        approvalRequest:
          type: object
          description: approval-service `POST /change-requests` 본문 그대로(종류 DISPLAY, 정본 storefront-service, targetRef = draftId, 행 attributes.draftHash)
          additionalProperties: true
    BannerImage:
      type: object
