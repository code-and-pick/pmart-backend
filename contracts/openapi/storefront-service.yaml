        banners: { type: array, items: { $ref: '#/components/schemas/Banner' }, description: '0.10.0 kind BANNER 영역의 배너(순서대로 넘기기). 그 밖 영역은 없음' }
        intervalSeconds: { type: [integer, 'null'], description: '0.10.0 kind BANNER 영역의 넘김 간격(초) — 편성 bannerIntervalSeconds, 비면 null(앱 기본값)' }
