openapi: 3.1.0
info:
  title: mfc-inventory-service
  version: 0.15.0
  description: |
    MFC 재고 수량의 **단일 쓰기 주체**. (docs/architecture/service-map.md §5, ADR-0002)
    정본: Balance(센터·위치·SKU·LOT·품질상태·업무상태·수량·버전), LedgerEntry, ReservationPart, MoveAllocation(물량 M·공간 V), commitId 원장.
    비정본: 작업·포장·인계 fence(mfc-fulfillment), 수령 사실(mfc-inbound), 품질 판정(mfc-quality), 위치 마스터(mfc-location), 취소 판단(order-orchestration).

    수량 기호와 불변식
    - H(On-hand 현물), Q(격리), E(판매가능 실물 = H − Q − 미검수), R(예약), A(가용)
    - **0 ≤ R ≤ E ≤ H, A = E − R**
    - TIN(수령): H+q (E 제외, 검수 후 E+q). 인계 확정: H−q, E−q, R−q 를 **한 사건**으로 전기.
    - 격리: Q+q, E−q, 영향 ReservationPart → BLOCKED. 회수품 인수: H+q, Q+q. 폐기: 승인 잔량 내 H−q, Q−q.
    모든 변경은 commitId를 갖는다. 호출자는 자체 사본으로 성공을 판단하지 않고 commitId/requestId 조회로 확정한다.
    가용 조회 실패는 0이 아니라 503 DEPENDENCY_UNAVAILABLE 이다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: reservations, description: 예약 ReservationPart (HELD→CONFIRMED/RELEASED/EXPIRED/BLOCKED) }
  - { name: counts, description: 순환 실사·차이 조정(IV-11) }
  - { name: postings, description: 수량 전기 명령 (수령·작업·인계·품질·조정) }
  - { name: queries, description: 가용·스냅샷·원결과 조회 }
  - { name: sku-handlings, description: 센터 SKU 취급 ON·OFF (운영자 — 자기 센터) }
  - { name: skus, description: 상품 SKU 투영 조회 }
  - { name: moves, description: '재고 위치 이동 — 이동 배정·집어 올리기·내려놓기(IV-03, 0.12.0)' }

paths:
  /internal/reservations:
    post:
      tags: [reservations]
      summary: '[orchestration→inventory] ReserveInventory — 결제 직전 재고 예약 (all-or-nothing)'
      description: |
        행별 요청량 ≤ A 를 검증하고 동일 SKU는 합산한다. 한 행이라도 부족하면 전체 거절(INSUFFICIENT_STOCK, 부족 행 details 포함).
        TTL 기본 10분 `[Q-04]`. 만료 시 InventoryHoldExpired 발행, R−q.

        슬라이스 4 구현(2026-10-30): 원장은 센터·SKU 한 행(LOT·위치·품질 차원 없음). 예약 SKU 행을 SKU 오름차순으로 잠가(`FOR UPDATE`)
        직렬화하므로 마지막 수량 경합에서 총 성공량 ≤ A 다. 거절은 기록하지 않으므로 같은 키 재요청은 다시 판정한다.
        - INSUFFICIENT_STOCK details: `field` = sku, `reason` = `requestedQty=<합산 요청량>;availableQty=<A>`
        - SKU_NOT_HANDLED details: `field` = sku, `reason` = `HANDLING_OFF`
        - lotConstraint 는 아직 지원하지 않는다(400 VALIDATION_FAILED).
      operationId: reserveInventory
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveInventoryRequest' }
      responses:
        '201':
          description: 예약 생성 (resultId = reservationId, status APPLIED)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: INSUFFICIENT_STOCK (details에 부족 sku·requestedQty·availableQty) / SKU_NOT_HANDLED(센터 취급 OFF) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/reservations/{reservationId}:
    get:
      tags: [reservations]
      summary: 예약 조회 (상태·행별 HELD/CONFIRMED 수량·만료 시각)
      operationId: getReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/reservations/{reservationId}/pick-plan:
    get:
      tags: [reservations]
      summary: '[fulfillment→inventory] 피킹 지시 — 예약 조각(LOT)별 남은 집품량과 선반 위치 후보 (IV-07, 0.5.0)'
      description: |
        조각마다 계획(qty)·집품(pickedQty)·포장(packedQty)과, 그 LOT 의 NORMAL·STORED 단위가 있는 위치(코드 순, 위치별 수량)를 준다.
        위치 수량은 그 LOT 의 선반 잔량이며 이 예약 몫만이 아니다(같은 LOT 을 다른 주문도 잡을 수 있다). 지시는 참고이고, 실제 집품은 CommitTaskExecution PICK 이 판정한다.
      operationId: getPickPlan
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickPlan' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/reservations/{reservationId}/location-allocations:
    post:
      tags: [reservations]
      summary: '[fulfillment→inventory] 예약의 위치 배정 — 피킹 시작 때 LOT 예약을 선반 위치로 나눈다 (IV-05·WK-10 위치 세분화, 0.11.0)'
      description: |
        확정(CONFIRMED) 예약의 조각마다 아직 배정 안 된 남은 집품량을 그 LOT 의 선반(NORMAL·STORED) 위치에 나눠 적는다. 수량을 새로 빼지 않는다(R 불변) — 같은 예약을 어느 칸 몫인지 나눌 뿐.
        위치 가용 = 선반 잔량 − 조사 보류 − 다른 조각의 남은 배정. 고르는 규칙(Q-08 전 임시): 한 칸에서 다 집을 수 있으면 그런 칸 중 가용이 가장 적은 칸(같으면 코드 순), 없으면 가용 많은 칸부터.
        가용이 모자라면 배정할 수 있는 만큼만 하고 나머지는 unallocatedQty(오류 아님 — 피킹 때 결품 보고).
        이미 배정된 양은 다시 배정하지 않으므로 다시 불러도 같은 결과(멱등). 예약이 CONFIRMED 가 아니면 409.
      operationId: allocateReservationLocations
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 배정 결과(이 예약의 지금 배정 전체)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickPlan' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /mfcs/{mfcId}/unshippable-lots:
    get:
      tags: [moves]
      summary: 출하 부적격 LOT 회수 목록 (0.13.0)
      description: |
        2026-11-08 사용자 결정: 같은 상품의 여러 LOT 이 한 칸에 섞여도 되지만, 출하 기준(상품 소비기한 보장, 없으면 보관 유형 최소 잔여일 — 오늘 기준)을
        못 맞추는 LOT 은 빨리 거둔다. 선반·피킹 칸의 정상·적치 재고 중 오늘 부적격인 LOT 과 그 칸·수량. onMiscShelf = 이미 기타 칸(카테고리 없음)에 있음.
        센터 관리자는 이 목록으로 기타 칸으로 이동을 지시한다(카테고리 칸으로는 이동 배정이 409 LOT_NOT_SHIPPABLE). 그 센터 운영자. 기준이 없는 상품은 빼고 보여 주지 않는다.
      operationId: listUnshippableLots
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK (소비기한 빠른 순, 최대 500)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { type: string }
                        lotId: { type: string }
                        expiryDate: { type: [string, 'null'], format: date }
                        manufactureDate: { type: [string, 'null'], format: date }
                        locationCode: { type: string }
                        locationCategoryId: { type: [string, 'null'] }
                        onMiscShelf: { type: boolean }
                        qty: { type: integer }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /internal/placement-suggestions:
    get:
      tags: [moves]
      summary: 적치·복귀 칸 추천 (0.14.1, #59)
      description: |
        2026-11-08 사용자 결정 #59: 취소품 복귀(MOVE)도 입고 적치와 같은 진열 규칙을 건다. 이 조회는 규칙을 통과하는 칸을 추천한다 —
        ① 그 상품이 이미 있는 칸(고회전 제외) ② 기타 칸(카테고리 없음, 위치 코드 순). 출하 부적격 LOT 은 카테고리 칸이 빠지므로 기타 칸만 나온다.
        통과하는 칸이 없으면 빈 목록. 서비스 토큰(mfc-fulfillment 복귀 작업 지시).
      operationId: suggestPlacement
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, required: true, schema: { type: string } }
        - { name: lotId, in: query, required: true, schema: { type: string } }
        - { name: qty, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 3 } }
      responses:
        '200':
          description: 추천 칸(앞이 우선)
          content:
            application/json:
              schema:
                type: object
                properties:
                  locationCodes: { type: array, items: { type: string } }
  /mfcs/{mfcId}/replenishment-policies:
    get:
      tags: [moves]
      summary: 자동 선반 보충 기준 목록 (IV-04, 0.14.0)
      operationId: listReplenishmentPolicies
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReplenishmentPolicy' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    put:
      tags: [moves]
      summary: 자동 선반 보충 기준 등록·변경 — 센터 관리자 (IV-04, 0.14.0)
      description: |
        2026-11-08 사용자 결정: 보충은 **시스템이 만든다**(재배치는 센터 관리자). 기준값(Q-07)은 센터 관리자가 칸·상품별로 등록한다 — 등록이 없는 칸은 보충하지 않는다(수동 보충 요청 없음).
        **고회전 선반만**(같은 상품 한 자리 규칙의 예외인 칸 — 아니면 422 REPLENISH_ONLY_HIGH_TURNOVER). min ≤ target, 단위 > 0.
      operationId: putReplenishmentPolicy
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationCode, sku, minQty, targetQty, unitQty]
              properties:
                locationCode: { type: string }
                sku: { type: string }
                minQty: { type: integer, minimum: 0 }
                targetQty: { type: integer, minimum: 0 }
                unitQty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplenishmentPolicy' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
    delete:
      tags: [moves]
      summary: 자동 선반 보충 기준 삭제 — 센터 관리자 (0.14.0)
      operationId: deleteReplenishmentPolicy
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: locationCode, in: query, required: true, schema: { type: string } }
        - { name: sku, in: query, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '204': { description: 삭제됨(없어도) }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /internal/replenishment-evaluations:
    post:
      tags: [moves]
      summary: '[inbound→inventory] 자동 선반 보충 점검 — 필요한 보충 이동을 만들고 진행 중 보충 이동을 돌려준다 (IV-04, 0.14.0)'
      description: |
        기준마다: 현재량 C(그 칸 정상·적치 − 보류)가 min 이하이면 지시량 = floor(min(target − C − 진행 중 U, 출발 이동 가능 S, 도착 남은 공간 V) ÷ 단위) × 단위.
        출발은 같은 상품의 다른 선반·피킹 칸에서 **소비기한 빠른 출하 가능 LOT 부터**, 이동 가능 = 집을 수 있는 양이고 LOT 가용 A 까지(이동 중은 판매 가능에서 빠짐 —
        예약이 많아 A 가 모자라면 **재고가 확보될 때까지 보충하지 않는다**, 사용자 결정). 만든 이동은 일반 이동 배정(kind REPLENISH)과 같은 규칙으로 검사한다.
        기준마다 따로 처리(한 기준의 거절이 다른 기준을 막지 않는다). 응답 = 지금 진행 중인 보충 이동 전부(inbound 가 이동 지시로 남긴다 — 다시 불러도 같다).
        상품 크기·칸 치수가 없으면 그 기준은 건너뛴다(skipped 에 이유).
      operationId: evaluateReplenishment
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mfcId: { type: [string, 'null'], description: 없으면 모든 센터 }
      responses:
        '200':
          description: 점검 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  moves: { type: array, items: { $ref: '#/components/schemas/MoveAllocation' } }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        mfcId: { type: string }
                        locationCode: { type: string }
                        sku: { type: string }
                        reason: { type: string }
  /internal/move-allocations:
    post:
      tags: [moves]
      summary: '[inbound→inventory] 재고 이동 배정 — 출발 물량·도착 공간을 함께 잡는다 (IV-03, 0.12.0)'
      description: |
        2026-11-08 사용자 결정. 두 단계 이동(출발 칸 → 카트 → 도착 칸)의 시작. 옮길 수 있는 양 = 출발 칸의 **집을 수 있는 양**(NORMAL·STORED − 보류 − 다른 주문 칸 배정)이고
        그 LOT 의 가용(A) 까지 — 이동 배정분은 판매 가능(E)에서 빠진다(IV-03, 출발 칸에 MOVE 보류). 도착 칸: 선반·피킹, ACTIVE, 온도대 = 상품 보관 유형,
        **칸에 여러 상품 가능 — 카테고리 칸은 그 카테고리(하위 포함) 상품만**(409 CATEGORY_MISMATCH, 상품 카테고리를 모르면 SKU_CATEGORY_UNKNOWN), 카테고리 없는 칸 = 기타(아무 상품).
        출하 부적격 LOT 은 카테고리 칸에 못 둔다(409 LOT_NOT_SHIPPABLE). **같은 상품은 한 자리**(고회전 선반 제외 — 다른 칸에 이미 있으면 409 SKU_ALREADY_SHELVED,
        출발 칸에 남는 양이 있으면 409 SKU_SPLIT_NOT_ALLOWED), 용량(칸 치수 ÷ 상품 크기, 들어올 예정 포함 — 넘으면 409 LOCATION_CAPACITY_EXCEEDED, 칸 치수 없으면 422 CONFIG_REQUIRED).
        상품 크기는 실제 정보가 없어 설정 `pmart.inventory.dummy-sku-size` 가 켜진 환경(LAN·시험)에서만 더미(소·중·대)로 계산한다. 같은 moveId 는 한 번(같은 내용이면 지금 상태).
        출발·도착이 실사 잠금이면 409.
      operationId: createMoveAllocation
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moveId, mfcId, sku, lotId, fromLocation, toLocation, qty]
              properties:
                moveId: { type: string, maxLength: 64 }
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                sku: { type: string }
                lotId: { type: string }
                fromLocation: { type: string }
                toLocation: { type: string }
                qty: { type: integer, minimum: 1 }
      responses:
        '201':
          description: 배정됨(또는 같은 moveId 의 지금 상태)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveAllocation' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
  /internal/move-allocations/{moveId}:
    get:
      tags: [moves]
      summary: 재고 이동 배정 조회 (0.12.0)
      operationId: getMoveAllocation
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveAllocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /internal/move-allocations/{moveId}/pickups:
    post:
      tags: [moves]
      summary: 집어 올리기 — 출발 칸 → 카트 (0.12.0)
      description: |
        출발 칸 NORMAL·STORED −q, 카트 NORMAL·MOVING +q, MOVE 보류 −q(E 변화 없음 — 이미 배정 때 뺐다). 카트 = 구역 CART·ACTIVE 위치, 한 이동은 한 카트(다른 카트 409 CART_MISMATCH).
        남은 배정량 초과 409 MOVE_QTY_EXCEEDED. 같은 executionId 는 한 번.
      operationId: pickUpMove
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executionId, cartLocation, qty]
              properties:
                executionId: { type: string, maxLength: 128 }
                cartLocation: { type: string }
                qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveAllocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /internal/move-allocations/{moveId}/drops:
    post:
      tags: [moves]
      summary: 내려놓기 — 카트 → 도착 칸(취소 뒤에는 출발 칸으로도) (0.12.0)
      description: |
        카트 NORMAL·MOVING −q, 칸 NORMAL·STORED +q(E +q). 도착 칸은 배정의 도착 칸, 취소된 이동은 출발 칸도 허용(카트에 남은 물건을 되돌림).
        카트 위 양 초과 409 MOVE_QTY_EXCEEDED. 모두 내려놓으면 COMPLETED. 같은 executionId 는 한 번.
      operationId: dropMove
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executionId, toLocation, qty]
              properties:
                executionId: { type: string, maxLength: 128 }
                toLocation: { type: string }
                qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveAllocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /internal/move-allocations/{moveId}/cancellations:
    post:
      tags: [moves]
      summary: 이동 취소 — 아직 집지 않은 몫만 푼다 (0.12.0)
      description: |
        집지 않은 양의 MOVE 보류를 풀어 E 를 되돌리고 배정 수량을 집은 양으로 줄인다. 카트에 남은 물건은 실제로 내려놓아야(도착 칸 또는 출발 칸) 끝난다 —
        다 내려놓았으면 바로 CANCELLED, 아니면 CANCEL_PENDING. 이미 끝난 이동은 지금 상태.
      operationId: cancelMove
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 취소됨(또는 카트 정리 대기)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveAllocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /internal/reservations/{reservationId}/shortfall-releases:
    post:
      tags: [reservations]
      summary: '[orchestration→inventory] 이행부족(BLOCKED) 해제 — 결품 수량을 주문에서 취소했을 때 (IV-09 2부, 0.6.0)'
      description: |
        ADR-0045. 그 주문 줄의 BLOCKED 조각을 qty 만큼 RELEASED 로(현물·R 변화 없음 — BLOCKED 는 R 이 아니라 D). BLOCKED 합보다 많으면 409 INVALID_STATE.
        같은 Idempotency-Key·같은 본문은 재생.
      operationId: releaseShortfall
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderLineId, qty, reason]
              properties:
                orderLineId: { type: string }
                qty: { type: integer, minimum: 1 }
                reason: { type: string, enum: [OUT_OF_STOCK_CANCELLED] }
      responses:
        '200':
          description: 해제됨 (appliedQty)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/reservations/{reservationId}/cancel-returns:
    post:
      tags: [reservations]
      summary: '[fulfillment→inventory] 집품 뒤 취소 — 집품·포장분 판매 제외(취소 복귀 대기), 나머지 예약·이행부족 해제 (IV-08, 0.7.0)'
      description: |
        ADR-0046. 피킹이 시작된 주문의 작업 중지(취소 선확정) 때 fulfillment 가 부른다. returns 는 이 예약의 **집품했지만 포장 안 한 양(PICKED)과
        포장한 양(PACKED)을 위치별로 전부** 적어야 한다(조각별 합이 집품·포장량과 다르면 409 RETURN_MISMATCH — 실물을 빠뜨리지 않게).
        - 단위: 그 위치의 NORMAL·PICKED/PACKED → NORMAL·CANCEL_RETURN_PENDING(E−q, H 그대로). 선반 복귀·적격 확인은 MOVE 실행에서(E+q).
        - 예약: 모든 HELD·CONFIRMED 조각 R−q(집지 않은 양 포함), BLOCKED(이행부족)까지 조각 전부 RELEASED, 예약 RELEASED(사유 reason).
        - 이미 RELEASED/EXPIRED 면 변화 없는 성공. 같은 Idempotency-Key·같은 본문은 재생.
      operationId: cancelReturn
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, returns]
              properties:
                reason: { type: string, maxLength: 32, description: '예 CANCEL_AFTER_PICK' }
                returns:
                  type: array
                  items:
                    type: object
                    required: [orderLineId, sku, lotId, locationCode, workState, qty]
                    properties:
                      orderLineId: { type: string }
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lotId: { type: string }
                      locationCode: { type: string }
                      workState: { type: string, enum: [PICKED, PACKED] }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 반영됨 (appliedQty = 해제한 R)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/reservations/{reservationId}/confirmations:
    post:
      tags: [reservations]
      summary: '[orchestration→inventory] 예약 확정 (PG 승인 후, HELD→CONFIRMED, TTL 해제)'
      description: |
        이미 CONFIRMED 면 변경 없이 성공(appliedQty 0). EXPIRED/RELEASED 는 409 INVALID_STATE. orderId 가 예약과 다르면 409 INVALID_STATE.
        만료 시각이 지났어도 만료 작업이 아직 EXPIRED 로 바꾸기 전(HELD, 수량 점유 중)이면 확정한다.
        X-Expected-Version 은 상태가 바뀔 때만 비교한다.
        (0.11.1, 2026-11-08 사용자 결정) 결제 중 격리·실사 손실로 보류(BLOCKED)되어 다른 LOT 으로도 다시 잡지 못한 몫이 남아 있으면 409 RESERVATION_SHORT —
        가용 재고가 없는 주문은 확정하지 않는다(사가는 RESERVATION_LOST 로 결제를 보상 취소한다).
      operationId: confirmReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string }
                paymentAttemptId: { type: string }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (EXPIRED/RELEASED/BLOCKED 예약) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/reservations/{reservationId}/releases:
    post:
      tags: [reservations]
      summary: '[orchestration→inventory] 예약 해제 (보상·취소; 피킹 후는 CANCEL_RETURN_PENDING 경유)'
      description: |
        피킹 전: R−q, A+q 즉시. 피킹 후(PICKED/PACKED 업무상태): E−q, R−q 후 CANCEL_RETURN_PENDING,
        복귀·적격 확인(CommitTaskExecution MOVE)으로만 E/A+q. 검증 없이 판매가능 복구 금지.
        부분 해제는 lines 지정. lines 생략 시 전량.

        슬라이스 4 구현: 피킹 업무상태가 아직 없어 모든 해제는 R−q 즉시. 부분 해제는 지원하지 않는다 — lines 가 예약 전량과 다르면
        422 PARTIAL_RELEASE_NOT_SUPPORTED. 이미 RELEASED/EXPIRED 면 변경 없이 성공(appliedQty 0).
        X-Expected-Version 은 상태가 바뀔 때만 비교한다.
      operationId: releaseReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [SAGA_COMPENSATION, CANCEL_BEFORE_PICK, CANCEL_AFTER_PICK, SHORTAGE, PAYMENT_FAILED, EXPIRED_MANUAL] }
                sourceRef: { type: string, description: stopRequestId / claimId / sagaId }
                lines:
                  type: array
                  items: { $ref: '#/components/schemas/SkuQtyLine' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: PARTIAL_RELEASE_NOT_SUPPORTED (lines 가 예약 전량과 다름)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/receipts:
    post:
      tags: [postings]
      summary: '[inbound→inventory] ConfirmReceipt — TIN 전기 (H+q; 정상분만 검수 후 E+)'
      description: |
        receiptId·departureId 유일성으로 중복 계상 방지. normalQty는 PENDING_INSPECTION으로 H+q,
        quarantinedQty는 Q+q, pendingQty는 미판정 보류. MfcReceiptPosted 발행 → cdc-inventory가 같은 receiptId로 Transit 대사.

        재고 모델 v2(ADR-0040, 0.2.0): 줄마다 수령 위치(toLocationCode, 필수)에 UNSTOWED 로 넣는다 — normalQty·pendingQty 는
        PENDING_INSPECTION(H+q), quarantinedQty 는 QUARANTINED(H+q·Q+q). **E 는 검수(INSPECT)·적치(PUTAWAY) 뒤에만 는다.**
        줄의 LOT: sourceLotRef 나 expiryDate 가 있으면 같은 SKU·표기·기한의 추적 LOT, 둘 다 없으면 수령마다 추적 미확인 LOT.
        inventory 가 발급한 lotId 는 GET /internal/receipts/{receiptId} 로 조회한다(검수·적치 명령에 쓴다).
        같은 receiptId·같은 내용은 처음 commitId 를 그대로 돌려주고(이중 계상 없음, Idempotency-Key 가 달라도), 다른 내용이면 409
        RECEIPT_ALREADY_POSTED. 수량 합이 0 이면 400. MfcReceiptPosted 는 아직 발행하지 않는다(TRF 경로 구현 시).
        수령 위치는 mfc-location 투영(MfcLocationStateChanged)으로 검사한다: 미등록 422 LOCATION_NOT_REGISTERED(전파 지연이면 재시도),
        ACTIVE 아님 409 LOCATION_CLOSED, 수령·회수 구역(RECEIVING·RETURN) 아님 409 LOCATION_ZONE_MISMATCH.
      operationId: confirmReceipt
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmReceiptRequest' }
      responses:
        '201':
          description: TIN COMMITTED (resultId = commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT / RECEIPT_ALREADY_POSTED (같은 receiptId 다른 본문)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /internal/receipts/{receiptId}:
    get:
      tags: [postings]
      summary: '[inbound→inventory] 수령 결과 — 줄별 inventory lotId·수령 위치·수량'
      operationId: getReceipt
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/task-executions:
    post:
      tags: [postings]
      summary: '[inbound/fulfillment→inventory] CommitTaskExecution — 검수·적치·피킹·패킹·이동 결과 반영'
      description: |
        INSPECT: PENDING_INSPECTION→NORMAL(E+q) 또는 QUARANTINED(Q+q). PUTAWAY: UNSTOWED→STORED, 위치 변경, V 소비.
        PICK: STORED→PICKED, 위치 변경. PACK: PICKED→PACKED. MOVE: 위치 이동(취소 복귀 포함, CANCEL_RETURN_PENDING→STORED 시 E/A+q).
        appliedQty < 요청량이면 PARTIAL_APPLIED.

        PICK·PACK(IV-07, 0.5.0): reservationId·lines[].orderLineId 필수. 예약이 CONFIRMED 이고 그 줄·LOT 의 CONFIRMED 조각에 남은 양
        (PICK: qty − pickedQty, PACK: pickedQty − packedQty)이 있어야 한다 — 예약에 없는 LOT 은 422 LOT_MISMATCH, 남은 양 초과는
        422 PICK_QTY_EXCEEDED. PICK 은 fromLocation(선반)의 NORMAL·STORED → toLocation(등록·ACTIVE·구역 PACKING, 아니면
        LOCATION_ZONE_MISMATCH)의 NORMAL·PICKED, PACK 은 fromLocation 의 PICKED → 같은 위치 PACKED. H/E/R/A 총량 불변(위치·업무 상태만).
        피킹·포장 시작으로 출고 차감하지 않는다(인계 IV-08). MOVE 는 아직 501.

        구현(ADR-0040, 0.2.0): INSPECT(fromLocation 의 PENDING_INSPECTION/UNSTOWED → resultQuality/UNSTOWED)와
        PUTAWAY(fromLocation 의 NORMAL/UNSTOWED → toLocation 의 NORMAL/STORED, 이때 E+q). executionId 필수 — 같은 executionId 는
        요청 ID 가 달라도 한 번(다른 내용이면 409 EXECUTION_ALREADY_POSTED). lines[].lotId 는 inventory lotId.
        위치 잔량이 모자라면 422 INSUFFICIENT_STOCK.
        MOVE(0.7.0, ADR-0046) 는 지금 **취소 복귀**만: fromLocation 의 NORMAL·CANCEL_RETURN_PENDING → toLocation(선반·피킹, 온도대 = SKU 보관 유형)의
        NORMAL·STORED(E+q). resultQuality QUARANTINED 면 복귀 중 이상품 — toLocation 의 QUARANTINED·STORED(Q+q). 일반 선반 이동은 아직 없다.
        위치 검사(mfc-location 투영): 출발 위치가 실사 잠금이면 409 LOCATION_CLOSED. PUTAWAY 목적지는 등록·ACTIVE·구역 STORAGE/PICKING·
        온도대 = SKU 보관 유형 — 아니면 422 LOCATION_NOT_REGISTERED / 409 LOCATION_CLOSED·LOCATION_ZONE_MISMATCH·TEMPERATURE_ZONE_MISMATCH,
        보관 유형을 모르면 422 CONFIG_REQUIRED.
      operationId: commitTaskExecution
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitTaskExecutionRequest' }
      responses:
        '201':
          description: 반영 결과 (resultId = commitId, appliedQty)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: VERSION_CONFLICT / INVALID_STATE (업무상태 전이 불가) / LOCATION_CLOSED / SPACE_EXCEEDED(V 부족)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: INSUFFICIENT_STOCK (피킹 위치 잔량 부족) / PARTIAL_APPLIED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/package-handovers:
    post:
      tags: [postings]
      summary: '[fulfillment→inventory] CommitPackageHandover — 인계 전기 H−q, E−q, R−q 한 사건'
      description: |
        handoverAuthorizationId + fenceVersion 으로 fence 정합을 검증한다(ADR-0006). 같은 packageId 재전송은 기존 commitId 반환.
        성공 시 PackageHandedOverPosted 발행(commitId로 fulfillment의 PackageHandedOver와 연결).
        구현(0.8.0, 2026-11-08, ADR-0047): 포장 위치(locationCode)의 NORMAL·PACKED 단위 −q(H−q, E−q, A 불변) + 줄·LOT 의 확정 조각 R−q
        (`handed_qty` +q, 다 넘긴 조각 CONSUMED, 현물 점유 조각이 없으면 예약 CONSUMED) 한 확정 단위. 같은 packageId 는 요청 ID 가 달라도 한 번 —
        같은 handoverAuthorizationId·fenceVersion 이면 처음 commitId(201 재생), 다르면 409 FENCE_VERSION_MISMATCH. 예약이 CONFIRMED 가 아니면 409
        INVALID_STATE, 줄·LOT 의 (포장 − 인계)보다 많으면 409 HANDOVER_QTY_EXCEEDED, 위치에 PACKED 가 모자라면 422 INSUFFICIENT_STOCK.
      operationId: commitPackageHandover
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitPackageHandoverRequest' }
      responses:
        '201':
          description: 인계 전기 완료 (resultId = commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409':
          description: INVALID_STATE (예약 BLOCKED/RELEASED) / FENCE_VERSION_MISMATCH / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: INSUFFICIENT_STOCK (PACKED 잔량 < 인계량)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/shortage-reports:
    post:
      tags: [postings]
      summary: '[fulfillment→inventory] 피킹 결품·파손 보고 — 판매 제외·예약 BLOCKED·같은 SKU 적격 LOT 재확보 (IV-09, 0.6.0)'
      description: |
        IV-09·ADR-0042 결정 1·ADR-0044. 같은 reportId 는 한 번만 반영(같은 결과 재생, 다른 내용이면 409 IDEMPOTENCY_CONFLICT).
        1. 판매 제외: DAMAGED 는 실제 있는 이상품 — 그 위치·LOT 의 NORMAL·STORED → QUARANTINED(Q+q, E−q). SHORT·BLOCKED 는 실물을 찾지 못함 —
           격리 현물을 만들지 않고 **분실 조사 보류**(stock_hold, E−q, H·단위 행 그대로)로 둔다. 확인된 실제 손실은 실사(IV-11)에서.
           위치 잔량(보류 제외)이 모자라면 422 INSUFFICIENT_STOCK.
        2. 예약: 그 주문 줄·LOT 의 CONFIRMED 조각 중 아직 집지 않은 양에서 q 만큼 R−q. 남은 양보다 많으면 422 PICK_QTY_EXCEEDED.
        3. 재확보: 같은 SKU 의 적격 LOT(소비기한 보장·보관 유형 최소 잔여일·배송 약속일, FEFO)에서 신규 가용(A=E−R) 안으로 다시 잡는다 —
           확정 조각(CONFIRMED)으로 R+r. 다른 주문의 예약은 건드리지 않는다. 다른 SKU 로는 바꾸지 않는다.
        4. 못 잡은 양 u = q − r 는 BLOCKED 조각(이행부족 D)으로 남기고 ReservationBlocked(mfc.inventory.v1) 발행.
      operationId: reportShortage
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShortageReportRequest' }
      responses:
        '201':
          description: 반영 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortageReportResult' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: INSUFFICIENT_STOCK / PICK_QTY_EXCEEDED / LOT_MISMATCH / LINE_NOT_IN_RESERVATION
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/quality-postings:
    post:
      tags: [postings]
      summary: '[quality→inventory] 격리/해제/폐기 반영 (approvalRef 필수)'
      description: |
        QUARANTINE: Q+q, E−q, 영향 ReservationPart→BLOCKED, ReservationBlocked(영향 orderId 포함) 발행.
        RELEASE: Q−q, E+q. DISPOSE: 승인 잔량 내 H−q, Q−q. 승인 잔량 초과는 APPROVAL_REQUIRED.
        구현(0.9.0, 2026-11-08): 줄마다 sku·lotId·locationCode·qty 필수, workState STORED(기본)/UNSTOWED — 그 위치·LOT·업무 상태의 단위 행.
        QUARANTINE = NORMAL → QUARANTINED(E 는 STORED 일 때만 −q). LOT 의 R 이 남은 E 를 넘으면 넘는 양만 그 LOT 의 아직 집지 않은
        HELD·CONFIRMED 조각을 **나중에 잡은 예약부터** 줄여 BLOCKED 조각(사유 QUALITY_HOLD) + ReservationBlocked. 자동 재배분 없음(MFC Q-13).
        RELEASE = QUARANTINED → NORMAL(같은 업무 상태 — UNSTOWED 는 적치 뒤 판매). DISPOSE = QUARANTINED −q(승인 잔량은 mfc-quality 가 지킴).
        집품·포장분(PICKED/PACKED)은 결품·파손 보고(shortage-reports)로. 같은 Idempotency-Key 는 같은 결과. 부족 422 INSUFFICIENT_STOCK.
      operationId: postQualityDecision
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityPostingRequest' }
      responses:
        '201':
          description: 반영 결과 (resultId = commitId, appliedQty)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED (승인 잔량 초과·승인 참조 없음) / INSUFFICIENT_STOCK
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/adjustments:
    post:
      tags: [postings]
      summary: '[backoffice/실사→inventory] 재고 조정 집행 CNT/ADJ (approvalRef 필수)'
      description: 실사 수량(CNT) 또는 차이 조정(ADJ). 승인된 수량 범위 내에서만 집행하며 InventoryAdjustmentPosted를 발행해 approval 실행 축을 갱신한다.
      operationId: postAdjustment
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
      responses:
        '201':
          description: 조정 반영 (resultId = commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / INVARIANT_VIOLATION (0≤R≤E≤H 위반)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/availability:
    get:
      tags: [queries]
      summary: '[cart/commerce→inventory] 가용 수량 A = E − R (센터·SKU)'
      description: 조회 사본이며 성공을 확정하지 않는다. 산출 실패·미설정 시 0을 반환하지 않고 503으로 응답한다.
      operationId: getAvailability
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: sku
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { $ref: '_common.yaml#/components/schemas/Sku' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfcId: { type: string }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Availability' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/snapshots:
    get:
      tags: [queries]
      summary: '[SCM/replenishment→inventory] 센터 재고 스냅샷 (H/Q/E/R/A, 위치·LOT·품질상태별)'
      description: '구현(0.10.0, 2026-11-08): 0 초과 단위 행(위치·SKU·LOT·품질·업무 상태)과 LOT 소비기한, SKU·LOT·위치 순 키셋 페이지(cursor = 앞 페이지 마지막 키). reservedQty 는 비움 — 예약은 LOT 단위라 위치 줄에 나누지 않는다(LOT 합계는 GET /mfcs/{mfcId}/stock).'
      operationId: getSnapshot
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, schema: { type: string } }
        - { name: locationCode, in: query, schema: { type: string }, description: '0.10.0 — 한 위치만(mfc-location 위치 폐지 전 잔량 확인)' }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items: { type: array, items: { $ref: '#/components/schemas/Balance' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/commits/{commitId}:
    get:
      tags: [queries]
      summary: 원결과 조회 — commitId로 전기 내역 확인
      operationId: getCommit
      parameters:
        - { name: commitId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Commit' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/requests/{requestId}:
    get:
      tags: [queries]
      summary: 원결과 조회 — requestId(=Idempotency-Key)로 inventory_apply_status 확인 (UNKNOWN_RESULT 해소)
      description: |
        호출 서비스(X-Source-System = 토큰 주체)의 요청만 찾는다. 전기(commit)를 만든 요청은 APPLIED + commitId.
        기록됐지만 수량 변화가 없던 요청(이미 확정·해제된 예약 등)은 APPLIED, commitId null.
        거절(4xx)로 끝난 요청은 기록되지 않으므로 404 — 반영되지 않았다는 뜻이다(같은 키로 다시 보내면 다시 판정).
      operationId: getRequestResult
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  applyStatus: { $ref: '#/components/schemas/InventoryApplyStatus' }
                  commitId: { type: [string, 'null'] }
                  appliedQty: { type: integer }
                  rejectReason: { type: string }
                  occurredAt: { type: string, format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /mfcs/{mfcId}/stock:
    get:
      tags: [queries]
      summary: '[운영자] 센터 재고 상세 — SKU 의 LOT 별 요약(H/Q/E/R·소비기한)과 위치·상태별 단위 행'
      operationId: getCenterStock
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CenterStock' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /mfcs/{mfcId}/stock-corrections:
    post:
      tags: [postings]
      summary: '[운영자] LOT·위치 정정(CORRECTION) — 총량 불변, 원장에 정정 사건'
      description: |
        이미 있는 재고의 LOT 식별(제조 LOT 표기·소비기한)이나 위치를 바로잡는다(WMS 문서 LOT 식별 정정 — H 증감 0). 줄마다 출발 단위 행
        (위치·LOT·품질·업무상태)에서 qty 를 빼서, 목적 위치(없으면 같은 위치)·목적 LOT(toSourceLotRef·toExpiryDate 가 있으면 그 추적 LOT,
        없으면 같은 LOT)으로 옮긴다. 품질·업무상태는 바꾸지 않는다. 목적 위치가 STORED 면 적치와 같은 위치 검사. 예약(R)이 걸린 수량은 옮길 수
        없다(LOT 의 R ≤ E — 409 INVARIANT_VIOLATION). approvalRef 필수(정정 근거 — 시드는 `seed-v2`). 그 센터의 운영자만.
      operationId: correctStock
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockCorrectionRequest' }
      responses:
        '201':
          description: 정정 반영 (resultId = commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: INSUFFICIENT_STOCK / LOCATION_NOT_REGISTERED / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /mfcs/{mfcId}/count-sessions:
    post:
      tags: [counts]
      summary: '[운영자] 순환 실사 시작(IV-11, 0.10.0) — 실사 잠금 위치의 장부 기준 고정'
      description: |
        그 센터 운영자 + MFC_WORKER·MFC_SUPERVISOR. 위치마다 mfc-location 에서 실사 잠금(COUNT_LOCKED)이어야 한다(409 LOCATION_NOT_LOCKED —
        잠금 실패는 계수 시작 차단). 대상 = 그 위치의 판매 단위(NORMAL·STORED) — 위치·SKU·LOT 별 장부 수량과 조사 보류(IV-09 결품 보고)를
        기준 시각에 고정한다. 응답의 계수표(sheet)에는 수량이 없다(첫 계수 장부 숨김). 같은 위치가 열린 실사에 있으면 409 COUNT_IN_PROGRESS.
      operationId: createCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationCodes]
              properties:
                locationCodes: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
                reason: { type: string, maxLength: 200, description: '순환 실사·차이 조사·확정 오류 정정 등' }
      responses:
        '201':
          description: 실사(COUNTING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /mfcs/{mfcId}/count-sessions/{sessionId}:
    get:
      tags: [counts]
      summary: '[운영자] 실사 조회 — 계수 중에는 장부·차이를 보이지 않는다'
      operationId: getCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /mfcs/{mfcId}/count-sessions/{sessionId}/counts:
    post:
      tags: [counts]
      summary: '[작업자] 계수·재계수 제출'
      description: |
        MFC_WORKER·MFC_SUPERVISOR. 줄 = 위치·SKU·LOT·센 수량. 계수표에 있는데 줄이 없으면 0 으로 센 것. 계수표에 없는 SKU·LOT 도 낼 수 있다(찾은 재고).
        첫 계수가 장부와 같고 조사 보류가 없으면 MATCHED(끝). 다르면 RECOUNT_REQUIRED — **다른 작업자**가 재계수(같은 사람은 409 SAME_COUNTER).
        재계수가 장부와 같고 보류가 없으면 MATCHED, 아니면 PENDING_APPROVAL(최종 수량 = 재계수). 첫 계수가 같아도 조사 보류가 있으면 PENDING_APPROVAL
        (보류 해소도 승인 뒤). 계수 단계가 아닌 실사는 409 INVALID_STATE.
      operationId: submitCount
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [locationCode, sku, lotId, countedQty]
                    properties:
                      locationCode: { type: string }
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lotId: { type: string }
                      countedQty: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 제출 뒤 실사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /mfcs/{mfcId}/count-sessions/{sessionId}/approvals:
    post:
      tags: [counts]
      summary: '[센터 관리자] 실사 차이 승인(조정 ADJ 반영) / 반려'
      description: |
        MFC_SUPERVISOR, 실사를 시작·계수한 사람이 아니어야 한다(422 SELF_APPROVAL). PENDING_APPROVAL 만. APPROVE 는 approvalRef 필수(422 APPROVAL_REQUIRED).
        반영 직전 장부가 기준 시각과 다르면 409 BOOK_CHANGED(다시 실사). 반영 = 한 확정 단위(COUNT_ADJ): 위치·SKU·LOT 별 (최종 − 장부)만큼 NORMAL·STORED
        증감, 그 위치 조사 보류는 모두 해소(찾은 것은 E 복귀, 없는 것은 손실). E 가 줄어 LOT 의 R 을 넘으면 넘는 양만 나중 예약부터 BLOCKED(COUNT_LOSS) +
        ReservationBlocked. 증감이 있으면 StockAdjusted. 같은 승인 재요청은 지금 실사(한 번만 반영). REJECT → REJECTED(변화 없음, 보류 그대로).
        실사 잠금 해제는 mfc-location 에서 따로(시간 만료로 자동 해제하지 않음).
      operationId: decideCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                approvalRef: { type: string, maxLength: 128 }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 결정 뒤 실사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SELF_APPROVAL / APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /mfcs/{mfcId}/sku-handlings:
    get:
      tags: [sku-handlings]
      summary: '[운영자] MFC SKU 취급 ON/OFF 목록 (취급 레코드가 없으면 OFF)'
      description: |
        상품 SKU 투영(SkuIssued/ProductVersionPublished)에 있는 SKU 전체를 이 센터의 취급 여부와 함께 돌려준다.
        취급 레코드가 없으면 OFF(handlingEnabled=false, version 0)이다(사용자 결정 2026-10-30: 기본 OFF, 센터 운영자가 켬).
        토큰의 centers 클레임에 mfcId 가 없으면 403.
      operationId: listSkuHandlings
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: enabled, in: query, required: false, description: 'true=ON 만, false=OFF(레코드 없음 포함)만, 생략=전체', schema: { type: boolean } }
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - $ref: '_common.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: OK (SKU 오름차순, 커서 = 마지막 SKU)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingPage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [sku-handlings]
      summary: '[운영자] MFC SKU 취급 ON/OFF 변경 (자기 센터만)'
      description: |
        켜기(enabled=true)는 SKU 투영이 있고 state=ACTIVE 일 때만(INACTIVE → 422 SKU_INACTIVE). 끄기는 항상 허용.
        현재 값과 같으면 변경·이력 없이 현재 상태를 돌려준다(changed=false). 바뀌면 이력을 남기고 version +1.
        X-Expected-Version 은 이 센터·SKU 취급 레코드의 version(레코드가 없으면 0).
      operationId: changeSkuHandling
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuHandlingChange' }
      responses:
        '200':
          description: 반영(같은 키·같은 본문 재요청은 저장된 결과 재생)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: SKU_NOT_FOUND (SKU 투영이 아직 없음 — 상품 승인 이벤트 수신 전)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SKU_INACTIVE (비활성 SKU 는 켤 수 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /mfcs/{mfcId}/sku-handling-batches:
    post:
      tags: [sku-handlings]
      summary: '[운영자] MFC SKU 취급 일괄 변경 (최대 500행, 전부 또는 전무)'
      description: |
        모든 행을 먼저 검증하고 하나라도 실패하면 아무것도 바꾸지 않는다(422 SKU_HANDLING_BATCH_REJECTED, details[].field = items[i]).
        행 규칙은 단건과 같다. 같은 SKU 가 두 번 나오면 400 VALIDATION_FAILED.
      operationId: changeSkuHandlingBatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuHandlingBatchRequest' }
      responses:
        '200':
          description: 전 행 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingBatchResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SKU_HANDLING_BATCH_REJECTED (행별 SKU_NOT_FOUND / SKU_INACTIVE / VERSION_CONFLICT 를 details 에)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/sku-handling-republications:
    post:
      tags: [sku-handlings]
      summary: '[운영 도구→mfc-inventory] 지금 취급 상태를 SkuHandlingChanged 로 다시 알린다'
      description: |
        취급 레코드마다 현재 상태(켬·끔, 행 버전)를 SkuHandlingChanged(republished=true)로 다시 발행한다(mfc.sku-handling.v1).
        상태는 바꾸지 않으므로 같은 Idempotency-Key 로 다시 불러도 다시 발행한다. 사건 발행 전부터 있던 취급(2026-11-05 이전)을 검색 색인에 처음 연결할 때, 구독 쪽 사본을 복구할 때 쓴다.
        같은 버전을 다시 받은 구독자는 무시하므로 여러 번 불러도 결과가 같다. mfcId 를 주면 그 센터만. 한 번에 최대 20000건(넘으면 422).
      operationId: republishSkuHandlings
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: mfcId, in: query, required: false, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: 다시 발행한 건수
          content:
            application/json:
              schema:
                type: object
                required: [publishedCount]
                properties:
                  publishedCount: { type: integer, minimum: 0 }
        '422':
          description: DOMAIN_REJECTED — 건수 상한 초과, 센터를 나눠 부른다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/skus:
    get:
      tags: [skus]
      summary: '[서비스→mfc-inventory] SKU 투영 일괄 조회 (최대 100건, 0.15.0)'
      description: |
        현장 화면의 상품명·바코드 표시용(mfc-inbound 입고 작업 — 클라이언트 BR-53 R8). 조회 사본이다. 상품 정본은 product-service.
        투영이 없는 SKU 는 items 에서 빼고 missing 에 둔다.
      operationId: listSkuProjections
      parameters:
        - name: skus
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { $ref: '_common.yaml#/components/schemas/Sku' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, missing]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SkuProjection' } }
                  missing: { type: array, items: { type: string } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/skus/{sku}:
    get:
      tags: [skus]
      summary: '[서비스→mfc-inventory] SKU 투영 조회 (product-service 이벤트 사본)'
      description: 조회 사본이다. 상품 정본은 product-service.
      operationId: getSkuProjection
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuProjection' }
        '404':
          description: SKU_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  schemas:
    InventoryApplyStatus:
      type: string
      enum: [CAPTURED, SUBMITTED, PROCESSING, APPLIED, REJECTED, UNKNOWN_RESULT]
    QualityState:
      type: string
      enum: [PENDING_INSPECTION, NORMAL, QUARANTINED, DISPOSAL_PENDING]
    WorkState:
      type: string
      enum: [UNSTOWED, STORED, PICKED, PACKED, CANCEL_RETURN_PENDING]
    ReservationPartState:
      type: string
      description: HELD→CONFIRMED/RELEASED/EXPIRED/BLOCKED, CONFIRMED→CONSUMED/RELEASED/BLOCKED
      enum: [HELD, CONFIRMED, RELEASED, EXPIRED, BLOCKED, CONSUMED]
    SkuQtyLine:
      type: object
      required: [sku, qty]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
        lotId: { type: string }
    LotConstraint:
      type: object
      description: 예약 시 LOT 제약 (선택, 아직 미지원 — 400). 미지정이면 FEFO.
      properties:
        minShelfLifeDays: { type: integer, minimum: 0 }
        lotId: { type: string }
    ReserveInventoryRequest:
      type: object
      required: [orderId, mfcId, lines]
      properties:
        orderId: { type: string }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        ttlMinutes:
          type: integer
          minimum: 1
          maximum: 60
          description: '예약 유효 시간(분). 없으면 설정 pmart.inventory.default-hold-ttl(MFC 문서 §6 Q-04 결정 2026-11-07: 10분, ADR-0042), 설정도 없으면 CONFIG_REQUIRED'
        promisedDate:
          type: string
          format: date
          description: |
            배송 약속일(예약 배송 슬롯의 날짜, Asia/Seoul). 소비기한 적격 기준일 — 소비기한 − 약속일 ≥ 최소 잔여일인 LOT 만 배정한다
            (MFC 문서 §6 Q-05 결정 2026-11-07, ADR-0040). 없으면 예약 시각의 날짜(즉시 배송).
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty]
            properties:
              orderLineId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
              lotConstraint: { $ref: '#/components/schemas/LotConstraint' }
    Reservation:
      type: object
      properties:
        reservationId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
        version: { type: integer }
        state: { $ref: '#/components/schemas/ReservationPartState' }
        expiresAt: { type: [string, 'null'], format: date-time }
        parts:
          type: array
          items:
            type: object
            properties:
              partId: { type: string }
              orderLineId: { type: [string, 'null'] }
              sku: { type: string }
              lotId: { type: string, description: inventory lotId. 한 줄이 여러 LOT 조각으로 나뉠 수 있다(줄당 LOT 수 제한 없음, FEFO) }
              kind: { type: string, enum: [HAND, FUTURE] }
              qty: { type: integer }
              state: { $ref: '#/components/schemas/ReservationPartState' }
              blockedReason: { type: string }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    ShortageReportRequest:
      type: object
      required: [reportId, mfcId, reservationId, orderLineId, sku, lotId, locationCode, qty, reason]
      properties:
        reportId: { type: string, maxLength: 128, description: 보고 ID(fulfillment 실행 ID 기반). 한 번만 반영 }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        reservationId: { type: string }
        orderLineId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        lotId: { type: string, description: 결품·파손을 발견한 예약 LOT }
        locationCode: { type: string, description: 발견한 선반 위치 }
        qty: { type: integer, minimum: 1 }
        reason: { type: string, enum: [SHORT, DAMAGED, BLOCKED] }
        taskId: { type: string }
        note: { type: string, maxLength: 200 }
    ShortageReportResult:
      type: object
      properties:
        reportId: { type: string }
        commitId: { type: string }
        reportedQty: { type: integer }
        quarantinedQty: { type: integer, description: DAMAGED 로 격리한 양 }
        heldQty: { type: integer, description: 분실 조사 보류한 양(SHORT·BLOCKED) }
        resecuredQty: { type: integer, description: 같은 SKU 적격 LOT 으로 다시 잡은 양 }
        blockedQty: { type: integer, description: 못 잡아 BLOCKED(이행부족 D)로 남은 양 }
        resecuredParts:
          type: array
          items:
            type: object
            properties:
              partId: { type: string }
              lotId: { type: string }
              qty: { type: integer }
    MoveAllocation:
      type: object
      properties:
        moveId: { type: string }
        kind: { type: string, enum: [MOVE, REPLENISH], description: 'MOVE = 센터 관리자 재배치, REPLENISH = 시스템 자동 보충(0.14.0)' }
        mfcId: { type: string }
        sku: { type: string }
        lotId: { type: string }
        fromLocation: { type: string }
        toLocation: { type: string }
        cartLocation: { type: [string, 'null'] }
        qty: { type: integer, description: 배정 수량(취소하면 집은 양으로 줄어든다) }
        pickedQty: { type: integer }
        droppedQty: { type: integer }
        onCartQty: { type: integer, description: 카트 위 = 집음 − 내려놓음 }
        state: { type: string, enum: [ACTIVE, CANCEL_PENDING, COMPLETED, CANCELLED] }
        sizeClass: { type: [string, 'null'], description: 용량 계산에 쓴 상품 크기(S·M·L, 더미) }
        destinationCapacity: { type: [integer, 'null'], description: 도착 칸에 이 상품이 들어가는 개수(더미 크기 기준) }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReplenishmentPolicy:
      type: object
      properties:
        mfcId: { type: string }
        locationCode: { type: string }
        sku: { type: string }
        minQty: { type: integer }
        targetQty: { type: integer }
        unitQty: { type: integer }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    PickPlan:
      type: object
      properties:
        reservationId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
        state: { $ref: '#/components/schemas/ReservationPartState' }
        parts:
          type: array
          items:
            type: object
            properties:
              partId: { type: string }
              orderLineId: { type: [string, 'null'] }
              sku: { type: string }
              lotId: { type: string }
              expiryDate: { type: [string, 'null'], format: date }
              state: { $ref: '#/components/schemas/ReservationPartState' }
              qty: { type: integer }
              pickedQty: { type: integer }
              packedQty: { type: integer }
              unallocatedQty: { type: integer, description: '남은 집품량 중 위치 배정이 없는 양(0.11.0)' }
              allocations:
                type: array
                description: '이 조각의 위치 배정(0.11.0) — 남은 배정량이 있는 것만, 배정 순서. 지시 위치는 첫 원소'
                items:
                  type: object
                  properties:
                    locationCode: { type: string }
                    qty: { type: integer, description: 그 위치에서 이 조각이 더 집을 양 }
              locations:
                type: array
                description: 그 LOT 의 NORMAL·STORED 잔량이 있는 위치(코드 순)
                items:
                  type: object
                  properties:
                    locationCode: { type: string }
                    qty: { type: integer }
                    allocatedQty: { type: integer, description: '그 위치에서 이 조각에 배정된 남은 양(0.11.0)' }
    ConfirmReceiptRequest:
      type: object
      required: [receiptId, trfId, departureId, mfcId, lines]
      properties:
        receiptId: { type: string, description: inbound가 발급. 중복 계상 방지 키 }
        trfId: { type: string, description: 이관 지시 ID (replenishment) }
        departureId: { type: string, description: cdc TOUT departureId }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        receivedAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, normalQty, quarantinedQty, pendingQty, toLocationCode]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string, description: '사용하지 않음(0.2.0) — 상류 LOT 표기는 sourceLotRef. inventory lotId 는 수령 결과 조회로' }
              sourceLotRef: { type: string, maxLength: 128, description: 상류(제조사·WMS) LOT 표기 원문. 그대로 보존 }
              expiryDate: { type: string, format: date, description: 소비기한 }
              normalQty: { type: integer, minimum: 0, description: 정상 수령 → PENDING_INSPECTION H+q }
              quarantinedQty: { type: integer, minimum: 0, description: 격리 수령 → Q+q }
              pendingQty: { type: integer, minimum: 0, description: 미판정 보류 }
              toLocationCode: { type: string, maxLength: 64, description: 수령 위치(입고대). 필수(0.2.0) }
    ReceiptResult:
      type: object
      required: [receiptId, commitId, lines]
      properties:
        receiptId: { type: string }
        commitId: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [lineNo, sku, lotId, locationCode, normalQty, quarantinedQty, pendingQty]
            properties:
              lineNo: { type: integer }
              sku: { type: string }
              lotId: { type: string }
              locationCode: { type: string }
              normalQty: { type: integer }
              quarantinedQty: { type: integer }
              pendingQty: { type: integer }
    CommitTaskExecutionRequest:
      type: object
      required: [executionType, mfcId, taskId, lines]
      properties:
        executionType: { type: string, enum: [INSPECT, PUTAWAY, PICK, PACK, MOVE] }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        taskId: { type: string }
        executionId: { type: string, description: fulfillment/inbound 측 실행 ID }
        reservationId: { type: string, description: PICK/PACK 시 소비 대상 예약 }
        fromLocation: { type: string }
        toLocation: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              orderLineId: { type: string, description: PICK·PACK 필수 — 예약 조각의 주문 줄 }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
              resultQuality: { type: string, enum: [NORMAL, QUARANTINED], description: INSPECT 전용 }
              sourceLotRef: { type: string, maxLength: 128, description: 'INSPECT 전용 — 검수에서 확인한 제조 LOT 표기. sourceLotRef·expiryDate 중 하나라도 있으면 그 추적 LOT 으로 나눈다(같은 위치, 총량 불변)' }
              expiryDate: { type: string, format: date, description: INSPECT 전용 — 검수에서 확인한 소비기한 }
              manufactureDate: { type: string, format: date, description: 'INSPECT 전용 — 검수에서 확인한 제조일(0.4.0, ADR-0041). 있으면 LOT 정체성에 들어간다. "N일 이내 제조" 보장 상품은 제조일 있는 LOT 만 배정된다' }
              targetWorkState: { $ref: '#/components/schemas/WorkState' }
    CommitPackageHandoverRequest:
      type: object
      required: [packageId, handoverId, handoverAuthorizationId, fenceVersion, mfcId, orderId, reservationId, locationCode, lines]
      properties:
        packageId: { type: string }
        handoverId: { type: string, description: 'fulfillment 인계 사실 ID(0.8.0) — PackageHandedOverPosted 에 실린다' }
        locationCode: { type: string, description: '포장이 놓인 위치 = 밀봉 때 포장 위치(0.8.0). 이 위치의 PACKED 를 뺀다' }
        shipmentId: { type: string }
        handoverAuthorizationId: { type: string }
        fenceVersion: { type: integer, minimum: 0 }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        orderId: { type: string }
        reservationId: { type: string }
        deliveryId: { type: string }
        riderId: { type: string }
        handedOverAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [orderLineId, sku, lotId, qty]
            properties:
              orderLineId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              qty: { type: integer, minimum: 1 }
    QualityPostingRequest:
      type: object
      required: [postingType, mfcId, approvalRef, lines]
      properties:
        postingType: { type: string, enum: [QUARANTINE, RELEASE, DISPOSE] }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        qualityDecisionId: { type: string }
        approvalRef:
          type: string
          description: mfc-quality 승인 ID 또는 approval-service approvalId. 폐기는 approval 승인 필수
        reason: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, lotId, locationCode, qty]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              locationCode: { type: string }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
              workState: { type: string, enum: [STORED, UNSTOWED], description: '0.9.0 — 단위 행 업무 상태(기본 STORED)' }
    CountSession:
      type: object
      properties:
        sessionId: { type: string }
        mfcId: { type: string }
        state: { type: string, enum: [COUNTING, RECOUNT_REQUIRED, PENDING_APPROVAL, MATCHED, ADJUSTED, REJECTED] }
        locationCodes: { type: array, items: { type: string } }
        reason: { type: [string, 'null'] }
        createdBy: { type: string }
        firstCounter: { type: [string, 'null'] }
        recounter: { type: [string, 'null'] }
        approverId: { type: [string, 'null'] }
        approvalRef: { type: [string, 'null'] }
        baselineAt: { type: string, format: date-time, description: 장부 기준 시각 }
        sheet:
          type: array
          description: 계수표(수량 없음)
          items:
            type: object
            properties:
              locationCode: { type: string }
              sku: { type: string }
              lotId: { type: string }
              expiryDate: { type: [string, 'null'], format: date }
        differences:
          type: [array, 'null']
          description: 계수가 끝난 뒤(PENDING_APPROVAL·MATCHED·ADJUSTED·REJECTED)에만. 계수 중에는 null
          items:
            type: object
            properties:
              locationCode: { type: string }
              sku: { type: string }
              lotId: { type: string }
              bookQty: { type: integer }
              heldQty: { type: integer, description: 조사 보류(결품 보고) }
              countedQty: { type: integer }
              deltaQty: { type: integer, description: 최종 − 장부 }
        commitId: { type: [string, 'null'] }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    AdjustmentRequest:
      type: object
      required: [adjustmentType, mfcId, approvalRef, lines]
      properties:
        adjustmentType: { type: string, enum: [CNT, ADJ] }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        approvalRef: { type: string, description: approval-service approvalId }
        countSessionId: { type: string }
        reason: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, locationCode]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              locationCode: { type: string }
              qualityState: { $ref: '#/components/schemas/QualityState' }
              countedQty: { type: integer, minimum: 0, description: CNT 전용 }
              deltaQty: { type: integer, description: ADJ 전용. 음수 허용 }
    Availability:
      type: object
      description: |
        수량은 센터 요약(stock_balance — 단위 행 합과 같은 트랜잭션에서 바뀜, ADR-0040)에서 읽는다. A 에는 소비기한 기준을 통과하지 못한 LOT 도
        들어 있을 수 있어, 예약이 NO_ELIGIBLE_LOT 으로 거절될 수 있다. 원장 행이 없는 SKU(한 번도 입고되지 않음)는 0 이다. A = E − R.
        handlingEnabled=false 인 SKU 는 수량이 있어도 예약할 수 없다(SKU_NOT_HANDLED). version 은 원장 행 version(행 없음 = 0).
      properties:
        sku: { type: string }
        onHand: { type: [integer, 'null'], description: H }
        quarantined: { type: [integer, 'null'], description: Q }
        sellable: { type: [integer, 'null'], description: E }
        reserved: { type: [integer, 'null'], description: R }
        available: { type: [integer, 'null'], description: A = E − R }
        handlingEnabled: { type: boolean, description: 센터 취급 ON/OFF (center_sku_handling, 레코드 없음 = OFF) }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
    Balance:
      type: object
      properties:
        mfcId: { type: string }
        locationCode: { type: string }
        sku: { type: string }
        lotId: { type: string }
        expiryDate: { type: string, format: date }
        qualityState: { $ref: '#/components/schemas/QualityState' }
        workState: { $ref: '#/components/schemas/WorkState' }
        qty: { type: integer }
        reservedQty: { type: integer, description: '비움 — 예약은 LOT 단위라 위치 줄에 나누지 않는다. 위치 몫은 allocatedQty' }
        allocatedQty: { type: integer, description: '(0.11.0) NORMAL·STORED 줄만 — 이 위치·LOT 에 피킹 배정된 남은 양(확정 조각)' }
        heldQty: { type: integer, description: '(0.11.0) NORMAL·STORED 줄만 — 조사 보류(결품 조사·실사) 양' }
        pickableQty: { type: integer, description: '(0.11.1, 0.11.0 의 availableQty 를 이름만 바꿈) NORMAL·STORED 줄만 — 이 칸에서 아직 어느 주문에도 배정되지 않아 집을 수 있는 양 = qty − heldQty − allocatedQty (0 미만이면 0). **판매 가능량이 아니다** — 위치 배정 전 예약(LOT 단위)을 빼지 않으므로 상품 판매 가능량은 /internal/availability(A = E − R)로 본다' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
    Commit:
      type: object
      properties:
        commitId: { type: string }
        requestId: { type: string }
        commitType: { type: string, enum: [RESERVE, CONFIRM, RELEASE, EXPIRE, TIN, TASK_EXECUTION, HANDOVER, QUALITY, ADJUSTMENT, CORRECTION], description: 'EXPIRE = 예약 TTL 만료 작업의 R−q, CORRECTION = LOT·위치 정정(H 증감 0)' }
        mfcId: { type: string }
        sourceSystem: { type: string }
        sourceRef: { type: string, description: receiptId / packageId / taskId / approvalRef }
        appliedQty: { type: integer }
        occurredAt: { type: string, format: date-time }
        entries:
          type: array
          description: LedgerEntry 목록 (한 사건의 복수 수량 변화)
          items:
            type: object
            properties:
              sku: { type: string }
              lotId: { type: [string, 'null'] }
              locationCode: { type: [string, 'null'], description: 요약 수준 기록(R)은 null }
              qualityState: { type: [string, 'null'] }
              workState: { type: [string, 'null'] }
              symbol: { type: string, enum: [H, Q, E, R, V] }
              delta: { type: integer }
              balanceVersion: { type: integer }
    StockCorrectionRequest:
      type: object
      required: [reason, approvalRef, lines]
      properties:
        reason: { type: string, maxLength: 500 }
        approvalRef: { type: string, maxLength: 128 }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [sku, lotId, fromLocation, qualityState, workState, qty]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              fromLocation: { type: string }
              qualityState: { $ref: '#/components/schemas/QualityState' }
              workState: { $ref: '#/components/schemas/WorkState' }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
              toLocation: { type: string }
              toSourceLotRef: { type: string, maxLength: 128 }
              toExpiryDate: { type: string, format: date }
              toManufactureDate: { type: string, format: date, description: '정정 대상 LOT 의 제조일(0.4.0, ADR-0041). toSourceLotRef·toExpiryDate·toManufactureDate 중 하나라도 있으면 그 추적 LOT 으로 옮긴다' }
    CenterStock:
      type: object
      required: [mfcId, sku, lots, units]
      properties:
        mfcId: { type: string }
        sku: { type: string }
        lots:
          type: array
          items:
            type: object
            properties:
              lotId: { type: string }
              tracking: { type: string, enum: [TRACKED, UNTRACKED] }
              expiryDate: { type: [string, 'null'], format: date }
              manufactureDate: { type: [string, 'null'], format: date, description: 제조일(0.4.0). 모르면 null }
              onHand: { type: integer }
              quarantined: { type: integer }
              sellable: { type: integer }
              reserved: { type: integer }
              available: { type: integer }
        units:
          type: array
          items:
            type: object
            properties:
              locationCode: { type: string }
              lotId: { type: string }
              qualityState: { $ref: '#/components/schemas/QualityState' }
              workState: { $ref: '#/components/schemas/WorkState' }
              qty: { type: integer }
    SkuHandling:
      type: object
      required: [sku, handlingEnabled, version]
      properties:
        sku: { type: string }
        handlingEnabled: { type: boolean, description: 레코드가 없으면 false }
        version: { type: integer, description: 취급 레코드 version (레코드 없음 = 0) }
        skuState: { type: string, enum: [ACTIVE, INACTIVE] }
        productId: { type: [string, 'null'] }
        changedBy: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
    SkuHandlingPage:
      type: object
      properties:
        centerId: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/SkuHandling' } }
        page: { $ref: '_common.yaml#/components/schemas/Page' }
    SkuHandlingChange:
      type: object
      required: [sku, enabled]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        enabled: { type: boolean }
        reason: { type: string, maxLength: 500 }
    SkuHandlingResult:
      type: object
      required: [status, requestId, occurredAt, handling]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        changed: { type: boolean, description: false 면 이미 같은 값이라 바뀐 것이 없음 }
        occurredAt: { type: string, format: date-time }
        handling: { $ref: '#/components/schemas/SkuHandling' }
    SkuHandlingBatchRequest:
      type: object
      required: [items]
      properties:
        reason: { type: string, maxLength: 500, description: 행에 reason 이 없을 때 쓰는 공통 사유 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/SkuHandlingBatchItem' }
    SkuHandlingBatchItem:
      type: object
      required: [sku, enabled]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        enabled: { type: boolean }
        reason: { type: string, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 0, description: 행별 낙관적 잠금(선택) }
    SkuHandlingBatchResult:
      type: object
      required: [status, requestId, occurredAt, items]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        changedCount: { type: integer }
        occurredAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/SkuHandling' } }
    SkuProjection:
      type: object
      required: [sku, state, productVersion]
      properties:
        sku: { type: string }
        productId: { type: [string, 'null'] }
        baseProductId: { type: [string, 'null'] }
        unitType: { type: [string, 'null'] }
        unitsPerSku: { type: [integer, 'null'] }
        weightG: { type: [integer, 'null'] }
        volumeMl: { type: [integer, 'null'] }
        storageType: { type: [string, 'null'], description: AMBIENT / CHILLED / FROZEN }
        alcohol: { type: [boolean, 'null'] }
        shelfMinRemainingDays: { type: [integer, 'null'], description: '상품별 소비기한 보장 — 주문일 기준 최소 잔여일(ADR-0041). null 이면 보장 문구 없음(보관 유형 기본값을 쓴다)' }
        shelfMaxDaysSinceManufacture: { type: [integer, 'null'], description: '상품별 소비기한 보장 — 주문일 기준 제조 후 최대 경과일(ADR-0041). null 이면 보장 없음' }
        productName: { type: [string, 'null'], description: '(0.15.0) 상품 관리용 명칭(ProductVersionPublished.internalName). 이 필드 추가 전에 받은 상품은 다음 상품 버전 발행까지 null' }
        barcodes: { type: array, items: { type: string }, description: '(0.15.0) 활성 바코드(선행 0 보존). 모르면 빈 배열' }
        state: { type: string, enum: [ACTIVE, INACTIVE] }
        productVersion: { type: integer, description: 마지막으로 반영한 상품 버전(이보다 오래된 이벤트는 무시) }
        updatedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
